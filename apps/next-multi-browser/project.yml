name: NextMultiBrowser
options:
  bundleIdPrefix: com.nextsolution
  deploymentTarget:
    iOS: '15.0'
packages:
  TunnelKit:
    path: Vendor/TunnelKit
targets:
  NextMultiBrowser:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Next Multi Browser
        CFBundleShortVersionString: '1.1.6'
        CFBundleVersion: '14'
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsInWebContent: true
        NSCameraUsageDescription: Allow websites you choose to use the camera.
        NSMicrophoneUsageDescription: Allow websites you choose to use the microphone.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nextsolution.multibrowser
        PRODUCT_NAME: Next Multi Browser
        MARKETING_VERSION: 1.1.6
        CURRENT_PROJECT_VERSION: 14
        SWIFT_OBJC_BRIDGING_HEADER: Sources/NextMultiBrowser-Bridging-Header.h
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: App.entitlements
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: NextMultiBrowserVPN
        embed: true
      - package: TunnelKit
        product: TunnelKit
      - package: TunnelKit
        product: TunnelKitOpenVPN

  NextMultiBrowserVPN:
    type: app-extension
    platform: iOS
    sources:
      - VPNExtension
    info:
      path: VPNExtension/Info.plist
      properties:
        CFBundleDisplayName: Next Multi Browser VPN
        CFBundleShortVersionString: '1.1.6'
        CFBundleVersion: '14'
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nextsolution.multibrowser.vpn
        PRODUCT_NAME: NextMultiBrowserVPN
        MARKETING_VERSION: 1.1.6
        CURRENT_PROJECT_VERSION: 14
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: '1,2'
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: VPNExtension/VPN.entitlements
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: TunnelKit
        product: TunnelKitOpenVPNAppExtension

  NextMultiBrowserTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: '17.0'
    sources:
      - Tests
      - Sources/BrowserProfileEnvironment.swift
      - Sources/BrowserProfileMaintenance.swift
      - Sources/BrowserProfileStore.swift
      - Sources/BrowserMediaPlayback.swift
      - Sources/BrowserCredentialAutofill.swift
      - Sources/BrowserURLQueue.swift
      - Sources/NMBPersistentWebsiteDataStore.h
      - Sources/NMBPersistentWebsiteDataStore.m
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nextsolution.multibrowser.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.0
        CODE_SIGN_STYLE: Automatic
        SWIFT_OBJC_BRIDGING_HEADER: Sources/NextMultiBrowser-Bridging-Header.h

schemes:
  NextMultiBrowser:
    build:
      targets:
        NextMultiBrowser: all
    test:
      targets:
        - NextMultiBrowserTests
  NextMultiBrowserProfileTests:
    build:
      targets:
        NextMultiBrowserTests: all
    test:
      targets:
        - NextMultiBrowserTests
