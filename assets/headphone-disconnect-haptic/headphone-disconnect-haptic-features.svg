<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="t d"><title id="t">Headphone disconnect route concept</title><desc id="d">Concept diagram showing a personal audio route becoming unavailable and the iPhone generating one warning haptic.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#20294a"/></linearGradient></defs><rect width="960" height="600" rx="36" fill="url(#g)"/><text x="60" y="78" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial" font-size="23" fill="#8fdfff">HOW THE ALERT WORKS</text><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial"><rect x="60" y="130" width="250" height="150" rx="24" fill="#fff" opacity=".08" stroke="#6a8cff"/><text x="185" y="190" text-anchor="middle" font-size="27" font-weight="700" fill="#fff">Personal audio</text><text x="185" y="230" text-anchor="middle" font-size="19" fill="#bdc9e8">Headphones / Bluetooth</text><rect x="355" y="130" width="250" height="150" rx="24" fill="#fff" opacity=".08" stroke="#ffb347"/><text x="480" y="190" text-anchor="middle" font-size="27" font-weight="700" fill="#fff">Disconnect</text><text x="480" y="230" text-anchor="middle" font-size="19" fill="#bdc9e8">Old route unavailable</text><rect x="650" y="130" width="250" height="150" rx="24" fill="#fff" opacity=".08" stroke="#00d2ff"/><text x="775" y="190" text-anchor="middle" font-size="27" font-weight="700" fill="#fff">One haptic</text><text x="775" y="230" text-anchor="middle" font-size="19" fill="#bdc9e8">Warning confirmation</text><path d="M310 205h45M605 205h45" stroke="#8fdfff" stroke-width="7" stroke-linecap="round"/><path d="M342 190l18 15-18 15M637 190l18 15-18 15" fill="none" stroke="#8fdfff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="115" y="350" width="730" height="130" rx="24" fill="#6a11cb" opacity=".23"/><text x="480" y="402" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">No alert when audio stays on another personal route</text><text x="480" y="442" text-anchor="middle" font-size="19" fill="#cbd7f4">Designed to reject route changes that are not a real headphone disconnect.</text><text x="480" y="552" text-anchor="middle" font-size="18" fill="#8c9abc">Concept artwork • Next Solution</text></g></svg>