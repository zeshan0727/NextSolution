<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" role="img" aria-labelledby="t d"><title id="t">Headphone Disconnect Haptic Settings concept</title><desc id="d">Concept representation of the simple Settings pane with one enable switch.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6a11cb"/><stop offset="1" stop-color="#2575fc"/></linearGradient></defs><rect width="720" height="720" rx="42" fill="#0d111b"/><rect x="70" y="70" width="580" height="580" rx="42" fill="#171c29" stroke="#30394f"/><text x="360" y="145" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial" font-size="30" font-weight="700" fill="#fff">Headphone Disconnect Haptic</text><text x="110" y="230" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial" font-size="18" fill="#8fa0bf">ALERT</text><rect x="105" y="255" width="510" height="92" rx="20" fill="#222a3b"/><text x="135" y="310" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial" font-size="24" fill="#fff">Enable Disconnect Alert</text><rect x="522" y="278" width="66" height="38" rx="19" fill="url(#g)"/><circle cx="569" cy="297" r="15" fill="#fff"/><text x="105" y="395" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial" font-size="20" fill="#aab6ce">A single user-facing control.</text><text x="105" y="430" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial" font-size="20" fill="#aab6ce">No diagnostics or test buttons in the release pane.</text><rect x="105" y="500" width="510" height="86" rx="20" fill="#6a11cb" opacity=".18"/><text x="360" y="545" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial" font-size="19" fill="#d8e3fa">Concept artwork — final pane uses native iOS Settings UI</text></svg>