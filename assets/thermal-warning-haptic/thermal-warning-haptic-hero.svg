<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Thermal Warning Haptic concept</title><desc id="desc">Concept artwork showing an iPhone thermal state moving from fair to serious with a haptic pulse.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080d1d"/><stop offset=".55" stop-color="#142c61"/><stop offset="1" stop-color="#4d1e72"/></linearGradient><linearGradient id="hot" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff9f0a"/><stop offset="1" stop-color="#ff453a"/></linearGradient></defs>
<rect width="1600" height="900" rx="56" fill="url(#bg)"/><circle cx="1320" cy="120" r="250" fill="#7c3aed" opacity=".2"/><circle cx="220" cy="760" r="300" fill="#168dff" opacity=".18"/>
<g transform="translate(210 105)"><rect x="0" y="0" width="460" height="690" rx="78" fill="#050815" stroke="#7088c6" stroke-width="8"/><rect x="24" y="28" width="412" height="634" rx="60" fill="#101a33"/><rect x="170" y="48" width="120" height="30" rx="15" fill="#050815"/><text x="230" y="188" text-anchor="middle" fill="#b7c6e8" font-family="-apple-system,Arial" font-size="32">Thermal State</text><text x="230" y="290" text-anchor="middle" fill="#fff" font-family="-apple-system,Arial" font-weight="800" font-size="68">SERIOUS</text><rect x="90" y="350" width="280" height="28" rx="14" fill="#24324f"/><rect x="90" y="350" width="226" height="28" rx="14" fill="url(#hot)"/><path d="M125 485h55l28-42 44 85 42-62 30 19h54" fill="none" stroke="#ff9f0a" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><text x="230" y="585" text-anchor="middle" fill="#9fb2da" font-family="-apple-system,Arial" font-size="27">One warning haptic</text></g>
<g transform="translate(800 218)" font-family="-apple-system,Arial"><text x="0" y="0" fill="#fff" font-size="72" font-weight="900">Feel the heat warning.</text><text x="0" y="92" fill="#c3d1ec" font-size="35">A single haptic when iOS newly enters</text><text x="0" y="140" fill="#c3d1ec" font-size="35">a serious or critical thermal state.</text><g transform="translate(0 225)"><rect width="570" height="96" rx="30" fill="#ffffff" opacity=".08" stroke="#ffffff" stroke-opacity=".18"/><circle cx="58" cy="48" r="22" fill="#34c759"/><text x="105" y="59" fill="#fff" font-size="31" font-weight="700">Nominal / Fair</text></g><path d="M285 342v72" stroke="#b8caed" stroke-width="8" stroke-linecap="round"/><path d="M265 395l20 22 20-22" fill="none" stroke="#b8caed" stroke-width="8" stroke-linecap="round"/><g transform="translate(0 435)"><rect width="570" height="110" rx="30" fill="#ff453a" opacity=".16" stroke="#ff776f" stroke-opacity=".55"/><circle cx="58" cy="55" r="22" fill="#ff453a"/><text x="105" y="66" fill="#fff" font-size="31" font-weight="800">Serious / Critical → Haptic</text></g><text x="0" y="640" fill="#8296c0" font-size="24">Concept artwork • actual Settings UI may differ</text></g></svg>