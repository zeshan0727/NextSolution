<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Thermal Warning Haptic Settings concept</title><desc id="desc">Concept Settings pane with one enable switch.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070b17"/><stop offset="1" stop-color="#24134a"/></linearGradient></defs><rect width="1200" height="760" rx="48" fill="url(#g)"/><rect x="260" y="85" width="680" height="590" rx="48" fill="#111827" stroke="#33466d" stroke-width="4"/><text x="600" y="165" text-anchor="middle" fill="#fff" font-family="-apple-system,Arial" font-size="42" font-weight="800">Thermal Warning Haptic</text><rect x="320" y="235" width="560" height="120" rx="28" fill="#1d2a43"/><text x="365" y="307" fill="#fff" font-family="-apple-system,Arial" font-size="31" font-weight="650">Enable Thermal Alert</text><rect x="765" y="268" width="82" height="48" rx="24" fill="#34c759"/><circle cx="823" cy="292" r="19" fill="#fff"/><text x="600" y="435" text-anchor="middle" fill="#9fb0d1" font-family="-apple-system,Arial" font-size="27">One switch. No diagnostics.</text><text x="600" y="485" text-anchor="middle" fill="#9fb0d1" font-family="-apple-system,Arial" font-size="27">Disable anytime without uninstalling.</text><text x="600" y="625" text-anchor="middle" fill="#7284a8" font-family="-apple-system,Arial" font-size="22">Concept artwork • actual Settings presentation may differ</text></svg>