<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Next Home Lock 1.0.5 simple Settings concept</title>
  <desc id="desc">A concept preview of the Next Home Lock Settings pane containing only one enable switch.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#281052"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#168dff"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="24" stdDeviation="25" flood-color="#000" flood-opacity=".42"/></filter>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <circle cx="1060" cy="80" r="250" fill="#168dff" opacity=".15"/>
  <circle cx="130" cy="700" r="270" fill="#7c3aed" opacity=".18"/>

  <g transform="translate(185 80)" filter="url(#shadow)">
    <rect width="830" height="600" rx="46" fill="#eef0f5"/>
    <rect width="830" height="92" rx="46" fill="#f7f8fb"/>
    <rect y="46" width="830" height="46" fill="#f7f8fb"/>
    <path d="M58 46l-18 18 18 18" fill="none" stroke="#168dff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="415" y="60" text-anchor="middle" fill="#111827" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="30" font-weight="800">Next Home Lock</text>

    <text x="54" y="158" fill="#777d8a" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" font-weight="700" letter-spacing="1.4">NEXT HOME LOCK</text>
    <rect x="36" y="180" width="758" height="112" rx="26" fill="#fff" stroke="#d9dce4"/>
    <text x="66" y="248" fill="#10131a" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="31" font-weight="650">Enable Next Home Lock</text>
    <rect x="660" y="211" width="96" height="56" rx="28" fill="#34c759"/>
    <circle cx="728" cy="239" r="24" fill="#fff"/>

    <text x="54" y="340" fill="#777d8a" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" font-weight="700" letter-spacing="1.4">HOW IT WORKS</text>
    <rect x="36" y="362" width="758" height="150" rx="26" fill="#fff" stroke="#d9dce4"/>
    <circle cx="92" cy="416" r="24" fill="url(#accent)"/>
    <text x="92" y="424" text-anchor="middle" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" font-weight="900">2×</text>
    <text x="134" y="420" fill="#10131a" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="27" font-weight="700">Double-tap empty Home Screen space</text>
    <text x="66" y="472" fill="#727785" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="23">Turn the switch off whenever you want to disable the gesture.</text>

    <text x="415" y="566" text-anchor="middle" fill="#777d8a" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="19">Version 1.0.5 · Simple settings · No diagnostic rows</text>
  </g>

  <text x="1120" y="720" text-anchor="end" fill="#ffffff99" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18">Concept artwork · Next Solution</text>
</svg>
