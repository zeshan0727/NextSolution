<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Charge 80 Haptic Settings concept</title><desc id="d">Concept Settings pane with one Enable 80 Percent Alert switch.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#168dff"/></linearGradient></defs><rect width="1200" height="760" fill="#07111f"/><rect x="150" y="75" width="900" height="610" rx="54" fill="#111c31" stroke="#ffffff" stroke-opacity=".12"/><text x="220" y="165" fill="#f7f9ff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="42" font-weight="800">Charge 80 Haptic</text><text x="220" y="220" fill="#aebbd3" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="25">One focused control. No diagnostics.</text><rect x="210" y="300" width="780" height="150" rx="30" fill="#182641"/><text x="250" y="365" fill="#f7f9ff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="31" font-weight="700">Enable 80% Alert</text><text x="250" y="410" fill="#aebbd3" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="21">Haptic once when charging crosses 80%</text><rect x="850" y="342" width="100" height="58" rx="29" fill="url(#g)"/><circle cx="920" cy="371" r="24" fill="white"/><text x="600" y="550" text-anchor="middle" fill="#8fdfff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="24" font-weight="700">Concept artwork — actual Settings appearance may vary slightly</text></svg>