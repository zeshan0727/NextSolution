<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">LSLyrics 2.0</title>
  <desc id="desc">Concept artwork for LSLyrics, a lock screen package</desc>
  <defs>
    <linearGradient id="background" x1="80" y1="55" x2="1510" y2="845" gradientUnits="userSpaceOnUse"><stop stop-color="#2E1065"/><stop offset="1" stop-color="#d86c36"/></linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1280 130) rotate(132) scale(680 560)" gradientUnits="userSpaceOnUse"><stop stop-color="#F0ABFC" stop-opacity=".7"/><stop offset="1" stop-color="#F0ABFC" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#000000" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1600" height="900" rx="56" fill="url(#background)"/>
  <rect width="1600" height="900" rx="56" fill="url(#glow)"/>
  <circle cx="1440" cy="760" r="215" fill="#FFFFFF" fill-opacity=".05"/>
  <g>
    <rect x="112" y="104" width="276" height="46" rx="23" fill="#FFFFFF" fill-opacity=".12" stroke="#FFFFFF" stroke-opacity=".18"/>
    <text x="250" y="135" text-anchor="middle" fill="#F0ABFC" font-family="Arial, sans-serif" font-size="19" font-weight="800" letter-spacing="2">LOCK SCREEN</text>
    <text x="112" y="226" fill="#FFFFFF" fill-opacity=".68" font-family="Arial, sans-serif" font-size="25" font-weight="700">VERSION 2.0</text>
    <text x="112" y="335" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="68" font-weight="800">LSLyrics</text>
    <text x="116" y="650" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="23">Displays music lyrics on the Lock Screen.</text>
    <g transform="translate(112 760)">
      <rect width="50" height="50" rx="14" fill="#FFFFFF"/>
      <path d="M13 37V13l19 24V13" fill="none" stroke="#d86c36" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="m32 13 9 12-9 12" fill="none" stroke="#2E1065" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="70" y="34" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="24" font-weight="800">NEXT JAILBREAK</text>
    </g>
  </g>
  <g filter="url(#shadow)">
    <rect x="798" y="118" width="380" height="664" rx="70" fill="#070A10"/>
    <rect x="817" y="137" width="342" height="626" rx="54" fill="#0F172A"/>
    <rect x="923" y="152" width="130" height="28" rx="14" fill="#04060A"/>
    <text x="982" y="244" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="42" font-weight="800">9:41</text>
          <rect x="862" y="308" width="240" height="238" rx="34" fill="#FFFFFF" fill-opacity=".12"/>
          <circle cx="982" cy="369" r="34" fill="#FFFFFF" fill-opacity=".25"/>
          <path d="M910 440h144M926 476h112M944 512h76" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" opacity=".78"/>
