<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="t d"><title id="t">Wi-Fi path transition concept</title><desc id="d">A simple diagram showing Wi-Fi active, path change, cellular active, and one warning haptic.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6a11cb"/><stop offset="1" stop-color="#2575fc"/></linearGradient></defs><rect width="1400" height="760" rx="42" fill="#0b1220"/><text x="700" y="92" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="46" font-weight="800" fill="#fff">What triggers the alert</text><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><rect x="95" y="230" width="350" height="300" rx="38" fill="#15233c" stroke="#39d98a" stroke-width="4"/><text x="270" y="320" text-anchor="middle" font-size="40" font-weight="800" fill="#fff">Wi-Fi active</text><text x="270" y="385" text-anchor="middle" font-size="28" fill="#b8c7df">Satisfied path</text><text x="270" y="430" text-anchor="middle" font-size="28" fill="#b8c7df">uses Wi-Fi</text><path d="M465 380 H625" stroke="#fff" stroke-width="12" stroke-linecap="round"/><path d="M595 350 l40 30-40 30" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><rect x="645" y="230" width="350" height="300" rx="38" fill="url(#g)"/><text x="820" y="320" text-anchor="middle" font-size="40" font-weight="800" fill="#fff">Path leaves Wi-Fi</text><text x="820" y="385" text-anchor="middle" font-size="28" fill="#eef3ff">State transition</text><text x="820" y="430" text-anchor="middle" font-size="28" fill="#eef3ff">accepted once</text><path d="M1015 380 H1175" stroke="#fff" stroke-width="12" stroke-linecap="round"/><path d="M1145 350 l40 30-40 30" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><rect x="1190" y="230" width="150" height="300" rx="38" fill="#2a1d16" stroke="#ffb020" stroke-width="4"/><text x="1265" y="335" text-anchor="middle" font-size="58" fill="#ffcc00">!</text><text x="1265" y="420" text-anchor="middle" font-size="25" font-weight="800" fill="#fff">Warning</text><text x="1265" y="460" text-anchor="middle" font-size="25" font-weight="800" fill="#fff">haptic</text><text x="700" y="650" text-anchor="middle" font-size="26" fill="#aebdd4">Startup, Wi-Fi joins, disabled state and repeated non-Wi-Fi updates do not alert.</text></g></svg>