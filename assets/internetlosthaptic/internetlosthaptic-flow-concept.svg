<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="t d"><title id="t">Internet Lost Haptic runtime decision flow</title><desc id="d">Concept diagram showing the tweak alerting only for a satisfied to unsatisfied network path transition.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6a11cb"/><stop offset="1" stop-color="#2575fc"/></linearGradient></defs><rect width="1400" height="760" rx="36" fill="#0d1325"/><text x="700" y="86" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="46" font-weight="800" text-anchor="middle">Critical runtime path</text><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="middle"><rect x="70" y="250" width="300" height="190" rx="34" fill="url(#g)"/><text x="220" y="325" fill="#fff" font-size="27" font-weight="700">Previous path</text><text x="220" y="380" fill="#fff" font-size="34" font-weight="850">Satisfied</text><rect x="550" y="250" width="300" height="190" rx="34" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".22"/><text x="700" y="325" fill="#fff" font-size="27" font-weight="700">New path</text><text x="700" y="380" fill="#ffcf67" font-size="34" font-weight="850">Unsatisfied</text><rect x="1030" y="250" width="300" height="190" rx="34" fill="#2a9d67"/><text x="1180" y="325" fill="#fff" font-size="27" font-weight="700">Action</text><text x="1180" y="380" fill="#fff" font-size="34" font-weight="850">Warning haptic</text><path d="M390 345h130" stroke="#8eb7ff" stroke-width="12" stroke-linecap="round"/><path d="M820 345h180" stroke="#8eb7ff" stroke-width="12" stroke-linecap="round"/><path d="M500 318l40 27-40 27M980 318l40 27-40 27" fill="none" stroke="#8eb7ff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><text x="700" y="560" fill="#fff" font-size="26">Wi‑Fi → cellular remains satisfied, so it is rejected.</text><text x="700" y="610" fill="#fff" font-size="26">Startup, duplicate loss, requires-connection and disabled states are also rejected.</text><text x="700" y="682" fill="#9fb0d0" font-size="22">Conceptual diagram — no traffic, credentials or user content are inspected.</text></g></svg>