<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">PhoneAura 0.4.15 concept hero</title>
  <desc id="desc">A purple and blue Next Solution themed showcase of the PhoneAura redesigned iOS Phone app.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.48" stop-color="#11113a"/>
      <stop offset="1" stop-color="#230a41"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b2cff"/>
      <stop offset="1" stop-color="#168dff"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4d63"/>
      <stop offset="1" stop-color="#ff8b19"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity=".48"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="210" cy="170" r="230" fill="#168dff" opacity=".18" filter="url(#glow)"/>
  <circle cx="1360" cy="720" r="300" fill="#9b32ff" opacity=".18" filter="url(#glow)"/>
  <path d="M0 760 C300 610 470 900 820 710 C1120 550 1300 660 1600 510 V900 H0 Z" fill="#6c2cff" opacity=".08"/>

  <g transform="translate(110 108)">
    <rect x="0" y="0" width="172" height="54" rx="27" fill="#ffffff" opacity=".1" stroke="#ffffff" stroke-opacity=".18"/>
    <circle cx="29" cy="27" r="17" fill="url(#brand)"/>
    <path d="M20 30 L28 22 L36 30 L28 38 Z" fill="#fff"/>
    <text x="56" y="34" fill="#fff" font-size="21" font-family="Arial, sans-serif" font-weight="700">NEXT SOLUTION</text>
  </g>

  <g transform="translate(110 232)">
    <text x="0" y="0" fill="#fff" font-size="92" font-family="Arial, sans-serif" font-weight="800" letter-spacing="-3">PhoneAura</text>
    <text x="2" y="66" fill="#a9b9df" font-size="32" font-family="Arial, sans-serif" font-weight="600">The modern Phone app redesign for jailbroken iOS 16</text>
    <g transform="translate(0 110)">
      <rect width="190" height="48" rx="24" fill="#6f3cff" opacity=".24" stroke="#a77cff" stroke-opacity=".65"/>
      <text x="95" y="31" fill="#d9ceff" text-anchor="middle" font-size="20" font-family="Arial, sans-serif" font-weight="700">VERSION 0.4.15</text>
      <rect x="206" width="220" height="48" rx="24" fill="#168dff" opacity=".2" stroke="#66b8ff" stroke-opacity=".6"/>
      <text x="316" y="31" fill="#d7efff" text-anchor="middle" font-size="20" font-family="Arial, sans-serif" font-weight="700">ROOTHIDE + ROOTLESS</text>
    </g>

    <g transform="translate(0 200)" font-family="Arial, sans-serif">
      <g>
        <rect width="465" height="82" rx="22" fill="#ffffff" opacity=".075" stroke="#ffffff" stroke-opacity=".12"/>
        <circle cx="43" cy="41" r="24" fill="#7b2cff"/>
        <path d="M32 41 h22 M43 30 v22" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
        <text x="84" y="34" fill="#fff" font-size="23" font-weight="700">Full Phone app redesign</text>
        <text x="84" y="59" fill="#9fb0d2" font-size="17">Favorites, Recents, Contacts and Keypad</text>
      </g>
      <g transform="translate(0 98)">
        <rect width="465" height="82" rx="22" fill="#ffffff" opacity=".075" stroke="#ffffff" stroke-opacity=".12"/>
        <circle cx="43" cy="41" r="24" fill="#168dff"/>
        <path d="M31 41 h24 M43 29 v24" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
        <text x="84" y="34" fill="#fff" font-size="23" font-weight="700">Stable smart keypad</text>
        <text x="84" y="59" fill="#9fb0d2" font-size="17">Saved-number suggestions never move the digits</text>
      </g>
      <g transform="translate(0 196)">
        <rect width="465" height="82" rx="22" fill="#ffffff" opacity=".075" stroke="#ffffff" stroke-opacity=".12"/>
        <circle cx="43" cy="41" r="24" fill="#ff6b43"/>
        <path d="M32 37 h22 M32 45 h15" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
        <text x="84" y="34" fill="#fff" font-size="23" font-weight="700">Native number edit menu</text>
        <text x="84" y="59" fill="#9fb0d2" font-size="17">Long press for Cut, Copy and Paste</text>
      </g>
    </g>
  </g>

  <g transform="translate(970 70)" filter="url(#shadow)">
    <rect x="0" y="0" width="420" height="780" rx="76" fill="#05060b" stroke="#42475f" stroke-width="4"/>
    <rect x="17" y="17" width="386" height="746" rx="62" fill="#05091a"/>
    <rect x="145" y="28" width="130" height="34" rx="17" fill="#000"/>
    <text x="42" y="120" fill="#fff" font-size="42" font-family="Arial, sans-serif" font-weight="800">Keypad</text>
    <circle cx="350" cy="104" r="29" fill="url(#brand)" stroke="#fff" stroke-opacity=".4"/>
    <path d="M340 108 L349 98 L359 108 L349 118 Z" fill="#fff"/>

    <rect x="38" y="152" width="344" height="104" rx="27" fill="url(#orange)"/>
    <text x="210" y="199" fill="#fff" font-size="31" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800">+974 5550 0727</text>
    <text x="210" y="230" fill="#fff" opacity=".86" font-size="17" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700">Number Options •••</text>

    <rect x="38" y="270" width="344" height="78" rx="23" fill="#131d39" stroke="#6d7896" stroke-opacity=".35"/>
    <text x="210" y="305" fill="#fff" font-size="19" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700">Saved contact suggestion</text>
    <text x="210" y="331" fill="#9eb0d1" font-size="15" text-anchor="middle" font-family="Arial, sans-serif">Fixed space — keypad never shifts</text>

    <g transform="translate(48 378)" font-family="Arial, sans-serif" text-anchor="middle">
      <g fill="#1b2543" stroke="#667391" stroke-opacity=".28">
        <rect x="0" y="0" width="94" height="72" rx="21"/><rect x="116" y="0" width="94" height="72" rx="21"/><rect x="232" y="0" width="94" height="72" rx="21"/>
        <rect x="0" y="88" width="94" height="72" rx="21"/><rect x="116" y="88" width="94" height="72" rx="21"/><rect x="232" y="88" width="94" height="72" rx="21"/>
        <rect x="0" y="176" width="94" height="72" rx="21"/><rect x="116" y="176" width="94" height="72" rx="21"/><rect x="232" y="176" width="94" height="72" rx="21"/>
        <rect x="0" y="264" width="94" height="72" rx="21"/><rect x="116" y="264" width="94" height="72" rx="21"/><rect x="232" y="264" width="94" height="72" rx="21"/>
      </g>
      <g fill="#fff" font-size="30" font-weight="700">
        <text x="47" y="45">1</text><text x="163" y="45">2</text><text x="279" y="45">3</text>
        <text x="47" y="133">4</text><text x="163" y="133">5</text><text x="279" y="133">6</text>
        <text x="47" y="221">7</text><text x="163" y="221">8</text><text x="279" y="221">9</text>
        <text x="47" y="309">*</text><text x="163" y="309">0</text><text x="279" y="309">#</text>
      </g>
    </g>

    <rect x="164" y="727" width="92" height="16" rx="8" fill="#fff" opacity=".82"/>
  </g>

  <text x="110" y="846" fill="#8495ba" font-size="18" font-family="Arial, sans-serif">Concept preview • Actual appearance can vary slightly by device and settings</text>
</svg>
