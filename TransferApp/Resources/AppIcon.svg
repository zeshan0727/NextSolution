<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121e38"/>
      <stop offset="0.55" stop-color="#071120"/>
      <stop offset="1" stop-color="#030914"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5438f2"/>
      <stop offset="0.42" stop-color="#1597ff"/>
      <stop offset="1" stop-color="#19e6ff"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9b4dff"/>
      <stop offset="0.5" stop-color="#6637ef"/>
      <stop offset="1" stop-color="#3d22c8"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8aff"/>
      <stop offset="1" stop-color="#c754ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#2b78ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2b78ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22" result="blur"/>
      <feOffset dy="20" result="off"/>
      <feColorMatrix in="off" type="matrix" values="0 0 0 0 0.03 0 0 0 0 0.01 0 0 0 0 0.15 0 0 0 .65 0" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="13" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect x="28" y="28" width="968" height="968" rx="200" fill="none" stroke="#4f7bd9" stroke-opacity="0.24" stroke-width="7"/>
  <circle cx="512" cy="450" r="410" fill="url(#glow)"/>

  <!-- cloud -->
  <path d="M292 631c-83 0-150-67-150-150 0-75 55-137 127-148 20-122 126-215 254-215 126 0 232 90 255 210 79 6 141 72 141 153 0 85-69 154-154 154H292z"
        fill="none" stroke="url(#cloud)" stroke-width="54" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>
  <path d="M292 631c-83 0-150-67-150-150 0-75 55-137 127-148 20-122 126-215 254-215 126 0 232 90 255 210 79 6 141 72 141 153 0 85-69 154-154 154H292z"
        fill="none" stroke="url(#cloud)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- upload tile -->
  <g filter="url(#shadow)">
    <path d="M324 412c0-52 42-94 94-94h145c28 0 55 12 74 34l51 58c13 15 32 23 52 23h30c52 0 94 42 94 94v247c0 66-54 120-120 120H444c-66 0-120-54-120-120V412z" fill="url(#tile)" stroke="#d77cff" stroke-width="9"/>
    <path d="M343 439c0-45 36-81 81-81h132c25 0 49 11 65 30l43 49c17 20 42 31 68 31h26c37 0 68 30 68 68v28c-128-47-327-42-483 5V439z" fill="#ffffff" opacity="0.08"/>
  </g>

  <!-- arrow -->
  <g filter="url(#softGlow)" fill="url(#arrow)">
    <rect x="476" y="552" width="72" height="207" rx="36"/>
    <path d="M486 530L403 613c-16 16-16 42 0 58 16 16 42 16 58 0l51-51 51 51c16 16 42 16 58 0 16-16 16-42 0-58l-83-83c-14-14-37-14-52 0z"/>
  </g>
  <path d="M511 558v175" stroke="#ffffff" stroke-opacity="0.18" stroke-width="8" stroke-linecap="round"/>

  <!-- subtle shine -->
  <path d="M193 205c168-139 443-184 648-72" fill="none" stroke="#ffffff" stroke-opacity="0.055" stroke-width="22" stroke-linecap="round"/>
</svg>
