name: NextPDF
options:
  bundleIdPrefix: app.nextsolution
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.9
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    TARGETED_DEVICE_FAMILY: "1"
targets:
  NextPDF:
    type: application
    platform: iOS
    sources:
      - path: AcademyBuild/iOS/AcademySMSLab
        excludes:
          - Resources
          - Info.plist
      - path: AcademyBuild/Sources/LabCore
    resources:
      - path: AcademyBuild/iOS/AcademySMSLab/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nextsolution.AcademySMSLab
        INFOPLIST_FILE: AcademyBuild/iOS/AcademySMSLab/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
    scheme:
      testTargets: []
