name: NextPDF
options:
  bundleIdPrefix: com.nextsolution
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.nextsolution.nextpdf
    SWIFT_VERSION: 5.9
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: 1.2.1
    CURRENT_PROJECT_VERSION: 78
targets:
  NextPDF:
    type: application
    platform: iOS
    sources:
      - NextPDF
    settings:
      base:
        INFOPLIST_FILE: NextPDF/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
    scheme:
      testTargets: []
