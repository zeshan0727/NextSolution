name: Dispatch Next Home Torch Tutorial Draft

on:
  pull_request:
    branches: [main]
    paths:
      - "DailyTweaks/2026-07-31-NextHomeTorch/TUTORIAL_TRIGGER"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Fix and dispatch tutorial preparation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run fix-and-dispatch-nht-tutorial.yml --repo zeshan0727/NextSolution --ref main
