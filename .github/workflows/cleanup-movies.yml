name: One-time movie cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-movies.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove movie section and records
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import shutil

          root = Path('.')

          # Remove the generated movie directory and any similarly named movie-only folders.
          for folder_name in ('movies', 'movie-pages', 'movie-posters'):
              folder = root / folder_name
              if folder.exists() and folder.is_dir():
                  shutil.rmtree(folder)

          # Movie-only support files.
          exact_files = {
              'movies.html',
              'movie-template.html',
              'generate-pages.js',
              'create-sitemap.js',
              'create-sitemap.js.js',
              'package.json',
              'package-lock.json',
              '.githubworkflowsgenerate-movies.yml',
              '.github/workflows/generate-movies.yml',
              'generate-movies.yml',
          }

          for rel in exact_files:
              path = root / rel
              if path.exists() and path.is_file():
                  path.unlink()

          # Remove every individual movie page, including older root-level records.
          movie_markers = (
              'Full Movie Online Free HD',
              'Now Playing:',
              '103.145.232.246/Data/movies/',
              'COMPLETE MOVIES LIST',
              'Bollywood Movies 2024-2025 Collection',
              '<i class="fas fa-info-circle"></i> Movie Details',
          )

          for path in list(root.rglob('*.html')):
              if '.git' in path.parts or path.name == 'index.html':
                  continue
              try:
                  text = path.read_text(encoding='utf-8', errors='ignore')
              except OSError:
                  continue
              if any(marker in text for marker in movie_markers):
                  path.unlink()

          # Remove movie-only scripts/data that may have different filenames.
          for path in list(root.rglob('*')):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if path.as_posix() == '.github/workflows/cleanup-movies.yml':
                  continue
              if path.suffix.lower() not in {'.js', '.json', '.yml', '.yaml', '.md', '.txt', '.xml'}:
                  continue
              try:
                  text = path.read_text(encoding='utf-8', errors='ignore')
              except OSError:
                  continue
              if '103.145.232.246/Data/movies/' in text or 'const movies = [' in text and 'generate movie pages' in text.lower():
                  path.unlink()

          # Remove the Movies navigation item from the existing homepage.
          index = root / 'index.html'
          if index.exists():
              text = index.read_text(encoding='utf-8', errors='ignore')
              text = re.sub(
                  r'\s*<a\b[^>]*href=["\'](?:\./)?movies\.html["\'][^>]*>\s*Movies\s*</a>\s*',
                  '\n    ',
                  text,
                  flags=re.IGNORECASE,
              )
              index.write_text(text, encoding='utf-8')

          # Remove any movie URLs from sitemap/robots files while retaining the files.
          sitemap = root / 'sitemap.xml'
          if sitemap.exists():
              text = sitemap.read_text(encoding='utf-8', errors='ignore')
              text = re.sub(
                  r'\s*<url>\s*<loc>[^<]*(?:/movies/|/movies\.html)[^<]*</loc>.*?</url>',
                  '',
                  text,
                  flags=re.IGNORECASE | re.DOTALL,
              )
              sitemap.write_text(text, encoding='utf-8')

          robots = root / 'robots.txt'
          if robots.exists():
              lines = robots.read_text(encoding='utf-8', errors='ignore').splitlines()
              lines = [line for line in lines if '/movies' not in line.lower()]
              robots.write_text('\n'.join(lines).rstrip() + '\n', encoding='utf-8')

          # Replace the old movie-specific README with a clean website README.
          readme = root / 'README.md'
          readme.write_text(
              '# Next Solution\n\n'
              'Official Next Solution website for iPhone jailbreak tutorials, iOS tweaks, videos, and downloads.\n\n'
              'Website: https://nextsolution.cc\n',
              encoding='utf-8',
          )

          # Remove this one-time workflow after it completes.
          workflow = root / '.github/workflows/cleanup-movies.yml'
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No movie files found to remove."
            exit 0
          fi
          git commit -m "Remove movies section and all movie records"
          git push origin main
