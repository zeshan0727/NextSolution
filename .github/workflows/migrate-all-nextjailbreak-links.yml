name: Migrate all links to Next Jailbreak

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-all-nextjailbreak-links.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stage migrated workflow copies
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          src_dir = Path('.github/workflows')
          out_dir = Path('workflow-migration')
          out_dir.mkdir(exist_ok=True)
          self_name = 'migrate-all-nextjailbreak-links.yml'

          replacements = (
              ('https://www.nextsolution.cc', 'https://nextjailbreak.com'),
              ('http://www.nextsolution.cc', 'https://nextjailbreak.com'),
              ('https://nextsolution.cc', 'https://nextjailbreak.com'),
              ('http://nextsolution.cc', 'https://nextjailbreak.com'),
              ('www.nextsolution.cc', 'nextjailbreak.com'),
              ('nextsolution.cc', 'nextjailbreak.com'),
              ('https://www.nextsolution.app', 'https://nextjailbreak.com'),
              ('http://www.nextsolution.app', 'https://nextjailbreak.com'),
              ('https://nextsolution.app', 'https://nextjailbreak.com'),
              ('http://nextsolution.app', 'https://nextjailbreak.com'),
              ('www.nextsolution.app', 'nextjailbreak.com'),
              ('nextsolution.app', 'nextjailbreak.com'),
          )

          manifest = []
          for path in sorted(src_dir.iterdir()):
              if not path.is_file() or path.name == self_name or path.suffix.lower() not in {'.yml', '.yaml'}:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if 'nextsolution.cc' not in text.lower() and 'nextsolution.app' not in text.lower():
                  continue

              new = text
              for old, replacement in replacements:
                  new = new.replace(old, replacement)
                  new = new.replace(old.upper(), replacement)

              if new == text:
                  continue

              staged = out_dir / path.name
              staged.write_text(new, encoding='utf-8')
              manifest.append({
                  'target': str(path),
                  'staged': str(staged),
              })

          (out_dir / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          print(f'Staged {len(manifest)} workflow files')
          for item in manifest:
              print(item['target'])
          PY

      - name: Publish staged workflow copies
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workflow-migration
          if git diff --cached --quiet; then
            echo "No workflow-domain migrations are needed."
            exit 0
          fi
          git commit -m "Stage workflow link migration for nextjailbreak.com"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || { git rebase --abort || true; sleep 3; continue; }
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying..."
            sleep 4
          done
          exit 1
