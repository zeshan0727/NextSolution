name: Migrate all links to Next Jailbreak

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-all-nextjailbreak-links.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build complete migrated workflow tree
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          src_dir = Path('.github/workflows')
          root = Path('workflow-migration')
          out_dir = root / 'all'
          if root.exists():
              shutil.rmtree(root)
          out_dir.mkdir(parents=True)
          self_name = 'migrate-all-nextjailbreak-links.yml'

          replacements = (
              ('https://www.nextsolution.cc', 'https://nextjailbreak.com'),
              ('http://www.nextsolution.cc', 'https://nextjailbreak.com'),
              ('https://nextsolution.cc', 'https://nextjailbreak.com'),
              ('http://nextsolution.cc', 'https://nextjailbreak.com'),
              ('www.nextsolution.cc', 'nextjailbreak.com'),
              ('nextsolution.cc', 'nextjailbreak.com'),
              ('https://www.nextsolution.app', 'https://nextjailbreak.com'),
              ('http://www.nextsolution.app', 'https://nextjailbreak.com'),
              ('https://nextsolution.app', 'https://nextjailbreak.com'),
              ('http://nextsolution.app', 'https://nextjailbreak.com'),
              ('www.nextsolution.app', 'nextjailbreak.com'),
              ('nextsolution.app', 'nextjailbreak.com'),
          )

          copied = 0
          changed = 0
          for path in sorted(src_dir.iterdir()):
              if not path.is_file() or path.name == self_name:
                  continue
              data = path.read_bytes()
              try:
                  text = data.decode('utf-8')
              except UnicodeDecodeError:
                  (out_dir / path.name).write_bytes(data)
                  copied += 1
                  continue

              new = text
              for old, replacement in replacements:
                  new = new.replace(old, replacement)
                  new = new.replace(old.upper(), replacement)
              if new != text:
                  changed += 1
              (out_dir / path.name).write_text(new, encoding='utf-8')
              copied += 1

          print(f'Copied {copied} workflows; migrated domain references in {changed}.')
          PY

      - name: Publish complete staged workflow tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A workflow-migration
          if git diff --cached --quiet; then
            echo "Complete staged workflow tree already current."
            exit 0
          fi
          git commit -m "Stage complete migrated workflow tree"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || { git rebase --abort || true; sleep 3; continue; }
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying..."
            sleep 4
          done
          exit 1
