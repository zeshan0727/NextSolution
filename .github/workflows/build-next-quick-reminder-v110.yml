name: Build Next Quick Reminder 1.0.10 Live Island Layout

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: brew install dpkg ldid xz

      - name: Apply and validate 1.0.10 changes
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/2026-08-04-NextQuickReminder"
          python3 "$P/fix-panel-v103.py"
          python3 "$P/prepare-v104.py"
          python3 "$P/prepare-v105.py"
          python3 "$P/compile-fix-v105.py"
          python3 "$P/prepare-v106.py"
          python3 "$P/prepare-v107.py"
          python3 "$P/prepare-v108.py"
          python3 "$P/compile-fix-v108.py"
          python3 "$P/prepare-v109.py"
          python3 "$P/compile-fix-v109.py"
          python3 "$P/prepare-v110.py"
          python3 "$P/prepare-build.py"
          chmod 755 "$P/layout/DEBIAN/postinst"
          plutil -lint "$P/Preferences/Resources/Root.plist"
          plutil -lint "$P/Preferences/Resources/Info.plist"
          grep -q 'islandCompactWidth' "$P/Preferences/Resources/Root.plist"
          grep -q 'islandExpandedWidth' "$P/Preferences/Resources/Root.plist"
          grep -q 'Horizontal Offset' "$P/Preferences/Resources/Root.plist"
          grep -q 'Test Dynamic Island' "$P/Preferences/Resources/Root.plist"
          grep -q 'testDynamicIsland' "$P/Preferences/NQRRootListController.m"
          grep -q 'NQR110PreferenceFloat' "$P/SystemApertureReminderV109.xm"
          grep -q 'NQR110PreferencesChanged' "$P/SystemApertureReminderV109.xm"
          grep -q 'NQR110TestIsland' "$P/SystemApertureReminderV109.xm"
          test "$(awk '/^Version:/ {print $2}' "$P/control")" = 1.0.10

      - name: Build RootHide tweak
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/2026-08-04-NextQuickReminder"
          OUT="$RUNNER_TEMP/quick-reminder-out"
          mkdir -p "$OUT"
          git init "$RUNNER_TEMP/theos-rh"
          git -C "$RUNNER_TEMP/theos-rh" remote add origin https://github.com/roothide/theos.git
          git -C "$RUNNER_TEMP/theos-rh" fetch --depth 1 origin 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$RUNNER_TEMP/theos-rh" checkout --detach 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$RUNNER_TEMP/theos-rh" submodule update --init --recursive --depth 1
          export THEOS="$RUNNER_TEMP/theos-rh" THEOS_PACKAGE_SCHEME=roothide
          make -C "$P" clean package FINALPACKAGE=1 2>&1 | tee v110-tweak-build.log
          DEB="$(find "$P/packages" -name '*_iphoneos-arm64e.deb' -print -quit)"
          test -n "$DEB"
          cp "$DEB" "$OUT/NextQuickReminder_1.0.10_RootHide.deb"
          ditto -c -k --sequesterRsrc --keepParent "$P" "$OUT/NextQuickReminder_1.0.10_Source.zip"

      - name: Verify final package
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/quick-reminder-out"
          DEB="$OUT/NextQuickReminder_1.0.10_RootHide.deb"
          test "$(dpkg-deb -f "$DEB" Package)" = com.nextsolution.nextquickreminder
          test "$(dpkg-deb -f "$DEB" Version)" = 1.0.10
          test "$(dpkg-deb -f "$DEB" Architecture)" = iphoneos-arm64e
          X="$(mktemp -d)"
          dpkg-deb -x "$DEB" "$X"
          DYLIB="$(find "$X" -name NextQuickReminder.dylib -print -quit)"
          test -n "$DYLIB"
          STRINGS="$RUNNER_TEMP/nextquickreminder-v110-strings.txt"
          strings -a "$DYLIB" > "$STRINGS"
          grep -q '1.0.10 System Aperture reminder loaded with live layout preferences + test preview' "$STRINGS"
          grep -q 'islandCompactWidth' "$STRINGS"
          grep -q 'islandExpandedWidth' "$STRINGS"
          grep -q 'testisland' "$STRINGS"
          PREF_BUNDLE="$(find "$X" -path '*NextQuickReminderPreferences.bundle' -type d -print -quit)"
          test -n "$PREF_BUNDLE"
          grep -q 'Test Dynamic Island' "$PREF_BUNDLE/Root.plist"
          grep -q 'Compact Width' "$PREF_BUNDLE/Root.plist"
          grep -q 'Expanded Vertical Position' "$PREF_BUNDLE/Root.plist"
          shasum -a 256 "$DEB" > "$OUT/NextQuickReminder_1.0.10_RootHide-SHA256.txt"

      - name: Upload final package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NextQuickReminder-1.0.10-RootHide
          if-no-files-found: warn
          path: |
            v110-tweak-build.log
            ${{ runner.temp }}/quick-reminder-out/NextQuickReminder_1.0.10_RootHide.deb
            ${{ runner.temp }}/quick-reminder-out/NextQuickReminder_1.0.10_RootHide-SHA256.txt
            ${{ runner.temp }}/quick-reminder-out/NextQuickReminder_1.0.10_Source.zip
