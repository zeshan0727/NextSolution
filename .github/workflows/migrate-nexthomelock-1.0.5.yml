name: Migrate Verified Next Home Lock 1.0.5

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/migrate-nexthomelock-1.0.5.yml"

permissions:
  contents: write

concurrency:
  group: migrate-nexthomelock-1.0.5
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install repository tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev xz-utils zstd

      - name: Download and verify physically tested packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/verified" debfiles

          curl -fL --retry 4 --retry-delay 2 \
            -o "$RUNNER_TEMP/verified/NextHomeLock_1.0.5_RootHide.deb" \
            "https://raw.githubusercontent.com/zeshan0727/zeshan0727.github.io/main/debfiles/NextHomeLock_1.0.5_RootHide.deb"
          curl -fL --retry 4 --retry-delay 2 \
            -o "$RUNNER_TEMP/verified/NextHomeLock_1.0.5_Rootless.deb" \
            "https://raw.githubusercontent.com/zeshan0727/zeshan0727.github.io/main/debfiles/NextHomeLock_1.0.5_Rootless.deb"

          echo "d56c4188687d703bc7abc4f68951748bdbab739e18206376ca88df7605ab3745  $RUNNER_TEMP/verified/NextHomeLock_1.0.5_RootHide.deb" | sha256sum -c -
          echo "a7ec52389bdbd4bd8e959bb63a776b000eac4ff13b6688edf0badd34924743d2  $RUNNER_TEMP/verified/NextHomeLock_1.0.5_Rootless.deb" | sha256sum -c -

          test "$(dpkg-deb -f "$RUNNER_TEMP/verified/NextHomeLock_1.0.5_RootHide.deb" Package)" = "com.nextsolution.nexthomelock"
          test "$(dpkg-deb -f "$RUNNER_TEMP/verified/NextHomeLock_1.0.5_RootHide.deb" Version)" = "1.0.5"
          test "$(dpkg-deb -f "$RUNNER_TEMP/verified/NextHomeLock_1.0.5_RootHide.deb" Architecture)" = "iphoneos-arm64e"
          test "$(dpkg-deb -f "$RUNNER_TEMP/verified/NextHomeLock_1.0.5_Rootless.deb" Package)" = "com.nextsolution.nexthomelock"
          test "$(dpkg-deb -f "$RUNNER_TEMP/verified/NextHomeLock_1.0.5_Rootless.deb" Version)" = "1.0.5"
          test "$(dpkg-deb -f "$RUNNER_TEMP/verified/NextHomeLock_1.0.5_Rootless.deb" Architecture)" = "iphoneos-arm64"

          cp "$RUNNER_TEMP/verified"/*.deb debfiles/

      - name: Publish into the nextsolution.cc Sileo source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Next Solution Migration Bot"
          git config user.email "actions@users.noreply.github.com"

          mkdir -p "$RUNNER_TEMP/nhl-only"
          cp debfiles/NextHomeLock_1.0.5_RootHide.deb "$RUNNER_TEMP/nhl-only/"
          cp debfiles/NextHomeLock_1.0.5_Rootless.deb "$RUNNER_TEMP/nhl-only/"
          dpkg-scanpackages -m "$RUNNER_TEMP/nhl-only" /dev/null > "$RUNNER_TEMP/nhl-stanzas"
          sed -i "s|^Filename: .*/nhl-only/|Filename: ./debfiles/|" "$RUNNER_TEMP/nhl-stanzas"

          python3 - "$RUNNER_TEMP/nhl-stanzas" <<'PY'
          from pathlib import Path
          import re
          import sys

          packages = Path("Packages")
          old = packages.read_text() if packages.exists() else ""
          stanzas = [item.strip() for item in re.split(r"\n\s*\n", old) if item.strip()]
          stanzas = [
              item for item in stanzas
              if not re.search(r"^Package: com\.nextsolution\.nexthomelock$", item, re.M)
          ]
          new = [
              item.strip() for item in re.split(r"\n\s*\n", Path(sys.argv[1]).read_text())
              if item.strip()
          ]
          packages.write_text("\n\n".join(stanzas + new) + "\n")
          PY

          test "$(grep -c '^Package: com.nextsolution.nexthomelock$' Packages)" -eq 2
          test "$(grep -c '^Version: 1.0.5$' Packages)" -ge 2
          test "$(grep -c '^Filename: ./debfiles/NextHomeLock_1.0.5_Root' Packages)" -eq 2
          ! grep -A15 '^Package: com.nextsolution.nexthomelock$' Packages | grep -q 'zeshan0727.github.io'

          gzip -9 -c Packages > Packages.gz
          bzip2 -9 -c Packages > Packages.bz2
          xz -9e -c Packages > Packages.xz
          zstd -19 -q -c Packages > Packages.zst

          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import re

          path = Path("Release")
          text = path.read_text()
          text = re.sub(r"^Version: .*?$", "Version: 1.0.22", text, flags=re.M)
          date = datetime.now(timezone.utc).strftime("%a, %d %b %Y %H:%M:%S UTC")
          text = re.sub(r"^Date: .*?$", f"Date: {date}", text, flags=re.M)
          text = re.sub(r"^Icon: .*?$", "Icon: https://nextsolution.cc/CydiaIcon.png", text, flags=re.M)
          path.write_text(text)
          PY

          git add debfiles/NextHomeLock_1.0.5_RootHide.deb \
                  debfiles/NextHomeLock_1.0.5_Rootless.deb \
                  Packages Packages.gz Packages.bz2 Packages.xz Packages.zst Release
          git diff --cached --check
          git commit -m "Migrate Next Home Lock 1.0.5 to nextsolution.cc"

          for attempt in 1 2 3; do
            git pull --rebase origin main
            git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1
