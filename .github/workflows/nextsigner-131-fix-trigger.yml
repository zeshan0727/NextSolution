          # Store: support Photos data and refresh from GitHub after a completed delete.
          path = Path('NextSigner/NextSigner/SignerStore.swift')
          s = path.read_text()
          marker = '''    func clearCustomIcon() {
        if let url = request.customIconURL { try? FileManager.default.removeItem(at: url) }
        request.customIconURL = nil
    }
'''
          insert = '''    func importCustomIconPNGData(_ data: Data) {
        guard !data.isEmpty else {
            errorMessage = "The selected photo could not be converted into an app icon."
            return
        }
        do {
            if let old = request.customIconURL { try? FileManager.default.removeItem(at: old) }
            let folder = FileManager.default.urls(for: .cachesDirectory, in: .userDomainMask)[0]
                .appendingPathComponent("NextSignerInbox", isDirectory: true)
                .appendingPathComponent("Icons", isDirectory: true)
            try FileManager.default.createDirectory(at: folder, withIntermediateDirectories: true)
            let destination = folder.appendingPathComponent("photo-icon-\\(UUID().uuidString).png")
            try data.write(to: destination, options: .atomic)
            request.customIconURL = destination
            errorMessage = nil
        } catch {
            errorMessage = "Unable to use the selected photo as an icon: \\(error.localizedDescription)"
        }
    }

''' + marker
          if marker not in s:
              raise SystemExit('SignerStore clearCustomIcon marker not found')
          s = s.replace(marker, insert, 1)

          old = '''    func refreshLibrary() async {
        libraryIsLoading = true
        libraryErrorMessage = nil
        defer { libraryIsLoading = false }
        do {
            var components = URLComponents(string: "https://nextsolution.cc/install/apps.json")!
            components.queryItems = [URLQueryItem(name: "_", value: String(Int(Date().timeIntervalSince1970)))]
            guard let url = components.url else { throw NextSignerError.libraryUnavailable }
            var request = URLRequest(url: url)
            request.cachePolicy = .reloadIgnoringLocalAndRemoteCacheData
            request.timeoutInterval = 30
            let (data, response) = try await URLSession.shared.data(for: request)
            guard let http = response as? HTTPURLResponse, (200...299).contains(http.statusCode) else {
                throw NextSignerError.libraryUnavailable
            }
            let catalog = try JSONDecoder().decode(PublishedCatalog.self, from: data)
            libraryApps = catalog.apps
        } catch {
            libraryErrorMessage = error.localizedDescription
        }
    }
'''
          new = '''    func refreshLibrary() async {
        libraryIsLoading = true
        libraryErrorMessage = nil
        defer { libraryIsLoading = false }
        do {
            let currentToken = KeychainStore.load(account: tokenAccount) ?? token.trimmingCharacters(in: .whitespacesAndNewlines)
            if !currentToken.isEmpty && configuration.isValid {
                let service = GitHubService(token: currentToken, configuration: configuration)
                libraryApps = try await service.fetchPublishedCatalog().apps
            } else {
                var components = URLComponents(string: "https://nextsolution.cc/install/apps.json")!
                components.queryItems = [URLQueryItem(name: "_", value: String(Int(Date().timeIntervalSince1970)))]
                guard let url = components.url else { throw NextSignerError.libraryUnavailable }
                var webRequest = URLRequest(url: url)
                webRequest.cachePolicy = .reloadIgnoringLocalAndRemoteCacheData
                webRequest.timeoutInterval = 30
                let (data, response) = try await URLSession.shared.data(for: webRequest)
                guard let http = response as? HTTPURLResponse, (200...299).contains(http.statusCode) else {
                    throw NextSignerError.libraryUnavailable
                }
                libraryApps = try JSONDecoder().decode(PublishedCatalog.self, from: data).apps
            }
        } catch {
            libraryErrorMessage = error.localizedDescription
        }
    }
'''
          if old not in s:
              raise SystemExit('SignerStore refreshLibrary block not found')
          s = s.replace(old, new, 1)

          old = '''        do {
            let service = GitHubService(token: currentToken, configuration: configuration)
            try await service.dispatchLibraryAction(appID: app.id, action: action)
            switch action {
            case .cleanOldVersions:
                libraryMessage = "Cleanup queued for \\(app.name). The current version will be kept; older R2 files will be removed."
            case .deleteApp:
                libraryMessage = "Deletion queued for \\(app.name). Its site entry, manifest/icon and stored R2 versions will be removed."
            }
        } catch {
            libraryErrorMessage = error.localizedDescription
        }
'''
          new = '''        do {
            let service = GitHubService(token: currentToken, configuration: configuration)
            libraryMessage = action == .deleteApp
                ? "Deleting \\(app.name)… waiting for GitHub and R2 to finish."
                : "Cleaning old versions of \\(app.name)…"
            let runURL = try await service.dispatchLibraryAction(appID: app.id, action: action)

            if action == .deleteApp {
                libraryApps.removeAll { $0.id == app.id }
            }
            await refreshLibrary()

            switch action {
            case .cleanOldVersions:
                libraryMessage = "Cleanup complete for \\(app.name). The current version was kept and old R2 files were removed."
            case .deleteApp:
                if libraryApps.contains(where: { $0.id == app.id }) {
                    libraryErrorMessage = "GitHub reported success, but \\(app.name) is still present in the catalog. Run: \\(runURL)"
                } else {
                    libraryMessage = "Deleted \\(app.name) from the site and Cloudflare R2."
                }
            }
        } catch {
            libraryErrorMessage = error.localizedDescription
            await refreshLibrary()
        }
'''
          if old not in s:
              raise SystemExit('SignerStore manageLibrary block not found')
          s = s.replace(old, new, 1)
          path.write_text(s)

          # SwiftUI: PhotosPicker alongside Files for custom app icons.
          path = Path('NextSigner/NextSigner/NextSignerRootView.swift')
          s = path.read_text()
          if 'import PhotosUI' not in s:
              s = s.replace('import UIKit\n', 'import UIKit\nimport PhotosUI\n', 1)
          s = s.replace('''    @State private var pickerTarget: PickerTarget?\n''', '''    @State private var pickerTarget: PickerTarget?\n    @State private var selectedPhotoIcon: PhotosPickerItem?\n''', 1)

          old = '''                HStack {
                    Button { pickerTarget = .icon } label: {
                        Label(store.request.customIconURL == nil ? "Choose Icon" : "Change Icon", systemImage: "photo")
                    }
                    .buttonStyle(.bordered)

                    if store.request.customIconURL != nil {
                        Button("Remove", role: .destructive) { store.clearCustomIcon() }
                            .buttonStyle(.bordered)
                    }
                }
'''
          new = '''                HStack {
                    PhotosPicker(selection: $selectedPhotoIcon, matching: .images) {
                        Label("Photos", systemImage: "photo.on.rectangle")
                    }
                    .buttonStyle(.borderedProminent)

                    Button { pickerTarget = .icon } label: {
                        Label("Files", systemImage: "folder")
                    }
                    .buttonStyle(.bordered)

                    if store.request.customIconURL != nil {
                        Button("Remove", role: .destructive) { store.clearCustomIcon() }
                            .buttonStyle(.bordered)
                    }
                }
                .onChange(of: selectedPhotoIcon) { item in
                    guard let item else { return }
                    Task { @MainActor in
                        defer { selectedPhotoIcon = nil }
                        do {
                            guard let data = try await item.loadTransferable(type: Data.self),
                                  let image = UIImage(data: data),
                                  let pngData = image.pngData() else {
                                store.errorMessage = "The selected photo could not be converted to PNG."
                                return
                            }
                            store.importCustomIconPNGData(pngData)
                        } catch {
                            store.errorMessage = "Unable to load the selected photo: \\(error.localizedDescription)"
                        }
                    }
                }
'''
          if old not in s:
              raise SystemExit('RootView icon picker block not found')
          s = s.replace(old, new, 1)
          path.write_text(s)

          # Version bump and build artifact version.
          path = Path('NextSigner/project.yml')
          s = path.read_text().replace('MARKETING_VERSION: "1.3.0"', 'MARKETING_VERSION: "1.3.1"').replace('CURRENT_PROJECT_VERSION: "13"', 'CURRENT_PROJECT_VERSION: "14"')
          path.write_text(s)

          path = Path('.github/workflows/build-nextsigner-tipa.yml')
          s = path.read_text().replace('NextSigner-1.3.0', 'NextSigner-1.3.1')
          path.write_text(s)
          PY

      - name: Generate icon and Xcode project
        shell: bash
        run: |
          set -euo pipefail
          python3 NextSigner/generate_app_icon.py
          brew install xcodegen
          cd NextSigner
          xcodegen generate

      - name: Compile Next Signer 1.3.1
        working-directory: NextSigner
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project NextSigner.xcodeproj \
            -scheme NextSigner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/NextSigner131" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package 1.3.1 artifact
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find "$RUNNER_TEMP/NextSigner131/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name '*.app' | head -n1)"
          test -n "$APP_PATH" || { echo 'Built app not found'; exit 1; }
          test -f "$APP_PATH/Assets.car" || { echo 'Compiled AppIcon asset catalog missing'; exit 1; }
          rm -rf "$RUNNER_TEMP/package"
          mkdir -p "$RUNNER_TEMP/package/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/package/Payload/NextSigner.app"
          cd "$RUNNER_TEMP/package"
          /usr/bin/zip -qry "$RUNNER_TEMP/NextSigner-1.3.1.ipa" Payload
          cp "$RUNNER_TEMP/NextSigner-1.3.1.ipa" "$RUNNER_TEMP/NextSigner-1.3.1.tipa"
          unzip -t "$RUNNER_TEMP/NextSigner-1.3.1.tipa" >/dev/null
          shasum -a 256 "$RUNNER_TEMP/NextSigner-1.3.1.tipa"

      - name: Commit verified fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add NextSigner/NextSigner/GitHubService.swift NextSigner/NextSigner/SignerStore.swift NextSigner/NextSigner/NextSignerRootView.swift NextSigner/project.yml .github/workflows/build-nextsigner-tipa.yml
          git commit -m 'Fix Next Signer Library deletion and add Photos icon picker'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: NextSigner-1.3.1-TIPA
          path: |
            ${{ runner.temp }}/NextSigner-1.3.1.tipa
            ${{ runner.temp }}/NextSigner-1.3.1.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish 1.3.1 through Transfer/R2
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow publish-nextsigner-transfer.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run publish-nextsigner-transfer.yml --repo "$GITHUB_REPOSITORY" --ref main -f version=1.3.1
          RUN_ID=''
          for attempt in $(seq 1 20); do
            candidate="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow publish-nextsigner-transfer.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            if [ "$candidate" != "0" ] && [ "$candidate" != "$BEFORE" ]; then RUN_ID="$candidate"; break; fi
            sleep 3
          done
          test -n "$RUN_ID" || { echo 'Could not locate 1.3.1 publisher run'; exit 1; }
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status --interval 8
          echo "PUBLISH_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

      - name: Report success
        if: success()
        run: gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "NEXTSIGNER_1_3_1_OK publish_run=${PUBLISH_RUN_ID:-unknown}"

      - name: Report failure
        if: failure()
        run: gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "NEXTSIGNER_1_3_1_FAILED run=${{ github.run_id }}"
