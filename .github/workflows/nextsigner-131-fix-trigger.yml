name: Temporary Next Signer 1.3.1 Fix Verifier

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  fix-build-publish:
    if: github.event.issue.title == '[NEXTSIGNER-1.3.1-FIX]'
    runs-on: macos-15
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch deletion flow and Photos icon picker
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # GitHub service: wait for library workflow completion and read the catalog
          # directly from GitHub so the app is not held up by Pages/CDN propagation.
          path = Path('NextSigner/NextSigner/GitHubService.swift')
          s = path.read_text()

          marker = '''    struct DispatchResponse: Decodable {
              let workflowRunID: Int?
              let htmlURL: String?

              enum CodingKeys: String, CodingKey {
                  case workflowRunID = "workflow_run_id"
                  case htmlURL = "html_url"
              }
          }
'''
          insert = marker + '''
    private struct WorkflowRunsResponse: Decodable {
        let workflowRuns: [WorkflowRun]
        enum CodingKeys: String, CodingKey { case workflowRuns = "workflow_runs" }
    }

    private struct WorkflowRun: Decodable {
        let id: Int
        let status: String
        let conclusion: String?
        let htmlURL: String
        let createdAt: String
        enum CodingKeys: String, CodingKey {
            case id, status, conclusion
            case htmlURL = "html_url"
            case createdAt = "created_at"
        }
    }

    private struct RepositoryContentFile: Decodable {
        let content: String
        let encoding: String
    }
'''
          if marker not in s:
              raise SystemExit('GitHubService DispatchResponse marker not found')
          s = s.replace(marker, insert, 1)

          old = '''    func dispatchLibraryAction(appID: String, action: LibraryAction) async throws {
        guard configuration.isValid else { throw NextSignerError.invalidConfiguration }
        let workflow = "nextsigner-library-manage.yml".addingPercentEncoding(withAllowedCharacters: .urlPathAllowed) ?? "nextsigner-library-manage.yml"
        let url = try apiURL("/repos/\\(configuration.owner)/\\(configuration.repository)/actions/workflows/\\(workflow)/dispatches")
        let body: [String: Any] = [
            "ref": configuration.branch,
            "inputs": [
                "app_id": appID,
                "mode": action.rawValue
            ]
        ]
        let encoded = try JSONSerialization.data(withJSONObject: body)
        let (data, response) = try await session.data(for: request(url: url, method: "POST", body: encoded))
        try validate(response: response, data: data, accepted: [200, 204])
    }
'''
          new = '''    func dispatchLibraryAction(appID: String, action: LibraryAction) async throws -> String {
        guard configuration.isValid else { throw NextSignerError.invalidConfiguration }
        let workflowName = "nextsigner-library-manage.yml"
        let workflow = workflowName.addingPercentEncoding(withAllowedCharacters: .urlPathAllowed) ?? workflowName
        let url = try apiURL("/repos/\\(configuration.owner)/\\(configuration.repository)/actions/workflows/\\(workflow)/dispatches")
        let body: [String: Any] = [
            "ref": configuration.branch,
            "inputs": [
                "app_id": appID,
                "mode": action.rawValue
            ]
        ]
        let dispatchedAt = Date().addingTimeInterval(-3)
        let encoded = try JSONSerialization.data(withJSONObject: body)
        let (data, response) = try await session.data(for: request(url: url, method: "POST", body: encoded))
        try validate(response: response, data: data, accepted: [200, 204])

        let run = try await waitForNewWorkflowRun(workflow: workflow, createdAfter: dispatchedAt)
        return try await waitForWorkflowCompletion(runID: run.id, initialURL: run.htmlURL)
    }

    func fetchPublishedCatalog() async throws -> PublishedCatalog {
        guard configuration.isValid else { throw NextSignerError.invalidConfiguration }
        let branch = configuration.branch.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed) ?? configuration.branch
        let url = try apiURL("/repos/\\(configuration.owner)/\\(configuration.repository)/contents/install/apps.json?ref=\\(branch)")
        let (data, response) = try await session.data(for: request(url: url))
        try validate(response: response, data: data)
        let file = try JSONDecoder().decode(RepositoryContentFile.self, from: data)
        guard file.encoding.lowercased() == "base64" else { throw NextSignerError.libraryUnavailable }
        let compact = file.content.filter { !$0.isWhitespace }
        guard let decoded = Data(base64Encoded: compact) else { throw NextSignerError.libraryUnavailable }
        return try JSONDecoder().decode(PublishedCatalog.self, from: decoded)
    }

    private func waitForNewWorkflowRun(workflow: String, createdAfter: Date) async throws -> WorkflowRun {
        let formatter = ISO8601DateFormatter()
        for _ in 0..<30 {
            var components = URLComponents(string: "https://api.github.com/repos/\\(configuration.owner)/\\(configuration.repository)/actions/workflows/\\(workflow)/runs")!
            components.queryItems = [
                URLQueryItem(name: "event", value: "workflow_dispatch"),
                URLQueryItem(name: "branch", value: configuration.branch),
                URLQueryItem(name: "per_page", value: "10")
            ]
            guard let url = components.url else { throw NextSignerError.malformedURL }
            let (data, response) = try await session.data(for: request(url: url))
            try validate(response: response, data: data)
            let runs = try JSONDecoder().decode(WorkflowRunsResponse.self, from: data).workflowRuns
            if let run = runs.first(where: { item in
                guard let created = formatter.date(from: item.createdAt) else { return false }
                return created >= createdAfter
            }) {
                return run
            }
            try await Task.sleep(nanoseconds: 1_000_000_000)
        }
        throw NSError(domain: "NextSigner", code: 1001, userInfo: [NSLocalizedDescriptionKey: "The Library management job was queued, but Next Signer could not locate its GitHub Actions run."])
    }

    private func waitForWorkflowCompletion(runID: Int, initialURL: String) async throws -> String {
        var lastURL = initialURL
        for _ in 0..<120 {
            let url = try apiURL("/repos/\\(configuration.owner)/\\(configuration.repository)/actions/runs/\\(runID)")
            let (data, response) = try await session.data(for: request(url: url))
            try validate(response: response, data: data)
            let run = try JSONDecoder().decode(WorkflowRun.self, from: data)
            lastURL = run.htmlURL
            if run.status == "completed" {
                if run.conclusion == "success" { return run.htmlURL }
                throw NSError(domain: "NextSigner", code: 1002, userInfo: [NSLocalizedDescriptionKey: "Library management failed in GitHub Actions. Open the run for details: \\(run.htmlURL)"])
            }
            try await Task.sleep(nanoseconds: 2_000_000_000)
        }
        throw NSError(domain: "NextSigner", code: 1003, userInfo: [NSLocalizedDescriptionKey: "Library management is still running. Check the GitHub Actions run: \\(lastURL)"])
    }
'''
