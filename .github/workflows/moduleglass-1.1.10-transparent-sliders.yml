name: Build ModuleGlass 1.1.10 Transparent Sliders

on:
  push:
    branches:
      - build/moduleglass-1.1.10-transparent-sliders

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    env:
      THEOS: ${{ github.workspace }}/theos
      THEOS_PACKAGE_SCHEME: roothide
    steps:
      - uses: actions/checkout@v4

      - name: Generate exact 1.1.10 source
        shell: bash
        run: |
          set -euxo pipefail
          echo '0786f80dadb2ee439b2466c07ae7d30b75aff90a95bf3627b9f1ea8fc3fd072f  source/ModuleGlass/Tweak.m' | shasum -a 256 -c -
          python3 source/ModuleGlass/apply-1.1.6-glyphsafe.py
          echo '1e5fda7e161c707b580dd5935e46aceb2e3fedae965ff09ce6e2b39735bafce9  source/ModuleGlass/Tweak.m' | shasum -a 256 -c -
          python3 source/ModuleGlass/apply-1.1.7-crisp-volume.py
          python3 source/ModuleGlass/apply-1.1.8-rounded-connectivity.py
          echo '79ffa43c376266524702075660299b9cd391a471fc6555da9bb9233d17b73ab8  source/ModuleGlass/Tweak.m' | shasum -a 256 -c -
          python3 source/ModuleGlass/apply-1.1.9-unified-sliders.py
          echo '16056cc947d86568727544d4f2247a12d118499adaf27f8aadbae9a4178e8ea4  source/ModuleGlass/Tweak.m' | shasum -a 256 -c -
          python3 source/ModuleGlass/apply-1.1.10-transparent-slider-shell.py
          echo 'f82e116252bb5172c443d3ab3969a8db57620120283fe37d7a7913fe3edc71a9  source/ModuleGlass/Tweak.m' | shasum -a 256 -c -
          shasum -a 256 source/ModuleGlass/Tweak.m | tee final-source.sha256
          grep -q 'shell.backgroundColor=UIColor.clearColor' source/ModuleGlass/Tweak.m
          ! grep -q 'shell.backgroundColor=\[UIColor colorWithWhite:0.0 alpha:0.26\]' source/ModuleGlass/Tweak.m
          grep -q 'MGSliderShellInScope' source/ModuleGlass/Tweak.m
          grep -q 'MGApplySliderFillMask' source/ModuleGlass/Tweak.m
          grep -q 'unified-full-pill-live-fill' source/ModuleGlass/Tweak.m
          grep -q 'MGClearConnectivityActiveBackgroundsRecursive' source/ModuleGlass/Tweak.m
          grep -q 'glyph-safe-background-only' source/ModuleGlass/Tweak.m
          grep -q '1.1.10 Transparent Slider Shell Renderer' source/ModuleGlass/Tweak.m

      - name: Install RootHide build tools
        shell: bash
        run: |
          set -euxo pipefail
          brew install ldid xz dpkg || true
          command -v dpkg-deb
          git clone --depth 1 --recursive https://github.com/roothide/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          curl -fL https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz -o /tmp/sdk.tar.xz
          tar -xJf /tmp/sdk.tar.xz -C "$THEOS/sdks"

      - name: Build complete 1.1.10 RootHide package
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf complete-build
          mkdir -p complete-build
          cp source/ModuleGlass/Tweak.m source/ModuleGlass/Compat.h source/ModuleGlass/CCModuleBackgrounds.plist complete-build/
          cat > complete-build/Makefile <<'EOF'
          ARCHS = arm64 arm64e
          TARGET = iphone:clang:latest:16.0
          THEOS_PACKAGE_SCHEME ?= roothide
          INSTALL_TARGET_PROCESSES = SpringBoard
          include $(THEOS)/makefiles/common.mk
          TWEAK_NAME = CCModuleBackgrounds
          CCModuleBackgrounds_FILES = Tweak.m
          CCModuleBackgrounds_CFLAGS = -fobjc-arc -Wno-unneeded-internal-declaration -include $(THEOS_PROJECT_DIR)/Compat.h
          CCModuleBackgrounds_FRAMEWORKS = Foundation UIKit CoreFoundation CoreGraphics QuartzCore
          CCModuleBackgrounds_LIBRARIES = substrate
          include $(THEOS_MAKE_PATH)/tweak.mk
          EOF
          sed -i '' 's/^          //' complete-build/Makefile
          cat > complete-build/control <<'EOF'
          Package: com.nextsolution.nextaura.cc-module-backgrounds
          Name: Module Glass
          Version: 1.1.10
          Architecture: iphoneos-arm64e
          Description: Complete RootHide Module Glass with transparent slider shells and unified live-fill Brightness and Volume sliders.
          Maintainer: Next Solution
          Author: Next Solution - zeshan0727
          Section: Tweaks
          Depends: firmware (>= 16.0), mobilesubstrate, preferenceloader, com.nextsolution.nextaura.runtime.preferences (>= 1.0.5)
          Provides: com.nextsolution.nextaura.runtime.ccbackgrounds (= 1.1.10)
          Conflicts: com.nextsolution.nextaura.runtime.ccbackgrounds (<= 1.1.9), com.nextsolution.unlockvibrate
          Breaks: com.nextsolution.nextaura.runtime.ccbackgrounds (<= 1.1.9)
          Replaces: com.nextsolution.nextaura.runtime.ccbackgrounds (<= 1.1.9)
          Priority: optional
          Homepage: https://nextsolution.cc/
          Tag: role::cydia
          EOF
          sed -i '' 's/^          //' complete-build/control
          cd complete-build
          make clean
          make package FINALPACKAGE=1
          cp "$(find packages -type f -name '*.deb' -print -quit)" ../ModuleGlass_1.1.10_Complete_RootHide.deb

      - name: Verify exact package and transparent slider rule
        shell: bash
        run: |
          set -euxo pipefail
          DEB=ModuleGlass_1.1.10_Complete_RootHide.deb
          mkdir -p verify/root verify/control
          dpkg-deb -x "$DEB" verify/root
          dpkg-deb -e "$DEB" verify/control
          test "$(dpkg-deb -f "$DEB" Package)" = 'com.nextsolution.nextaura.cc-module-backgrounds'
          test "$(dpkg-deb -f "$DEB" Version)" = '1.1.10'
          test "$(dpkg-deb -f "$DEB" Architecture)" = 'iphoneos-arm64e'
          DYLIB="$(find verify/root -name CCModuleBackgrounds.dylib -print -quit)"
          FILTER="$(find verify/root -name CCModuleBackgrounds.plist -print -quit)"
          test -n "$DYLIB" && test -n "$FILTER"
          lipo -info "$DYLIB" | tee verify/lipo.txt
          grep -q arm64 verify/lipo.txt && grep -q arm64e verify/lipo.txt
          otool -L "$DYLIB" | tee verify/otool.txt
          grep -q '@loader_path/.jbroot/' verify/otool.txt
          strings "$DYLIB" | grep -q '1.1.10 Transparent Slider Shell Renderer'
          grep -q SpringBoard "$FILTER"
          grep -q 'shell.backgroundColor=UIColor.clearColor' complete-build/Tweak.m
          ! grep -q 'shell.backgroundColor=\[UIColor colorWithWhite:0.0 alpha:0.26\]' complete-build/Tweak.m
          grep -q 'MGApplySliderFillMask' complete-build/Tweak.m
          grep -q 'MGConnectivityColorLooksBlue' complete-build/Tweak.m
          shasum -a 256 "$DEB" | tee verify/deb.sha256

      - name: Create matching source archive
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf ModuleGlass-1.1.10-Complete-Source
          mkdir -p ModuleGlass-1.1.10-Complete-Source
          cp complete-build/Tweak.m complete-build/Compat.h complete-build/CCModuleBackgrounds.plist complete-build/Makefile complete-build/control ModuleGlass-1.1.10-Complete-Source/
          cat > ModuleGlass-1.1.10-Complete-Source/README.md <<'EOF'
          # Module Glass 1.1.10 Complete RootHide

          Slider-shell-only delta from the validated 1.1.9 device build:
          - Removes the remaining translucent gray background from Brightness and Volume.
          - The slider shell stays full-size and rounded, but its background is fully transparent.
          - The existing 0-100% image fill mask, slider geometry, glyphs, percentages and all non-slider rendering behavior are unchanged.
          EOF
          sed -i '' 's/^          //' ModuleGlass-1.1.10-Complete-Source/README.md
          zip -qry ModuleGlass_1.1.10_Complete_Source.zip ModuleGlass-1.1.10-Complete-Source
          shasum -a 256 ModuleGlass_1.1.10_Complete_Source.zip | tee verify/source.sha256
          cat verify/deb.sha256 verify/source.sha256 > SHA256SUMS.txt

      - name: Upload exact verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModuleGlass-1.1.10-Complete-RootHide
          path: |
            ModuleGlass_1.1.10_Complete_RootHide.deb
            ModuleGlass_1.1.10_Complete_Source.zip
            SHA256SUMS.txt
            final-source.sha256
          if-no-files-found: error
          retention-days: 3

      - name: Replace Transfer build with verified 1.1.10
        shell: bash
        run: |
          set -euxo pipefail
          PUBLISH=/tmp/moduleglass-1.1.10-publish
          rm -rf "$PUBLISH" && mkdir -p "$PUBLISH"
          cp ModuleGlass_1.1.10_Complete_RootHide.deb ModuleGlass_1.1.10_Complete_Source.zip SHA256SUMS.txt "$PUBLISH/"
          DEB_SHA="$(shasum -a 256 "$PUBLISH/ModuleGlass_1.1.10_Complete_RootHide.deb" | awk '{print $1}')"
          SRC_SHA="$(shasum -a 256 "$PUBLISH/ModuleGlass_1.1.10_Complete_Source.zip" | awk '{print $1}')"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git reset --hard HEAD
          git clean -fdx
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B moduleglass-1.1.10-publish origin/main
            rm -rf transfer/files/ModuleGlass/1.1.6 transfer/files/ModuleGlass/1.1.7 transfer/files/ModuleGlass/1.1.8 transfer/files/ModuleGlass/1.1.9 transfer/files/ModuleGlass/1.1.10
            mkdir -p transfer/files/ModuleGlass/1.1.10
            cp "$PUBLISH/ModuleGlass_1.1.10_Complete_RootHide.deb" transfer/files/ModuleGlass/1.1.10/
            cp "$PUBLISH/ModuleGlass_1.1.10_Complete_Source.zip" transfer/files/ModuleGlass/1.1.10/
            cp "$PUBLISH/SHA256SUMS.txt" transfer/files/ModuleGlass/1.1.10/SHA256SUMS.txt
            python3 - "$DEB_SHA" "$SRC_SHA" <<'PY'
          import datetime, json, pathlib, sys
          deb_sha, src_sha = sys.argv[1], sys.argv[2]
          p=pathlib.Path('transfer/index.json')
          data=json.loads(p.read_text())
          files=[x for x in data.get('files',[]) if not str(x.get('id','')).startswith('moduleglass-1.1.')]
          new=[
            {'id':'moduleglass-1.1.10-roothide','name':'Module Glass 1.1.10 Complete RootHide','fileName':'ModuleGlass_1.1.10_Complete_RootHide.deb','type':'deb','platform':'RootHide','version':'1.1.10','url':'https://nextsolution.cc/transfer/files/ModuleGlass/1.1.10/ModuleGlass_1.1.10_Complete_RootHide.deb','sha256':deb_sha,'notes':'Slider-shell-only device test: removes the remaining translucent gray slider background while preserving the validated 1.1.9 full rounded 0-100% Brightness/Volume fill behavior.'},
            {'id':'moduleglass-1.1.10-source','name':'Module Glass 1.1.10 Complete Source','fileName':'ModuleGlass_1.1.10_Complete_Source.zip','type':'zip','platform':'Source / Theos','version':'1.1.10','url':'https://nextsolution.cc/transfer/files/ModuleGlass/1.1.10/ModuleGlass_1.1.10_Complete_Source.zip','sha256':src_sha,'notes':'Matching source for the validated 1.1.10 transparent-slider-shell RootHide test build.'}
          ]
          insert_at=next((i+1 for i,x in enumerate(files) if str(x.get('id','')).startswith('module-glass-preview')),0)
          files[insert_at:insert_at]=new
          data['files']=files
          data['updatedAt']=datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
            git add -A transfer/files/ModuleGlass transfer/index.json
            git commit -m 'Replace Module Glass with 1.1.10 transparent slider shell test'
            if git push origin HEAD:main; then exit 0; fi
            git reset --hard
          done
          exit 1
