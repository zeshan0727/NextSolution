name: Publish Next Quick Reminder 1.0.8

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: publish-next-quick-reminder-1.0.8
  cancel-in-progress: true

jobs:
  build-validate-publish:
    if: github.head_ref == 'agent/next-quick-reminder-v1.0.5-multi-trigger-roothide'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: brew install dpkg ldid xz zstd

      - name: Prepare 1.0.8 source
        shell: bash
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/2026-08-04-NextQuickReminder"
          python3 "$P/fix-panel-v103.py"
          python3 "$P/prepare-v104.py"
          python3 "$P/prepare-v105.py"
          python3 "$P/compile-fix-v105.py"
          python3 "$P/prepare-v106.py"
          python3 "$P/prepare-v107.py"
          python3 "$P/prepare-v108.py"
          python3 "$P/compile-fix-v108.py"
          python3 "$P/prepare-build.py"
          chmod 755 "$P/layout/DEBIAN/postinst"
          test "$(awk '/^Version:/ {print $2}' "$P/control")" = 1.0.8
          grep -q 'SystemApertureReminder.xm' "$P/Makefile"
          ! grep -q 'DueReminderLiveCard.xm' "$P/Makefile"
          grep -q 'SBSystemApertureWindow' "$P/SystemApertureReminder.xm"
          grep -q 'DISPATCH_BLOCK_INHERIT_QOS_CLASS' "$P/SystemApertureReminder.xm"
          grep -q 'MCMMetadataIdentifier' "$P/SystemApertureReminder.xm"
          grep -q 'nqr106_prepareKeyboardForResponder' "$P/Tweak.xm"

      - name: Build RootHide package
        shell: bash
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/2026-08-04-NextQuickReminder"
          OUT="$RUNNER_TEMP/nqr-release"
          mkdir -p "$OUT"
          git init "$RUNNER_TEMP/theos-roothide"
          git -C "$RUNNER_TEMP/theos-roothide" remote add origin https://github.com/roothide/theos.git
          git -C "$RUNNER_TEMP/theos-roothide" fetch --depth 1 origin 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$RUNNER_TEMP/theos-roothide" checkout --detach 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$RUNNER_TEMP/theos-roothide" submodule update --init --recursive --depth 1
          export THEOS="$RUNNER_TEMP/theos-roothide" THEOS_PACKAGE_SCHEME=roothide
          rm -rf "$P/packages"
          make -C "$P" clean package FINALPACKAGE=1
          D="$(find "$P/packages" -name '*_iphoneos-arm64e.deb' -print -quit)"
          test -n "$D"
          cp "$D" "$OUT/NextQuickReminder_1.0.8_RootHide.deb"

      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/nqr-release/NextQuickReminder_1.0.8_RootHide.deb"
          test "$(dpkg-deb -f "$D" Package)" = com.nextsolution.nextquickreminder
          test "$(dpkg-deb -f "$D" Version)" = 1.0.8
          test "$(dpkg-deb -f "$D" Architecture)" = iphoneos-arm64e
          X="$(mktemp -d)"
          dpkg-deb -x "$D" "$X"
          DYLIB="$(find "$X" -name NextQuickReminder.dylib -print -quit)"
          test -n "$DYLIB"
          STRINGS="$RUNNER_TEMP/nqr108-strings.txt"
          strings -a "$DYLIB" > "$STRINGS"
          grep -q 'Keyboard focus request' "$STRINGS"
          grep -q 'Apple System Aperture reminder integration loaded' "$STRINGS"
          grep -q 'SBSystemApertureWindow' "$STRINGS"
          grep -q 'NextReminderDatabase.json' "$STRINGS"

      - name: Publish to package repository
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/nqr-release/NextQuickReminder_1.0.8_RootHide.deb"
          git config user.name "Next Solution Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p debfiles "$RUNNER_TEMP/nqr108-scan"
          cp "$D" debfiles/
          cp "$D" "$RUNNER_TEMP/nqr108-scan/"
          dpkg-scanpackages -m "$RUNNER_TEMP/nqr108-scan" /dev/null > "$RUNNER_TEMP/nqr108-stanzas"
          sed -i '' 's|^Filename: .*/nqr108-scan/|Filename: ./debfiles/|' "$RUNNER_TEMP/nqr108-stanzas"
          python3 - "$RUNNER_TEMP/nqr108-stanzas" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path('Packages')
          old=p.read_text() if p.exists() else ''
          rows=[x.strip() for x in re.split(r'\n\s*\n',old) if x.strip()]
          rows=[x for x in rows if not re.search(r'^Package: com\.nextsolution\.nextquickreminder$',x,re.M)]
          new=[x.strip() for x in re.split(r'\n\s*\n',Path(sys.argv[1]).read_text()) if x.strip()]
          p.write_text('\n\n'.join(rows+new)+'\n')
          PY
          gzip -9 -c Packages > Packages.gz
          bzip2 -9 -c Packages > Packages.bz2
          xz -9e -c Packages > Packages.xz
          zstd -19 -q -c Packages > Packages.zst
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import re
          p=Path('Release')
          t=p.read_text()
          m=re.search(r'^Version: (\d+)\.(\d+)\.(\d+)$',t,re.M)
          if m:
              t=re.sub(r'^Version: .*$',f'Version: {m.group(1)}.{m.group(2)}.{int(m.group(3))+1}',t,flags=re.M)
          t=re.sub(r'^Date: .*$', 'Date: '+datetime.now(timezone.utc).strftime('%a, %d %b %Y %H:%M:%S UTC'),t,flags=re.M)
          p.write_text(t)
          PY
          git add debfiles/NextQuickReminder_1.0.8_RootHide.deb Packages Packages.gz Packages.bz2 Packages.xz Packages.zst Release
          if git diff --cached --quiet; then
            echo "Repository already contains Next Quick Reminder 1.0.8"
            exit 0
          fi
          git commit -m "Publish Next Quick Reminder 1.0.8"
          git push origin HEAD:main
