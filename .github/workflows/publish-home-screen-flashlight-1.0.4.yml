name: Build and Publish Home Screen Flashlight 1.0.4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-home-screen-flashlight-1.0.4.yml"
      - "DailyTweaks/2026-07-31-NextHomeTorch/**"

permissions:
  contents: write

concurrency:
  group: home-screen-flashlight-1.0.4
  cancel-in-progress: false

jobs:
  build-publish:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install packaging tools
        run: brew install dpkg ldid xz zstd

      - name: Validate 1.0.4 source
        shell: bash
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/2026-07-31-NextHomeTorch"
          test -f "$P/Tweak.xm"
          test -f "$P/control"
          test -f "$P/Makefile"
          test -f "$P/NextHomeTorch.plist"
          test -f "$P/Preferences/Resources/Info.plist"
          test -f "$P/Preferences/Resources/Root.plist"
          test -f "$P/layout/Library/PreferenceLoader/Preferences/NextHomeTorch.plist"
          grep -q '^Name: Home Screen Flashlight$' "$P/control"
          grep -q '^Version: 1.0.4$' "$P/control"
          grep -q 'HSFVersion = @"1.0.4"' "$P/Tweak.xm"
          grep -q '%hook SBIconListView' "$P/Tweak.xm"
          grep -q 'tapCount == 2' "$P/Tweak.xm"
          grep -q 'SBUIFlashlightController' "$P/Tweak.xm"
          grep -q 'AVCaptureDevice' "$P/Tweak.xm"
          grep -q 'HSFTestNotification' "$P/Tweak.xm"
          grep -q '<string>1.0.4</string>' "$P/Preferences/Resources/Info.plist"
          plutil -lint "$P/Preferences/Resources/Info.plist"
          plutil -lint "$P/Preferences/Resources/Root.plist"
          plutil -lint "$P/layout/Library/PreferenceLoader/Preferences/NextHomeTorch.plist"

      - name: Build rootless package
        shell: bash
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/2026-07-31-NextHomeTorch"
          OUT="$RUNNER_TEMP/hsf-release"
          mkdir -p "$OUT"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos-rootless"
          export THEOS="$RUNNER_TEMP/theos-rootless"
          export THEOS_PACKAGE_SCHEME=rootless
          rm -rf "$P/packages"
          make -C "$P" clean package FINALPACKAGE=1
          D="$(find "$P/packages" -type f -name '*_iphoneos-arm64.deb' -print -quit)"
          test -n "$D"
          cp "$D" "$OUT/HomeScreenFlashlight_1.0.4_Rootless.deb"

      - name: Build RootHide package
        shell: bash
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/2026-07-31-NextHomeTorch"
          OUT="$RUNNER_TEMP/hsf-release"
          git init "$RUNNER_TEMP/theos-roothide"
          git -C "$RUNNER_TEMP/theos-roothide" remote add origin https://github.com/roothide/theos.git
          git -C "$RUNNER_TEMP/theos-roothide" fetch --depth 1 origin 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$RUNNER_TEMP/theos-roothide" checkout --detach 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$RUNNER_TEMP/theos-roothide" submodule update --init --recursive --depth 1
          sed -i '' 's/^Architecture: iphoneos-arm64$/Architecture: iphoneos-arm64e/' "$P/control"
          export THEOS="$RUNNER_TEMP/theos-roothide"
          export THEOS_PACKAGE_SCHEME=roothide
          rm -rf "$P/packages"
          make -C "$P" clean package FINALPACKAGE=1
          D="$(find "$P/packages" -type f -name '*_iphoneos-arm64e.deb' -print -quit)"
          test -n "$D"
          cp "$D" "$OUT/HomeScreenFlashlight_1.0.4_RootHide.deb"

      - name: Validate packages
        shell: bash
        run: |
          set -euo pipefail
          check_package() {
            D="$1"
            ARCH="$2"
            X="$(mktemp -d)"
            test "$(dpkg-deb -f "$D" Package)" = "com.nextsolution.nexthometorch"
            test "$(dpkg-deb -f "$D" Name)" = "Home Screen Flashlight"
            test "$(dpkg-deb -f "$D" Version)" = "1.0.4"
            test "$(dpkg-deb -f "$D" Architecture)" = "$ARCH"
            dpkg-deb -x "$D" "$X"
            find "$X" -name NextHomeTorch.dylib | grep -q .
            find "$X" -path '*NextHomeTorchPreferences.bundle/Root.plist' | grep -q .
            find "$X" -path '*PreferenceLoader/Preferences/NextHomeTorch.plist' | grep -q .
            rm -rf "$X"
          }
          O="$RUNNER_TEMP/hsf-release"
          check_package "$O/HomeScreenFlashlight_1.0.4_Rootless.deb" iphoneos-arm64
          check_package "$O/HomeScreenFlashlight_1.0.4_RootHide.deb" iphoneos-arm64e

      - name: Publish to Sileo repository
        shell: bash
        run: |
          set -euo pipefail
          O="$RUNNER_TEMP/hsf-release"
          git config user.name "Next Jailbreak Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p debfiles "$RUNNER_TEMP/hsf-scan"
          cp "$O/HomeScreenFlashlight_1.0.4_Rootless.deb" debfiles/
          cp "$O/HomeScreenFlashlight_1.0.4_RootHide.deb" debfiles/
          cp "$O"/*.deb "$RUNNER_TEMP/hsf-scan/"
          dpkg-scanpackages -m "$RUNNER_TEMP/hsf-scan" /dev/null > "$RUNNER_TEMP/hsf-stanzas"
          sed -i '' 's|^Filename: .*/hsf-scan/|Filename: ./debfiles/|' "$RUNNER_TEMP/hsf-stanzas"
          python3 - "$RUNNER_TEMP/hsf-stanzas" <<'PY'
          from pathlib import Path
          import re, sys
          packages = Path('Packages')
          old = packages.read_text() if packages.exists() else ''
          rows = [x.strip() for x in re.split(r'\n\s*\n', old) if x.strip()]
          rows = [x for x in rows if not re.search(r'^Package: com\.nextsolution\.nexthometorch$', x, re.M)]
          new = [x.strip() for x in re.split(r'\n\s*\n', Path(sys.argv[1]).read_text()) if x.strip()]
          packages.write_text('\n\n'.join(rows + new) + '\n')
          PY
          gzip -9 -c Packages > Packages.gz
          bzip2 -9 -c Packages > Packages.bz2
          xz -9e -c Packages > Packages.xz
          zstd -19 -q -c Packages > Packages.zst
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import re
          release = Path('Release')
          text = release.read_text()
          match = re.search(r'^Version: (\d+)\.(\d+)\.(\d+)$', text, re.M)
          if match:
              text = re.sub(r'^Version: .*$', f'Version: {match.group(1)}.{match.group(2)}.{int(match.group(3)) + 1}', text, flags=re.M)
          text = re.sub(r'^Date: .*$', 'Date: ' + datetime.now(timezone.utc).strftime('%a, %d %b %Y %H:%M:%S UTC'), text, flags=re.M)
          release.write_text(text)
          PY
          git add debfiles/HomeScreenFlashlight_1.0.4_Rootless.deb debfiles/HomeScreenFlashlight_1.0.4_RootHide.deb Packages Packages.gz Packages.bz2 Packages.xz Packages.zst Release
          git commit -m "Publish Home Screen Flashlight 1.0.4"
          git push origin HEAD:main
