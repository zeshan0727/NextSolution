name: Build NextLock Release DEBs

on:
  workflow_dispatch:
  push:
    branches: [agent/lockglyphtime]
    paths:
      - "DailyTweaks/LockGlyphTime/**"
      - ".github/workflows/build-lockglyphtime.yml"

permissions:
  contents: write

concurrency:
  group: nextlock-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install dpkg ldid xz zstd

      - name: Generate and validate source
        shell: bash
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/LockGlyphTime"
          python3 "$P/prefs/generate_root.py"
          python3 "$P/patch_v023.py"
          for f in RuntimeV022.xm RuntimeV023.xm LockGlyphTime.plist control Makefile patch_v023.py prefs/Makefile prefs/LGTListController.m prefs/LGTListControllerV023.m prefs/generate_root.py prefs/Resources/Root.plist prefs/Resources/Time.plist prefs/Resources/Date.plist prefs/Resources/Icon.plist prefs/Resources/Photo.plist prefs/Resources/Advanced.plist prefs/Resources/About.plist prefs/Resources/Info.plist prefs/Resources/NextLockIcon.png layout/Library/PreferenceLoader/Preferences/LockGlyphTime.plist layout/Library/PreferenceLoader/Preferences/NextLockIcon.png layout/Library/PreferenceLoader/Preferences/NextLockIcon@2x.png layout/Library/PreferenceLoader/Preferences/NextLockIcon@3x.png; do test -f "$P/$f"; done
          grep -q '^Name: NextLock$' "$P/control"
          grep -q '^Version: 1.0.1$' "$P/control"
          grep -q 'Version 1.0.1' "$P/prefs/Resources/About.plist"
          grep -q 'LockGlyphTime_FILES = RuntimeV023.xm' "$P/Makefile"
          grep -q 'LGTListControllerV023.m' "$P/prefs/Makefile"
          grep -q 'LGTImageHasVisibleTransparency' "$P/RuntimeV023.xm"
          grep -q 'LGTIconHostView' "$P/RuntimeV023.xm"
          grep -q 'UIImagePNGRepresentation' "$P/prefs/LGTListControllerV023.m"
          grep -q 'NextLockIcon' "$P/prefs/LGTListControllerV023.m"
          grep -q 'title.text=@"NextLock"' "$P/prefs/LGTListControllerV023.m"
          grep -q 'Transparent PNG/sticker backgrounds are preserved' "$P/prefs/LGTListControllerV023.m"
          grep -q 'About NextLock' "$P/prefs/Resources/Root.plist"
          grep -q 'NEXTLOCK' "$P/prefs/Resources/About.plist"
          grep -q 'label = NextLock;' "$P/layout/Library/PreferenceLoader/Preferences/LockGlyphTime.plist"
          grep -q 'detail = LGTListController;' "$P/layout/Library/PreferenceLoader/Preferences/LockGlyphTime.plist"
          grep -q 'icon = NextLockIcon.png;' "$P/layout/Library/PreferenceLoader/Preferences/LockGlyphTime.plist"
          test "$(sips -g pixelWidth "$P/layout/Library/PreferenceLoader/Preferences/NextLockIcon.png" | awk '/pixelWidth/{print $2}')" = 29
          test "$(sips -g pixelWidth "$P/layout/Library/PreferenceLoader/Preferences/NextLockIcon@2x.png" | awk '/pixelWidth/{print $2}')" = 58
          test "$(sips -g pixelWidth "$P/layout/Library/PreferenceLoader/Preferences/NextLockIcon@3x.png" | awk '/pixelWidth/{print $2}')" = 87
          test ! -e "$P/prefs/Resources/NextStyleIcon.png"
          test ! -e "$P/layout/Library/PreferenceLoader/Preferences/NextStyleIcon.png"
          ! grep -R 'NextStyle' "$P" --include='*.yml' --include='*.yaml' --include='*.xm' --include='*.m' --include='*.py' --include='*.plist' --include='control' || exit 1
          ! grep -R 'nextsolution\.app' "$P" .github/workflows/build-lockglyphtime.yml --include='*.yml' --include='*.yaml' --include='*.xm' --include='*.m' --include='*.py' --include='*.plist' --include='control' || exit 1
          for f in Root Time Date Icon Photo Advanced About Info; do plutil -lint "$P/prefs/Resources/$f.plist"; done

      - name: Build Rootless
        shell: bash
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/LockGlyphTime"
          OUT="$RUNNER_TEMP/nextlock-release"
          mkdir -p "$OUT"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos-rootless"
          export THEOS="$RUNNER_TEMP/theos-rootless" THEOS_PACKAGE_SCHEME=rootless
          rm -rf "$P/packages"
          make -C "$P" clean package FINALPACKAGE=1
          DEB="$(find "$P/packages" -type f -name '*_iphoneos-arm64.deb' -print -quit)"
          test -n "$DEB"
          cp "$DEB" "$OUT/NextLock_1.0.1_Rootless.deb"

      - name: Build RootHide
        shell: bash
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/LockGlyphTime"
          OUT="$RUNNER_TEMP/nextlock-release"
          git init "$RUNNER_TEMP/theos-roothide"
          git -C "$RUNNER_TEMP/theos-roothide" remote add origin https://github.com/roothide/theos.git
          git -C "$RUNNER_TEMP/theos-roothide" fetch --depth 1 origin 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$RUNNER_TEMP/theos-roothide" checkout --detach 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$RUNNER_TEMP/theos-roothide" submodule update --init --recursive --depth 1
          sed -i '' 's/^Architecture: iphoneos-arm64$/Architecture: iphoneos-arm64e/' "$P/control"
          export THEOS="$RUNNER_TEMP/theos-roothide" THEOS_PACKAGE_SCHEME=roothide
          rm -rf "$P/packages"
          make -C "$P" clean package FINALPACKAGE=1
          DEB="$(find "$P/packages" -type f -name '*_iphoneos-arm64e.deb' -print -quit)"
          test -n "$DEB"
          cp "$DEB" "$OUT/NextLock_1.0.1_RootHide.deb"

      - name: Validate packages
        shell: bash
        run: |
          set -euo pipefail
          validate(){
            deb="$1"; arch="$2"; x="$(mktemp -d)"
            test "$(dpkg-deb -f "$deb" Version)" = 1.0.1
            test "$(dpkg-deb -f "$deb" Architecture)" = "$arch"
            test "$(dpkg-deb -f "$deb" Name)" = NextLock
            dpkg-deb -x "$deb" "$x"
            dylib="$(find "$x" -name LockGlyphTime.dylib -print -quit)"
            root="$(find "$x" -path '*LockGlyphTimePrefs.bundle/Root.plist' -print -quit)"
            about="$(find "$x" -path '*LockGlyphTimePrefs.bundle/About.plist' -print -quit)"
            prefsbin="$(find "$x" -path '*LockGlyphTimePrefs.bundle/LockGlyphTimePrefs' -print -quit)"
            headericon="$(find "$x" -path '*LockGlyphTimePrefs.bundle/NextLockIcon.png' -print -quit)"
            loaderdir="$(find "$x" -type d -path '*PreferenceLoader/Preferences' -print -quit)"
            entry="$loaderdir/LockGlyphTime.plist"
            icon1="$loaderdir/NextLockIcon.png"; icon2="$loaderdir/NextLockIcon@2x.png"; icon3="$loaderdir/NextLockIcon@3x.png"
            for f in "$dylib" "$root" "$about" "$prefsbin" "$headericon" "$entry" "$icon1" "$icon2" "$icon3"; do test -e "$f"; done
            grep -q 'About NextLock' "$root"
            grep -q 'NEXTLOCK' "$about"
            grep -q 'detail = LGTListController;' "$entry"
            grep -q 'icon = NextLockIcon.png;' "$entry"
            test "$(sips -g pixelWidth "$icon1" | awk '/pixelWidth/{print $2}')" = 29
            test "$(sips -g pixelWidth "$icon2" | awk '/pixelWidth/{print $2}')" = 58
            test "$(sips -g pixelWidth "$icon3" | awk '/pixelWidth/{print $2}')" = 87
            test -z "$(find "$x" -name 'NextStyleIcon*' -print -quit)"
            strings -a "$dylib" | grep -q LGTIconHostView
            strings -a "$dylib" | grep -q custom.photo
            strings -a "$prefsbin" | grep -q NextLock
            strings -a "$prefsbin" | grep -q 'Transparent PNG/sticker backgrounds are preserved'
            rm -rf "$x"
          }
          OUT="$RUNNER_TEMP/nextlock-release"
          validate "$OUT/NextLock_1.0.1_Rootless.deb" iphoneos-arm64
          validate "$OUT/NextLock_1.0.1_RootHide.deb" iphoneos-arm64e
          shasum -a 256 "$OUT"/*.deb | tee "$OUT/SHA256SUMS.txt"

      - name: Upload release packages
        uses: actions/upload-artifact@v4
        with:
          name: NextLock-1.0.1-DEBs
          path: |
            ${{ runner.temp }}/nextlock-release/NextLock_1.0.1_Rootless.deb
            ${{ runner.temp }}/nextlock-release/NextLock_1.0.1_RootHide.deb
            ${{ runner.temp }}/nextlock-release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish to NextSolution Transfer feed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/nextlock-release"
          SITE="$RUNNER_TEMP/nextsolution-site"
          git clone --depth 1 --branch main "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$SITE"
          DEST="$SITE/transfer/files/NextLock/1.0.1"
          mkdir -p "$DEST"
          cp "$OUT/NextLock_1.0.1_Rootless.deb" "$DEST/"
          cp "$OUT/NextLock_1.0.1_RootHide.deb" "$DEST/"
          cp "$OUT/SHA256SUMS.txt" "$DEST/"
          python3 - "$SITE/transfer/index.json" "$OUT" <<'PY'
          import json, pathlib, hashlib, datetime, sys
          manifest=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2])
          try: data=json.loads(manifest.read_text()) if manifest.exists() else {"version":1,"files":[]}
          except Exception: data={"version":1,"files":[]}
          def sha(name): return hashlib.sha256((out/name).read_bytes()).hexdigest()
          files=[x for x in data.get("files",[]) if not str(x.get("id","")).startswith(("lockglyphtime-","nextlock-"))]
          files=[
            {"id":"nextlock-1.0.1-rootless","name":"NextLock 1.0.1 Rootless","fileName":"NextLock_1.0.1_Rootless.deb","type":"deb","platform":"Dopamine / Rootless","version":"1.0.1","url":"https://nextsolution.cc/transfer/files/NextLock/1.0.1/NextLock_1.0.1_Rootless.deb","sha256":sha("NextLock_1.0.1_Rootless.deb"),"notes":"Final NextLock release with properly scaled Settings icon assets plus time, date, icon and transparent sticker-photo customization."},
            {"id":"nextlock-1.0.1-roothide","name":"NextLock 1.0.1 RootHide","fileName":"NextLock_1.0.1_RootHide.deb","type":"deb","platform":"RootHide","version":"1.0.1","url":"https://nextsolution.cc/transfer/files/NextLock/1.0.1/NextLock_1.0.1_RootHide.deb","sha256":sha("NextLock_1.0.1_RootHide.deb"),"notes":"Final NextLock release with properly scaled Settings icon assets plus time, date, icon and transparent sticker-photo customization."}
          ]+files
          payload={"version":1,"updatedAt":datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),"files":files}
          manifest.parent.mkdir(parents=True,exist_ok=True)
          manifest.write_text(json.dumps(payload,indent=2)+"\n")
          assert all((not str(x.get("url","")).startswith("http")) or ("nextsolution.cc" in str(x.get("url",""))) for x in files)
          PY
          git -C "$SITE" config user.name "github-actions[bot]"
          git -C "$SITE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$SITE" add transfer
          git -C "$SITE" commit -m "Publish NextLock 1.0.1 to Transfer" || exit 0
          git -C "$SITE" pull --rebase origin main
          git -C "$SITE" push origin main
