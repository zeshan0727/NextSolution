name: Build LockGlyphTime Test DEBs

on:
  workflow_dispatch:
  push:
    branches: [agent/lockglyphtime]
    paths:
      - "DailyTweaks/LockGlyphTime/**"
      - ".github/workflows/build-lockglyphtime.yml"

permissions:
  contents: write

concurrency:
  group: lockglyphtime-test
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install dpkg ldid xz zstd
      - name: Generate and validate source
        shell: bash
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/LockGlyphTime"
          python3 "$P/prefs/generate_root.py"
          for f in RuntimeV022.xm LockGlyphTime.plist control Makefile prefs/Makefile prefs/LGTListController.m prefs/generate_root.py prefs/Resources/Root.plist prefs/Resources/Info.plist layout/Library/PreferenceLoader/Preferences/LockGlyphTime.plist; do test -f "$P/$f"; done
          grep -q '^Version: 0.2.2$' "$P/control"
          grep -q 'LockGlyphTime_FILES = RuntimeV022.xm' "$P/Makefile"
          grep -q 'customPhotoData' "$P/RuntimeV022.xm"
          grep -q 'dispatch_async(dispatch_get_main_queue' "$P/RuntimeV022.xm"
          grep -q 'state.nativeCenter.x+x' "$P/RuntimeV022.xm"
          grep -q 'PHPickerViewController' "$P/prefs/LGTListController.m"
          grep -q 'LGTPhotoCropController' "$P/prefs/LGTListController.m"
          grep -q 'Choose / Edit Photo' "$P/prefs/Resources/Root.plist"
          grep -q 'Time Vertical Position' "$P/prefs/Resources/Root.plist"
          grep -q 'Date Vertical Position' "$P/prefs/Resources/Root.plist"
          grep -q 'Photo (Custom)' "$P/prefs/Resources/Root.plist"
          plutil -lint "$P/prefs/Resources/Root.plist"
          plutil -lint "$P/prefs/Resources/Info.plist"
      - name: Build rootless
        shell: bash
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/LockGlyphTime"; OUT="$RUNNER_TEMP/lockglyphtime-release"; mkdir -p "$OUT"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos-rootless"
          export THEOS="$RUNNER_TEMP/theos-rootless" THEOS_PACKAGE_SCHEME=rootless
          rm -rf "$P/packages"; make -C "$P" clean package FINALPACKAGE=1
          DEB="$(find "$P/packages" -type f -name '*_iphoneos-arm64.deb' -print -quit)"; test -n "$DEB"
          cp "$DEB" "$OUT/LockGlyphTime_0.2.2_Rootless.deb"
      - name: Build RootHide
        shell: bash
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/LockGlyphTime"; OUT="$RUNNER_TEMP/lockglyphtime-release"
          git init "$RUNNER_TEMP/theos-roothide"
          git -C "$RUNNER_TEMP/theos-roothide" remote add origin https://github.com/roothide/theos.git
          git -C "$RUNNER_TEMP/theos-roothide" fetch --depth 1 origin 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$RUNNER_TEMP/theos-roothide" checkout --detach 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$RUNNER_TEMP/theos-roothide" submodule update --init --recursive --depth 1
          sed -i '' 's/^Architecture: iphoneos-arm64$/Architecture: iphoneos-arm64e/' "$P/control"
          export THEOS="$RUNNER_TEMP/theos-roothide" THEOS_PACKAGE_SCHEME=roothide
          rm -rf "$P/packages"; make -C "$P" clean package FINALPACKAGE=1
          DEB="$(find "$P/packages" -type f -name '*_iphoneos-arm64e.deb' -print -quit)"; test -n "$DEB"
          cp "$DEB" "$OUT/LockGlyphTime_0.2.2_RootHide.deb"
      - name: Validate packages
        shell: bash
        run: |
          set -euo pipefail
          validate(){ deb="$1"; arch="$2"; x="$(mktemp -d)"; test "$(dpkg-deb -f "$deb" Version)" = 0.2.2; test "$(dpkg-deb -f "$deb" Architecture)" = "$arch"; dpkg-deb -x "$deb" "$x"; dylib="$(find "$x" -name LockGlyphTime.dylib -print -quit)"; root="$(find "$x" -path '*LockGlyphTimePrefs.bundle/Root.plist' -print -quit)"; prefsbin="$(find "$x" -path '*LockGlyphTimePrefs.bundle/LockGlyphTimePrefs' -print -quit)"; test -n "$dylib"; test -n "$root"; test -n "$prefsbin"; grep -q 'Choose / Edit Photo' "$root"; grep -q 'Photo (Custom)' "$root"; strings -a "$dylib" | grep -q customPhotoData; strings -a "$dylib" | grep -q custom.photo; strings -a "$prefsbin" | grep -q openCustomPhotoPicker; rm -rf "$x"; }
          OUT="$RUNNER_TEMP/lockglyphtime-release"
          validate "$OUT/LockGlyphTime_0.2.2_Rootless.deb" iphoneos-arm64
          validate "$OUT/LockGlyphTime_0.2.2_RootHide.deb" iphoneos-arm64e
          shasum -a 256 "$OUT"/*.deb | tee "$OUT/SHA256SUMS.txt"
      - name: Upload test packages
        uses: actions/upload-artifact@v4
        with:
          name: LockGlyphTime-0.2.2-Test-DEBs
          path: |
            ${{ runner.temp }}/lockglyphtime-release/LockGlyphTime_0.2.2_Rootless.deb
            ${{ runner.temp }}/lockglyphtime-release/LockGlyphTime_0.2.2_RootHide.deb
            ${{ runner.temp }}/lockglyphtime-release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
      - name: Publish to NextSolution Transfer feed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/lockglyphtime-release"
          SITE="$RUNNER_TEMP/nextsolution-site"
          git clone --depth 1 --branch main "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$SITE"
          DEST="$SITE/transfer/files/LockGlyphTime/0.2.2"
          mkdir -p "$DEST"
          cp "$OUT/LockGlyphTime_0.2.2_Rootless.deb" "$DEST/"
          cp "$OUT/LockGlyphTime_0.2.2_RootHide.deb" "$DEST/"
          cp "$OUT/SHA256SUMS.txt" "$DEST/"
          python3 - "$SITE/transfer/index.json" "$OUT" <<'PY'
          import json, pathlib, hashlib, datetime, sys
          manifest = pathlib.Path(sys.argv[1])
          out = pathlib.Path(sys.argv[2])
          try:
              data = json.loads(manifest.read_text()) if manifest.exists() else {"version": 1, "files": []}
          except Exception:
              data = {"version": 1, "files": []}
          def sha(name):
              return hashlib.sha256((out/name).read_bytes()).hexdigest()
          ids = {"lockglyphtime-0.2.2-rootless", "lockglyphtime-0.2.2-roothide"}
          files = [x for x in data.get("files", []) if x.get("id") not in ids]
          files = [
              {
                  "id":"lockglyphtime-0.2.2-rootless",
                  "name":"LockGlyphTime 0.2.2 Rootless",
                  "fileName":"LockGlyphTime_0.2.2_Rootless.deb",
                  "type":"deb",
                  "platform":"Dopamine / Rootless",
                  "version":"0.2.2",
                  "url":"https://nextsolution.app/transfer/files/LockGlyphTime/0.2.2/LockGlyphTime_0.2.2_Rootless.deb",
                  "sha256":sha("LockGlyphTime_0.2.2_Rootless.deb"),
                  "notes":"Standard rootless build."
              },
              {
                  "id":"lockglyphtime-0.2.2-roothide",
                  "name":"LockGlyphTime 0.2.2 RootHide",
                  "fileName":"LockGlyphTime_0.2.2_RootHide.deb",
                  "type":"deb",
                  "platform":"RootHide",
                  "version":"0.2.2",
                  "url":"https://nextsolution.app/transfer/files/LockGlyphTime/0.2.2/LockGlyphTime_0.2.2_RootHide.deb",
                  "sha256":sha("LockGlyphTime_0.2.2_RootHide.deb"),
                  "notes":"RootHide package build."
              }
          ] + files
          payload = {
              "version": 1,
              "updatedAt": datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
              "files": files
          }
          manifest.parent.mkdir(parents=True, exist_ok=True)
          manifest.write_text(json.dumps(payload, indent=2) + "\n")
          PY
          git -C "$SITE" config user.name "github-actions[bot]"
          git -C "$SITE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$SITE" add transfer
          git -C "$SITE" commit -m "Publish LockGlyphTime 0.2.2 to Transfer" || exit 0
          git -C "$SITE" push origin main
