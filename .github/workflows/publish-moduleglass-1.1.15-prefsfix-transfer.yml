name: Publish Module Glass 1.1.15 Preferences Fix to NS Transfer

on:
  push:
    branches: [main]
    paths:
      - '.transfer-staging/moduleglass-1.1.15-prefsfix/trigger'

permissions:
  contents: write

concurrency:
  group: publish-moduleglass-1.1.15-prefsfix-transfer
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and publish Module Glass
        shell: bash
        env:
          EXPECTED_SHA: 924c2dd3f28d339c0a51c16e97f9d2d54a74d5eb7d3c55403e8275907d5faa5f
          EXPECTED_SIZE: '32168'
        run: |
          set -euo pipefail
          STAGE='.transfer-staging/moduleglass-1.1.15-prefsfix'
          DEST_DIR='transfer/files/ModuleGlass/1.1.15-PrefsFix'
          DEST="$DEST_DIR/ModuleGlass_1.1.15_PreferencesFix_RootHide.deb"
          mkdir -p "$DEST_DIR"

          cat "$STAGE"/part*.b64 | base64 -d > "$DEST"
          test "$(sha256sum "$DEST" | awk '{print $1}')" = "$EXPECTED_SHA"
          test "$(stat -c '%s' "$DEST")" = "$EXPECTED_SIZE"

          python3 - <<'PYINDEX'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone

          p = Path('transfer/index.json')
          data = json.loads(p.read_text())
          files = data.get('files', [])
          entry_id = 'moduleglass-1.1.15-prefsfix-roothide'
          files = [x for x in files if x.get('id') != entry_id]
          entry = {
              'id': entry_id,
              'name': 'Module Glass 1.1.15 Preferences Fix RootHide',
              'fileName': 'ModuleGlass_1.1.15_PreferencesFix_RootHide.deb',
              'type': 'deb',
              'platform': 'RootHide',
              'version': '1.1.15+prefsfix1',
              'url': 'https://nextsolution.cc/transfer/files/ModuleGlass/1.1.15-PrefsFix/ModuleGlass_1.1.15_PreferencesFix_RootHide.deb',
              'sha256': os.environ['EXPECTED_SHA'],
              'sizeBytes': int(os.environ['EXPECTED_SIZE']),
              'notes': 'Restores the missing PreferenceLoader entry so Module Glass appears in Settings while keeping the 1.1.15 ExternalHostIsolation Control Center runtime unchanged.'
          }
          data['files'] = [entry] + files
          data['updatedAt'] = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          p.write_text(json.dumps(data, indent=2) + '\n')
          PYINDEX

          python3 -m json.tool transfer/index.json >/dev/null
          grep -q 'moduleglass-1.1.15-prefsfix-roothide' transfer/index.json
          grep -q "$EXPECTED_SHA" transfer/index.json

          git config user.name 'Next Solution Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add "$DEST" transfer/index.json
          git rm -r "$STAGE"
          git rm .github/workflows/publish-moduleglass-1.1.15-prefsfix-transfer.yml
          git diff --cached --check
          git commit -m 'Publish Module Glass 1.1.15 preferences fix to Transfer'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
