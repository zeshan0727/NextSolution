name: Temp NQR 1.0.16 Persistent Timer Inspector
on:
  pull_request:
    branches: [main]
    paths:
      - 'tmp-build-1331/**'
permissions:
  contents: read
jobs:
  inspect:
    if: github.head_ref == 'build-next-reminder-1331-working'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Import verified tweak source payloads
        shell: bash
        run: |
          git fetch --depth 1 origin build-next-reminder-1322-working
          git checkout FETCH_HEAD -- tmp-build
          git fetch --depth 1 origin build-next-reminder-1325-working
          git checkout FETCH_HEAD -- tmp-build-1325/patch
          git fetch --depth 1 origin build-next-reminder-1330-working
          git checkout FETCH_HEAD -- tmp-build-1330/tweak1015.patch.xz.b64
      - name: Reconstruct current 1.0.15 source
        shell: bash
        run: bash tmp-build-1331/inspect.sh
      - uses: actions/upload-artifact@v4
        with:
          name: NQR-1.0.15-Persistent-Timer-Inspection
          path: ${{ runner.temp }}/inspect/
          if-no-files-found: error
          retention-days: 1
