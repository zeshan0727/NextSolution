name: Temp Next Reminder 1.3.27 Inspector
on:
  pull_request:
    branches: [main]
    paths:
      - 'tmp-build-1327/**'
permissions:
  contents: read
jobs:
  inspect:
    if: github.head_ref == 'build-next-reminder-1327-working'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Import source payloads and patches
        shell: bash
        run: |
          git fetch --depth 1 origin build-next-reminder-1322-working
          git checkout FETCH_HEAD -- tmp-build
          git fetch --depth 1 origin build-next-reminder-1325-working
          git checkout FETCH_HEAD -- tmp-build-1325/patch
          git fetch --depth 1 origin build-next-reminder-1326-working
          git checkout FETCH_HEAD -- tmp-build-1326/app1326.patch.xz.b64
      - name: Reconstruct current source
        shell: bash
        run: bash tmp-build-1327/inspect.sh
      - uses: actions/upload-artifact@v4
        with:
          name: NextReminder-1.3.26-Source-Inspection
          path: ${{ runner.temp }}/inspect/
          if-no-files-found: error
          retention-days: 1
