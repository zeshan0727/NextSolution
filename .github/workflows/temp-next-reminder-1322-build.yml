name: Temp Next Reminder 1.3.24 Builder
on:
  pull_request:
    branches: [main]
    paths:
      - 'tmp-build/**'
permissions:
  contents: read
jobs:
  build:
    if: github.head_ref == 'build-next-reminder-1322-working'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate packages
        shell: bash
        run: bash tmp-build/build-next-reminder-1324.sh
      - uses: actions/upload-artifact@v4
        with:
          name: NextReminder-1.3.24-PDF-Report-Test
          path: |
            ${{ runner.temp }}/out/NextReminder_1.3.24_Unsigned.tipa
            ${{ runner.temp }}/out/NextQuickReminder_1.0.13_RootHide.deb
            ${{ runner.temp }}/out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
