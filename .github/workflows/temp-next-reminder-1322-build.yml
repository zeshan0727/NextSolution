name: Temp Next Reminder 1.3.30 Gmail Sender Inspector
on:
  pull_request:
    branches: [main]
    paths:
      - 'tmp-build-1332/**'
      - '.github/workflows/temp-next-reminder-1322-build.yml'
permissions:
  contents: read
jobs:
  inspect:
    if: github.head_ref == 'build-next-reminder-1332-working'
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Import verified source payloads and prior patches
        shell: bash
        run: |
          git fetch --depth 1 origin build-next-reminder-1322-working
          git checkout FETCH_HEAD -- tmp-build
          git fetch --depth 1 origin build-next-reminder-1325-working
          git checkout FETCH_HEAD -- tmp-build-1325/patch
          git fetch --depth 1 origin build-next-reminder-1326-working
          git checkout FETCH_HEAD -- tmp-build-1326/app1326.patch.xz.b64
          git fetch --depth 1 origin build-next-reminder-1328-working
          git checkout FETCH_HEAD -- tmp-build-1328/build.sh
          git fetch --depth 1 origin build-next-reminder-1329-working
          git checkout FETCH_HEAD -- tmp-build-1329/build.sh tmp-build-1329/PendingReports.swift
          git fetch --depth 1 origin build-next-reminder-1330-working
          git checkout FETCH_HEAD -- tmp-build-1330/app1330.patch.xz.b64
      - name: Reconstruct and inspect Gmail sender paths
        shell: bash
        run: bash tmp-build-1332/inspect.sh
      - uses: actions/upload-artifact@v4
        with:
          name: NextReminder-1.3.30-Gmail-Sender-Inspection
          path: ${{ runner.temp }}/inspect/
          if-no-files-found: error
          retention-days: 1
