name: Temp Next Reminder 1.3.30 + NQR 1.0.15 Builder
on:
  pull_request:
    branches: [main]
    paths:
      - 'tmp-build-1330/**'
permissions:
  contents: read
jobs:
  build:
    if: github.head_ref == 'build-next-reminder-1330-working'
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Import verified app and tweak source payloads
        shell: bash
        run: |
          git fetch --depth 1 origin build-next-reminder-1322-working
          git checkout FETCH_HEAD -- tmp-build
          git fetch --depth 1 origin build-next-reminder-1325-working
          git checkout FETCH_HEAD -- tmp-build-1325/patch
          git fetch --depth 1 origin build-next-reminder-1326-working
          git checkout FETCH_HEAD -- tmp-build-1326/app1326.patch.xz.b64
          git fetch --depth 1 origin build-next-reminder-1328-working
          git checkout FETCH_HEAD -- tmp-build-1328/build.sh
          git fetch --depth 1 origin build-next-reminder-1329-working
          git checkout FETCH_HEAD -- tmp-build-1329/build.sh tmp-build-1329/PendingReports.swift
      - name: Build and validate app + RootHide tweak
        shell: bash
        run: bash tmp-build-1330/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: NextReminder-1.3.30-NQR-1.0.15-Automatic-Reports
          path: |
            ${{ runner.temp }}/out/NextReminder_1.3.30_Unsigned.tipa
            ${{ runner.temp }}/out/NextQuickReminder_1.0.15_RootHide.deb
            ${{ runner.temp }}/out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
