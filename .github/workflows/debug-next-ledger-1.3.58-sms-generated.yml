name: Debug Next Ledger 1.3.58 SMS Generated Sources

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/debug-next-ledger-1.3.58-sms-generated-trigger.txt"
      - ".github/workflows/debug-next-ledger-1.3.58-sms-generated.yml"

jobs:
  generate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patches through 1.3.58
        run: |
          bash scripts/apply_next_ledger_1_3_57.sh
          python3 scripts/fix_sms_ai_loop_1_3_58.py
      - name: Upload generated SMS sources
        uses: actions/upload-artifact@v4
        with:
          name: NextLedger-1.3.58-Generated-SMS-Sources
          path: |
            RootHideSMSQueue/Sources/main.m
            DailyLedger/Services/SMSImportConsoleService.swift
            DailyLedger/Services/SMSAIRecognitionService.swift
            DailyLedger/Views/SMSImportConsoleView.swift
            DailyLedger/Views/SMSDraftInboxView.swift
            DailyLedger/DailyLedgerApp.swift
            DailyLedger/Services/OpenAIService.swift
      - name: Publish generated sources for inspection
        shell: bash
        run: |
          rm -rf .debug-generated/next-ledger-1.3.58
          mkdir -p .debug-generated/next-ledger-1.3.58/RootHideSMSQueue/Sources
          mkdir -p .debug-generated/next-ledger-1.3.58/DailyLedger/Services
          mkdir -p .debug-generated/next-ledger-1.3.58/DailyLedger/Views
          mkdir -p .debug-generated/next-ledger-1.3.58/DailyLedger
          cp RootHideSMSQueue/Sources/main.m .debug-generated/next-ledger-1.3.58/RootHideSMSQueue/Sources/main.m
          cp DailyLedger/Services/SMSImportConsoleService.swift .debug-generated/next-ledger-1.3.58/DailyLedger/Services/
          cp DailyLedger/Services/SMSAIRecognitionService.swift .debug-generated/next-ledger-1.3.58/DailyLedger/Services/
          cp DailyLedger/Views/SMSImportConsoleView.swift .debug-generated/next-ledger-1.3.58/DailyLedger/Views/
          cp DailyLedger/Views/SMSDraftInboxView.swift .debug-generated/next-ledger-1.3.58/DailyLedger/Views/
          cp DailyLedger/DailyLedgerApp.swift .debug-generated/next-ledger-1.3.58/DailyLedger/
          cp DailyLedger/Services/OpenAIService.swift .debug-generated/next-ledger-1.3.58/DailyLedger/Services/
          git reset --hard HEAD
          git clean -fd -e .debug-generated
          git fetch origin "$GITHUB_REF_NAME"
          git checkout -B debug-publish "origin/$GITHUB_REF_NAME"
          git add -f .debug-generated/next-ledger-1.3.58
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish generated Next Ledger 1.3.58 SMS sources" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
