name: Diagnostic Clean Home Labels
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnostic-clean-home-labels.yml']
permissions:
  contents: write
concurrency:
  group: diagnostic-clean-home-labels-1.0.0
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: brew install dpkg ldid
      - name: Deterministic runtime and source checks
        run: |
          set +e
          python3 DailyTweaks/2026-08-13-CleanHomeLabels/tests/test_runtime.py > /tmp/chl-test-output.txt 2>&1
          rc=$?
          cat /tmp/chl-test-output.txt
          if [ "$rc" -ne 0 ]; then
            cp /tmp/chl-test-output.txt clean-home-labels-diagnostic.txt
            git config user.name 'Next Solution Diagnostic Bot'
            git config user.email 'actions@users.noreply.github.com'
            git pull --rebase origin main
            git add clean-home-labels-diagnostic.txt
            git commit -m 'Record Clean Home Labels diagnostic failure'
            git push origin main
            exit "$rc"
          fi
      - name: Build and inspect rootless
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/2026-08-13-CleanHomeLabels"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          export THEOS="$RUNNER_TEMP/theos" THEOS_PACKAGE_SCHEME=rootless
          make -C "$P" clean package FINALPACKAGE=1
          D="$(find "$P/packages" -name '*_iphoneos-arm64.deb' -print -quit)"; test -n "$D"
          test "$(dpkg-deb -f "$D" Package)" = com.nextsolution.cleanhomelabels
          test "$(dpkg-deb -f "$D" Version)" = 1.0.0
          test "$(dpkg-deb -f "$D" Architecture)" = iphoneos-arm64
          X="$(mktemp -d)"; dpkg-deb -x "$D" "$X"
          DYLIB="$(find "$X" -name CleanHomeLabels.dylib -print -quit)"; test -n "$DYLIB"
          strings -a "$DYLIB" | grep -q 'setLabelHidden:'
          strings -a "$DYLIB" | grep -q 'com.nextsolution.cleanhomelabels'
          test -n "$(find "$X" -path '*CleanHomeLabelsPreferences.bundle/Root.plist' -print -quit)"
          test -n "$(find "$X" -path '*PreferenceLoader/Preferences/CleanHomeLabels.plist' -print -quit)"
      - name: Build and inspect RootHide
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/2026-08-13-CleanHomeLabels"
          git init "$RUNNER_TEMP/theos-rh"
          git -C "$RUNNER_TEMP/theos-rh" remote add origin https://github.com/roothide/theos.git
          git -C "$RUNNER_TEMP/theos-rh" fetch --depth 1 origin 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$RUNNER_TEMP/theos-rh" checkout --detach 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$RUNNER_TEMP/theos-rh" submodule update --init --recursive --depth 1
          sed -i '' 's/^Architecture: iphoneos-arm64$/Architecture: iphoneos-arm64e/' "$P/control"
          export THEOS="$RUNNER_TEMP/theos-rh" THEOS_PACKAGE_SCHEME=roothide
          rm -rf "$P/packages"; make -C "$P" clean package FINALPACKAGE=1
          D="$(find "$P/packages" -name '*_iphoneos-arm64e.deb' -print -quit)"; test -n "$D"
          test "$(dpkg-deb -f "$D" Package)" = com.nextsolution.cleanhomelabels
          test "$(dpkg-deb -f "$D" Version)" = 1.0.0
          test "$(dpkg-deb -f "$D" Architecture)" = iphoneos-arm64e
          X="$(mktemp -d)"; dpkg-deb -x "$D" "$X"
          DYLIB="$(find "$X" -name CleanHomeLabels.dylib -print -quit)"; test -n "$DYLIB"
          strings -a "$DYLIB" | grep -q 'setLabelHidden:'
          strings -a "$DYLIB" | grep -q 'com.nextsolution.cleanhomelabels.respring'
          test -n "$(find "$X" -path '*CleanHomeLabelsPreferences.bundle/Root.plist' -print -quit)"
          git checkout -- "$P/control"
      - name: Record diagnostic PASS
        run: |
          set -euo pipefail
          cat > clean-home-labels-build.txt <<'EOF'
          PASS 14/14 deterministic/source validation cases
          ROOTLESS BUILD PASS
          ROOTHIDE BUILD PASS
          PACKAGE INSPECTION PASS
          DIAGNOSTIC BUILD PASS
          EOF
          git config user.name 'Next Solution Diagnostic Bot'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase origin main
          rm -f clean-home-labels-diagnostic.txt
          git add -A clean-home-labels-build.txt clean-home-labels-diagnostic.txt
          git commit -m 'Record Clean Home Labels diagnostic build PASS'
          git push origin main
