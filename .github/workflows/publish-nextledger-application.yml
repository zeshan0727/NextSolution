# Publishes checksum-verified Sileo and TrollStore application files.
name: Publish Next Ledger Application

on:
  push:
    branches: [main]
    paths:
      - "build-input/nextledger-1.3.41/**"
      - ".github/workflows/publish-nextledger-application.yml"

permissions:
  contents: write

concurrency:
  group: publish-nextledger-application
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reconstruct and verify packages
        run: |
          mkdir -p applications debfiles
          cat build-input/nextledger-1.3.41/tipa.b64.part* | base64 --decode > applications/NextLedger-1.3.41.tipa
          cat build-input/nextledger-1.3.41/deb.b64.part* | base64 --decode > debfiles/NextLedger_1.3.41_iphoneos-arm64e.deb
          echo "35281a7ad27239287578d90d036e5f0300df9da006b91e15d2d528d9993e0ad9  applications/NextLedger-1.3.41.tipa" | sha256sum --check
          echo "9ea4ab68c2b78a6b95ca6da76ba29581b3dbe9c1d0ef2a6f632b18055a7aa2a3  debfiles/NextLedger_1.3.41_iphoneos-arm64e.deb" | sha256sum --check
          dpkg-deb --info debfiles/NextLedger_1.3.41_iphoneos-arm64e.deb

      - name: Publish verified binaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add applications/NextLedger-1.3.41.tipa debfiles/NextLedger_1.3.41_iphoneos-arm64e.deb
          if git diff --cached --quiet; then
            echo "Verified binaries are already published."
            exit 0
          fi
          git commit -m "Publish verified Next Ledger 1.3.41 binaries"
          git pull --rebase origin main
          git push origin HEAD:main
