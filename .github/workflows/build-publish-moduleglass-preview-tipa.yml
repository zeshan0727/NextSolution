name: Build and Publish Module Glass Developer Console

on:
  workflow_dispatch:
  push:
    paths:
      - 'ModuleGlassPreview/**'
      - '.github/workflows/build-publish-moduleglass-preview-tipa.yml'

permissions:
  contents: write

concurrency:
  group: module-glass-preview-tipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ModuleGlassPreview
        run: xcodegen generate

      - name: Build unsigned iPhone app
        working-directory: ModuleGlassPreview
        run: |
          set -o pipefail
          rm -rf build build-output Payload
          mkdir -p build-output
          xcodebuild \
            -project ModuleGlassPreview.xcodeproj \
            -scheme ModuleGlassPreview \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build-output/xcodebuild.log

      - name: Validate app metadata and sign for TrollStore
        working-directory: ModuleGlassPreview
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/ModuleGlassPreview.app"
          test -d "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = "1.1.1"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "com.nextsolution.moduleglasspreview"
          /usr/bin/codesign --force --sign - --entitlements ModuleGlassPreview.entitlements --generate-entitlement-der "$APP"
          /usr/bin/codesign --verify --verbose=2 "$APP"
          /usr/bin/codesign -d --entitlements :- "$APP" > build-output/embedded-entitlements.plist 2>&1 || true
          grep -q "com.apple.private.security.no-container" build-output/embedded-entitlements.plist
          grep -q "platform-application" build-output/embedded-entitlements.plist

      - name: Package and validate TIPA
        working-directory: ModuleGlassPreview
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ModuleGlassPreview.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload ModuleGlass-Preview-1.1.1.tipa
          cp ModuleGlass-Preview-1.1.1.tipa build-output/ModuleGlass-Preview-1.1.1.tipa
          shasum -a 256 ModuleGlass-Preview-1.1.1.tipa | tee build-output/ModuleGlass-Preview-1.1.1.sha256
          unzip -l ModuleGlass-Preview-1.1.1.tipa | grep -q "Payload/ModuleGlassPreview.app/ModuleGlassPreview"
          test -s ModuleGlass-Preview-1.1.1.tipa

      - name: Publish to NextSolution Transfer feed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

          DEST="transfer/files/ModuleGlassPreview/1.1.1/ModuleGlass-Preview-1.1.1.tipa"
          mkdir -p "$(dirname "$DEST")"
          cp ModuleGlassPreview/ModuleGlass-Preview-1.1.1.tipa "$DEST"
          SHA=$(shasum -a 256 "$DEST" | awk '{print $1}')
          SIZE=$(stat -f '%z' "$DEST")

          python3 - "$SHA" "$SIZE" <<'PY'
          import json, sys
          from datetime import datetime, timezone
          from pathlib import Path

          sha, size = sys.argv[1], int(sys.argv[2])
          p = Path('transfer/index.json')
          data = json.loads(p.read_text()) if p.exists() else {'version': 1, 'files': []}
          entry = {
              'id': 'module-glass-preview-1.1.1',
              'name': 'Module Glass Developer Console 1.1.1',
              'fileName': 'ModuleGlass-Preview-1.1.1.tipa',
              'type': 'tipa',
              'platform': 'TrollStore / Jailbroken iOS 16+',
              'version': '1.1.1',
              'url': 'https://nextjailbreak.com/transfer/files/ModuleGlassPreview/1.1.1/ModuleGlass-Preview-1.1.1.tipa',
              'sha256': sha,
              'notes': 'Auto Log Collector release. One-tap full Module Glass test enables the real Stable Recovery verbose runtime logger, refreshes tracked Control Center controllers, checks every module image, parses per-module SpringBoard diagnostics, saves .log + .json automatically, and auto-uploads when a Keychain GitHub token is configured.'
          }
          files = [x for x in data.get('files', []) if x.get('id') != entry['id']]
          data['version'] = data.get('version', 1)
          data['updatedAt'] = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          data['files'] = [entry] + files
          p.write_text(json.dumps(data, indent=2) + '\n')
          PY

          git add -f "$DEST" transfer/index.json
          git commit -m "Publish Module Glass Developer Console 1.1.1 to Transfer"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModuleGlass-Developer-Console-1.1.1
          path: |
            ModuleGlassPreview/build-output/ModuleGlass-Preview-1.1.1.tipa
            ModuleGlassPreview/build-output/ModuleGlass-Preview-1.1.1.sha256
            ModuleGlassPreview/build-output/embedded-entitlements.plist
            ModuleGlassPreview/build-output/xcodebuild.log
          if-no-files-found: error
