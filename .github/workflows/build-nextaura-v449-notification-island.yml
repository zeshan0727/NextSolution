name: Build NextAura 4.4.9 Notification Island

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    if: github.head_ref == 'agent/nextaura-4.4.9-notification-island'
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - run: brew install dpkg ldid xz
      - name: Validate local UI sources
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/2026-08-13-NextAuraNotificationIsland"
          plutil -lint "$P/DynamicIsland.plist"
          plutil -lint "$P/NextAuraNotificationIsland.plist"
          grep -q 'Content hidden while locked' "$P/NotificationIsland.xm"
          grep -q 'Test Notification Island' "$P/DynamicIsland.plist"
      - name: Build replacement module
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/2026-08-13-NextAuraNotificationIsland"
          python3 "$P/compile-fix.py"
          python3 "$P/layout-date.py"
          git init "$RUNNER_TEMP/theos-rh"
          git -C "$RUNNER_TEMP/theos-rh" remote add origin https://github.com/roothide/theos.git
          git -C "$RUNNER_TEMP/theos-rh" fetch --depth 1 origin 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$RUNNER_TEMP/theos-rh" checkout --detach 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$RUNNER_TEMP/theos-rh" submodule update --init --recursive --depth 1
          export THEOS="$RUNNER_TEMP/theos-rh" THEOS_PACKAGE_SCHEME=roothide
          make -C "$P" clean all FINALPACKAGE=1 2>&1 | tee nextaura-v449-build.log
          D="$(find "$P/.theos" -type f -name 'NextAuraNotificationIsland.dylib' -print | sort | tail -1)"
          test -n "$D"
          ldid -S "$D"
          mkdir -p "$RUNNER_TEMP/module"
          cp "$D" "$RUNNER_TEMP/module/NextAuraNotificationIsland.dylib"
      - name: Assemble NextAura 4.4.9
        run: |
          set -euo pipefail
          BASE="$GITHUB_WORKSPACE/debfiles/NextAura_4.4.8_RootHide_iOS16.deb"
          P="$GITHUB_WORKSPACE/DailyTweaks/2026-08-13-NextAuraNotificationIsland"
          STAGE="$RUNNER_TEMP/stage"; OUT="$RUNNER_TEMP/out"
          mkdir -p "$STAGE" "$OUT"
          dpkg-deb -R "$BASE" "$STAGE"
          DYLIBS="$STAGE/Library/MobileSubstrate/DynamicLibraries"
          PREFS="$STAGE/Library/PreferenceBundles/UnlockVibratePrefs.bundle"
          rm -f "$DYLIBS/DynamicIslandSuite.dylib" "$DYLIBS/DynamicIslandSuite.plist"
          cp "$RUNNER_TEMP/module/NextAuraNotificationIsland.dylib" "$DYLIBS/NextAuraNotificationIsland.dylib"
          cp "$P/NextAuraNotificationIsland.plist" "$DYLIBS/NextAuraNotificationIsland.plist"
          cp "$P/DynamicIsland.plist" "$PREFS/DynamicIsland.plist"
          sed -i '' 's/^Version: .*/Version: 4.4.9/' "$STAGE/DEBIAN/control"
          dpkg-deb -Zxz -b "$STAGE" "$OUT/NextAura_4.4.9_RootHide_iOS16.deb"
          test "$(dpkg-deb -f "$OUT/NextAura_4.4.9_RootHide_iOS16.deb" Version)" = 4.4.9
          X="$(mktemp -d)"; dpkg-deb -x "$OUT/NextAura_4.4.9_RootHide_iOS16.deb" "$X"
          test ! -e "$X/Library/MobileSubstrate/DynamicLibraries/DynamicIslandSuite.dylib"
          test -e "$X/Library/MobileSubstrate/DynamicLibraries/NextAuraNotificationIsland.dylib"
          shasum -a 256 "$OUT/NextAura_4.4.9_RootHide_iOS16.deb" > "$OUT/NextAura_4.4.9_RootHide_iOS16-SHA256.txt"
          ditto -c -k --sequesterRsrc --keepParent "$P" "$OUT/NextAura_4.4.9_NotificationIsland_Source.zip"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NextAura-4.4.9-NotificationIsland
          path: |
            ${{ runner.temp }}/out/NextAura_4.4.9_RootHide_iOS16.deb
            ${{ runner.temp }}/out/NextAura_4.4.9_RootHide_iOS16-SHA256.txt
            ${{ runner.temp }}/out/NextAura_4.4.9_NotificationIsland_Source.zip
            nextaura-v449-build.log
