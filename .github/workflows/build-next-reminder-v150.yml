name: Build Next Reminder 1.3.20 Email Scheduler + RootHide Live Card Sync

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Validate 1.3.20 patch
        shell: bash
        run: |
          set -euo pipefail
          P=NextReminderApp
          grep -q 'New Scheduled Email' "$P/ci/patch_v150.py"
          grep -q 'envelope.badge.clock.fill' "$P/ci/patch_v150.py"
          grep -q 'refreshFromDisk' "$P/ci/patch_v150.py"
          grep -q '1.3.20' "$P/ci/adjust_build_v150.py"
          grep -q "grep -qx '30'" "$P/ci/adjust_build_v150.py"

      - name: Build Next Reminder 1.3.20
        shell: bash
        run: |
          set -o pipefail
          chmod +x NextReminderApp/ci/build-v150.sh
          NextReminderApp/ci/build-v150.sh 2>&1 | tee v150-app-build.log

      - name: Verify app package
        shell: bash
        run: |
          set -euo pipefail
          APP=NextReminderApp/build/NextReminder.app
          TIPA=NextReminderApp/NextReminder-v1.3.20-unsigned.tipa
          test -f "$TIPA"
          unzip -t "$TIPA" >/dev/null
          plutil -extract CFBundleShortVersionString raw "$APP/Info.plist" | grep -qx '1.3.20'
          plutil -extract CFBundleVersion raw "$APP/Info.plist" | grep -qx '30'
          EXT="$APP/PlugIns/NextReminderLiveActivity.appex"
          test -d "$EXT"
          plutil -extract CFBundleShortVersionString raw "$EXT/Info.plist" | grep -qx '1.3.20'
          grep -q 'New Scheduled Email' NextReminderApp/NextReminder/Sources/RootReminders.swift
          grep -q 'EmailSchedulesView' NextReminderApp/NextReminder/Sources/RootReminders.swift
          grep -q 'refreshFromDisk' NextReminderApp/NextReminder/Sources/Services.swift
          mkdir -p "$RUNNER_TEMP/next-reminder-v150"
          cp "$TIPA" "$RUNNER_TEMP/next-reminder-v150/NextReminder-v1.3.20-EmailScheduler-LiveCardSync.tipa"
          cp NextReminderApp/NextReminder-v1.3.20-unsigned.tipa.sha256 "$RUNNER_TEMP/next-reminder-v150/NextReminder-v1.3.20-SHA256.txt"
          ditto -c -k --sequesterRsrc --keepParent NextReminderApp "$RUNNER_TEMP/next-reminder-v150/NextReminder-v1.3.20-Source.zip"

      - name: Upload final package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NextReminder-v1.3.20-EmailScheduler-LiveCardSync
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/next-reminder-v150/NextReminder-v1.3.20-EmailScheduler-LiveCardSync.tipa
            ${{ runner.temp }}/next-reminder-v150/NextReminder-v1.3.20-SHA256.txt
            ${{ runner.temp }}/next-reminder-v150/NextReminder-v1.3.20-Source.zip
            v150-app-build.log
            NextReminderApp/xcodebuild.log
