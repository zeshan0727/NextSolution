name: Publish Next Signer to Transfer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-nextsigner-transfer.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-nextsigner-transfer
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_ID: '9326098805'
      VERSION: '1.1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download built Next Signer artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > "$RUNNER_TEMP/nextsigner-artifact.zip"
          mkdir -p "$RUNNER_TEMP/nextsigner-artifact"
          unzip -q "$RUNNER_TEMP/nextsigner-artifact.zip" -d "$RUNNER_TEMP/nextsigner-artifact"
          test -s "$RUNNER_TEMP/nextsigner-artifact/NextSigner-1.1.tipa"

      - name: Publish Next Signer and update Transfer manifest
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/nextsigner-artifact/NextSigner-1.1.tipa"
          DEST_DIR='transfer/files/NextSigner/1.1'
          DEST="$DEST_DIR/NextSigner-1.1.tipa"
          INDEX='transfer/index.json'

          test -s "$SRC"
          test -s "$INDEX"
          mkdir -p "$DEST_DIR"
          cp "$SRC" "$DEST"

          SHA256=$(sha256sum "$DEST" | awk '{print $1}')
          export SHA256

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone

          index_path = Path('transfer/index.json')
          data = json.loads(index_path.read_text())
          files = data.get('files', [])
          entry_id = 'nextsigner-1.1'
          files = [item for item in files if item.get('id') != entry_id]
          entry = {
              'id': entry_id,
              'name': 'Next Signer 1.1',
              'fileName': 'NextSigner-1.1.tipa',
              'type': 'tipa',
              'platform': 'TrollStore / iOS 16+',
              'version': '1.1',
              'url': 'https://nextsolution.cc/transfer/files/NextSigner/1.1/NextSigner-1.1.tipa',
              'sha256': os.environ['SHA256'],
              'notes': 'Next Signer 1.1. Imports a P12 certificate and mobileprovision profile, signs IPA files locally on-device with Zsign, verifies the signed output, and supports export/publish after successful signing.'
          }
          data['files'] = [entry] + files
          data['updatedAt'] = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          index_path.write_text(json.dumps(data, indent=2) + '\n')
          PY

          python3 -m json.tool "$INDEX" >/dev/null
          test "$(sha256sum "$DEST" | awk '{print $1}')" = "$SHA256"
          test "$SHA256" = 'a3f9254673118986e9e088e43d33955c46a8653b65595113d3ba82f3966a44c7'

      - name: Commit Transfer publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add transfer/files/NextSigner/1.1/NextSigner-1.1.tipa transfer/index.json
          git commit -m 'Publish Next Signer 1.1 to Transfer' || true
          git pull --rebase origin main
          git push origin HEAD:main
