name: Temporary Next Signer 1.3.6 Build

on:
  issues:
    types: [opened]
  push:
    branches: [main]
    paths:
      - 'NextSigner/build-trigger-136.txt'

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  build:
    if: github.event_name == 'push' || github.event.issue.title == '[NEXTSIGNER-1.3.6-BUILD]'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: '1.3.6'
      REPORT_ISSUE: '239'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          python3 NextSigner/generate_app_icon.py
          brew install xcodegen
          cd NextSigner
          xcodegen generate

      - name: Compile Next Signer 1.3.6
        working-directory: NextSigner
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project NextSigner.xcodeproj \
            -scheme NextSigner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/NextSigner136" \
            -resolvePackageDependencies
          xcodebuild \
            -project NextSigner.xcodeproj \
            -scheme NextSigner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/NextSigner136" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package TIPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find "$RUNNER_TEMP/NextSigner136/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name '*.app' | head -n1)"
          test -n "$APP_PATH" || { echo 'Built app not found'; exit 1; }
          rm -rf "$RUNNER_TEMP/package"
          mkdir -p "$RUNNER_TEMP/package/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/package/Payload/NextSigner.app"
          cd "$RUNNER_TEMP/package"
          /usr/bin/zip -qry "$RUNNER_TEMP/NextSigner-${VERSION}.ipa" Payload
          cp "$RUNNER_TEMP/NextSigner-${VERSION}.ipa" "$RUNNER_TEMP/NextSigner-${VERSION}.tipa"
          unzip -t "$RUNNER_TEMP/NextSigner-${VERSION}.tipa" >/dev/null
          echo "SHA256=$(shasum -a 256 "$RUNNER_TEMP/NextSigner-${VERSION}.tipa" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: NextSigner-1.3.6-TIPA
          path: |
            ${{ runner.temp }}/NextSigner-1.3.6.tipa
            ${{ runner.temp }}/NextSigner-1.3.6.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Start NS Transfer publisher
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow publish-nextsigner-transfer.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run publish-nextsigner-transfer.yml --repo "$GITHUB_REPOSITORY" --ref main -f version="$VERSION"
          RUN_ID=''
          for attempt in $(seq 1 30); do
            candidate="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow publish-nextsigner-transfer.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            if [ "$candidate" != "0" ] && [ "$candidate" != "$BEFORE" ]; then RUN_ID="$candidate"; break; fi
            sleep 2
          done
          test -n "$RUN_ID" || { echo 'Could not locate publisher run'; exit 1; }
          echo "PUBLISH_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          gh issue comment "$REPORT_ISSUE" --repo "$GITHUB_REPOSITORY" --body "NEXTSIGNER_1_3_6_PUBLISH_STARTED run=$RUN_ID sha256=$SHA256"

      - name: Wait for publisher
        run: gh run watch "$PUBLISH_RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status --interval 8

      - name: Report success
        if: success()
        run: gh issue comment "$REPORT_ISSUE" --repo "$GITHUB_REPOSITORY" --body "NEXTSIGNER_1_3_6_PUBLISHED publish=$PUBLISH_RUN_ID sha256=$SHA256"

      - name: Report failure
        if: failure()
        run: gh issue comment "$REPORT_ISSUE" --repo "$GITHUB_REPOSITORY" --body "NEXTSIGNER_1_3_6_FAILED controller=${{ github.run_id }} publish=${PUBLISH_RUN_ID:-unknown}"
