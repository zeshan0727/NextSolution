name: Index YouPiP 1.12.14 manual article

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/index-youpip-1-12-14-manual.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nextsolution-content-state
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out production
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Add article to live index, RSS and sitemap
        run: |
          python3 - <<'PY'
          from __future__ import annotations
          from datetime import datetime, timezone
          from email.utils import format_datetime
          from hashlib import sha256
          from pathlib import Path
          import json

          root = Path('.')
          target = 'youpip-1-12-14-update/'
          page = root / target / 'index.html'
          now = datetime.now(timezone.utc).replace(microsecond=0)
          published_at = now.isoformat()
          page_hash = sha256(page.read_bytes()).hexdigest()

          audit_path = root / 'automation/published-articles.json'
          audit = json.loads(audit_path.read_text(encoding='utf-8'))
          entries = audit.setdefault('entries', [])
          entries = [e for e in entries if str(e.get('href', '')) != target and str(e.get('package', '')) != 'com.ps.youpip']
          entry = {
              'article_sha256': page_hash,
              'candidate_fingerprint': sha256(b'com.ps.youpip|1.12.14|manual-source-news').hexdigest(),
              'category': {'id': 'system-utilities', 'label': 'System & Utilities'},
              'description': 'YouPiP 1.12.14 updates PoomSmart’s native YouTube Picture-in-Picture tweak with a new MLPIPControllerImpl hook and refined automatic PiP handling.',
              'entry_type': 'source-news',
              'href': target,
              'image': 'https://opengraph.githubassets.com/1/PoomSmart/YouPiP',
              'media_credit': 'PoomSmart YouPiP official GitHub source',
              'media_source_url': 'https://github.com/PoomSmart/YouPiP',
              'modified_at': published_at,
              'name': 'YouPiP',
              'package': 'com.ps.youpip',
              'published_at': published_at,
              'selection_pool': 'source-news',
              'source_name': 'PoomSmart',
              'source_page_url': 'https://poomsmart.github.io/repo/depictions/youpip.html',
              'source_url': 'https://github.com/PoomSmart/YouPiP',
              'source_visual_url': 'https://opengraph.githubassets.com/1/PoomSmart/YouPiP',
              'title': 'YouPiP 1.12.14 Updates YouTube Picture-in-Picture Handling',
              'version': '1.12.14',
          }
          audit['entries'] = [entry] + entries
          audit_path.write_text(json.dumps(audit, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          feed_path = root / 'feed.xml'
          feed = feed_path.read_text(encoding='utf-8')
          url = 'https://nextjailbreak.com/youpip-1-12-14-update/'
          if url not in feed:
              item = f'''    <item>\n      <title>YouPiP 1.12.14 Updates YouTube Picture-in-Picture Handling</title>\n      <link>{url}</link>\n      <guid isPermaLink="true">{url}</guid>\n      <pubDate>{format_datetime(now)}</pubDate>\n      <description>YouPiP 1.12.14 updates PoomSmart’s native YouTube Picture-in-Picture tweak with a new PiP controller hook and refined automatic-start behavior.</description>\n      <category>System &amp; Utilities</category>\n    </item>\n'''
              marker = '    <language>en</language>\n'
              feed = feed.replace(marker, marker + item, 1)
              feed_path.write_text(feed, encoding='utf-8')

          sitemap_path = root / 'sitemap.xml'
          sitemap = sitemap_path.read_text(encoding='utf-8')
          if url not in sitemap:
              block = f'''  <url>\n    <loc>{url}</loc>\n    <lastmod>{now.date().isoformat()}</lastmod>\n    <changefreq>monthly</changefreq>\n    <priority>0.8</priority>\n  </url>\n'''
              sitemap = sitemap.replace('</urlset>', block + '</urlset>')
              sitemap_path.write_text(sitemap, encoding='utf-8')
          PY

      - name: Commit indexed article
        run: |
          git config user.name "nextsolution-publisher[bot]"
          git config user.email "nextsolution-publisher[bot]@users.noreply.github.com"
          git add -- automation/published-articles.json feed.xml sitemap.xml
          git rm -f -- .github/workflows/index-youpip-1-12-14-manual.yml
          git commit -m "Publish YouPiP 1.12.14 to live article feeds"
          git push origin HEAD:main
