name: Migrate Site Domain to NextJailbreak

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/domain-migration-nextjailbreak.yml'

permissions:
  contents: write

jobs:
  migrate-domain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Replace public site domain references
        run: |
          python3 - <<'PY'
          from pathlib import Path

          OLD = 'nextsolution.cc'
          NEW = 'nextjailbreak.com'

          always_exts = {'.html', '.htm', '.xml', '.js', '.mjs', '.css', '.json'}
          scoped_exts = {'.py', '.md', '.txt'}
          scoped_prefixes = ('automation/', 'scripts/')

          changed = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              rel = path.as_posix()
              if rel.startswith('.github/workflows/'):
                  continue

              eligible = path.suffix.lower() in always_exts
              if path.suffix.lower() in scoped_exts and rel.startswith(scoped_prefixes):
                  eligible = True
              if path.name in {'CNAME', 'sitemap.xml', 'feed.xml'}:
                  eligible = True
              if not eligible:
                  continue

              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if OLD not in text:
                  continue
              path.write_text(text.replace(OLD, NEW), encoding='utf-8')
              changed.append(rel)

          print(f'Updated {len(changed)} files')
          for item in changed[:200]:
              print(item)
          PY

      - name: Commit migrated URLs
        run: |
          if git diff --quiet; then
            echo "No domain references required migration"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ':!.github/workflows/domain-migration-nextjailbreak.yml'
          git commit -m "Migrate public site URLs to nextjailbreak.com [skip ci]"
          git push
