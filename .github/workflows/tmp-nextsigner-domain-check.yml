name: Temporary Next Signer Domain Check

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  check:
    if: github.event.issue.title == '[NEXTSIGNER-DOMAIN-CHECK]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Check file domains
        shell: bash
        run: |
          set +e
          PATH_PART='/apps/tipa/NextSigner/1.3.8/NextSigner-1.3.8.tipa'
          OLD_DNS=$(getent ahosts files.nextsolution.cc | head -n1 | awk '{print $1}')
          NEW_DNS=$(getent ahosts files.nextjailbreak.com | head -n1 | awk '{print $1}')
          OLD_CODE=$(curl -L -sS -o /dev/null -w '%{http_code}' --connect-timeout 8 --max-time 20 "https://files.nextsolution.cc${PATH_PART}")
          OLD_RC=$?
          NEW_CODE=$(curl -L -sS -o /dev/null -w '%{http_code}' --connect-timeout 8 --max-time 20 "https://files.nextjailbreak.com${PATH_PART}")
          NEW_RC=$?
          BODY="NEXTSIGNER_DOMAIN_CHECK old_dns=${OLD_DNS:-NONE} old_http=${OLD_CODE:-NONE} old_rc=$OLD_RC new_dns=${NEW_DNS:-NONE} new_http=${NEW_CODE:-NONE} new_rc=$NEW_RC"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$BODY"
