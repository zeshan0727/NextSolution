name: Build Next Password TIPA
on:
  push:
    branches: [agent/next-password-keyboard-v4-build]
    paths:
      - 'NextPasswordBuild/**'
      - '.github/workflows/build-next-password.yml'
  pull_request:
    branches: [main]
    paths:
      - 'NextPasswordBuild/**'
      - '.github/workflows/build-next-password.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: NextPasswordBuild
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate app icon
        run: python3 generate_icon.py
      - name: Generate project
        run: xcodegen generate
      - name: Build unsigned app with keyboard
        run: |
          xcodebuild -project NextPassword.xcodeproj -scheme NextPassword -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Validate keyboard registration bundle
        run: |
          APP="build/Build/Products/Release-iphoneos/NextPassword.app"
          APPEX="$APP/PlugIns/PasswordKeyboard.appex"
          test -d "$APPEX"
          test -f "$APPEX/PasswordKeyboard"
          /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" "$APPEX/Info.plist" | grep -q "com.apple.keyboard-service"
          /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPrincipalClass" "$APPEX/Info.plist"
          echo "Keyboard extension is embedded with keyboard service metadata."
      - name: Package TIPA
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NextPassword.app Payload/
          zip -qry NextPassword-Keyboard-Fixed.tipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: NextPassword-Keyboard-Fixed-TIPA
          path: NextPasswordBuild/NextPassword-Keyboard-Fixed.tipa
