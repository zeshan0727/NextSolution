name: Build Next Password RootHide DEB
on:
  push:
    branches: [agent/next-password-keyboard-deb]
    paths:
      - 'NextPasswordBuild/**'
      - '.github/workflows/build-next-password.yml'
  pull_request:
    branches: [main]
    paths:
      - 'NextPasswordBuild/**'
      - '.github/workflows/build-next-password.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: NextPasswordBuild
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: brew install xcodegen dpkg ldid
      - name: Generate app icon
        run: python3 generate_icon.py
      - name: Generate project
        run: xcodegen generate
      - name: Build app and keyboard
        run: |
          xcodebuild -project NextPassword.xcodeproj -scheme NextPassword -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Prepare RootHide package
        run: |
          rm -rf package
          mkdir -p package/DEBIAN package/Applications
          cp debian/control package/DEBIAN/control
          cp debian/postinst package/DEBIAN/postinst
          cp debian/prerm package/DEBIAN/prerm
          chmod 755 package/DEBIAN/postinst package/DEBIAN/prerm
          cp -R build/Build/Products/Release-iphoneos/NextPassword.app package/Applications/
          APP="package/Applications/NextPassword.app"
          APPEX=$(find "$APP/PlugIns" -maxdepth 1 -type d -name '*.appex' | head -1)
          test -n "$APPEX"
          EXTEXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APPEX/Info.plist")
          APPEXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          ldid -SPasswordKeyboard/PasswordKeyboard.entitlements "$APPEX/$EXTEXE"
          ldid -SNextPassword/NextPassword.entitlements "$APP/$APPEXE"
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$APPEX/Info.plist" | grep -q 'com.apple.keyboard-service'
          echo "Embedded keyboard: $APPEX"
      - name: Build DEB
        run: |
          dpkg-deb --build --root-owner-group package com.nextpassword.keyboard_1.0.0_iphoneos-arm64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: NextPassword-Keyboard-RootHide-DEB
          path: NextPasswordBuild/com.nextpassword.keyboard_1.0.0_iphoneos-arm64.deb
