name: Build Next Password TIPA
on:
  push:
    branches: [agent/next-password-tipa]
    paths:
      - 'NextPasswordBuild/**'
      - '.github/workflows/build-next-password.yml'
  pull_request:
    branches: [main]
    paths:
      - 'NextPasswordBuild/**'
      - '.github/workflows/build-next-password.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: NextPasswordBuild
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build unsigned app
        run: |
          xcodebuild -project NextPassword.xcodeproj -scheme NextPassword -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package TIPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NextPassword.app Payload/
          zip -qry NextPassword.tipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: NextPassword-TIPA
          path: NextPasswordBuild/NextPassword.tipa
