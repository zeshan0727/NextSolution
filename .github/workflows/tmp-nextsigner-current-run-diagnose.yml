name: Temporary Next Signer Current Run Diagnose

on:
  issues:
    types: [opened]

permissions:
  actions: read
  issues: write

jobs:
  diagnose:
    if: github.event.issue.title == '[NEXTSIGNER-CURRENT-RUN-DIAGNOSE]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Report latest signing runs
        shell: bash
        run: |
          set -euo pipefail
          gh run list --repo "$GITHUB_REPOSITORY" --workflow nextsigner-sign-publish.yml --limit 5 --json databaseId,status,conclusion,createdAt,startedAt,event,url > "$RUNNER_TEMP/runs.json" || \
          gh run list --repo "$GITHUB_REPOSITORY" --workflow nextsigner-sign-publish.yml --limit 5 --json databaseId,status,conclusion,createdAt,event,url > "$RUNNER_TEMP/runs.json"
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "$(cat "$RUNNER_TEMP/runs.json")"
