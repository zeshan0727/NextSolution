name: Restore Module Glass 1.0.18

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-module-glass-1.0.18.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: restore-module-glass-1.0.18
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact 1.0.18 / 1.0.14 artifacts
        shell: bash
        run: |
          set -euo pipefail
          OLD=3f161db19beca74c4f64f57d1c353c8f8a490d3d
          git fetch origin "$OLD"

          # Restore the exact historical Module Glass source tree.
          rm -rf source/ModuleGlass
          git archive "$OLD" source/ModuleGlass | tar -x

          # Remove only newer Module Glass binaries; leave every unrelated package untouched.
          rm -f debfiles/NextAura_cc_module_backgrounds_1.0.19_RootHide.deb
          rm -f debfiles/NextAura_cc_module_backgrounds_1.1.*_RootHide.deb
          rm -f debfiles/NextAura_Runtime_ccbackgrounds_1.0.15_RootHide.deb
          rm -f debfiles/NextAura_Runtime_ccbackgrounds_1.1.*_RootHide.deb

          # Restore exact known-good DEBs from the historical publish commit.
          git show "$OLD:debfiles/NextAura_cc_module_backgrounds_1.0.18_RootHide.deb" > debfiles/NextAura_cc_module_backgrounds_1.0.18_RootHide.deb
          git show "$OLD:debfiles/NextAura_Runtime_ccbackgrounds_1.0.14_RootHide.deb" > debfiles/NextAura_Runtime_ccbackgrounds_1.0.14_RootHide.deb

          echo '21cb0e2ce2489a2031a1056e06197b5173261ee876d6d4a5069a387d3e6f4a49  debfiles/NextAura_cc_module_backgrounds_1.0.18_RootHide.deb' | shasum -a 256 -c -
          echo '1f60c403b9ec4b75a1580b6e6fafcf45fb52893ad1ea1dea8620049d63233208  debfiles/NextAura_Runtime_ccbackgrounds_1.0.14_RootHide.deb' | shasum -a 256 -c -

          # Replace only the two Module Glass stanzas with their exact 1.0.18-era metadata.
          python3 - "$OLD" <<'PY'
          from pathlib import Path
          import re, subprocess, sys

          old_sha = sys.argv[1]
          ids = {
              'com.nextsolution.nextaura.cc-module-backgrounds',
              'com.nextsolution.nextaura.runtime.ccbackgrounds',
          }

          def rows(text):
              return [x.strip() for x in re.split(r'\n\s*\n', text) if x.strip()]

          def package_id(row):
              m = re.search(r'^Package: (.+)$', row, re.M)
              return m.group(1).strip() if m else ''

          current_path = Path('Packages')
          current = rows(current_path.read_text())
          historical_text = subprocess.check_output(['git', 'show', f'{old_sha}:Packages'], text=True)
          historical = rows(historical_text)
          target = [row for row in historical if package_id(row) in ids]
          assert len(target) == 2, target

          wrapper = next(r for r in target if package_id(r) == 'com.nextsolution.nextaura.cc-module-backgrounds')
          runtime = next(r for r in target if package_id(r) == 'com.nextsolution.nextaura.runtime.ccbackgrounds')
          assert re.search(r'^Version: 1\.0\.18$', wrapper, re.M)
          assert 'com.nextsolution.nextaura.runtime.ccbackgrounds (>= 1.0.14)' in wrapper
          assert re.search(r'^Version: 1\.0\.14$', runtime, re.M)
          assert 'SHA256: 21cb0e2ce2489a2031a1056e06197b5173261ee876d6d4a5069a387d3e6f4a49' in wrapper
          assert 'SHA256: 1f60c403b9ec4b75a1580b6e6fafcf45fb52893ad1ea1dea8620049d63233208' in runtime

          current = [row for row in current if package_id(row) not in ids]
          current_path.write_text('\n\n'.join(current + target) + '\n')
          PY

          test "$(grep -c '^Package: com.nextsolution.nextaura.cc-module-backgrounds$' Packages)" -eq 1
          test "$(grep -c '^Package: com.nextsolution.nextaura.runtime.ccbackgrounds$' Packages)" -eq 1
          grep -A20 '^Package: com.nextsolution.nextaura.cc-module-backgrounds$' Packages | grep -q '^Version: 1.0.18$'
          grep -A20 '^Package: com.nextsolution.nextaura.cc-module-backgrounds$' Packages | grep -q 'runtime.ccbackgrounds (>= 1.0.14)'
          grep -A20 '^Package: com.nextsolution.nextaura.runtime.ccbackgrounds$' Packages | grep -q '^Version: 1.0.14$'

          gzip -9 -c Packages > Packages.gz
          bzip2 -9 -c Packages > Packages.bz2
          xz -9e -c Packages > Packages.xz
          zstd -19 -q -c Packages > Packages.zst

          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import re
          p = Path('Release')
          t = p.read_text()
          m = re.search(r'^Version:\s*(\d+)\.(\d+)\.(\d+)\s*$', t, re.M)
          if m:
              a,b,c = map(int, m.groups())
              t = re.sub(r'^Version: .*$', f'Version: {a}.{b}.{c+1}', t, flags=re.M)
          t = re.sub(r'^Date: .*$', 'Date: ' + datetime.now(timezone.utc).strftime('%a, %d %b %Y %H:%M:%S UTC'), t, flags=re.M)
          p.write_text(t)
          PY

      - name: Commit exact rollback
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Next Jailbreak Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A source/ModuleGlass debfiles Packages Packages.gz Packages.bz2 Packages.xz Packages.zst Release
          git diff --cached --check
          git commit -m 'Revert Module Glass to 1.0.18 and Runtime 1.0.14'
          git push origin HEAD:main
