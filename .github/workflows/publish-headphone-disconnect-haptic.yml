name: Build Validate and Publish Headphone Disconnect Haptic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-headphone-disconnect-haptic.yml"

permissions:
  contents: write

concurrency:
  group: publish-headphone-disconnect-haptic-1.0.0
  cancel-in-progress: false

jobs:
  build-validate-publish:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install packaging tools
        run: brew install dpkg ldid xz zstd

      - name: Validate source and deterministic runtime logic
        shell: bash
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/2026-08-07-HeadphoneDisconnectHaptic"
          python3 "$P/tests/test_runtime_logic.py"
          for f in Tweak.xm Makefile HeadphoneDisconnectHaptic.plist control README.md Preferences/Makefile Preferences/HDHRootListController.h Preferences/HDHRootListController.m Preferences/Resources/Root.plist Preferences/Resources/Info.plist layout/Library/PreferenceLoader/Preferences/HeadphoneDisconnectHaptic.plist; do test -f "$P/$f"; done
          grep -q '^Package: com.nextsolution.headphonedisconnecthaptic$' "$P/control"
          grep -q '^Version: 1.0.0$' "$P/control"
          grep -q '^ARCHS = arm64 arm64e$' "$P/Makefile"
          grep -q '^TARGET = iphone:clang:latest:15.0$' "$P/Makefile"
          grep -q '^THEOS_PACKAGE_SCHEME ?= roothide$' "$P/Makefile"
          grep -q 'AVFoundation' "$P/Makefile"
          grep -q 'segalign,4000' "$P/Makefile"
          grep -q 'com.apple.springboard' "$P/HeadphoneDisconnectHaptic.plist"
          grep -q 'AVAudioSessionRouteChangeNotification' "$P/Tweak.xm"
          grep -q 'AVAudioSessionRouteChangeReasonOldDeviceUnavailable' "$P/Tweak.xm"
          grep -q 'AVAudioSessionRouteChangePreviousRouteKey' "$P/Tweak.xm"
          grep -q 'AVAudioSessionPortHeadphones' "$P/Tweak.xm"
          grep -q 'AVAudioSessionPortBluetoothA2DP' "$P/Tweak.xm"
          grep -q 'HDHRouteObserver =' "$P/Tweak.xm"
          grep -A4 'addObserverForName:AVAudioSessionRouteChangeNotification' "$P/Tweak.xm" | grep -q 'object:nil'
          ! grep -q 'object:session' "$P/Tweak.xm"
          ! grep -q 'setActive' "$P/Tweak.xm"
          grep -q 'previousHadPersonalAudio &&' "$P/Tweak.xm"
          grep -q '!currentHasPersonalAudio' "$P/Tweak.xm"
          grep -q 'Enable Disconnect Alert' "$P/Preferences/Resources/Root.plist"
          test "$(grep -c '<string>PSSwitchCell</string>' "$P/Preferences/Resources/Root.plist")" -eq 1
          ! grep -Eq 'Test|Diagnostic|PID|Hook|Runtime|Class|Selector' "$P/Preferences/Resources/Root.plist"
          grep -q 'CFPreferencesCopyAppValue' "$P/Preferences/HDHRootListController.m"
          grep -q 'CFNotificationCenterPostNotification' "$P/Preferences/HDHRootListController.m"
          plutil -lint "$P/Preferences/Resources/Root.plist"
          plutil -lint "$P/Preferences/Resources/Info.plist"
          plutil -lint "$P/layout/Library/PreferenceLoader/Preferences/HeadphoneDisconnectHaptic.plist"

      - name: Build rootless with diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/2026-08-07-HeadphoneDisconnectHaptic"
          OUT="$RUNNER_TEMP/headphone-disconnect-haptic"
          LOG="$RUNNER_TEMP/headphone-disconnect-haptic-logs"
          mkdir -p "$OUT" "$LOG"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos-rootless"
          export THEOS="$RUNNER_TEMP/theos-rootless"
          export THEOS_PACKAGE_SCHEME=rootless
          rm -rf "$P/packages"
          make -C "$P" clean package FINALPACKAGE=1 2>&1 | tee "$LOG/rootless-build.log"
          DEB="$(find "$P/packages" -type f -name '*_iphoneos-arm64.deb' -print -quit)"
          test -n "$DEB"
          cp "$DEB" "$OUT/HeadphoneDisconnectHaptic_1.0.0_Rootless.deb"

      - name: Build RootHide with diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/2026-08-07-HeadphoneDisconnectHaptic"
          OUT="$RUNNER_TEMP/headphone-disconnect-haptic"
          LOG="$RUNNER_TEMP/headphone-disconnect-haptic-logs"
          mkdir -p "$LOG"
          git init "$RUNNER_TEMP/theos-roothide"
          git -C "$RUNNER_TEMP/theos-roothide" remote add origin https://github.com/roothide/theos.git
          git -C "$RUNNER_TEMP/theos-roothide" fetch --depth 1 origin 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$RUNNER_TEMP/theos-roothide" checkout --detach 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$RUNNER_TEMP/theos-roothide" submodule update --init --recursive --depth 1
          sed -i '' 's/^Architecture: iphoneos-arm64$/Architecture: iphoneos-arm64e/' "$P/control"
          export THEOS="$RUNNER_TEMP/theos-roothide"
          export THEOS_PACKAGE_SCHEME=roothide
          rm -rf "$P/packages"
          make -C "$P" clean package FINALPACKAGE=1 2>&1 | tee "$LOG/roothide-build.log"
          DEB="$(find "$P/packages" -type f -name '*_iphoneos-arm64e.deb' -print -quit)"
          test -n "$DEB"
          cp "$DEB" "$OUT/HeadphoneDisconnectHaptic_1.0.0_RootHide.deb"

      - name: Upload diagnostic compiler logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headphone-disconnect-haptic-compiler-logs
          path: ${{ runner.temp }}/headphone-disconnect-haptic-logs/
          if-no-files-found: warn

      - name: Validate built packages
        shell: bash
        run: |
          set -euo pipefail
          validate() {
            deb="$1"; arch="$2"; x="$(mktemp -d)"
            test "$(dpkg-deb -f "$deb" Package)" = com.nextsolution.headphonedisconnecthaptic
            test "$(dpkg-deb -f "$deb" Name)" = "Headphone Disconnect Haptic"
            test "$(dpkg-deb -f "$deb" Version)" = 1.0.0
            test "$(dpkg-deb -f "$deb" Architecture)" = "$arch"
            dpkg-deb -f "$deb" Depends | grep -q 'firmware (>= 15.0)'
            dpkg-deb -f "$deb" Depends | grep -q mobilesubstrate
            dpkg-deb -f "$deb" Depends | grep -q preferenceloader
            dpkg-deb -x "$deb" "$x"
            dylib="$(find "$x" -type f -name HeadphoneDisconnectHaptic.dylib -print -quit)"
            root="$(find "$x" -type f -path '*HeadphoneDisconnectHapticPreferences.bundle/Root.plist' -print -quit)"
            entry="$(find "$x" -type f -path '*PreferenceLoader/Preferences/HeadphoneDisconnectHaptic.plist' -print -quit)"
            filter="$(find "$x" -type f -path '*MobileSubstrate/DynamicLibraries/HeadphoneDisconnectHaptic.plist' -print -quit)"
            test -n "$dylib"; test -n "$root"; test -n "$entry"; test -n "$filter"
            grep -q 'com.apple.springboard' "$filter"
            grep -q 'Enable Disconnect Alert' "$root"
            test "$(grep -c '<string>PSSwitchCell</string>' "$root")" -eq 1
            ! grep -Eq 'Test|Diagnostic|PID|Hook|Runtime|Class|Selector' "$root"
            strings -a "$dylib" | grep -q AVAudioSessionRouteChangeNotification
            strings -a "$dylib" | grep -q UINotificationFeedbackTypeWarning
            strings -a "$dylib" | grep -q AVAudioSessionPortHeadphones
            strings -a "$dylib" | grep -q AVAudioSessionPortBluetoothA2DP
            rm -rf "$x"
          }
          OUT="$RUNNER_TEMP/headphone-disconnect-haptic"
          validate "$OUT/HeadphoneDisconnectHaptic_1.0.0_Rootless.deb" iphoneos-arm64
          validate "$OUT/HeadphoneDisconnectHaptic_1.0.0_RootHide.deb" iphoneos-arm64e
          {
            echo 'Headphone Disconnect Haptic 1.0.0 build validation: PASS'
            echo 'Deterministic runtime logic: PASS'
            echo 'Rootless package inspection: PASS'
            echo 'RootHide package inspection: PASS'
            shasum -a 256 "$OUT"/*.deb
          } | tee "$RUNNER_TEMP/headphone-disconnect-haptic-build-report.txt"

      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: headphone-disconnect-haptic-build-report
          path: ${{ runner.temp }}/headphone-disconnect-haptic-build-report.txt

      - name: Publish packages and indexes to nextsolution.cc repository
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/headphone-disconnect-haptic"
          git config user.name "Next Solution Build Bot"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf "$RUNNER_TEMP/hdh-scan"
            mkdir -p debfiles "$RUNNER_TEMP/hdh-scan"
            cp "$OUT"/*.deb debfiles/
            cp "$OUT"/*.deb "$RUNNER_TEMP/hdh-scan/"
            dpkg-scanpackages -m "$RUNNER_TEMP/hdh-scan" /dev/null > "$RUNNER_TEMP/hdh-stanzas"
            sed -i '' 's|^Filename: .*/hdh-scan/|Filename: ./debfiles/|' "$RUNNER_TEMP/hdh-stanzas"
            python3 - "$RUNNER_TEMP/hdh-stanzas" <<'PY'
          from pathlib import Path
          import re, sys
          path = Path('Packages')
          old = path.read_text() if path.exists() else ''
          rows = [x.strip() for x in re.split(r'\n\s*\n', old) if x.strip()]
          rows = [x for x in rows if not re.search(r'^Package: com\.nextsolution\.headphonedisconnecthaptic$', x, re.M)]
          new = [x.strip() for x in re.split(r'\n\s*\n', Path(sys.argv[1]).read_text()) if x.strip()]
          path.write_text('\n\n'.join(rows + new) + '\n')
          PY
            test "$(grep -c '^Package: com.nextsolution.headphonedisconnecthaptic$' Packages)" -eq 2
            test "$(grep -c '^Filename: ./debfiles/HeadphoneDisconnectHaptic_1.0.0_' Packages)" -eq 2
            gzip -9 -c Packages > Packages.gz
            bzip2 -9 -c Packages > Packages.bz2
            xz -9e -c Packages > Packages.xz
            zstd -19 -q -c Packages > Packages.zst
            python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import re
          p = Path('Release')
          t = p.read_text()
          m = re.search(r'^Version: (\d+)\.(\d+)\.(\d+)$', t, re.M)
          if m:
              t = re.sub(r'^Version: .*$', f'Version: {m.group(1)}.{m.group(2)}.{int(m.group(3))+1}', t, flags=re.M)
          t = re.sub(r'^Date: .*$', 'Date: ' + datetime.now(timezone.utc).strftime('%a, %d %b %Y %H:%M:%S UTC'), t, flags=re.M)
          t = re.sub(r'^Icon: .*$', 'Icon: https://nextsolution.cc/CydiaIcon.png', t, flags=re.M)
          p.write_text(t)
          PY
            git add debfiles/HeadphoneDisconnectHaptic_1.0.0_Rootless.deb debfiles/HeadphoneDisconnectHaptic_1.0.0_RootHide.deb Packages Packages.gz Packages.bz2 Packages.xz Packages.zst Release
            git diff --cached --check
            git commit -m "Publish Headphone Disconnect Haptic 1.0.0"
            git push origin HEAD:main && exit 0
            sleep $((attempt * 4))
          done
          exit 1
