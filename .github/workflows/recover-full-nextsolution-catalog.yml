name: Recover Full Next Jailbreak Catalog

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-full-nextsolution-catalog.yml'

permissions:
  contents: write

concurrency:
  group: recover-full-nextsolution-catalog
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore catalog lost by destructive sync
        shell: bash
        run: |
          set -euo pipefail
          BASE='e56229890984095b91e37e5903247a805ca41084'
          git cat-file -e "$BASE^{commit}"

          cp Packages "$RUNNER_TEMP/current-Packages"
          git show "$BASE:Packages" > "$RUNNER_TEMP/base-Packages"

          # Restore every DEB and depiction that existed immediately before the wipe,
          # but never overwrite newer files that already exist on main.
          restored=0
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            if [ ! -e "$path" ]; then
              mkdir -p "$(dirname "$path")"
              git show "$BASE:$path" > "$path"
              restored=$((restored + 1))
            fi
          done < <(git ls-tree -r --name-only "$BASE" -- debfiles depictions)
          echo "Restored missing files: $restored"

          python3 - "$RUNNER_TEMP/base-Packages" "$RUNNER_TEMP/current-Packages" <<'PY'
          from pathlib import Path
          import re, sys

          base = Path(sys.argv[1]).read_text(errors='replace')
          current = Path(sys.argv[2]).read_text(errors='replace')
          module_ids = {
              'com.nextsolution.nextaura.cc-module-backgrounds',
              'com.nextsolution.nextaura.runtime.ccbackgrounds',
          }

          def stanzas(text):
              return [s.strip() for s in re.split(r'\n\s*\n', text) if s.strip()]

          def field(stanza, name):
              m = re.search(rf'^{re.escape(name)}:\s*(.+)$', stanza, re.M)
              return m.group(1).strip() if m else ''

          def key(stanza):
              return (
                  field(stanza, 'Package'),
                  field(stanza, 'Version'),
                  field(stanza, 'Architecture'),
                  field(stanza, 'Filename'),
              )

          base_rows = stanzas(base)
          current_rows = stanzas(current)

          # Start with complete pre-wipe catalog. Remove historical Module Glass entries
          # so only the explicitly pinned pair from current remains.
          merged = []
          seen = set()
          for row in base_rows:
              if field(row, 'Package') in module_ids:
                  continue
              k = key(row)
              if k not in seen:
                  merged.append(row)
                  seen.add(k)

          # Preserve every package added/updated after the wipe, except superseded
          # Module Glass stanzas. Current main is already pinned to 1.0.18 / 1.0.14.
          pinned = []
          for row in current_rows:
              pid = field(row, 'Package')
              if pid in module_ids:
                  version = field(row, 'Version')
                  if (pid == 'com.nextsolution.nextaura.cc-module-backgrounds' and version == '1.0.18') or \
                     (pid == 'com.nextsolution.nextaura.runtime.ccbackgrounds' and version == '1.0.14'):
                      pinned.append(row)
                  continue
              k = key(row)
              if k not in seen:
                  merged.append(row)
                  seen.add(k)

          if len(pinned) != 2:
              raise SystemExit(f'Expected exactly 2 pinned Module Glass stanzas, got {len(pinned)}')
          merged.extend(pinned)

          # Historical package metadata still carries the former public brand.
          # Rebrand human-facing fields while preserving package identifiers,
          # dependency names, filenames, hashes, URLs and versions exactly.
          human_fields = {'Maintainer', 'Author', 'Description', 'Name'}
          normalized = []
          for row in merged:
              lines = []
              for line in row.splitlines():
                  field_name = line.partition(':')[0]
                  if field_name in human_fields:
                      line = line.replace('Next Solution', 'Next Jailbreak')
                      line = line.replace('NextSolution', 'Next Jailbreak')
                  lines.append(line)
              normalized.append('\n'.join(lines))
          merged = normalized

          Path('Packages').write_text('\n\n'.join(merged) + '\n')
          print(f'base stanzas={len(base_rows)} current stanzas={len(current_rows)} merged stanzas={len(merged)}')
          if len(merged) < len(base_rows):
              raise SystemExit('Merged catalog is smaller than the pre-wipe catalog')
          old_brand = re.compile(
              r'^(?:Maintainer|Author|Description|Name):.*Next ?Solution',
              re.M,
          )
          if old_brand.search(Path('Packages').read_text(errors='replace')):
              raise SystemExit('Former public brand remains in package metadata')
          PY

          # Hard recovery checks for packages known to have been removed by the wipe.
          grep -q '^Package: com.nextsolution.nextledger$' Packages
          grep -q '^Package: com.nextsolution.nextmessage$' Packages
          grep -q '^Package: com.nextsolution.shaketorun$' Packages
          grep -q '^Package: com.nextsolution.nextaura.animations$' Packages
          grep -q '^Package: com.nextsolution.nextaura.control-center$' Packages
          grep -q '^Package: com.nextsolution.nextaura.home-screen$' Packages
          grep -q '^Package: com.nextsolution.nextaura.status-bar$' Packages
          grep -q '^Package: com.nextsolution.nextquickreminder$' Packages
          grep -q '^Version: 1.0.18$' <(grep -A20 '^Package: com.nextsolution.nextaura.cc-module-backgrounds$' Packages)
          grep -q '^Version: 1.0.14$' <(grep -A20 '^Package: com.nextsolution.nextaura.runtime.ccbackgrounds$' Packages)
          grep -q '^Filename: ./debfiles/NextAura_cc_module_backgrounds_1.0.18_RootHide.deb$' Packages
          grep -q '^Filename: ./debfiles/NextAura_Runtime_ccbackgrounds_1.0.14_RootHide.deb$' Packages

          # Make sure key restored payloads really exist.
          test -f debfiles/NextLedger_1.3.42_iphoneos-arm64e.deb
          test -f debfiles/NextAura_animations_1.0.4_RootHide.deb
          test -f debfiles/NextAura_control_center_1.0.4_RootHide.deb
          test -f debfiles/NextQuickReminder_1.0.10_RootHide.deb
          test -f debfiles/NextAura_cc_module_backgrounds_1.0.18_RootHide.deb
          test -f debfiles/NextAura_Runtime_ccbackgrounds_1.0.14_RootHide.deb

          gzip -9 -c Packages > Packages.gz
          bzip2 -9 -c Packages > Packages.bz2
          xz -9e -c Packages > Packages.xz
          if command -v zstd >/dev/null 2>&1; then zstd -19 -q -c Packages > Packages.zst; fi

          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import re
          p=Path('Release')
          t=p.read_text()
          m=re.search(r'^Version:\s*(\d+)\.(\d+)\.(\d+)\s*$', t, re.M)
          if m:
              a,b,c=map(int,m.groups())
              t=re.sub(r'^Version: .*$', f'Version: {a}.{b}.{c+1}', t, flags=re.M)
          t=re.sub(r'^Date: .*$', 'Date: '+datetime.now(timezone.utc).strftime('%a, %d %b %Y %H:%M:%S UTC'), t, flags=re.M)
          p.write_text(t)
          PY

      - name: Publish restored nextsolution.cc catalog
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Next Jailbreak Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add Packages Packages.gz Packages.bz2 Packages.xz Packages.zst Release debfiles depictions
          git diff --cached --check
          git commit -m 'Restore full nextsolution.cc tweak catalog'
          git push origin HEAD:main
