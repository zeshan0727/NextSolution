name: Audit NextProxy Network Extension Profile

on:
  push:
    branches:
      - build-nextproxy-tipa
    paths:
      - '.github/workflows/audit-nextproxy-ne-profile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Audit existing provisioning profile capability
        env:
          PROVISION_B64: ${{ secrets.NEXTSIGNER_MOBILEPROVISION_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$PROVISION_B64" || { echo "PROFILE_SECRET=missing"; exit 1; }
          printf '%s' "$PROVISION_B64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          openssl smime -inform der -verify -noverify -in "$RUNNER_TEMP/profile.mobileprovision" -out "$RUNNER_TEMP/profile.plist" 2>/dev/null
          python3 - <<'PY'
          import plistlib, os
          p=plistlib.load(open(os.path.join(os.environ['RUNNER_TEMP'],'profile.plist'),'rb'))
          e=p.get('Entitlements',{})
          ne=e.get('com.apple.developer.networking.networkextension',[])
          appid=str(e.get('application-identifier',''))
          team=str(e.get('com.apple.developer.team-identifier',''))
          print('HAS_PACKET_TUNNEL=' + ('yes' if 'packet-tunnel-provider' in ne else 'no'))
          print('APPLICATION_IDENTIFIER=' + appid)
          print('TEAM_IDENTIFIER=' + team)
          print('PROFILE_NAME=' + str(p.get('Name','')))
          print('EXPIRATION=' + str(p.get('ExpirationDate','')))
          print('COVERS_NEXTPROXY=' + ('yes' if appid.endswith('.*') or appid.endswith('.cc.nextsolution.NextProxy') else 'no'))
          PY
