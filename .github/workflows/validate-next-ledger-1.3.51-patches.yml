name: Validate Next Ledger 1.3.51 Patches

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/validate-next-ledger-1.3.51-patches.yml"

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patches and capture result
        id: patch
        shell: bash
        run: |
          mkdir -p build .build-status
          set +e
          {
            python3 scripts/apply_next_ledger_1_3_50_compact_no_sms.py
            python3 scripts/fix_next_ledger_refund_swift.py
            python3 scripts/add_refund_account_picker.py
            python3 scripts/add_currency_selectors_and_global_delete.py
            python3 scripts/add_inline_accounts_and_general_subaccounts.py
            python3 scripts/add_parent_totals_and_statement_chart.py
            python3 scripts/add_collapsible_chart_sections.py
            python3 scripts/add_edit_refund_delete_swipe_actions.py
            python3 scripts/add_bank_expenses_and_fixed_report_conversion.py
            python3 scripts/fix_summary_loan_sides_and_accounts_zero_filter.py
            python3 scripts/add_payment_receivable_payable_automation.py
            python3 scripts/add_receivable_collection_drilldown.py
            python3 scripts/add_loan_summary_comparison_report.py
            python3 scripts/fix_loan_summary_comparison_ios16.py
            python3 scripts/add_accounting_period_setting.py
            python3 scripts/add_custom_dates_to_loan_summary_comparison.py
            python3 scripts/add_root_sms_daemon_console.py
            python3 scripts/add_sms_installer_diagnostics.py
            python3 scripts/fix_roothide_messages_database_access.py
            python3 scripts/add_sms_draft_approval_and_unrecorded_sync.py
            python3 scripts/fix_sms_draft_inbox_ios16_and_migration.py
            python3 scripts/add_selectable_accounting_period_lock.py
            python3 scripts/prepare_sms_console_counter_patch.py
            python3 scripts/fix_sms_draft_fields_and_message_decoding.py
            python3 scripts/add_interval_latest10_sms_recovery.py
            python3 scripts/fix_sms_interval_unused_diagnostics.py
            python3 scripts/add_manual30_restore_rejected_and_compact_ai.py
            python3 scripts/add_fawran_transfer_and_editable_sms_review.py
            python3 scripts/fix_fawran_regex_escape.py
            python3 scripts/fix_financial_summary_auto_sms_and_compact_settings.py
            python3 scripts/prepare_settings_pages_sms_cleanup_patch.py
            python3 scripts/add_settings_pages_custom_sms_and_log_cleanup.py
            python3 scripts/add_professional_report_exports.py
            python3 scripts/add_sms_realtime_progress_ai_1_3_51.py
          } > build/patch.log 2>&1
          PATCH_EXIT=$?
          set -e
          tail -n 160 build/patch.log > /tmp/next-ledger-patch-tail.txt
          cat > /tmp/next-ledger-patch-status.json <<EOF
          {"run_id":"${GITHUB_RUN_ID}","source_sha":"${GITHUB_SHA}","patch_exit":${PATCH_EXIT}}
          EOF
          echo "patch_exit=${PATCH_EXIT}" >> "$GITHUB_OUTPUT"

      - name: Publish patch validation status
        if: always()
        shell: bash
        run: |
          git reset --hard HEAD
          git clean -fd
          mkdir -p .build-status
          cp /tmp/next-ledger-patch-status.json .build-status/next-ledger-1.3.51-patch-status.json
          cp /tmp/next-ledger-patch-tail.txt .build-status/next-ledger-1.3.51-patch-tail.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .build-status/next-ledger-1.3.51-patch-status.json .build-status/next-ledger-1.3.51-patch-tail.txt
          git commit -m "Record Next Ledger 1.3.51 patch validation" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Fail validation when patch failed
        if: steps.patch.outputs.patch_exit != '0'
        run: exit 1
