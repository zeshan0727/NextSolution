name: Publish Next Post 1.0.9 Now

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-nextpost-109-now.yml'

permissions:
  contents: write

concurrency:
  group: publish-nextpost-109-now
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen and icon renderer
        run: brew install xcodegen librsvg

      - name: Render icon and generate project
        run: |
          rsvg-convert -w 1024 -h 1024 NextPost/Resources/AppIcon.svg > NextPost/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          cp NextPost/Assets.xcassets/AppIcon.appiconset/AppIcon.png NextPost/Assets.xcassets/NextPostIcon.imageset/NextPostIcon.png
          cd NextPost
          xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project NextPost/NextPost.xcodeproj \
            -scheme NextPost \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build-nextpost \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Package and publish to NS Transfer
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find build-nextpost/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          FILE='NextPost-1.0.9-X-Preview-Fix.tipa'
          ditto -c -k --sequesterRsrc --keepParent Payload "$FILE"
          SHA256=$(shasum -a 256 "$FILE" | awk '{print $1}')
          echo "$SHA256  $FILE" > NextPost-1.0.9-X-Preview-Fix.sha256
          export SHA256

          mkdir -p applications transfer/files/NextPost/1.0.9
          cp "$FILE" "applications/$FILE"
          cp NextPost-1.0.9-X-Preview-Fix.sha256 applications/NextPost-1.0.9-X-Preview-Fix.sha256
          cp "$FILE" "transfer/files/NextPost/1.0.9/$FILE"

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone
          p = Path('transfer/index.json')
          data = json.loads(p.read_text())
          entry_id = 'nextpost-1.0.9-x-preview-fix'
          files = [x for x in data.get('files', []) if x.get('id') != entry_id]
          entry = {
            'id': entry_id,
            'name': 'Next Post 1.0.9 X Preview Fix',
            'fileName': 'NextPost-1.0.9-X-Preview-Fix.tipa',
            'type': 'tipa',
            'platform': 'TrollStore / iOS 16+',
            'version': '1.0.9',
            'url': 'https://nextjailbreak.com/transfer/files/NextPost/1.0.9/NextPost-1.0.9-X-Preview-Fix.tipa',
            'sha256': os.environ['SHA256'],
            'notes': 'Fixes missing X post link previews by sharing the exact published article route and passing the article URL separately to the X compose intent. Keeps LevelPlay and Unity Ads mediation from 1.0.8.'
          }
          data['files'] = [entry] + files
          data['updatedAt'] = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          p.write_text(json.dumps(data, indent=2) + '\n')
          PY

          test "$(shasum -a 256 transfer/files/NextPost/1.0.9/$FILE | awk '{print $1}')" = "$SHA256"
          python3 -m json.tool transfer/index.json >/dev/null

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "applications/$FILE" applications/NextPost-1.0.9-X-Preview-Fix.sha256 "transfer/files/NextPost/1.0.9/$FILE" transfer/index.json
          git commit -m 'Publish Next Post 1.0.9 X preview fix to NS Transfer' || true
          git pull --rebase origin main
          git push origin HEAD:main
