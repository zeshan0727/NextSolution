name: Temporary Next Signer 1.3.4 Release

on:
  push:
    branches: [main]
    paths:
      - 'NextSigner/release-trigger-134.txt'

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: '1.3.4'
      REPORT_ISSUE: '207'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch live log polling and website refresh
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          service = Path('NextSigner/NextSigner/GitHubService.swift')
          text = service.read_text()

          old_fetch = '''    private func fetchPublishStatus(releaseID: Int, assetName: String) async throws -> PublishStatusPayload? {
        let assetsURL = try apiURL("/repos/\\(configuration.owner)/\\(configuration.repository)/releases/\\(releaseID)/assets?per_page=100")
        let (assetsData, assetsResponse) = try await session.data(for: request(url: assetsURL))
        try validate(response: assetsResponse, data: assetsData)
        let assets = try JSONDecoder().decode([Asset].self, from: assetsData)
        guard let asset = assets.first(where: { $0.name == assetName }) else { return nil }

        let assetURL = try apiURL("/repos/\\(configuration.owner)/\\(configuration.repository)/releases/assets/\\(asset.id)")
        var statusRequest = request(url: assetURL)
        statusRequest.setValue("application/octet-stream", forHTTPHeaderField: "Accept")
        statusRequest.cachePolicy = .reloadIgnoringLocalAndRemoteCacheData
        let (data, response) = try await session.data(for: statusRequest)
        try validate(response: response, data: data)
        return try JSONDecoder().decode(PublishStatusPayload.self, from: data)
    }
'''
          new_fetch = '''    private func fetchPublishStatus(releaseID: Int, assetName: String) async throws -> PublishStatusPayload? {
        var matchedAsset: Asset?

        // The inbox can grow beyond 100 assets. Always bypass URLSession/HTTP caches
        // and paginate so a newly-created status file cannot be hidden by an older
        // cached first page of release assets.
        for page in 1...5 {
            let assetsURL = try apiURL("/repos/\\(configuration.owner)/\\(configuration.repository)/releases/\\(releaseID)/assets?per_page=100&page=\\(page)")
            var assetsRequest = request(url: assetsURL)
            assetsRequest.cachePolicy = .reloadIgnoringLocalAndRemoteCacheData
            assetsRequest.setValue("no-cache, no-store, max-age=0", forHTTPHeaderField: "Cache-Control")
            assetsRequest.setValue("no-cache", forHTTPHeaderField: "Pragma")

            let (assetsData, assetsResponse) = try await session.data(for: assetsRequest)
            try validate(response: assetsResponse, data: assetsData)
            let assets = try JSONDecoder().decode([Asset].self, from: assetsData)

            if let asset = assets.first(where: { $0.name == assetName }) {
                matchedAsset = asset
                break
            }
            if assets.count < 100 { break }
        }

        guard let asset = matchedAsset else { return nil }

        let assetURL = try apiURL("/repos/\\(configuration.owner)/\\(configuration.repository)/releases/assets/\\(asset.id)")
        var statusRequest = request(url: assetURL)
        statusRequest.setValue("application/octet-stream", forHTTPHeaderField: "Accept")
        statusRequest.setValue("no-cache, no-store, max-age=0", forHTTPHeaderField: "Cache-Control")
        statusRequest.setValue("no-cache", forHTTPHeaderField: "Pragma")
        statusRequest.cachePolicy = .reloadIgnoringLocalAndRemoteCacheData
        let (data, response) = try await session.data(for: statusRequest)
        try validate(response: response, data: data)
        return try JSONDecoder().decode(PublishStatusPayload.self, from: data)
    }
'''
          if old_fetch not in text:
              raise SystemExit('Expected fetchPublishStatus block was not found')
          service.write_text(text.replace(old_fetch, new_fetch, 1))

          project = Path('NextSigner/project.yml')
          p = project.read_text()
          p = p.replace('MARKETING_VERSION: "1.3.3"', 'MARKETING_VERSION: "1.3.4"', 1)
          p = p.replace('CURRENT_PROJECT_VERSION: "16"', 'CURRENT_PROJECT_VERSION: "17"', 1)
          project.write_text(p)

          index = Path('install/index.html')
          html = index.read_text()
          old = "const response=await fetch('/install/apps.json',{cache:'no-store'});"
          new = "const response=await fetch('/install/apps.json?v='+Date.now(),{cache:'no-store',headers:{'Cache-Control':'no-cache'}});"
          if old not in html:
              raise SystemExit('Expected installer catalog fetch was not found')
          html = html.replace(old, new, 1)
          html = html.replace('    loadCatalog();\n', '    loadCatalog();\n    setInterval(loadCatalog,30000);\n', 1)
          index.write_text(html)
          PY

      - name: Commit production fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add NextSigner/NextSigner/GitHubService.swift NextSigner/project.yml install/index.html
          git commit -m 'Fix Next Signer live log polling and installer refresh'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          python3 NextSigner/generate_app_icon.py
          brew install xcodegen
          cd NextSigner
          xcodegen generate

      - name: Compile Next Signer 1.3.4
        working-directory: NextSigner
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project NextSigner.xcodeproj \
            -scheme NextSigner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/NextSigner134" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package TIPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find "$RUNNER_TEMP/NextSigner134/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name '*.app' | head -n1)"
          test -n "$APP_PATH" || { echo 'Built app not found'; exit 1; }
          rm -rf "$RUNNER_TEMP/package"
          mkdir -p "$RUNNER_TEMP/package/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/package/Payload/NextSigner.app"
          cd "$RUNNER_TEMP/package"
          /usr/bin/zip -qry "$RUNNER_TEMP/NextSigner-${VERSION}.ipa" Payload
          cp "$RUNNER_TEMP/NextSigner-${VERSION}.ipa" "$RUNNER_TEMP/NextSigner-${VERSION}.tipa"
          unzip -t "$RUNNER_TEMP/NextSigner-${VERSION}.tipa" >/dev/null
          echo "SHA256=$(shasum -a 256 "$RUNNER_TEMP/NextSigner-${VERSION}.tipa" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: NextSigner-1.3.4-TIPA
          path: |
            ${{ runner.temp }}/NextSigner-1.3.4.tipa
            ${{ runner.temp }}/NextSigner-1.3.4.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Start production publisher
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow publish-nextsigner-transfer.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run publish-nextsigner-transfer.yml --repo "$GITHUB_REPOSITORY" --ref main -f version="$VERSION"
          RUN_ID=''
          for attempt in $(seq 1 30); do
            candidate="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow publish-nextsigner-transfer.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            if [ "$candidate" != "0" ] && [ "$candidate" != "$BEFORE" ]; then RUN_ID="$candidate"; break; fi
            sleep 2
          done
          test -n "$RUN_ID" || { echo 'Could not locate publisher run'; exit 1; }
          echo "PUBLISH_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          gh issue comment "$REPORT_ISSUE" --repo "$GITHUB_REPOSITORY" --body "NEXTSIGNER_1_3_4_PUBLISH_STARTED run=$RUN_ID sha256=$SHA256"

      - name: Wait for publisher
        run: gh run watch "$PUBLISH_RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status --interval 8

      - name: Report success
        if: success()
        run: gh issue comment "$REPORT_ISSUE" --repo "$GITHUB_REPOSITORY" --body "NEXTSIGNER_1_3_4_PUBLISHED publish=$PUBLISH_RUN_ID sha256=$SHA256"

      - name: Report failure
        if: failure()
        run: gh issue comment "$REPORT_ISSUE" --repo "$GITHUB_REPOSITORY" --body "NEXTSIGNER_1_3_4_FAILED controller=${{ github.run_id }} publish=${PUBLISH_RUN_ID:-unknown}"
