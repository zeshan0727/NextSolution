# Next Ledger 1.3.50 validated build
# Build trigger: RootHide SMS daemon startup and diagnostic fix
name: Build Next Ledger TIPA

permissions:
  contents: write

concurrency:
  group: next-ledger-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "DailyLedger/**"
      - "RootHideSMSQueue/**"
      - "scripts/**"
      - "project.yml"
      - ".github/workflows/build-tipa.yml"
  push:
    paths:
      - "DailyLedger/**"
      - "RootHideSMSQueue/**"
      - "scripts/**"
      - "project.yml"
      - ".github/workflows/build-tipa.yml"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Apply Next Ledger feature patches
        run: |
          python3 scripts/apply_next_ledger_1_3_50_compact_no_sms.py
          python3 scripts/fix_next_ledger_refund_swift.py
          python3 scripts/add_refund_account_picker.py
          python3 scripts/add_currency_selectors_and_global_delete.py
          python3 scripts/add_inline_accounts_and_general_subaccounts.py
          python3 scripts/add_parent_totals_and_statement_chart.py
          python3 scripts/add_collapsible_chart_sections.py
          python3 scripts/add_edit_refund_delete_swipe_actions.py
          python3 scripts/add_bank_expenses_and_fixed_report_conversion.py
          python3 scripts/fix_summary_loan_sides_and_accounts_zero_filter.py
          python3 scripts/add_payment_receivable_payable_automation.py
          python3 scripts/add_receivable_collection_drilldown.py
          python3 scripts/add_loan_summary_comparison_report.py
          python3 scripts/fix_loan_summary_comparison_ios16.py
          python3 scripts/add_accounting_period_setting.py
          python3 scripts/add_custom_dates_to_loan_summary_comparison.py
          python3 scripts/add_root_sms_daemon_console.py
          python3 scripts/add_sms_installer_diagnostics.py

      - name: Install build tools
        run: brew install xcodegen dpkg ldid

      - name: Test CBQ SMS parser
        run: |
          mkdir -p build
          xcrun clang \
            -fobjc-arc \
            RootHideSMSQueue/Sources/main.m \
            -framework Foundation \
            -framework CoreFoundation \
            -lsqlite3 \
            -o build/nextledgersmsd-macos
          build/nextledgersmsd-macos --self-test | tee build/sms-parser-tests.json
          grep -q '"passed" : true' build/sms-parser-tests.json

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iPhone app
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project DailyLedger.xcodeproj \
            -scheme DailyLedger \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build/xcodebuild.log

      - name: Build and inspect RootHide SMS daemon package
        shell: bash
        run: |
          set -euxo pipefail
          THEOS_COMMIT="88506b2c22e9e07dd4ed055f23c9e398a117a2c7"
          git init "$RUNNER_TEMP/theos"
          git -C "$RUNNER_TEMP/theos" remote add origin https://github.com/roothide/theos.git
          git -C "$RUNNER_TEMP/theos" fetch --depth 1 origin "$THEOS_COMMIT"
          git -C "$RUNNER_TEMP/theos" checkout --detach "$THEOS_COMMIT"
          git -C "$RUNNER_TEMP/theos" submodule update --init --recursive --depth 1
          export THEOS="$RUNNER_TEMP/theos"
          chmod +x RootHideSMSQueue/postinst RootHideSMSQueue/prerm
          make -C RootHideSMSQueue clean package FINALPACKAGE=1
          cp RootHideSMSQueue/packages/*.deb NextLedgerSMSDaemon-2.0.1-roothide.deb
          shasum -a 256 NextLedgerSMSDaemon-2.0.1-roothide.deb > NextLedgerSMSDaemon-2.0.1-roothide.sha256

          rm -rf build/sms-daemon-root build/sms-daemon-control
          mkdir -p build/sms-daemon-root build/sms-daemon-control
          dpkg-deb -x NextLedgerSMSDaemon-2.0.1-roothide.deb build/sms-daemon-root
          dpkg-deb -e NextLedgerSMSDaemon-2.0.1-roothide.deb build/sms-daemon-control
          dpkg-deb -c NextLedgerSMSDaemon-2.0.1-roothide.deb | tee build/sms-daemon-package.txt
          sed -n '1,260p' build/sms-daemon-control/postinst | tee build/sms-daemon-postinst.txt

          test -x build/sms-daemon-root/usr/libexec/nextledgersmsd
          test -f build/sms-daemon-root/Library/LaunchDaemons/com.nextsolution.nextledgersmsd.plist
          test -x build/sms-daemon-control/postinst
          test -x build/sms-daemon-control/prerm

          ldid -e build/sms-daemon-root/usr/libexec/nextledgersmsd > build/sms-daemon-entitlements.plist
          grep -q 'platform-application' build/sms-daemon-entitlements.plist
          grep -q 'com.apple.private.security.no-sandbox' build/sms-daemon-entitlements.plist
          grep -q 'com.apple.private.security.storage.AppDataContainers' build/sms-daemon-entitlements.plist

          plutil -convert xml1 -o build/sms-daemon-launchd.xml \
            build/sms-daemon-root/Library/LaunchDaemons/com.nextsolution.nextledgersmsd.plist
          grep -Fq '/var/mobile/Library/NextLedgerSMSImport/nextledgersmsd' build/sms-daemon-launchd.xml
          grep -Fq 'jbroot' build/sms-daemon-control/postinst
          grep -Fq 'JB_PLIST' build/sms-daemon-control/postinst
          grep -Fq 'jbctl trustcache add' build/sms-daemon-control/postinst
          grep -Fq '/rootfs/var/mobile/Library/NextLedgerSMSImport' build/sms-daemon-control/postinst

      - name: Capture build diagnostics
        if: failure()
        run: |
          mkdir -p build
          {
            test -f build/xcodebuild.log && grep -E "error:|fatal error:|SwiftCompile|BUILD FAILED" build/xcodebuild.log || true
            test -f build/sms-parser-tests.json && cat build/sms-parser-tests.json || true
            test -f build/sms-daemon-package.txt && cat build/sms-daemon-package.txt || true
            test -f build/sms-daemon-postinst.txt && cat build/sms-daemon-postinst.txt || true
            test -f build/sms-daemon-entitlements.plist && cat build/sms-daemon-entitlements.plist || true
            test -f build/sms-daemon-launchd.xml && cat build/sms-daemon-launchd.xml || true
          } > build/build-errors.txt
          test -s build/build-errors.txt || printf '%s\n' "Build failed before diagnostics were produced." > build/build-errors.txt

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NextLedger-Build-Diagnostics
          path: build/build-errors.txt
          if-no-files-found: error

      - name: Package for TrollStore
        run: |
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload NextLedger-1.3.50-root-sms-startup-fix.tipa
          shasum -a 256 NextLedger-1.3.50-root-sms-startup-fix.tipa > NextLedger-1.3.50-root-sms-startup-fix.sha256

      - name: Upload TIPA and RootHide daemon
        uses: actions/upload-artifact@v4
        with:
          name: NextLedger-TrollStore
          path: |
            NextLedger-1.3.50-root-sms-startup-fix.tipa
            NextLedger-1.3.50-root-sms-startup-fix.sha256
            NextLedgerSMSDaemon-2.0.1-roothide.deb
            NextLedgerSMSDaemon-2.0.1-roothide.sha256
            build/sms-parser-tests.json
            build/sms-daemon-entitlements.plist
            build/sms-daemon-launchd.xml
            build/sms-daemon-postinst.txt
          if-no-files-found: error
