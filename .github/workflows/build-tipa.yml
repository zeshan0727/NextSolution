# Next Ledger 1.3.50 validated build
# Build trigger: Receivable Collected card transaction drill-down
name: Build Next Ledger TIPA

permissions:
  contents: write

concurrency:
  group: next-ledger-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "DailyLedger/**"
      - "scripts/apply_next_ledger_1_3_50_compact_no_sms.py"
      - "scripts/fix_next_ledger_refund_swift.py"
      - "scripts/add_refund_account_picker.py"
      - "scripts/add_currency_selectors_and_global_delete.py"
      - "scripts/add_inline_accounts_and_general_subaccounts.py"
      - "scripts/add_parent_totals_and_statement_chart.py"
      - "scripts/add_collapsible_chart_sections.py"
      - "scripts/add_edit_refund_delete_swipe_actions.py"
      - "scripts/add_bank_expenses_and_fixed_report_conversion.py"
      - "scripts/fix_summary_loan_sides_and_accounts_zero_filter.py"
      - "scripts/add_payment_receivable_payable_automation.py"
      - "scripts/add_receivable_collection_drilldown.py"
      - "project.yml"
      - ".github/workflows/build-tipa.yml"
  push:
    paths:
      - "DailyLedger/**"
      - "scripts/apply_next_ledger_1_3_50_compact_no_sms.py"
      - "scripts/fix_next_ledger_refund_swift.py"
      - "scripts/add_refund_account_picker.py"
      - "scripts/add_currency_selectors_and_global_delete.py"
      - "scripts/add_inline_accounts_and_general_subaccounts.py"
      - "scripts/add_parent_totals_and_statement_chart.py"
      - "scripts/add_collapsible_chart_sections.py"
      - "scripts/add_edit_refund_delete_swipe_actions.py"
      - "scripts/add_bank_expenses_and_fixed_report_conversion.py"
      - "scripts/fix_summary_loan_sides_and_accounts_zero_filter.py"
      - "scripts/add_payment_receivable_payable_automation.py"
      - "scripts/add_receivable_collection_drilldown.py"
      - "project.yml"
      - ".github/workflows/build-tipa.yml"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Apply Next Ledger feature patches
        run: |
          python3 scripts/apply_next_ledger_1_3_50_compact_no_sms.py
          python3 scripts/fix_next_ledger_refund_swift.py
          python3 scripts/add_refund_account_picker.py
          python3 scripts/add_currency_selectors_and_global_delete.py
          python3 scripts/add_inline_accounts_and_general_subaccounts.py
          python3 scripts/add_parent_totals_and_statement_chart.py
          python3 scripts/add_collapsible_chart_sections.py
          python3 scripts/add_edit_refund_delete_swipe_actions.py
          python3 scripts/add_bank_expenses_and_fixed_report_conversion.py
          python3 scripts/fix_summary_loan_sides_and_accounts_zero_filter.py
          python3 scripts/add_payment_receivable_payable_automation.py
          python3 scripts/add_receivable_collection_drilldown.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iPhone app
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project DailyLedger.xcodeproj \
            -scheme DailyLedger \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build/xcodebuild.log

      - name: Capture build diagnostics
        if: failure()
        run: |
          mkdir -p build
          grep -E "error:|fatal error:|SwiftCompile|BUILD FAILED" build/xcodebuild.log > build/build-errors.txt || true
          if [ ! -s build/build-errors.txt ]; then
            if [ -f build/xcodebuild.log ]; then
              tail -n 250 build/xcodebuild.log > build/build-errors.txt
            else
              printf '%s\n' "Feature patch application failed before Xcode compilation." > build/build-errors.txt
            fi
          fi

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NextLedger-Build-Diagnostics
          path: build/build-errors.txt
          if-no-files-found: error

      - name: Package for TrollStore
        run: |
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload NextLedger-1.3.50-receivable-transactions-drilldown.tipa
          shasum -a 256 NextLedger-1.3.50-receivable-transactions-drilldown.tipa > NextLedger-1.3.50-receivable-transactions-drilldown.sha256

      - name: Upload TIPA
        uses: actions/upload-artifact@v4
        with:
          name: NextLedger-TrollStore
          path: |
            NextLedger-1.3.50-receivable-transactions-drilldown.tipa
            NextLedger-1.3.50-receivable-transactions-drilldown.sha256
          if-no-files-found: error
