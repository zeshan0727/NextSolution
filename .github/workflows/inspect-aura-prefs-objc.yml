name: Inspect AuraPrefs Objective-C Controller

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-aura-prefs-objc.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: brew install dpkg
      - name: Inspect Objective-C metadata
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ap
          dpkg-deb -R debfiles/NextAura_Runtime_preferences_1.0.4_RootHide.deb /tmp/ap
          B=/tmp/ap/Library/PreferenceBundles/AuraPrefs.bundle/AuraPrefs
          {
            echo '=== NM OBJC ==='
            nm -m "$B" 2>/dev/null | grep -Ei 'OBJC_(CLASS|METACLASS)|PSListController|Controller' || true
            echo '=== STRINGS CONTROLLERS ==='
            strings -a "$B" | grep -Ei 'Controller|PSList|specifier|configureCCModuleBackground|respringDevice|applyCC' | sort -u | head -n 500
            echo '=== OBJC IMAGE INFO ==='
            otool -ov "$B" 2>/dev/null | grep -E -A4 -B2 'name +0x|baseMethods|Aura|Controller' | head -n 1000 || true
          } > transfer/diagnostics/aura-prefs-objc.txt
          git config user.name 'Next Solution Inspect Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add transfer/diagnostics/aura-prefs-objc.txt
          git commit -m 'Record AuraPrefs Objective-C controller inspection'
          git push origin HEAD:main
