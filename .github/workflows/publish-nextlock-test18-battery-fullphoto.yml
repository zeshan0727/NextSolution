name: Build and Publish NextLock 1.1.5 Test 18 Battery + Full Photo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-nextlock-test18-battery-fullphoto.yml'
      - 'source/NextLockBatteryItems18/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-nextlock-1.1.5-test18-battery-fullphoto
  cancel-in-progress: false

jobs:
  build-publish:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: brew install dpkg ldid

      - name: Validate Test 18 source
        shell: bash
        run: |
          set -euo pipefail
          SRC='source/NextLockBatteryItems18/Tweak.m'
          grep -q '1.1.5-test18 movable-percent-icon full-photo-migration' "$SRC"
          grep -q 'SBFLockScreenDateView' "$SRC"
          grep -q 'customBatteryPercentEnabled' "$SRC"
          grep -q 'customBatteryIconEnabled' "$SRC"
          grep -q 'test18FullPhotoMigrationDone' "$SRC"
          grep -q 'photoFrame%luContentMode' "$SRC"
          ! grep -q 'UIApplication.sharedApplication.windows' "$SRC"
          ! grep -q 'dispatch_source_create' "$SRC"

      - name: Build RootHide battery runtime
        shell: bash
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/source/NextLockBatteryItems18"
          T="$RUNNER_TEMP/theos-rh"
          git init "$T"
          git -C "$T" remote add origin https://github.com/roothide/theos.git
          git -C "$T" fetch --depth 1 origin 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$T" checkout --detach 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$T" submodule update --init --recursive --depth 1
          export THEOS="$T"
          export THEOS_PACKAGE_SCHEME=roothide
          rm -rf "$P/.theos" "$P/packages"
          make -C "$P" clean package FINALPACKAGE=1
          D=$(find "$P/packages" -type f -name '*.deb' -print -quit)
          test -n "$D"
          X=$(mktemp -d)
          dpkg-deb -x "$D" "$X"
          F=$(find "$X" -name NextLockBatteryItems18.dylib -print -quit)
          test -n "$F"
          strings -a "$F" | grep -q '1.1.5-test18 movable-percent-icon full-photo-migration'
          strings -a "$F" | grep -q 'SBFLockScreenDateView'
          strings -a "$F" | grep -q 'customBatteryPercentEnabled'
          strings -a "$F" | grep -q 'customBatteryIconEnabled'
          lipo -info "$F" | grep -q arm64e
          echo "BATTERY_DEB=$D" >> "$GITHUB_ENV"

      - name: Integrate into exact Test 17 and restore validated full-photo picker
        shell: bash
        run: |
          set -euo pipefail
          BASE='transfer/files/NextLock/1.1.5-Test17-DateFix/NextLock_1.1.5_Test17_DateFix_RootHide.deb'
          PHOTO_BASE='transfer/files/NextLock/1.1.5-CPUFix-Test9-FreePosition/NextLock_1.1.5_CPUFix_Test9_FreePosition_RootHide.deb'
          test -f "$BASE"
          test -f "$PHOTO_BASE"
          test "$(shasum -a 256 "$BASE" | awk '{print $1}')" = 'e0f747c6fd6c4da59add1f240fb88ece65267cc96423db4eb714b1e8f2c09719'

          STAGE="$RUNNER_TEMP/nextlock-test18"
          BAT="$RUNNER_TEMP/battery18"
          PHOTO="$RUNNER_TEMP/photo9"
          OUT="$RUNNER_TEMP/out"
          mkdir -p "$OUT"
          dpkg-deb -R "$BASE" "$STAGE"
          dpkg-deb -x "$BATTERY_DEB" "$BAT"
          dpkg-deb -x "$PHOTO_BASE" "$PHOTO"

          LOCK=$(find "$STAGE" -name LockGlyphTime.dylib -print -quit)
          CLOCK=$(find "$STAGE" -name NextLockCustomClock.dylib -print -quit)
          HIDE=$(find "$STAGE" -name NextLockHideElements.dylib -print -quit)
          DATEFIX=$(find "$STAGE" -name NextLockDateFix17.dylib -print -quit)
          OLDPERF=$(find "$STAGE" -name NextLockPerfFix.dylib -print -quit)
          NEWPERF=$(find "$PHOTO" -name NextLockPerfFix.dylib -print -quit)
          NEWPERFPLIST=$(find "$PHOTO" -name NextLockPerfFix.plist -print -quit)
          BATDYLIB=$(find "$BAT" -name NextLockBatteryItems18.dylib -print -quit)
          BATPLIST=$(find "$BAT" -name NextLockBatteryItems18.plist -print -quit)
          test -n "$LOCK"; test -n "$CLOCK"; test -n "$HIDE"; test -n "$DATEFIX"; test -n "$OLDPERF"
          test -n "$NEWPERF"; test -n "$NEWPERFPLIST"; test -n "$BATDYLIB"; test -n "$BATPLIST"

          LOCK_SHA=$(shasum -a 256 "$LOCK" | awk '{print $1}')
          CLOCK_SHA=$(shasum -a 256 "$CLOCK" | awk '{print $1}')
          HIDE_SHA=$(shasum -a 256 "$HIDE" | awk '{print $1}')
          DATEFIX_SHA=$(shasum -a 256 "$DATEFIX" | awk '{print $1}')

          DYNDIR=$(dirname "$OLDPERF")
          cp "$NEWPERF" "$DYNDIR/NextLockPerfFix.dylib"
          cp "$NEWPERFPLIST" "$DYNDIR/NextLockPerfFix.plist"
          cp "$BATDYLIB" "$DYNDIR/NextLockBatteryItems18.dylib"
          cp "$BATPLIST" "$DYNDIR/NextLockBatteryItems18.plist"

          strings -a "$DYNDIR/NextLockPerfFix.dylib" | grep -q '1.1.5-test9 preserve-all-style free-photo-position refined-full-picker'
          strings -a "$DYNDIR/NextLockPerfFix.dylib" | grep -q 'full-photo no-crop picker'

          python3 - "$STAGE" <<'PY'
          from pathlib import Path
          import plistlib,re,sys

          stage=Path(sys.argv[1])
          bundle=stage/'Library/PreferenceBundles/LockGlyphTimePrefs.bundle'
          root=bundle/'Root.plist'
          with root.open('rb') as f: data=plistlib.load(f)
          items=data.get('items',[])

          hide_keys={
            'hideLockScreenTime','hideLockScreenDate','hideLockScreenCamera',
            'hideLockScreenFlashlight','hideLockScreenStatusBar',
            'hideLockScreenOtherText','hideLockScreenBars'
          }
          battery_keys={
            'customBatteryPercentEnabled','customBatteryPercentXPercent','customBatteryPercentYPercent','customBatteryPercentSize',
            'customBatteryIconEnabled','customBatteryIconXPercent','customBatteryIconYPercent','customBatteryIconScale'
          }
          remove_groups={'HIDE LOCK SCREEN ELEMENTS','HIDE ITEMS','Hide Items','CUSTOM BATTERY ITEMS','Custom Battery Items'}
          items=[x for x in items if x.get('key') not in hide_keys|battery_keys and x.get('label') not in remove_groups]

          def sw(key,label,default=False):
              return {
                'PostNotification':'com.nextsolution.lockglyphtime/ReloadPrefs',
                'cell':'PSSwitchCell','default':default,
                'defaults':'com.nextsolution.lockglyphtime','key':key,'label':label
              }
          def slider(key,label,default,minv,maxv):
              return {
                'PostNotification':'com.nextsolution.lockglyphtime/ReloadPrefs',
                'cell':'PSSliderCell','default':default,
                'defaults':'com.nextsolution.lockglyphtime','key':key,'label':label,
                'min':minv,'max':maxv,'showValue':True
              }

          hide_section=[
            {'cell':'PSGroupCell','label':'HIDE ITEMS',
             'footerText':'One place for all Lock Screen visibility controls. Each switch works independently and restores the item when turned off.'},
            sw('hideLockScreenTime','Time'),
            sw('hideLockScreenDate','Date'),
            sw('hideLockScreenFlashlight','Flashlight Button'),
            sw('hideLockScreenCamera','Camera Button'),
            sw('hideLockScreenStatusBar','Status Bar'),
            sw('hideLockScreenOtherText','Other Lock Screen Text'),
            sw('hideLockScreenBars','CC / Gesture Bars'),
          ]

          battery_section=[
            {'cell':'PSGroupCell','label':'CUSTOM BATTERY ITEMS',
             'footerText':'Independent Lock Screen battery items inspired by Designer-style elements. Percentage and icon can each be enabled and moved freely anywhere using full-screen X/Y controls.'},
            sw('customBatteryPercentEnabled','Show Battery Percentage'),
            slider('customBatteryPercentXPercent','Percentage Horizontal Position',50,0,100),
            slider('customBatteryPercentYPercent','Percentage Vertical Position',27,0,100),
            slider('customBatteryPercentSize','Percentage Text Size',18,10,60),
            sw('customBatteryIconEnabled','Show Battery Icon'),
            slider('customBatteryIconXPercent','Icon Horizontal Position',62,0,100),
            slider('customBatteryIconYPercent','Icon Vertical Position',27,0,100),
            slider('customBatteryIconScale','Icon Size',1.0,0.5,3.0),
          ]

          insert_at=len(items)
          for i,obj in enumerate(items):
              if obj.get('cell')=='PSGroupCell' and obj.get('label')=='MORE':
                  insert_at=i
                  break
          items[insert_at:insert_at]=hide_section+ battery_section
          data['items']=items
          with root.open('wb') as f: plistlib.dump(data,f,fmt=plistlib.FMT_XML,sort_keys=False)

          # Restore the validated full-photo UI semantics for all four frames.
          for i in range(1,5):
              p=bundle/f'PhotoFrame{i}.plist'
              with p.open('rb') as f: d=plistlib.load(f)
              key=f'photoFrame{i}ContentMode'
              cleaned=[x for x in d.get('items',[]) if x.get('key') != key]
              mode={
                'PostNotification':'com.nextsolution.lockglyphtime/ReloadPrefs',
                'cell':'PSLinkListCell','default':2,
                'defaults':'com.nextsolution.lockglyphtime','detail':'PSListItemsController',
                'key':key,'label':'Photo Display',
                'validTitles':['Full Photo (Recommended)','Auto','Stretch','Cut / Crop'],
                'validValues':[2,0,1,3]
              }
              cleaned.insert(4 if len(cleaned)>=4 else len(cleaned),mode)
              d['items']=cleaned
              with p.open('wb') as f: plistlib.dump(d,f,fmt=plistlib.FMT_XML,sort_keys=False)

          c=stage/'DEBIAN/control'
          t=c.read_text()
          t=re.sub(r'^Version: .*$', 'Version: 1.1.5~cpu18', t, flags=re.M)
          desc=('Description: NextLock 1.1.5 Test 18. Keeps the working Test 17 hide/date fixes, restores the validated Test 9 full-photo no-crop picker and free photo positioning, migrates existing frames once to Full Photo, keeps Cut/Crop selectable, rebuilds one HIDE ITEMS section, and adds freely movable Battery Percentage and Battery Icon items.')
          t=re.sub(r'^Description: .*$',desc,t,flags=re.M) if re.search(r'^Description: .*$',t,re.M) else t+'\n'+desc+'\n'
          c.write_text(t)
          PY

          OUTDEB="$OUT/NextLock_1.1.5_Test18_BatteryFullPhoto_RootHide.deb"
          dpkg-deb -b "$STAGE" "$OUTDEB"
          test "$(dpkg-deb -f "$OUTDEB" Package)" = 'com.nextsolution.lockglyphtime'
          test "$(dpkg-deb -f "$OUTDEB" Version)" = '1.1.5~cpu18'

          X=$(mktemp -d)
          dpkg-deb -x "$OUTDEB" "$X"
          LOCK2=$(find "$X" -name LockGlyphTime.dylib -print -quit)
          CLOCK2=$(find "$X" -name NextLockCustomClock.dylib -print -quit)
          HIDE2=$(find "$X" -name NextLockHideElements.dylib -print -quit)
          DATEFIX2=$(find "$X" -name NextLockDateFix17.dylib -print -quit)
          PERF2=$(find "$X" -name NextLockPerfFix.dylib -print -quit)
          BAT2=$(find "$X" -name NextLockBatteryItems18.dylib -print -quit)
          test "$(shasum -a 256 "$LOCK2" | awk '{print $1}')" = "$LOCK_SHA"
          test "$(shasum -a 256 "$CLOCK2" | awk '{print $1}')" = "$CLOCK_SHA"
          test "$(shasum -a 256 "$HIDE2" | awk '{print $1}')" = "$HIDE_SHA"
          test "$(shasum -a 256 "$DATEFIX2" | awk '{print $1}')" = "$DATEFIX_SHA"
          strings -a "$PERF2" | grep -q '1.1.5-test9 preserve-all-style free-photo-position refined-full-picker'
          strings -a "$PERF2" | grep -q 'full-photo no-crop picker'
          strings -a "$BAT2" | grep -q '1.1.5-test18 movable-percent-icon full-photo-migration'
          lipo -info "$PERF2" | grep -q arm64e
          lipo -info "$BAT2" | grep -q arm64e

          RP="$X/Library/PreferenceBundles/LockGlyphTimePrefs.bundle/Root.plist"
          python3 - "$RP" <<'PY'
          import plistlib,sys
          with open(sys.argv[1],'rb') as f: d=plistlib.load(f)
          items=d.get('items',[])
          assert sum(1 for x in items if x.get('cell')=='PSGroupCell' and x.get('label')=='HIDE ITEMS') == 1
          assert sum(1 for x in items if x.get('cell')=='PSGroupCell' and x.get('label')=='CUSTOM BATTERY ITEMS') == 1
          keys={x.get('key') for x in items}
          required={
            'hideLockScreenTime','hideLockScreenDate','hideLockScreenCamera','hideLockScreenFlashlight','hideLockScreenStatusBar','hideLockScreenOtherText','hideLockScreenBars',
            'customBatteryPercentEnabled','customBatteryPercentXPercent','customBatteryPercentYPercent','customBatteryPercentSize',
            'customBatteryIconEnabled','customBatteryIconXPercent','customBatteryIconYPercent','customBatteryIconScale'
          }
          assert required <= keys
          PY
          for i in 1 2 3 4; do
            P="$X/Library/PreferenceBundles/LockGlyphTimePrefs.bundle/PhotoFrame${i}.plist"
            plutil -p "$P" | grep -q "photoFrame${i}ContentMode"
            plutil -p "$P" | grep -q 'Full Photo (Recommended)'
          done

          SHA=$(shasum -a 256 "$OUTDEB" | awk '{print $1}')
          echo "OUTDEB=$OUTDEB" >> "$GITHUB_ENV"
          echo "OUT_SHA=$SHA" >> "$GITHUB_ENV"
          echo "Test 18 SHA-256: $SHA"

      - name: Publish Test 18 to NS Transfer
        shell: bash
        run: |
          set -euo pipefail
          DEST_DIR='transfer/files/NextLock/1.1.5-Test18-BatteryFullPhoto'
          DEST="$DEST_DIR/NextLock_1.1.5_Test18_BatteryFullPhoto_RootHide.deb"
          mkdir -p "$DEST_DIR"
          cp "$OUTDEB" "$DEST"
          test "$(shasum -a 256 "$DEST" | awk '{print $1}')" = "$OUT_SHA"
          export OUT_SHA

          python3 - <<'PY'
          import json,os
          from pathlib import Path
          from datetime import datetime,timezone
          p=Path('transfer/index.json')
          data=json.loads(p.read_text())
          files=[]
          for x in data.get('files',[]):
              ident=x.get('id','')
              if ident.startswith('nextlock-1.1.5-test17') or ident.startswith('nextlock-1.1.5-test18'):
                  continue
              files.append(x)
          entry={
            'id':'nextlock-1.1.5-test18-battery-fullphoto-roothide',
            'name':'NextLock 1.1.5 Test 18 Battery + Full Photo RootHide',
            'fileName':'NextLock_1.1.5_Test18_BatteryFullPhoto_RootHide.deb',
            'type':'deb','platform':'RootHide','version':'1.1.5-test18',
            'url':'https://nextjailbreak.com/transfer/files/NextLock/1.1.5-Test18-BatteryFullPhoto/NextLock_1.1.5_Test18_BatteryFullPhoto_RootHide.deb',
            'sha256':os.environ['OUT_SHA'],
            'notes':'Test 18 keeps working Test 17 hide/date behavior, restores the validated Test 9 full-photo no-crop picker and free photo positioning, migrates existing frames once to Full Photo while retaining Cut/Crop, keeps exactly one HIDE ITEMS section, and adds independent movable Battery Percentage and Battery Icon items with full-screen X/Y controls.'
          }
          data['files']=[entry]+files
          data['updatedAt']=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY

          git config user.name 'Next Jailbreak Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add "$DEST" transfer/index.json
          git diff --cached --check
          git commit -m 'Publish NextLock 1.1.5 Test 18 Battery + Full Photo'
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Upload Test 18 package
        uses: actions/upload-artifact@v4
        with:
          name: NextLock-Test18-Battery-FullPhoto-RootHide
          path: ${{ env.OUTDEB }}
          if-no-files-found: error
          retention-days: 14
