name: Build Next Ledger 1.3.66 Fixed Accounting Registers
permissions:
  contents: write
concurrency:
  group: next-ledger-1-3-66-registered-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-next-ledger-1.3.62.yml"
      - "scripts/apply_next_ledger_1_3_66.sh"
      - "scripts/add_fixed_asset_liability_registers_1_3_66.py"
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply 1.3.66
        run: bash scripts/apply_next_ledger_1_3_66.sh
      - name: Validate accounting registers
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'MARKETING_VERSION: "1.3.66"' project.yml
          grep -Fq 'CURRENT_PROJECT_VERSION: "74"' project.yml
          grep -Fq 'case fixedAsset' DailyLedger/Models/LedgerTransaction.swift
          grep -Fq 'case fixedLiability' DailyLedger/Models/LedgerTransaction.swift
          grep -Fq 'struct FixedAssetRecord' DailyLedger/Models/LedgerTransaction.swift
          grep -Fq 'var disposalGainLoss: Decimal?' DailyLedger/Models/LedgerTransaction.swift
          grep -Fq 'struct FixedLiabilityRecord' DailyLedger/Models/LedgerTransaction.swift
          grep -Fq 'func saveFixedAssetRecord' DailyLedger/Services/LedgerStore.swift
          grep -Fq 'func saveFixedLiabilityRecord' DailyLedger/Services/LedgerStore.swift
          grep -Fq 'struct FixedAssetRegisterView' DailyLedger/Views/FixedAccountingRegistersView.swift
          grep -Fq 'case sold = "Sold"' DailyLedger/Views/FixedAccountingRegistersView.swift
          grep -Fq 'case disposed = "Disposed"' DailyLedger/Views/FixedAccountingRegistersView.swift
          grep -Fq 'Gain / (Loss)' DailyLedger/Views/FixedAccountingRegistersView.swift
          grep -Fq 'struct FixedAssetDisposalView' DailyLedger/Views/FixedAccountingRegistersView.swift
          grep -Fq 'struct FixedLiabilityRegisterView' DailyLedger/Views/FixedAccountingRegistersView.swift
          grep -Fq 'Section("Accounting Registers")' DailyLedger/Views/ReportsView.swift
          grep -Fq 'LabeledContent("Version", value: "1.3.66")' DailyLedger/Views/SettingsView.swift
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build unsigned iPhone app
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project DailyLedger.xcodeproj -scheme DailyLedger -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build/xcodebuild.log
      - name: Package TIPA
        run: |
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          rm -rf Payload && mkdir Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload NextLedger-1.3.66-fixed-accounting-registers.tipa
          shasum -a 256 NextLedger-1.3.66-fixed-accounting-registers.tipa > NextLedger-1.3.66-fixed-accounting-registers.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: NextLedger-1.3.66-Fixed-Accounting-Registers
          path: |
            NextLedger-1.3.66-fixed-accounting-registers.tipa
            NextLedger-1.3.66-fixed-accounting-registers.sha256
          if-no-files-found: error
      - name: Capture diagnostics
        if: failure()
        run: |
          mkdir -p build
          { test -f build/xcodebuild.log && grep -E "error:|fatal error:|SwiftCompile|BUILD FAILED" build/xcodebuild.log || true; } > build/next-ledger-1.3.66-errors.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: NextLedger-1.3.66-Diagnostics
          path: build/next-ledger-1.3.66-errors.txt
          if-no-files-found: warn
      - name: Publish status
        if: always()
        shell: bash
        run: |
          STATUS="${{ job.status }}"
          git reset --hard HEAD
          git clean -fd
          git fetch origin "$GITHUB_REF_NAME"
          git checkout -B build-status "origin/$GITHUB_REF_NAME"
          mkdir -p .build-status
          cat > .build-status/next-ledger-1.3.66.json <<EOF
          {"status":"${STATUS}","run_id":"${GITHUB_RUN_ID}","source_sha":"${GITHUB_SHA}","app_version":"1.3.66","app_build":"74","daemon_version":"2.2.3","artifact_name":"NextLedger-1.3.66-Fixed-Accounting-Registers"}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .build-status/next-ledger-1.3.66.json
          git commit -m "Record Next Ledger 1.3.66 build status" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
# forced registered-workflow trigger
