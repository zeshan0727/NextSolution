name: Build Next Ledger 1.3.70 Financial Summary Currency Drilldowns
permissions:
  contents: write
concurrency:
  group: next-ledger-1-3-70-registered-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-next-ledger-1.3.62.yml"
      - "scripts/apply_next_ledger_1_3_70.sh"
      - "scripts/fix_financial_summary_currency_drilldown_1_3_70.py"
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply 1.3.70
        run: bash scripts/apply_next_ledger_1_3_70.sh
      - name: Validate currency-specific Financial Summary drilldowns
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'MARKETING_VERSION: "1.3.70"' project.yml
          grep -Fq 'CURRENT_PROJECT_VERSION: "78"' project.yml
          grep -Fq 'currencyCode: movement.currencyCode' DailyLedger/Views/ReportsView.swift
          grep -Fq 'let currencyCode: String? = nil' DailyLedger/Views/PeriodTransactionsView.swift
          grep -Fq '(kind == .loanIncreased || kind == .loans)' DailyLedger/Views/PeriodTransactionsView.swift
          grep -Fq 'store.account(withID: transaction.accountID)?.currencyCode != currencyCode' DailyLedger/Views/PeriodTransactionsView.swift
          grep -Fq 'currencyCode ?? store.currencyCode' DailyLedger/Views/PeriodTransactionsView.swift
          grep -Fq 'store.financialSummaryLoanPaidAmount($1)' DailyLedger/Views/PeriodTransactionsView.swift
          grep -Fq 'LabeledContent("Version", value: "1.3.70")' DailyLedger/Views/SettingsView.swift
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build unsigned iPhone app
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project DailyLedger.xcodeproj -scheme DailyLedger -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build/xcodebuild.log
      - name: Package TIPA
        run: |
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          rm -rf Payload && mkdir Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload NextLedger-1.3.70-financial-summary-currency-filter.tipa
          shasum -a 256 NextLedger-1.3.70-financial-summary-currency-filter.tipa > NextLedger-1.3.70-financial-summary-currency-filter.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: NextLedger-1.3.70-Financial-Summary-Currency-Filter
          path: |
            NextLedger-1.3.70-financial-summary-currency-filter.tipa
            NextLedger-1.3.70-financial-summary-currency-filter.sha256
          if-no-files-found: error
      - name: Publish status
        if: always()
        shell: bash
        run: |
          STATUS="${{ job.status }}"
          git reset --hard HEAD
          git clean -fd
          git fetch origin "$GITHUB_REF_NAME"
          git checkout -B build-status "origin/$GITHUB_REF_NAME"
          mkdir -p .build-status
          cat > .build-status/next-ledger-1.3.70.json <<EOF
          {"status":"${STATUS}","run_id":"${GITHUB_RUN_ID}","source_sha":"${GITHUB_SHA}","app_version":"1.3.70","app_build":"78","daemon_version":"2.2.3","artifact_name":"NextLedger-1.3.70-Financial-Summary-Currency-Filter"}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .build-status/next-ledger-1.3.70.json
          git commit -m "Record Next Ledger 1.3.70 build status" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
