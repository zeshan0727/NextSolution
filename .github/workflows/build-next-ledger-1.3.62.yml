name: Build Next Ledger 1.3.67 FAR Sync Date Snapshot Export
permissions:
  contents: write
concurrency:
  group: next-ledger-1-3-67-registered-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-next-ledger-1.3.62.yml"
      - "scripts/apply_next_ledger_1_3_67.sh"
      - "scripts/fix_fixed_asset_register_link_date_export_1_3_67.py"
      - "scripts/fix_next_ledger_1_3_67_compile.py"
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply 1.3.67
        run: bash scripts/apply_next_ledger_1_3_67.sh
      - name: Validate FAR sync, date and export
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'MARKETING_VERSION: "1.3.67"' project.yml
          grep -Fq 'CURRENT_PROJECT_VERSION: "75"' project.yml
          grep -Fq 'private var allRegisterAssets: [FixedAssetRecord]' DailyLedger/Views/FixedAccountingRegistersView.swift
          grep -Fq '$0.nature == .fixedAsset' DailyLedger/Views/FixedAccountingRegistersView.swift
          grep -Fq 'category: "Needs Details"' DailyLedger/Views/FixedAccountingRegistersView.swift
          grep -Fq 'Toggle("Custom As-of Date"' DailyLedger/Views/FixedAccountingRegistersView.swift
          grep -Fq 'private var reportingDate: Date' DailyLedger/Views/FixedAccountingRegistersView.swift
          grep -Fq 'struct FixedAssetRegisterExportView' DailyLedger/Views/FixedAccountingRegistersView.swift
          grep -Fq 'FIXED ASSET REGISTER SNAPSHOT' DailyLedger/Views/FixedAccountingRegistersView.swift
          grep -Fq 'Label("PDF", systemImage: "doc.richtext.fill")' DailyLedger/Views/FixedAccountingRegistersView.swift
          grep -Fq 'Label("Excel / CSV", systemImage: "tablecells.fill")' DailyLedger/Views/FixedAccountingRegistersView.swift
          grep -Fq 'private var allRegisterLiabilities: [FixedLiabilityRecord]' DailyLedger/Views/FixedAccountingRegistersView.swift
          grep -Fq 'LabeledContent("Version", value: "1.3.67")' DailyLedger/Views/SettingsView.swift
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build unsigned iPhone app
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project DailyLedger.xcodeproj -scheme DailyLedger -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build/xcodebuild.log
      - name: Package TIPA
        run: |
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          rm -rf Payload && mkdir Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload NextLedger-1.3.67-far-sync-date-snapshot-export.tipa
          shasum -a 256 NextLedger-1.3.67-far-sync-date-snapshot-export.tipa > NextLedger-1.3.67-far-sync-date-snapshot-export.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: NextLedger-1.3.67-FAR-Sync-Date-Snapshot-Export
          path: |
            NextLedger-1.3.67-far-sync-date-snapshot-export.tipa
            NextLedger-1.3.67-far-sync-date-snapshot-export.sha256
          if-no-files-found: error
      - name: Capture diagnostics
        if: failure()
        run: |
          mkdir -p build
          { test -f build/xcodebuild.log && grep -E "error:|fatal error:|SwiftCompile|BUILD FAILED" build/xcodebuild.log || true; } > build/next-ledger-1.3.67-errors.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: NextLedger-1.3.67-Diagnostics
          path: build/next-ledger-1.3.67-errors.txt
          if-no-files-found: warn
      - name: Publish status
        if: always()
        shell: bash
        run: |
          STATUS="${{ job.status }}"
          git reset --hard HEAD
          git clean -fd
          git fetch origin "$GITHUB_REF_NAME"
          git checkout -B build-status "origin/$GITHUB_REF_NAME"
          mkdir -p .build-status
          cat > .build-status/next-ledger-1.3.67.json <<EOF
          {"status":"${STATUS}","run_id":"${GITHUB_RUN_ID}","source_sha":"${GITHUB_SHA}","app_version":"1.3.67","app_build":"75","daemon_version":"2.2.3","artifact_name":"NextLedger-1.3.67-FAR-Sync-Date-Snapshot-Export"}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .build-status/next-ledger-1.3.67.json
          git commit -m "Record Next Ledger 1.3.67 build status" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
# compile-fixed workflow trigger
