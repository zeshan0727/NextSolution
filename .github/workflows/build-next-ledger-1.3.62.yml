name: Build Next Ledger 1.3.64 Balance Nature Report Preview
permissions:
  contents: write
concurrency:
  group: next-ledger-1-3-64-registered-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-next-ledger-1.3.62.yml"
      - "scripts/apply_next_ledger_1_3_64.sh"
      - "scripts/fix_balance_nature_report_preview_1_3_64.py"
      - "scripts/fix_next_ledger_1_3_64_compile.py"
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply 1.3.64
        run: bash scripts/apply_next_ledger_1_3_64.sh
      - name: Validate balance, nature and export changes
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'MARKETING_VERSION: "1.3.64"' project.yml
          grep -Fq 'CURRENT_PROJECT_VERSION: "72"' project.yml
          grep -Fq 'legacyTransferDestinationAmount' DailyLedger/Services/LedgerStore.swift
          grep -Fq 'func effectiveDestinationAmount' DailyLedger/Services/LedgerStore.swift
          grep -Fq 'includeArchived: true' DailyLedger/Services/LedgerStore.swift
          grep -Fq 'Transaction Nature' DailyLedger/Views/AddTransactionView.swift
          grep -Fq 'showingTransferConversion' DailyLedger/Views/AddTransactionView.swift
          grep -Fq 'convertingTo: TransactionType?' DailyLedger/Views/TransferView.swift
          grep -Fq 'AddTransactionView(transaction: editingTransaction, convertTo: newType' DailyLedger/Views/TransferView.swift
          grep -Fq 'struct ReportSnapshotCard' DailyLedger/Views/ReportDownloadButton.swift
          grep -Fq 'PDFDocument(url: url)' DailyLedger/Views/ReportDownloadButton.swift
          grep -Fq 'private var reportScope: ProfessionalReportScope' DailyLedger/Views/ReportDownloadButton.swift
          grep -Fq 'struct AccountStatementDownloadButton' DailyLedger/Views/ReportDownloadButton.swift
          grep -Fq 'static func accountStatement' DailyLedger/Services/ProfessionalReportExportService.swift
          grep -Fq 'Expense Summary —' DailyLedger/Services/ProfessionalReportExportService.swift
          grep -Fq 'Transaction Details —' DailyLedger/Services/ProfessionalReportExportService.swift
          grep -Fq 'AccountStatementDownloadButton(accountID: accountID)' DailyLedger/Views/AccountsView.swift
          grep -Fq 'lastGeneratedDocument = document' DailyLedger/Views/ProfessionalReportExportView.swift
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build unsigned iPhone app
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project DailyLedger.xcodeproj -scheme DailyLedger -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build/xcodebuild.log
      - name: Package TIPA
        run: |
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          rm -rf Payload && mkdir Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload NextLedger-1.3.64-balance-nature-report-preview.tipa
          shasum -a 256 NextLedger-1.3.64-balance-nature-report-preview.tipa > NextLedger-1.3.64-balance-nature-report-preview.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: NextLedger-1.3.64-Balance-Nature-Report-Preview
          path: |
            NextLedger-1.3.64-balance-nature-report-preview.tipa
            NextLedger-1.3.64-balance-nature-report-preview.sha256
          if-no-files-found: error
      - name: Capture diagnostics
        if: failure()
        run: |
          mkdir -p build
          { test -f build/xcodebuild.log && grep -E "error:|fatal error:|SwiftCompile|BUILD FAILED" build/xcodebuild.log || true; } > build/next-ledger-1.3.64-errors.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: NextLedger-1.3.64-Diagnostics
          path: build/next-ledger-1.3.64-errors.txt
          if-no-files-found: warn
      - name: Publish status
        if: always()
        shell: bash
        run: |
          STATUS="${{ job.status }}"
          git reset --hard HEAD
          git clean -fd
          git fetch origin "$GITHUB_REF_NAME"
          git checkout -B build-status "origin/$GITHUB_REF_NAME"
          mkdir -p .build-status
          cat > .build-status/next-ledger-1.3.64.json <<EOF
          {"status":"${STATUS}","run_id":"${GITHUB_RUN_ID}","source_sha":"${GITHUB_SHA}","app_version":"1.3.64","app_build":"72","daemon_version":"2.2.3","artifact_name":"NextLedger-1.3.64-Balance-Nature-Report-Preview"}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .build-status/next-ledger-1.3.64.json
          git commit -m "Record Next Ledger 1.3.64 build status" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
