name: Build Next Ledger 1.3.65 Account Update Movement Colors
permissions:
  contents: write
concurrency:
  group: next-ledger-1-3-65-registered-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-next-ledger-1.3.62.yml"
      - "scripts/apply_next_ledger_1_3_65.sh"
      - "scripts/fix_transaction_update_colors_1_3_65.py"
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply 1.3.65
        run: bash scripts/apply_next_ledger_1_3_65.sh
      - name: Validate account update and movement colors
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'MARKETING_VERSION: "1.3.65"' project.yml
          grep -Fq 'CURRENT_PROJECT_VERSION: "73"' project.yml
          grep -Fq 'if let sourceAccount { return sourceAccount.currencyCode.uppercased() }' DailyLedger/Views/TransferView.swift
          grep -Fq 'if let destinationAccount { return destinationAccount.currencyCode.uppercased() }' DailyLedger/Views/TransferView.swift
          grep -Fq 'private var saveValidationMessage: String?' DailyLedger/Views/TransferView.swift
          grep -Fq 'return receivedAmount != nil' DailyLedger/Views/TransferView.swift
          grep -Fq 'Text("IN +" + DisplayFormat.currency(' DailyLedger/Views/Components.swift
          grep -Fq 'return isDestinationTransfer ? AppTheme.green : AppTheme.red' DailyLedger/Views/Components.swift
          grep -Fq 'transaction.type == .transfer' DailyLedger/Views/Components.swift
          grep -Fq 'store.effectiveDestinationAmount(transaction)' DailyLedger/Views/Components.swift
          grep -Fq 'Transaction Nature' DailyLedger/Views/AddTransactionView.swift
          grep -Fq 'AccountStatementDownloadButton(accountID: accountID)' DailyLedger/Views/AccountsView.swift
          grep -Fq 'struct ReportSnapshotCard' DailyLedger/Views/ReportDownloadButton.swift
          grep -Fq 'LabeledContent("Version", value: "1.3.65")' DailyLedger/Views/SettingsView.swift
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build unsigned iPhone app
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project DailyLedger.xcodeproj -scheme DailyLedger -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build/xcodebuild.log
      - name: Package TIPA
        run: |
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          rm -rf Payload && mkdir Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload NextLedger-1.3.65-account-update-movement-colors.tipa
          shasum -a 256 NextLedger-1.3.65-account-update-movement-colors.tipa > NextLedger-1.3.65-account-update-movement-colors.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: NextLedger-1.3.65-Account-Update-Movement-Colors
          path: |
            NextLedger-1.3.65-account-update-movement-colors.tipa
            NextLedger-1.3.65-account-update-movement-colors.sha256
          if-no-files-found: error
      - name: Capture diagnostics
        if: failure()
        run: |
          mkdir -p build
          { test -f build/xcodebuild.log && grep -E "error:|fatal error:|SwiftCompile|BUILD FAILED" build/xcodebuild.log || true; } > build/next-ledger-1.3.65-errors.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: NextLedger-1.3.65-Diagnostics
          path: build/next-ledger-1.3.65-errors.txt
          if-no-files-found: warn
      - name: Publish status
        if: always()
        shell: bash
        run: |
          STATUS="${{ job.status }}"
          git reset --hard HEAD
          git clean -fd
          git fetch origin "$GITHUB_REF_NAME"
          git checkout -B build-status "origin/$GITHUB_REF_NAME"
          mkdir -p .build-status
          cat > .build-status/next-ledger-1.3.65.json <<EOF
          {"status":"${STATUS}","run_id":"${GITHUB_RUN_ID}","source_sha":"${GITHUB_SHA}","app_version":"1.3.65","app_build":"73","daemon_version":"2.2.3","artifact_name":"NextLedger-1.3.65-Account-Update-Movement-Colors"}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .build-status/next-ledger-1.3.65.json
          git commit -m "Record Next Ledger 1.3.65 build status" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
