name: Build Next Ledger 1.3.68 Fixed Liability Settlements
permissions:
  contents: write
concurrency:
  group: next-ledger-1-3-68-registered-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-next-ledger-1.3.62.yml"
      - "scripts/apply_next_ledger_1_3_68.sh"
      - "scripts/fix_fixed_liability_settlement_1_3_68.py"
      - "scripts/relax_fixed_liability_summary_anchor_1_3_68.py"
      - "scripts/preserve_far_export_in_1_3_68_patch.py"
      - "scripts/fix_next_ledger_1_3_68_compile.py"
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply 1.3.68
        run: bash scripts/apply_next_ledger_1_3_68.sh
      - name: Validate liability settlement accounting
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'MARKETING_VERSION: "1.3.68"' project.yml
          grep -Fq 'CURRENT_PROJECT_VERSION: "76"' project.yml
          grep -Fq 'struct FixedLiabilityLedgerSnapshot' DailyLedger/Services/LedgerStore.swift
          grep -Fq 'nature == .loan || nature == .fixedLiability' DailyLedger/Services/LedgerStore.swift
          grep -Fq 'func fixedLiabilitySnapshot' DailyLedger/Services/LedgerStore.swift
          grep -Fq 'func fixedLiabilityRepaymentTransactions' DailyLedger/Services/LedgerStore.swift
          grep -Fq 'transaction.destinationAccountID == liabilityID' DailyLedger/Services/LedgerStore.swift
          grep -Fq 'repayments += effectiveDestinationAmount(transaction)' DailyLedger/Services/LedgerStore.swift
          grep -Fq '"Repaid / Settled"' DailyLedger/Views/FixedAccountingRegistersView.swift
          grep -Fq '"Outstanding Liability"' DailyLedger/Views/FixedAccountingRegistersView.swift
          grep -Fq 'Section("Recent Repayments")' DailyLedger/Views/FixedAccountingRegistersView.swift
          grep -Fq 'A linked liability moves here automatically' DailyLedger/Views/FixedAccountingRegistersView.swift
          grep -Fq 'private struct FixedAssetRegisterExportView: View' DailyLedger/Views/FixedAccountingRegistersView.swift
          grep -Fq 'LabeledContent("Version", value: "1.3.68")' DailyLedger/Views/SettingsView.swift
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build unsigned iPhone app
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project DailyLedger.xcodeproj -scheme DailyLedger -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build/xcodebuild.log
      - name: Package TIPA
        run: |
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          rm -rf Payload && mkdir Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload NextLedger-1.3.68-fixed-liability-settlements.tipa
          shasum -a 256 NextLedger-1.3.68-fixed-liability-settlements.tipa > NextLedger-1.3.68-fixed-liability-settlements.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: NextLedger-1.3.68-Fixed-Liability-Settlements
          path: |
            NextLedger-1.3.68-fixed-liability-settlements.tipa
            NextLedger-1.3.68-fixed-liability-settlements.sha256
          if-no-files-found: error
      - name: Capture diagnostics
        if: failure()
        run: |
          mkdir -p build
          { test -f build/xcodebuild.log && grep -E "error:|fatal error:|SwiftCompile|BUILD FAILED" build/xcodebuild.log || true; } > build/next-ledger-1.3.68-errors.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: NextLedger-1.3.68-Diagnostics
          path: build/next-ledger-1.3.68-errors.txt
          if-no-files-found: warn
      - name: Publish status
        if: always()
        shell: bash
        run: |
          STATUS="${{ job.status }}"
          git reset --hard HEAD
          git clean -fd
          git fetch origin "$GITHUB_REF_NAME"
          git checkout -B build-status "origin/$GITHUB_REF_NAME"
          mkdir -p .build-status
          cat > .build-status/next-ledger-1.3.68.json <<EOF
          {"status":"${STATUS}","run_id":"${GITHUB_RUN_ID}","source_sha":"${GITHUB_SHA}","app_version":"1.3.68","app_build":"76","daemon_version":"2.2.3","artifact_name":"NextLedger-1.3.68-Fixed-Liability-Settlements"}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .build-status/next-ledger-1.3.68.json
          git commit -m "Record Next Ledger 1.3.68 build status" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
# final forced workflow trigger after validation correction
