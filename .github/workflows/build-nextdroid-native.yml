name: Build Native NextDroid Android 11

on:
  workflow_dispatch:
  push:
    branches:
      - codex/nextdroid-native
    paths:
      - "nextdroid-native/**"
      - ".github/workflows/build-nextdroid-native.yml"

permissions:
  contents: read

concurrency:
  group: nextdroid-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build native UTM/QEMU app
    runs-on: macos-15
    timeout-minutes: 90
    env:
      UTM_COMMIT: a81d2a5af725ac42457706e5582f6b4e6fd0d893
      UTM_SYSROOT_ARTIFACT_ID: "8820992846"
      NEXTDROID_BUNDLE_ID: com.nextjailbreak.nextdroid.UTM
    steps:
      - name: Checkout NextDroid source
        uses: actions/checkout@v4

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_26.0.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer
          else
            XCODE_PATH=$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' | sort -V | tail -1)
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          fi
          xcodebuild -version

      - name: Clone native UTM source
        run: |
          git clone --recursive https://github.com/utmapp/UTM.git UTM-Native
          git -C UTM-Native checkout "$UTM_COMMIT"
          git -C UTM-Native submodule update --init --recursive

      - name: Integrate native NextDroid screens
        shell: bash
        run: |
          set -euo pipefail
          cp nextdroid-native/UTMApp.swift UTM-Native/Platform/iOS/UTMApp.swift
          for source in \
            NextDroidVMConfiguration.swift \
            NextDroidInstaller.swift \
            NextDroidViews.swift
          do
            printf '\n' >> UTM-Native/Platform/iOS/UTMApp.swift
            sed '/^import /d' "nextdroid-native/$source" >> UTM-Native/Platform/iOS/UTMApp.swift
          done
          cp nextdroid-native/CodeSigning.xcconfig UTM-Native/CodeSigning.xcconfig
          sed -i '' \
            's/BUNDLE_ID="com.utmapp.UTM"/BUNDLE_ID="com.nextjailbreak.nextdroid.UTM"/' \
            UTM-Native/scripts/package.sh
          ! rg 'insert_dylib|NextDroidBootstrap\.dylib' UTM-Native/Platform/iOS/UTMApp.swift

      - name: Download matching UTM iOS sysroot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/utm-sysroot"
          curl --fail --location --retry 3 \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$RUNNER_TEMP/utm-sysroot/artifact.zip" \
            "https://api.github.com/repos/utmapp/UTM/actions/artifacts/${UTM_SYSROOT_ARTIFACT_ID}/zip"
          unzip -q "$RUNNER_TEMP/utm-sysroot/artifact.zip" -d "$RUNNER_TEMP/utm-sysroot/unpacked"
          tar -xf "$RUNNER_TEMP/utm-sysroot/unpacked/sysroot.tgz" -C UTM-Native
          test -d UTM-Native/sysroot-ios-arm64

      - name: Build unsigned native iPhone archive
        working-directory: UTM-Native
        run: ./scripts/build_utm.sh -k iphoneos -s iOS -a arm64 -o UTM

      - name: Package TrollStore TIPA
        working-directory: UTM-Native
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="UTM.xcarchive/Products/Applications/UTM.app"

          set_plist_string() {
            local key="$1"
            local value="$2"
            if ! /usr/libexec/PlistBuddy -c "Set :${key} ${value}" "$APP_PATH/Info.plist"; then
              /usr/libexec/PlistBuddy -c "Add :${key} string ${value}" "$APP_PATH/Info.plist"
            fi
          }

          set_plist_string CFBundleDisplayName "NextDroid"
          set_plist_string CFBundleName "NextDroid"
          set_plist_string CFBundleIdentifier "$NEXTDROID_BUNDLE_ID"
          set_plist_string CFBundleShortVersionString "0.3"
          set_plist_string CFBundleVersion "3"

          brew install ldid
          mkdir -p package stage output
          ./scripts/package.sh ipa UTM.xcarchive package
          unzip -q package/UTM.ipa -d stage
          mv stage/Payload/UTM.app stage/Payload/NextDroid.app
          (
            cd stage
            zip -qry ../output/NextDroid_Android11_Native_Test3.tipa Payload \
              -x "._*" "*/.DS_Store" "*/__MACOSX/*"
          )
          unzip -t output/NextDroid_Android11_Native_Test3.tipa
          shasum -a 256 output/NextDroid_Android11_Native_Test3.tipa \
            | tee output/NextDroid_Android11_Native_Test3.sha256

      - name: Verify native package structure
        working-directory: UTM-Native
        shell: bash
        run: |
          set -euo pipefail
          test -f stage/Payload/NextDroid.app/UTM
          test ! -e stage/Payload/NextDroid.app/Frameworks/NextDroidBootstrap.dylib
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' stage/Payload/NextDroid.app/Info.plist \
            | grep -Fx NextDroid
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' stage/Payload/NextDroid.app/Info.plist \
            | grep -Fx "$NEXTDROID_BUNDLE_ID"
          file stage/Payload/NextDroid.app/UTM | grep -F 'Mach-O 64-bit executable arm64'

      - name: Upload native TIPA
        uses: actions/upload-artifact@v4
        with:
          name: NextDroid-Android11-Native-Test3
          path: |
            UTM-Native/output/NextDroid_Android11_Native_Test3.tipa
            UTM-Native/output/NextDroid_Android11_Native_Test3.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
