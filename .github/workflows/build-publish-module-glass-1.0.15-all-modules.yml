name: Build and Publish Module Glass 1.0.15 All Modules

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-publish-module-glass-1.0.15-all-modules.yml'

permissions:
  contents: write

concurrency:
  group: nextsolution-module-glass-1.0.15
  cancel-in-progress: false

jobs:
  build-validate-publish:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install packaging tools
        run: brew install dpkg ldid xz zstd

      - name: Install pinned RootHide Theos
        shell: bash
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/theos-roothide"
          git init "$T"
          git -C "$T" remote add origin https://github.com/roothide/theos.git
          git -C "$T" fetch --depth 1 origin 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$T" checkout --detach 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$T" submodule update --init --recursive --depth 1

      - name: Fix live Volume percentage and generalize image-first rendering
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('source/ModuleGlass/Tweak.m')
          t=p.read_text()

          # Dynamic percentage color state and UILabel hooks.
          old='''static char MGVolumeOriginalPercentageAlphaKey;\n\nstatic void (*MGOrigModuleViewDidLoad)(id, SEL);'''
          new='''static char MGVolumeOriginalPercentageAlphaKey;\nstatic char MGVolumePercentageColorKey;\nstatic char MGVolumeOriginalPercentageTextColorKey;\nstatic char MGVolumeOriginalPercentageAttributedKey;\n\nstatic void (*MGOrigLabelSetText)(UILabel *, SEL, NSString *);\nstatic void (*MGOrigLabelSetAttributedText)(UILabel *, SEL, NSAttributedString *);\nstatic void (*MGOrigLabelSetTextColor)(UILabel *, SEL, UIColor *);\n\nstatic void (*MGOrigModuleViewDidLoad)(id, SEL);'''
          if old not in t: raise SystemExit('state insertion anchor missing')
          t=t.replace(old,new,1)

          # Replace restore function so percentage uses native live label, while keeping icon overlay behavior.
          pattern=r'static void MGRestoreVolumeColorPresentation\(UIView \*root\) \{.*?\n\}\n\nstatic NSInteger MGVolumeIconScore'
          replacement=r'''static void MGRestoreVolumeColorPresentation(UIView *root) {
              if (!root) return;
              for (UIView *child in [root.subviews copy]) {
                  if (child.tag == MGVolumeIconOverlayTag || child.tag == MGVolumePercentageOverlayTag) {
                      [child removeFromSuperview];
                      continue;
                  }
                  MGRestoreVolumeColorPresentation(child);
              }
              if ([root isKindOfClass:UIImageView.class]) {
                  NSNumber *savedAlpha = objc_getAssociatedObject(root, &MGVolumeOriginalIconAlphaKey);
                  if (savedAlpha) {
                      root.alpha = savedAlpha.doubleValue;
                      objc_setAssociatedObject(root, &MGVolumeOriginalIconAlphaKey, nil, OBJC_ASSOCIATION_RETAIN_NONATOMIC);
                      objc_setAssociatedObject(root, &MGVolumeIconOverlayKey, nil, OBJC_ASSOCIATION_RETAIN_NONATOMIC);
                  }
              }
              if ([root isKindOfClass:UILabel.class]) {
                  UILabel *label=(UILabel *)root;
                  UIColor *custom=objc_getAssociatedObject(label, &MGVolumePercentageColorKey);
                  if (custom) {
                      objc_setAssociatedObject(label, &MGVolumePercentageColorKey, nil, OBJC_ASSOCIATION_RETAIN_NONATOMIC);
                      id originalColor=objc_getAssociatedObject(label, &MGVolumeOriginalPercentageTextColorKey);
                      NSAttributedString *originalAttributed=objc_getAssociatedObject(label, &MGVolumeOriginalPercentageAttributedKey);
                      if (MGOrigLabelSetTextColor) {
                          MGOrigLabelSetTextColor(label, @selector(setTextColor:), [originalColor isKindOfClass:UIColor.class] ? originalColor : nil);
                      } else {
                          label.textColor=[originalColor isKindOfClass:UIColor.class] ? originalColor : nil;
                      }
                      if (originalAttributed) {
                          if (MGOrigLabelSetAttributedText) MGOrigLabelSetAttributedText(label, @selector(setAttributedText:), originalAttributed);
                          else label.attributedText=originalAttributed;
                      }
                      objc_setAssociatedObject(label, &MGVolumeOriginalPercentageTextColorKey, nil, OBJC_ASSOCIATION_RETAIN_NONATOMIC);
                      objc_setAssociatedObject(label, &MGVolumeOriginalPercentageAttributedKey, nil, OBJC_ASSOCIATION_RETAIN_NONATOMIC);
                  }
                  NSNumber *savedAlpha=objc_getAssociatedObject(label, &MGVolumeOriginalPercentageAlphaKey);
                  if (savedAlpha) {
                      label.alpha=savedAlpha.doubleValue;
                      objc_setAssociatedObject(label, &MGVolumeOriginalPercentageAlphaKey, nil, OBJC_ASSOCIATION_RETAIN_NONATOMIC);
                  }
              }
          }

          static NSInteger MGVolumeIconScore'''
          t,n=re.subn(pattern,replacement,t,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'restore replacement count={n}')

          # Replace stale copied percentage overlay with native dynamic tint.
          pattern=r'static BOOL MGApplyVolumePercentageTint\(UIView \*slider, UIColor \*color, NSString \*\*outClass, CGRect \*outFrame, NSString \*\*outText\) \{.*?\n\}\n\nstatic void MGRemoveTaggedImages'
          replacement=r'''static NSAttributedString *MGAttributedStringWithColor(NSAttributedString *input, UIColor *color) {
              if (!input || !color || input.length == 0) return input;
              NSMutableAttributedString *result=[input mutableCopy];
              [result addAttribute:NSForegroundColorAttributeName value:color range:NSMakeRange(0, result.length)];
              return result;
          }

          static void MGLabelSetText(UILabel *label, SEL _cmd, NSString *text) {
              if (MGOrigLabelSetText) MGOrigLabelSetText(label, _cmd, text);
              UIColor *custom=objc_getAssociatedObject(label, &MGVolumePercentageColorKey);
              if (custom && MGOrigLabelSetTextColor) MGOrigLabelSetTextColor(label, @selector(setTextColor:), custom);
          }

          static void MGLabelSetAttributedText(UILabel *label, SEL _cmd, NSAttributedString *text) {
              UIColor *custom=objc_getAssociatedObject(label, &MGVolumePercentageColorKey);
              if (!custom) {
                  if (MGOrigLabelSetAttributedText) MGOrigLabelSetAttributedText(label, _cmd, text);
                  return;
              }
              if (text) objc_setAssociatedObject(label, &MGVolumeOriginalPercentageAttributedKey, [text copy], OBJC_ASSOCIATION_RETAIN_NONATOMIC);
              NSAttributedString *colored=MGAttributedStringWithColor(text, custom);
              if (MGOrigLabelSetAttributedText) MGOrigLabelSetAttributedText(label, _cmd, colored);
          }

          static void MGLabelSetTextColor(UILabel *label, SEL _cmd, UIColor *color) {
              UIColor *custom=objc_getAssociatedObject(label, &MGVolumePercentageColorKey);
              if (!custom) {
                  if (MGOrigLabelSetTextColor) MGOrigLabelSetTextColor(label, _cmd, color);
                  return;
              }
              objc_setAssociatedObject(label, &MGVolumeOriginalPercentageTextColorKey, color ?: (id)NSNull.null, OBJC_ASSOCIATION_RETAIN_NONATOMIC);
              if (MGOrigLabelSetTextColor) MGOrigLabelSetTextColor(label, _cmd, custom);
          }

          static BOOL MGApplyVolumePercentageTint(UIView *slider, UIColor *color, NSString **outClass, CGRect *outFrame, NSString **outText) {
              if (!slider || !color) return NO;
              UILabel *label=MGFindVolumePercentageLabel(slider);
              if (!label) return NO;

              if (!objc_getAssociatedObject(label, &MGVolumeOriginalPercentageTextColorKey)) {
                  objc_setAssociatedObject(label, &MGVolumeOriginalPercentageTextColorKey, label.textColor ?: (id)NSNull.null, OBJC_ASSOCIATION_RETAIN_NONATOMIC);
              }
              if (label.attributedText.length && !objc_getAssociatedObject(label, &MGVolumeOriginalPercentageAttributedKey)) {
                  objc_setAssociatedObject(label, &MGVolumeOriginalPercentageAttributedKey, [label.attributedText copy], OBJC_ASSOCIATION_RETAIN_NONATOMIC);
              }
              objc_setAssociatedObject(label, &MGVolumePercentageColorKey, color, OBJC_ASSOCIATION_RETAIN_NONATOMIC);

              if (label.attributedText.length) {
                  NSAttributedString *colored=MGAttributedStringWithColor(label.attributedText, color);
                  if (MGOrigLabelSetAttributedText) MGOrigLabelSetAttributedText(label, @selector(setAttributedText:), colored);
                  else label.attributedText=colored;
              }
              if (MGOrigLabelSetTextColor) MGOrigLabelSetTextColor(label, @selector(setTextColor:), color);
              else label.textColor=color;

              if (outClass) *outClass=[NSString stringWithFormat:@"%@+live-native", NSStringFromClass(label.class) ?: @"UILabel"];
              if (outFrame) *outFrame=[label convertRect:label.bounds toView:slider];
              if (outText) *outText=label.text ?: label.attributedText.string ?: @"";
              return YES;
          }

          static void MGRemoveTaggedImages'''
          t,n=re.subn(pattern,replacement,t,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'percentage replacement count={n}')

          # Generalize the exact working Volume image-first suppression to every module.
          pattern=r'''    NSUInteger volumeSuppressed = 0;\n    NSArray<NSString \*> \*volumeSuppressedClasses = @\[\];\n    if \(\[slot isEqualToString:@"volume"\]\) \{.*?\n    \}\n\n    // Safety rule:'''
          replacement=r'''    NSUInteger imageFirstSuppressed = 0;
              NSArray<NSString *> *imageFirstSuppressedClasses = @[];
              if (imageView.image) {
                  BOOL sliderModule=[slot isEqualToString:@"volume"] || [slot isEqualToString:@"brightness"];
                  UIView *imageScope=sliderModule ? MGFindSliderView(root) : root;
                  if (!imageScope) imageScope=root;
                  if (imageScope) {
                      NSMutableArray<NSString *> *classes=[NSMutableArray array];
                      imageFirstSuppressed=MGApplyVolumeImageMode(imageScope, imageView, classes);
                      imageFirstSuppressedClasses=classes.copy;
                      strategy=[NSString stringWithFormat:@"%@-image-first", slot];
                  } else {
                      strategy=[NSString stringWithFormat:@"%@-no-host", slot];
                  }
              }

              // Safety rule:'''
          t,n=re.subn(pattern,replacement,t,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'image-first replacement count={n}')

          # Diagnostics now describe generic image-first behavior.
          t=t.replace('volumeSuppressed=%lu suppressedClasses=%@', 'imageFirstSuppressed=%lu suppressedClasses=%@')
          t=t.replace('(unsigned long)volumeSuppressed, volumeSuppressedClasses', '(unsigned long)imageFirstSuppressed, imageFirstSuppressedClasses')

          # Install no-op-by-default UILabel hooks. They only alter the associated live Volume percentage label.
          anchor='''        MGHookController(contentClass, (IMP)MGContentViewDidLoad, (IMP)MGContentLayout, (IMP *)&MGOrigContentViewDidLoad, (IMP *)&MGOrigContentLayout);\n\n        CFNotificationCenterRef darwin'''
          inject='''        MGHookController(contentClass, (IMP)MGContentViewDidLoad, (IMP)MGContentLayout, (IMP *)&MGOrigContentViewDidLoad, (IMP *)&MGOrigContentLayout);\n\n        MSHookMessageEx(UILabel.class, @selector(setText:), (IMP)MGLabelSetText, (IMP *)&MGOrigLabelSetText);\n        MSHookMessageEx(UILabel.class, @selector(setAttributedText:), (IMP)MGLabelSetAttributedText, (IMP *)&MGOrigLabelSetAttributedText);\n        MSHookMessageEx(UILabel.class, @selector(setTextColor:), (IMP)MGLabelSetTextColor, (IMP *)&MGOrigLabelSetTextColor);\n\n        CFNotificationCenterRef darwin'''
          if anchor not in t: raise SystemExit('UILabel hook anchor missing')
          t=t.replace(anchor,inject,1)

          t=t.replace('ModuleGlassRuntime 1.0.10 Volume Icon+Percentage Color loaded', 'ModuleGlassRuntime 1.0.11 All Modules Image First loaded')
          t=t.replace('Volume-isolated image-first runtime with persistent icon color overlay', 'All-module image-first runtime with live native Volume icon and percentage color')
          t=t.replace('// Volume-only experiment. No other module calls these helpers.', '// Image-first helpers validated on Volume and now shared by all mapped compact modules.')
          p.write_text(t)

          c=Path('source/ModuleGlass/control')
          ct=c.read_text()
          ct=re.sub(r'^Version: .*$', 'Version: 1.0.11', ct, flags=re.M)
          ct=re.sub(r'^Description: .*$', 'Description: All-module Module Glass image-first runtime using the validated Volume background method, with live native Volume percentage tint and preserved compact/expanded behavior.', ct, flags=re.M)
          c.write_text(ct)
          PY

          grep -q '^Version: 1.0.11$' source/ModuleGlass/control
          grep -q 'MGLabelSetText' source/ModuleGlass/Tweak.m
          grep -q 'MGLabelSetAttributedText' source/ModuleGlass/Tweak.m
          grep -q 'MGLabelSetTextColor' source/ModuleGlass/Tweak.m
          grep -q 'live-native' source/ModuleGlass/Tweak.m
          grep -q 'imageFirstSuppressed' source/ModuleGlass/Tweak.m
          grep -q 'brightness.*image-first\|%@-image-first' source/ModuleGlass/Tweak.m
          grep -q 'MGApplyVolumeImageMode(imageScope' source/ModuleGlass/Tweak.m
          ! grep -q 'volume-image-first-test' source/ModuleGlass/Tweak.m

      - name: Build Module Glass Runtime 1.0.11
        shell: bash
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/source/ModuleGlass"
          OUT="$RUNNER_TEMP/release"
          STAGE="$RUNNER_TEMP/runtime-stage"
          export THEOS="$RUNNER_TEMP/theos-roothide"
          export THEOS_PACKAGE_SCHEME=roothide
          mkdir -p "$OUT"
          rm -rf "$P/.theos" "$P/packages" "$STAGE"
          make -C "$P" clean package FINALPACKAGE=1
          DEB=$(find "$P/packages" -type f -name '*.deb' -print -quit)
          test -n "$DEB"
          dpkg-deb -R "$DEB" "$STAGE"
          test -f "$STAGE/Library/MobileSubstrate/DynamicLibraries/CCModuleBackgrounds.dylib"
          cat > "$STAGE/DEBIAN/postinst" <<'SH'
          #!/bin/sh
          killall -9 SpringBoard 2>/dev/null || true
          exit 0
          SH
          chmod 0755 "$STAGE/DEBIAN/postinst"
          dpkg-deb -b "$STAGE" "$OUT/NextAura_Runtime_ccbackgrounds_1.0.11_RootHide.deb"

      - name: Build Module Glass 1.0.15 wrapper
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/release"
          STAGE="$RUNNER_TEMP/wrapper-stage"
          rm -rf "$STAGE"
          dpkg-deb -R debfiles/NextAura_cc_module_backgrounds_1.0.14_RootHide.deb "$STAGE"
          python3 - "$STAGE/DEBIAN/control" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); t=p.read_text()
          t=re.sub(r'^Version: .*$', 'Version: 1.0.15', t, flags=re.M)
          t=re.sub(r'com\.nextsolution\.nextaura\.runtime\.ccbackgrounds \(>= [^)]+\)', 'com.nextsolution.nextaura.runtime.ccbackgrounds (>= 1.0.11)', t)
          t=re.sub(r'^Description: .*$', 'Description: All mapped Control Center module backgrounds now use the validated Volume image-first rendering method; Volume icon and live percentage share the selected custom color.', t, flags=re.M)
          p.write_text(t)
          PY
          grep -q '^Version: 1.0.15$' "$STAGE/DEBIAN/control"
          grep -q 'runtime.ccbackgrounds (>= 1.0.11)' "$STAGE/DEBIAN/control"
          dpkg-deb -b "$STAGE" "$OUT/NextAura_cc_module_backgrounds_1.0.15_RootHide.deb"

      - name: Validate packages
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/release"
          R="$OUT/NextAura_Runtime_ccbackgrounds_1.0.11_RootHide.deb"
          M="$OUT/NextAura_cc_module_backgrounds_1.0.15_RootHide.deb"
          test "$(dpkg-deb -f "$R" Version)" = 1.0.11
          test "$(dpkg-deb -f "$M" Version)" = 1.0.15
          test "$(dpkg-deb -f "$R" Architecture)" = iphoneos-arm64e
          dpkg-deb -f "$M" Depends | grep -q 'runtime.ccbackgrounds (>= 1.0.11)'
          X=$(mktemp -d)
          dpkg-deb -x "$R" "$X"
          D="$X/Library/MobileSubstrate/DynamicLibraries/CCModuleBackgrounds.dylib"
          lipo -info "$D" | grep -q arm64
          lipo -info "$D" | grep -q arm64e
          strings -a "$D" | grep -q 'ModuleGlassRuntime 1.0.11 All Modules Image First loaded'
          strings -a "$D" | grep -q '%@-image-first'
          strings -a "$D" | grep -q 'live-native'
          strings -a "$D" | grep -q 'CCModuleVolumeIconColor'
          strings -a "$D" | grep -q 'connectivity'
          strings -a "$D" | grep -q 'brightness'
          strings -a "$D" | grep -q 'screenrecording'
          strings -a "$D" | grep -q 'screenmirroring'
          rm -rf "$X"
          shasum -a 256 "$R" "$M"

      - name: Sync latest main preserving tested source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Next Jailbreak Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase --autostash origin main
          grep -q '^Version: 1.0.11$' source/ModuleGlass/control
          grep -q 'imageFirstSuppressed' source/ModuleGlass/Tweak.m
          grep -q 'live-native' source/ModuleGlass/Tweak.m

      - name: Publish packages and refresh repo indexes
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/release"
          SCAN="$RUNNER_TEMP/scan"
          mkdir -p debfiles "$SCAN"
          cp "$OUT/NextAura_Runtime_ccbackgrounds_1.0.11_RootHide.deb" debfiles/
          cp "$OUT/NextAura_cc_module_backgrounds_1.0.15_RootHide.deb" debfiles/
          cp "$OUT"/*.deb "$SCAN/"

          dpkg-scanpackages -m "$SCAN" /dev/null > "$RUNNER_TEMP/stanzas"
          python3 - "$RUNNER_TEMP/stanzas" <<'PY'
          from pathlib import Path
          import os,re,sys
          s=Path(sys.argv[1])
          lines=[]
          for line in s.read_text().splitlines():
              if line.startswith('Filename: '): line='Filename: ./debfiles/'+os.path.basename(line.split(': ',1)[1])
              lines.append(line)
          s.write_text('\n'.join(lines)+'\n')
          ids={'com.nextsolution.nextaura.runtime.ccbackgrounds','com.nextsolution.nextaura.cc-module-backgrounds'}
          pkg=Path('Packages')
          rows=[x.strip() for x in re.split(r'\n\s*\n',pkg.read_text()) if x.strip()]
          def pid(row):
              m=re.search(r'^Package: (.+)$',row,re.M); return m.group(1).strip() if m else ''
          rows=[r for r in rows if pid(r) not in ids]
          new=[x.strip() for x in re.split(r'\n\s*\n',s.read_text()) if x.strip()]
          pkg.write_text('\n\n'.join(rows+new)+'\n')
          PY

          test "$(grep -c '^Package: com.nextsolution.nextaura.cc-module-backgrounds$' Packages)" -eq 1
          test "$(grep -c '^Package: com.nextsolution.nextaura.runtime.ccbackgrounds$' Packages)" -eq 1
          grep -A20 '^Package: com.nextsolution.nextaura.cc-module-backgrounds$' Packages | grep -q '^Version: 1.0.15$'
          grep -A20 '^Package: com.nextsolution.nextaura.runtime.ccbackgrounds$' Packages | grep -q '^Version: 1.0.11$'

          gzip -9 -c Packages > Packages.gz
          bzip2 -9 -c Packages > Packages.bz2
          xz -9e -c Packages > Packages.xz
          zstd -19 -q -c Packages > Packages.zst
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import re
          p=Path('Release'); t=p.read_text()
          m=re.search(r'^Version:\s*(\d+)\.(\d+)\.(\d+)\s*$',t,re.M)
          if m:
              a,b,c=map(int,m.groups()); t=re.sub(r'^Version: .*$',f'Version: {a}.{b}.{c+1}',t,flags=re.M)
          t=re.sub(r'^Date: .*$', 'Date: '+datetime.now(timezone.utc).strftime('%a, %d %b %Y %H:%M:%S UTC'), t, flags=re.M)
          p.write_text(t)
          PY

          git add source/ModuleGlass/Tweak.m source/ModuleGlass/control \
            debfiles/NextAura_Runtime_ccbackgrounds_1.0.11_RootHide.deb \
            debfiles/NextAura_cc_module_backgrounds_1.0.15_RootHide.deb \
            Packages Packages.gz Packages.bz2 Packages.xz Packages.zst Release
          git diff --cached --check
          git commit -m 'Publish Module Glass 1.0.15 all-module image-first fix'
          git push origin HEAD:main
