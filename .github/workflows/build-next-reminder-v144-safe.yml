name: Build Next Reminder v1.3.14 Safe Tweak

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: brew install dpkg ldid xz

      - name: Validate safe console sources
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/2026-08-04-NextQuickReminder"
          python3 -m py_compile NextReminderApp/ci/patch_v144.py NextReminderApp/ci/adjust_build_v144.py "$P/stabilize-v102.py"
          grep -q 'QuickTweakConsoleView' NextReminderApp/ci/patch_v144.py
          grep -q 'quick-tweak-console.json' "$P/ConsoleBridge.m"
          grep -q 'com.nextsolution.nextquickreminder.appcommand' "$P/ConsoleBridge.m"
          grep -q 'safe bridge initialized' "$P/ConsoleBridge.m"
          grep -q 'NextQuickReminder_FILES = Tweak.xm ConsoleBridge.m' "$P/Makefile"
          grep -q '<string>1.0.2</string>' "$P/Preferences/Resources/Info.plist"
          plutil -lint "$P/Preferences/Resources/Root.plist"
          plutil -lint "$P/Preferences/Resources/Info.plist"
          plutil -lint "$P/layout/Library/PreferenceLoader/Preferences/NextQuickReminder.plist"

      - name: Build Next Reminder v1.3.14
        run: |
          chmod +x NextReminderApp/ci/build-v144.sh
          set -o pipefail
          NextReminderApp/ci/build-v144.sh 2>&1 | tee v144-app-build.log
          APP="NextReminderApp/build/NextReminder.app"
          plutil -extract CFBundleShortVersionString raw "$APP/Info.plist" | grep -qx '1.3.14'
          plutil -extract CFBundleVersion raw "$APP/Info.plist" | grep -qx '24'
          grep -q 'struct QuickTweakConsoleView' NextReminderApp/NextReminder/Sources/QuickTweakConsole.swift
          strings -a "$APP/NextReminder" > v144-app-strings.txt
          grep -q 'Tweak Console' v144-app-strings.txt
          grep -q 'quick-tweak-console.json' v144-app-strings.txt
          grep -q 'com.nextsolution.nextquickreminder.appcommand' v144-app-strings.txt

      - name: Build RootHide tweak 1.0.2
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/2026-08-04-NextQuickReminder"
          OUT="$RUNNER_TEMP/quick-reminder-out"
          mkdir -p "$OUT"
          chmod +x "$P/layout/DEBIAN/postinst"
          python3 "$P/stabilize-v102.py"
          grep -q 'static NSString \*NQRSelectedGesture = @"off";' "$P/Tweak.xm"
          grep -q 'Volume Up monitoring enabled without private method hooks' "$P/Tweak.xm"
          ! grep -q 'attributesOfItemAtPath' "$P/Tweak.xm"
          ! grep -q 'NQRInstallVolumeHook();.*NQRReloadPreferences' "$P/Tweak.xm"

          git init "$RUNNER_TEMP/theos-rh"
          git -C "$RUNNER_TEMP/theos-rh" remote add origin https://github.com/roothide/theos.git
          git -C "$RUNNER_TEMP/theos-rh" fetch --depth 1 origin 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$RUNNER_TEMP/theos-rh" checkout --detach 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$RUNNER_TEMP/theos-rh" submodule update --init --recursive --depth 1

          sed -i '' 's/^Architecture: iphoneos-arm64$/Architecture: iphoneos-arm64e/' "$P/control"
          export THEOS="$RUNNER_TEMP/theos-rh" THEOS_PACKAGE_SCHEME=roothide
          make -C "$P" clean package FINALPACKAGE=1 2>&1 | tee v144-tweak-build.log

          DEB="$(find "$P/packages" -name '*_iphoneos-arm64e.deb' -print -quit)"
          test -n "$DEB"
          cp "$DEB" "$OUT/NextQuickReminder_1.0.2_RootHide.deb"
          ditto -c -k --sequesterRsrc --keepParent "$P" "$OUT/NextQuickReminder_1.0.2_Source.zip"

      - name: Verify safe RootHide package
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/quick-reminder-out"
          DEB="$OUT/NextQuickReminder_1.0.2_RootHide.deb"
          test "$(dpkg-deb -f "$DEB" Package)" = com.nextsolution.nextquickreminder
          test "$(dpkg-deb -f "$DEB" Version)" = 1.0.2
          test "$(dpkg-deb -f "$DEB" Architecture)" = iphoneos-arm64e
          X="$(mktemp -d)"
          dpkg-deb -x "$DEB" "$X"
          dpkg-deb -e "$DEB" "$X/DEBIAN"
          DYLIB="$(find "$X" -name NextQuickReminder.dylib -print -quit)"
          test -n "$DYLIB"
          file "$DYLIB" | grep -q 'arm64'
          find "$X" -path '*NextQuickReminderPreferences.bundle/Root.plist' | grep -q .
          find "$X" -path '*PreferenceLoader/Preferences/NextQuickReminder.plist' | grep -q .
          test -x "$X/DEBIAN/postinst"
          strings -a "$DYLIB" > v144-tweak-strings.txt
          grep -q '1.0.2 safe bridge initialized' v144-tweak-strings.txt
          grep -q 'safe startup mode' v144-tweak-strings.txt
          grep -q 'quick-tweak-console.json' v144-tweak-strings.txt
          grep -q 'com.nextsolution.nextquickreminder.appcommand' v144-tweak-strings.txt
          grep -q 'All quick-reminder gestures are off' v144-tweak-strings.txt
          grep -q 'Volume Up monitoring enabled without private method hooks' v144-tweak-strings.txt
          shasum -a 256 "$DEB" > "$OUT/NextQuickReminder_1.0.2_RootHide.deb.sha256"

      - name: Upload final packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NextReminder-v1.3.14-SafeTweak
          if-no-files-found: warn
          path: |
            NextReminderApp/NextReminder-v1.3.14-unsigned.tipa
            NextReminderApp/NextReminder-v1.3.14-unsigned.ipa
            NextReminderApp/NextReminder-v1.3.14-unsigned.tipa.sha256
            NextReminderApp/xcodebuild.log
            v144-app-build.log
            v144-tweak-build.log
            v144-app-strings.txt
            v144-tweak-strings.txt
            ${{ runner.temp }}/quick-reminder-out/NextQuickReminder_1.0.2_RootHide.deb
            ${{ runner.temp }}/quick-reminder-out/NextQuickReminder_1.0.2_RootHide.deb.sha256
            ${{ runner.temp }}/quick-reminder-out/NextQuickReminder_1.0.2_Source.zip
