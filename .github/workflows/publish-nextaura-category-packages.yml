name: Publish Aura Category Packages 1.0.2

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: publish-nextaura-category-packages
  cancel-in-progress: true

jobs:
  build-and-publish:
    if: github.head_ref == 'agent/nextaura-4.4.9-notification-island'
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: |
          brew install dpkg ldid xz zstd
          python3 -m pip install --user --break-system-packages pillow

      - name: Prepare RootHide Theos
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/theos-rh"
          git -C "$RUNNER_TEMP/theos-rh" remote add origin https://github.com/roothide/theos.git
          git -C "$RUNNER_TEMP/theos-rh" fetch --depth 1 origin 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$RUNNER_TEMP/theos-rh" checkout --detach 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$RUNNER_TEMP/theos-rh" submodule update --init --recursive --depth 1

      - name: Build current Notification Island runtime
        shell: bash
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/2026-08-13-NextAuraNotificationIsland"
          python3 "$P/compile-fix.py"
          python3 "$P/layout-date.py"
          python3 "$P/prepare-v450.py"
          python3 "$P/prepare-v453.py"
          cp "$P/DynamicIslandV450.plist" "$P/DynamicIsland.plist"
          export THEOS="$RUNNER_TEMP/theos-rh" THEOS_PACKAGE_SCHEME=roothide
          make -C "$P" clean all FINALPACKAGE=1 2>&1 | tee nextaura-category-island-build.log
          ISLAND_DYLIB="$(find "$P/.theos" -type f -name 'NextAuraNotificationIsland.dylib' -print | sort | tail -1)"
          test -n "$ISLAND_DYLIB"
          ldid -S "$ISLAND_DYLIB"
          mkdir -p "$RUNNER_TEMP/island"
          cp "$ISLAND_DYLIB" "$RUNNER_TEMP/island/NextAuraNotificationIsland.dylib"
          cp "$P/NextAuraNotificationIsland.plist" "$RUNNER_TEMP/island/NextAuraNotificationIsland.plist"
          cp "$P/DynamicIsland.plist" "$RUNNER_TEMP/island/DynamicIsland.plist"

      - name: Build native Aura Preferences controller
        shell: bash
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/2026-08-16-NextAuraCategorySplit/AuraPrefs"
          export THEOS="$RUNNER_TEMP/theos-rh" THEOS_PACKAGE_SCHEME=roothide
          make -C "$P" clean all FINALPACKAGE=1 2>&1 | tee aura-prefs-build.log
          BUNDLE="$(find "$P/.theos" -type d -name 'AuraPrefs.bundle' -print | sort | tail -1)"
          test -n "$BUNDLE"
          test -f "$BUNDLE/AuraPrefs"
          mkdir -p "$RUNNER_TEMP/aura-prefs"
          ditto "$BUNDLE" "$RUNNER_TEMP/aura-prefs/AuraPrefs.bundle"
          ldid -S "$RUNNER_TEMP/aura-prefs/AuraPrefs.bundle/AuraPrefs"

      - name: Build 17 Aura category packages
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/nextaura-categories"
          mkdir -p "$OUT"
          python3 DailyTweaks/2026-08-16-NextAuraCategorySplit/build_categories_v3.py \
            --base-deb debfiles/NextAura_4.4.8_RootHide_iOS16.deb \
            --island-dylib "$RUNNER_TEMP/island/NextAuraNotificationIsland.dylib" \
            --island-plist "$RUNNER_TEMP/island/NextAuraNotificationIsland.plist" \
            --dynamic-plist "$RUNNER_TEMP/island/DynamicIsland.plist" \
            --prefs-bundle "$RUNNER_TEMP/aura-prefs/AuraPrefs.bundle" \
            --output "$OUT"

      - name: Verify Settings pages and compact icons
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/nextaura-categories"
          test "$(find "$OUT" -maxdepth 1 -name '*.deb' | wc -l | tr -d ' ')" = 27
          test "$(find "$OUT" -maxdepth 1 -name 'NextAura_*_1.0.2_RootHide.deb' ! -name 'NextAura_Runtime_*' | wc -l | tr -d ' ')" = 17
          test -f "$OUT/NextAura_Runtime_preferences_1.0.2_RootHide.deb"

          PREFS="$RUNNER_TEMP/prefs-check"
          mkdir -p "$PREFS"
          dpkg-deb -x "$OUT/NextAura_Runtime_preferences_1.0.2_RootHide.deb" "$PREFS"
          B="$PREFS/Library/PreferenceBundles/AuraPrefs.bundle"
          test -f "$B/AuraPrefs"
          test ! -e "$PREFS/Library/PreferenceBundles/UnlockVibratePrefs.bundle"

          python3 - "$B" "$OUT" <<'PY'
          import plistlib, subprocess, sys
          from pathlib import Path
          from PIL import Image
          bundle = Path(sys.argv[1])
          out = Path(sys.argv[2])
          categories = {
              'feedback': ('Aura Haptics','Feedback'),
              'thermal-sweat': ('Aura Thermal','ThermalSweat'),
              'home-screen': ('Aura Home','HomeScreen'),
              'dock-folders': ('Aura Dock','DockFolders'),
              'lock-screen': ('Aura Lock','LockScreen'),
              'status-bar': ('Aura Status','StatusBar'),
              'control-center': ('Aura Control','ControlCenter'),
              'cc-second-page': ('Aura Panel','CCSecondPage'),
              'cc-module-backgrounds': ('Aura Modules','CCModuleBackgrounds'),
              'notification-island': ('Aura Island','DynamicIsland'),
              'notification-glow': ('Aura Glow','NotificationGlow'),
              'now-playing': ('Aura Player','NowPlaying'),
              'notifications': ('Aura Alerts','Notifications'),
              'app-switcher': ('Aura Switcher','AppSwitcher'),
              'system-overlays': ('Aura HUD','SystemOverlays'),
              'animations': ('Aura Motion','Animations'),
              'safety-recovery': ('Aura Safe','SafetyRecovery'),
          }
          info = plistlib.load(open(bundle/'Info.plist','rb'))
          assert info['NSPrincipalClass'] == 'AuraCategoryListController'
          assert info['CFBundleVersion'] == '1.0.2'
          for slug,(name,plist_name) in categories.items():
              page = bundle/f'{plist_name}.plist'
              assert page.exists(), page
              data = plistlib.load(open(page,'rb'))
              assert len(data.get('items',[])) > 0, f'blank page {plist_name}'
              icon = bundle/f'NextAura-{slug}.png'
              assert Image.open(icon).size == (58,58), f'non-compact Settings icon {slug}'

              deb = out/f"NextAura_{slug.replace('-','_')}_1.0.2_RootHide.deb"
              root = Path('/tmp')/f'aura-check-{slug}'
              subprocess.run(['rm','-rf',str(root)])
              subprocess.check_call(['dpkg-deb','-x',str(deb),str(root)])
              loader = plistlib.load(open(root/'Library/PreferenceLoader/Preferences'/f'NextAura-{slug}.plist','rb'))['entry']
              assert loader['bundle'] == 'AuraPrefs'
              assert loader['plist'] == plist_name
              assert loader['label'] == name
              assert 'detail' not in loader, 'old UVSubListController routing still present'
              pkg = subprocess.check_output(['dpkg-deb','-f',str(deb),'Package'],text=True).strip()
              ver = subprocess.check_output(['dpkg-deb','-f',str(deb),'Version'],text=True).strip()
              depends = subprocess.check_output(['dpkg-deb','-f',str(deb),'Depends'],text=True).strip()
              assert pkg == f'com.nextsolution.nextaura.{slug}'
              assert ver == '1.0.2'
              assert 'com.nextsolution.nextaura.runtime.preferences (>= 1.0.2)' in depends
          print('Verified 17 non-empty category panes through AuraCategoryListController and 58x58 Settings icons.')
          PY

          strings -a "$B/AuraPrefs" | grep -q 'AuraCategoryListController'
          strings -a "$B/AuraPrefs" | grep -q 'testDynamicIslandSuite:'
          strings -a "$B/AuraPrefs" | grep -q 'configureCCModuleBackground:'
          test -f "$OUT/NextAura_Category_Packages.txt"

      - name: Save build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aura-Modular-Categories-1.0.2
          path: |
            ${{ runner.temp }}/nextaura-categories/*.deb
            ${{ runner.temp }}/nextaura-categories/icons/nextaura/*.png
            ${{ runner.temp }}/nextaura-categories/NextAura_Category_Packages.txt
            nextaura-category-island-build.log
            aura-prefs-build.log

      - name: Publish Aura 1.0.2 to nextsolution.cc repo
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/nextaura-categories"
          SAVED="$RUNNER_TEMP/aura-publish"
          mkdir -p "$SAVED/icons/nextaura"
          cp "$OUT"/*.deb "$SAVED/"
          cp "$OUT/NextAura_Category_Packages.txt" "$SAVED/"
          cp "$OUT/icons/nextaura"/*.png "$SAVED/icons/nextaura/"

          git config user.name "Next Solution Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p debfiles icons/nextaura
          find debfiles -maxdepth 1 -type f -name 'NextAura_*_1.0.0_RootHide.deb' ! -name 'NextAura_Runtime_*' -delete || true
          find debfiles -maxdepth 1 -type f -name 'NextAura_*_1.0.1_RootHide.deb' ! -name 'NextAura_Runtime_*' -delete || true
          rm -f debfiles/NextAura_Runtime_preferences_1.0.0_RootHide.deb debfiles/NextAura_Runtime_preferences_1.0.1_RootHide.deb
          cp "$SAVED"/*.deb debfiles/
          cp "$SAVED/NextAura_Category_Packages.txt" debfiles/
          cp "$SAVED/icons/nextaura"/*.png icons/nextaura/

          SCAN="$RUNNER_TEMP/aura-scan"
          mkdir -p "$SCAN"
          cp "$SAVED"/*.deb "$SCAN/"
          dpkg-scanpackages -m "$SCAN" /dev/null > "$RUNNER_TEMP/aura-new-stanzas"
          sed -i '' 's|^Filename: .*/aura-scan/|Filename: ./debfiles/|' "$RUNNER_TEMP/aura-new-stanzas"

          python3 - "$RUNNER_TEMP/aura-new-stanzas" <<'PY'
          from pathlib import Path
          import re, sys
          packages = Path('Packages')
          existing = packages.read_text() if packages.exists() else ''
          new_text = Path(sys.argv[1]).read_text()
          new_stanzas = [s.strip() for s in re.split(r'\n\s*\n', new_text) if s.strip()]
          new_ids = {re.search(r'^Package: (.+)$', s, re.M).group(1).strip() for s in new_stanzas}
          kept = []
          for stanza in [s.strip() for s in re.split(r'\n\s*\n', existing) if s.strip()]:
              m = re.search(r'^Package: (.+)$', stanza, re.M)
              if m and m.group(1).strip() in new_ids:
                  continue
              kept.append(stanza)
          packages.write_text('\n\n'.join(kept + new_stanzas) + '\n')
          print(f'Replaced {len(new_ids)} Aura package stanzas.')
          PY

          gzip -9 -c Packages > Packages.gz
          bzip2 -9 -c Packages > Packages.bz2
          xz -9e -c Packages > Packages.xz
          zstd -19 -q -c Packages > Packages.zst

          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import re
          p = Path('Release')
          if p.exists():
              t = p.read_text()
              m = re.search(r'^Version: (\d+)\.(\d+)\.(\d+)$', t, re.M)
              if m:
                  t = re.sub(r'^Version: .*$', f'Version: {m.group(1)}.{m.group(2)}.{int(m.group(3))+1}', t, flags=re.M)
              t = re.sub(r'^Date: .*$', 'Date: ' + datetime.now(timezone.utc).strftime('%a, %d %b %Y %H:%M:%S UTC'), t, flags=re.M)
              p.write_text(t)
          PY

          git add debfiles icons/nextaura Packages Packages.gz Packages.bz2 Packages.xz Packages.zst Release
          if git diff --cached --quiet; then
            echo "Aura 1.0.2 already published."
            exit 0
          fi
          git commit -m "Publish Aura 1.0.2 preferences fix"
          git push origin HEAD:main
