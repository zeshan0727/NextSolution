name: Build Next Password Overlay RootHide DEB

on:
  push:
    branches: [agent/next-password-keyboard-overlay-roothide]
    paths:
      - 'NextPasswordOverlay/**'
      - '.github/workflows/build-next-password-overlay.yml'
  pull_request:
    branches: [main]
    paths:
      - 'NextPasswordOverlay/**'
      - '.github/workflows/build-next-password-overlay.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install ldid make xz
      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          git clone https://github.com/theos/sdks.git "$HOME/theos/sdks"
      - name: Build RootHide package
        working-directory: NextPasswordOverlay
        env:
          THEOS: ${{ github.workspace }}/../theos
        run: |
          export THEOS="$HOME/theos"
          chmod 755 layout/DEBIAN/postinst
          make clean package FINALPACKAGE=1
          ls -lah packages
      - uses: actions/upload-artifact@v4
        with:
          name: NextPassword-Overlay-RootHide-DEB
          path: NextPasswordOverlay/packages/*.deb
