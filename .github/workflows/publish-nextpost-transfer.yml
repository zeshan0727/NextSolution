name: Publish Next Post to Transfer

# 1.0.5 banner ad unit ID fix publication trigger
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'applications/NextPost-1.0.5-Banner-ID-Fix.tipa'
      - '.github/workflows/publish-nextpost-transfer.yml'

permissions:
  contents: write

concurrency:
  group: publish-nextpost-transfer
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish Next Post and update Transfer manifest
        shell: bash
        run: |
          set -euo pipefail
          SRC='applications/NextPost-1.0.5-Banner-ID-Fix.tipa'
          DEST_DIR='transfer/files/NextPost/1.0.5'
          DEST="$DEST_DIR/NextPost-1.0.5-Banner-ID-Fix.tipa"
          INDEX='transfer/index.json'

          test -s "$SRC"
          test -s "$INDEX"
          mkdir -p "$DEST_DIR"
          cp "$SRC" "$DEST"

          SHA256=$(sha256sum "$DEST" | awk '{print $1}')
          export SHA256

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone

          index_path = Path('transfer/index.json')
          data = json.loads(index_path.read_text())
          files = data.get('files', [])
          entry_id = 'nextpost-1.0.5-banner-id-fix'
          files = [item for item in files if item.get('id') != entry_id]
          entry = {
              'id': entry_id,
              'name': 'Next Post 1.0.5 Banner ID Fix',
              'fileName': 'NextPost-1.0.5-Banner-ID-Fix.tipa',
              'type': 'tipa',
              'platform': 'TrollStore / iOS 16+',
              'version': '1.0.5',
              'url': 'https://nextsolution.cc/transfer/files/NextPost/1.0.5/NextPost-1.0.5-Banner-ID-Fix.tipa',
              'sha256': os.environ['SHA256'],
              'notes': 'Fixes the LevelPlay banner Ad Unit ID transcription error. The verified dashboard Banner ID is 3enr810rqws9op9z (digit 1), not 3enr8l0rqws9op9z (letter l). Keeps the verified interstitial ID y23pc99ate029uga and the full native LevelPlay SDK integration from 1.0.4.'
          }
          data['files'] = [entry] + files
          data['updatedAt'] = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          index_path.write_text(json.dumps(data, indent=2) + '\n')
          PY

          python3 -m json.tool "$INDEX" >/dev/null
          grep -q 'nextpost-1.0.5-banner-id-fix' "$INDEX"
          grep -q "$SHA256" "$INDEX"
          test "$(sha256sum "$DEST" | awk '{print $1}')" = "$SHA256"

      - name: Commit Transfer publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add transfer/files/NextPost/1.0.5/NextPost-1.0.5-Banner-ID-Fix.tipa transfer/index.json
          git commit -m 'Publish Next Post 1.0.5 banner ID fix to Transfer' || true
          git pull --rebase origin main
          git push origin HEAD:main
