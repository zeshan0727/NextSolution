name: Temporary Next Signer 1.3.9 Push Build

on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/nextsigner-139-run.txt'

permissions:
  actions: write
  contents: write

jobs:
  build-release:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: '1.3.9'
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch durable status reader and version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('NextSigner/NextSigner/GitHubService.swift')
          text = path.read_text()
          old = '''        for attempt in 0..<8 {
            var matchedAsset: Asset?

            for page in 1...8 {
                let nonce = String(Int(Date().timeIntervalSince1970 * 1000))
                let assetsURL = try apiURL("/repos/\\(configuration.owner)/\\(configuration.repository)/releases/\\(releaseID)/assets?per_page=100&page=\\(page)&_ns=\\(nonce)")
                var assetsRequest = request(url: assetsURL)
                assetsRequest.cachePolicy = .reloadIgnoringLocalAndRemoteCacheData
                assetsRequest.setValue("no-cache, no-store, max-age=0", forHTTPHeaderField: "Cache-Control")
                assetsRequest.setValue("no-cache", forHTTPHeaderField: "Pragma")

                let (assetsData, assetsResponse) = try await session.data(for: assetsRequest)
                try validate(response: assetsResponse, data: assetsData)
                let assets = try JSONDecoder().decode([Asset].self, from: assetsData)
                if let asset = assets.first(where: { $0.name == assetName }) {
                    matchedAsset = asset
                    break
                }
                if assets.count < 100 { break }
            }
'''
          new = '''        let snapshotPrefix = assetName.hasSuffix(".json")
            ? String(assetName.dropLast(5)) + "-"
            : assetName + "-"

        for attempt in 0..<8 {
            var matchedAsset: Asset?

            for page in 1...8 {
                let nonce = String(Int(Date().timeIntervalSince1970 * 1000))
                let assetsURL = try apiURL("/repos/\\(configuration.owner)/\\(configuration.repository)/releases/\\(releaseID)/assets?per_page=100&page=\\(page)&_ns=\\(nonce)")
                var assetsRequest = request(url: assetsURL)
                assetsRequest.cachePolicy = .reloadIgnoringLocalAndRemoteCacheData
                assetsRequest.setValue("no-cache, no-store, max-age=0", forHTTPHeaderField: "Cache-Control")
                assetsRequest.setValue("no-cache", forHTTPHeaderField: "Pragma")

                let (assetsData, assetsResponse) = try await session.data(for: assetsRequest)
                try validate(response: assetsResponse, data: assetsData)
                let assets = try JSONDecoder().decode([Asset].self, from: assetsData)
                let candidates = assets.filter {
                    $0.name == assetName ||
                    ($0.name.hasPrefix(snapshotPrefix) && $0.name.hasSuffix(".json"))
                }
                if let newest = candidates.max(by: { $0.id < $1.id }) {
                    if matchedAsset == nil || newest.id > matchedAsset!.id {
                        matchedAsset = newest
                    }
                }
                if assets.count < 100 { break }
            }
'''
          if old not in text:
              if 'let snapshotPrefix = assetName.hasSuffix(".json")' not in text:
                  raise SystemExit('Expected status polling block not found')
          else:
              path.write_text(text.replace(old, new, 1))

          model = Path('NextSigner/NextSigner/Models.swift')
          m = model.read_text()
          old_r2 = 'return downloadURL.hasPrefix("https://files.nextjailbreak.com/apps/ipa/")'
          new_r2 = 'return downloadURL.hasPrefix("https://files.nextsolution.cc/apps/ipa/") ||\n               downloadURL.hasPrefix("https://files.nextjailbreak.com/apps/ipa/")'
          if old_r2 in m:
              model.write_text(m.replace(old_r2, new_r2, 1))
          elif 'files.nextsolution.cc/apps/ipa/' not in m:
              raise SystemExit('Expected R2 detection line not found')

          project = Path('NextSigner/project.yml')
          p = project.read_text()
          p = p.replace('MARKETING_VERSION: "1.3.8"', 'MARKETING_VERSION: "1.3.9"')
          p = p.replace('CURRENT_PROJECT_VERSION: "21"', 'CURRENT_PROJECT_VERSION: "22"')
          project.write_text(p)
          PY

          grep -q 'snapshotPrefix' NextSigner/NextSigner/GitHubService.swift
          grep -q 'files.nextsolution.cc/apps/ipa/' NextSigner/NextSigner/Models.swift
          grep -q 'MARKETING_VERSION: "1.3.9"' NextSigner/project.yml
          grep -q 'CURRENT_PROJECT_VERSION: "22"' NextSigner/project.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add NextSigner/NextSigner/GitHubService.swift NextSigner/NextSigner/Models.swift NextSigner/project.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Next Signer 1.3.9 durable live publish status'
            git push origin HEAD:main
          fi

      - name: Generate app icon and Xcode project
        shell: bash
        run: |
          set -euo pipefail
          python3 NextSigner/generate_app_icon.py
          brew install xcodegen
          cd NextSigner
          xcodegen generate

      - name: Build unsigned iPhone app
        working-directory: NextSigner
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project NextSigner.xcodeproj -scheme NextSigner -configuration Release -sdk iphoneos -derivedDataPath "$RUNNER_TEMP/NextSigner139" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package verified TIPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find "$RUNNER_TEMP/NextSigner139/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name '*.app' | head -n1)"
          test -n "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/package/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/package/Payload/NextSigner.app"
          cd "$RUNNER_TEMP/package"
          /usr/bin/zip -qry "$RUNNER_TEMP/NextSigner-${VERSION}.ipa" Payload
          cp "$RUNNER_TEMP/NextSigner-${VERSION}.ipa" "$RUNNER_TEMP/NextSigner-${VERSION}.tipa"
          unzip -t "$RUNNER_TEMP/NextSigner-${VERSION}.tipa" >/dev/null

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NextSigner-1.3.9-TIPA
          path: |
            ${{ runner.temp }}/NextSigner-1.3.9.tipa
            ${{ runner.temp }}/NextSigner-1.3.9.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish through NS Transfer
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow publish-nextsigner-transfer.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run publish-nextsigner-transfer.yml --repo "$GITHUB_REPOSITORY" --ref main -f version="$VERSION"
          RUN_ID=''
          for attempt in $(seq 1 30); do
            CANDIDATE="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow publish-nextsigner-transfer.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            if [ "$CANDIDATE" != "0" ] && [ "$CANDIDATE" != "$BEFORE" ]; then RUN_ID="$CANDIDATE"; break; fi
            sleep 2
          done
          test -n "$RUN_ID"
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status --interval 6
