name: Diagnose Headphone Disconnect Haptic Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-headphone-disconnect-haptic.yml"

permissions:
  contents: write

concurrency:
  group: diagnose-headphone-disconnect-haptic
  cancel-in-progress: false

jobs:
  diagnostic-build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Install tools
        run: brew install dpkg ldid

      - name: Compile both variants and persist full diagnostic output
        shell: bash
        run: |
          set +e
          P="$GITHUB_WORKSPACE/DailyTweaks/2026-08-07-HeadphoneDisconnectHaptic"
          R="$RUNNER_TEMP/hdh-diagnostic"
          mkdir -p "$R"
          python3 "$P/tests/test_runtime_logic.py" > "$R/source-check.log" 2>&1
          SOURCE_RC=$?

          git clone --recursive --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos-rootless" > "$R/rootless-bootstrap.log" 2>&1
          BOOT_ROOTLESS_RC=$?
          ROOTLESS_RC=99
          if [ "$BOOT_ROOTLESS_RC" -eq 0 ]; then
            export THEOS="$RUNNER_TEMP/theos-rootless" THEOS_PACKAGE_SCHEME=rootless
            rm -rf "$P/packages"
            make -C "$P" clean package FINALPACKAGE=1 > "$R/rootless-build.log" 2>&1
            ROOTLESS_RC=$?
          fi

          git init "$RUNNER_TEMP/theos-roothide" > "$R/roothide-bootstrap.log" 2>&1
          git -C "$RUNNER_TEMP/theos-roothide" remote add origin https://github.com/roothide/theos.git >> "$R/roothide-bootstrap.log" 2>&1
          git -C "$RUNNER_TEMP/theos-roothide" fetch --depth 1 origin 88506b2c22e9e07dd4ed055f23c9e398a117a2c7 >> "$R/roothide-bootstrap.log" 2>&1
          FETCH_RH_RC=$?
          ROOTHIDE_RC=99
          if [ "$FETCH_RH_RC" -eq 0 ]; then
            git -C "$RUNNER_TEMP/theos-roothide" checkout --detach 88506b2c22e9e07dd4ed055f23c9e398a117a2c7 >> "$R/roothide-bootstrap.log" 2>&1
            git -C "$RUNNER_TEMP/theos-roothide" submodule update --init --recursive --depth 1 >> "$R/roothide-bootstrap.log" 2>&1
            sed -i '' 's/^Architecture: iphoneos-arm64$/Architecture: iphoneos-arm64e/' "$P/control"
            export THEOS="$RUNNER_TEMP/theos-roothide" THEOS_PACKAGE_SCHEME=roothide
            rm -rf "$P/packages"
            make -C "$P" clean package FINALPACKAGE=1 > "$R/roothide-build.log" 2>&1
            ROOTHIDE_RC=$?
          fi

          mkdir -p diagnostics
          {
            echo "Headphone Disconnect Haptic 1.0.0 diagnostic compiler report"
            echo "Source deterministic checks exit: $SOURCE_RC"
            echo "Rootless bootstrap exit: $BOOT_ROOTLESS_RC"
            echo "Rootless build exit: $ROOTLESS_RC"
            echo "RootHide fetch exit: $FETCH_RH_RC"
            echo "RootHide build exit: $ROOTHIDE_RC"
            echo
            echo "===== SOURCE CHECK ====="
            cat "$R/source-check.log" 2>/dev/null
            echo
            echo "===== ROOTLESS BOOTSTRAP ====="
            cat "$R/rootless-bootstrap.log" 2>/dev/null
            echo
            echo "===== ROOTLESS BUILD ====="
            cat "$R/rootless-build.log" 2>/dev/null
            echo
            echo "===== ROOTHIDE BOOTSTRAP ====="
            cat "$R/roothide-bootstrap.log" 2>/dev/null
            echo
            echo "===== ROOTHIDE BUILD ====="
            cat "$R/roothide-build.log" 2>/dev/null
          } > diagnostics/headphone-disconnect-haptic-build.txt

          git config user.name "Next Solution Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git pull --rebase origin main
          git add diagnostics/headphone-disconnect-haptic-build.txt
          git commit -m "Record Headphone Disconnect Haptic diagnostic build" || true
          git push origin main

          if [ "$SOURCE_RC" -ne 0 ] || [ "$ROOTLESS_RC" -ne 0 ] || [ "$ROOTHIDE_RC" -ne 0 ]; then exit 1; fi
