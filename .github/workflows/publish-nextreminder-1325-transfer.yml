name: Publish Next Reminder 1.3.25 to NS Transfer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-nextreminder-1325-transfer.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARTIFACT_ID: '9490485421'
      APP_DEST_DIR: transfer/files/NextReminder/1.3.25
      APP_DEST_FILE: NextReminder_1.3.25_Unsigned.tipa
      TWEAK_DEST_DIR: transfer/files/NextQuickReminder/1.0.14
      TWEAK_DEST_FILE: NextQuickReminder_1.0.14_RootHide.deb
      APP_SHA: c2320733b374aeeb1f08ddd5d8c6dfb408319f19e080f69cdae81d404fc4f08b
      TWEAK_SHA: 8f36071b0b49ccd7e6a0e052a2d0a51ff9df0b75cc8038dd9acd9b4070175daf
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download exact verified build artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/nextreminder1325.zip
          rm -rf /tmp/nextreminder1325
          mkdir -p /tmp/nextreminder1325
          unzip -q /tmp/nextreminder1325.zip -d /tmp/nextreminder1325
          test -f "/tmp/nextreminder1325/${APP_DEST_FILE}"
          test -f "/tmp/nextreminder1325/${TWEAK_DEST_FILE}"

      - name: Verify exact packages
        shell: bash
        run: |
          set -euo pipefail
          APP="/tmp/nextreminder1325/${APP_DEST_FILE}"
          DEB="/tmp/nextreminder1325/${TWEAK_DEST_FILE}"
          test "$(sha256sum "$APP" | awk '{print $1}')" = "$APP_SHA"
          test "$(sha256sum "$DEB" | awk '{print $1}')" = "$TWEAK_SHA"
          unzip -tq "$APP" >/dev/null
          python3 - "$APP" <<'PY'
          import plistlib,sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              names=z.namelist()
              host=[n for n in names if n.endswith('/NextReminder.app/Info.plist') and n.count('/') == 2][0]
              ext=[n for n in names if n.endswith('/PlugIns/NextReminderLiveActivity.appex/Info.plist')][0]
              hp=plistlib.loads(z.read(host)); ep=plistlib.loads(z.read(ext))
              assert hp['CFBundleShortVersionString']=='1.3.25'
              assert hp['CFBundleVersion']=='35'
              assert ep['CFBundleShortVersionString']=='1.3.25'
              assert ep['CFBundleVersion']=='35'
          PY
          test "$(dpkg-deb -f "$DEB" Package)" = 'com.nextsolution.nextquickreminder'
          test "$(dpkg-deb -f "$DEB" Version)" = '1.0.14'
          test "$(dpkg-deb -f "$DEB" Architecture)" = 'iphoneos-arm64e'
          rm -rf /tmp/nqrcheck && mkdir -p /tmp/nqrcheck
          dpkg-deb -x "$DEB" /tmp/nqrcheck
          F="$(find /tmp/nqrcheck -name NextQuickReminder.dylib -print -quit)"
          test -n "$F"
          strings -a "$F" > /tmp/nqrstrings
          grep -Fq 'Send PDF Report' /tmp/nqrstrings
          grep -Fq 'v1/file-shares' /tmp/nqrstrings
          grep -Fq 'NextReminder.GmailConnection.v1' /tmp/nqrstrings
          grep -Fq 'PDF report sent' /tmp/nqrstrings

      - name: Publish files and update NS Transfer feed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$APP_DEST_DIR" "$TWEAK_DEST_DIR"
          cp "/tmp/nextreminder1325/${APP_DEST_FILE}" "$APP_DEST_DIR/$APP_DEST_FILE"
          cp "/tmp/nextreminder1325/${TWEAK_DEST_FILE}" "$TWEAK_DEST_DIR/$TWEAK_DEST_FILE"

          python3 - <<'PY'
          import json
          from datetime import datetime,timezone
          from pathlib import Path
          p=Path('transfer/index.json')
          data=json.loads(p.read_text())
          old_ids={
              'nextreminder-1.3.24-pdf-report-test',
              'nextquickreminder-1.0.13-roothide',
              'nextreminder-1.3.25-background-pdf',
              'nextquickreminder-1.0.14-background-pdf-roothide'
          }
          data['files']=[x for x in data.get('files',[]) if x.get('id') not in old_ids]
          items=[
            {
              'id':'nextreminder-1.3.25-background-pdf',
              'name':'Next Reminder 1.3.25 — Background PDF Send',
              'fileName':'NextReminder_1.3.25_Unsigned.tipa',
              'type':'tipa',
              'platform':'Unsigned TIPA / iOS 16+',
              'version':'1.3.25 (35)',
              'url':'https://nextjailbreak.com/transfer/files/NextReminder/1.3.25/NextReminder_1.3.25_Unsigned.tipa',
              'sha256':'c2320733b374aeeb1f08ddd5d8c6dfb408319f19e080f69cdae81d404fc4f08b',
              'sizeBytes':1991664,
              'notes':'Polished Pending Reminder Report card and controls, automatic latest-three PDF retention, Background Send toggle, visible status, and Gmail connection preservation so temporary network or delivery failures do not clear the saved Gmail login.'
            },
            {
              'id':'nextquickreminder-1.0.14-background-pdf-roothide',
              'name':'Next Quick Reminder 1.0.14 — Background PDF Send',
              'fileName':'NextQuickReminder_1.0.14_RootHide.deb',
              'type':'deb',
              'platform':'RootHide',
              'version':'1.0.14',
              'url':'https://nextjailbreak.com/transfer/files/NextQuickReminder/1.0.14/NextQuickReminder_1.0.14_RootHide.deb',
              'sha256':'8f36071b0b49ccd7e6a0e052a2d0a51ff9df0b75cc8038dd9acd9b4070175daf',
              'sizeBytes':100224,
              'notes':'Send PDF Report sends the newest locally saved Pending Reminder PDF in the background without opening Next Reminder. Uses the same proven v1/file-shares Gmail attachment route as the successful in-app send and preserves the saved Gmail connection on failures.'
            }
          ]
          for item in reversed(items):
              data['files'].insert(0,item)
          data['updatedAt']=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          p.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')
          PY

          python3 -m json.tool transfer/index.json >/dev/null
          grep -Fq 'nextreminder-1.3.25-background-pdf' transfer/index.json
          grep -Fq 'nextquickreminder-1.0.14-background-pdf-roothide' transfer/index.json
          ! grep -Fq 'nextreminder-1.3.24-pdf-report-test' transfer/index.json
          ! grep -Fq 'nextquickreminder-1.0.13-roothide' transfer/index.json

      - name: Commit NS Transfer publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add transfer/index.json "$APP_DEST_DIR/$APP_DEST_FILE" "$TWEAK_DEST_DIR/$TWEAK_DEST_FILE"
          git diff --cached --stat
          git commit -m 'Publish Next Reminder 1.3.25 background PDF send'
          git push origin HEAD:main
