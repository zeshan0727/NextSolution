name: Debug Next Ledger 1.3.63 Balance Edit Export
permissions:
  contents: write
on:
  push:
    paths:
      - ".github/workflows/debug-next-ledger-sms-review-1.3.62.yml"
jobs:
  dump:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash scripts/apply_next_ledger_1_3_63.sh
      - name: Publish generated sources
        shell: bash
        run: |
          set -euo pipefail
          TMP="$RUNNER_TEMP/next-ledger-generated"
          mkdir -p "$TMP"
          cp DailyLedger/Services/LedgerStore.swift "$TMP/LedgerStore-1.3.63.swift"
          cp DailyLedger/Views/AccountsView.swift "$TMP/AccountsView-1.3.63.swift"
          cp DailyLedger/Views/TransactionsView.swift "$TMP/TransactionsView-1.3.63.swift"
          cp DailyLedger/Views/TransactionSwipeActions.swift "$TMP/TransactionSwipeActions-1.3.63.swift"
          cp DailyLedger/Views/ReportsView.swift "$TMP/ReportsView-1.3.63.swift"
          cp DailyLedger/Services/ProfessionalReportExportService.swift "$TMP/ProfessionalReportExportService-1.3.63.swift"
          cp DailyLedger/Views/ProfessionalReportExportView.swift "$TMP/ProfessionalReportExportView-1.3.63.swift"
          cp DailyLedger/Views/AddTransactionView.swift "$TMP/AddTransactionView-1.3.63.swift"
          cp DailyLedger/Views/TransferView.swift "$TMP/TransferView-1.3.63.swift"
          git reset --hard HEAD
          git clean -fd
          git fetch origin "$GITHUB_REF_NAME"
          git checkout -B debug-source "origin/$GITHUB_REF_NAME"
          mkdir -p .debug/generated-1.3.63
          cp "$TMP"/* .debug/generated-1.3.63/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .debug/generated-1.3.63
          git commit -m "Publish generated Next Ledger 1.3.63 sources" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
