name: Cleanup approved no-icon tweaks

on:
  push:
    paths:
      - '.github/workflows/cleanup-approved-no-icon-tweaks.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter only approved no-icon package stanzas
        shell: python
        run: |
          from pathlib import Path

          targets = {
              'Shake to Run Automation (RootHide)',
              'Next Home Lock',
              'Home Screen Flashlight',
              'Low Power Mode Haptic',
              'Charge 80 Haptic',
              'Wi-Fi Drop Haptic',
              'Screenshot Haptic',
              'Internet Lost Haptic',
              'Clean Home Labels',
              'Sweat My Phone (RootHide)',
              'Headphone Disconnect Haptic',
              'Thermal Warning Haptic',
          }

          p = Path('Packages')
          text = p.read_text(encoding='utf-8')
          stanzas = [s for s in text.strip().split('\n\n') if s.strip()]
          kept = []
          removed_files = []
          removed_names = []

          for stanza in stanzas:
              lines = stanza.splitlines()
              name = next((x[6:] for x in lines if x.startswith('Name: ')), '')
              has_icon = any(x.startswith('Icon:') for x in lines)
              filename = next((x[10:] for x in lines if x.startswith('Filename: ')), '')

              if name in targets and not has_icon:
                  removed_names.append(name)
                  if filename:
                      removed_files.append(filename.removeprefix('./'))
                  continue
              kept.append(stanza)

          p.write_text('\n\n'.join(kept) + '\n', encoding='utf-8')
          Path('/tmp/removed_files.txt').write_text('\n'.join(removed_files) + '\n', encoding='utf-8')
          Path('/tmp/removed_names.txt').write_text('\n'.join(removed_names) + '\n', encoding='utf-8')

          # Safety assertions: protected no-icon packages must remain.
          new = p.read_text(encoding='utf-8')
          for protected in ('Daily Ledger SMS Import', 'PhoneAura', 'Next Quick Reminder'):
              assert f'Name: {protected}' in new, f'Protected package missing: {protected}'

          # Safety assertion: every stanza with an Icon field from the original is preserved.
          original_icon_stanzas = [s for s in stanzas if any(x.startswith('Icon:') for x in s.splitlines())]
          for s in original_icon_stanzas:
              assert s in new, 'An icon-bearing stanza was altered or removed'

          print('Removed entries:')
          print(Path('/tmp/removed_names.txt').read_text())

      - name: Remove matching DEB files only
        shell: bash
        run: |
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            git rm -f --ignore-unmatch "$f"
          done < /tmp/removed_files.txt

      - name: Refresh compressed package index if used
        shell: bash
        run: |
          if [ -f Packages.bz2 ]; then
            bzip2 -c Packages > Packages.bz2
          fi
          if [ -f Packages.gz ]; then
            gzip -c Packages > Packages.gz
          fi

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'Next Jailbreak Repo Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add Packages Packages.bz2 Packages.gz 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No cleanup changes required.'
            exit 0
          fi
          git commit -m 'Remove approved no-icon tweaks from Sileo repo'
          git push
