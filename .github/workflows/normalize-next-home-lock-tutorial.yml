name: Normalize Next Home Lock Tutorial

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/normalize-next-home-lock-tutorial.yml"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run idempotent publisher
        run: python3 .github/scripts/publish-next-home-lock-tutorial.py

      - name: Commit normalized files when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Tutorial files already normalized."
            exit 0
          fi
          git config user.name "Next Solution Tutorial Bot"
          git config user.email "actions@users.noreply.github.com"
          git add next-home-lock-tweak-ios16.html index.html tutorials.html sitemap.xml
          git diff --cached --check
          git commit -m "Normalize Next Home Lock 1.0.5 tutorial"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1
