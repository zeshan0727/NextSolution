name: Debug Next Ledger 1.3.59 SMS Generated Sources

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/debug-next-ledger-1.3.59-sms-generated-trigger.txt"
      - ".github/workflows/debug-next-ledger-1.3.59-sms-generated.yml"

jobs:
  generate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patches through 1.3.59
        run: bash scripts/apply_next_ledger_1_3_59.sh
      - name: Publish generated sources for inspection
        shell: bash
        run: |
          rm -rf .debug-generated/next-ledger-1.3.59
          mkdir -p .debug-generated/next-ledger-1.3.59/RootHideSMSQueue/Sources
          mkdir -p .debug-generated/next-ledger-1.3.59/DailyLedger/Services
          mkdir -p .debug-generated/next-ledger-1.3.59/DailyLedger/Views
          mkdir -p .debug-generated/next-ledger-1.3.59/DailyLedger
          cp RootHideSMSQueue/Sources/main.m .debug-generated/next-ledger-1.3.59/RootHideSMSQueue/Sources/main.m
          cp DailyLedger/Services/SMSImportConsoleService.swift .debug-generated/next-ledger-1.3.59/DailyLedger/Services/
          cp DailyLedger/Services/SMSAIRecognitionService.swift .debug-generated/next-ledger-1.3.59/DailyLedger/Services/
          cp DailyLedger/Views/SMSImportConsoleView.swift .debug-generated/next-ledger-1.3.59/DailyLedger/Views/
          cp DailyLedger/Views/SMSLatest15ReviewView.swift .debug-generated/next-ledger-1.3.59/DailyLedger/Views/
          cp DailyLedger/DailyLedgerApp.swift .debug-generated/next-ledger-1.3.59/DailyLedger/
          git reset --hard HEAD
          git clean -fd -e .debug-generated
          git fetch origin "$GITHUB_REF_NAME"
          git checkout -B debug-publish "origin/$GITHUB_REF_NAME"
          git add -f .debug-generated/next-ledger-1.3.59
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish generated Next Ledger 1.3.59 SMS sources" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
