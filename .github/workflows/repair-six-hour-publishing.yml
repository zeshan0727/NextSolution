name: Repair six-hour publishing migration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-six-hour-publishing.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-six-hour-publishing
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Repair policy, publisher, tests and schedule documentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          site_path = Path('automation/site.json')
          site = json.loads(site_path.read_text(encoding='utf-8'))
          publishing = site['publishing']
          publishing['enabled'] = True
          publishing['max_per_day'] = 4
          publishing['timezone'] = 'Asia/Qatar'
          publishing['normal_cron'] = '*/30 * * * *'
          publishing['windows_local_hours'] = [0, 6, 12, 18]
          site_path.write_text(json.dumps(site, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          publisher_path = Path('automation/publisher.py')
          text = publisher_path.read_text(encoding='utf-8')
          text = text.replace(
              'if publishing.get("max_per_day") != 3:\n        raise PublishingError("publishing.max_per_day must remain exactly 3 for the regular schedule")',
              'if publishing.get("max_per_day") != 4:\n        raise PublishingError("publishing.max_per_day must remain exactly 4 for the regular six-hour schedule")'
          )
          text = text.replace(
              '"publishing.windows_local_hours must contain three unique sorted local hours"',
              '"publishing.windows_local_hours must contain four unique sorted local hours"'
          )
          publisher_path.write_text(text, encoding='utf-8')

          workflow_path = Path('.github/workflows/tweak-draft-generator.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          workflow = workflow.replace(
              '# Self-healing check. Policy publishes only unmet 06:00, 14:00, or 22:00 Qatar windows.',
              '# Self-healing check every 30 minutes. Policy publishes only unmet 00:00, 06:00, 12:00, or 18:00 Qatar windows.'
          )
          workflow_path.write_text(workflow, encoding='utf-8')

          test_path = Path('automation/tests/test_publisher.py')
          tests = test_path.read_text(encoding='utf-8')
          tests = tests.replace('cls.site["publishing"]["max_per_day"] = 3', 'cls.site["publishing"]["max_per_day"] = 4')
          marker = 'cls.site["publishing"]["timezone"] = "Asia/Qatar"'
          if 'cls.site["publishing"]["windows_local_hours"] = [0, 6, 12, 18]' not in tests:
              tests = tests.replace(marker, marker + '\n        cls.site["publishing"]["windows_local_hours"] = [0, 6, 12, 18]', 1)
          tests = tests.replace('def test_preflight_allows_three_per_day_after_boost', 'def test_preflight_allows_four_per_day_after_boost')
          tests = tests.replace('self.assertEqual(ready.max_today, 3)', 'self.assertEqual(ready.max_today, 4)')

          old_limit = '''        audit["events"].append({"published_at": "2026-08-17T19:10:00+00:00"})
        blocked = preflight(self.site, audit, now=after_boost)
        self.assertFalse(blocked.allowed)
        self.assertEqual(blocked.reason, "publication-limit-reached")'''
          new_limit = '''        audit["events"].append({"published_at": "2026-08-17T15:10:00+00:00"})
        still_ready = preflight(self.site, audit, now=after_boost)
        self.assertTrue(still_ready.allowed)

        audit["events"].append({"published_at": "2026-08-17T19:10:00+00:00"})
        blocked = preflight(self.site, audit, now=after_boost)
        self.assertFalse(blocked.allowed)
        self.assertEqual(blocked.reason, "publication-limit-reached")'''
          if old_limit in tests:
              tests = tests.replace(old_limit, new_limit, 1)

          retry_pattern = re.compile(r'''    def test_scheduled_retry_only_allows_an_unmet_local_window\(self\) -> None:\n.*?(?=\n    def test_scheduled_retry_waits_until_first_local_window)''', re.S)
          retry_replacement = '''    def test_scheduled_retry_only_allows_an_unmet_local_window(self) -> None:
        after_boost = datetime(2026, 8, 26, 5, 30, tzinfo=timezone.utc)
        schedule = self.site["publishing"]["normal_cron"]
        first_due = preflight(
            self.site,
            self.empty_audit(),
            now=after_boost,
            trigger_schedule=schedule,
        )
        self.assertTrue(first_due.allowed)

        audit = self.empty_audit()
        audit["events"].extend(
            [
                {"action": "create", "published_at": "2026-08-26T00:12:00+00:00"},
                {"action": "create", "published_at": "2026-08-26T03:12:00+00:00"},
            ]
        )
        satisfied = preflight(
            self.site,
            audit,
            now=after_boost,
            trigger_schedule=schedule,
        )
        self.assertFalse(satisfied.allowed)
        self.assertEqual(satisfied.reason, "scheduled-window-already-satisfied")

        third_due = preflight(
            self.site,
            audit,
            now=datetime(2026, 8, 26, 11, 30, tzinfo=timezone.utc),
            trigger_schedule=schedule,
        )
        self.assertTrue(third_due.allowed)
'''
          tests, count = retry_pattern.subn(retry_replacement, tests, count=1)
          if count != 1:
              raise SystemExit('retry test block not found')

          wait_pattern = re.compile(r'''    def test_scheduled_retry_waits_until_first_local_window\(self\) -> None:\n.*?(?=\n    def test_preflight_does_not_count_existing_page_updates_as_new_posts)''', re.S)
          wait_replacement = '''    def test_midnight_window_is_due_at_start_of_local_day(self) -> None:
        shortly_after_midnight_qatar = datetime(2026, 8, 25, 21, 30, tzinfo=timezone.utc)
        result = preflight(
            self.site,
            self.empty_audit(),
            now=shortly_after_midnight_qatar,
            trigger_schedule=self.site["publishing"]["normal_cron"],
        )
        self.assertTrue(result.allowed)
        self.assertEqual(result.reason, "ready")
'''
          tests, count = wait_pattern.subn(wait_replacement, tests, count=1)
          if count != 1:
              raise SystemExit('midnight test block not found')
          test_path.write_text(tests, encoding='utf-8')

          readme_path = Path('automation/README.md')
          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace(
              'The publisher workflow runs three times per day at 06:00, 14:00, and 22:00 Qatar\ntime. It first checks a committed kill switch and the three-new-pages-per-day',
              'The publisher workflow uses four six-hour publication windows at 00:00, 06:00, 12:00, and 18:00 Qatar\ntime. A self-healing check runs every 30 minutes to recover a missed window. It first checks a committed kill switch and the four-new-pages-per-day'
          )
          readme_path.write_text(readme, encoding='utf-8')
          PY

      - name: Validate repaired publisher
        run: |
          python3 -m py_compile automation/publisher.py
          python3 -m unittest automation.tests.test_publisher -v

      - name: Commit repaired six-hour schedule
        run: |
          if git diff --quiet; then
            echo "Six-hour publisher already repaired."
            exit 0
          fi
          git config user.name "nextsolution-schedule[bot]"
          git config user.email "nextsolution-schedule[bot]@users.noreply.github.com"
          git add -- automation/site.json automation/publisher.py automation/tests/test_publisher.py automation/README.md .github/workflows/tweak-draft-generator.yml
          git commit -m "Fix four-window Qatar publishing schedule"
          git pull --rebase origin main
          git push origin HEAD:main
