name: Clean legacy domains after repository merge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/postmerge-domain-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace old website URLs in all text sources
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = '.github/workflows/postmerge-domain-cleanup.yml'
          legacy = 'next' + 'solution'
          replacements = [
              (f'https://www.{legacy}.cc'.encode(), b'https://nextjailbreak.com'),
              (f'http://www.{legacy}.cc'.encode(), b'https://nextjailbreak.com'),
              (f'https://{legacy}.cc'.encode(), b'https://nextjailbreak.com'),
              (f'http://{legacy}.cc'.encode(), b'https://nextjailbreak.com'),
              (f'https://www.{legacy}.app'.encode(), b'https://nextjailbreak.com'),
              (f'http://www.{legacy}.app'.encode(), b'https://nextjailbreak.com'),
              (f'https://{legacy}.app'.encode(), b'https://nextjailbreak.com'),
              (f'http://{legacy}.app'.encode(), b'https://nextjailbreak.com'),
              (f'www.{legacy}.cc'.encode(), b'nextjailbreak.com'),
              (f'www.{legacy}.app'.encode(), b'nextjailbreak.com'),
          ]
          changed=[]
          skip={'.git','node_modules','DerivedData','build','.build'}
          for p in Path('.').rglob('*'):
              if not p.is_file() or p.as_posix()==workflow or any(x in skip for x in p.parts):
                  continue
              try: data=p.read_bytes()
              except OSError: continue
              if b'\0' in data[:8192]: continue
              out=data
              for old,new in replacements: out=out.replace(old,new)
              if out!=data:
                  p.write_bytes(out); changed.append(p.as_posix())
          print('Changed text files:', len(changed))
          for p in changed: print('  *',p)
          PY

      - name: Verify legacy website URLs are gone
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow='.github/workflows/postmerge-domain-cleanup.yml'
          legacy='next'+'solution'
          pats=[
              f'https://{legacy}.cc'.encode(),f'http://{legacy}.cc'.encode(),
              f'https://www.{legacy}.cc'.encode(),f'http://www.{legacy}.cc'.encode(),
              f'https://{legacy}.app'.encode(),f'http://{legacy}.app'.encode(),
              f'https://www.{legacy}.app'.encode(),f'http://www.{legacy}.app'.encode(),
          ]
          hits=[]
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.as_posix()==workflow: continue
              try: data=p.read_bytes().lower()
              except OSError: continue
              if b'\0' in data[:8192]: continue
              found=[x.decode() for x in pats if x in data]
              if found: hits.append((p.as_posix(),found))
          print('Legacy website URL hits:',len(hits))
          for p,f in hits: print('LEGACY',p,','.join(f))
          if hits: raise SystemExit(1)
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then echo 'No cleanup needed'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Migrate post-merge website URLs to nextjailbreak.com'
          git pull --rebase origin main
          git push origin main
