name: Build and Publish Module Glass 1.0.11 Volume Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-publish-module-glass-1.0.11-volume-test.yml'

permissions:
  contents: write

concurrency:
  group: nextsolution-module-glass-volume-test
  cancel-in-progress: false

jobs:
  build-validate-publish:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply isolated Volume-only runtime patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('source/ModuleGlass/Tweak.m')
          t = p.read_text()

          def replace_once(old, new, label):
              global t
              count = t.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              t = t.replace(old, new, 1)

          replace_once(
              'static char MGLastDiagnosticKey;\n',
              'static char MGLastDiagnosticKey;\nstatic char MGVolumeOriginalAlphaKey;\n',
              'volume alpha key')

          old_slider = '''static UIView *MGFindSliderView(UIView *root) {
              if (!root) return nil;
              if (MGClassNameContains(root, @[@"continuousslider", @"slider"])) return root;
              for (UIView *view in root.subviews) {
                  if (view.tag == MGImageTag) continue;
                  UIView *found = MGFindSliderView(view);
                  if (found) return found;
              }
              return nil;
          }

          static void MGRemoveTaggedImages'''

          new_slider = '''static UIView *MGFindSliderView(UIView *root) {
              if (!root) return nil;
              if (MGClassNameContains(root, @[@"continuousslider", @"slider"])) return root;
              for (UIView *view in root.subviews) {
                  if (view.tag == MGImageTag) continue;
                  UIView *found = MGFindSliderView(view);
                  if (found) return found;
              }
              return nil;
          }

          static BOOL MGVolumeForegroundView(UIView *view) {
              if (!view) return NO;
              if ([view isKindOfClass:UILabel.class] || [view isKindOfClass:UIImageView.class] || [view isKindOfClass:UIButton.class]) return YES;
              NSString *name = NSStringFromClass(view.class).lowercaseString;
              return [name containsString:@"label"] || [name containsString:@"glyph"] ||
                     [name containsString:@"icon"] || [name containsString:@"button"] ||
                     [name containsString:@"text"] || [name containsString:@"percentage"];
          }

          static BOOL MGVolumeSubtreeHasForeground(UIView *view) {
              if (!view) return NO;
              if (MGVolumeForegroundView(view)) return YES;
              for (UIView *child in view.subviews) {
                  if (child.tag == MGImageTag) continue;
                  if (MGVolumeSubtreeHasForeground(child)) return YES;
              }
              return NO;
          }

          static void MGRestoreVolumeVisuals(UIView *root) {
              if (!root) return;
              NSNumber *savedAlpha = objc_getAssociatedObject(root, &MGVolumeOriginalAlphaKey);
              if (savedAlpha) {
                  root.alpha = savedAlpha.doubleValue;
                  objc_setAssociatedObject(root, &MGVolumeOriginalAlphaKey, nil, OBJC_ASSOCIATION_RETAIN_NONATOMIC);
              }
              for (UIView *child in root.subviews) MGRestoreVolumeVisuals(child);
          }

          static BOOL MGVolumeObscuringVisual(UIView *view, UIView *slider, UIImageView *imageView) {
              if (!view || !slider || view == imageView || view.tag == MGImageTag) return NO;
              if ([imageView isDescendantOfView:view]) return NO;
              if ([view isKindOfClass:UIControl.class] || MGVolumeSubtreeHasForeground(view)) return NO;

              CGRect converted = [view convertRect:view.bounds toView:slider];
              CGFloat sliderArea = MAX(1.0, CGRectGetWidth(slider.bounds) * CGRectGetHeight(slider.bounds));
              CGFloat area = MAX(0.0, CGRectGetWidth(converted) * CGRectGetHeight(converted));
              CGFloat ratio = area / sliderArea;
              if (ratio < 0.10) return NO;

              NSString *name = NSStringFromClass(view.class).lowercaseString;
              BOOL namedVisual = [name containsString:@"material"] || [name containsString:@"effect"] ||
                                 [name containsString:@"blur"] || [name containsString:@"fill"] ||
                                 [name containsString:@"progress"] || [name containsString:@"background"] ||
                                 [name containsString:@"tint"] || [name containsString:@"valueindicator"];
              BOOL plainLargeVisual = ([name isEqualToString:@"uiview"] || [name containsString:@"visualeffectsubview"]) && ratio >= 0.18;
              return namedVisual || plainLargeVisual;
          }

          static NSUInteger MGApplyVolumeImageMode(UIView *slider, UIImageView *imageView, NSMutableArray<NSString *> *suppressedClasses) {
              if (!slider || !imageView) return 0;
              NSUInteger count = 0;
              for (UIView *child in slider.subviews) {
                  if (child.tag == MGImageTag) continue;
                  if (MGVolumeObscuringVisual(child, slider, imageView)) {
                      if (!objc_getAssociatedObject(child, &MGVolumeOriginalAlphaKey)) {
                          objc_setAssociatedObject(child, &MGVolumeOriginalAlphaKey, @(child.alpha), OBJC_ASSOCIATION_RETAIN_NONATOMIC);
                      }
                      child.alpha = 0.0;
                      [suppressedClasses addObject:NSStringFromClass(child.class) ?: @"UIView"];
                      count++;
                      continue;
                  }
                  count += MGApplyVolumeImageMode(child, imageView, suppressedClasses);
              }
              return count;
          }

          static void MGRemoveTaggedImages'''
          replace_once(old_slider, new_slider, 'volume visual helpers')

          replace_once(
              '    NSString *slot = MGSlotForController(controller, &candidates);\n    BOOL expanded = MGIsExpanded(root);',
              '    NSString *slot = MGSlotForController(controller, &candidates);\n    // Always restore any Volume-only visual suppression before recalculating compact/expanded state.\n    MGRestoreVolumeVisuals(root);\n    BOOL expanded = MGIsExpanded(root);',
              'volume restore before state check')

          replace_once(
              '    imageView.userInteractionEnabled = NO;\n    MGCopyCornerGeometry(imageView, cornerSource, root);\n\n    // Safety rule:',
              '''    imageView.userInteractionEnabled = NO;
              MGCopyCornerGeometry(imageView, cornerSource, root);

              NSUInteger volumeSuppressed = 0;
              NSArray<NSString *> *volumeSuppressedClasses = @[];
              if ([slot isEqualToString:@"volume"]) {
                  UIView *volumeSlider = MGFindSliderView(root);
                  if (volumeSlider) {
                      NSMutableArray<NSString *> *classes = [NSMutableArray array];
                      volumeSuppressed = MGApplyVolumeImageMode(volumeSlider, imageView, classes);
                      volumeSuppressedClasses = classes.copy;
                      strategy = @"volume-image-first-test";
                  } else {
                      strategy = @"volume-no-slider-found";
                  }
              }

              // Safety rule:''',
              'volume-only apply path')

          old_diag = 'nativeRadius=%.2f imageFrame=%@ subviews=%lu imageView=%@ glowPref=%d glowIntensity=%.2f glowWidth=%.2f",\n                      source, NSStringFromClass([controller class]), candidates, slot, path, exists, enabled, imageView.image != nil, removeBlur, opacity, strategy, NSStringFromClass(root.class), NSStringFromCGRect(root.frame), NSStringFromClass(parent.class), anchor ? NSStringFromClass(anchor.class) : @"<none>", anchor ? NSStringFromCGRect(anchor.frame) : @"<none>", cornerSource.layer.cornerRadius, NSStringFromCGRect(imageView.frame), (unsigned long)parent.subviews.count, imageView, glow, glowIntensity, glowWidth]);'
          new_diag = 'nativeRadius=%.2f imageFrame=%@ subviews=%lu imageView=%@ volumeSuppressed=%lu suppressedClasses=%@ glowPref=%d glowIntensity=%.2f glowWidth=%.2f",\n                      source, NSStringFromClass([controller class]), candidates, slot, path, exists, enabled, imageView.image != nil, removeBlur, opacity, strategy, NSStringFromClass(root.class), NSStringFromCGRect(root.frame), NSStringFromClass(parent.class), anchor ? NSStringFromClass(anchor.class) : @"<none>", anchor ? NSStringFromCGRect(anchor.frame) : @"<none>", cornerSource.layer.cornerRadius, NSStringFromCGRect(imageView.frame), (unsigned long)parent.subviews.count, imageView, (unsigned long)volumeSuppressed, volumeSuppressedClasses, glow, glowIntensity, glowWidth]);'
          replace_once(old_diag, new_diag, 'volume diagnostics')

          t = t.replace('ModuleGlassRuntime 1.0.6 loaded', 'ModuleGlassRuntime 1.0.7 Volume Test loaded')
          t = t.replace('Passive slider-aware overlay runtime', 'Volume-isolated image-first test runtime')
          p.write_text(t)

          c = Path('source/ModuleGlass/control')
          ct = c.read_text()
          ct = re.sub(r'^Version: .*$', 'Version: 1.0.7', ct, flags=re.M)
          ct = re.sub(r'^Description: .*$', 'Description: Isolated Module Glass Volume test runtime: preserves native slider geometry and interaction while removing only Volume visual layers that obscure the custom image.', ct, flags=re.M)
          c.write_text(ct)
          PY

      - name: Validate isolation before compile
        shell: bash
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/source/ModuleGlass"
          grep -q '^Version: 1.0.7$' "$P/control"
          grep -q 'volume-image-first-test' "$P/Tweak.m"
          grep -q 'MGApplyVolumeImageMode' "$P/Tweak.m"
          grep -q 'MGRestoreVolumeVisuals(root)' "$P/Tweak.m"
          grep -q 'if (\[slot isEqualToString:@"volume"\])' "$P/Tweak.m"
          grep -q 'BOOL sliderSlot = \[slot isEqualToString:@"volume"\] || \[slot isEqualToString:@"brightness"\]' "$P/Tweak.m"
          grep -q 'comapplecontrolcenterdisplaymodule' "$P/Tweak.m"
          grep -q 'comapplemediaremotecontrolcenternowplaying' "$P/Tweak.m"
          grep -q 'comapplecontrolcenterconnectivitymodule' "$P/Tweak.m"
          ! grep -q 'brightness-image-first-test' "$P/Tweak.m"
          grep -q 'imageView.userInteractionEnabled = NO' "$P/Tweak.m"
          grep -q 'expanded-bypass' "$P/Tweak.m"
          grep -q '^ARCHS = arm64 arm64e$' "$P/Makefile"
          plutil -lint "$P/CCModuleBackgrounds.plist"

      - name: Install packaging tools
        run: brew install dpkg ldid xz zstd

      - name: Install pinned RootHide Theos
        shell: bash
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/theos-roothide"
          git init "$T"
          git -C "$T" remote add origin https://github.com/roothide/theos.git
          git -C "$T" fetch --depth 1 origin 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$T" checkout --detach 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$T" submodule update --init --recursive --depth 1

      - name: Build Module Glass Runtime 1.0.7
        shell: bash
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/source/ModuleGlass"
          OUT="$RUNNER_TEMP/module-glass-release"
          RAW="$RUNNER_TEMP/module-glass-runtime-raw.deb"
          STAGE="$RUNNER_TEMP/module-glass-runtime-stage"
          mkdir -p "$OUT"
          export THEOS="$RUNNER_TEMP/theos-roothide"
          export THEOS_PACKAGE_SCHEME=roothide
          rm -rf "$P/.theos" "$P/packages" "$STAGE"
          make -C "$P" clean package FINALPACKAGE=1
          DEB="$(find "$P/packages" -type f -name '*.deb' -print -quit)"
          test -n "$DEB"
          cp "$DEB" "$RAW"
          dpkg-deb -R "$RAW" "$STAGE"
          test -f "$STAGE/Library/MobileSubstrate/DynamicLibraries/CCModuleBackgrounds.dylib"
          cat > "$STAGE/DEBIAN/postinst" <<'SH'
          #!/bin/sh
          killall -9 SpringBoard 2>/dev/null || true
          exit 0
          SH
          chmod 0755 "$STAGE/DEBIAN/postinst"
          dpkg-deb -b "$STAGE" "$OUT/NextAura_Runtime_ccbackgrounds_1.0.7_RootHide.deb"

      - name: Build Module Glass 1.0.11 settings package
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/module-glass-release"
          STAGE="$RUNNER_TEMP/module-glass-main-stage"
          rm -rf "$STAGE"
          dpkg-deb -R "$GITHUB_WORKSPACE/debfiles/NextAura_cc_module_backgrounds_1.0.10_RootHide.deb" "$STAGE"
          python3 - "$STAGE/DEBIAN/control" <<'PY'
          from pathlib import Path
          import re, sys
          p = Path(sys.argv[1])
          t = p.read_text()
          t = re.sub(r'^Version: .*$', 'Version: 1.0.11', t, flags=re.M)
          t = re.sub(r'com\.nextsolution\.nextaura\.runtime\.ccbackgrounds \(>= [^)]+\)', 'com.nextsolution.nextaura.runtime.ccbackgrounds (>= 1.0.7)', t)
          t = re.sub(r'^Description: .*$', 'Description: Volume-only validation build. Other Module Glass module rendering remains on the existing path while Volume tests image-first native slider rendering.', t, flags=re.M)
          p.write_text(t)
          PY
          grep -q '^Version: 1.0.11$' "$STAGE/DEBIAN/control"
          grep -q 'com.nextsolution.nextaura.runtime.ccbackgrounds (>= 1.0.7)' "$STAGE/DEBIAN/control"
          dpkg-deb -b "$STAGE" "$OUT/NextAura_cc_module_backgrounds_1.0.11_RootHide.deb"

      - name: Validate release packages
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/module-glass-release"
          R="$OUT/NextAura_Runtime_ccbackgrounds_1.0.7_RootHide.deb"
          M="$OUT/NextAura_cc_module_backgrounds_1.0.11_RootHide.deb"
          test "$(dpkg-deb -f "$R" Version)" = '1.0.7'
          test "$(dpkg-deb -f "$R" Architecture)" = 'iphoneos-arm64e'
          test "$(dpkg-deb -f "$M" Version)" = '1.0.11'
          dpkg-deb -f "$M" Depends | grep -q 'com.nextsolution.nextaura.runtime.ccbackgrounds (>= 1.0.7)'
          X="$(mktemp -d)"
          dpkg-deb -x "$R" "$X"
          D="$X/Library/MobileSubstrate/DynamicLibraries/CCModuleBackgrounds.dylib"
          lipo -info "$D" | grep -q 'arm64'
          lipo -info "$D" | grep -q 'arm64e'
          strings -a "$D" | grep -q 'ModuleGlassRuntime 1.0.7 Volume Test loaded'
          strings -a "$D" | grep -q 'volume-image-first-test'
          strings -a "$D" | grep -q 'volumeSuppressed'
          strings -a "$D" | grep -q 'expanded-bypass'
          strings -a "$D" | grep -q 'comapplemediaremotecontrolcenteraudio'
          strings -a "$D" | grep -q 'comapplecontrolcenterdisplaymodule'
          rm -rf "$X"
          shasum -a 256 "$R" "$M"

      - name: Publish Volume test and refresh repo indexes
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/module-glass-release"
          SCAN="$RUNNER_TEMP/module-glass-scan"
          git config user.name 'Next Solution Build Bot'
          git config user.email 'actions@users.noreply.github.com'

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            # Reapply the already-tested source/control patch after reset by checking out from the job's original patched tree.
            git checkout "$GITHUB_SHA" -- source/ModuleGlass/Tweak.m source/ModuleGlass/control 2>/dev/null || true
            # $GITHUB_SHA predates the in-job patch, so recover the tested files from temporary copies below if needed.
            if ! grep -q 'volume-image-first-test' source/ModuleGlass/Tweak.m; then
              cp "$RUNNER_TEMP/tested-Tweak.m" source/ModuleGlass/Tweak.m
              cp "$RUNNER_TEMP/tested-control" source/ModuleGlass/control
            fi

            rm -rf "$SCAN"
            mkdir -p "$SCAN" debfiles
            cp "$OUT/NextAura_Runtime_ccbackgrounds_1.0.7_RootHide.deb" debfiles/
            cp "$OUT/NextAura_cc_module_backgrounds_1.0.11_RootHide.deb" debfiles/
            cp "$OUT"/*.deb "$SCAN/"

            dpkg-scanpackages -m "$SCAN" /dev/null > "$RUNNER_TEMP/module-glass-stanzas"
            python3 - "$RUNNER_TEMP/module-glass-stanzas" <<'PY'
          from pathlib import Path
          import os, re, sys
          p = Path(sys.argv[1])
          lines=[]
          for line in p.read_text().splitlines():
              if line.startswith('Filename: '): line='Filename: ./debfiles/' + os.path.basename(line.split(': ',1)[1])
              lines.append(line)
          p.write_text('\n'.join(lines)+'\n')
          PY
            python3 - "$RUNNER_TEMP/module-glass-stanzas" <<'PY'
          from pathlib import Path
          import re, sys
          ids={'com.nextsolution.nextaura.runtime.ccbackgrounds','com.nextsolution.nextaura.cc-module-backgrounds'}
          path=Path('Packages')
          rows=[x.strip() for x in re.split(r'\n\s*\n', path.read_text()) if x.strip()]
          def pid(row):
              m=re.search(r'^Package: (.+)$',row,re.M); return m.group(1).strip() if m else ''
          rows=[r for r in rows if pid(r) not in ids]
          new=[x.strip() for x in re.split(r'\n\s*\n', Path(sys.argv[1]).read_text()) if x.strip()]
          path.write_text('\n\n'.join(rows+new)+'\n')
          PY

            grep -A15 '^Package: com.nextsolution.nextaura.runtime.ccbackgrounds$' Packages | grep -q '^Version: 1.0.7$'
            grep -A15 '^Package: com.nextsolution.nextaura.cc-module-backgrounds$' Packages | grep -q '^Version: 1.0.11$'
            grep -A20 '^Package: com.nextsolution.nextaura.cc-module-backgrounds$' Packages | grep -q 'com.nextsolution.nextaura.runtime.ccbackgrounds (>= 1.0.7)'

            gzip -9 -c Packages > Packages.gz
            bzip2 -9 -c Packages > Packages.bz2
            xz -9e -c Packages > Packages.xz
            zstd -19 -q -c Packages > Packages.zst

            python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import re
          p=Path('Release'); t=p.read_text()
          m=re.search(r'^Version:\s*(\d+)\.(\d+)\.(\d+)\s*$',t,re.M)
          if m:
              a,b,c=map(int,m.groups()); t=re.sub(r'^Version: .*$',f'Version: {a}.{b}.{c+1}',t,flags=re.M)
          t=re.sub(r'^Date: .*$', 'Date: '+datetime.now(timezone.utc).strftime('%a, %d %b %Y %H:%M:%S UTC'), t, flags=re.M)
          p.write_text(t)
          PY

            git add source/ModuleGlass/Tweak.m source/ModuleGlass/control \
              debfiles/NextAura_Runtime_ccbackgrounds_1.0.7_RootHide.deb \
              debfiles/NextAura_cc_module_backgrounds_1.0.11_RootHide.deb \
              Packages Packages.gz Packages.bz2 Packages.xz Packages.zst Release
            git diff --cached --check
            git commit -m 'Publish Module Glass 1.0.11 Volume test and Runtime 1.0.7'
            git push origin HEAD:main && exit 0
            sleep $((attempt * 4))
          done
          exit 1

      - name: Preserve tested source for publish reset
        if: always()
        shell: bash
        run: |
          true
