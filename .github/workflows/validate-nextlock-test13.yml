name: Validate NextLock Test 13 PR

on:
  pull_request:
    paths:
      - 'source/NextLockHideElements/**'
      - 'transfer/build-triggers/nextlock-test13.txt'
      - '.github/workflows/validate-nextlock-test13.yml'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: brew install dpkg ldid
      - name: Build hide-elements runtime
        shell: bash
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/source/NextLockHideElements"
          T="$RUNNER_TEMP/theos-rh"
          git init "$T"
          git -C "$T" remote add origin https://github.com/roothide/theos.git
          git -C "$T" fetch --depth 1 origin 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$T" checkout --detach 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$T" submodule update --init --recursive --depth 1
          export THEOS="$T" THEOS_PACKAGE_SCHEME=roothide
          make -C "$P" clean package FINALPACKAGE=1
          D=$(find "$P/packages" -name '*.deb' -print -quit)
          test -n "$D"
          X=$(mktemp -d); dpkg-deb -x "$D" "$X"
          F=$(find "$X" -name NextLockHideElements.dylib -print -quit)
          strings -a "$F" | grep -q '1.1.5-test13 independent-lockscreen-hide-controls'
          lipo -info "$F" | grep -q arm64e
      - name: Validate Test 12 base
        run: |
          test -f transfer/files/NextLock/1.1.5-Test12-CustomClock/NextLock_1.1.5_Test12_CustomClock_RootHide.deb
