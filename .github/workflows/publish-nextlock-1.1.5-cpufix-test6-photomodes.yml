name: Build and Publish NextLock 1.1.5 CPU Fix Test 6 Photo Modes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-nextlock-1.1.5-cpufix-test6-photomodes.yml'

permissions:
  contents: write

concurrency:
  group: publish-nextlock-1.1.5-cpufix-test6-photomodes
  cancel-in-progress: false

jobs:
  build-publish:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: brew install dpkg ldid

      - name: Fetch verified Test 6 source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/nextlock-photo-content-modes
          git worktree add "$RUNNER_TEMP/nextlock-feature" FETCH_HEAD
          S="$RUNNER_TEMP/nextlock-feature/source/NextLockPerfFix/Tweak.m"
          test -f "$S"
          grep -q 'NextLockPerfFix 1.1.5-photo-modes test5-cpu preserve-layout auto-stretch-full-cutout' "$S"
          grep -q 'kArm64eSetContentModeStub   = 0xDAE0' "$S"
          grep -q 'kArm64SetContentModeStub    = 0xD7C0' "$S"
          grep -q 'NLPhotosWithContentModes' "$S"
          grep -q 'NLSuppressHotCallback' "$S"

      - name: Build RootHide Test 6 shim
        shell: bash
        run: |
          set -euo pipefail
          P="$RUNNER_TEMP/nextlock-feature/source/NextLockPerfFix"
          T="$RUNNER_TEMP/theos-rh"
          git init "$T"
          git -C "$T" remote add origin https://github.com/roothide/theos.git
          git -C "$T" fetch --depth 1 origin 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$T" checkout --detach 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$T" submodule update --init --recursive --depth 1
          sed -i '' 's/^Architecture: iphoneos-arm64$/Architecture: iphoneos-arm64e/' "$P/control"
          export THEOS="$T"
          export THEOS_PACKAGE_SCHEME=roothide
          rm -rf "$P/.theos" "$P/packages"
          make -C "$P" clean package FINALPACKAGE=1
          D=$(find "$P/packages" -type f -name '*.deb' -print -quit)
          test -n "$D"
          echo "FIX_DEB=$D" >> "$GITHUB_ENV"

      - name: Integrate into original NextLock 1.1.4 and add per-frame UI
        shell: bash
        run: |
          set -euo pipefail
          BASE=transfer/files/NextLock/1.1.4/NextLock_1.1.4_RootHide.deb
          STAGE="$RUNNER_TEMP/nextlock-stage"
          FIXSTAGE="$RUNNER_TEMP/fix-stage"
          OUT="$RUNNER_TEMP/out"
          mkdir -p "$OUT"
          dpkg-deb -R "$BASE" "$STAGE"
          dpkg-deb -x "$FIX_DEB" "$FIXSTAGE"

          LOCK=$(find "$STAGE" -name LockGlyphTime.dylib -print -quit)
          FIX=$(find "$FIXSTAGE" -name NextLockPerfFix.dylib -print -quit)
          FIXPLIST=$(find "$FIXSTAGE" -name NextLockPerfFix.plist -print -quit)
          test -n "$LOCK"; test -n "$FIX"; test -n "$FIXPLIST"

          dwarfdump --uuid "$LOCK" | tee "$RUNNER_TEMP/lock-uuids.txt"
          grep -qi 'C7EBC4D1-EAD4-3320-A27F-34E86C25F776' "$RUNNER_TEMP/lock-uuids.txt"
          grep -qi '7BE1428A-C4B0-38F8-8120-7BACBF220731' "$RUNNER_TEMP/lock-uuids.txt"

          BEFORE=$(shasum -a 256 "$LOCK" | awk '{print $1}')
          DYNDIR=$(dirname "$LOCK")
          cp "$FIX" "$DYNDIR/NextLockPerfFix.dylib"
          cp "$FIXPLIST" "$DYNDIR/NextLockPerfFix.plist"
          test "$BEFORE" = "$(shasum -a 256 "$LOCK" | awk '{print $1}')"

          python3 - "$STAGE" <<'PY'
          from pathlib import Path
          import plistlib,sys
          stage=Path(sys.argv[1])
          bundle=stage/'Library/PreferenceBundles/LockGlyphTimePrefs.bundle'
          for i in range(1,5):
              p=bundle/f'PhotoFrame{i}.plist'
              with p.open('rb') as f: data=plistlib.load(f)
              items=[x for x in data['items'] if x.get('key') != f'photoFrame{i}ContentMode']
              cell={
                  'PostNotification':'com.nextsolution.lockglyphtime/ReloadPrefs',
                  'cell':'PSLinkListCell',
                  'default':0,
                  'defaults':'com.nextsolution.lockglyphtime',
                  'detail':'PSListItemsController',
                  'key':f'photoFrame{i}ContentMode',
                  'label':'Photo Display',
                  'validTitles':['Auto (Recommended)','Stretch','Full Photo','Cut / Crop'],
                  'validValues':[0,1,2,3],
              }
              items.insert(4 if len(items)>=4 else len(items), cell)
              data['items']=items
              with p.open('wb') as f: plistlib.dump(data,f,fmt=plistlib.FMT_XML,sort_keys=False)
          PY

          python3 - "$STAGE/DEBIAN/control" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); t=p.read_text()
          t=re.sub(r'^Version: .*$', 'Version: 1.1.5~cpu6', t, flags=re.M)
          desc='Description: NextLock 1.1.5 CPU-fix Test 6. Restores full unthrottled time/date/photo positioning by replacing Test 4 global throttling with suppression of only the proven 120 Hz redundant callback. Adds per-frame Auto, Stretch, Full Photo and Cut/Crop display modes. Retains duplicate-render suppression and exact transparency caching.'
          t=re.sub(r'^Description: .*$', desc, t, flags=re.M) if re.search(r'^Description: .*$',t,re.M) else t+'\n'+desc+'\n'
          p.write_text(t)
          PY

          OUTDEB="$OUT/NextLock_1.1.5_CPUFix_Test6_PhotoModes_RootHide.deb"
          dpkg-deb -b "$STAGE" "$OUTDEB"
          echo "OUTDEB=$OUTDEB" >> "$GITHUB_ENV"
          echo "ORIGINAL_LOCK_SHA=$BEFORE" >> "$GITHUB_ENV"

      - name: Validate Test 6 package
        shell: bash
        run: |
          set -euo pipefail
          test "$(dpkg-deb -f "$OUTDEB" Package)" = 'com.nextsolution.lockglyphtime'
          test "$(dpkg-deb -f "$OUTDEB" Version)" = '1.1.5~cpu6'
          X=$(mktemp -d)
          dpkg-deb -x "$OUTDEB" "$X"
          LOCK=$(find "$X" -name LockGlyphTime.dylib -print -quit)
          FIX=$(find "$X" -name NextLockPerfFix.dylib -print -quit)
          PLIST=$(find "$X" -name NextLockPerfFix.plist -print -quit)
          test -n "$LOCK"; test -n "$FIX"; test -n "$PLIST"
          test "$(shasum -a 256 "$LOCK" | awk '{print $1}')" = "$ORIGINAL_LOCK_SHA"
          strings -a "$FIX" | grep -q 'auto-stretch-full-cutout'
          strings -a "$FIX" | grep -q 'Test5 CPU path'
          plutil -p "$PLIST" | grep -q 'com.apple.springboard'
          lipo -info "$FIX" | grep -q 'arm64e'
          for i in 1 2 3 4; do
            P="$X/Library/PreferenceBundles/LockGlyphTimePrefs.bundle/PhotoFrame${i}.plist"
            plutil -p "$P" | grep -q "photoFrame${i}ContentMode"
            plutil -p "$P" | grep -q 'Auto (Recommended)'
            plutil -p "$P" | grep -q 'Stretch'
            plutil -p "$P" | grep -q 'Full Photo'
            plutil -p "$P" | grep -q 'Cut / Crop'
          done
          SHA=$(shasum -a 256 "$OUTDEB" | awk '{print $1}')
          echo "OUT_SHA=$SHA" >> "$GITHUB_ENV"

      - name: Publish Test 6 to NS Transfer
        shell: bash
        run: |
          set -euo pipefail
          DEST_DIR='transfer/files/NextLock/1.1.5-CPUFix-Test6-PhotoModes'
          DEST="$DEST_DIR/NextLock_1.1.5_CPUFix_Test6_PhotoModes_RootHide.deb"
          mkdir -p "$DEST_DIR"
          cp "$OUTDEB" "$DEST"
          test "$(shasum -a 256 "$DEST" | awk '{print $1}')" = "$OUT_SHA"
          export OUT_SHA

          python3 - <<'PY'
          import json,os
          from pathlib import Path
          from datetime import datetime,timezone
          p=Path('transfer/index.json')
          data=json.loads(p.read_text())
          files=data.get('files',[])
          remove_ids={
            'nextlock-1.1.5-cpufix-test1-roothide',
            'nextlock-1.1.5-cpufix-test2-roothide',
            'nextlock-1.1.5-cpufix-test3-roothide',
            'nextlock-1.1.5-cpufix-test4-roothide',
            'nextlock-1.1.5-cpufix-test5-roothide',
            'nextlock-1.1.5-cpufix-test6-photomodes-roothide'
          }
          files=[x for x in files if x.get('id') not in remove_ids]
          entry={
            'id':'nextlock-1.1.5-cpufix-test6-photomodes-roothide',
            'name':'NextLock 1.1.5 CPU Fix Test 6 + Photo Modes RootHide',
            'fileName':'NextLock_1.1.5_CPUFix_Test6_PhotoModes_RootHide.deb',
            'type':'deb',
            'platform':'RootHide',
            'version':'1.1.5-test6',
            'url':'https://nextjailbreak.com/transfer/files/NextLock/1.1.5-CPUFix-Test6-PhotoModes/NextLock_1.1.5_CPUFix_Test6_PhotoModes_RootHide.deb',
            'sha256':os.environ['OUT_SHA'],
            'notes':'Test 6 replaces Test 4 global 10 Hz throttling with a targeted suppression of only the proven 120 Hz redundant callback so time/date/photo position controls remain fully live. Adds Photo Display to each of Frames 1-4: Auto (original transparent/opaque behavior), Stretch (fill exact frame), Full Photo (show entire image), and Cut/Crop (aspect-fill and crop). Retains duplicate deferred-render suppression and exact transparency caching.'
          }
          data['files']=[entry]+files
          data['updatedAt']=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY

          python3 -m json.tool transfer/index.json >/dev/null
          grep -q 'nextlock-1.1.5-cpufix-test6-photomodes-roothide' transfer/index.json
          grep -q "$OUT_SHA" transfer/index.json

          git config user.name 'Next Jailbreak Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add "$DEST" transfer/index.json
          git diff --cached --check
          git commit -m 'Publish NextLock 1.1.5 CPU Fix Test 6 with photo modes'
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Upload Test 6 artifact
        uses: actions/upload-artifact@v4
        with:
          name: NextLock-1.1.5-CPUFix-Test6-PhotoModes-RootHide
          path: ${{ env.OUTDEB }}
          if-no-files-found: error
          retention-days: 14
