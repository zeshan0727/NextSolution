name: Build Next Solution Website TIPA

on:
  workflow_dispatch:
  push:
    paths:
      - 'NextWebsiteApp/**'
      - '!NextWebsiteApp/build-output/**'
      - '.github/workflows/build-nextsolution-website-tipa.yml'
  pull_request:
    paths:
      - 'NextWebsiteApp/**'
      - '.github/workflows/build-nextsolution-website-tipa.yml'

permissions:
  contents: write

concurrency:
  group: build-nextsolution-website-tipa
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate app icon
        working-directory: NextWebsiteApp
        run: swift generate_app_icon.swift NextSolution/Assets.xcassets/AppIcon.appiconset/AppIcon.png

      - name: Generate Xcode project
        working-directory: NextWebsiteApp
        run: xcodegen generate

      - name: Build unsigned iPhone app
        id: build
        working-directory: NextWebsiteApp
        shell: bash
        run: |
          set +e
          mkdir -p build-output
          xcodebuild \
            -project NextSolution.xcodeproj \
            -scheme NextSolution \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build-output/xcodebuild.log
          BUILD_STATUS=${PIPESTATUS[0]}
          echo "exit_code=$BUILD_STATUS" >> "$GITHUB_OUTPUT"
          if [ "$BUILD_STATUS" -eq 0 ]; then
            echo "SUCCESS" > build-output/build-status.txt
          else
            echo "FAILED (xcodebuild exit code $BUILD_STATUS)" > build-output/build-status.txt
          fi
          exit 0

      - name: Package TIPA
        if: steps.build.outputs.exit_code == '0'
        working-directory: NextWebsiteApp
        run: |
          rm -rf Payload NextSolution-1.0.0.tipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NextSolution.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload NextSolution-1.0.0.tipa
          cp NextSolution-1.0.0.tipa build-output/NextSolution-1.0.0.tipa
          shasum -a 256 build-output/NextSolution-1.0.0.tipa > build-output/NextSolution-1.0.0.sha256

      - name: Publish build result to repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: NextWebsiteApp
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f build-output/build-status.txt build-output/xcodebuild.log
          if [ -f build-output/NextSolution-1.0.0.tipa ]; then
            git add -f build-output/NextSolution-1.0.0.tipa build-output/NextSolution-1.0.0.sha256
          else
            git rm -f --ignore-unmatch build-output/NextSolution-1.0.0.tipa build-output/NextSolution-1.0.0.sha256
          fi
          git commit -m "Publish Next Solution website TIPA" || true
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload TIPA artifact
        if: steps.build.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: NextSolution-Website-TIPA
          path: |
            NextWebsiteApp/NextSolution-1.0.0.tipa
            NextWebsiteApp/build-output/NextSolution-1.0.0.sha256
          if-no-files-found: error

      - name: Fail workflow when build failed
        if: steps.build.outputs.exit_code != '0'
        run: exit 1
