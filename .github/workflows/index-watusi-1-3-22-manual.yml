name: Index Watusi 3 1.3.22 manual article

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/index-watusi-1-3-22-manual.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Add article to live index, RSS and sitemap
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, re
          from datetime import datetime, timezone
          root = pathlib.Path('.')
          article_path = root / 'watusi-3-1-3-22-update' / 'index.html'
          now = datetime.now(timezone.utc).replace(microsecond=0)
          stamp = now.isoformat()
          pubdate = now.strftime('%a, %d %b %Y %H:%M:%S GMT')
          article_hash = hashlib.sha256(article_path.read_bytes()).hexdigest()
          fingerprint = hashlib.sha256(b'com.fouadraheb.watusi3|1.3.22|2026-08-24').hexdigest()
          entry = {
            'article_sha256': article_hash,
            'candidate_fingerprint': fingerprint,
            'category': {'id': 'tweaks', 'label': 'Tweaks'},
            'description': 'Watusi 3 1.3.22 adds WhatsApp 26.32.x support and fixes media picking crashes, status tools, custom tones, long-video splitting and other compatibility regressions.',
            'entry_type': 'source-news',
            'href': 'watusi-3-1-3-22-update/',
            'image': 'https://fouadraheb.com/images/screenshots/watusi/s1.png',
            'media_credit': 'Fouad Raheb official Watusi 3 screenshot',
            'media_source_url': 'https://fouadraheb.com/apps/watusi3/screenshots',
            'modified_at': stamp,
            'name': 'Watusi 3',
            'package': 'com.fouadraheb.watusi3',
            'published_at': stamp,
            'selection_pool': 'source-news',
            'source_name': 'Fouad Raheb',
            'source_page_url': 'https://fouadraheb.com/apt/package/com.fouadraheb.watusi3',
            'source_url': 'https://fouadraheb.com/apt/package/com.fouadraheb.watusi3/changelogs',
            'source_visual_url': 'https://fouadraheb.com/images/screenshots/watusi/s1.png',
            'title': 'Watusi 3 1.3.22 Fixes WhatsApp 26.32.x Compatibility Issues',
            'version': '1.3.22'
          }
          index_path = root / 'automation' / 'published-articles.json'
          data = json.loads(index_path.read_text(encoding='utf-8'))
          entries = data.get('entries', [])
          entries = [e for e in entries if e.get('package') != entry['package'] and e.get('href') != entry['href']]
          data['entries'] = [entry] + entries
          index_path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          feed_path = root / 'feed.xml'
          feed = feed_path.read_text(encoding='utf-8')
          item = f'''    <item>\n      <title>Watusi 3 1.3.22 Fixes WhatsApp 26.32.x Compatibility Issues</title>\n      <link>https://nextjailbreak.com/watusi-3-1-3-22-update/</link>\n      <guid isPermaLink="true">https://nextjailbreak.com/watusi-3-1-3-22-update/</guid>\n      <pubDate>{pubdate}</pubDate>\n      <description>Watusi 3 1.3.22 adds WhatsApp 26.32.x support and fixes media picking crashes, status tools, custom tones, long-video splitting and other compatibility regressions.</description>\n      <category>Tweaks</category>\n    </item>\n'''
          feed = re.sub(r'\s*<item>\s*<title>Watusi 3 1\.3\.22.*?</item>\s*', '\n', feed, flags=re.S)
          feed = feed.replace('    <language>en</language>\n', '    <language>en</language>\n' + item, 1)
          feed_path.write_text(feed, encoding='utf-8')

          sitemap_path = root / 'sitemap.xml'
          sitemap = sitemap_path.read_text(encoding='utf-8')
          sitemap = re.sub(r'\s*<url>\s*<loc>https://nextjailbreak\.com/watusi-3-1-3-22-update/</loc>.*?</url>\s*', '\n', sitemap, flags=re.S)
          block = f'''  <url>\n    <loc>https://nextjailbreak.com/watusi-3-1-3-22-update/</loc>\n    <lastmod>{now.date().isoformat()}</lastmod>\n    <changefreq>monthly</changefreq>\n    <priority>0.8</priority>\n  </url>\n'''
          sitemap = sitemap.replace('</urlset>', block + '</urlset>')
          sitemap_path.write_text(sitemap, encoding='utf-8')
          PY

      - name: Commit indexed article
        run: |
          git config user.name "nextsolution-publisher[bot]"
          git config user.email "nextsolution-publisher[bot]@users.noreply.github.com"
          git add automation/published-articles.json feed.xml sitemap.xml
          git rm .github/workflows/index-watusi-1-3-22-manual.yml
          git commit -m "Publish Watusi 3 1.3.22 to live article feeds"
          git push origin HEAD:main
