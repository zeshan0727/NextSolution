name: Build Next Ledger 1.3.75 SMS AI + Modern UI
permissions:
  contents: write
concurrency:
  group: next-ledger-1-3-75-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-next-ledger-1.3.75.yml"
      - "scripts/apply_next_ledger_1_3_75.sh"
      - "scripts/fix_sms_ai_modern_ui_1_3_75.py"
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply 1.3.75
        run: bash scripts/apply_next_ledger_1_3_75.sh

      - name: Validate SMS AI controls and modern UI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          python3 -m py_compile scripts/fix_sms_ai_modern_ui_1_3_75.py
          grep -Fq 'MARKETING_VERSION: "1.3.75"' project.yml
          grep -Fq 'CURRENT_PROJECT_VERSION: "83"' project.yml
          grep -Fq 'ModernAISettingsView()' DailyLedger/Views/SettingsView.swift
          grep -Fq 'private struct ModernAISettingsView' DailyLedger/Views/SettingsView.swift
          grep -Fq 'Next Ledger AI' DailyLedger/Views/SettingsView.swift
          grep -Fq 'SMSImportConsoleView()' DailyLedger/Views/SettingsView.swift
          grep -Fq 'VendorRulesView()' DailyLedger/Views/SettingsView.swift
          grep -Fq 'LabeledContent("Version", value: "1.3.75")' DailyLedger/Views/SettingsView.swift
          if grep -Fq 'SettingsSectionPage(title: "Automatic Bank SMS")' DailyLedger/Views/SettingsView.swift; then
            echo 'Automatic Bank SMS still has an intermediate page' >&2
            exit 1
          fi
          if grep -Fq 'SettingsSectionPage(title: "Vendor Rules")' DailyLedger/Views/SettingsView.swift; then
            echo 'Vendor Rules still has an intermediate page' >&2
            exit 1
          fi
          if grep -Fq 'DeveloperLabView()' DailyLedger/Views/SettingsView.swift; then
            echo 'Developer Lab is visible in Settings' >&2
            exit 1
          fi
          if grep -Fq 'ERPAccountingCenterView()' DailyLedger/Views/SettingsView.swift; then
            echo 'ERP Accounting Center is visible in Settings' >&2
            exit 1
          fi
          grep -Fq 'static func clearAllCachedResults()' DailyLedger/Services/SMSAIRecognitionService.swift
          grep -Fq 'Clear AI Helper Results' DailyLedger/Views/SMSImportConsoleView.swift
          grep -Fq 'Clear SMS AI Results' DailyLedger/Views/SMSLatest15ReviewView.swift
          grep -Fq 'aiVisibleLimit = 10' DailyLedger/Views/SMSLatest15ReviewView.swift
          grep -Fq 'Load 10 More for AI' DailyLedger/Views/SMSLatest15ReviewView.swift
          grep -Fq 'let batch = aiBatchCandidates' DailyLedger/Views/SMSLatest15ReviewView.swift
          grep -Fq '!aiWindowIDs.contains(item.id)' DailyLedger/Views/SMSLatest15ReviewView.swift
          grep -Fq 'Collect Latest 15 Messages' DailyLedger/Views/SMSImportConsoleView.swift
          grep -Fq 'Clear Fetched Data' DailyLedger/Services/AITransactionContextService.swift

      - run: brew install xcodegen
      - run: xcodegen generate

      - name: Build iPhone app
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project DailyLedger.xcodeproj -scheme DailyLedger -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build/xcodebuild.log

      - name: Package TIPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          rm -rf Payload && mkdir Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload NextLedger-1.3.75-sms-ai-modern-ui.tipa
          shasum -a 256 NextLedger-1.3.75-sms-ai-modern-ui.tipa > NextLedger-1.3.75-sms-ai-modern-ui.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: NextLedger-1.3.75-SMS-AI-Modern-UI
          path: |
            NextLedger-1.3.75-sms-ai-modern-ui.tipa
            NextLedger-1.3.75-sms-ai-modern-ui.sha256
          if-no-files-found: error

      - name: Capture diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p build
          grep -E 'error:|fatal error:|BUILD FAILED|SwiftCompile|Traceback|RuntimeError' build/xcodebuild.log > build/next-ledger-1.3.75-errors.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: NextLedger-1.3.75-Diagnostics
          path: |
            build/xcodebuild.log
            build/next-ledger-1.3.75-errors.txt
          if-no-files-found: warn

      - name: Publish status
        if: always()
        shell: bash
        run: |
          STATUS="${{ job.status }}"
          git reset --hard HEAD
          git clean -fd
          git fetch origin "$GITHUB_REF_NAME"
          git checkout -B build-status "origin/$GITHUB_REF_NAME"
          mkdir -p .build-status
          cat > .build-status/next-ledger-1.3.75.json <<EOF
          {"status":"${STATUS}","run_id":"${GITHUB_RUN_ID}","source_sha":"${GITHUB_SHA}","app_version":"1.3.75","app_build":"83","artifact_name":"NextLedger-1.3.75-SMS-AI-Modern-UI"}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .build-status/next-ledger-1.3.75.json
          git commit -m "Record Next Ledger 1.3.75 build status" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
