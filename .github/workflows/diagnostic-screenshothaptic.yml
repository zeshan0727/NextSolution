name: Diagnostic Build Screenshot Haptic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnostic-screenshothaptic.yml"
      - "ReleaseTriggers/screenshothaptic-diagnostic.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diagnostic-screenshothaptic
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Install tools
        run: brew install dpkg ldid
      - name: Source and deterministic checks
        shell: bash
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/2026-08-11-ScreenshotHaptic"
          python3 "$P/tests/test_runtime_logic.py"
          grep -q '^Package: com.nextsolution.screenshothaptic$' "$P/control"
          grep -q '^Architecture: iphoneos-arm64$' "$P/control"
          grep -q '^ARCHS = arm64 arm64e$' "$P/Makefile"
          grep -q '^TARGET = iphone:clang:latest:15.0$' "$P/Makefile"
          grep -q 'segalign,4000' "$P/Makefile"
          grep -q 'com.apple.springboard' "$P/ScreenshotHaptic.plist"
          grep -q 'UIApplicationUserDidTakeScreenshotNotification' "$P/Tweak.xm"
          grep -q 'SSHScreenshotObserver =' "$P/Tweak.xm"
          grep -q 'Enable Screenshot Haptic' "$P/Preferences/Resources/Root.plist"
          test "$(grep -c 'PSSwitchCell' "$P/Preferences/Resources/Root.plist")" -eq 1
          ! grep -Eq 'Test|Diagnostic|PID|Hook|Runtime|Class|Selector' "$P/Preferences/Resources/Root.plist"
          plutil -lint "$P/Preferences/Resources/Root.plist"
          plutil -lint "$P/Preferences/Resources/Info.plist"
          plutil -lint "$P/layout/Library/PreferenceLoader/Preferences/ScreenshotHaptic.plist"
          ! grep -R -q 'zeshan0727.github.io' "$P" depictions/screenshothaptic.html
      - name: Build rootless
        shell: bash
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/2026-08-11-ScreenshotHaptic"; O="$RUNNER_TEMP/ssh-diagnostic"; L="$RUNNER_TEMP/ssh-logs"; mkdir -p "$O" "$L"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos-rootless" > "$L/rootless-bootstrap.log" 2>&1
          export THEOS="$RUNNER_TEMP/theos-rootless" THEOS_PACKAGE_SCHEME=rootless
          rm -rf "$P/packages"; make -C "$P" clean package FINALPACKAGE=1 2>&1 | tee "$L/rootless-build.log"
          D="$(find "$P/packages" -type f -name '*_iphoneos-arm64.deb' -print -quit)"; test -n "$D"; cp "$D" "$O/ScreenshotHaptic_1.0.0_Rootless.deb"
      - name: Build RootHide
        shell: bash
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/2026-08-11-ScreenshotHaptic"; O="$RUNNER_TEMP/ssh-diagnostic"; L="$RUNNER_TEMP/ssh-logs"
          git checkout -- "$P/control"
          git init "$RUNNER_TEMP/theos-roothide" > "$L/roothide-bootstrap.log" 2>&1
          git -C "$RUNNER_TEMP/theos-roothide" remote add origin https://github.com/roothide/theos.git >> "$L/roothide-bootstrap.log" 2>&1
          git -C "$RUNNER_TEMP/theos-roothide" fetch --depth 1 origin 88506b2c22e9e07dd4ed055f23c9e398a117a2c7 >> "$L/roothide-bootstrap.log" 2>&1
          git -C "$RUNNER_TEMP/theos-roothide" checkout --detach 88506b2c22e9e07dd4ed055f23c9e398a117a2c7 >> "$L/roothide-bootstrap.log" 2>&1
          git -C "$RUNNER_TEMP/theos-roothide" submodule update --init --recursive --depth 1 >> "$L/roothide-bootstrap.log" 2>&1
          sed -i '' 's/^Architecture: iphoneos-arm64$/Architecture: iphoneos-arm64e/' "$P/control"
          export THEOS="$RUNNER_TEMP/theos-roothide" THEOS_PACKAGE_SCHEME=roothide
          rm -rf "$P/packages"; make -C "$P" clean package FINALPACKAGE=1 2>&1 | tee "$L/roothide-build.log"
          D="$(find "$P/packages" -type f -name '*_iphoneos-arm64e.deb' -print -quit)"; test -n "$D"; cp "$D" "$O/ScreenshotHaptic_1.0.0_RootHide.deb"
          git checkout -- "$P/control"
      - name: Inspect built packages
        shell: bash
        run: |
          set -euo pipefail
          O="$RUNNER_TEMP/ssh-diagnostic"
          check(){ D="$1"; A="$2"; X="$(mktemp -d)"; test "$(dpkg-deb -f "$D" Package)" = com.nextsolution.screenshothaptic; test "$(dpkg-deb -f "$D" Version)" = 1.0.0; test "$(dpkg-deb -f "$D" Architecture)" = "$A"; dpkg-deb -f "$D" Depends | grep -q 'firmware (>= 15.0)'; dpkg-deb -x "$D" "$X"; F="$(find "$X" -path '*MobileSubstrate/DynamicLibraries/ScreenshotHaptic.plist' -print -quit)"; R="$(find "$X" -path '*ScreenshotHapticPreferences.bundle/Root.plist' -print -quit)"; E="$(find "$X" -path '*PreferenceLoader/Preferences/ScreenshotHaptic.plist' -print -quit)"; Y="$(find "$X" -name ScreenshotHaptic.dylib -print -quit)"; test -n "$F"; test -n "$R"; test -n "$E"; test -s "$Y"; grep -q 'com.apple.springboard' "$F"; grep -q 'Enable Screenshot Haptic' "$R"; grep -a -q UIApplicationUserDidTakeScreenshotNotification "$Y"; grep -a -q UINotificationFeedbackGenerator "$Y"; rm -rf "$X"; }
          check "$O/ScreenshotHaptic_1.0.0_Rootless.deb" iphoneos-arm64
          check "$O/ScreenshotHaptic_1.0.0_RootHide.deb" iphoneos-arm64e
      - name: Record PASS diagnostic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Diagnostics
          cat > Diagnostics/2026-08-11-screenshothaptic-build.txt <<'EOF'
          Screenshot Haptic 1.0.0 diagnostic compiler
          BUILD VALIDATION PASS
          Deterministic runtime checks: PASS
          Rootless package build and inspection: PASS
          RootHide package build and inspection: PASS
          Runtime status: build-validated; awaiting physical-device test
          EOF
          git config user.name 'Next Solution Build Bot'; git config user.email 'actions@users.noreply.github.com'
          git add Diagnostics/2026-08-11-screenshothaptic-build.txt
          git commit -m 'Record Screenshot Haptic compiler diagnostic (PASS)'
          git pull --rebase origin main
          git push origin HEAD:main
