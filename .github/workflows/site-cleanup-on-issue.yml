name: One-time site cleanup on issue

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.issue.title == 'Run site cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix navigation and scrolling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          improvement_css = r'''

    /* Next Solution navigation and scrolling improvements */
    html {
      scroll-behavior: smooth;
      scroll-padding-top: 96px;
      scrollbar-gutter: stable;
    }

    body {
      overflow-x: clip;
      -webkit-overflow-scrolling: touch;
    }

    header {
      position: sticky !important;
      top: 0;
      z-index: 3000;
    }

    nav {
      flex-wrap: nowrap !important;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    nav::-webkit-scrollbar { display: none; }

    nav a {
      flex: 0 0 auto;
      white-space: nowrap;
      touch-action: manipulation;
    }

    section { scroll-margin-top: 96px; }

    .back-to-top {
      visibility: hidden;
      pointer-events: none;
    }

    .back-to-top.visible {
      visibility: visible;
      pointer-events: auto;
    }

    a:focus-visible,
    button:focus-visible {
      outline: 3px solid var(--accent-color);
      outline-offset: 3px;
    }

    @media (max-width: 768px) {
      header {
        align-items: stretch;
        padding-left: max(1rem, env(safe-area-inset-left));
        padding-right: max(1rem, env(safe-area-inset-right));
      }

      nav {
        width: 100%;
        justify-content: flex-start;
      }

      .particles { display: none; }
    }

    @media (hover: none) {
      nav a:hover,
      .content-card:hover,
      .video-item:hover {
        transform: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
          '''

          def remove_obsolete_nav_links(text: str) -> str:
              return re.sub(
                  r'\s*<a\b(?=[^>]*\bhref=["\'](?:\./)?(?:downloads|Mega|uploads)(?:\.html)?(?:[?#][^"\']*)?["\'])[^>]*>.*?</a>',
                  '',
                  text,
                  flags=re.IGNORECASE | re.DOTALL,
              )

          def repair_links(text: str) -> str:
              text = remove_obsolete_nav_links(text)
              text = re.sub(
                  r'(<a\b[^>]*\bhref=["\'])(?:#tutorials|tutorials(?:\.html)?)(["\'][^>]*>\s*Tutorials\s*</a>)',
                  r'\1tutorials.html\2',
                  text,
                  flags=re.IGNORECASE,
              )
              text = re.sub(
                  r'(<a\b[^>]*\bhref=["\'])#tutorials(["\'][^>]*>\s*Explore Tutorials\s*</a>)',
                  r'\1tutorials.html\2',
                  text,
                  flags=re.IGNORECASE,
              )
              text = re.sub(
                  r'(<a\b[^>]*\bhref=["\'])videos(["\'])',
                  r'\1videos.html\2',
                  text,
                  flags=re.IGNORECASE,
              )
              text = re.sub(
                  r'(<a\b[^>]*\bhref=["\'])faq(["\'][^>]*>\s*FAQ\s*</a>)',
                  r'\1./#faq\2',
                  text,
                  flags=re.IGNORECASE,
              )
              text = text.replace('https://www.nextsolution.app', 'https://nextsolution.cc')
              text = text.replace('https://nextsolution.app', 'https://nextsolution.cc')
              return text

          def inject_css(text: str) -> str:
              if 'Next Solution navigation and scrolling improvements' in text:
                  return text
              if '</style>' not in text:
                  return text
              head, tail = text.rsplit('</style>', 1)
              return head + improvement_css + '\n  </style>' + tail

          old_scroll = re.compile(
              r"window\.addEventListener\('scroll', \(\) => \{\s*"
              r"if \(window\.pageYOffset > 300\) \{\s*"
              r"backToTop\.classList\.add\('visible'\);\s*"
              r"\} else \{\s*"
              r"backToTop\.classList\.remove\('visible'\);\s*"
              r"\}\s*\}\);",
              re.DOTALL,
          )

          new_scroll = """let scrollTicking = false;
    window.addEventListener('scroll', () => {
      if (scrollTicking) return;
      scrollTicking = true;
      window.requestAnimationFrame(() => {
        backToTop.classList.toggle('visible', window.scrollY > 300);
        scrollTicking = false;
      });
    }, { passive: true });"""

          for page in Path('.').glob('*.html'):
              text = page.read_text(encoding='utf-8', errors='ignore')
              updated = repair_links(text)

              if page.name == 'index.html':
                  updated = re.sub(
                      r'\s*<div class="badge">\s*<i class="fas fa-download"></i>\s*<span>Download Resources</span>\s*</div>',
                      '',
                      updated,
                      flags=re.IGNORECASE | re.DOTALL,
                  )
                  updated = re.sub(
                      r'\s*<div class="content-card">\s*<h3>Resources\s*&(?:amp;)?\s*Downloads</h3>.*?</div>',
                      '',
                      updated,
                      flags=re.IGNORECASE | re.DOTALL,
                  )
                  updated = updated.replace(
                      'Free step-by-step guides, video tutorials, and resources for iPhone customization and jailbreaking',
                      'Free step-by-step guides and video tutorials for iPhone customization and jailbreaking',
                  )
                  updated = updated.replace('Free Jailbreak Tutorials & Resources', 'Free Jailbreak Tutorials & Guides')

              if page.name in {'index.html', 'videos.html'}:
                  updated = inject_css(updated)
                  updated = old_scroll.sub(new_scroll, updated)
                  updated = updated.replace(
                      '<a href="#" class="back-to-top" id="backToTop">',
                      '<a href="#" class="back-to-top" id="backToTop" aria-label="Back to top">',
                  )
                  updated = updated.replace(
                      'const particleCount = 15;',
                      "const particleCount = window.matchMedia('(max-width: 768px), (prefers-reduced-motion: reduce)').matches ? 0 : 8;",
                  )
                  updated = updated.replace(
                      '<iframe src="https://www.youtube.com/embed/${videoId}"',
                      '<iframe loading="lazy" src="https://www.youtube.com/embed/${videoId}"',
                  )

              if page.name == 'videos.html':
                  updated = updated.replace('&copy; 2025 Next Solution', '&copy; 2026 Next Solution')
                  updated = updated.replace('Free Jailbreak Tutorials & Resources', 'Free Jailbreak Tutorials & Guides')

              if updated != text:
                  page.write_text(updated, encoding='utf-8')

          for obsolete in ('downloads.html', 'Mega.html', 'mega.html', 'uploads.html'):
              Path(obsolete).unlink(missing_ok=True)

          for workflow in (
              '.github/workflows/site-cleanup-on-issue.yml',
              '.github/workflows/site-navigation-cleanup.yml',
              '.github/workflows/fix-site-navigation.yml',
          ):
              Path(workflow).unlink(missing_ok=True)
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi
          git commit -m "Fix tutorials navigation and improve scrolling"
          git push origin main
