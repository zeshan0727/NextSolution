name: Temporary Next Signer R2 Host Fix

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  fix:
    if: github.event.issue.title == '[NEXTSIGNER-R2-HOST-FIX]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Replace unresolved R2 public hostname
        shell: bash
        run: |
          set -euo pipefail
          files=(
            .github/workflows/nextsigner-sign-publish.yml
            .github/workflows/nextsigner-publish-only.yml
            .github/workflows/nextsigner-library-manage.yml
            .github/workflows/migrate-private-apps-to-r2.yml
            .github/workflows/publish-nextsigner-transfer.yml
          )
          for file in "${files[@]}"; do
            [ -f "$file" ] || continue
            sed -i 's#https://files\.nextjailbreak\.com#https://files.nextsolution.cc#g' "$file"
          done
          grep -R "R2_PUBLIC_BASE: https://files.nextsolution.cc" .github/workflows/nextsigner-sign-publish.yml .github/workflows/nextsigner-publish-only.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/nextsigner-sign-publish.yml .github/workflows/nextsigner-publish-only.yml .github/workflows/nextsigner-library-manage.yml .github/workflows/migrate-private-apps-to-r2.yml .github/workflows/publish-nextsigner-transfer.yml
          if git diff --cached --quiet; then
            echo 'No R2 host changes needed'
          else
            git commit -m 'Fix Next Signer R2 public hostname'
            git push origin HEAD:main
          fi
      - name: Report
        shell: bash
        run: gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body 'NEXTSIGNER_R2_HOST_FIXED files.nextsolution.cc'
