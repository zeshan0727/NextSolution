name: Build Module Glass 1.1.13 Non-Destructive Transition
on:
  push:
    branches: [build/moduleglass-1.1.13-nondestructive-transition]
    paths:
      - '.moduleglass-build/moduleglass-1.1.13-runtime.tar.gz'
      - '.github/workflows/moduleglass-1.1.13-nondestructive-transition.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 25
    env:
      THEOS: ${{ github.workspace }}/theos
      THEOS_PACKAGE_SCHEME: roothide
    steps:
      - uses: actions/checkout@v4
      - name: Verify and extract source
        shell: bash
        run: |
          set -euo pipefail
          echo 'ff19f20d5d4ecf6297b2bdeacc4a5e3bd93be7f9d98df5f07e57c20fcc7b7623  .moduleglass-build/moduleglass-1.1.13-runtime.tar.gz' | shasum -a 256 -c -
          mkdir -p buildsrc
          tar -xzf .moduleglass-build/moduleglass-1.1.13-runtime.tar.gz -C buildsrc
          grep -q 'Version: 1.1.13' buildsrc/Runtime/control
          grep -q 'Non-Destructive Transition Renderer' buildsrc/Runtime/Tweak.m
          grep -q 'transition-suspend-nondestructive' buildsrc/Runtime/Tweak.m
          mkdir -p output/source-stage
          cp -R buildsrc/Runtime output/source-stage/ModuleGlass-1.1.13-Complete-Source
          ditto -c -k --sequesterRsrc --keepParent output/source-stage/ModuleGlass-1.1.13-Complete-Source output/ModuleGlass_1.1.13_Complete_Source.zip
      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail
          brew install dpkg ldid xz
          mkdir -p "$THEOS"
          curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos -o /tmp/install-theos
          bash /tmp/install-theos
          mkdir -p "$THEOS/sdks"
          if ! ls "$THEOS"/sdks/iPhoneOS*.sdk >/dev/null 2>&1; then
            curl -fL https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz -o /tmp/sdk.tar.xz
            tar -xJf /tmp/sdk.tar.xz -C "$THEOS/sdks"
          fi
      - name: Build RootHide package
        shell: bash
        run: |
          set -euxo pipefail
          cd buildsrc/Runtime
          make clean
          make package FINALPACKAGE=1
          DEB="$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$DEB"
          cp "$DEB" "${{ github.workspace }}/output/ModuleGlass_1.1.13_NonDestructiveTransition_RootHide.deb"
      - name: Verify package
        shell: bash
        run: |
          set -euo pipefail
          DEB=output/ModuleGlass_1.1.13_NonDestructiveTransition_RootHide.deb
          test "$(dpkg-deb -f "$DEB" Version)" = '1.1.13'
          test "$(dpkg-deb -f "$DEB" Architecture)" = 'iphoneos-arm64e'
          test "$(dpkg-deb -f "$DEB" Package)" = 'com.nextsolution.nextaura.cc-module-backgrounds'
          rm -rf verify && mkdir -p verify
          dpkg-deb -x "$DEB" verify
          DYLIB="$(find verify -type f -name CCModuleBackgrounds.dylib -print -quit)"
          PLIST="$(find verify -type f -name CCModuleBackgrounds.plist -print -quit)"
          ARCHS="$(lipo -archs "$DYLIB")"
          [[ " $ARCHS " == *' arm64 '* ]]
          [[ " $ARCHS " == *' arm64e '* ]]
          otool -L "$DYLIB" > output/otool.txt
          grep -Fq '@loader_path/.jbroot/' output/otool.txt
          strings "$DYLIB" > output/dylib.strings
          grep -Fq 'ModuleGlassRuntime 1.1.13 Non-Destructive Transition Renderer' output/dylib.strings
          grep -Fq 'transition-suspend-nondestructive' output/dylib.strings
          grep -Fq SpringBoard "$PLIST"
          shasum -a 256 "$DEB" output/ModuleGlass_1.1.13_Complete_Source.zip > output/SHA256SUMS.txt
          cat output/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ModuleGlass-1.1.13-Non-Destructive-Transition-Test
          path: |
            output/ModuleGlass_1.1.13_NonDestructiveTransition_RootHide.deb
            output/ModuleGlass_1.1.13_Complete_Source.zip
            output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
