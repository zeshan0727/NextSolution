name: One-time site navigation fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-site-navigation.yml'

permissions:
  contents: write

jobs:
  fix-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix website navigation and scrolling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          css = '''

    /* Next Solution navigation and scrolling improvements */
    html {
      scroll-behavior: smooth;
      scroll-padding-top: 96px;
      scrollbar-gutter: stable;
    }
    body {
      overflow-x: clip;
      -webkit-overflow-scrolling: touch;
    }
    header {
      position: sticky !important;
      top: 0;
      z-index: 3000;
    }
    nav {
      flex-wrap: nowrap !important;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    nav::-webkit-scrollbar { display: none; }
    nav a {
      flex: 0 0 auto;
      white-space: nowrap;
      touch-action: manipulation;
    }
    section { scroll-margin-top: 96px; }
    .back-to-top { visibility: hidden; pointer-events: none; }
    .back-to-top.visible { visibility: visible; pointer-events: auto; }
    a:focus-visible, button:focus-visible {
      outline: 3px solid var(--accent-color);
      outline-offset: 3px;
    }
    @media (max-width: 768px) {
      header {
        align-items: stretch;
        padding-left: max(1rem, env(safe-area-inset-left));
        padding-right: max(1rem, env(safe-area-inset-right));
      }
      nav { width: 100%; justify-content: flex-start; }
      .particles { display: none; }
    }
    @media (hover: none) {
      nav a:hover, .content-card:hover, .video-item:hover { transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }
          '''

          def remove_page_links(text):
              pattern = re.compile(
                  r'\s*<a\b(?=[^>]*\bhref=["\'](?:\./)?(?:downloads|Mega|uploads)(?:\.html)?["\'])[^>]*>.*?</a>',
                  re.IGNORECASE | re.DOTALL,
              )
              return pattern.sub('', text)

          def common_fixes(text):
              text = remove_page_links(text)
              text = re.sub(
                  r'(<a\b[^>]*\bhref=["\'])(?:#tutorials|tutorials(?:\.html)?)(["\'][^>]*>\s*Tutorials\s*</a>)',
                  r'\1tutorials.html\2', text, flags=re.IGNORECASE,
              )
              text = re.sub(
                  r'(<a\b[^>]*\bhref=["\'])#tutorials(["\'][^>]*>\s*Explore Tutorials\s*</a>)',
                  r'\1tutorials.html\2', text, flags=re.IGNORECASE,
              )
              text = re.sub(
                  r'(<a\b[^>]*\bhref=["\'])videos(["\'])',
                  r'\1videos.html\2', text, flags=re.IGNORECASE,
              )
              text = re.sub(
                  r'(<a\b[^>]*\bhref=["\'])faq(["\'][^>]*>\s*FAQ\s*</a>)',
                  r'\1./#faq\2', text, flags=re.IGNORECASE,
              )
              text = text.replace('https://www.nextsolution.app', 'https://nextsolution.cc')
              text = text.replace('https://nextsolution.app', 'https://nextsolution.cc')
              return text

          def add_scroll_css(text):
              if 'Next Solution navigation and scrolling improvements' in text:
                  return text
              if '</style>' not in text:
                  return text
              before, after = text.rsplit('</style>', 1)
              return before + css + '\n  </style>' + after

          scroll_old = re.compile(
              r"window\.addEventListener\('scroll', \(\) => \{\s*if \(window\.pageYOffset > 300\) \{\s*backToTop\.classList\.add\('visible'\);\s*\} else \{\s*backToTop\.classList\.remove\('visible'\);\s*\}\s*\}\);",
              re.DOTALL,
          )
          scroll_new = """let scrollTicking = false;
    window.addEventListener('scroll', () => {
      if (scrollTicking) return;
      scrollTicking = true;
      window.requestAnimationFrame(() => {
        backToTop.classList.toggle('visible', window.scrollY > 300);
        scrollTicking = false;
      });
    }, { passive: true });"""

          for page in Path('.').glob('*.html'):
              text = page.read_text(encoding='utf-8', errors='ignore')
              updated = common_fixes(text)

              if page.name == 'index.html':
                  updated = re.sub(
                      r'\s*<div class="badge">\s*<i class="fas fa-download"></i>\s*<span>Download Resources</span>\s*</div>',
                      '', updated, flags=re.IGNORECASE | re.DOTALL,
                  )
                  updated = re.sub(
                      r'\s*<div class="content-card">\s*<h3>Resources\s*&(?:amp;)?\s*Downloads</h3>.*?</div>',
                      '', updated, flags=re.IGNORECASE | re.DOTALL,
                  )
                  updated = updated.replace(
                      'Free step-by-step guides, video tutorials, and resources for iPhone customization and jailbreaking',
                      'Free step-by-step guides and video tutorials for iPhone customization and jailbreaking',
                  )
                  updated = updated.replace('Free Jailbreak Tutorials & Resources', 'Free Jailbreak Tutorials & Guides')

              if page.name in ('index.html', 'videos.html'):
                  updated = add_scroll_css(updated)
                  updated = scroll_old.sub(scroll_new, updated)
                  updated = updated.replace(
                      '<a href="#" class="back-to-top" id="backToTop">',
                      '<a href="#" class="back-to-top" id="backToTop" aria-label="Back to top">',
                  )
                  updated = updated.replace(
                      'const particleCount = 15;',
                      "const particleCount = window.matchMedia('(max-width: 768px), (prefers-reduced-motion: reduce)').matches ? 0 : 8;",
                  )
                  updated = updated.replace(
                      '<iframe src="https://www.youtube.com/embed/${videoId}"',
                      '<iframe loading="lazy" src="https://www.youtube.com/embed/${videoId}"',
                  )

              if page.name == 'videos.html':
                  updated = updated.replace('&copy; 2025 Next Solution', '&copy; 2026 Next Solution')
                  updated = updated.replace('Free Jailbreak Tutorials & Resources', 'Free Jailbreak Tutorials & Guides')

              if updated != text:
                  page.write_text(updated, encoding='utf-8')

          for workflow in (
              Path('.github/workflows/fix-site-navigation.yml'),
              Path('.github/workflows/site-navigation-cleanup.yml'),
          ):
              workflow.unlink(missing_ok=True)
          PY

      - name: Commit website improvements
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi
          git commit -m "Fix tutorials navigation and improve scrolling"
          git push origin main
