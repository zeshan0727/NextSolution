name: Build Next Ledger 1.3.58 SMS AI Loop Fix

permissions:
  contents: write

concurrency:
  group: next-ledger-1-3-58-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - "DailyLedger/**"
      - "scripts/**"
      - "project.yml"
      - ".github/workflows/build-next-ledger-1.3.58.yml"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Next Ledger patches
        run: bash scripts/apply_next_ledger_1_3_58.sh

      - name: Install build tools
        run: brew install xcodegen

      - name: Validate loop fix
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'MARKETING_VERSION: "1.3.58"' project.yml
          grep -Fq 'CURRENT_PROJECT_VERSION: "66"' project.yml
          grep -Fq 'SMSOpenAIWorkerStatusV2' DailyLedger/Services/SMSAIRecognitionService.swift
          grep -Fq 'Paused · AI failed 3 times. Tap Retry AI Recovery.' DailyLedger/Services/SMSAIRecognitionService.swift
          grep -Fq 'func retryPending() async' DailyLedger/Services/SMSAIRecognitionService.swift
          grep -Fq 'Label("Retry AI Recovery", systemImage: "arrow.clockwise.circle.fill")' DailyLedger/Views/SMSImportConsoleView.swift
          grep -Fq 'Idle · No unresolved SMS' DailyLedger/Services/SMSAIRecognitionService.swift
          if grep -Fq 'while !Task.isCancelled' DailyLedger/DailyLedgerApp.swift; then
            echo 'ERROR: permanent AI polling loop still present'
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          text = Path('DailyLedger/Views/SMSImportConsoleView.swift').read_text()
          count = text.count('startAIRecognitionIfNeeded()')
          if count != 1:
              raise SystemExit(f'Expected only function definition and no refresh invocation; found {count} occurrences')
          print('Console auto-loop removed; only definition remains.')
          PY

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iPhone app
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project DailyLedger.xcodeproj \
            -scheme DailyLedger \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build/xcodebuild.log

      - name: Package Next Ledger 1.3.58 TIPA
        run: |
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload NextLedger-1.3.58-sms-ai-loop-fix.tipa
          shasum -a 256 NextLedger-1.3.58-sms-ai-loop-fix.tipa > NextLedger-1.3.58-sms-ai-loop-fix.sha256

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: NextLedger-1.3.58-SMS-AI-Loop-Fix
          path: |
            NextLedger-1.3.58-sms-ai-loop-fix.tipa
            NextLedger-1.3.58-sms-ai-loop-fix.sha256
          if-no-files-found: error

      - name: Capture diagnostics
        if: failure()
        run: |
          mkdir -p build
          { test -f build/xcodebuild.log && grep -E "error:|fatal error:|SwiftCompile|BUILD FAILED" build/xcodebuild.log || true; } > build/next-ledger-1.3.58-errors.txt

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NextLedger-1.3.58-Diagnostics
          path: build/next-ledger-1.3.58-errors.txt
          if-no-files-found: warn

      - name: Publish build status
        if: always()
        shell: bash
        run: |
          STATUS="${{ job.status }}"
          git reset --hard HEAD
          git clean -fd
          git fetch origin "$GITHUB_REF_NAME"
          git checkout -B build-status "origin/$GITHUB_REF_NAME"
          mkdir -p .build-status
          cat > .build-status/next-ledger-1.3.58.json <<EOF
          {
            "status": "${STATUS}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_number": "${GITHUB_RUN_NUMBER}",
            "source_sha": "${GITHUB_SHA}",
            "app_version": "1.3.58",
            "app_build": "66",
            "daemon_version": "2.2.0",
            "artifact_name": "NextLedger-1.3.58-SMS-AI-Loop-Fix"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .build-status/next-ledger-1.3.58.json
          git commit -m "Record Next Ledger 1.3.58 build status" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
