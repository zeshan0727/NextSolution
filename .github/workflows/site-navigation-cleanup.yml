name: One-time website navigation cleanup

on:
  push:
    paths:
      - '.github/workflows/site-navigation-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean navigation and improve scrolling
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          def remove_local_page_anchor(text: str, page_names: list[str]) -> str:
              names = '|'.join(re.escape(name) for name in page_names)
              pattern = re.compile(
                  rf'\s*<a\b(?=[^>]*\bhref=["\'](?:\./)?(?:{names})(?:\.html)?(?:[?#][^"\']*)?["\'])[^>]*>.*?</a>',
                  re.IGNORECASE | re.DOTALL,
              )
              return pattern.sub('', text)

          def fix_common_links(text: str) -> str:
              text = remove_local_page_anchor(text, ['downloads', 'Mega', 'uploads'])

              # Send every Tutorials navigation item to the real tutorials page.
              text = re.sub(
                  r'(<a\b[^>]*\bhref=["\'])(?:#tutorials|tutorials(?:\.html)?)(["\'][^>]*>\s*Tutorials\s*</a>)',
                  r'\1tutorials.html\2',
                  text,
                  flags=re.IGNORECASE,
              )
              text = re.sub(
                  r'(<a\b[^>]*\bhref=["\'])#tutorials(["\'][^>]*>\s*Explore Tutorials\s*</a>)',
                  r'\1tutorials.html\2',
                  text,
                  flags=re.IGNORECASE,
              )

              # Repair common extensionless navigation routes.
              text = re.sub(
                  r'(<a\b[^>]*\bhref=["\'])videos(["\'])',
                  r'\1videos.html\2',
                  text,
                  flags=re.IGNORECASE,
              )
              text = re.sub(
                  r'(<a\b[^>]*\bhref=["\'])faq(["\'][^>]*>\s*FAQ\s*</a>)',
                  r'\1./#faq\2',
                  text,
                  flags=re.IGNORECASE,
              )

              # The new custom domain is now the primary/canonical address.
              text = text.replace('https://www.nextsolution.app', 'https://nextsolution.cc')
              text = text.replace('https://nextsolution.app', 'https://nextsolution.cc')
              return text

          perf_css = r'''

    /* Next Solution 2026 navigation and scroll improvements */
    html {
      scroll-behavior: smooth;
      scroll-padding-top: 96px;
      scrollbar-gutter: stable;
    }

    body {
      overflow-x: clip;
      -webkit-overflow-scrolling: touch;
    }

    header {
      position: sticky !important;
      top: 0;
      z-index: 3000;
    }

    nav {
      flex-wrap: nowrap !important;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    nav::-webkit-scrollbar { display: none; }

    nav a {
      flex: 0 0 auto;
      white-space: nowrap;
      touch-action: manipulation;
    }

    section { scroll-margin-top: 96px; }

    .back-to-top {
      visibility: hidden;
      pointer-events: none;
    }

    .back-to-top.visible {
      visibility: visible;
      pointer-events: auto;
    }

    a:focus-visible,
    button:focus-visible {
      outline: 3px solid var(--accent-color);
      outline-offset: 3px;
    }

    @media (max-width: 768px) {
      header {
        align-items: stretch;
        padding-left: max(1rem, env(safe-area-inset-left));
        padding-right: max(1rem, env(safe-area-inset-right));
      }

      nav {
        width: 100%;
        justify-content: flex-start;
      }

      .particles { display: none; }
    }

    @media (hover: none) {
      nav a:hover,
      .content-card:hover,
      .video-item:hover {
        transform: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
          '''

          def inject_performance_css(text: str) -> str:
              marker = 'Next Solution 2026 navigation and scroll improvements'
              if marker in text or '</style>' not in text:
                  return text
              before, after = text.rsplit('</style>', 1)
              return before + perf_css + '\n  </style>' + after

          scroll_pattern = re.compile(
              r"window\.addEventListener\('scroll', \(\) => \{\s*"
              r"if \(window\.pageYOffset > 300\) \{\s*"
              r"backToTop\.classList\.add\('visible'\);\s*"
              r"\} else \{\s*"
              r"backToTop\.classList\.remove\('visible'\);\s*"
              r"\}\s*\}\);",
              re.DOTALL,
          )

          scroll_replacement = """let scrollTicking = false;
    window.addEventListener('scroll', () => {
      if (scrollTicking) return;
      scrollTicking = true;
      window.requestAnimationFrame(() => {
        backToTop.classList.toggle('visible', window.scrollY > 300);
        scrollTicking = false;
      });
    }, { passive: true });"""

          for path in root.glob('*.html'):
              if path.name.lower() in {'downloads.html', 'mega.html', 'uploads.html'}:
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              updated = fix_common_links(text)

              if path.name == 'index.html':
                  # Remove homepage promotion blocks for the deleted Downloads page.
                  updated = re.sub(
                      r'\s*<div class="badge">\s*<i class="fas fa-download"></i>\s*<span>Download Resources</span>\s*</div>',
                      '',
                      updated,
                      flags=re.IGNORECASE | re.DOTALL,
                  )
                  updated = re.sub(
                      r'\s*<div class="content-card">\s*<h3>Resources\s*&amp;?\s*Downloads</h3>.*?</div>',
                      '',
                      updated,
                      flags=re.IGNORECASE | re.DOTALL,
                  )
                  updated = updated.replace(
                      'Free step-by-step guides, video tutorials, and resources for iPhone customization and jailbreaking',
                      'Free step-by-step guides and video tutorials for iPhone customization and jailbreaking',
                  )
                  updated = updated.replace('Free Jailbreak Tutorials & Resources', 'Free Jailbreak Tutorials & Guides')

              if path.name in {'index.html', 'videos.html'}:
                  updated = inject_performance_css(updated)
                  updated = scroll_pattern.sub(scroll_replacement, updated)
                  updated = updated.replace(
                      '<a href="#" class="back-to-top" id="backToTop">',
                      '<a href="#" class="back-to-top" id="backToTop" aria-label="Back to top">',
                  )
                  updated = updated.replace('const particleCount = 15;', "const particleCount = window.matchMedia('(max-width: 768px), (prefers-reduced-motion: reduce)').matches ? 0 : 8;")
                  updated = updated.replace('<iframe src="https://www.youtube.com/embed/${videoId}"', '<iframe loading="lazy" src="https://www.youtube.com/embed/${videoId}"')

              if path.name == 'videos.html':
                  updated = updated.replace('&copy; 2025 Next Solution', '&copy; 2026 Next Solution')
                  updated = updated.replace('Free Jailbreak Tutorials & Resources', 'Free Jailbreak Tutorials & Guides')

              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          tutorials_page = '''<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
            <meta name="theme-color" content="#6a11cb">
            <title>Jailbreak Tutorials | Next Solution</title>
            <meta name="description" content="Browse Next Solution's free iPhone jailbreak, rootless tweak, conversion, and battery guides.">
            <link rel="canonical" href="https://nextsolution.cc/tutorials.html">
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
            <style>
              :root {
                color-scheme: light dark;
                --primary: #6a11cb;
                --secondary: #2575fc;
                --accent: #00d2ff;
                --text: #202634;
                --muted: #667085;
                --surface: rgba(255,255,255,.92);
                --background: #f5f7fa;
                --border: rgba(37,117,252,.16);
                --gradient: linear-gradient(135deg, var(--primary), var(--secondary));
              }
              @media (prefers-color-scheme: dark) {
                :root {
                  --text: #f5f7ff;
                  --muted: #b7c0d5;
                  --surface: rgba(26,31,45,.92);
                  --background: #10131c;
                  --border: rgba(255,255,255,.12);
                }
              }
              * { box-sizing: border-box; }
              html { scroll-behavior: smooth; scroll-padding-top: 96px; scrollbar-gutter: stable; }
              body {
                margin: 0;
                min-height: 100vh;
                overflow-x: clip;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                color: var(--text);
                background:
                  radial-gradient(circle at 10% 0%, rgba(106,17,203,.13), transparent 28rem),
                  radial-gradient(circle at 90% 20%, rgba(37,117,252,.12), transparent 30rem),
                  var(--background);
                line-height: 1.6;
                -webkit-overflow-scrolling: touch;
              }
              header {
                position: sticky;
                top: 0;
                z-index: 1000;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 1rem;
                padding: .85rem max(1rem, env(safe-area-inset-right)) .85rem max(1rem, env(safe-area-inset-left));
                color: white;
                background: var(--gradient);
                box-shadow: 0 8px 24px rgba(33,50,110,.18);
              }
              .brand { font-size: clamp(1.25rem, 3vw, 1.8rem); font-weight: 900; white-space: nowrap; }
              nav {
                display: flex;
                gap: .4rem;
                overflow-x: auto;
                overscroll-behavior-x: contain;
                scrollbar-width: none;
                -webkit-overflow-scrolling: touch;
              }
              nav::-webkit-scrollbar { display: none; }
              nav a {
                flex: 0 0 auto;
                padding: .55rem .85rem;
                border-radius: .7rem;
                color: white;
                text-decoration: none;
                font-weight: 700;
                white-space: nowrap;
                touch-action: manipulation;
              }
              nav a:hover, nav a:focus-visible, nav a[aria-current="page"] { background: rgba(255,255,255,.22); }
              .hero {
                padding: clamp(3.5rem, 9vw, 6.5rem) 1.25rem;
                text-align: center;
                color: white;
                background: var(--gradient);
              }
              .hero h1 { margin: 0 0 .8rem; font-size: clamp(2.2rem, 7vw, 4.4rem); line-height: 1.05; }
              .hero p { max-width: 700px; margin: 0 auto; font-size: clamp(1rem, 2.4vw, 1.25rem); opacity: .9; }
              main { width: min(1120px, calc(100% - 2rem)); margin: clamp(2rem, 6vw, 4rem) auto; }
              .section-heading { margin-bottom: 1.5rem; }
              .section-heading h2 { margin: 0 0 .35rem; font-size: clamp(1.7rem, 4vw, 2.4rem); }
              .section-heading p { margin: 0; color: var(--muted); }
              .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 245px), 1fr)); gap: 1.15rem; }
              .card {
                display: flex;
                flex-direction: column;
                min-height: 260px;
                padding: 1.4rem;
                border: 1px solid var(--border);
                border-radius: 1.25rem;
                background: var(--surface);
                box-shadow: 0 14px 38px rgba(32,48,95,.08);
                transition: transform .2s ease, box-shadow .2s ease;
              }
              .card:hover { transform: translateY(-4px); box-shadow: 0 20px 44px rgba(32,48,95,.14); }
              .icon {
                width: 48px;
                height: 48px;
                display: grid;
                place-items: center;
                border-radius: 14px;
                color: white;
                background: var(--gradient);
                font-size: 1.25rem;
              }
              .card h3 { margin: 1rem 0 .45rem; font-size: 1.18rem; }
              .card p { margin: 0 0 1.25rem; color: var(--muted); }
              .card a {
                margin-top: auto;
                align-self: flex-start;
                padding: .72rem 1rem;
                border-radius: 999px;
                color: white;
                background: var(--gradient);
                text-decoration: none;
                font-weight: 800;
                touch-action: manipulation;
              }
              .video-cta {
                margin-top: 2rem;
                padding: 1.35rem;
                border-radius: 1.25rem;
                text-align: center;
                color: white;
                background: var(--gradient);
              }
              .video-cta h2 { margin: 0 0 .45rem; }
              .video-cta p { margin: 0 0 1rem; opacity: .9; }
              .video-cta a { display: inline-block; padding: .75rem 1.1rem; border-radius: 999px; color: var(--primary); background: white; text-decoration: none; font-weight: 900; }
              footer { padding: 2rem 1rem; text-align: center; color: var(--muted); }
              a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
              @media (max-width: 760px) {
                header { align-items: stretch; flex-direction: column; }
                nav { width: 100%; }
              }
              @media (hover: none) { .card:hover { transform: none; } }
              @media (prefers-reduced-motion: reduce) {
                html { scroll-behavior: auto; }
                *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
              }
            </style>
          </head>
          <body>
            <header>
              <div class="brand">Next Solution</div>
              <nav aria-label="Primary navigation">
                <a href="./">Home</a>
                <a href="tutorials.html" aria-current="page">Tutorials</a>
                <a href="videos.html">Videos</a>
                <a href="./#faq">FAQ</a>
              </nav>
            </header>

            <section class="hero">
              <h1>Jailbreak Tutorials</h1>
              <p>Clear, free guides for jailbreaking, rootless tweaks, package conversion, and iPhone customization.</p>
            </section>

            <main>
              <div class="section-heading">
                <h2>Written Guides</h2>
                <p>Choose a tutorial and follow the complete step-by-step instructions.</p>
              </div>

              <section class="grid" aria-label="Tutorial guides">
                <article class="card">
                  <div class="icon"><i class="fas fa-sync-alt" aria-hidden="true"></i></div>
                  <h3>Convert Rootful Tweaks to Rootless</h3>
                  <p>Convert older packages for Dopamine 2, XinaA15, and palera1n with troubleshooting guidance.</p>
                  <a href="convert-rootful-to-rootless.html">Read guide</a>
                </article>

                <article class="card">
                  <div class="icon"><i class="fas fa-puzzle-piece" aria-hidden="true"></i></div>
                  <h3>Free iOS 16 Rootless Tweaks</h3>
                  <p>Browse 25+ useful rootless tweaks with repositories and installation instructions.</p>
                  <a href="ios16-rootless-tweaks.html">View tweaks</a>
                </article>

                <article class="card">
                  <div class="icon"><i class="fas fa-mobile-alt" aria-hidden="true"></i></div>
                  <h3>Complete iOS 16 Jailbreak Guide</h3>
                  <p>Follow the palera1n method step by step, including requirements and troubleshooting.</p>
                  <a href="how-to-jailbreak.html">Read tutorial</a>
                </article>

                <article class="card">
                  <div class="icon"><i class="fas fa-battery-half" aria-hidden="true"></i></div>
                  <h3>Remove the Battery Service Message</h3>
                  <p>Learn how to restore battery-health readings and remove the service message using 3uTools.</p>
                  <a href="remove-service-message-iphone.html">Read tutorial</a>
                </article>
              </section>

              <section class="video-cta">
                <h2>Prefer video instructions?</h2>
                <p>Watch the latest jailbreak and iOS customization tutorials from Next Solution.</p>
                <a href="videos.html"><i class="fab fa-youtube" aria-hidden="true"></i> Open video tutorials</a>
              </section>
            </main>

            <footer>&copy; 2026 Next Solution — Free Jailbreak Tutorials &amp; Guides</footer>
          </body>
          </html>
          '''
          # Remove indentation introduced by the workflow YAML block.
          tutorials_page = '\n'.join(line[10:] if line.startswith('          ') else line for line in tutorials_page.splitlines()) + '\n'
          Path('tutorials.html').write_text(tutorials_page, encoding='utf-8')

          sitemap = '''<?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url><loc>https://nextsolution.cc/</loc><changefreq>weekly</changefreq><priority>1.0</priority></url>
            <url><loc>https://nextsolution.cc/tutorials.html</loc><changefreq>weekly</changefreq><priority>0.9</priority></url>
            <url><loc>https://nextsolution.cc/videos.html</loc><changefreq>weekly</changefreq><priority>0.8</priority></url>
            <url><loc>https://nextsolution.cc/how-to-jailbreak.html</loc><changefreq>monthly</changefreq><priority>0.8</priority></url>
            <url><loc>https://nextsolution.cc/ios16-rootless-tweaks.html</loc><changefreq>monthly</changefreq><priority>0.8</priority></url>
            <url><loc>https://nextsolution.cc/convert-rootful-to-rootless.html</loc><changefreq>monthly</changefreq><priority>0.8</priority></url>
            <url><loc>https://nextsolution.cc/remove-service-message-iphone.html</loc><changefreq>monthly</changefreq><priority>0.7</priority></url>
          </urlset>
          '''
          sitemap = '\n'.join(line[10:] if line.startswith('          ') else line for line in sitemap.splitlines()) + '\n'
          Path('sitemap.xml').write_text(sitemap, encoding='utf-8')

          for obsolete in ('downloads.html', 'Mega.html', 'mega.html', 'uploads.html'):
              Path(obsolete).unlink(missing_ok=True)

          # This is intentionally a one-time workflow.
          Path('.github/workflows/site-navigation-cleanup.yml').unlink(missing_ok=True)
          PY

      - name: Commit website cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes were required."
            exit 0
          fi
          git commit -m "Fix tutorials navigation and remove downloads pages"
          git push
