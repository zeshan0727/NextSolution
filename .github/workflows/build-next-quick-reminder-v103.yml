name: Build Next Reminder 1.3.14 and Quick Reminder 1.0.3

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: brew install dpkg ldid xz

      - name: Apply and validate panel fix
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/2026-08-04-NextQuickReminder"
          python3 "$P/fix-panel-v103.py"
          python3 "$P/prepare-build.py"
          plutil -lint "$P/Preferences/Resources/Root.plist"
          plutil -lint "$P/Preferences/Resources/Info.plist"
          plutil -lint "$P/layout/Library/PreferenceLoader/Preferences/NextQuickReminder.plist"
          grep -q 'preferredCardHeight' "$P/Tweak.xm"
          grep -q 'card.heightAnchor' "$P/Tweak.xm"
          grep -q 'formScrollView' "$P/Tweak.xm"
          grep -q 'visible-panel layout fix' "$P/Tweak.xm"
          grep -q 'nextreminder://quick-add' "$P/Tweak.xm"
          test "$(awk '/^Version:/ {print $2}' "$P/control")" = 1.0.3

      - name: Build Next Reminder 1.3.14
        run: |
          chmod +x NextReminderApp/ci/build-v144.sh
          set -o pipefail
          NextReminderApp/ci/build-v144.sh 2>&1 | tee v144-app-build.log

      - name: Build RootHide quick reminder tweak
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/2026-08-04-NextQuickReminder"
          OUT="$RUNNER_TEMP/quick-reminder-out"
          mkdir -p "$OUT"

          git init "$RUNNER_TEMP/theos-rh"
          git -C "$RUNNER_TEMP/theos-rh" remote add origin https://github.com/roothide/theos.git
          git -C "$RUNNER_TEMP/theos-rh" fetch --depth 1 origin 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$RUNNER_TEMP/theos-rh" checkout --detach 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$RUNNER_TEMP/theos-rh" submodule update --init --recursive --depth 1

          export THEOS="$RUNNER_TEMP/theos-rh" THEOS_PACKAGE_SCHEME=roothide
          make -C "$P" clean package FINALPACKAGE=1 2>&1 | tee v103-tweak-build.log

          DEB="$(find "$P/packages" -name '*_iphoneos-arm64e.deb' -print -quit)"
          test -n "$DEB"
          cp "$DEB" "$OUT/NextQuickReminder_1.0.3_RootHide.deb"
          ditto -c -k --sequesterRsrc --keepParent "$P" "$OUT/NextQuickReminder_1.0.3_Source.zip"

      - name: Verify final packages
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/quick-reminder-out"
          DEB="$OUT/NextQuickReminder_1.0.3_RootHide.deb"
          test "$(dpkg-deb -f "$DEB" Package)" = com.nextsolution.nextquickreminder
          test "$(dpkg-deb -f "$DEB" Version)" = 1.0.3
          dpkg-deb -f "$DEB" Depends | grep -q preferenceloader
          X="$(mktemp -d)"
          dpkg-deb -x "$DEB" "$X"
          DYLIB="$(find "$X" -name NextQuickReminder.dylib -print -quit)"
          test -n "$DYLIB"
          strings -a "$DYLIB" | grep -q 'preferredCardHeight'
          strings -a "$DYLIB" | grep -q 'Quick Reminder'
          strings -a "$DYLIB" | grep -q 'nextreminder://quick-add'
          strings -a "$DYLIB" | grep -q 'visible-panel layout fix'
          shasum -a 256 "$DEB" > "$OUT/NextQuickReminder_1.0.3_RootHide-SHA256.txt"
          test -f NextReminderApp/NextReminder-v1.3.14-unsigned.tipa
          unzip -t NextReminderApp/NextReminder-v1.3.14-unsigned.tipa >/dev/null

      - name: Upload final packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NextReminder-1.3.14-QuickReminder-1.0.3
          if-no-files-found: warn
          path: |
            NextReminderApp/NextReminder-v1.3.14-unsigned.tipa
            NextReminderApp/NextReminder-v1.3.14-unsigned.ipa
            NextReminderApp/NextReminder-v1.3.14-unsigned.tipa.sha256
            NextReminderApp/xcodebuild.log
            v144-app-build.log
            v103-tweak-build.log
            ${{ runner.temp }}/quick-reminder-out/NextQuickReminder_1.0.3_RootHide.deb
            ${{ runner.temp }}/quick-reminder-out/NextQuickReminder_1.0.3_RootHide-SHA256.txt
            ${{ runner.temp }}/quick-reminder-out/NextQuickReminder_1.0.3_Source.zip
