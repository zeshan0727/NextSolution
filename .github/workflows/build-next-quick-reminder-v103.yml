name: Build Next Quick Reminder 1.0.4

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: brew install dpkg ldid xz

      - name: Apply and validate 1.0.4 changes
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/2026-08-04-NextQuickReminder"
          python3 "$P/fix-panel-v103.py"
          python3 "$P/prepare-v104.py"
          python3 "$P/prepare-build.py"
          chmod 755 "$P/layout/DEBIAN/postinst"
          plutil -lint "$P/Preferences/Resources/Root.plist"
          plutil -lint "$P/Preferences/Resources/Info.plist"
          plutil -lint "$P/layout/Library/PreferenceLoader/Preferences/NextQuickReminder.plist"
          grep -q 'preferredCardHeight' "$P/Tweak.xm"
          grep -q 'Background Schedule installed; app will no longer open' "$P/BackgroundLockscreen.xm"
          grep -q 'Lock Screen clock double-tap recognized' "$P/BackgroundLockscreen.xm"
          grep -q 'NQR104WriteDatabase' "$P/BackgroundLockscreen.xm"
          grep -q 'allowLockScreen' "$P/Preferences/Resources/Root.plist"
          test "$(awk '/^Version:/ {print $2}' "$P/control")" = 1.0.4

      - name: Build RootHide quick reminder tweak
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/2026-08-04-NextQuickReminder"
          OUT="$RUNNER_TEMP/quick-reminder-out"
          mkdir -p "$OUT"

          git init "$RUNNER_TEMP/theos-rh"
          git -C "$RUNNER_TEMP/theos-rh" remote add origin https://github.com/roothide/theos.git
          git -C "$RUNNER_TEMP/theos-rh" fetch --depth 1 origin 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$RUNNER_TEMP/theos-rh" checkout --detach 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$RUNNER_TEMP/theos-rh" submodule update --init --recursive --depth 1

          export THEOS="$RUNNER_TEMP/theos-rh" THEOS_PACKAGE_SCHEME=roothide
          make -C "$P" clean package FINALPACKAGE=1 2>&1 | tee v104-tweak-build.log

          DEB="$(find "$P/packages" -name '*_iphoneos-arm64e.deb' -print -quit)"
          test -n "$DEB"
          cp "$DEB" "$OUT/NextQuickReminder_1.0.4_RootHide.deb"
          ditto -c -k --sequesterRsrc --keepParent "$P" "$OUT/NextQuickReminder_1.0.4_Source.zip"

      - name: Verify final package
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/quick-reminder-out"
          DEB="$OUT/NextQuickReminder_1.0.4_RootHide.deb"
          test "$(dpkg-deb -f "$DEB" Package)" = com.nextsolution.nextquickreminder
          test "$(dpkg-deb -f "$DEB" Version)" = 1.0.4
          test "$(dpkg-deb -f "$DEB" Architecture)" = iphoneos-arm64e
          dpkg-deb -f "$DEB" Depends | grep -q preferenceloader
          X="$(mktemp -d)"
          dpkg-deb -x "$DEB" "$X"
          DYLIB="$(find "$X" -name NextQuickReminder.dylib -print -quit)"
          test -n "$DYLIB"
          strings -a "$DYLIB" | grep -q 'Background Schedule installed; app will no longer open'
          strings -a "$DYLIB" | grep -q 'Reminder scheduled in background.'
          strings -a "$DYLIB" | grep -q 'Lock Screen clock double-tap recognized'
          strings -a "$DYLIB" | grep -q 'NextReminderDatabase.json'
          ROOT_PLIST="$(find "$X" -path '*NextQuickReminderPreferences.bundle/Root.plist' -print -quit)"
          grep -q 'allowLockScreen' "$ROOT_PLIST"
          shasum -a 256 "$DEB" > "$OUT/NextQuickReminder_1.0.4_RootHide-SHA256.txt"

      - name: Upload final package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NextQuickReminder-1.0.4-RootHide
          if-no-files-found: warn
          path: |
            v104-tweak-build.log
            ${{ runner.temp }}/quick-reminder-out/NextQuickReminder_1.0.4_RootHide.deb
            ${{ runner.temp }}/quick-reminder-out/NextQuickReminder_1.0.4_RootHide-SHA256.txt
            ${{ runner.temp }}/quick-reminder-out/NextQuickReminder_1.0.4_Source.zip
