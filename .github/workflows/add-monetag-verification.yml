name: Add Monetag Verification

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/add-monetag-verification.yml'

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update Monetag verification tag
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          tag = '<meta name="monetag" content="afa6c0ac5c051fa9058f934da7f2c324">'
          pattern = re.compile(r'<meta\s+name=["\']monetag["\']\s+content=["\'][^"\']*["\']\s*/?>', re.IGNORECASE)

          if pattern.search(text):
              text = pattern.sub(tag, text, count=1)
          else:
              marker = '<meta name="theme-color" content="#0a1118">'
              if marker not in text:
                  raise SystemExit('Expected <head> marker not found in index.html')
              text = text.replace(marker, marker + '\n  ' + tag, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit verification tag
        run: |
          if git diff --quiet -- index.html; then
            echo "Monetag tag already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update Monetag verification for nextjailbreak.com"
          git push
