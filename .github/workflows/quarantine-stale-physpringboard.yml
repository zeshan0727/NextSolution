name: Quarantine stale Physpringboard publication

on:
  push:
    branches: [main]
    paths:
      - "automation/quarantine_stale_physpringboard.py"
      - ".github/workflows/quarantine-stale-physpringboard.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quarantine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Quarantine stale publication
        run: python3 automation/quarantine_stale_physpringboard.py
      - name: Refresh static indexes
        run: python3 automation/sync_editorial_indexes.py
      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "nextsolution-quality[bot]"
          git config user.email "nextsolution-quality[bot]@users.noreply.github.com"
          git add -- automation/published-articles.json feed.xml sitemap.xml physpringboard-1-9-14-update/index.html index.html tutorials.html tutorials/index.html
          git commit -m "Quarantine stale Physpringboard 1.9.14 publication"
          git pull --rebase origin main
          git push origin HEAD:main
