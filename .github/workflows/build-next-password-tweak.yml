name: Build Next Password RootHide Tweak
on:
  push:
    branches: [agent/next-password-roothide-tweak]
    paths:
      - 'NextPasswordKeyboardTweak/**'
      - '.github/workflows/build-next-password-tweak.yml'
  pull_request:
    branches: [main]
    paths:
      - 'NextPasswordKeyboardTweak/**'
      - '.github/workflows/build-next-password-tweak.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install ldid xz make
      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          mkdir -p $HOME/theos/sdks
          ln -s "$(xcrun --sdk iphoneos --show-sdk-path)" $HOME/theos/sdks/iPhoneOS.sdk
      - name: Build RootHide-compatible package
        working-directory: NextPasswordKeyboardTweak
        run: |
          export PATH="/opt/homebrew/opt/make/libexec/gnubin:$PATH"
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
      - name: Locate DEB
        run: |
          find NextPasswordKeyboardTweak/packages -name '*.deb' -print
          test -n "$(find NextPasswordKeyboardTweak/packages -name '*.deb' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: NextPassword-RootHide-DEB
          path: NextPasswordKeyboardTweak/packages/*.deb
