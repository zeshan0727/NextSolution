name: Verify Internet Lost Haptic Live
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-internet-lost-haptic-live.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Verify live repository and packages
        run: |
          set -euo pipefail
          for i in {1..12}; do
            if curl -fsSL --retry 2 --max-time 20 https://nextsolution.cc/Packages -o /tmp/Packages.live && \
               grep -q '^Package: com.nextsolution.internetlosthaptic$' /tmp/Packages.live && \
               curl -fsSI --retry 2 --max-time 20 https://nextsolution.cc/debfiles/InternetLostHaptic_1.0.0_RootHide.deb >/tmp/rh.headers && \
               curl -fsSI --retry 2 --max-time 20 https://nextsolution.cc/debfiles/InternetLostHaptic_1.0.0_Rootless.deb >/tmp/rl.headers && \
               curl -fsSL --retry 2 --max-time 20 https://nextsolution.cc/depictions/internetlosthaptic.html -o /tmp/depiction.html && \
               grep -q 'Internet Lost Haptic' /tmp/depiction.html; then
              break
            fi
            sleep 15
          done
          grep -q '^Package: com.nextsolution.internetlosthaptic$' /tmp/Packages.live
          test "$(grep -c '^Package: com.nextsolution.internetlosthaptic$' /tmp/Packages.live)" = 2
          grep -q 'Filename: ./debfiles/InternetLostHaptic_1.0.0_RootHide.deb' /tmp/Packages.live
          grep -q 'Filename: ./debfiles/InternetLostHaptic_1.0.0_Rootless.deb' /tmp/Packages.live
          grep -q '^HTTP/.* 200' /tmp/rh.headers
          grep -q '^HTTP/.* 200' /tmp/rl.headers
          printf 'LIVE HTTP PASS\nPackages entries: 2\nRootHide: 200\nRootless: 200\nDepiction: 200\n' > internet-lost-haptic-live.txt
      - name: Record live verification
        run: |
          set -euo pipefail
          git config user.name 'Next Solution Validation Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add internet-lost-haptic-live.txt
          git commit -m 'Record Internet Lost Haptic live HTTP PASS'
          git push origin main
