name: Publish Next Multi Browser 1.1.2 to NS Transfer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-next-multi-browser-112-transfer.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: ns-transfer-next-multi-browser
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARTIFACT_ID: '9521907472'
      FILE_NAME: NextMultiBrowser_1.1.2_Global_Randomize_Phone_Only_iPhone_Test.tipa
      DEST_DIR: transfer/files/NextMultiBrowser/1.1.2
      EXPECTED_SHA256: bee01f4712aaf30ee66e2422a0c2056ed07d94db88a841cb77a2a4ed916b2d42
      EXPECTED_SIZE: '4896684'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download exact verified TIPA artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/nextmultibrowser-112.zip
          rm -rf /tmp/nextmultibrowser-112
          mkdir -p /tmp/nextmultibrowser-112
          unzip -q /tmp/nextmultibrowser-112.zip -d /tmp/nextmultibrowser-112
          test -s "/tmp/nextmultibrowser-112/${FILE_NAME}"

      - name: Verify package identity and phone environments
        shell: bash
        run: |
          set -euo pipefail
          TIPA="/tmp/nextmultibrowser-112/${FILE_NAME}"
          test "$(sha256sum "$TIPA" | awk '{print $1}')" = "$EXPECTED_SHA256"
          test "$(stat -c '%s' "$TIPA")" = "$EXPECTED_SIZE"
          unzip -tq "$TIPA" >/dev/null
          python3 - "$TIPA" <<'PY'
          import plistlib
          import sys
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as archive:
              names = archive.namelist()
              host_info = next(
                  name for name in names
                  if name.endswith('/Next Multi Browser.app/Info.plist') and name.count('/') == 2
              )
              vpn_info = next(
                  name for name in names
                  if name.endswith('/PlugIns/NextMultiBrowserVPN.appex/Info.plist')
              )
              executable = next(
                  name for name in names
                  if name.endswith('/Next Multi Browser.app/Next Multi Browser')
              )
              host = plistlib.loads(archive.read(host_info))
              vpn = plistlib.loads(archive.read(vpn_info))
              binary = archive.read(executable)

          assert host['CFBundleIdentifier'] == 'com.nextsolution.multibrowser'
          assert host['CFBundleShortVersionString'] == '1.1.2'
          assert host['CFBundleVersion'] == '10'
          assert vpn['CFBundleIdentifier'] == 'com.nextsolution.multibrowser.vpn'
          assert vpn['CFBundleShortVersionString'] == '1.1.2'
          assert vpn['CFBundleVersion'] == '10'
          assert b'_WKWebsiteDataStoreConfiguration' in binary
          assert b'_initWithConfiguration:' in binary
          assert b'Cookies.binarycookies' in binary
          assert b'Persistent profile' in binary
          for feature in (
              b'Randomize All Environments',
              b'Randomize All 20 Profiles?',
              b'Randomize Environment',
              b'Google Pixel 9 Pro XL',
              b'Samsung Galaxy S25',
              b'Samsung Galaxy S25 Ultra',
              b'OnePlus 13',
              b'Xiaomi 15 Ultra',
              b'iPhone 16 Pro Max',
          ):
              assert feature in binary, feature
          PY

      - name: Publish file and update NS Transfer feed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DEST_DIR"
          cp "/tmp/nextmultibrowser-112/$FILE_NAME" "$DEST_DIR/$FILE_NAME"

          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path('transfer/index.json')
          data = json.loads(path.read_text())
          current = []
          for item in data.get('files', []):
              item_id = str(item.get('id', '')).lower()
              file_name = str(item.get('fileName', '')).lower()
              if item_id.startswith('nextmultibrowser-') or file_name.startswith('nextmultibrowser_'):
                  continue
              current.append(item)

          entry = {
              'id': 'nextmultibrowser-1.1.2-global-phone-environments',
              'name': 'Next Multi Browser 1.1.2 — Global Phone Environments',
              'fileName': 'NextMultiBrowser_1.1.2_Global_Randomize_Phone_Only_iPhone_Test.tipa',
              'type': 'tipa',
              'platform': 'TrollStore / RootHide / iOS 15+',
              'version': '1.1.2 (10)',
              'url': 'https://nextsolution.cc/transfer/files/NextMultiBrowser/1.1.2/NextMultiBrowser_1.1.2_Global_Randomize_Phone_Only_iPhone_Test.tipa',
              'sha256': 'bee01f4712aaf30ee66e2422a0c2056ed07d94db88a841cb77a2a4ed916b2d42',
              'sizeBytes': 4896684,
              'notes': 'Adds one Profiles-wide Randomize All Environments action for all 20 isolated browsers while retaining the individual per-profile randomize button. Selectable and randomized devices are phone-only: multiple iPhones plus Pixel 9 Pro/XL, Galaxy S25/Ultra, OnePlus 13, and Xiaomi 15 Ultra. Legacy tablet and desktop settings migrate safely to phone presets without replacing profile storage identifiers or clearing cookies, Google sessions, or website data. Includes 17 languages, 24 regions, and 27 timezones.'
          }
          data['files'] = [entry] + current
          data['updatedAt'] = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')
          PY

          test "$(sha256sum "$DEST_DIR/$FILE_NAME" | awk '{print $1}')" = "$EXPECTED_SHA256"
          python3 -m json.tool transfer/index.json >/dev/null
          grep -Fq 'nextmultibrowser-1.1.2-global-phone-environments' transfer/index.json
          grep -Fq "$EXPECTED_SHA256" transfer/index.json

      - name: Commit NS Transfer publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add transfer/index.json "$DEST_DIR/$FILE_NAME"
          git diff --cached --stat
          git commit -m 'Publish Next Multi Browser 1.1.2 to NS Transfer'
          git pull --rebase origin main
          git push origin HEAD:main
