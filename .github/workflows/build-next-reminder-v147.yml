name: Build Next Reminder 1.3.17 ProMotion Performance

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Validate v1.3.17 performance patch
        run: |
          set -euo pipefail
          PATCH=NextReminderApp/ci/patch_v147.py
          grep -q 'CADisableMinimumFrameDurationOnPhone' "$PATCH"
          grep -q 'interactiveSpring' "$PATCH"
          grep -q 'substantially less GPU overdraw' "$PATCH"
          grep -q '1.3.17' NextReminderApp/ci/adjust_build_v147.py
          grep -q "grep -qx '27'" NextReminderApp/ci/adjust_build_v147.py

      - name: Build Next Reminder 1.3.17
        run: |
          set -o pipefail
          chmod +x NextReminderApp/ci/build-v147.sh
          NextReminderApp/ci/build-v147.sh 2>&1 | tee v147-app-build.log

      - name: Verify package
        run: |
          set -euo pipefail
          APP=NextReminderApp/build/NextReminder.app
          TIPA=NextReminderApp/NextReminder-v1.3.17-unsigned.tipa
          test -f "$TIPA"
          unzip -t "$TIPA" >/dev/null
          plutil -extract CFBundleShortVersionString raw "$APP/Info.plist" | grep -qx '1.3.17'
          plutil -extract CFBundleVersion raw "$APP/Info.plist" | grep -qx '27'
          plutil -extract CADisableMinimumFrameDurationOnPhone raw "$APP/Info.plist" | grep -qx 'true'
          mkdir -p "$RUNNER_TEMP/next-reminder-v147"
          cp "$TIPA" "$RUNNER_TEMP/next-reminder-v147/"
          cp NextReminderApp/NextReminder-v1.3.17-unsigned.tipa.sha256 "$RUNNER_TEMP/next-reminder-v147/"
          ditto -c -k --sequesterRsrc --keepParent NextReminderApp "$RUNNER_TEMP/next-reminder-v147/NextReminder-v1.3.17-Source.zip"

      - name: Upload final package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NextReminder-v1.3.17-ProMotionPerformance
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/next-reminder-v147/NextReminder-v1.3.17-unsigned.tipa
            ${{ runner.temp }}/next-reminder-v147/NextReminder-v1.3.17-unsigned.tipa.sha256
            ${{ runner.temp }}/next-reminder-v147/NextReminder-v1.3.17-Source.zip
            v147-app-build.log
            NextReminderApp/xcodebuild.log
