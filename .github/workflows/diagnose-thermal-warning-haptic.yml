name: Diagnose Thermal Warning Haptic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-thermal-warning-haptic.yml"
      - "ReleaseTriggers/thermal-warning-haptic-diagnostic.txt"

permissions:
  contents: write

concurrency:
  group: diagnose-thermal-warning-haptic
  cancel-in-progress: false

jobs:
  compiler-diagnostic:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Install tools
        run: brew install dpkg ldid xz zstd

      - name: Build both variants and persist diagnostic result
        shell: bash
        run: |
          set -u
          P="$GITHUB_WORKSPACE/DailyTweaks/2026-08-08-ThermalWarningHaptic"
          L="$RUNNER_TEMP/twh-diagnostic"
          mkdir -p "$L" Diagnostics
          python3 "$P/tests/test_runtime_logic.py" > "$L/runtime-tests.log" 2>&1
          TEST_RC=$?

          git clone --recursive --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos-rootless" > "$L/rootless-bootstrap.log" 2>&1
          ROOTLESS_BOOT_RC=$?
          ROOTLESS_RC=99
          if [ "$ROOTLESS_BOOT_RC" -eq 0 ]; then
            export THEOS="$RUNNER_TEMP/theos-rootless" THEOS_PACKAGE_SCHEME=rootless
            rm -rf "$P/packages"
            make -C "$P" clean package FINALPACKAGE=1 > "$L/rootless-build.log" 2>&1
            ROOTLESS_RC=$?
          fi

          git checkout -- "$P/control" 2>/dev/null || true
          git init "$RUNNER_TEMP/theos-roothide" > "$L/roothide-bootstrap.log" 2>&1
          RH1=$?
          if [ "$RH1" -eq 0 ]; then git -C "$RUNNER_TEMP/theos-roothide" remote add origin https://github.com/roothide/theos.git >> "$L/roothide-bootstrap.log" 2>&1; RH1=$?; fi
          if [ "$RH1" -eq 0 ]; then git -C "$RUNNER_TEMP/theos-roothide" fetch --depth 1 origin 88506b2c22e9e07dd4ed055f23c9e398a117a2c7 >> "$L/roothide-bootstrap.log" 2>&1; RH1=$?; fi
          if [ "$RH1" -eq 0 ]; then git -C "$RUNNER_TEMP/theos-roothide" checkout --detach 88506b2c22e9e07dd4ed055f23c9e398a117a2c7 >> "$L/roothide-bootstrap.log" 2>&1; RH1=$?; fi
          if [ "$RH1" -eq 0 ]; then git -C "$RUNNER_TEMP/theos-roothide" submodule update --init --recursive --depth 1 >> "$L/roothide-bootstrap.log" 2>&1; RH1=$?; fi
          ROOTHIDE_RC=99
          if [ "$RH1" -eq 0 ]; then
            sed -i '' 's/^Architecture: iphoneos-arm64$/Architecture: iphoneos-arm64e/' "$P/control"
            export THEOS="$RUNNER_TEMP/theos-roothide" THEOS_PACKAGE_SCHEME=roothide
            rm -rf "$P/packages"
            make -C "$P" clean package FINALPACKAGE=1 > "$L/roothide-build.log" 2>&1
            ROOTHIDE_RC=$?
          fi
          git checkout -- "$P/control" 2>/dev/null || true

          ROOTLESS_DEB=$(find "$P/packages" -type f -name '*_iphoneos-arm64e.deb' -print -quit 2>/dev/null || true)
          STATUS=PASS
          if [ "$TEST_RC" -ne 0 ] || [ "$ROOTLESS_BOOT_RC" -ne 0 ] || [ "$ROOTLESS_RC" -ne 0 ] || [ "$RH1" -ne 0 ] || [ "$ROOTHIDE_RC" -ne 0 ]; then STATUS=FAIL; fi

          {
            echo "Thermal Warning Haptic 1.0.0 compiler diagnostic: $STATUS"
            echo "Date (UTC): $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "Deterministic tests exit: $TEST_RC"
            echo "Rootless bootstrap exit: $ROOTLESS_BOOT_RC"
            echo "Rootless build exit: $ROOTLESS_RC"
            echo "RootHide bootstrap exit: $RH1"
            echo "RootHide build exit: $ROOTHIDE_RC"
            echo
            echo "=== runtime tests ==="
            cat "$L/runtime-tests.log" 2>/dev/null || true
            echo
            echo "=== rootless build tail ==="
            tail -n 120 "$L/rootless-build.log" 2>/dev/null || true
            echo
            echo "=== RootHide build tail ==="
            tail -n 120 "$L/roothide-build.log" 2>/dev/null || true
          } > Diagnostics/ThermalWarningHaptic-build.txt

          git config user.name 'Next Solution Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add Diagnostics/ThermalWarningHaptic-build.txt
          git commit -m "Record Thermal Warning Haptic compiler diagnostic ($STATUS)" || true
          git pull --rebase origin main || true
          git push origin HEAD:main

          test "$STATUS" = PASS

      - name: Upload full compiler logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thermal-warning-haptic-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/twh-diagnostic/
          if-no-files-found: warn
