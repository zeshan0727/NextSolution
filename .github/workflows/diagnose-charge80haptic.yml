name: Diagnose Charge 80 Haptic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-charge80haptic.yml"
      - "DailyTweaks/2026-08-09-Charge80Haptic/**"

permissions:
  contents: write

concurrency:
  group: diagnose-charge80haptic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Install tools
        run: brew install dpkg ldid
      - name: Deterministic runtime checks
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/2026-08-09-Charge80Haptic"
          python3 "$P/tests/test_runtime_logic.py"
          grep -q '^ARCHS = arm64 arm64e$' "$P/Makefile"
          grep -q 'segalign,4000' "$P/Makefile"
          grep -q 'com.apple.springboard' "$P/Charge80Haptic.plist"
          grep -q 'UIDeviceBatteryLevelDidChangeNotification' "$P/Tweak.xm"
          grep -q 'UIDeviceBatteryStateDidChangeNotification' "$P/Tweak.xm"
          grep -q 'batteryMonitoringEnabled = YES' "$P/Tweak.xm"
          grep -q 'C80Observers = @\[levelObserver, stateObserver\]' "$P/Tweak.xm"
          python3 - "$P/Tweak.xm" <<'PY'
          from pathlib import Path
          import sys
          t=Path(sys.argv[1]).read_text(); tail=t[t.index('%ctor'):]
          assert tail.index('C80LastPercent = C80CurrentPercent(device)') < tail.index('addObserverForName:UIDeviceBatteryLevelDidChangeNotification')
          assert 'previousPercent < C80ThresholdPercent' in t
          assert 'currentPercent >= C80ThresholdPercent' in t
          assert 'C80IsPowered(currentState)' in t
          PY
          plutil -lint "$P/Preferences/Resources/Root.plist"
          plutil -lint "$P/Preferences/Resources/Info.plist"
          plutil -lint "$P/layout/Library/PreferenceLoader/Preferences/Charge80Haptic.plist"
          test "$(grep -c 'PSSwitchCell' "$P/Preferences/Resources/Root.plist")" -eq 1
      - name: Build rootless
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/2026-08-09-Charge80Haptic"; O="$RUNNER_TEMP/c80"; mkdir -p "$O"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos-rootless"
          export THEOS="$RUNNER_TEMP/theos-rootless" THEOS_PACKAGE_SCHEME=rootless
          rm -rf "$P/packages"; make -C "$P" clean package FINALPACKAGE=1
          D="$(find "$P/packages" -type f -name '*_iphoneos-arm64.deb' -print -quit)"; test -n "$D"; cp "$D" "$O/Charge80Haptic_1.0.0_Rootless.deb"
      - name: Build RootHide
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/2026-08-09-Charge80Haptic"; O="$RUNNER_TEMP/c80"
          git checkout -- "$P/control"
          git init "$RUNNER_TEMP/theos-roothide"
          git -C "$RUNNER_TEMP/theos-roothide" remote add origin https://github.com/roothide/theos.git
          git -C "$RUNNER_TEMP/theos-roothide" fetch --depth 1 origin 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$RUNNER_TEMP/theos-roothide" checkout --detach 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$RUNNER_TEMP/theos-roothide" submodule update --init --recursive --depth 1
          sed -i '' 's/^Architecture: iphoneos-arm64$/Architecture: iphoneos-arm64e/' "$P/control"
          export THEOS="$RUNNER_TEMP/theos-roothide" THEOS_PACKAGE_SCHEME=roothide
          rm -rf "$P/packages"; make -C "$P" clean package FINALPACKAGE=1
          D="$(find "$P/packages" -type f -name '*_iphoneos-arm64e.deb' -print -quit)"; test -n "$D"; cp "$D" "$O/Charge80Haptic_1.0.0_RootHide.deb"
          git checkout -- "$P/control"
      - name: Inspect packages and record PASS
        run: |
          set -euo pipefail
          O="$RUNNER_TEMP/c80"
          check(){ D="$1"; A="$2"; X="$(mktemp -d)"; test "$(dpkg-deb -f "$D" Package)" = com.nextsolution.charge80haptic; test "$(dpkg-deb -f "$D" Version)" = 1.0.0; test "$(dpkg-deb -f "$D" Architecture)" = "$A"; dpkg-deb -x "$D" "$X"; find "$X" -name Charge80Haptic.dylib | grep -q .; find "$X" -path '*Charge80HapticPreferences.bundle/Root.plist' | grep -q .; find "$X" -path '*PreferenceLoader/Preferences/Charge80Haptic.plist' | grep -q .; grep -R -q 'Enable 80% Alert' "$X"; rm -rf "$X"; }
          check "$O/Charge80Haptic_1.0.0_Rootless.deb" iphoneos-arm64
          check "$O/Charge80Haptic_1.0.0_RootHide.deb" iphoneos-arm64e
          mkdir -p Diagnostics
          { echo 'Charge 80 Haptic 1.0.0: BUILD VALIDATION PASS'; echo 'Deterministic runtime checks: PASS (10 cases)'; echo 'Rootless package: PASS'; echo 'RootHide package: PASS'; shasum -a 256 "$O"/*.deb; } > Diagnostics/2026-08-09-charge80haptic-build.txt
          git config user.name 'Next Solution Build Bot'; git config user.email 'actions@users.noreply.github.com'
          git add Diagnostics/2026-08-09-charge80haptic-build.txt
          git commit -m 'Record Charge 80 Haptic compiler diagnostic (PASS)'
          git push origin HEAD:main
