name: Temporary Next Signer 1.3.5 Build

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  build:
    if: github.event.issue.title == '[NEXTSIGNER-1.3.5-BUILD]'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: '1.3.5'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply 1.3.5 source patch
        run: python3 NextSigner/patch_135.py

      - name: Commit production app source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add NextSigner/NextSigner/Models.swift NextSigner/NextSigner/GitHubService.swift NextSigner/NextSigner/SignerStore.swift NextSigner/NextSigner/NextSignerRootView.swift NextSigner/NextSigner/SigningProfileService.swift NextSigner/NextSigner/SigningProfileView.swift NextSigner/project.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Next Signer 1.3.5 publish modes and signing profiles'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          python3 NextSigner/generate_app_icon.py
          brew install xcodegen
          cd NextSigner
          xcodegen generate

      - name: Compile Next Signer 1.3.5
        working-directory: NextSigner
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project NextSigner.xcodeproj \
            -scheme NextSigner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/NextSigner135" \
            -resolvePackageDependencies
          xcodebuild \
            -project NextSigner.xcodeproj \
            -scheme NextSigner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/NextSigner135" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package TIPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find "$RUNNER_TEMP/NextSigner135/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name '*.app' | head -n1)"
          test -n "$APP_PATH" || { echo 'Built app not found'; exit 1; }
          rm -rf "$RUNNER_TEMP/package"
          mkdir -p "$RUNNER_TEMP/package/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/package/Payload/NextSigner.app"
          cd "$RUNNER_TEMP/package"
          /usr/bin/zip -qry "$RUNNER_TEMP/NextSigner-${VERSION}.ipa" Payload
          cp "$RUNNER_TEMP/NextSigner-${VERSION}.ipa" "$RUNNER_TEMP/NextSigner-${VERSION}.tipa"
          unzip -t "$RUNNER_TEMP/NextSigner-${VERSION}.tipa" >/dev/null
          echo "SHA256=$(shasum -a 256 "$RUNNER_TEMP/NextSigner-${VERSION}.tipa" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: NextSigner-1.3.5-TIPA
          path: |
            ${{ runner.temp }}/NextSigner-1.3.5.tipa
            ${{ runner.temp }}/NextSigner-1.3.5.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Start NS Transfer publisher
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow publish-nextsigner-transfer.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run publish-nextsigner-transfer.yml --repo "$GITHUB_REPOSITORY" --ref main -f version="$VERSION"
          RUN_ID=''
          for attempt in $(seq 1 30); do
            candidate="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow publish-nextsigner-transfer.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            if [ "$candidate" != "0" ] && [ "$candidate" != "$BEFORE" ]; then RUN_ID="$candidate"; break; fi
            sleep 2
          done
          test -n "$RUN_ID" || { echo 'Could not locate publisher run'; exit 1; }
          echo "PUBLISH_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "NEXTSIGNER_1_3_5_PUBLISH_STARTED run=$RUN_ID sha256=$SHA256"

      - name: Wait for publisher
        run: gh run watch "$PUBLISH_RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status --interval 8

      - name: Report success
        if: success()
        run: gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "NEXTSIGNER_1_3_5_PUBLISHED publish=$PUBLISH_RUN_ID sha256=$SHA256"

      - name: Report failure
        if: failure()
        run: gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "NEXTSIGNER_1_3_5_FAILED controller=${{ github.run_id }} publish=${PUBLISH_RUN_ID:-unknown}"
