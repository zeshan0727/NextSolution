name: Build Next Accounts TIPA

on:
  push:
    branches:
      - codex/next-accounts-build-20260824
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build unsigned iOS package
        working-directory: .codex-build/next-accounts
        run: bash scripts/build.sh

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: NextAccounts-TIPA
          path: .codex-build/next-accounts/NextAccounts_1.0.6.tipa
          if-no-files-found: error
          retention-days: 1

      - name: Publish package to NS Transfer
        shell: bash
        run: |
          set -euo pipefail

          package_name="NextAccounts-1.0.6-Search-Swipe-Delete.tipa"
          built_package=".codex-build/next-accounts/NextAccounts_1.0.6.tipa"
          staged_package="${RUNNER_TEMP}/${package_name}"
          destination="transfer/files/NextAccounts/1.0.6/${package_name}"

          cp "${built_package}" "${staged_package}"
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p "$(dirname "${destination}")"
          cp "${staged_package}" "${destination}"

          python3 - "${destination}" <<'PY'
          import datetime
          import hashlib
          import json
          import pathlib
          import sys

          package = pathlib.Path(sys.argv[1])
          catalog_path = pathlib.Path("transfer/index.json")
          catalog = json.loads(catalog_path.read_text(encoding="utf-8"))
          package_bytes = package.read_bytes()

          entry = {
              "id": "nextaccounts-1.0.6-search-swipe-delete",
              "name": "Next Accounts 1.0.6 — Search & Swipe Delete",
              "fileName": package.name,
              "type": "tipa",
              "platform": "TrollStore / iOS 16+",
              "version": "1.0.6",
              "url": f"https://nextsolution.cc/transfer/files/NextAccounts/1.0.6/{package.name}",
              "sha256": hashlib.sha256(package_bytes).hexdigest(),
              "sizeBytes": len(package_bytes),
              "notes": (
                  "Adds a native email search bar with case-insensitive filtering and a clear no-results state. "
                  "Each account can now be deleted with a simple left swipe, including full-swipe deletion, and "
                  "the updated list is saved immediately in Keychain. Existing account editing, one-tap copy, "
                  "platform status buttons, automatic local generators, bulk import, Generate 5 More and the "
                  "independent in-app browser remain unchanged."
              ),
          }

          catalog["files"] = [item for item in catalog.get("files", []) if item.get("id") != entry["id"]]
          catalog["files"].insert(0, entry)
          catalog["updatedAt"] = datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          catalog_path.write_text(json.dumps(catalog, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY

          git config user.name "Next Solution Build Bot"
          git config user.email "180765564+zeshan0727@users.noreply.github.com"
          git add "${destination}" transfer/index.json
          git commit -m "Publish Next Accounts 1.0.6 to NS Transfer"
          git push origin main
