name: Build Next Accounts TIPA

on:
  push:
    branches:
      - codex/next-accounts-build-20260824
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build unsigned iOS package
        working-directory: .codex-build/next-accounts
        run: bash scripts/build.sh

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: NextAccounts-TIPA
          path: .codex-build/next-accounts/NextAccounts_1.0.1.tipa
          if-no-files-found: error
          retention-days: 1
