name: Build Next Ledger 1.3.56 Final Auto OpenAI
permissions:
  contents: write
concurrency:
  group: next-ledger-1-3-56-final-${{ github.ref }}
  cancel-in-progress: false
on:
  push:
    paths:
      - ".github/workflows/build-next-ledger-1.3.56-final.yml"
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final patches
        run: bash scripts/apply_next_ledger_1_3_56.sh
      - name: Install tools
        run: brew install xcodegen dpkg ldid
      - name: Validate core auto OpenAI path
        run: |
          mkdir -p build
          grep -Fq 'MARKETING_VERSION: "1.3.56"' project.yml
          grep -Fq 'CURRENT_PROJECT_VERSION: "64"' project.yml
          grep -Fq 'actor SMSOpenAIAutoRecoveryCoordinator' DailyLedger/Services/SMSAIRecognitionService.swift
          grep -Fq 'guard OpenAIService.shared.hasAPIKey else { return }' DailyLedger/Services/SMSAIRecognitionService.swift
          grep -Fq 'await SMSOpenAIAutoRecoveryCoordinator.shared.processPending()' DailyLedger/DailyLedgerApp.swift
          grep -Fq 'QueueAICandidate' RootHideSMSQueue/Sources/main.m
          grep -Fq 'applyAIRecovery' DailyLedger/Services/SMSImportConsoleService.swift
          xcrun clang -fobjc-arc RootHideSMSQueue/Sources/main.m -framework Foundation -framework CoreFoundation -lsqlite3 -o build/nextledgersmsd-macos
          build/nextledgersmsd-macos --self-test | tee build/sms-parser-tests.json
          grep -q '"passed" : true' build/sms-parser-tests.json
      - name: Generate project
        run: xcodegen generate
      - name: Build iPhone app
        run: |
          set -o pipefail
          xcodebuild -project DailyLedger.xcodeproj -scheme DailyLedger -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build/xcodebuild.log
      - name: Package TIPA
        run: |
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload NextLedger-1.3.56-auto-openai-sms.tipa
          shasum -a 256 NextLedger-1.3.56-auto-openai-sms.tipa > NextLedger-1.3.56-auto-openai-sms.sha256
      - name: Upload TIPA
        uses: actions/upload-artifact@v4
        with:
          name: NextLedger-1.3.56-Final-Auto-OpenAI
          path: |
            NextLedger-1.3.56-auto-openai-sms.tipa
            NextLedger-1.3.56-auto-openai-sms.sha256
            build/sms-parser-tests.json
      - name: Publish isolated status
        if: always()
        run: |
          STATUS="${{ job.status }}"
          git reset --hard HEAD
          git clean -fd
          git fetch origin "$GITHUB_REF_NAME"
          git checkout -B build-status "origin/$GITHUB_REF_NAME"
          mkdir -p .build-status
          cat > .build-status/next-ledger-1.3.56-final.json <<EOF
          {"status":"${STATUS}","run_id":"${GITHUB_RUN_ID}","source_sha":"${GITHUB_SHA}","artifact_name":"NextLedger-1.3.56-Final-Auto-OpenAI"}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .build-status/next-ledger-1.3.56-final.json
          git commit -m "Record final Next Ledger 1.3.56 status" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
