name: Build Next Reminder 1.3.18 Email Repeat Final Complete

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Validate v1.3.18 patch sources
        run: |
          set -euo pipefail
          PATCH=NextReminderApp/ci/patch_v148.py
          grep -q 'never re-submit email' "$PATCH"
          grep -q 'guard reminder.emailWhenDue' "$PATCH"
          grep -q 'completeFinally' "$PATCH"
          grep -q 'cancelRepeat' "$PATCH"
          grep -q 'Final Complete' "$PATCH"
          grep -q '1.3.18' NextReminderApp/ci/adjust_build_v148.py
          grep -q "grep -qx '28'" NextReminderApp/ci/adjust_build_v148.py

      - name: Build Next Reminder 1.3.18
        run: |
          set -o pipefail
          chmod +x NextReminderApp/ci/build-v148.sh
          NextReminderApp/ci/build-v148.sh 2>&1 | tee v148-app-build.log

      - name: Verify package and behavior markers
        run: |
          set -euo pipefail
          APP=NextReminderApp/build/NextReminder.app
          TIPA=NextReminderApp/NextReminder-v1.3.18-unsigned.tipa
          test -f "$TIPA"
          unzip -t "$TIPA" >/dev/null
          plutil -extract CFBundleShortVersionString raw "$APP/Info.plist" | grep -qx '1.3.18'
          plutil -extract CFBundleVersion raw "$APP/Info.plist" | grep -qx '28'
          plutil -extract CADisableMinimumFrameDurationOnPhone raw "$APP/Info.plist" | grep -qx 'true'
          grep -q 'func completeFinally' NextReminderApp/NextReminder/Sources/Services.swift
          grep -q 'func cancelRepeat' NextReminderApp/NextReminder/Sources/Services.swift
          grep -q 'guard reminder.emailWhenDue' NextReminderApp/NextReminder/Sources/EmailAutomationCore.swift
          ! grep -q 'Always email urgent reminders' NextReminderApp/NextReminder/Sources/EmailAutomationSettingsView.swift
          grep -q 'Final Complete' NextReminderApp/NextReminder/Sources/Detail.swift
          grep -q 'finalCompletion' NextReminderApp/NextReminder/Sources/CompletedFilterActions.swift
          python3 - <<'PY'
          from pathlib import Path
          s = Path('NextReminderApp/NextReminder/Sources/Services.swift').read_text()
          init = s[s.index('    init() {'):s.index('    var pendingReminders:')]
          assert 'EmailAutomationManager.shared.sync(reminder)' not in init, 'email sync still runs on app launch'
          print('Launch path contains no automatic email resubmission.')
          PY
          mkdir -p "$RUNNER_TEMP/next-reminder-v148"
          cp "$TIPA" "$RUNNER_TEMP/next-reminder-v148/"
          cp NextReminderApp/NextReminder-v1.3.18-unsigned.tipa.sha256 "$RUNNER_TEMP/next-reminder-v148/"
          ditto -c -k --sequesterRsrc --keepParent NextReminderApp "$RUNNER_TEMP/next-reminder-v148/NextReminder-v1.3.18-Source.zip"

      - name: Upload final package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NextReminder-v1.3.18-EmailRepeatFinalComplete
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/next-reminder-v148/NextReminder-v1.3.18-unsigned.tipa
            ${{ runner.temp }}/next-reminder-v148/NextReminder-v1.3.18-unsigned.tipa.sha256
            ${{ runner.temp }}/next-reminder-v148/NextReminder-v1.3.18-Source.zip
            v148-app-build.log
            NextReminderApp/xcodebuild.log
