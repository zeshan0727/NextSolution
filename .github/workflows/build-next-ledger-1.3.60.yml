name: Build Next Ledger 1.3.60 Financial Summary Cash Flow

permissions:
  contents: write

concurrency:
  group: next-ledger-1-3-60-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/fix_financial_summary_cashflow_1_3_60.py"
      - "scripts/apply_next_ledger_1_3_60.sh"
      - ".github/workflows/build-next-ledger-1.3.60.yml"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Next Ledger 1.3.60 patches
        run: bash scripts/apply_next_ledger_1_3_60.sh

      - name: Validate Financial Summary rules
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'MARKETING_VERSION: "1.3.60"' project.yml
          grep -Fq 'CURRENT_PROJECT_VERSION: "68"' project.yml
          grep -Fq 'func isFinancialSummaryDirectIncome' DailyLedger/Services/LedgerStore.swift
          grep -Fq 'func isFinancialSummaryRefund' DailyLedger/Services/LedgerStore.swift
          grep -Fq 'func isFinancialSummaryDirectExpense' DailyLedger/Services/LedgerStore.swift
          grep -Fq 'source.nature == .loan' DailyLedger/Services/LedgerStore.swift
          grep -Fq 'destination.nature == .bank' DailyLedger/Services/LedgerStore.swift
          grep -Fq 'source.nature == .bank' DailyLedger/Services/LedgerStore.swift
          grep -Fq 'destination.nature == .loan' DailyLedger/Services/LedgerStore.swift
          grep -Fq 'title: "Total Income"' DailyLedger/Views/ReportsView.swift
          grep -Fq 'title: "Refunds"' DailyLedger/Views/ReportsView.swift
          grep -Fq 'movementTitle: "Loans Increased"' DailyLedger/Views/ReportsView.swift
          grep -Fq 'movementTitle: "Loans Paid"' DailyLedger/Views/ReportsView.swift
          grep -Fq 'financialSummaryDirectIncomeTotal' DailyLedger/Views/ReportsView.swift
          grep -Fq 'financialSummaryRefundTotal' DailyLedger/Views/ReportsView.swift
          grep -Fq 'financialSummaryDirectExpenseTotal' DailyLedger/Views/ReportsView.swift
          grep -Fq 'case refunds' DailyLedger/Views/PeriodTransactionsView.swift
          grep -Fq 'case loanIncreased' DailyLedger/Views/PeriodTransactionsView.swift
          python3 - <<'PY'
          def classify(tx_type, source_nature=None, destination_nature=None, refund=False):
              if tx_type == 'income':
                  return 'refund' if refund else 'income'
              if tx_type == 'expense':
                  return None if refund else 'expense'
              if tx_type == 'transfer':
                  if source_nature == 'loan' and destination_nature == 'bank':
                      return 'loan_increased'
                  if source_nature == 'bank' and destination_nature == 'loan':
                      return 'loan_paid'
              return None
          assert classify('transfer', 'loan', 'loan') is None
          assert classify('transfer', 'bank', 'bank') is None
          assert classify('transfer', 'loan', 'bank') == 'loan_increased'
          assert classify('transfer', 'bank', 'loan') == 'loan_paid'
          assert classify('income', refund=False) == 'income'
          assert classify('income', refund=True) == 'refund'
          assert classify('expense', refund=False) == 'expense'
          income, refunds, loan_increased = 8000, 250, 500
          expenses, loan_paid = 5000, 1000
          assert income + refunds + loan_increased == 8750
          assert expenses + loan_paid == 6000
          print('Financial Summary classification regression checks passed.')
          PY

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iPhone app
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project DailyLedger.xcodeproj \
            -scheme DailyLedger \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build/xcodebuild.log

      - name: Package Next Ledger 1.3.60 TIPA
        run: |
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload NextLedger-1.3.60-financial-summary-cashflow.tipa
          shasum -a 256 NextLedger-1.3.60-financial-summary-cashflow.tipa > NextLedger-1.3.60-financial-summary-cashflow.sha256

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: NextLedger-1.3.60-Financial-Summary-CashFlow
          path: |
            NextLedger-1.3.60-financial-summary-cashflow.tipa
            NextLedger-1.3.60-financial-summary-cashflow.sha256
          if-no-files-found: error

      - name: Capture diagnostics
        if: failure()
        run: |
          mkdir -p build
          { test -f build/xcodebuild.log && grep -E "error:|fatal error:|SwiftCompile|BUILD FAILED" build/xcodebuild.log || true; } > build/next-ledger-1.3.60-errors.txt

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NextLedger-1.3.60-Diagnostics
          path: build/next-ledger-1.3.60-errors.txt
          if-no-files-found: warn

      - name: Publish build status
        if: always()
        shell: bash
        run: |
          STATUS="${{ job.status }}"
          git reset --hard HEAD
          git clean -fd
          git fetch origin "$GITHUB_REF_NAME"
          git checkout -B build-status "origin/$GITHUB_REF_NAME"
          mkdir -p .build-status
          cat > .build-status/next-ledger-1.3.60.json <<EOF
          {
            "status": "${STATUS}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_number": "${GITHUB_RUN_NUMBER}",
            "source_sha": "${GITHUB_SHA}",
            "app_version": "1.3.60",
            "app_build": "68",
            "daemon_version": "2.2.1",
            "artifact_name": "NextLedger-1.3.60-Financial-Summary-CashFlow"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .build-status/next-ledger-1.3.60.json
          git commit -m "Record Next Ledger 1.3.60 build status" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}

# clean trigger 1
