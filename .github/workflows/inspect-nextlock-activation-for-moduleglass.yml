name: Inspect NextLock Activation UI

on:
  push:
    branches:
      - feature/moduleglass-1.1.18-modern-settings
    paths:
      - '.github/workflows/inspect-nextlock-activation-for-moduleglass.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect NextLock preference activation strings
        shell: bash
        run: |
          set -euo pipefail
          DEB=transfer/files/NextLock/1.1.4/NextLock_1.1.4_RootHide.deb
          test -f "$DEB"
          rm -rf /tmp/nl && mkdir -p /tmp/nl
          dpkg-deb -x "$DEB" /tmp/nl
          PREF=$(find /tmp/nl -path '*LockGlyphTimePrefs.bundle/LockGlyphTimePrefs' -print -quit)
          test -n "$PREF"
          strings -a "$PREF" > /tmp/prefs.strings
          echo '=== ACTIVATION / LICENSE / BRANDING ==='
          grep -Eai 'activat|license|licen|device|udid|serial|next solution|nextsolution|key|trial|premium|purchase|valid|invalid|expire|status|support|website|barvi|zeeshan|register' /tmp/prefs.strings | head -n 800 || true
          echo '=== OBJC SELECTORS ==='
          otool -ov "$PREF" > /tmp/prefs.otool || true
          grep -Eai 'activat|license|device|udid|serial|key|trial|valid|invalid|status|register' /tmp/prefs.otool | head -n 800 || true
