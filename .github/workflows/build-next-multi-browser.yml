name: Build Next Multi Browser TIPA

on:
  push:
    branches: [next-multi-browser]
    paths:
      - 'apps/next-multi-browser/**'
      - '.github/workflows/build-next-multi-browser.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/next-multi-browser/**'
      - '.github/workflows/build-next-multi-browser.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: next-multi-browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Prepare OpenVPN package
        working-directory: apps/next-multi-browser
        run: bash scripts/prepare-tunnelkit.sh
      - name: Prepare bundled VPN Gate fallback
        working-directory: apps/next-multi-browser
        run: python3 scripts/fetch-vpngate-seed.py Resources/VPNGateSeed.csv
      - name: Generate Xcode project
        working-directory: apps/next-multi-browser
        run: xcodegen generate
      - name: Run iPad layout and 20-profile isolation tests
        timeout-minutes: 15
        working-directory: apps/next-multi-browser
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); devices=[device for runtime, values in data["devices"].items() if "iOS" in runtime for device in values if device.get("isAvailable") and device["name"].startswith("iPad")]; print(next((device["udid"] for device in devices if "iPad Pro" in device["name"]), devices[0]["udid"]))')
          test -n "$SIMULATOR_ID"
          xcodebuild \
            -project NextMultiBrowser.xcodeproj \
            -scheme NextMultiBrowserProfileTests \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -only-testing:NextMultiBrowserTests \
            CODE_SIGNING_ALLOWED=NO \
            test
      - name: Build unsigned device app
        working-directory: apps/next-multi-browser
        run: |
          xcodebuild \
            -project NextMultiBrowser.xcodeproj \
            -scheme NextMultiBrowser \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build
      - name: Ad-hoc sign VPN extension and host
        working-directory: apps/next-multi-browser
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          EXT_PATH="$APP_PATH/PlugIns/NextMultiBrowserVPN.appex"
          test -d "$EXT_PATH"
          /usr/bin/codesign --force --sign - --timestamp=none --generate-entitlement-der --entitlements VPNExtension/VPN.entitlements "$EXT_PATH"
          /usr/bin/codesign --force --sign - --timestamp=none --generate-entitlement-der --entitlements App.entitlements "$APP_PATH"
          /usr/bin/codesign -d --entitlements :- "$APP_PATH" || true
          /usr/bin/codesign -d --entitlements :- "$EXT_PATH" || true
      - name: Package TIPA
        working-directory: apps/next-multi-browser
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          rm -rf package
          mkdir -p package/Payload
          cp -R "$APP_PATH" package/Payload/
          cd package
          zip -qry ../NextMultiBrowser_1.1.10_Device_Category_Modes.tipa Payload
          cp ../NextMultiBrowser_1.1.10_Device_Category_Modes.tipa ../NextMultiBrowser_1.1.10_Device_Category_Modes.ipa
      - name: Upload TIPA
        uses: actions/upload-artifact@v4
        with:
          name: NextMultiBrowser-1.1.10-Device-Category-Modes
          path: |
            apps/next-multi-browser/NextMultiBrowser_1.1.10_Device_Category_Modes.tipa
            apps/next-multi-browser/NextMultiBrowser_1.1.10_Device_Category_Modes.ipa
          if-no-files-found: error
      - name: Verify package identity and requested features
        shell: bash
        run: |
          set -euo pipefail
          TIPA="apps/next-multi-browser/NextMultiBrowser_1.1.10_Device_Category_Modes.tipa"
          unzip -tq "$TIPA" >/dev/null
          python3 - "$TIPA" <<'PY'
          import plistlib
          import sys
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as archive:
              names = archive.namelist()
              host_info = next(name for name in names if name.endswith('/Next Multi Browser.app/Info.plist') and name.count('/') == 2)
              vpn_info = next(name for name in names if name.endswith('/PlugIns/NextMultiBrowserVPN.appex/Info.plist'))
              executable = next(name for name in names if name.endswith('/Next Multi Browser.app/Next Multi Browser'))
              asset_catalog = next(name for name in names if name.endswith('/Next Multi Browser.app/Assets.car'))
              host = plistlib.loads(archive.read(host_info))
              vpn = plistlib.loads(archive.read(vpn_info))
              binary = archive.read(executable)
              assets = archive.read(asset_catalog)

          assert host['CFBundleIdentifier'] == 'com.nextsolution.multibrowser'
          assert host['CFBundleShortVersionString'] == '1.1.10'
          assert host['CFBundleVersion'] == '18'
          assert set(host['UIDeviceFamily']) == {1, 2}
          assert set(host['UISupportedInterfaceOrientations~ipad']) == {
              'UIInterfaceOrientationPortrait',
              'UIInterfaceOrientationPortraitUpsideDown',
              'UIInterfaceOrientationLandscapeLeft',
              'UIInterfaceOrientationLandscapeRight',
          }
          assert vpn['CFBundleIdentifier'] == 'com.nextsolution.multibrowser.vpn'
          assert vpn['CFBundleShortVersionString'] == '1.1.10'
          assert vpn['CFBundleVersion'] == '18'
          assert len(assets) > 1000
          for feature in (
              b'NextMultiBrowser.importedURLQueue.values',
              b'NMB_IMPORTED_URL_QUEUE_MANUAL_BATCHES_115',
              b'Load Next Random Batch',
              b'Imported URL Queue',
              b'playsinline',
              b'webkitbeginfullscreen',
              b'Randomize Environment',
              b'Randomize All Now',
              b'NextMultiBrowser.autoRandomizeEnvironmentSeconds',
              b'NextMultiBrowser.environmentRandomizationMode',
              b'Device Mode ',
              b'Random iPhone devices',
              b'Random Android phones',
              b'Random Windows Chrome or macOS Safari',
              b'Random iOS, Android, Windows, and macOS',
              b'Auto Randomize',
              b'NMB_MANUAL_DESKTOP_AUTOMATIC_ENVIRONMENT_114',
              b'NMB_APPLE_PASSWORD_AUTOFILL_116',
              b'NMB_APPLE_EMAIL_AUTOFILL_FOCUS_REFRESH_117',
              b'NMB_IPAD_PRO_129_PORTRAIT_LANDSCAPE_118',
              b'current-password',
              b'new-password',
              b'one-time-code',
              b'Macintosh; Intel Mac OS X 10_15_7',
              b'Windows NT 10.0; Win64; x64',
          ):
              assert feature in binary, feature
          for removed_feature in (
              b'NextMultiBrowser.randomURLInputs',
              b'Four URLs Required',
          ):
              assert removed_feature not in binary, removed_feature
          PY
      - name: Check out NS Transfer publication target
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: main
          path: ns-transfer
          fetch-depth: 0
      - name: Publish verified TIPA to NS Transfer
        if: github.event_name != 'pull_request'
        working-directory: ns-transfer
        shell: bash
        run: |
          set -euo pipefail
          TIPA="$GITHUB_WORKSPACE/apps/next-multi-browser/NextMultiBrowser_1.1.10_Device_Category_Modes.tipa"
          IPA="$GITHUB_WORKSPACE/apps/next-multi-browser/NextMultiBrowser_1.1.10_Device_Category_Modes.ipa"
          DEST_DIR="transfer/files/NextMultiBrowser/1.1.10"
          FILE_NAME="NextMultiBrowser_1.1.10_Device_Category_Modes.tipa"
          IPA_FILE_NAME="NextMultiBrowser_1.1.10_Device_Category_Modes.ipa"
          mkdir -p "$DEST_DIR"
          cp "$TIPA" "$DEST_DIR/$FILE_NAME"
          cp "$IPA" "$DEST_DIR/$IPA_FILE_NAME"

          python3 - "$TIPA" <<'PY'
          import hashlib
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          tipa = Path(sys.argv[1])
          sha256 = hashlib.sha256(tipa.read_bytes()).hexdigest()
          size = tipa.stat().st_size
          path = Path('transfer/index.json')
          data = json.loads(path.read_text())
          current = []
          for item in data.get('files', []):
              item_id = str(item.get('id', '')).lower()
              file_name = str(item.get('fileName', '')).lower()
              if item_id.startswith('nextmultibrowser-') or file_name.startswith('nextmultibrowser_'):
                  continue
              current.append(item)

          entry = {
              'id': 'nextmultibrowser-1.1.10-device-category-modes',
              'name': 'Next Multi Browser 1.1.10 — Device Category Modes',
              'fileName': 'NextMultiBrowser_1.1.10_Device_Category_Modes.tipa',
              'type': 'tipa',
              'platform': 'TrollStore / RootHide / iOS 15+',
              'version': '1.1.10 (18)',
              'url': 'https://nextsolution.cc/transfer/files/NextMultiBrowser/1.1.10/NextMultiBrowser_1.1.10_Device_Category_Modes.tipa',
              'ipaUrl': 'https://nextsolution.cc/transfer/files/NextMultiBrowser/1.1.10/NextMultiBrowser_1.1.10_Device_Category_Modes.ipa',
              'sha256': sha256,
              'sizeBytes': size,
              'notes': 'Adds four global environment device modes to the main Random Environment control: iOS Mode assigns random iPhone presets, Android Mode assigns random Android phones, PC / Mac Mode mixes Windows Chrome and macOS Safari desktop presets, and Mixed Mode combines all categories. Selecting a mode immediately randomizes all 20 profiles, and the saved Auto Randomize timer continues using that selected mode. Cookies, Google logins, persistent website data, profile isolation, iPad Pro layout, URL queue, AutoFill, auto refresh, and VPN features remain intact.'
          }
          data['files'] = [entry] + current
          data['updatedAt'] = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')
          print(f'SHA-256: {sha256}')
          print(f'Size: {size}')
          PY

          python3 -m json.tool transfer/index.json >/dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          printf '%s\n' "Next Multi Browser 1.1.10 published $(date -u +%Y-%m-%dT%H:%M:%SZ)" > transfer/deploy-trigger.txt
          git add transfer/index.json transfer/deploy-trigger.txt "$DEST_DIR/$FILE_NAME" "$DEST_DIR/$IPA_FILE_NAME"
          git diff --cached --stat
          git commit -m 'Publish Next Multi Browser 1.1.10 to NS Transfer'
          git pull --rebase origin main
          git push origin HEAD:main