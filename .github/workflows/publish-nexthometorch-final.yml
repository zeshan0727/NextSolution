name: Final Build and Publish Next Home Torch

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-nexthometorch-final-1.0.0
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: brew install dpkg ldid xz zstd
      - name: Source and deterministic validation
        shell: bash
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/2026-07-31-NextHomeTorch"
          test -f "$P/Tweak.xm"; test -f "$P/control"; test -f "$P/Preferences/Resources/Root.plist"
          grep -q '%hook SBIconListView' "$P/Tweak.xm"
          grep -q 'touchCount == 2' "$P/Tweak.xm"
          grep -q 'touch.tapCount != 1' "$P/Tweak.xm"
          grep -q 'touch.phase != UITouchPhaseEnded' "$P/Tweak.xm"
          grep -q 'SBUIFlashlightController' "$P/Tweak.xm"
          grep -q 'respondsToSelector:levelSelector' "$P/Tweak.xm"
          grep -q 'respondsToSelector:setLevelSelector' "$P/Tweak.xm"
          grep -q '%orig' "$P/Tweak.xm"
          grep -q 'Enable Next Home Torch' "$P/Preferences/Resources/Root.plist"
          test "$(grep -c '<string>PSSwitchCell</string>' "$P/Preferences/Resources/Root.plist")" -eq 1
          plutil -lint "$P/Preferences/Resources/Root.plist"
          python3 - <<'PY'
          def accepts(count, phases, taps, enabled=True, controller=True):
              ok=count==2 and len(phases)==2 and len(taps)==2
              return enabled and controller and ok and all(p=='ended' for p in phases) and all(t==1 for t in taps)
          assert accepts(2,['ended','ended'],[1,1])
          assert not accepts(1,['ended'],[1])
          assert not accepts(3,['ended']*3,[1]*3)
          assert not accepts(2,['ended','ended'],[1,2])
          assert not accepts(2,['moved','ended'],[1,1])
          assert not accepts(2,['ended','ended'],[1,1],False)
          assert not accepts(2,['ended','ended'],[1,1],True,False)
          PY
      - name: Build both variants
        shell: bash
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/2026-07-31-NextHomeTorch"
          O="$RUNNER_TEMP/out"; mkdir -p "$O"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos-rootless"
          export THEOS="$RUNNER_TEMP/theos-rootless" THEOS_PACKAGE_SCHEME=rootless
          rm -rf "$P/packages"; make -C "$P" clean package FINALPACKAGE=1
          D="$(find "$P/packages" -name '*_iphoneos-arm64.deb' -print -quit)"; test -n "$D"
          cp "$D" "$O/NextHomeTorch_1.0.0_Rootless.deb"
          git init "$RUNNER_TEMP/theos-roothide"
          git -C "$RUNNER_TEMP/theos-roothide" remote add origin https://github.com/roothide/theos.git
          git -C "$RUNNER_TEMP/theos-roothide" fetch --depth 1 origin 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$RUNNER_TEMP/theos-roothide" checkout --detach FETCH_HEAD
          git -C "$RUNNER_TEMP/theos-roothide" submodule update --init --recursive --depth 1
          sed -i '' 's/^Architecture: iphoneos-arm64$/Architecture: iphoneos-arm64e/' "$P/control"
          export THEOS="$RUNNER_TEMP/theos-roothide" THEOS_PACKAGE_SCHEME=roothide
          rm -rf "$P/packages"; make -C "$P" clean package FINALPACKAGE=1
          D="$(find "$P/packages" -name '*_iphoneos-arm64e.deb' -print -quit)"; test -n "$D"
          cp "$D" "$O/NextHomeTorch_1.0.0_RootHide.deb"
      - name: Inspect packages
        shell: bash
        run: |
          set -euo pipefail
          O="$RUNNER_TEMP/out"
          for spec in "Rootless iphoneos-arm64" "RootHide iphoneos-arm64e"; do
            set -- $spec; deb="$O/NextHomeTorch_1.0.0_$1.deb"; arch="$2"; x="$(mktemp -d)"
            test "$(dpkg-deb -f "$deb" Package)" = com.nextsolution.nexthometorch
            test "$(dpkg-deb -f "$deb" Version)" = 1.0.0
            test "$(dpkg-deb -f "$deb" Architecture)" = "$arch"
            dpkg-deb -f "$deb" Depends | grep -q preferenceloader
            dpkg-deb -x "$deb" "$x"
            test -n "$(find "$x" -name NextHomeTorch.dylib -print -quit)"
            test -n "$(find "$x" -name NextHomeTorch.plist -path '*MobileSubstrate*' -print -quit)"
            test -n "$(find "$x" -name NextHomeTorchPreferences.bundle -type d -print -quit)"
            test -n "$(find "$x" -name NextHomeTorch.plist -path '*PreferenceLoader*' -print -quit)"
            grep -R -q 'Enable Next Home Torch' "$x"
            rm -rf "$x"
          done
          md5 "$O"/*.deb
          shasum "$O"/*.deb
          shasum -a 256 "$O"/*.deb
      - name: Publish packages and repository indexes
        shell: bash
        run: |
          set -euo pipefail
          O="$RUNNER_TEMP/out"
          git config user.name 'Next Solution Build Bot'
          git config user.email actions@users.noreply.github.com
          git fetch origin main; git reset --hard origin/main
          mkdir -p debfiles depictions "$RUNNER_TEMP/scan"
          cp "$O"/*.deb debfiles/; cp "$O"/*.deb "$RUNNER_TEMP/scan/"
          dpkg-scanpackages -m "$RUNNER_TEMP/scan" /dev/null > "$RUNNER_TEMP/stanzas"
          sed -i '' 's|^Filename: .*/scan/|Filename: ./debfiles/|' "$RUNNER_TEMP/stanzas"
          python3 - "$RUNNER_TEMP/stanzas" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path('Packages'); old=p.read_text() if p.exists() else ''
          st=[s.strip() for s in re.split(r'\n\s*\n',old) if s.strip()]
          st=[s for s in st if not re.search(r'^Package: com\.nextsolution\.nexthometorch$',s,re.M)]
          new=[s.strip() for s in re.split(r'\n\s*\n',Path(sys.argv[1]).read_text()) if s.strip()]
          p.write_text('\n\n'.join(st+new)+'\n')
          PY
          test "$(grep -c '^Package: com.nextsolution.nexthometorch$' Packages)" -eq 2
          gzip -9 -c Packages > Packages.gz
          bzip2 -9 -c Packages > Packages.bz2
          xz -9e -c Packages > Packages.xz
          zstd -19 -q -c Packages > Packages.zst
          cat > depictions/nexthometorch.html <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Next Home Torch 1.0.0</title><style>body{font-family:-apple-system;margin:0;padding:24px;background:#07111f;color:#fff;line-height:1.6}.card{max-width:720px;margin:auto;padding:24px;border:1px solid #334;border-radius:24px;background:#121c32}a{color:#64d8ff}</style></head><body><main class="card"><h1>Next Home Torch 1.0.0</h1><p>Toggle the flashlight with a single two-finger tap on empty Home Screen space.</p><p>iOS 15+, RootHide and rootless. Includes one simple Enable switch.</p><p><strong>Build-validated; awaiting physical-device testing.</strong></p><a href="https://nextsolution.cc/">Next Solution Repo</a></main></body></html>
          HTML
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import re
          p=Path('Release'); t=p.read_text()
          m=re.search(r'^Version: 1\.0\.(\d+)$',t,re.M); n=(int(m.group(1))+1) if m else 1
          t=re.sub(r'^Version: .*$',f'Version: 1.0.{n}',t,flags=re.M)
          t=re.sub(r'^Date: .*$',f'Date: {datetime.now(timezone.utc).strftime("%a, %d %b %Y %H:%M:%S UTC")}',t,flags=re.M)
          t=re.sub(r'^Icon: .*$', 'Icon: https://nextsolution.cc/CydiaIcon.png',t,flags=re.M)
          p.write_text(t)
          PY
          git add debfiles/NextHomeTorch_1.0.0_Rootless.deb debfiles/NextHomeTorch_1.0.0_RootHide.deb Packages Packages.gz Packages.bz2 Packages.xz Packages.zst Release depictions/nexthometorch.html
          git diff --cached --check
          git commit -m 'Publish Next Home Torch 1.0.0'
          git push origin HEAD:main
