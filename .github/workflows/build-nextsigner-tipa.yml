name: Build Next Signer TIPA

on:
  workflow_dispatch:
  push:
    branches:
      - feature/nextsigner-1.0
      - feature/nextsigner-local-signing
    paths:
      - 'NextSigner/**'
      - '.github/workflows/build-nextsigner-tipa.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'NextSigner/**'
      - '.github/workflows/build-nextsigner-tipa.yml'
      - '.github/workflows/nextsigner-sign-publish.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Zsign bridge sources
        run: |
          set -euo pipefail
          rm -rf NextSigner/Vendor/Zsign-Package
          git clone --depth 1 --branch package https://github.com/claration/Zsign-Package.git NextSigner/Vendor/Zsign-Package
          # Patch the upstream Objective-C++ bridge for the current headers/API and
          # make the optional Swift completion callback genuinely optional.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('NextSigner/Vendor/Zsign-Package/swift/zsign.mm')
          s = p.read_text()
          s = s.replace('void(^completionHandler)(BOOL success, NSError *error)',
                        'void(^completionHandler)(BOOL success)')
          old = 'bundle.SignFolder(&zsa, strFolder, strBundleId, strBundleVersion, strDisplayName, arrDylibFiles, bForce, bWeakInject, bEnableCache, excludeprovion)'
          new = 'bundle.SignFolder(&zsa, strFolder, strBundleId, strBundleVersion, strDisplayName, arrDylibFiles, arrDisDylibFiles, bForce, bWeakInject, bEnableCache, excludeprovion)'
          if old not in s:
              raise SystemExit('Expected stale SignFolder bridge call not found')
          s = s.replace(old, new)
          s = s.replace('completionHandler(bRet);', 'if (completionHandler) { completionHandler(bRet); }')
          p.write_text(s)
          PY

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: NextSigner
        run: xcodegen generate

      - name: Build unsigned iPhone app
        working-directory: NextSigner
        run: |
          set -euo pipefail
          xcodebuild \
            -project NextSigner.xcodeproj \
            -scheme NextSigner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/NextSignerDerived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA and TIPA
        run: |
          set -euo pipefail
          APP_PATH="$(find "$RUNNER_TEMP/NextSignerDerived/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name '*.app' | head -n1)"
          test -n "$APP_PATH" || { echo 'Built .app not found'; exit 1; }
          mkdir -p "$RUNNER_TEMP/package/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/package/Payload/NextSigner.app"
          cd "$RUNNER_TEMP/package"
          /usr/bin/zip -qry "$RUNNER_TEMP/NextSigner-1.1.2.ipa" Payload
          cp "$RUNNER_TEMP/NextSigner-1.1.2.ipa" "$RUNNER_TEMP/NextSigner-1.1.2.tipa"
          shasum -a 256 "$RUNNER_TEMP/NextSigner-1.1.2.ipa" "$RUNNER_TEMP/NextSigner-1.1.2.tipa"

      - name: Upload TIPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NextSigner-1.1.2-TIPA
          path: |
            ${{ runner.temp }}/NextSigner-1.1.2.tipa
            ${{ runner.temp }}/NextSigner-1.1.2.ipa
          if-no-files-found: error
          retention-days: 30
