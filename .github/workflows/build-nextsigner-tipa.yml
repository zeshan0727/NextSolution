name: Build Next Signer TIPA

on:
  workflow_dispatch:
  push:
    branches:
      - feature/nextsigner-1.0
      - feature/nextsigner-local-signing
    paths:
      - 'NextSigner/NextSigner/**'
      - 'NextSigner/project.yml'
      - '.github/workflows/build-nextsigner-tipa.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'NextSigner/**'
      - '.github/workflows/build-nextsigner-tipa.yml'
      - '.github/workflows/nextsigner-sign-publish.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare patched Zsign sources
        run: |
          set -euo pipefail
          rm -rf NextSigner/Vendor/Zsign-Package
          git clone --depth 1 --branch package https://github.com/claration/Zsign-Package.git NextSigner/Vendor/Zsign-Package

          python3 - <<'PY'
          from pathlib import Path

          bridge = Path('NextSigner/Vendor/Zsign-Package/swift/zsign.mm')
          s = bridge.read_text()
          s = s.replace('void(^completionHandler)(BOOL success, NSError *error)',
                        'void(^completionHandler)(BOOL success)')
          old_call = 'bundle.SignFolder(&zsa, strFolder, strBundleId, strBundleVersion, strDisplayName, arrDylibFiles, bForce, bWeakInject, bEnableCache, excludeprovion)'
          new_call = 'bundle.SignFolder(&zsa, strFolder, strBundleId, strBundleVersion, strDisplayName, arrDylibFiles, arrDisDylibFiles, bForce, bWeakInject, bEnableCache, excludeprovion)'
          if old_call not in s:
              raise SystemExit('Expected stale SignFolder bridge call not found')
          s = s.replace(old_call, new_call)
          s = s.replace('completionHandler(bRet);', 'if (completionHandler) { completionHandler(bRet); }')
          bridge.write_text(s)

          bundle = Path('NextSigner/Vendor/Zsign-Package/src/bundle.cpp')
          b = bundle.read_text()
          old = '''if (!pSignAsset->m_strProvData.empty()) {
		if (bRemoveProvision) {
			if (!ZFile::WriteFileV(pSignAsset->m_strProvData, "%s/embedded.mobileprovision", m_strAppFolder.c_str())) { // embedded.mobileprovision'''
          new = '''if (!pSignAsset->m_strProvData.empty()) {
		if (!bRemoveProvision) {
			if (!ZFile::WriteFileV(pSignAsset->m_strProvData, "%s/embedded.mobileprovision", m_strAppFolder.c_str())) { // embedded.mobileprovision'''
          if old not in b:
              raise SystemExit('Expected inverted embedded.mobileprovision condition not found')
          b = b.replace(old, new, 1)
          bundle.write_text(b)
          PY

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: NextSigner
        run: xcodegen generate

      - name: Build unsigned iPhone app
        working-directory: NextSigner
        run: |
          set -euo pipefail
          xcodebuild \
            -project NextSigner.xcodeproj \
            -scheme NextSigner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/NextSignerDerived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA and TIPA
        run: |
          set -euo pipefail
          APP_PATH="$(find "$RUNNER_TEMP/NextSignerDerived/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name '*.app' | head -n1)"
          test -n "$APP_PATH" || { echo 'Built .app not found'; exit 1; }
          mkdir -p "$RUNNER_TEMP/package/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/package/Payload/NextSigner.app"
          cd "$RUNNER_TEMP/package"
          /usr/bin/zip -qry "$RUNNER_TEMP/NextSigner-1.2.1.ipa" Payload
          cp "$RUNNER_TEMP/NextSigner-1.2.1.ipa" "$RUNNER_TEMP/NextSigner-1.2.1.tipa"
          unzip -t "$RUNNER_TEMP/NextSigner-1.2.1.tipa" >/dev/null
          shasum -a 256 "$RUNNER_TEMP/NextSigner-1.2.1.ipa" "$RUNNER_TEMP/NextSigner-1.2.1.tipa"

      - name: Upload TIPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NextSigner-1.2.1-TIPA
          path: |
            ${{ runner.temp }}/NextSigner-1.2.1.tipa
            ${{ runner.temp }}/NextSigner-1.2.1.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish test TIPA to feature branch
        if: success() && github.event_name == 'push' && github.ref_name == 'feature/nextsigner-local-signing'
        shell: bash
        run: |
          set -euo pipefail
          OUT='NextSigner/Builds/1.2.1'
          mkdir -p "$OUT"
          cp "$RUNNER_TEMP/NextSigner-1.2.1.tipa" "$OUT/NextSigner-1.2.1.tipa"
          SHA256=$(shasum -a 256 "$OUT/NextSigner-1.2.1.tipa" | awk '{print $1}')
          printf 'status=success\nrun_id=%s\nsource_sha=%s\nsha256=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$SHA256" > "$OUT/status.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUT/NextSigner-1.2.1.tipa" "$OUT/status.txt"
          git commit -m 'Publish Next Signer 1.2.1 test TIPA' || true
          git pull --rebase origin feature/nextsigner-local-signing
          git push origin HEAD:feature/nextsigner-local-signing

      - name: Publish failure marker
        if: failure() && github.event_name == 'push' && github.ref_name == 'feature/nextsigner-local-signing'
        shell: bash
        run: |
          set -euo pipefail
          OUT='NextSigner/Builds/1.2.1'
          mkdir -p "$OUT"
          printf 'status=failed\nrun_id=%s\nsource_sha=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$OUT/status.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUT/status.txt"
          git commit -m 'Record Next Signer 1.2.1 build failure' || true
          git pull --rebase origin feature/nextsigner-local-signing
          git push origin HEAD:feature/nextsigner-local-signing
