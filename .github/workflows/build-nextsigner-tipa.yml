name: Build Next Signer TIPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/nextsigner-1.0
      - feature/nextsigner-local-signing
    paths:
      - 'NextSigner/**'
      - '.github/workflows/build-nextsigner-tipa.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'NextSigner/**'
      - '.github/workflows/build-nextsigner-tipa.yml'
      - '.github/workflows/nextsigner-sign-publish.yml'
      - '.github/workflows/nextsigner-library-manage.yml'

permissions:
  contents: write

concurrency:
  group: nextsigner-build-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXTSIGNER_VERSION: '1.3.1'
  R2_BUCKET: next-signer-apps
  R2_ACCOUNT_ID: 4fe920e259870b0366118a17cc5727e5
  R2_PUBLIC_BASE: https://files.nextsolution.cc
  AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare patched Zsign sources
        run: |
          set -euo pipefail
          rm -rf NextSigner/Vendor/Zsign-Package
          git clone --depth 1 --branch package https://github.com/claration/Zsign-Package.git NextSigner/Vendor/Zsign-Package

          python3 - <<'PY'
          from pathlib import Path

          bridge = Path('NextSigner/Vendor/Zsign-Package/swift/zsign.mm')
          s = bridge.read_text()
          s = s.replace('void(^completionHandler)(BOOL success, NSError *error)',
                        'void(^completionHandler)(BOOL success)')
          old_call = 'bundle.SignFolder(&zsa, strFolder, strBundleId, strBundleVersion, strDisplayName, arrDylibFiles, bForce, bWeakInject, bEnableCache, excludeprovion)'
          new_call = 'bundle.SignFolder(&zsa, strFolder, strBundleId, strBundleVersion, strDisplayName, arrDylibFiles, arrDisDylibFiles, bForce, bWeakInject, bEnableCache, excludeprovion)'
          if old_call not in s:
              raise SystemExit('Expected stale SignFolder bridge call not found')
          s = s.replace(old_call, new_call)
          s = s.replace('completionHandler(bRet);', 'if (completionHandler) { completionHandler(bRet); }')
          bridge.write_text(s)

          bundle = Path('NextSigner/Vendor/Zsign-Package/src/bundle.cpp')
          b = bundle.read_text()
          old = '''if (!pSignAsset->m_strProvData.empty()) {
\t\tif (bRemoveProvision) {
\t\t\tif (!ZFile::WriteFileV(pSignAsset->m_strProvData, "%s/embedded.mobileprovision", m_strAppFolder.c_str())) { // embedded.mobileprovision'''
          new = '''if (!pSignAsset->m_strProvData.empty()) {
\t\tif (!bRemoveProvision) {
\t\t\tif (!ZFile::WriteFileV(pSignAsset->m_strProvData, "%s/embedded.mobileprovision", m_strAppFolder.c_str())) { // embedded.mobileprovision'''
          if old not in b:
              raise SystemExit('Expected inverted embedded.mobileprovision condition not found')
          b = b.replace(old, new, 1)
          bundle.write_text(b)
          PY

      - name: Generate Next Signer app icon
        run: python3 NextSigner/generate_app_icon.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: NextSigner
        run: xcodegen generate

      - name: Build unsigned iPhone app
        working-directory: NextSigner
        run: |
          set -euo pipefail
          xcodebuild \
            -project NextSigner.xcodeproj \
            -scheme NextSigner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/NextSignerDerived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Verify packaged app icon
        run: |
          set -euo pipefail
          APP_PATH="$(find "$RUNNER_TEMP/NextSignerDerived/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name '*.app' | head -n1)"
          test -n "$APP_PATH" || { echo 'Built .app not found'; exit 1; }
          test -f "$APP_PATH/Assets.car" || { echo 'Compiled asset catalog missing'; exit 1; }

      - name: Package IPA and TIPA
        run: |
          set -euo pipefail
          APP_PATH="$(find "$RUNNER_TEMP/NextSignerDerived/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name '*.app' | head -n1)"
          test -n "$APP_PATH" || { echo 'Built .app not found'; exit 1; }
          rm -rf "$RUNNER_TEMP/package"
          mkdir -p "$RUNNER_TEMP/package/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/package/Payload/NextSigner.app"
          cd "$RUNNER_TEMP/package"
          /usr/bin/zip -qry "$RUNNER_TEMP/NextSigner-${NEXTSIGNER_VERSION}.ipa" Payload
          cp "$RUNNER_TEMP/NextSigner-${NEXTSIGNER_VERSION}.ipa" "$RUNNER_TEMP/NextSigner-${NEXTSIGNER_VERSION}.tipa"
          unzip -t "$RUNNER_TEMP/NextSigner-${NEXTSIGNER_VERSION}.tipa" >/dev/null
          echo "NEXTSIGNER_SHA256=$(shasum -a 256 "$RUNNER_TEMP/NextSigner-${NEXTSIGNER_VERSION}.tipa" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "NEXTSIGNER_SIZE_BYTES=$(stat -f '%z' "$RUNNER_TEMP/NextSigner-${NEXTSIGNER_VERSION}.tipa")" >> "$GITHUB_ENV"

      - name: Upload TIPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NextSigner-1.3.1-TIPA
          path: |
            ${{ runner.temp }}/NextSigner-1.3.1.tipa
            ${{ runner.temp }}/NextSigner-1.3.1.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified TIPA to Cloudflare R2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID" || { echo 'R2 access key missing'; exit 1; }
          test -n "$AWS_SECRET_ACCESS_KEY" || { echo 'R2 secret key missing'; exit 1; }
          python3 -m pip install --quiet boto3
          python3 - <<'PY'
          import boto3, os
          from botocore.config import Config
          version = os.environ['NEXTSIGNER_VERSION']
          source = os.path.join(os.environ['RUNNER_TEMP'], f'NextSigner-{version}.tipa')
          key = f'apps/tipa/NextSigner/{version}/NextSigner-{version}.tipa'
          client = boto3.client(
              's3',
              endpoint_url=f"https://{os.environ['R2_ACCOUNT_ID']}.r2.cloudflarestorage.com",
              aws_access_key_id=os.environ['AWS_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['AWS_SECRET_ACCESS_KEY'],
              region_name='auto',
              config=Config(signature_version='s3v4')
          )
          client.upload_file(source, os.environ['R2_BUCKET'], key, ExtraArgs={
              'ContentType': 'application/octet-stream',
              'CacheControl': 'public, max-age=31536000, immutable'
          })
          PY
          PUBLIC_URL="$R2_PUBLIC_BASE/apps/tipa/NextSigner/$NEXTSIGNER_VERSION/NextSigner-$NEXTSIGNER_VERSION.tipa"
          curl --fail --silent --show-error --location --head --retry 8 --retry-delay 3 --retry-all-errors "$PUBLIC_URL" >/dev/null
          echo "NEXTSIGNER_R2_URL=$PUBLIC_URL" >> "$GITHUB_ENV"

      - name: Update Transfer and build status
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          version = os.environ['NEXTSIGNER_VERSION']
          index = Path('transfer/index.json')
          data = json.loads(index.read_text())
          files = [item for item in data.get('files', []) if not str(item.get('id', '')).startswith('nextsigner-')]
          entry = {
              'id': f'nextsigner-{version}',
              'name': f'Next Signer {version}',
              'fileName': f'NextSigner-{version}.tipa',
              'type': 'tipa',
              'platform': 'TrollStore / iOS 16+',
              'version': version,
              'url': os.environ['NEXTSIGNER_R2_URL'],
              'sha256': os.environ['NEXTSIGNER_SHA256'],
              'sizeBytes': int(os.environ['NEXTSIGNER_SIZE_BYTES']),
              'storage': 'Cloudflare R2',
              'notes': 'Fixes Library deletion 403 using PAT-safe repository dispatch and direct repository catalog verification. Custom signing icons can now be selected from Photos or Files.'
          }
          data['files'] = [entry] + files
          data['updatedAt'] = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          index.write_text(json.dumps(data, indent=2) + '\n')

          status_dir = Path('build-status')
          status_dir.mkdir(exist_ok=True)
          (status_dir / 'nextsigner.json').write_text(json.dumps({
              'version': version,
              'status': 'success',
              'url': os.environ['NEXTSIGNER_R2_URL'],
              'sha256': os.environ['NEXTSIGNER_SHA256'],
              'sizeBytes': int(os.environ['NEXTSIGNER_SIZE_BYTES']),
              'commit': os.environ['GITHUB_SHA'],
              'updatedAt': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          }, indent=2) + '\n')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add transfer/index.json build-status/nextsigner.json
          git commit -m "Publish Next Signer ${NEXTSIGNER_VERSION} through Cloudflare R2"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Record failed build status
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set +e
          mkdir -p build-status
          cat > build-status/nextsigner.json <<EOF
          {
            "version": "$NEXTSIGNER_VERSION",
            "status": "failed",
            "commit": "$GITHUB_SHA"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-status/nextsigner.json
          git commit -m "Record failed Next Signer ${NEXTSIGNER_VERSION} build" || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true
