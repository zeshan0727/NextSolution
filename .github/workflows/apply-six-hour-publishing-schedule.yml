name: Apply unified six-hour publishing schedule

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-six-hour-publishing-schedule.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-six-hour-publishing-schedule
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply unified Qatar publishing cadence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          site_path = Path('automation/site.json')
          site = json.loads(site_path.read_text(encoding='utf-8'))
          p = site['publishing']
          p['max_per_day'] = 4
          p['timezone'] = 'Asia/Qatar'
          p['normal_cron'] = '*/30 * * * *'
          p['windows_local_hours'] = [0, 6, 12, 18]
          site_path.write_text(json.dumps(site, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          publisher_path = Path('automation/publisher.py')
          text = publisher_path.read_text(encoding='utf-8')
          replacements = {
              'if publishing.get("max_per_day") != 3:\n        raise PublishingError("publishing.max_per_day must remain exactly 3 for the regular schedule")':
              'if publishing.get("max_per_day") != 4:\n        raise PublishingError("publishing.max_per_day must remain exactly 4 for the regular six-hour schedule")',
              '"publishing.windows_local_hours must contain three unique sorted local hours"':
              '"publishing.windows_local_hours must contain four unique sorted local hours"',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'publisher patch anchor not found: {old[:80]}')
              text = text.replace(old, new, 1)
          publisher_path.write_text(text, encoding='utf-8')

          workflow_path = Path('.github/workflows/tweak-draft-generator.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          workflow = workflow.replace(
              '# Self-healing check. Policy publishes only unmet 06:00, 14:00, or 22:00 Qatar windows.',
              '# Self-healing check every 30 minutes. Policy publishes only unmet 00:00, 06:00, 12:00, or 18:00 Qatar windows.'
          )
          workflow_path.write_text(workflow, encoding='utf-8')

          original_path = Path('.github/workflows/ios-repo-original-source-news.yml')
          original = original_path.read_text(encoding='utf-8')
          old_schedule = '''  schedule:\n    - cron: "30 8 * * *"\n    - cron: "0 17 * * *"\n'''
          if old_schedule not in original:
              old_schedule = '''  schedule:\n    # 08:30 UTC = 11:30 Qatar\n    - cron: "30 8 * * *"\n    # 17:00 UTC = 20:00 Qatar\n    - cron: "0 17 * * *"\n'''
          if old_schedule in original:
              original = original.replace(old_schedule, '', 1)
          else:
              raise SystemExit('original-source schedule block not found')
          original_path.write_text(original, encoding='utf-8')

          test_path = Path('automation/tests/test_publisher.py')
          tests = test_path.read_text(encoding='utf-8')
          tests = tests.replace('cls.site["publishing"]["max_per_day"] = 3', 'cls.site["publishing"]["max_per_day"] = 4')
          tests = tests.replace('def test_preflight_allows_three_per_day_after_boost', 'def test_preflight_allows_four_per_day_after_boost')
          tests = tests.replace('self.assertEqual(ready.max_today, 3)', 'self.assertEqual(ready.max_today, 4)')
          tests = tests.replace('self.assertEqual(ready.max_today, 3)', 'self.assertEqual(ready.max_today, 4)')
          # Add a fourth create before checking the daily limit in the post-boost test.
          anchor = 'audit["events"].append({"published_at": "2026-08-17T19:10:00+00:00"})\n        blocked = preflight(self.site, audit, now=after_boost)'
          if anchor in tests:
              tests = tests.replace(
                  anchor,
                  'audit["events"].append({"published_at": "2026-08-17T15:10:00+00:00"})\n        still_ready = preflight(self.site, audit, now=after_boost)\n        self.assertTrue(still_ready.allowed)\n\n        audit["events"].append({"published_at": "2026-08-17T19:10:00+00:00"})\n        blocked = preflight(self.site, audit, now=after_boost)',
                  1,
              )
          test_path.write_text(tests, encoding='utf-8')

          readme_path = Path('automation/README.md')
          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace(
              'The publisher workflow runs three times per day at 06:00, 14:00, and 22:00 Qatar\ntime. It first checks a committed kill switch and the three-new-pages-per-day',
              'The publisher workflow uses four six-hour publication windows at 00:00, 06:00, 12:00, and 18:00 Qatar\ntime. A self-healing check runs every 30 minutes to recover a missed window. It first checks a committed kill switch and the four-new-pages-per-day'
          )
          readme_path.write_text(readme, encoding='utf-8')
          PY

      - name: Validate publisher schedule
        run: |
          python3 -m py_compile automation/publisher.py
          python3 -m unittest automation.tests.test_publisher -v

      - name: Commit schedule update
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Six-hour schedule already applied."
            exit 0
          fi
          git config user.name "nextsolution-schedule[bot]"
          git config user.email "nextsolution-schedule[bot]@users.noreply.github.com"
          git add -- automation/site.json automation/publisher.py automation/tests/test_publisher.py automation/README.md .github/workflows/tweak-draft-generator.yml .github/workflows/ios-repo-original-source-news.yml
          git commit -m "Publish on four six-hour Qatar windows"
          git pull --rebase origin main
          git push origin HEAD:main
