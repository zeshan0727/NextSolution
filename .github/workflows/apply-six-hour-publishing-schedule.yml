name: Apply unified six-hour publishing schedule

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-six-hour-publishing-schedule.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply four-window policy
        shell: bash
        run: |
          python3 -c "import json,pathlib; p=pathlib.Path('automation/site.json'); d=json.loads(p.read_text()); x=d['publishing']; x['enabled']=True; x['max_per_day']=4; x['timezone']='Asia/Qatar'; x['normal_cron']='*/30 * * * *'; x['windows_local_hours']=[0,6,12,18]; p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')"
          python3 -c "from pathlib import Path; p=Path('automation/publisher.py'); s=p.read_text(); s=s.replace('if publishing.get(\"max_per_day\") != 3:\n        raise PublishingError(\"publishing.max_per_day must remain exactly 3 for the regular schedule\")','if publishing.get(\"max_per_day\") != 4:\n        raise PublishingError(\"publishing.max_per_day must remain exactly 4 for the regular six-hour schedule\")'); s=s.replace('publishing.windows_local_hours must contain three unique sorted local hours','publishing.windows_local_hours must contain four unique sorted local hours'); p.write_text(s)"
          python3 -c "from pathlib import Path; p=Path('.github/workflows/tweak-draft-generator.yml'); s=p.read_text(); s=s.replace('Policy publishes only unmet 06:00, 14:00, or 22:00 Qatar windows.','Policy publishes only unmet 00:00, 06:00, 12:00, or 18:00 Qatar windows.'); p.write_text(s)"
          grep -q 'max_per_day\") != 4' automation/publisher.py
          grep -q '"max_per_day": 4' automation/site.json
          python3 -m py_compile automation/publisher.py

      - name: Commit schedule update
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Six-hour schedule already applied."
            exit 0
          fi
          git config user.name "nextsolution-schedule[bot]"
          git config user.email "nextsolution-schedule[bot]@users.noreply.github.com"
          git add -- automation/site.json automation/publisher.py .github/workflows/tweak-draft-generator.yml
          git commit -m "Enable four six-hour Qatar publishing windows"
          git pull --rebase origin main
          git push origin HEAD:main
