name: Build Next Reminder 1.3.19 Live Activity and Email Schedules

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Validate 1.3.19 sources
        shell: bash
        run: |
          set -euo pipefail
          P=NextReminderApp
          grep -q 'ScheduledEmailFrequency' "$P/NextReminder/Sources/ScheduledEmails.swift"
          grep -q 'case quarterly' "$P/NextReminder/Sources/ScheduledEmails.swift"
          grep -q 'EmailSchedulesView' "$P/NextReminder/Sources/ScheduledEmails.swift"
          grep -q 'ReminderLiveActivityManager' "$P/NextReminder/Sources/ReminderLiveActivityManager.swift"
          grep -q 'ActivityConfiguration' "$P/NextReminderLiveActivity/NextReminderLiveActivity.swift"
          grep -q 'Completed' "$P/NextReminderLiveActivity/NextReminderLiveActivity.swift"
          grep -q 'Extend 10m' "$P/NextReminderLiveActivity/NextReminderLiveActivity.swift"
          grep -q 'NSSupportsLiveActivities' "$P/ci/patch_v149.py"
          grep -q 'NextReminderLiveActivity' "$P/ci/patch_v149.py"
          grep -q '1.3.19' "$P/ci/adjust_build_v149.py"
          grep -q "grep -qx '29'" "$P/ci/adjust_build_v149.py"

      - name: Build Next Reminder 1.3.19
        shell: bash
        run: |
          set -o pipefail
          chmod +x NextReminderApp/ci/build-v149.sh
          NextReminderApp/ci/build-v149.sh 2>&1 | tee v149-app-build.log

      - name: Verify app and Live Activity extension
        shell: bash
        run: |
          set -euo pipefail
          APP=NextReminderApp/build/NextReminder.app
          TIPA=NextReminderApp/NextReminder-v1.3.19-unsigned.tipa
          test -f "$TIPA"
          unzip -t "$TIPA" >/dev/null
          plutil -extract CFBundleShortVersionString raw "$APP/Info.plist" | grep -qx '1.3.19'
          plutil -extract CFBundleVersion raw "$APP/Info.plist" | grep -qx '29'
          plutil -extract NSSupportsLiveActivities raw "$APP/Info.plist" | grep -qx 'true'
          EXT="$APP/PlugIns/NextReminderLiveActivity.appex"
          test -d "$EXT"
          test -x "$EXT/NextReminderLiveActivity"
          plutil -extract CFBundleShortVersionString raw "$EXT/Info.plist" | grep -qx '1.3.19'
          strings -a "$APP/NextReminder" | grep -q 'Email Schedules'
          strings -a "$APP/NextReminder" | grep -q 'Extend 10 Minutes'
          strings -a "$EXT/NextReminderLiveActivity" | grep -q 'Completed'
          strings -a "$EXT/NextReminderLiveActivity" | grep -q 'Extend 10m'
          mkdir -p "$RUNNER_TEMP/next-reminder-v149"
          cp "$TIPA" "$RUNNER_TEMP/next-reminder-v149/NextReminder-v1.3.19-LiveActivity-EmailSchedules.tipa"
          cp NextReminderApp/NextReminder-v1.3.19-unsigned.tipa.sha256 "$RUNNER_TEMP/next-reminder-v149/NextReminder-v1.3.19-SHA256.txt"
          ditto -c -k --sequesterRsrc --keepParent NextReminderApp "$RUNNER_TEMP/next-reminder-v149/NextReminder-v1.3.19-Source.zip"

      - name: Upload final package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NextReminder-v1.3.19-LiveActivity-EmailSchedules
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/next-reminder-v149/NextReminder-v1.3.19-LiveActivity-EmailSchedules.tipa
            ${{ runner.temp }}/next-reminder-v149/NextReminder-v1.3.19-SHA256.txt
            ${{ runner.temp }}/next-reminder-v149/NextReminder-v1.3.19-Source.zip
            v149-app-build.log
            NextReminderApp/xcodebuild.log
