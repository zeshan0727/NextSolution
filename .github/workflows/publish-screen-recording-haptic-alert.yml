name: Build and Publish Screen Recording Haptic Alert

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-screen-recording-haptic-alert.yml"

permissions:
  contents: write

concurrency:
  group: screen-recording-haptic-alert-1.0.0
  cancel-in-progress: false

jobs:
  build-validate-publish:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Install tools
        run: brew install dpkg ldid xz zstd
      - name: Validate source and deterministic logic
        shell: bash
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/2026-08-03-ScreenRecordingHapticAlert"
          python3 "$P/tests/test_decision.py"
          for f in Tweak.xm Makefile control ScreenRecordingHapticAlert.plist Preferences/Makefile Preferences/SRHRootListController.h Preferences/SRHRootListController.m Preferences/Resources/Root.plist Preferences/Resources/Info.plist layout/Library/PreferenceLoader/Preferences/ScreenRecordingHapticAlert.plist README.md; do test -f "$P/$f"; done
          grep -q '^Version: 1.0.0$' "$P/control"
          grep -q 'UIScreenCapturedDidChangeNotification' "$P/Tweak.xm"
          grep -q 'SRHShouldPlay' "$P/Tweak.xm"
          grep -q 'SRHCaptureObserver' "$P/Tweak.xm"
          grep -q 'com.apple.springboard' "$P/ScreenRecordingHapticAlert.plist"
          grep -q 'Enable Haptic Alert' "$P/Preferences/Resources/Root.plist"
          plutil -lint "$P/Preferences/Resources/Root.plist"
          plutil -lint "$P/Preferences/Resources/Info.plist"
      - name: Build rootless
        shell: bash
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/2026-08-03-ScreenRecordingHapticAlert"; O="$RUNNER_TEMP/srh"; mkdir -p "$O"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos-rootless"
          export THEOS="$RUNNER_TEMP/theos-rootless" THEOS_PACKAGE_SCHEME=rootless
          make -C "$P" clean package FINALPACKAGE=1
          D="$(find "$P/packages" -name '*_iphoneos-arm64.deb' -print -quit)"; test -n "$D"; cp "$D" "$O/ScreenRecordingHapticAlert_1.0.0_Rootless.deb"
      - name: Build RootHide
        shell: bash
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/2026-08-03-ScreenRecordingHapticAlert"; O="$RUNNER_TEMP/srh"
          git init "$RUNNER_TEMP/theos-roothide"; git -C "$RUNNER_TEMP/theos-roothide" remote add origin https://github.com/roothide/theos.git
          git -C "$RUNNER_TEMP/theos-roothide" fetch --depth 1 origin 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$RUNNER_TEMP/theos-roothide" checkout --detach 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$RUNNER_TEMP/theos-roothide" submodule update --init --recursive --depth 1
          sed -i '' 's/^Architecture: iphoneos-arm64$/Architecture: iphoneos-arm64e/' "$P/control"
          export THEOS="$RUNNER_TEMP/theos-roothide" THEOS_PACKAGE_SCHEME=roothide
          rm -rf "$P/packages"; make -C "$P" clean package FINALPACKAGE=1
          D="$(find "$P/packages" -name '*_iphoneos-arm64e.deb' -print -quit)"; test -n "$D"; cp "$D" "$O/ScreenRecordingHapticAlert_1.0.0_RootHide.deb"
      - name: Validate package layouts and record diagnostics
        shell: bash
        run: |
          set -euo pipefail
          O="$RUNNER_TEMP/srh"; LOG="$RUNNER_TEMP/srh-build-diagnostics.txt"; : > "$LOG"
          check(){ d="$1"; a="$2"; x="$(mktemp -d)"; dpkg-deb -I "$d" >> "$LOG"; dpkg-deb -c "$d" >> "$LOG"; test "$(dpkg-deb -f "$d" Package)" = com.nextsolution.screenrecordinghapticalert; test "$(dpkg-deb -f "$d" Version)" = 1.0.0; test "$(dpkg-deb -f "$d" Architecture)" = "$a"; dpkg-deb -x "$d" "$x"; find "$x" -name ScreenRecordingHapticAlert.dylib | grep -q .; find "$x" -path '*ScreenRecordingHapticAlertPreferences.bundle/Root.plist' | grep -q .; find "$x" -path '*PreferenceLoader/Preferences/ScreenRecordingHapticAlert.plist' | grep -q .; strings "$(find "$x" -name ScreenRecordingHapticAlert.dylib -print -quit)" | grep -q UIScreenCapturedDidChangeNotification; rm -rf "$x"; }
          check "$O/ScreenRecordingHapticAlert_1.0.0_Rootless.deb" iphoneos-arm64
          check "$O/ScreenRecordingHapticAlert_1.0.0_RootHide.deb" iphoneos-arm64e
          shasum -a 256 "$O"/*.deb | tee -a "$LOG"
          cp "$LOG" "$O/build-diagnostics.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: screen-recording-haptic-alert-build-diagnostics
          path: ${{ runner.temp }}/srh/build-diagnostics.txt
      - name: Publish packages and indexes
        shell: bash
        run: |
          set -euo pipefail
          O="$RUNNER_TEMP/srh"; git config user.name "Next Jailbreak Build Bot"; git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main; git reset --hard origin/main
            mkdir -p debfiles "$RUNNER_TEMP/srh-scan"; cp "$O"/*.deb debfiles/; cp "$O"/*.deb "$RUNNER_TEMP/srh-scan/"
            dpkg-scanpackages -m "$RUNNER_TEMP/srh-scan" /dev/null > "$RUNNER_TEMP/srh-stanzas"
            sed -i '' 's|^Filename: .*/srh-scan/|Filename: ./debfiles/|' "$RUNNER_TEMP/srh-stanzas"
            python3 - "$RUNNER_TEMP/srh-stanzas" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path('Packages'); old=p.read_text() if p.exists() else ''
          rows=[x.strip() for x in re.split(r'\n\s*\n',old) if x.strip()]
          rows=[x for x in rows if not re.search(r'^Package: com\.nextsolution\.screenrecordinghapticalert$',x,re.M)]
          new=[x.strip() for x in re.split(r'\n\s*\n',Path(sys.argv[1]).read_text()) if x.strip()]
          p.write_text('\n\n'.join(rows+new)+'\n')
          PY
            gzip -9 -c Packages > Packages.gz; bzip2 -9 -c Packages > Packages.bz2; xz -9e -c Packages > Packages.xz; zstd -19 -q -c Packages > Packages.zst
            python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import re
          p=Path('Release'); t=p.read_text(); m=re.search(r'^Version: (\d+)\.(\d+)\.(\d+)$',t,re.M)
          if m: t=re.sub(r'^Version: .*$',f'Version: {m.group(1)}.{m.group(2)}.{int(m.group(3))+1}',t,flags=re.M)
          t=re.sub(r'^Date: .*$', 'Date: '+datetime.now(timezone.utc).strftime('%a, %d %b %Y %H:%M:%S UTC'),t,flags=re.M); p.write_text(t)
          PY
            git add debfiles/ScreenRecordingHapticAlert_1.0.0_Rootless.deb debfiles/ScreenRecordingHapticAlert_1.0.0_RootHide.deb Packages Packages.gz Packages.bz2 Packages.xz Packages.zst Release
            git diff --cached --check; git commit -m "Publish Screen Recording Haptic Alert 1.0.0"
            git push origin HEAD:main && exit 0
            sleep $((attempt*3))
          done
          exit 1
