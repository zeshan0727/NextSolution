name: Fix article social previews

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-article-social-previews.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: fix-article-social-previews
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch article preview logic and NextPost cache busting
        run: python3 -c "import base64; exec(base64.b64decode(''))"

      - name: Regenerate all article routes
        run: python3 automation/clean_urls.py

      - name: Validate article-specific previews
        run: python3 -c "import base64; exec(base64.b64decode(''))"

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m 'Use article topic images for NextPost social previews'
          git pull --rebase origin main
          git push origin main
