name: Build and Publish Home Screen Flashlight 1.0.3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-nexthometorch-1.0.1.yml"

permissions:
  contents: write

concurrency:
  group: nextsolution-home-screen-flashlight-1.0.3
  cancel-in-progress: false

jobs:
  build-validate-publish:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Install tools
        run: brew install dpkg ldid xz zstd
      - name: Validate source and proven gesture path
        shell: bash
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/2026-07-31-NextHomeTorch"
          for f in Tweak.xm NextHomeTorch.plist control Makefile Preferences/Makefile Preferences/NHTRootListController.m Preferences/Resources/Root.plist Preferences/Resources/Info.plist layout/Library/PreferenceLoader/Preferences/NextHomeTorch.plist; do test -f "$P/$f"; done
          grep -q '^Name: Home Screen Flashlight$' "$P/control"
          grep -q '^Version: 1.0.3$' "$P/control"
          grep -q '%hook SBIconListView' "$P/Tweak.xm"
          grep -q 'tapCount == 2' "$P/Tweak.xm"
          grep -q 'HSFToggleUsingAVFoundation' "$P/Tweak.xm"
          grep -q 'AVCaptureDevice' "$P/Tweak.xm"
          grep -q 'AVFoundation' "$P/Makefile"
          grep -q 'Enable Home Screen Flashlight' "$P/Preferences/Resources/Root.plist"
          grep -q 'Home Screen Flashlight' "$P/layout/Library/PreferenceLoader/Preferences/NextHomeTorch.plist"
          grep -q '<string>1.0.3</string>' "$P/Preferences/Resources/Info.plist"
          plutil -lint "$P/Preferences/Resources/Root.plist"
          plutil -lint "$P/Preferences/Resources/Info.plist"
          plutil -lint "$P/layout/Library/PreferenceLoader/Preferences/NextHomeTorch.plist"
      - name: Build rootless
        shell: bash
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/2026-07-31-NextHomeTorch"; OUT="$RUNNER_TEMP/hsf-release"; mkdir -p "$OUT"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos-rootless"
          export THEOS="$RUNNER_TEMP/theos-rootless" THEOS_PACKAGE_SCHEME=rootless
          rm -rf "$P/packages"; make -C "$P" clean package FINALPACKAGE=1
          D="$(find "$P/packages" -name '*_iphoneos-arm64.deb' -print -quit)"; test -n "$D"; cp "$D" "$OUT/HomeScreenFlashlight_1.0.3_Rootless.deb"
      - name: Build RootHide
        shell: bash
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/2026-07-31-NextHomeTorch"; OUT="$RUNNER_TEMP/hsf-release"
          git init "$RUNNER_TEMP/theos-roothide"; git -C "$RUNNER_TEMP/theos-roothide" remote add origin https://github.com/roothide/theos.git
          git -C "$RUNNER_TEMP/theos-roothide" fetch --depth 1 origin 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$RUNNER_TEMP/theos-roothide" checkout --detach 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$RUNNER_TEMP/theos-roothide" submodule update --init --recursive --depth 1
          sed -i '' 's/^Architecture: iphoneos-arm64$/Architecture: iphoneos-arm64e/' "$P/control"
          export THEOS="$RUNNER_TEMP/theos-roothide" THEOS_PACKAGE_SCHEME=roothide
          rm -rf "$P/packages"; make -C "$P" clean package FINALPACKAGE=1
          D="$(find "$P/packages" -name '*_iphoneos-arm64e.deb' -print -quit)"; test -n "$D"; cp "$D" "$OUT/HomeScreenFlashlight_1.0.3_RootHide.deb"
      - name: Validate packages
        shell: bash
        run: |
          set -euo pipefail
          check(){ d="$1"; a="$2"; x="$(mktemp -d)"; test "$(dpkg-deb -f "$d" Package)" = com.nextsolution.nexthometorch; test "$(dpkg-deb -f "$d" Name)" = "Home Screen Flashlight"; test "$(dpkg-deb -f "$d" Version)" = 1.0.3; test "$(dpkg-deb -f "$d" Architecture)" = "$a"; dpkg-deb -x "$d" "$x"; find "$x" -name NextHomeTorch.dylib | grep -q .; find "$x" -path '*NextHomeTorchPreferences.bundle/Root.plist' | grep -q .; find "$x" -path '*PreferenceLoader/Preferences/NextHomeTorch.plist' | grep -q .; grep -R -q 'Enable Home Screen Flashlight' "$x"; strings "$(find "$x" -name NextHomeTorch.dylib -print -quit)" | grep -q AVCaptureDevice; rm -rf "$x"; }
          O="$RUNNER_TEMP/hsf-release"; check "$O/HomeScreenFlashlight_1.0.3_Rootless.deb" iphoneos-arm64; check "$O/HomeScreenFlashlight_1.0.3_RootHide.deb" iphoneos-arm64e
      - name: Publish repository packages
        shell: bash
        run: |
          set -euo pipefail
          O="$RUNNER_TEMP/hsf-release"; git config user.name "Next Jailbreak Build Bot"; git config user.email "actions@users.noreply.github.com"
          git fetch origin main; git reset --hard origin/main; mkdir -p debfiles "$RUNNER_TEMP/hsf-scan"; cp "$O"/*.deb debfiles/; cp "$O"/*.deb "$RUNNER_TEMP/hsf-scan/"
          dpkg-scanpackages -m "$RUNNER_TEMP/hsf-scan" /dev/null > "$RUNNER_TEMP/hsf-stanzas"; sed -i '' 's|^Filename: .*/hsf-scan/|Filename: ./debfiles/|' "$RUNNER_TEMP/hsf-stanzas"
          python3 - "$RUNNER_TEMP/hsf-stanzas" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path('Packages'); old=p.read_text() if p.exists() else ''
          rows=[x.strip() for x in re.split(r'\n\s*\n',old) if x.strip()]
          rows=[x for x in rows if not re.search(r'^Package: com\.nextsolution\.nexthometorch$',x,re.M)]
          new=[x.strip() for x in re.split(r'\n\s*\n',Path(sys.argv[1]).read_text()) if x.strip()]
          p.write_text('\n\n'.join(rows+new)+'\n')
          PY
          gzip -9 -c Packages > Packages.gz; bzip2 -9 -c Packages > Packages.bz2; xz -9e -c Packages > Packages.xz; zstd -19 -q -c Packages > Packages.zst
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import re
          p=Path('Release'); t=p.read_text(); m=re.search(r'^Version: (\d+)\.(\d+)\.(\d+)$',t,re.M)
          if m: t=re.sub(r'^Version: .*$',f'Version: {m.group(1)}.{m.group(2)}.{int(m.group(3))+1}',t,flags=re.M)
          t=re.sub(r'^Date: .*$', 'Date: '+datetime.now(timezone.utc).strftime('%a, %d %b %Y %H:%M:%S UTC'),t,flags=re.M); p.write_text(t)
          PY
          git add debfiles/HomeScreenFlashlight_1.0.3_Rootless.deb debfiles/HomeScreenFlashlight_1.0.3_RootHide.deb Packages Packages.gz Packages.bz2 Packages.xz Packages.zst Release
          git commit -m "Publish Home Screen Flashlight 1.0.3"; git push origin HEAD:main
