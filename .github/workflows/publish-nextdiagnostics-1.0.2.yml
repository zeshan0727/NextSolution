name: Publish Next Diagnostics 1.0.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-nextdiagnostics-1.0.2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fetch and verify exact 1.0.2 build
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://raw.githubusercontent.com/zeshan0727/NextSolution/build/nextdiagnostics-1.0.2-moduleglass-trace/build-output/NextDiagnostics/1.0.2'
          mkdir -p /tmp/nd
          curl -fL "$BASE/NextDiagnosticsRuntime_1.0.2_RootHide.deb" -o /tmp/nd/NextDiagnosticsRuntime_1.0.2_RootHide.deb
          curl -fL "$BASE/NextDiagnosticsRuntime_1.0.2_Source.zip" -o /tmp/nd/NextDiagnosticsRuntime_1.0.2_Source.zip
          curl -fL "$BASE/SHA256SUMS.txt" -o /tmp/nd/SHA256SUMS.txt
          test "$(shasum -a 256 /tmp/nd/NextDiagnosticsRuntime_1.0.2_RootHide.deb | awk '{print $1}')" = '67f548e239997001e3c48c06b95a3b09fa2c8e435012a2f8d098dd849280a0d0'
          test "$(shasum -a 256 /tmp/nd/NextDiagnosticsRuntime_1.0.2_Source.zip | awk '{print $1}')" = 'ce0c86816cda74466670baeb22bfb5c0a4f9a74a4cfdb2ba081cfb17feec5279'
          test "$(dpkg-deb -f /tmp/nd/NextDiagnosticsRuntime_1.0.2_RootHide.deb Package)" = 'com.nextsolution.nextdiagnostics.runtime'
          test "$(dpkg-deb -f /tmp/nd/NextDiagnosticsRuntime_1.0.2_RootHide.deb Version)" = '1.0.2'
          rm -rf /tmp/ndverify && mkdir -p /tmp/ndverify
          dpkg-deb -x /tmp/nd/NextDiagnosticsRuntime_1.0.2_RootHide.deb /tmp/ndverify
          MAN='/tmp/ndverify/Library/Application Support/NextDiagnostics/manifest.plist'
          TRACE='/tmp/ndverify/Library/MobileSubstrate/DynamicLibraries/NextDiagnosticsModuleGlassTrace.dylib'
          test -f "$MAN" && test -f "$TRACE"
          plutil -convert xml1 -o /tmp/manifest.xml "$MAN"
          grep -Fq '<string>module-glass</string>' /tmp/manifest.xml
          grep -Fq '<string>com.nextsolution.nextaura.cc-module-backgrounds</string>' /tmp/manifest.xml
          grep -Fq '<string>NextDiagnosticsModuleGlassTrace.dylib</string>' /tmp/manifest.xml
          strings "$TRACE" > /tmp/trace.strings
          grep -Fq 'SEND_EVENT_ENTER' /tmp/trace.strings
          grep -Fq 'SEND_EVENT_EXIT' /tmp/trace.strings
          grep -Fq 'CONTROL_ACTION_ENTER' /tmp/trace.strings
          grep -Fq 'PRESENT_ENTER' /tmp/trace.strings
          grep -Fq 'MAIN_STALL' /tmp/trace.strings
          grep -Fq 'VIEW_SNAPSHOT' /tmp/trace.strings
          ! grep -Eqi 'UITextField|UITextView|pressesBegan|keyCommand' /tmp/trace.strings
      - name: Publish to Transfer
        shell: bash
        run: |
          set -euo pipefail
          DST='transfer/files/NextDiagnostics/1.0.2'
          mkdir -p "$DST"
          cp /tmp/nd/NextDiagnosticsRuntime_1.0.2_RootHide.deb "$DST/"
          cp /tmp/nd/NextDiagnosticsRuntime_1.0.2_Source.zip "$DST/"
          cp /tmp/nd/SHA256SUMS.txt "$DST/"
          python3 - <<'PY'
          import json, pathlib, datetime
          p=pathlib.Path('transfer/index.json')
          d=json.loads(p.read_text())
          ids={'nextdiagnostics-runtime-1.0.2','nextdiagnostics-runtime-1.0.2-source'}
          old=[x for x in d.get('files',[]) if x.get('id') not in ids]
          new=[
            {'id':'nextdiagnostics-runtime-1.0.2','name':'Next Diagnostics Runtime 1.0.2 – Module Glass Trace','fileName':'NextDiagnosticsRuntime_1.0.2_RootHide.deb','type':'deb','platform':'RootHide / iOS 15+','version':'1.0.2','url':'https://nextjailbreak.com/transfer/files/NextDiagnostics/1.0.2/NextDiagnosticsRuntime_1.0.2_RootHide.deb','sha256':'67f548e239997001e3c48c06b95a3b09fa2c8e435012a2f8d098dd849280a0d0','notes':'Next Log runtime for Module Glass freeze diagnostics. Captures scoped Control Center touch phases, gesture states, control actions, presentation/lifecycle events, bounded view-hierarchy snapshots and main-thread stall/recovery markers. Activates only for the module-glass capture profile; no keyboard or typed-text capture.'},
            {'id':'nextdiagnostics-runtime-1.0.2-source','name':'Next Diagnostics Runtime 1.0.2 – Module Glass Trace Source','fileName':'NextDiagnosticsRuntime_1.0.2_Source.zip','type':'zip','platform':'Source / Theos','version':'1.0.2','url':'https://nextjailbreak.com/transfer/files/NextDiagnostics/1.0.2/NextDiagnosticsRuntime_1.0.2_Source.zip','sha256':'ce0c86816cda74466670baeb22bfb5c0a4f9a74a4cfdb2ba081cfb17feec5279','notes':'Matching source for Next Diagnostics 1.0.2 Module Glass interaction trace probe.'}
          ]
          d['files']=new+old
          d['updatedAt']=datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add transfer/index.json transfer/files/NextDiagnostics/1.0.2
          git commit -m 'Publish Next Diagnostics 1.0.2 Module Glass trace'
          git pull --rebase origin main
          git push origin HEAD:main
