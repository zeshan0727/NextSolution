name: Build and Publish Module Glass Stable 1.1.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-publish-module-glass-stable-1.1.0.yml'

permissions:
  contents: write

concurrency:
  group: nextsolution-module-glass-stable-1.1.0
  cancel-in-progress: false

jobs:
  build-audit-publish:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install packaging tools
        run: brew install dpkg ldid xz zstd

      - name: Install pinned RootHide Theos
        shell: bash
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/theos-roothide"
          git init "$T"
          git -C "$T" remote add origin https://github.com/roothide/theos.git
          git -C "$T" fetch --depth 1 origin 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$T" checkout --detach 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$T" submodule update --init --recursive --depth 1

      - name: Migrate to stable Objective-C++ renderer
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/module_glass_stable_1_1_0.py
          python3 scripts/module_glass_stable_linkage_fix.py
          test -f source/ModuleGlass/Tweak.mm
          test ! -f source/ModuleGlass/Tweak.m
          grep -q '^Version: 1.1.0$' source/ModuleGlass/control
          grep -q 'CCModuleBackgrounds_FILES = Tweak.mm' source/ModuleGlass/Makefile
          grep -q 'CCModuleBackgrounds_CXXFLAGS = -std=c++17' source/ModuleGlass/Makefile
          grep -q 'extern "C" void MSHookMessageEx' source/ModuleGlass/Tweak.mm

      - name: Audit renderer invariants
        shell: bash
        run: |
          set -euo pipefail
          S=source/ModuleGlass/Tweak.mm

          # Required stable architecture markers.
          grep -q 'enum class MGRendererKind' "$S"
          grep -q 'MGApplyStableVolumeValueMask' "$S"
          grep -q 'stable-volume-mask' "$S"
          grep -q 'stable-brightness-fill-aware' "$S"
          grep -q 'stable-standard-passive-foreground-safe' "$S"
          grep -q 'expanded-bypass' "$S"
          grep -q 'live-native' "$S"
          grep -q 'CCModuleVolumeIconColor' "$S"
          grep -q 'extern "C" void MSHookMessageEx' "$S"

          # Regression blockers from the two broken releases.
          ! grep -q 'MGVolumeValueSizedFrame' "$S"
          ! grep -q 'MGRepairCoveredForegroundImages' "$S"
          ! grep -q 'MGForegroundRepairOverlayTag' "$S"
          ! grep -q 'imageFrame = MGVolume' "$S"
          ! grep -Eq 'root\.(frame|bounds)[[:space:]]*=' "$S"

          # Standard modules must not enter the recursive Volume/Brightness suppressors.
          python3 - <<'PY'
          from pathlib import Path
          s=Path('source/ModuleGlass/Tweak.mm').read_text()
          block=s[s.index('MGRendererKind renderer ='):s.index('// Safety rule:', s.index('MGRendererKind renderer ='))]
          assert 'renderer == MGRendererKind::VolumeSlider' in block
          assert 'renderer == MGRendererKind::BrightnessSlider' in block
          standard=block[block.index('} else {', block.index('MGRendererKind::VolumeSlider')):]
          assert 'MGApplyVolumeImageMode' not in standard
          assert 'MGApplyBrightnessImageMode' not in standard
          assert 'stable-standard-passive-foreground-safe' in standard
          PY

      - name: Build stable runtime 1.1.0
        shell: bash
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/source/ModuleGlass"
          OUT="$RUNNER_TEMP/release"
          STAGE="$RUNNER_TEMP/runtime-stage"
          export THEOS="$RUNNER_TEMP/theos-roothide"
          export THEOS_PACKAGE_SCHEME=roothide
          mkdir -p "$OUT"
          rm -rf "$P/.theos" "$P/packages" "$STAGE"
          make -C "$P" clean package FINALPACKAGE=1
          DEB=$(find "$P/packages" -type f -name '*.deb' -print -quit)
          test -n "$DEB"
          dpkg-deb -R "$DEB" "$STAGE"
          test -f "$STAGE/Library/MobileSubstrate/DynamicLibraries/CCModuleBackgrounds.dylib"
          cat > "$STAGE/DEBIAN/postinst" <<'SH'
          #!/bin/sh
          killall -9 SpringBoard 2>/dev/null || true
          exit 0
          SH
          chmod 0755 "$STAGE/DEBIAN/postinst"
          dpkg-deb -b "$STAGE" "$OUT/NextAura_Runtime_ccbackgrounds_1.1.0_RootHide.deb"

      - name: Build Module Glass wrapper 1.1.0
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/release"
          STAGE="$RUNNER_TEMP/wrapper-stage"
          rm -rf "$STAGE"
          dpkg-deb -R debfiles/NextAura_cc_module_backgrounds_1.0.19_RootHide.deb "$STAGE"
          python3 - "$STAGE/DEBIAN/control" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); t=p.read_text()
          t=re.sub(r'^Version: .*$', 'Version: 1.1.0', t, flags=re.M)
          t=re.sub(r'com\.nextsolution\.nextaura\.runtime\.ccbackgrounds \(>= [^)]+\)', 'com.nextsolution.nextaura.runtime.ccbackgrounds (>= 1.1.0)', t)
          t=re.sub(r'^Description: .*$', 'Description: Stable Module Glass release with Objective-C++ renderer isolation, foreground-safe standard tiles, preserved Brightness behavior, and full-frame value-masked Volume artwork.', t, flags=re.M)
          p.write_text(t)
          PY
          dpkg-deb -b "$STAGE" "$OUT/NextAura_cc_module_backgrounds_1.1.0_RootHide.deb"

      - name: Binary and package validation
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/release"
          R="$OUT/NextAura_Runtime_ccbackgrounds_1.1.0_RootHide.deb"
          M="$OUT/NextAura_cc_module_backgrounds_1.1.0_RootHide.deb"

          test "$(dpkg-deb -f "$R" Package)" = 'com.nextsolution.nextaura.runtime.ccbackgrounds'
          test "$(dpkg-deb -f "$R" Version)" = '1.1.0'
          test "$(dpkg-deb -f "$R" Architecture)" = 'iphoneos-arm64e'
          test "$(dpkg-deb -f "$M" Package)" = 'com.nextsolution.nextaura.cc-module-backgrounds'
          test "$(dpkg-deb -f "$M" Version)" = '1.1.0'
          dpkg-deb -f "$M" Depends | grep -q 'com.nextsolution.nextaura.runtime.ccbackgrounds (>= 1.1.0)'

          X=$(mktemp -d)
          dpkg-deb -x "$R" "$X"
          D="$X/Library/MobileSubstrate/DynamicLibraries/CCModuleBackgrounds.dylib"
          lipo -info "$D" | grep -q arm64
          lipo -info "$D" | grep -q arm64e
          strings -a "$D" | grep -q 'ModuleGlassRuntime 1.1.0 Stable Objective-C++ Renderer loaded'
          strings -a "$D" | grep -q 'stable-standard-passive-foreground-safe'
          strings -a "$D" | grep -q 'stable-volume-mask'
          strings -a "$D" | grep -q 'stable-brightness-fill-aware'
          strings -a "$D" | grep -q 'expanded-bypass'
          strings -a "$D" | grep -q 'CCModuleVolumeIconColor'
          ! strings -a "$D" | grep -q 'volume-value-sized'
          rm -rf "$X"
          shasum -a 256 "$R" "$M"

      - name: Publish only after all audits pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Next Jailbreak Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase --autostash origin main

          # Re-check transformed source after rebase/autostash.
          test -f source/ModuleGlass/Tweak.mm
          test ! -f source/ModuleGlass/Tweak.m
          grep -q '^Version: 1.1.0$' source/ModuleGlass/control
          grep -q 'stable-standard-passive-foreground-safe' source/ModuleGlass/Tweak.mm
          grep -q 'extern "C" void MSHookMessageEx' source/ModuleGlass/Tweak.mm
          ! grep -q 'MGRepairCoveredForegroundImages' source/ModuleGlass/Tweak.mm

          OUT="$RUNNER_TEMP/release"
          SCAN="$RUNNER_TEMP/scan"
          mkdir -p debfiles "$SCAN"
          cp "$OUT/NextAura_Runtime_ccbackgrounds_1.1.0_RootHide.deb" debfiles/
          cp "$OUT/NextAura_cc_module_backgrounds_1.1.0_RootHide.deb" debfiles/
          cp "$OUT"/*.deb "$SCAN/"
          dpkg-scanpackages -m "$SCAN" /dev/null > "$RUNNER_TEMP/stanzas"

          python3 - "$RUNNER_TEMP/stanzas" <<'PY'
          from pathlib import Path
          import os,re,sys
          s=Path(sys.argv[1])
          lines=[]
          for line in s.read_text().splitlines():
              if line.startswith('Filename: '):
                  line='Filename: ./debfiles/'+os.path.basename(line.split(': ',1)[1])
              lines.append(line)
          s.write_text('\n'.join(lines)+'\n')

          ids={'com.nextsolution.nextaura.runtime.ccbackgrounds','com.nextsolution.nextaura.cc-module-backgrounds'}
          pkg=Path('Packages')
          rows=[x.strip() for x in re.split(r'\n\s*\n',pkg.read_text()) if x.strip()]
          def pid(row):
              m=re.search(r'^Package: (.+)$',row,re.M)
              return m.group(1).strip() if m else ''
          rows=[r for r in rows if pid(r) not in ids]
          new=[x.strip() for x in re.split(r'\n\s*\n',s.read_text()) if x.strip()]
          pkg.write_text('\n\n'.join(rows+new)+'\n')
          PY

          test "$(grep -c '^Package: com.nextsolution.nextaura.cc-module-backgrounds$' Packages)" -eq 1
          test "$(grep -c '^Package: com.nextsolution.nextaura.runtime.ccbackgrounds$' Packages)" -eq 1
          grep -A20 '^Package: com.nextsolution.nextaura.cc-module-backgrounds$' Packages | grep -q '^Version: 1.1.0$'
          grep -A20 '^Package: com.nextsolution.nextaura.runtime.ccbackgrounds$' Packages | grep -q '^Version: 1.1.0$'
          grep -A20 '^Package: com.nextsolution.nextaura.cc-module-backgrounds$' Packages | grep -q 'runtime.ccbackgrounds (>= 1.1.0)'

          gzip -9 -c Packages > Packages.gz
          bzip2 -9 -c Packages > Packages.bz2
          xz -9e -c Packages > Packages.xz
          zstd -19 -q -c Packages > Packages.zst

          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import re
          p=Path('Release'); t=p.read_text()
          m=re.search(r'^Version:\s*(\d+)\.(\d+)\.(\d+)\s*$',t,re.M)
          if m:
              a,b,c=map(int,m.groups())
              t=re.sub(r'^Version: .*$',f'Version: {a}.{b}.{c+1}',t,flags=re.M)
          t=re.sub(r'^Date: .*$', 'Date: '+datetime.now(timezone.utc).strftime('%a, %d %b %Y %H:%M:%S UTC'), t, flags=re.M)
          p.write_text(t)
          PY

          git add -A source/ModuleGlass scripts/module_glass_stable_1_1_0.py scripts/module_glass_stable_linkage_fix.py \
            .github/workflows/build-publish-module-glass-stable-1.1.0.yml \
            debfiles/NextAura_Runtime_ccbackgrounds_1.1.0_RootHide.deb \
            debfiles/NextAura_cc_module_backgrounds_1.1.0_RootHide.deb \
            Packages Packages.gz Packages.bz2 Packages.xz Packages.zst Release
          git diff --cached --check
          git commit -m 'Publish Module Glass 1.1.0 stable Objective-C++ renderer'
          git push origin HEAD:main
