name: Temporary Next Signer 1.3 Build Verifier

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  verify:
    if: github.event.issue.title == '[NEXTSIGNER-1.3-BUILD-VERIFY]'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate app icon
        run: python3 NextSigner/generate_app_icon.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: NextSigner
        run: xcodegen generate

      - name: Compile Next Signer 1.3
        working-directory: NextSigner
        run: |
          set -euo pipefail
          xcodebuild \
            -project NextSigner.xcodeproj \
            -scheme NextSigner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/NextSignerVerify" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Verify icon and package
        run: |
          set -euo pipefail
          APP_PATH="$(find "$RUNNER_TEMP/NextSignerVerify/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name '*.app' | head -n1)"
          test -n "$APP_PATH" || { echo 'Built .app not found'; exit 1; }
          test -f "$APP_PATH/Assets.car" || { echo 'Compiled asset catalog missing'; exit 1; }
          rm -rf "$RUNNER_TEMP/package"
          mkdir -p "$RUNNER_TEMP/package/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/package/Payload/NextSigner.app"
          cd "$RUNNER_TEMP/package"
          /usr/bin/zip -qry "$RUNNER_TEMP/NextSigner-1.3.0.ipa" Payload
          cp "$RUNNER_TEMP/NextSigner-1.3.0.ipa" "$RUNNER_TEMP/NextSigner-1.3.0.tipa"
          unzip -t "$RUNNER_TEMP/NextSigner-1.3.0.tipa" >/dev/null
          shasum -a 256 "$RUNNER_TEMP/NextSigner-1.3.0.ipa" "$RUNNER_TEMP/NextSigner-1.3.0.tipa"

      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: NextSigner-1.3.0-TIPA
          path: |
            ${{ runner.temp }}/NextSigner-1.3.0.tipa
            ${{ runner.temp }}/NextSigner-1.3.0.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Report success
        if: success()
        run: gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body 'NEXTSIGNER_1_3_ARTIFACT_OK'

      - name: Report failure
        if: failure()
        run: gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body 'NEXTSIGNER_1_3_ARTIFACT_FAILED'
