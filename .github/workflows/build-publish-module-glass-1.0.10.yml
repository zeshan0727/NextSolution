name: Build and Publish Module Glass 1.0.10

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-publish-module-glass-1.0.10.yml'
      - 'source/ModuleGlass/**'

permissions:
  contents: write

concurrency:
  group: nextsolution-module-glass-1.0.10
  cancel-in-progress: false

jobs:
  build-validate-publish:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install packaging tools
        run: brew install dpkg ldid xz zstd

      - name: Validate Module Glass source
        shell: bash
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/source/ModuleGlass"
          for f in Makefile control Compat.h Tweak.m CCModuleBackgrounds.plist; do test -f "$P/$f"; done
          grep -q '^Version: 1.0.6$' "$P/control"
          grep -q '^Architecture: iphoneos-arm64e$' "$P/control"
          grep -q '^ARCHS = arm64 arm64e$' "$P/Makefile"
          grep -q 'CCModuleBackgrounds_LIBRARIES = substrate' "$P/Makefile"
          grep -q 'MGFindSliderView' "$P/Tweak.m"
          grep -q 'slider-native' "$P/Tweak.m"
          grep -q 'insertSubview:imageView aboveSubview:anchor' "$P/Tweak.m"
          grep -q 'imageView.userInteractionEnabled = NO' "$P/Tweak.m"
          grep -q 'MGRemoveTaggedImages(root, nil)' "$P/Tweak.m"
          grep -q 'expanded-bypass' "$P/Tweak.m"
          grep -q 'comapplemediaremotecontrolcenteraudio' "$P/Tweak.m"
          grep -q 'comapplecontrolcenterdisplaymodule' "$P/Tweak.m"
          plutil -lint "$P/CCModuleBackgrounds.plist"

      - name: Install pinned RootHide Theos
        shell: bash
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/theos-roothide"
          git init "$T"
          git -C "$T" remote add origin https://github.com/roothide/theos.git
          git -C "$T" fetch --depth 1 origin 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$T" checkout --detach 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$T" submodule update --init --recursive --depth 1

      - name: Build Module Glass Runtime 1.0.6
        shell: bash
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/source/ModuleGlass"
          OUT="$RUNNER_TEMP/module-glass-release"
          RAW="$RUNNER_TEMP/module-glass-runtime-raw"
          STAGE="$RUNNER_TEMP/module-glass-runtime-stage"
          mkdir -p "$OUT"
          export THEOS="$RUNNER_TEMP/theos-roothide"
          export THEOS_PACKAGE_SCHEME=roothide
          rm -rf "$P/.theos" "$P/packages" "$STAGE"
          make -C "$P" clean package FINALPACKAGE=1
          DEB="$(find "$P/packages" -type f -name '*.deb' -print -quit)"
          test -n "$DEB"
          cp "$DEB" "$RAW.deb"
          dpkg-deb -R "$RAW.deb" "$STAGE"
          test -f "$STAGE/Library/MobileSubstrate/DynamicLibraries/CCModuleBackgrounds.dylib"
          test -f "$STAGE/Library/MobileSubstrate/DynamicLibraries/CCModuleBackgrounds.plist"
          cat > "$STAGE/DEBIAN/postinst" <<'SH'
          #!/bin/sh
          killall -9 SpringBoard 2>/dev/null || true
          exit 0
          SH
          chmod 0755 "$STAGE/DEBIAN/postinst"
          dpkg-deb -b "$STAGE" "$OUT/NextAura_Runtime_ccbackgrounds_1.0.6_RootHide.deb"

      - name: Build Module Glass 1.0.10 settings package
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/module-glass-release"
          STAGE="$RUNNER_TEMP/module-glass-main-stage"
          rm -rf "$STAGE"
          dpkg-deb -R "$GITHUB_WORKSPACE/debfiles/NextAura_cc_module_backgrounds_1.0.9_RootHide.deb" "$STAGE"
          python3 - "$STAGE/DEBIAN/control" <<'PY'
          from pathlib import Path
          import re, sys
          p = Path(sys.argv[1])
          t = p.read_text()
          t = re.sub(r'^Version: .*$', 'Version: 1.0.10', t, flags=re.M)
          t = re.sub(r'com\.nextsolution\.nextaura\.runtime\.ccbackgrounds \(>= [^)]+\)',
                     'com.nextsolution.nextaura.runtime.ccbackgrounds (>= 1.0.6)', t)
          t = re.sub(r'^Description: .*$',
                     "Description: Passive custom Control Center backgrounds with slider-aware Volume and Brightness support while preserving Apple's native expanded-module behavior.",
                     t, flags=re.M)
          p.write_text(t)
          PY
          grep -q '^Version: 1.0.10$' "$STAGE/DEBIAN/control"
          grep -q 'com.nextsolution.nextaura.runtime.ccbackgrounds (>= 1.0.6)' "$STAGE/DEBIAN/control"
          dpkg-deb -b "$STAGE" "$OUT/NextAura_cc_module_backgrounds_1.0.10_RootHide.deb"

      - name: Validate release packages
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/module-glass-release"
          R="$OUT/NextAura_Runtime_ccbackgrounds_1.0.6_RootHide.deb"
          M="$OUT/NextAura_cc_module_backgrounds_1.0.10_RootHide.deb"
          test "$(dpkg-deb -f "$R" Package)" = 'com.nextsolution.nextaura.runtime.ccbackgrounds'
          test "$(dpkg-deb -f "$R" Version)" = '1.0.6'
          test "$(dpkg-deb -f "$R" Architecture)" = 'iphoneos-arm64e'
          test "$(dpkg-deb -f "$M" Package)" = 'com.nextsolution.nextaura.cc-module-backgrounds'
          test "$(dpkg-deb -f "$M" Version)" = '1.0.10'
          test "$(dpkg-deb -f "$M" Architecture)" = 'iphoneos-arm64e'
          dpkg-deb -f "$M" Depends | grep -q 'com.nextsolution.nextaura.runtime.ccbackgrounds (>= 1.0.6)'

          X="$(mktemp -d)"
          dpkg-deb -x "$R" "$X"
          D="$X/Library/MobileSubstrate/DynamicLibraries/CCModuleBackgrounds.dylib"
          test -f "$D"
          lipo -info "$D" | grep -q 'arm64'
          lipo -info "$D" | grep -q 'arm64e'
          strings -a "$D" | grep -q 'ModuleGlassRuntime 1.0.6 loaded'
          strings -a "$D" | grep -q 'slider-native'
          strings -a "$D" | grep -q 'expanded-bypass'
          strings -a "$D" | grep -q 'comapplemediaremotecontrolcenteraudio'
          strings -a "$D" | grep -q 'comapplecontrolcenterdisplaymodule'
          strings -a "$D" | grep -q 'CCModuleBackgroundOpacity'
          strings -a "$D" | grep -q '/var/mobile/Library/Preferences/NextSolutionTweaks/CCBackgrounds'
          test -f "$X/Library/MobileSubstrate/DynamicLibraries/CCModuleBackgrounds.plist"
          grep -q 'com.apple.springboard' "$X/Library/MobileSubstrate/DynamicLibraries/CCModuleBackgrounds.plist"
          rm -rf "$X"
          shasum -a 256 "$R" "$M"

      - name: Publish packages and refresh repository indexes
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/module-glass-release"
          SCAN="$RUNNER_TEMP/module-glass-scan"
          git config user.name 'Next Solution Build Bot'
          git config user.email 'actions@users.noreply.github.com'

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf "$SCAN"
            mkdir -p "$SCAN" debfiles
            cp "$OUT/NextAura_Runtime_ccbackgrounds_1.0.6_RootHide.deb" debfiles/
            cp "$OUT/NextAura_cc_module_backgrounds_1.0.10_RootHide.deb" debfiles/
            cp "$OUT"/*.deb "$SCAN/"

            dpkg-scanpackages -m "$SCAN" /dev/null > "$RUNNER_TEMP/module-glass-stanzas"
            python3 - "$RUNNER_TEMP/module-glass-stanzas" <<'PY'
          from pathlib import Path
          import os, re, sys
          p = Path(sys.argv[1])
          lines = []
          for line in p.read_text().splitlines():
              if line.startswith('Filename: '):
                  line = 'Filename: ./debfiles/' + os.path.basename(line.split(': ', 1)[1])
              lines.append(line)
          p.write_text('\n'.join(lines) + '\n')
          PY

            python3 - "$RUNNER_TEMP/module-glass-stanzas" <<'PY'
          from pathlib import Path
          import re, sys
          package_ids = {
              'com.nextsolution.nextaura.runtime.ccbackgrounds',
              'com.nextsolution.nextaura.cc-module-backgrounds',
          }
          path = Path('Packages')
          old = path.read_text() if path.exists() else ''
          rows = [x.strip() for x in re.split(r'\n\s*\n', old) if x.strip()]
          def package_id(row):
              m = re.search(r'^Package: (.+)$', row, re.M)
              return m.group(1).strip() if m else ''
          rows = [row for row in rows if package_id(row) not in package_ids]
          new = [x.strip() for x in re.split(r'\n\s*\n', Path(sys.argv[1]).read_text()) if x.strip()]
          path.write_text('\n\n'.join(rows + new) + '\n')
          PY

            test "$(grep -c '^Package: com.nextsolution.nextaura.runtime.ccbackgrounds$' Packages)" -eq 1
            test "$(grep -c '^Package: com.nextsolution.nextaura.cc-module-backgrounds$' Packages)" -eq 1
            grep -A15 '^Package: com.nextsolution.nextaura.runtime.ccbackgrounds$' Packages | grep -q '^Version: 1.0.6$'
            grep -A15 '^Package: com.nextsolution.nextaura.cc-module-backgrounds$' Packages | grep -q '^Version: 1.0.10$'
            grep -A20 '^Package: com.nextsolution.nextaura.cc-module-backgrounds$' Packages | grep -q 'com.nextsolution.nextaura.runtime.ccbackgrounds (>= 1.0.6)'
            grep -q '^Filename: ./debfiles/NextAura_Runtime_ccbackgrounds_1.0.6_RootHide.deb$' Packages
            grep -q '^Filename: ./debfiles/NextAura_cc_module_backgrounds_1.0.10_RootHide.deb$' Packages

            gzip -9 -c Packages > Packages.gz
            bzip2 -9 -c Packages > Packages.bz2
            xz -9e -c Packages > Packages.xz
            zstd -19 -q -c Packages > Packages.zst

            python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import re
          p = Path('Release')
          t = p.read_text()
          m = re.search(r'^Version:\s*(\d+)\.(\d+)\.(\d+)\s*$', t, re.M)
          if m:
              a, b, c = map(int, m.groups())
              t = re.sub(r'^Version: .*$', f'Version: {a}.{b}.{c+1}', t, flags=re.M)
          t = re.sub(r'^Date: .*$', 'Date: ' + datetime.now(timezone.utc).strftime('%a, %d %b %Y %H:%M:%S UTC'), t, flags=re.M)
          t = re.sub(r'^Icon: .*$', 'Icon: https://nextsolution.cc/CydiaIcon.png', t, flags=re.M)
          p.write_text(t)
          PY

            git add source/ModuleGlass .github/workflows/build-publish-module-glass-1.0.10.yml \
              debfiles/NextAura_Runtime_ccbackgrounds_1.0.6_RootHide.deb \
              debfiles/NextAura_cc_module_backgrounds_1.0.10_RootHide.deb \
              Packages Packages.gz Packages.bz2 Packages.xz Packages.zst Release
            git diff --cached --check
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish Module Glass 1.0.10 and Runtime 1.0.6'
            git push origin HEAD:main && exit 0
            sleep $((attempt * 4))
          done
          exit 1
