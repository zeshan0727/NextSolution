name: Validate SMS Review Fallback

permissions:
  contents: read

on:
  push:
    branches:
      - agent/next-ledger-1.3.50-chart-of-accounts
    paths:
      - "scripts/add_sms_unrecognized_review_fallback.py"
      - "scripts/add_sms_fallback_selftest.py"
      - ".github/workflows/build-sms-review-fallback.yml"
  pull_request:
    branches: [main]
    paths:
      - "DailyLedger/**"
      - "RootHideSMSQueue/**"
      - "scripts/**"
      - ".github/workflows/build-sms-review-fallback.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Apply Next Ledger feature patches
        run: |
          python3 scripts/apply_next_ledger_1_3_50_compact_no_sms.py
          python3 scripts/fix_next_ledger_refund_swift.py
          python3 scripts/add_refund_account_picker.py
          python3 scripts/add_currency_selectors_and_global_delete.py
          python3 scripts/add_inline_accounts_and_general_subaccounts.py
          python3 scripts/add_parent_totals_and_statement_chart.py
          python3 scripts/add_collapsible_chart_sections.py
          python3 scripts/add_edit_refund_delete_swipe_actions.py
          python3 scripts/add_bank_expenses_and_fixed_report_conversion.py
          python3 scripts/fix_summary_loan_sides_and_accounts_zero_filter.py
          python3 scripts/add_payment_receivable_payable_automation.py
          python3 scripts/add_receivable_collection_drilldown.py
          python3 scripts/add_loan_summary_comparison_report.py
          python3 scripts/fix_loan_summary_comparison_ios16.py
          python3 scripts/add_accounting_period_setting.py
          python3 scripts/add_custom_dates_to_loan_summary_comparison.py
          python3 scripts/add_root_sms_daemon_console.py
          python3 scripts/add_sms_installer_diagnostics.py
          python3 scripts/fix_roothide_messages_database_access.py
          python3 scripts/add_sms_draft_approval_and_unrecorded_sync.py
          python3 scripts/fix_sms_draft_inbox_ios16_and_migration.py
          python3 scripts/add_selectable_accounting_period_lock.py
          python3 scripts/prepare_sms_console_counter_patch.py
          python3 scripts/fix_sms_draft_fields_and_message_decoding.py
          python3 scripts/add_interval_latest10_sms_recovery.py
          python3 scripts/fix_sms_interval_unused_diagnostics.py
          python3 scripts/add_manual30_restore_rejected_and_compact_ai.py
          python3 scripts/add_fawran_transfer_and_editable_sms_review.py
          python3 scripts/fix_fawran_regex_escape.py
          python3 scripts/fix_financial_summary_auto_sms_and_compact_settings.py
          python3 scripts/prepare_settings_pages_sms_cleanup_patch.py
          python3 scripts/add_settings_pages_custom_sms_and_log_cleanup.py
          python3 scripts/add_professional_report_exports.py
          python3 scripts/add_sms_unrecognized_review_fallback.py
          python3 scripts/add_sms_fallback_selftest.py

      - name: Install build tools
        run: brew install xcodegen dpkg ldid

      - name: Validate fallback and parser
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build
          grep -Fq 'kDaemonVersion = @"2.1.7"' RootHideSMSQueue/Sources/main.m
          grep -Fq 'ReviewDraftForUnrecognizedBankSMS' RootHideSMSQueue/Sources/main.m
          grep -Fq 'reviewFallback ? ImportResultWaitingForMapping' RootHideSMSQueue/Sources/main.m
          grep -Fq 'reviewTransfer' DailyLedger/Services/SMSImportConsoleService.swift
          grep -Fq 'reviewIncome' DailyLedger/Services/SMSImportConsoleService.swift
          xcrun clang -fobjc-arc RootHideSMSQueue/Sources/main.m -framework Foundation -framework CoreFoundation -lsqlite3 -o build/nextledgersmsd-macos
          build/nextledgersmsd-macos --self-test | tee build/sms-parser-tests.json
          grep -q '"passed" : true' build/sms-parser-tests.json
          grep -q '"version" : "2.1.7"' build/sms-parser-tests.json
          grep -q 'unrecognized transfer review fallback' build/sms-parser-tests.json
          grep -q 'reviewTransfer' build/sms-parser-tests.json

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iPhone app
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project DailyLedger.xcodeproj -scheme DailyLedger -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build/xcodebuild.log

      - name: Build RootHide SMS daemon
        shell: bash
        run: |
          set -euxo pipefail
          THEOS_COMMIT="88506b2c22e9e07dd4ed055f23c9e398a117a2c7"
          git init "$RUNNER_TEMP/theos"
          git -C "$RUNNER_TEMP/theos" remote add origin https://github.com/roothide/theos.git
          git -C "$RUNNER_TEMP/theos" fetch --depth 1 origin "$THEOS_COMMIT"
          git -C "$RUNNER_TEMP/theos" checkout --detach "$THEOS_COMMIT"
          git -C "$RUNNER_TEMP/theos" submodule update --init --recursive --depth 1
          export THEOS="$RUNNER_TEMP/theos"
          cmp RootHideSMSQueue/postinst RootHideSMSQueue/layout/DEBIAN/postinst
          make -C RootHideSMSQueue clean package FINALPACKAGE=1
          cp RootHideSMSQueue/packages/*.deb NextLedgerSMSDaemon-2.1.7-roothide.deb
          test "$(dpkg-deb -f NextLedgerSMSDaemon-2.1.7-roothide.deb Version)" = "2.1.7"
          rm -rf build/sms-root
          mkdir -p build/sms-root
          dpkg-deb -x NextLedgerSMSDaemon-2.1.7-roothide.deb build/sms-root
          ldid -e build/sms-root/usr/libexec/nextledgersmsd > build/sms-daemon-entitlements.plist
          grep -q 'com.apple.private.security.storage.Messages' build/sms-daemon-entitlements.plist
          grep -q 'com.apple.private.security.storage.AppDataContainers' build/sms-daemon-entitlements.plist
          shasum -a 256 NextLedgerSMSDaemon-2.1.7-roothide.deb > NextLedgerSMSDaemon-2.1.7-roothide.sha256

      - name: Package TrollStore TIPA
        shell: bash
        run: |
          set -euxo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload NextLedger-1.3.50-sms-review-fallback.tipa
          unzip -t NextLedger-1.3.50-sms-review-fallback.tipa
          shasum -a 256 NextLedger-1.3.50-sms-review-fallback.tipa > NextLedger-1.3.50-sms-review-fallback.sha256

      - name: Upload validated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NextLedger-SMS-Review-Fallback
          path: |
            NextLedger-1.3.50-sms-review-fallback.tipa
            NextLedger-1.3.50-sms-review-fallback.sha256
            NextLedgerSMSDaemon-2.1.7-roothide.deb
            NextLedgerSMSDaemon-2.1.7-roothide.sha256
            build/sms-parser-tests.json
            build/sms-daemon-entitlements.plist
          if-no-files-found: error
