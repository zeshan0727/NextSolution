name: Build Next Reminder 1.3.16 Repeat Edit Save

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Validate v1.3.16 patch sources
        run: |
          set -euo pipefail
          PATCH=NextReminderApp/ci/patch_v146.py
          grep -q 'isExistingRepeatingReminder' "$PATCH"
          grep -q 'reminderDateRange' "$PATCH"
          grep -q 'Date.distantPast...Date.distantFuture' "$PATCH"
          grep -q '1.3.16' NextReminderApp/ci/adjust_build_v146.py
          grep -q "grep -qx '26'" NextReminderApp/ci/adjust_build_v146.py

      - name: Build Next Reminder 1.3.16
        run: |
          set -o pipefail
          chmod +x NextReminderApp/ci/build-v146.sh
          NextReminderApp/ci/build-v146.sh 2>&1 | tee v146-app-build.log

      - name: Verify package
        run: |
          set -euo pipefail
          APP=NextReminderApp/build/NextReminder.app
          TIPA=NextReminderApp/NextReminder-v1.3.16-unsigned.tipa
          test -f "$TIPA"
          unzip -t "$TIPA" >/dev/null
          plutil -extract CFBundleShortVersionString raw "$APP/Info.plist" | grep -qx '1.3.16'
          plutil -extract CFBundleVersion raw "$APP/Info.plist" | grep -qx '26'
          strings -a "$APP/NextReminder" > "$RUNNER_TEMP/v146-strings.txt"
          grep -q 'Save Changes' "$RUNNER_TEMP/v146-strings.txt"
          mkdir -p "$RUNNER_TEMP/next-reminder-v146"
          cp "$TIPA" "$RUNNER_TEMP/next-reminder-v146/"
          cp NextReminderApp/NextReminder-v1.3.16-unsigned.tipa.sha256 "$RUNNER_TEMP/next-reminder-v146/"
          ditto -c -k --sequesterRsrc --keepParent NextReminderApp "$RUNNER_TEMP/next-reminder-v146/NextReminder-v1.3.16-Source.zip"

      - name: Upload final package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NextReminder-v1.3.16-RepeatEditSave
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/next-reminder-v146/NextReminder-v1.3.16-unsigned.tipa
            ${{ runner.temp }}/next-reminder-v146/NextReminder-v1.3.16-unsigned.tipa.sha256
            ${{ runner.temp }}/next-reminder-v146/NextReminder-v1.3.16-Source.zip
            v146-app-build.log
            NextReminderApp/xcodebuild.log
