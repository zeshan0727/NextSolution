name: Publish Brightness Edge Haptic
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-brightness-edge-haptic.yml']
permissions:
  contents: write
concurrency:
  group: brightness-edge-haptic-1.0.0
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: brew install dpkg ldid xz zstd
      - name: Test deterministic runtime decisions
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/2026-08-04-BrightnessEdgeHaptic"
          clang -std=c11 -Wall -Wextra -Werror -I"$P/Tests" "$P/Tests/test_brightness_decision.c" -o "$RUNNER_TEMP/tests"
          "$RUNNER_TEMP/tests"
          grep -q UIScreenBrightnessDidChangeNotification "$P/Tweak.xm"
          grep -q 'BEHLastState = BEHClassifyBrightness' "$P/Tweak.xm"
          grep -q 'com.apple.springboard' "$P/BrightnessEdgeHaptic.plist"
          grep -q 'undefined,dynamic_lookup' "$P/Preferences/Makefile"
          plutil -lint "$P/Preferences/Resources/Root.plist"
          plutil -lint "$P/Preferences/Resources/Info.plist"
          plutil -lint "$P/layout/Library/PreferenceLoader/Preferences/BrightnessEdgeHaptic.plist"
      - name: Build rootless
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/2026-08-04-BrightnessEdgeHaptic"; mkdir -p "$RUNNER_TEMP/out"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          export THEOS="$RUNNER_TEMP/theos" THEOS_PACKAGE_SCHEME=rootless
          make -C "$P" clean package FINALPACKAGE=1
          D="$(find "$P/packages" -name '*_iphoneos-arm64.deb' -print -quit)"; test -n "$D"
          cp "$D" "$RUNNER_TEMP/out/BrightnessEdgeHaptic_1.0.0_Rootless.deb"
      - name: Build RootHide
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/2026-08-04-BrightnessEdgeHaptic"
          git init "$RUNNER_TEMP/theos-rh"
          git -C "$RUNNER_TEMP/theos-rh" remote add origin https://github.com/roothide/theos.git
          git -C "$RUNNER_TEMP/theos-rh" fetch --depth 1 origin 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$RUNNER_TEMP/theos-rh" checkout --detach 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$RUNNER_TEMP/theos-rh" submodule update --init --recursive --depth 1
          sed -i '' 's/^Architecture: iphoneos-arm64$/Architecture: iphoneos-arm64e/' "$P/control"
          export THEOS="$RUNNER_TEMP/theos-rh" THEOS_PACKAGE_SCHEME=roothide
          rm -rf "$P/packages"; make -C "$P" clean package FINALPACKAGE=1
          D="$(find "$P/packages" -name '*_iphoneos-arm64e.deb' -print -quit)"; test -n "$D"
          cp "$D" "$RUNNER_TEMP/out/BrightnessEdgeHaptic_1.0.0_RootHide.deb"
      - name: Validate package layouts
        run: |
          set -euo pipefail
          for d in "$RUNNER_TEMP/out"/*.deb; do
            test "$(dpkg-deb -f "$d" Package)" = com.nextsolution.brightnessedgehaptic
            test "$(dpkg-deb -f "$d" Version)" = 1.0.0
            dpkg-deb -f "$d" Depends | grep -q preferenceloader
            x="$(mktemp -d)"; dpkg-deb -x "$d" "$x"
            dylib="$(find "$x" -name BrightnessEdgeHaptic.dylib -print -quit)"; test -n "$dylib"
            find "$x" -path '*BrightnessEdgeHapticPreferences.bundle/Root.plist' | grep -q .
            find "$x" -path '*PreferenceLoader/Preferences/BrightnessEdgeHaptic.plist' | grep -q .
            strings -a "$dylib" | grep -q UIScreenBrightnessDidChangeNotification
          done
          shasum -a 256 "$RUNNER_TEMP/out"/*.deb | tee brightness-edge-haptic-build.txt
      - name: Publish packages and preserve unrelated indexes
        run: |
          set -euo pipefail
          git config user.name 'Next Jailbreak Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase origin main
          mkdir -p debfiles "$RUNNER_TEMP/scan"
          cp "$RUNNER_TEMP/out"/*.deb debfiles/
          cp "$RUNNER_TEMP/out"/*.deb "$RUNNER_TEMP/scan/"
          dpkg-scanpackages -m "$RUNNER_TEMP/scan" /dev/null > "$RUNNER_TEMP/stanzas"
          sed -i '' 's|^Filename: .*/scan/|Filename: ./debfiles/|' "$RUNNER_TEMP/stanzas"
          python3 scripts/publish_brightness_edge_haptic.py "$RUNNER_TEMP/stanzas"
          test "$(grep -c '^Package: com.nextsolution.brightnessedgehaptic$' Packages)" -eq 2
          gzip -9 -c Packages > Packages.gz
          bzip2 -9 -c Packages > Packages.bz2
          xz -9e -c Packages > Packages.xz
          zstd -19 -q -c Packages > Packages.zst
          git add debfiles/BrightnessEdgeHaptic_1.0.0_Rootless.deb debfiles/BrightnessEdgeHaptic_1.0.0_RootHide.deb Packages Packages.gz Packages.bz2 Packages.xz Packages.zst Release brightness-edge-haptic-build.txt
          git commit -m 'Publish Brightness Edge Haptic 1.0.0'
          git push origin main
