name: Temporary R2 Credentials Test

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  test-r2:
    if: github.event.issue.title == '[R2-CREDENTIALS-TEST]'
    runs-on: ubuntu-latest
    env:
      R2_BUCKET: next-signer-apps
      R2_ACCOUNT_ID: 4fe920e259870b0366118a17cc5727e5
      R2_PUBLIC_BASE: https://files.nextsolution.cc
      AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - name: Validate secrets
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
      - name: Install AWS CLI
        run: python3 -m pip install --user --quiet awscli
      - name: Upload health check to R2
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          printf 'Next Signer R2 GitHub Actions OK\n' > "$RUNNER_TEMP/r2-health.txt"
          aws s3 cp "$RUNNER_TEMP/r2-health.txt" "s3://$R2_BUCKET/health/github-actions-r2-test.txt" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --content-type "text/plain; charset=utf-8" \
            --cache-control "no-store" \
            --only-show-errors
      - name: Verify public object
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 8 --retry-delay 3 \
            "$R2_PUBLIC_BASE/health/github-actions-r2-test.txt" | grep -F 'Next Signer R2 GitHub Actions OK'
