          cat > assets/nexthometorch/nexthometorch-hero.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Next Home Torch concept</title><desc id="d">Two fingers tapping an iPhone Home Screen to toggle the flashlight</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d86c36"/><stop offset="1" stop-color="#0faaa6"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="24" stdDeviation="28" flood-opacity=".35"/></filter></defs><rect width="1600" height="900" fill="#07111f"/><circle cx="1350" cy="120" r="360" fill="#0faaa6" opacity=".2"/><circle cx="180" cy="760" r="300" fill="#d86c36" opacity=".2"/><text x="110" y="145" fill="#fff" font-family="Arial,sans-serif" font-size="72" font-weight="800">Next Home Torch</text><text x="112" y="215" fill="#b9c9e8" font-family="Arial,sans-serif" font-size="32">Two-finger Home Screen flashlight gesture</text><g filter="url(#s)"><rect x="510" y="90" width="580" height="720" rx="78" fill="#111a2d" stroke="#48ded4" stroke-opacity=".55" stroke-width="4"/><rect x="545" y="145" width="510" height="610" rx="52" fill="url(#g)"/><g fill="#fff" opacity=".92"><rect x="595" y="220" width="92" height="92" rx="24"/><rect x="735" y="220" width="92" height="92" rx="24"/><rect x="875" y="220" width="92" height="92" rx="24"/><rect x="595" y="360" width="92" height="92" rx="24"/><rect x="875" y="360" width="92" height="92" rx="24"/></g><rect x="650" y="645" width="300" height="74" rx="30" fill="#ffffff" opacity=".18"/><circle cx="715" cy="500" r="42" fill="#fff" opacity=".9"/><circle cx="855" cy="500" r="42" fill="#fff" opacity=".9"/><path d="M785 520 L750 610 H820 L785 690 L900 565 H830 L870 520Z" fill="#ffe66d" stroke="#fff" stroke-width="8"/></g><text x="800" y="855" text-anchor="middle" fill="#dce8ff" font-family="Arial,sans-serif" font-size="28">RootHide + rootless • iOS 15 and later</text></svg>
          SVG
          cat > next-home-torch-ios15-ios16.html <<'HTML'
          <!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>Next Home Torch 1.0.0 — Two-Finger Flashlight Tweak | Next Jailbreak</title><meta name="description" content="Download Next Home Torch 1.0.0 for RootHide or rootless jailbreaks. Toggle the flashlight with a two-finger tap on empty Home Screen space on iOS 15 and iOS 16."><meta name="keywords" content="Next Home Torch tweak, flashlight gesture iOS 16, RootHide tweak, rootless jailbreak tweak, Next Jailbreak repo"><meta name="author" content="Next Jailbreak"><link rel="canonical" href="https://nextjailbreak.com/next-home-torch-ios15-ios16.html"><meta property="og:type" content="article"><meta property="og:site_name" content="Next Jailbreak"><meta property="og:url" content="https://nextjailbreak.com/next-home-torch-ios15-ios16.html"><meta property="og:title" content="Next Home Torch 1.0.0 — Two-Finger Flashlight Gesture"><meta property="og:description" content="Toggle the flashlight from empty Home Screen space with one two-finger tap."><meta property="og:image" content="https://nextjailbreak.com/assets/nexthometorch/nexthometorch-hero.svg"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:site" content="@nextjailbreak"><meta name="twitter:title" content="Next Home Torch 1.0.0"><meta name="twitter:description" content="A simple two-finger Home Screen gesture for the flashlight."><meta name="twitter:image" content="https://nextjailbreak.com/assets/nexthometorch/nexthometorch-hero.svg"><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4770123899731214" crossorigin="anonymous"></script><script type="application/ld+json">{"@context":"https://schema.org","@type":"TechArticle","headline":"Next Home Torch 1.0.0 — Two-Finger Flashlight Tweak","description":"Feature guide, compatibility, installation and direct downloads for Next Home Torch 1.0.0.","image":"https://nextjailbreak.com/assets/nexthometorch/nexthometorch-hero.svg","datePublished":"2026-07-31","dateModified":"2026-07-31","author":{"@type":"Person","name":"Zeeshan Barvi"},"publisher":{"@type":"Organization","name":"Next Jailbreak","logo":{"@type":"ImageObject","url":"https://nextjailbreak.com/favicon-32x32.png"}},"mainEntityOfPage":"https://nextjailbreak.com/next-home-torch-ios15-ios16.html","about":["iOS jailbreak","flashlight gesture","RootHide","rootless jailbreak"]}</script><style>:root{color-scheme:dark;--bg:#030711;--card:#111b31;--line:rgba(255,255,255,.14);--text:#f7f9ff;--muted:#b7c3dc;--g:linear-gradient(135deg,#d86c36,#0faaa6)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 5%,rgba(15,170,166,.2),transparent 32rem),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;line-height:1.65}header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px max(16px,calc((100% - 1120px)/2));background:rgba(3,7,17,.82);border-bottom:1px solid var(--line);backdrop-filter:blur(18px)}.brand{color:#fff;text-decoration:none;font-weight:900;font-size:22px}nav{display:flex;gap:5px;overflow:auto}nav a{padding:9px 12px;border-radius:11px;color:var(--muted);text-decoration:none;font-weight:750;white-space:nowrap}nav a[aria-current=page]{color:#fff;background:rgba(255,255,255,.1)}main{width:min(1120px,calc(100% - 32px));margin:auto;padding:48px 0 80px}.hero{display:grid;grid-template-columns:1fr 1fr;gap:42px;align-items:center;padding:clamp(24px,5vw,58px);border:1px solid var(--line);border-radius:34px;background:linear-gradient(145deg,rgba(20,34,65,.92),rgba(7,48,55,.8))}.hero img{width:100%;border-radius:24px}.tag{display:inline-block;padding:7px 11px;border:1px solid var(--line);border-radius:999px;color:#cbd8f3;font-size:13px;font-weight:800}h1{font-size:clamp(42px,7vw,72px);line-height:1;letter-spacing:-.05em;margin:18px 0}h2{font-size:clamp(27px,4vw,40px);margin-top:0}.lead{color:var(--muted);font-size:19px}.buttons{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}.button{display:inline-flex;align-items:center;min-height:50px;padding:12px 18px;border-radius:15px;color:#fff;text-decoration:none;font-weight:850;background:var(--g)}.button.secondary{background:rgba(255,255,255,.08);border:1px solid var(--line)}section.content{margin-top:28px;padding:28px;border:1px solid var(--line);border-radius:24px;background:var(--card)}ul,ol{padding-left:22px}.notice{padding:15px 17px;border-radius:15px;background:rgba(255,190,70,.1);border:1px solid rgba(255,190,70,.28);color:#f1d9a5}.ad-space{min-height:90px;margin:28px 0;padding:12px;border:1px dashed rgba(255,255,255,.18);border-radius:16px;text-align:center;color:#73809b}.ad-space:before{content:"Advertisement";font-size:12px}footer{text-align:center;color:var(--muted);padding:28px}@media(max-width:780px){header{align-items:stretch;flex-direction:column}.hero{grid-template-columns:1fr}.hero-copy{order:1}.hero img{order:2}.buttons .button{width:100%;justify-content:center}}</style></head><body><header><a class="brand" href="./">Next Jailbreak</a><nav aria-label="Primary navigation"><a href="./">Home</a><a href="tutorials.html" aria-current="page">Tutorials</a><a href="videos.html">Videos</a><a href="./#faq">FAQ</a></nav></header><main><article><section class="hero"><div class="hero-copy"><span class="tag">New tweak • Version 1.0.0</span><h1>Next Home Torch</h1><p class="lead">Toggle the flashlight with one simultaneous two-finger tap on an empty Home Screen area—without opening Control Center.</p><div class="buttons"><a class="button" href="https://nextjailbreak.com/debfiles/NextHomeTorch_1.0.0_RootHide.deb">Download RootHide</a><a class="button secondary" href="https://nextjailbreak.com/debfiles/NextHomeTorch_1.0.0_Rootless.deb">Download Rootless</a></div></div><img src="assets/nexthometorch/nexthometorch-hero.svg" alt="Next Home Torch two-finger flashlight gesture concept" width="1600" height="900"></section><div class="ad-space" aria-label="Advertisement space"></div><section class="content"><h2>What the tweak does</h2><p>Next Home Torch adds one focused convenience feature: touch empty Home Screen wallpaper with two fingers at the same time and lift them once to toggle the flashlight. A normal one-finger tap, double-tap, three-finger touch or unfinished gesture is ignored.</p></section><section class="content"><h2>Compatibility</h2><ul><li>iOS 15 and later, with primary testing target iOS 16.0</li><li>RootHide build: <code>iphoneos-arm64e</code></li><li>Standard rootless build: <code>iphoneos-arm64</code></li><li>Package ID: <code>com.nextsolution.nexthometorch</code></li></ul><p class="notice"><strong>Testing status:</strong> Both packages compiled and passed deterministic and package-layout validation. Physical-device confirmation is still required before this page is published live.</p></section><section class="content"><h2>Install from the Next Jailbreak repo</h2><ol><li>Add <strong>https://nextjailbreak.com/</strong> to Sileo.</li><li>Refresh sources and search for <strong>Next Home Torch</strong>.</li><li>Install the build matching RootHide or standard rootless.</li><li>Respring when prompted.</li></ol></section><section class="content"><h2>How to use it</h2><ol><li>Open the Home Screen.</li><li>Find empty wallpaper space where no icon or widget is placed.</li><li>Place two fingers down together and lift them once.</li><li>Repeat the same gesture to turn the flashlight off.</li></ol></section><section class="content"><h2>Settings</h2><p>Open Settings → Next Home Torch. The preference page contains only one clean option: <strong>Enable Next Home Torch</strong>. Turning it off disables the gesture without uninstalling the package.</p></section><section class="content"><h2>Troubleshooting</h2><ul><li>Confirm that both fingers land on empty Home Screen space.</li><li>Make sure the tweak is enabled in Settings, then respring once.</li><li>Do not install the RootHide build on a standard rootless jailbreak or vice versa.</li><li>Home Screen layout tweaks that consume multi-touch may conflict with the gesture.</li></ul></section><div class="ad-space" aria-label="Advertisement space"></div><section class="content"><h2>Uninstall</h2><p>Remove Next Home Torch in Sileo and respring. It stores only the local enabled preference and does not collect or transmit personal information.</p></section></article></main><footer>© 2026 Next Jailbreak • Educational jailbreak customization guide</footer></body></html>
          HTML
          python3 - <<'PY'
          from pathlib import Path
          index=Path('index.html'); text=index.read_text()
          text=text.replace('The newest Next Jailbreak guides, with PhoneAura permanently pinned for quick access.','The newest Next Jailbreak guides, with PhoneAura and Next Home Torch permanently pinned for quick access.')
          card='''\n        <!-- NEXTHOMETORCH_RECENT_CARD_START -->\n        <article class="card">\n          <div class="icon"><i class="fas fa-bolt" aria-hidden="true"></i></div>\n          <h3>Next Home Torch 1.0.0 — Two-Finger Flashlight</h3>\n          <p>Toggle the flashlight from empty Home Screen space with one simultaneous two-finger tap. RootHide and rootless builds for iOS 15+.</p>\n          <a class="more" href="next-home-torch-ios15-ios16.html">Read guide &amp; download <i class="fas fa-arrow-right" aria-hidden="true"></i></a>\n        </article>\n        <!-- NEXTHOMETORCH_RECENT_CARD_END -->\n'''
          marker='        <!-- PHONEAURA_RECENT_CARD_END -->\n'
          if 'NEXTHOMETORCH_RECENT_CARD_START' not in text:
              assert marker in text
              text=text.replace(marker,marker+card,1)
          index.write_text(text)
          tutorials=Path('tutorials.html'); text=tutorials.read_text()
          card='''\n      <article class="card">\n        <div class="icon"><i class="fas fa-bolt" aria-hidden="true"></i></div>\n        <h3>Next Home Torch 1.0.0</h3>\n        <p>Use a two-finger tap on empty Home Screen wallpaper to toggle the flashlight. Includes direct RootHide and rootless downloads.</p>\n        <a href="next-home-torch-ios15-ios16.html">Read guide &amp; download</a>\n      </article>\n'''
          anchor='      <article class="card">\n        <div class="icon"><i class="fas fa-sync-alt"'
          if 'href="next-home-torch-ios15-ios16.html"' not in text:
              assert anchor in text
              text=text.replace(anchor,card+'\n'+anchor,1)
          tutorials.write_text(text)
          sitemap=Path('sitemap.xml'); text=sitemap.read_text()
          entry='  <url><loc>https://nextjailbreak.com/next-home-torch-ios15-ios16.html</loc><lastmod>2026-07-31</lastmod><changefreq>monthly</changefreq><priority>0.9</priority></url>\n'
          if 'next-home-torch-ios15-ios16.html' not in text:
              text=text.replace('  <url><loc>https://nextjailbreak.com/privacy.html</loc>',entry+'  <url><loc>https://nextjailbreak.com/privacy.html</loc>',1)
          sitemap.write_text(text)
          PY
          cat > .github/scripts/publish-nexthometorch-blog.py <<'PY'
          from pathlib import Path
          required={
            'next-home-torch-ios15-ios16.html':['ca-pub-4770123899731214','TechArticle','NextHomeTorch_1.0.0_RootHide.deb','NextHomeTorch_1.0.0_Rootless.deb','aria-current="page"'],
            'index.html':['NEXTHOMETORCH_RECENT_CARD_START','next-home-torch-ios15-ios16.html'],
            'tutorials.html':['next-home-torch-ios15-ios16.html'],
            'sitemap.xml':['next-home-torch-ios15-ios16.html']}
          for file,needles in required.items():
            text=Path(file).read_text()
            for needle in needles:
              assert needle in text,(file,needle)
          assert Path('next-home-torch-ios15-ios16.html').read_text().count('pagead2.googlesyndication.com/pagead/js/adsbygoogle.js')==1
          print('Next Home Torch tutorial draft validated')
          PY
          cat > .github/workflows/validate-nexthometorch-tutorial.yml <<'YML'
          name: Validate Next Home Torch Tutorial
          on:
            workflow_dispatch:
            pull_request:
              branches: [main]
              paths: ["next-home-torch-ios15-ios16.html","assets/nexthometorch/**","index.html","tutorials.html","sitemap.xml",".github/scripts/publish-nexthometorch-blog.py"]
          jobs:
            validate:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - run: python3 .github/scripts/publish-nexthometorch-blog.py
          YML
          python3 .github/scripts/publish-nexthometorch-blog.py
      - name: Commit prepared tutorial branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Next Jailbreak Website Bot'
          git config user.email actions@users.noreply.github.com
          git add next-home-torch-ios15-ios16.html assets/nexthometorch/nexthometorch-hero.svg index.html tutorials.html sitemap.xml .github/scripts/publish-nexthometorch-blog.py .github/workflows/validate-nexthometorch-tutorial.yml
          git diff --cached --check
          git commit -m 'Prepare Next Home Torch 1.0.0 tutorial draft'
          git push origin HEAD:tutorial/nexthometorch-1.0.0
