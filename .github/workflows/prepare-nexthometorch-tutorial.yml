name: Prepare Next Home Torch Tutorial Draft

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tutorial/nexthometorch-1.0.0
          fetch-depth: 0
      - name: Generate article, artwork, cards, sitemap and validators
        shell: bash
