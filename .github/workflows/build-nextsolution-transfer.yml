name: Build NextSolution Transfer TIPA

on:
  workflow_dispatch:
  push:
    branches: [agent/nextsolution-transfer]
    paths:
      - 'TransferApp/**'
      - '.github/workflows/build-nextsolution-transfer.yml'

permissions:
  contents: write

concurrency:
  group: nextsolution-transfer
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Validate source configuration
        run: |
          set -euo pipefail
          test -f TransferApp/Resources/AppIcon.svg
          test -f TransferApp/Sources/EnhancedUploadView.swift
          grep -q 'https://nextsolution.cc/transfer/index.json' TransferApp/Sources/NextSolutionTransferApp.swift
          grep -q 'UIDocumentPickerViewController' TransferApp/Sources/NextSolutionTransferApp.swift
          grep -q 'PHPickerViewController' TransferApp/Sources/EnhancedUploadView.swift
          grep -q 'PHPickerFilter' TransferApp/Sources/EnhancedUploadView.swift
          grep -q 'case photos' TransferApp/Sources/EnhancedUploadView.swift
          grep -q 'case videos' TransferApp/Sources/EnhancedUploadView.swift
          grep -q 'MARKETING_VERSION: 1.1.4' TransferApp/project.yml
          grep -q 'CURRENT_PROJECT_VERSION: 114' TransferApp/project.yml
          grep -q 'ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon' TransferApp/project.yml
          grep -q 'buildPhase: resources' TransferApp/project.yml
          ! grep -R 'nextsolution\.app' TransferApp --include='*.swift' --include='*.yml' --include='*.yaml'

      - name: Activate enhanced upload view
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('TransferApp/Sources/NextSolutionTransferApp.swift')
          text = p.read_text()
          old = 'UploadView().tabItem'
          new = 'EnhancedUploadView().tabItem'
          assert old in text, 'Upload tab call not found'
          p.write_text(text.replace(old, new, 1))
          PY
          grep -q 'EnhancedUploadView().tabItem' TransferApp/Sources/NextSolutionTransferApp.swift

      - name: Install build tools
        run: brew install xcodegen imagemagick

      - name: Generate AppIcon asset catalog
        working-directory: TransferApp
        run: |
          set -euo pipefail
          ROOT="GeneratedAssets/Assets.xcassets"
          SET="$ROOT/AppIcon.appiconset"
          rm -rf GeneratedAssets
          mkdir -p "$SET"
          cat > "$ROOT/Contents.json" <<'JSON'
          {"info":{"author":"xcode","version":1}}
          JSON
          magick -background none Resources/AppIcon.svg -resize 1024x1024 "$SET/AppIcon-1024.png"
          make_icon() { magick "$SET/AppIcon-1024.png" -resize "${2}x${2}" "$SET/$1"; }
          make_icon AppIcon-20.png 20
          make_icon AppIcon-20@2x.png 40
          make_icon AppIcon-20@3x.png 60
          make_icon AppIcon-29.png 29
          make_icon AppIcon-29@2x.png 58
          make_icon AppIcon-29@3x.png 87
          make_icon AppIcon-40.png 40
          make_icon AppIcon-40@2x.png 80
          make_icon AppIcon-40@3x.png 120
          make_icon AppIcon-60@2x.png 120
          make_icon AppIcon-60@3x.png 180
          make_icon AppIcon-76.png 76
          make_icon AppIcon-76@2x.png 152
          make_icon AppIcon-83.5@2x.png 167
          cat > "$SET/Contents.json" <<'JSON'
          {
            "images": [
              {"filename":"AppIcon-20@2x.png","idiom":"iphone","scale":"2x","size":"20x20"},
              {"filename":"AppIcon-20@3x.png","idiom":"iphone","scale":"3x","size":"20x20"},
              {"filename":"AppIcon-29@2x.png","idiom":"iphone","scale":"2x","size":"29x29"},
              {"filename":"AppIcon-29@3x.png","idiom":"iphone","scale":"3x","size":"29x29"},
              {"filename":"AppIcon-40@2x.png","idiom":"iphone","scale":"2x","size":"40x40"},
              {"filename":"AppIcon-40@3x.png","idiom":"iphone","scale":"3x","size":"40x40"},
              {"filename":"AppIcon-60@2x.png","idiom":"iphone","scale":"2x","size":"60x60"},
              {"filename":"AppIcon-60@3x.png","idiom":"iphone","scale":"3x","size":"60x60"},
              {"filename":"AppIcon-20.png","idiom":"ipad","scale":"1x","size":"20x20"},
              {"filename":"AppIcon-20@2x.png","idiom":"ipad","scale":"2x","size":"20x20"},
              {"filename":"AppIcon-29.png","idiom":"ipad","scale":"1x","size":"29x29"},
              {"filename":"AppIcon-29@2x.png","idiom":"ipad","scale":"2x","size":"29x29"},
              {"filename":"AppIcon-40.png","idiom":"ipad","scale":"1x","size":"40x40"},
              {"filename":"AppIcon-40@2x.png","idiom":"ipad","scale":"2x","size":"40x40"},
              {"filename":"AppIcon-76.png","idiom":"ipad","scale":"1x","size":"76x76"},
              {"filename":"AppIcon-76@2x.png","idiom":"ipad","scale":"2x","size":"76x76"},
              {"filename":"AppIcon-83.5@2x.png","idiom":"ipad","scale":"2x","size":"83.5x83.5"},
              {"filename":"AppIcon-1024.png","idiom":"ios-marketing","scale":"1x","size":"1024x1024"}
            ],
            "info":{"author":"xcode","version":1}
          }
          JSON
          test "$(sips -g pixelWidth "$SET/AppIcon-1024.png" | awk '/pixelWidth/{print $2}')" = "1024"
          test "$(sips -g pixelHeight "$SET/AppIcon-1024.png" | awk '/pixelHeight/{print $2}')" = "1024"

      - name: Generate Xcode project
        working-directory: TransferApp
        run: xcodegen generate

      - name: Build unsigned app
        working-directory: TransferApp
        run: |
          set -euo pipefail
          rm -rf build Payload output
          xcodebuild \
            -project NextSolutionTransfer.xcodeproj \
            -scheme NextSolutionTransfer \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package TIPA
        working-directory: TransferApp
        run: |
          set -euo pipefail
          mkdir -p Payload output
          cp -R build/Build/Products/Release-iphoneos/NextSolutionTransfer.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload output/NextSolution-Transfer-1.1.4.tipa
          shasum -a 256 output/NextSolution-Transfer-1.1.4.tipa > output/NextSolution-Transfer-1.1.4.sha256

      - name: Validate package, media pickers, and icon
        working-directory: TransferApp
        run: |
          set -euo pipefail
          rm -rf verify
          mkdir verify
          ditto -x -k output/NextSolution-Transfer-1.1.4.tipa verify
          APP=verify/Payload/NextSolutionTransfer.app
          BIN="$APP/NextSolutionTransfer"
          test -d "$APP"
          test -f "$BIN"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = "1.1.4"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = "114"
          test -f "$APP/Assets.car"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$APP/Info.plist")" = "AppIcon"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles:0' "$APP/Info.plist")" = "AppIcon60x60"
          test -f "$APP/AppIcon60x60@2x.png"
          test -f "$APP/AppIcon76x76@2x~ipad.png"
          strings "$BIN" | grep -q 'nextsolution.cc/transfer/index.json'
          ! strings "$BIN" | grep -q 'nextsolution.app'
          strings "$BIN" | grep -q 'UIDocumentPickerViewController'
          strings "$BIN" | grep -q 'PHPickerViewController'
          strings "$BIN" | grep -q 'transfer/uploads/'
          strings "$BIN" | grep -q 'api.github.com/repos/'

      - name: Upload TIPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NextSolution-Transfer-1.1.4
          path: |
            TransferApp/output/NextSolution-Transfer-1.1.4.tipa
            TransferApp/output/NextSolution-Transfer-1.1.4.sha256
          if-no-files-found: error

      - name: Publish app to NextSolution Transfer feed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/TransferApp/output"
          SITE="$RUNNER_TEMP/nextsolution-site"
          git clone --depth 1 --branch main "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$SITE"
          DEST="$SITE/transfer/files/NextSolutionTransfer/1.1.4"
          mkdir -p "$DEST"
          cp "$OUT/NextSolution-Transfer-1.1.4.tipa" "$DEST/"
          cp "$OUT/NextSolution-Transfer-1.1.4.sha256" "$DEST/"
          python3 - "$SITE/transfer/index.json" "$OUT/NextSolution-Transfer-1.1.4.tipa" <<'PY'
          import json, pathlib, hashlib, datetime, sys
          manifest = pathlib.Path(sys.argv[1])
          tipa = pathlib.Path(sys.argv[2])
          try:
              data = json.loads(manifest.read_text()) if manifest.exists() else {"version": 1, "files": []}
          except Exception:
              data = {"version": 1, "files": []}
          files = []
          for item in data.get("files", []):
              if str(item.get("id", "")).startswith("nextsolution-transfer-"):
                  continue
              if isinstance(item.get("url"), str):
                  item["url"] = item["url"].replace("nextsolution.app", "nextsolution.cc")
              files.append(item)
          files.insert(0, {
              "id":"nextsolution-transfer-1.1.4",
              "name":"NextSolution Transfer 1.1.4",
              "fileName":"NextSolution-Transfer-1.1.4.tipa",
              "type":"tipa",
              "platform":"TrollStore / iOS 16+",
              "version":"1.1.4",
              "url":"https://nextsolution.cc/transfer/files/NextSolutionTransfer/1.1.4/NextSolution-Transfer-1.1.4.tipa",
              "sha256":hashlib.sha256(tipa.read_bytes()).hexdigest(),
              "notes":"Transfer app with Files, Photos, and Videos upload pickers, secure GitHub uploads, and verified custom AppIcon."
          })
          payload={"version":1,"updatedAt":datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),"files":files}
          manifest.parent.mkdir(parents=True,exist_ok=True)
          manifest.write_text(json.dumps(payload,indent=2)+"\n")
          assert "nextsolution.app" not in manifest.read_text()
          PY
          git -C "$SITE" config user.name "github-actions[bot]"
          git -C "$SITE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$SITE" add transfer
          git -C "$SITE" commit -m "Publish NextSolution Transfer 1.1.4" || exit 0
          git -C "$SITE" pull --rebase origin main
          git -C "$SITE" push origin main
