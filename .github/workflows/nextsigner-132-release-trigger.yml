name: Temporary Next Signer 1.3.2 Release Verifier

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  release:
    if: github.event.issue.title == '[NEXTSIGNER-1.3.2-RELEASE]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: '1.3.2'
    steps:
      - name: Start verified build
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-nextsigner-tipa.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run build-nextsigner-tipa.yml --repo "$GITHUB_REPOSITORY" --ref main
          RUN_ID=''
          for attempt in $(seq 1 30); do
            candidate="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-nextsigner-tipa.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            if [ "$candidate" != "0" ] && [ "$candidate" != "$BEFORE" ]; then RUN_ID="$candidate"; break; fi
            sleep 2
          done
          test -n "$RUN_ID" || { echo 'Could not locate build run'; exit 1; }
          echo "BUILD_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "NEXTSIGNER_1_3_2_BUILD_STARTED run=$RUN_ID"

      - name: Wait for build
        run: gh run watch "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status --interval 8

      - name: Start production publisher
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow publish-nextsigner-transfer.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run publish-nextsigner-transfer.yml --repo "$GITHUB_REPOSITORY" --ref main -f version="$VERSION"
          RUN_ID=''
          for attempt in $(seq 1 30); do
            candidate="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow publish-nextsigner-transfer.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            if [ "$candidate" != "0" ] && [ "$candidate" != "$BEFORE" ]; then RUN_ID="$candidate"; break; fi
            sleep 2
          done
          test -n "$RUN_ID" || { echo 'Could not locate publisher run'; exit 1; }
          echo "PUBLISH_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "NEXTSIGNER_1_3_2_PUBLISH_STARTED run=$RUN_ID"

      - name: Wait for publisher
        run: gh run watch "$PUBLISH_RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status --interval 8

      - name: Report success
        if: success()
        run: gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "NEXTSIGNER_1_3_2_PUBLISHED build=$BUILD_RUN_ID publish=$PUBLISH_RUN_ID"

      - name: Report failure
        if: failure()
        run: gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "NEXTSIGNER_1_3_2_FAILED build=${BUILD_RUN_ID:-unknown} publish=${PUBLISH_RUN_ID:-unknown}"
