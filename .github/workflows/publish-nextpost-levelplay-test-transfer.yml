name: Publish Next Post LevelPlay Test to Transfer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-nextpost-levelplay-test-transfer.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-nextpost-levelplay-test-transfer
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download successful Next Post test artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9326733939/zip > /tmp/nextpost-artifact.zip
          rm -rf /tmp/nextpost-artifact
          mkdir -p /tmp/nextpost-artifact
          unzip -q /tmp/nextpost-artifact.zip -d /tmp/nextpost-artifact
          find /tmp/nextpost-artifact -maxdepth 2 -type f -print
          test -s /tmp/nextpost-artifact/NextPost-1.0.1-LevelPlay-Test.tipa

      - name: Publish to NS Transfers feed
        shell: bash
        run: |
          set -euo pipefail
          SRC='/tmp/nextpost-artifact/NextPost-1.0.1-LevelPlay-Test.tipa'
          DEST_DIR='transfer/files/NextPost/1.0.1'
          DEST="$DEST_DIR/NextPost-1.0.1-LevelPlay-Test.tipa"
          INDEX='transfer/index.json'

          test -s "$SRC"
          test -s "$INDEX"
          mkdir -p "$DEST_DIR"
          cp "$SRC" "$DEST"

          SHA256=$(sha256sum "$DEST" | awk '{print $1}')
          export SHA256

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone

          index_path = Path('transfer/index.json')
          data = json.loads(index_path.read_text())
          files = data.get('files', [])
          target_id = 'nextpost-1.0.1-levelplay-test'
          files = [item for item in files if item.get('id') != target_id]
          entry = {
              'id': target_id,
              'name': 'Next Post 1.0.1 LevelPlay Test',
              'fileName': 'NextPost-1.0.1-LevelPlay-Test.tipa',
              'type': 'tipa',
              'platform': 'TrollStore / iOS 16+',
              'version': '1.0.1',
              'url': 'https://nextsolution.cc/transfer/files/NextPost/1.0.1/NextPost-1.0.1-LevelPlay-Test.tipa',
              'sha256': os.environ['SHA256'],
              'notes': 'Test build with Unity LevelPlay monetization integration: adaptive bottom banner plus frequency-limited interstitial after five successful post generations. Ad loading remains non-blocking while the LevelPlay account is pending approval.'
          }
          data['files'] = [entry] + files
          data['updatedAt'] = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          index_path.write_text(json.dumps(data, indent=2) + '\n')
          print('SHA256=' + os.environ['SHA256'])
          print('FILES=' + str(len(data['files'])))
          PY

          python3 -m json.tool "$INDEX" >/dev/null
          grep -q 'nextpost-1.0.1-levelplay-test' "$INDEX"
          grep -q "$SHA256" "$INDEX"
          test "$(sha256sum "$DEST" | awk '{print $1}')" = "$SHA256"

      - name: Commit NS Transfers publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add transfer/files/NextPost/1.0.1/NextPost-1.0.1-LevelPlay-Test.tipa transfer/index.json
          git commit -m 'Publish Next Post 1.0.1 LevelPlay Test to NS Transfers' || true
          git pull --rebase origin main
          git push origin HEAD:main
