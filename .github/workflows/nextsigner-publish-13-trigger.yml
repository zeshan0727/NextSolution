name: Temporary Next Signer 1.3 Publish Trigger

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  publish:
    if: github.event.issue.title == '[NEXTSIGNER-1.3-PUBLISH]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch Transfer publisher
        shell: bash
        run: |
          set -euo pipefail
          if ! output="$(gh workflow run publish-nextsigner-transfer.yml --repo "$GITHUB_REPOSITORY" --ref main -f version=1.3.0 2>&1)"; then
            gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "NEXTSIGNER_1_3_PUBLISH_DISPATCH_FAILED: $output"
            exit 1
          fi
          echo "$output"

      - name: Find publisher run
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID=''
          for attempt in $(seq 1 18); do
            RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow publish-nextsigner-transfer.yml --branch main --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            if [ -n "$RUN_ID" ]; then break; fi
            sleep 5
          done
          test -n "$RUN_ID" || { echo 'Publisher run not found'; exit 1; }
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "NEXTSIGNER_1_3_PUBLISH_STARTED run=$RUN_ID"

      - name: Watch publisher
        run: gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status --interval 10

      - name: Report success
        if: success()
        run: gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "NEXTSIGNER_1_3_PUBLISHED run=$RUN_ID"

      - name: Report failure
        if: failure()
        run: gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "NEXTSIGNER_1_3_PUBLISH_FAILED run=${RUN_ID:-unknown}"
