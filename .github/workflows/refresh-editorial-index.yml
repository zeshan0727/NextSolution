name: Refresh editorial article indexes

on:
  push:
    branches: [main]
    paths:
      - "automation/published-articles.json"
      - "automation/sync_editorial_indexes.py"
      - ".github/workflows/refresh-editorial-index.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-editorial-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Repair four-window publisher policy and tests
        shell: bash
        run: |
          sed -i 's/max_per_day") != 3/max_per_day") != 4/' automation/publisher.py
          sed -i 's/must remain exactly 3 for the regular schedule/must remain exactly 4 for the regular six-hour schedule/' automation/publisher.py
          sed -i 's/contain three unique sorted local hours/contain four unique sorted local hours/' automation/publisher.py
          sed -i 's/cls.site\["publishing"\]\["max_per_day"\] = 3/cls.site["publishing"]["max_per_day"] = 4/' automation/tests/test_publisher.py
          sed -i 's/self.assertEqual(ready.max_today, 3)/self.assertEqual(ready.max_today, 4)/g' automation/tests/test_publisher.py
          python3 -m py_compile automation/publisher.py automation/tests/test_publisher.py
          python3 -m unittest automation.tests.test_publisher -v
      - name: Rebuild and quality-clean public editorial indexes
        run: |
          python3 automation/sync_editorial_indexes.py
          grep -q 'regram-for-instagram-6-1-update' index.html
          ! grep -q 'release-</p>' index.html
          test "$(grep -o 'https://nextjailbreak.com/nextlock-tweak/' index.html | wc -l)" -le 2
      - name: Commit synchronized editorial indexes and quality cleanup
        run: |
          if git diff --quiet; then
            echo "Editorial indexes already synchronized."
            exit 0
          fi
          git config user.name "nextsolution-content[bot]"
          git config user.email "nextsolution-content[bot]@users.noreply.github.com"
          git add -- index.html tutorials.html tutorials/index.html automation/published-articles.json automation/publisher.py automation/tests/test_publisher.py
          git commit -m "Sync latest articles and clean editorial indexes"
          git pull --rebase origin main
          git push origin HEAD:main
