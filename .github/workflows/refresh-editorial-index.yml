name: Refresh editorial article indexes

on:
  push:
    branches: [main]
    paths:
      - "automation/published-articles.json"
      - "automation/sync_editorial_indexes.py"
      - ".github/workflows/refresh-editorial-index.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-editorial-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Repair four-window publisher policy
        shell: bash
        run: |
          sed -i 's/max_per_day") != 3/max_per_day") != 4/' automation/publisher.py
          sed -i 's/must remain exactly 3 for the regular schedule/must remain exactly 4 for the regular six-hour schedule/' automation/publisher.py
          sed -i 's/contain three unique sorted local hours/contain four unique sorted local hours/' automation/publisher.py
          python3 -m py_compile automation/publisher.py
          grep -F 'max_per_day") != 4' automation/publisher.py
      - name: Rebuild static homepage and article archives
        run: python3 automation/sync_editorial_indexes.py
      - name: Commit synchronized editorial indexes and publisher repair
        run: |
          if git diff --quiet; then
            echo "Editorial indexes and publisher policy already synchronized."
            exit 0
          fi
          git config user.name "nextsolution-content[bot]"
          git config user.email "nextsolution-content[bot]@users.noreply.github.com"
          git add -- index.html tutorials.html tutorials/index.html automation/publisher.py
          git commit -m "Sync editorial indexes and four-window publisher policy"
          git pull --rebase origin main
          git push origin HEAD:main
