name: Publish Next Diagnostics 1.0.2 Module Glass Trace

on:
  push:
    branches:
      - build/nextdiagnostics-1.0.2-moduleglass-trace
    paths:
      - '.github/workflows/publish-nextdiagnostics-1.0.2-moduleglass-trace.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Checkout verified build branch
        uses: actions/checkout@v4
        with:
          ref: build/nextdiagnostics-1.0.2-moduleglass-trace
          path: buildsrc

      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          path: mainrepo

      - name: Verify exact diagnostic package before publish
        shell: bash
        run: |
          set -euo pipefail
          DEB="$GITHUB_WORKSPACE/buildsrc/build-output/NextDiagnostics/1.0.2/NextDiagnosticsRuntime_1.0.2_RootHide.deb"
          SUMS="$GITHUB_WORKSPACE/buildsrc/build-output/NextDiagnostics/1.0.2/SHA256SUMS.txt"
          test -f "$DEB"
          test -f "$SUMS"
          EXPECTED='67f548e239997001e3c48c06b95a3b09fa2c8e435012a2f8d098dd849280a0d0'
          ACTUAL="$(shasum -a 256 "$DEB" | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          test "$(dpkg-deb -f "$DEB" Package)" = 'com.nextsolution.nextdiagnostics.runtime'
          test "$(dpkg-deb -f "$DEB" Version)" = '1.0.2'
          rm -rf /tmp/ndverify && mkdir -p /tmp/ndverify
          dpkg-deb -x "$DEB" /tmp/ndverify
          PLIST='/tmp/ndverify/Library/Application Support/NextDiagnostics/manifest.plist'
          TRACE='/tmp/ndverify/Library/MobileSubstrate/DynamicLibraries/NextDiagnosticsModuleGlassTrace.dylib'
          FILTER='/tmp/ndverify/Library/MobileSubstrate/DynamicLibraries/NextDiagnosticsModuleGlassTrace.plist'
          test -f "$PLIST" && test -f "$TRACE" && test -f "$FILTER"
          plutil -convert xml1 -o /tmp/manifest.xml "$PLIST"
          grep -Fq '<string>module-glass</string>' /tmp/manifest.xml
          grep -Fq '<string>com.nextsolution.nextaura.cc-module-backgrounds</string>' /tmp/manifest.xml
          grep -Fq '<string>1.1.15</string>' /tmp/manifest.xml
          grep -Fq '<string>NextDiagnosticsModuleGlassTrace.dylib</string>' /tmp/manifest.xml
          strings "$TRACE" > /tmp/trace.strings
          grep -Fq 'SEND_EVENT_ENTER' /tmp/trace.strings
          grep -Fq 'SEND_EVENT_EXIT' /tmp/trace.strings
          grep -Fq 'CONTROL_ACTION_ENTER' /tmp/trace.strings
          grep -Fq 'PRESENT_ENTER' /tmp/trace.strings
          grep -Fq 'MAIN_STALL' /tmp/trace.strings
          grep -Fq 'VIEW_SNAPSHOT' /tmp/trace.strings
          ! grep -Eqi 'UITextField|UITextView|pressesBegan|keyCommand' /tmp/trace.strings

      - name: Publish files and update Transfer index
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/buildsrc/build-output/NextDiagnostics/1.0.2"
          DST="$GITHUB_WORKSPACE/mainrepo/transfer/files/NextDiagnostics/1.0.2"
          mkdir -p "$DST"
          cp "$SRC/NextDiagnosticsRuntime_1.0.2_RootHide.deb" "$DST/"
          cp "$SRC/NextDiagnosticsRuntime_1.0.2_Source.zip" "$DST/"
          cp "$SRC/SHA256SUMS.txt" "$DST/"
          python3 - <<'PY'
          import json, pathlib, datetime
          p=pathlib.Path('mainrepo/transfer/index.json')
          data=json.loads(p.read_text())
          ids={'nextdiagnostics-runtime-1.0.2','nextdiagnostics-runtime-1.0.2-source'}
          files=[x for x in data.get('files',[]) if x.get('id') not in ids]
          new=[
            {
              'id':'nextdiagnostics-runtime-1.0.2',
              'name':'Next Diagnostics Runtime 1.0.2 – Module Glass Trace',
              'fileName':'NextDiagnosticsRuntime_1.0.2_RootHide.deb',
              'type':'deb',
              'platform':'RootHide / iOS 15+',
              'version':'1.0.2',
              'url':'https://nextsolution.cc/transfer/files/NextDiagnostics/1.0.2/NextDiagnosticsRuntime_1.0.2_RootHide.deb',
              'sha256':'67f548e239997001e3c48c06b95a3b09fa2c8e435012a2f8d098dd849280a0d0',
              'notes':'Next Log runtime for Module Glass freeze diagnostics. Adds scoped Control Center touch phases, gesture state, control actions, presentation/lifecycle events, bounded view-hierarchy snapshots and main-thread stall/recovery markers. Activates only while the module-glass capture profile is running; no keyboard or typed-text capture.'
            },
            {
              'id':'nextdiagnostics-runtime-1.0.2-source',
              'name':'Next Diagnostics Runtime 1.0.2 – Module Glass Trace Source',
              'fileName':'NextDiagnosticsRuntime_1.0.2_Source.zip',
              'type':'zip',
              'platform':'Source / Theos',
              'version':'1.0.2',
              'url':'https://nextsolution.cc/transfer/files/NextDiagnostics/1.0.2/NextDiagnosticsRuntime_1.0.2_Source.zip',
              'sha256':'ce0c86816cda74466670baeb22bfb5c0a4f9a74a4cfdb2ba081cfb17feec5279',
              'notes':'Matching source for the Next Diagnostics 1.0.2 Module Glass interaction trace probe.'
            }
          ]
          data['files']=new+files
          data['updatedAt']=datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          p.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')
          PY

      - name: Commit to main
        shell: bash
        run: |
          set -euo pipefail
          cd mainrepo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add transfer/index.json transfer/files/NextDiagnostics/1.0.2
          git commit -m 'Publish Next Diagnostics 1.0.2 Module Glass trace'
          git pull --rebase origin main
          git push origin HEAD:main
