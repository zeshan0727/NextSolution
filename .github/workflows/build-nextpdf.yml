name: Build NextPDF TIPA

on:
  workflow_dispatch:
  push:
    paths:
      - 'NextPDF/**'
      - '.github/workflows/build-nextpdf.yml'

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: NextPDF
        run: xcodegen generate

      - name: Build unsigned app
        working-directory: NextPDF
        run: |
          xcodebuild \
            -project NextPDF.xcodeproj \
            -scheme NextPDF \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package TIPA
        working-directory: NextPDF
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NextPDF.app Payload/
          zip -r NextPDF.tipa Payload

      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: NextPDF-TIPA
          path: NextPDF/NextPDF.tipa
