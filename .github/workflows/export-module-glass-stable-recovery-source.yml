name: Export Module Glass Stable Recovery Source
on:
  push:
    paths:
      - '.github/workflows/export-module-glass-stable-recovery-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact known-good source
        uses: actions/checkout@v4
        with:
          ref: 3f161db19beca74c4f64f57d1c353c8f8a490d3d
          fetch-depth: 1
      - name: Build source archive
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/ModuleGlass-1.1.3-Stable-Recovery-Source"
          mkdir -p "$OUT/Runtime" "$OUT/Wrapper"
          cp source/ModuleGlass/Tweak.m "$OUT/Runtime/Tweak.m"
          cp source/ModuleGlass/Makefile "$OUT/Runtime/Makefile"
          cp source/ModuleGlass/Compat.h "$OUT/Runtime/Compat.h"
          cp source/ModuleGlass/CCModuleBackgrounds.plist "$OUT/Runtime/CCModuleBackgrounds.plist"
          cp source/ModuleGlass/control "$OUT/Runtime/control.original-1.0.14"
          cat > "$OUT/Runtime/control" <<'EOF'
          Package: com.nextsolution.nextaura.runtime.ccbackgrounds
          Name: Module Glass Runtime
          Version: 1.1.3
          Architecture: iphoneos-arm64e
          Description: Stable recovery runtime using the exact known-good Module Glass Runtime 1.0.14 binary/source payload, republished as 1.1.3 for upgrade-safe installation.
          Maintainer: Next Solution
          Author: Next Solution - zeshan0727
          Section: System
          Depends: firmware (>= 16.0), mobilesubstrate
          Conflicts: com.nextsolution.unlockvibrate
          Breaks: com.nextsolution.unlockvibrate (<= 4.5.3)
          Replaces: com.nextsolution.unlockvibrate (<= 4.5.3)
          Priority: optional
          Homepage: https://nextsolution.cc/
          Tag: role::cydia
          EOF
          sed -i 's/^          //' "$OUT/Runtime/control"
          cat > "$OUT/Wrapper/control" <<'EOF'
          Package: com.nextsolution.nextaura.cc-module-backgrounds
          Name: Module Glass
          Version: 1.1.3
          Architecture: iphoneos-arm64e
          Description: Stable recovery build using the exact known-good Module Glass 1.0.18 renderer payload, republished with an upgrade-safe version so Sileo/APT can replace newer broken builds.
          Maintainer: Next Solution
          Author: Next Solution - zeshan0727
          Section: Tweaks
          Depends: firmware (>= 16.0), preferenceloader, com.nextsolution.nextaura.runtime.preferences (>= 1.0.5), com.nextsolution.nextaura.runtime.ccbackgrounds (>= 1.1.3)
          Conflicts: com.nextsolution.unlockvibrate
          Priority: optional
          Homepage: https://nextsolution.cc/
          Icon: https://nextsolution.cc/icons/nextaura/cc-module-backgrounds.png
          EOF
          sed -i 's/^          //' "$OUT/Wrapper/control"
          cat > "$OUT/README.md" <<'EOF'
          # Module Glass 1.1.3 – Stable Recovery Source

          This archive contains the exact historical source used by the known-good Module Glass renderer from:

          - Module Glass 1.0.18
          - Module Glass Runtime 1.0.14
          - Source commit: 3f161db19beca74c4f64f57d1c353c8f8a490d3d

          Stable Recovery 1.1.3 did not introduce a new renderer. The 1.0.18/1.0.14 payload was repackaged with version 1.1.3 so Sileo/APT could install it as an upgrade after the later broken 1.1.x builds.

          ## Layout

          Runtime/Tweak.m
              Main Objective-C runtime tweak source. This is the renderer/injection logic.

          Runtime/Makefile
              Theos build configuration.

          Runtime/Compat.h
              Compatibility declarations.

          Runtime/CCModuleBackgrounds.plist
              MobileSubstrate/ElleKit process filter.

          Runtime/control.original-1.0.14
              Exact historical Runtime package control from the known-good source commit.

          Runtime/control
              Same runtime packaged as Stable Recovery 1.1.3.

          Wrapper/control
              Module Glass 1.1.3 wrapper package. It contains no renderer code; it depends on the runtime and preferences runtime.

          ## Build

          Build the Runtime directory with Theos in a RootHide-compatible environment. The Stable Recovery runtime source is intentionally identical to the 1.0.14 known-good renderer; only package metadata/versioning differs.

          The wrapper is a metadata/dependency package and can be built as an empty Debian package containing Wrapper/control as DEBIAN/control.
          EOF
          sed -i 's/^          //' "$OUT/README.md"
          cd "$RUNNER_TEMP"
          zip -qr ModuleGlass-1.1.3-Stable-Recovery-Source.zip ModuleGlass-1.1.3-Stable-Recovery-Source
          sha256sum ModuleGlass-1.1.3-Stable-Recovery-Source.zip > ModuleGlass-1.1.3-Stable-Recovery-Source.zip.sha256
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: ModuleGlass-1.1.3-Stable-Recovery-Source
          path: |
            ${{ runner.temp }}/ModuleGlass-1.1.3-Stable-Recovery-Source.zip
            ${{ runner.temp }}/ModuleGlass-1.1.3-Stable-Recovery-Source.zip.sha256
          retention-days: 1
