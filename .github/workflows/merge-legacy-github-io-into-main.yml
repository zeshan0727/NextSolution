name: Merge legacy GitHub Pages repo into main

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/merge-legacy-github-io-into-main.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge missing legacy files and migrate URLs
        shell: bash
        run: |
          set -euo pipefail
          LEGACY="$RUNNER_TEMP/legacy-pages"
          git clone --depth 1 https://github.com/zeshan0727/zeshan0727.github.io.git "$LEGACY"

          python3 - <<'PY'
          from pathlib import Path
          import shutil, os

          root = Path('.')
          legacy = Path(os.environ['RUNNER_TEMP']) / 'legacy-pages'
          workflow = '.github/workflows/merge-legacy-github-io-into-main.yml'

          excluded_top = {
              '.git', '.github', 'CNAME', 'Release', 'Packages', 'Packages.bz2',
              'Packages.gz', 'Packages.xz', 'Packages.zst'
          }
          copied = []
          for src in sorted(legacy.rglob('*')):
              rel = src.relative_to(legacy)
              if not rel.parts or rel.parts[0] in excluded_top or src.is_dir():
                  continue
              dst = root / rel
              if dst.exists():
                  continue
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)
              copied.append(rel.as_posix())

          print(f'Legacy files copied because they were missing from main: {len(copied)}')
          for item in copied:
              print('  +', item)

          replacements = [
              (b'https://raw.githubusercontent.com/zeshan0727/zeshan0727.github.io/main/', b'https://nextjailbreak.com/'),
              (b'http://raw.githubusercontent.com/zeshan0727/zeshan0727.github.io/main/', b'https://nextjailbreak.com/'),
              (b'https://zeshan0727.github.io/', b'https://nextjailbreak.com/'),
              (b'http://zeshan0727.github.io/', b'https://nextjailbreak.com/'),
              (b'https://www.zeshan0727.github.io/', b'https://nextjailbreak.com/'),
              (b'http://www.zeshan0727.github.io/', b'https://nextjailbreak.com/'),
              (b'https://github.com/zeshan0727/zeshan0727.github.io', b'https://github.com/zeshan0727/NextSolution'),
              (b'http://github.com/zeshan0727/zeshan0727.github.io', b'https://github.com/zeshan0727/NextSolution'),
          ]

          skip_dirs = {'.git', 'node_modules', 'DerivedData', 'build', '.build'}
          changed = []
          for path in root.rglob('*'):
              if not path.is_file() or path.as_posix() == workflow or any(part in skip_dirs for part in path.parts):
                  continue
              try:
                  data = path.read_bytes()
              except OSError:
                  continue
              if b'\0' in data[:8192]:
                  continue
              updated = data
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != data:
                  path.write_bytes(updated)
                  changed.append(path.as_posix())

          print(f'Text files migrated away from legacy repo URLs: {len(changed)}')
          for item in changed:
              print('  *', item)
          PY

      - name: Verify no operational legacy repo URLs remain in text files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = '.github/workflows/merge-legacy-github-io-into-main.yml'
          patterns = [
              b'https://zeshan0727.github.io',
              b'http://zeshan0727.github.io',
              b'https://raw.githubusercontent.com/zeshan0727/zeshan0727.github.io',
              b'http://raw.githubusercontent.com/zeshan0727/zeshan0727.github.io',
              b'https://github.com/zeshan0727/zeshan0727.github.io',
              b'http://github.com/zeshan0727/zeshan0727.github.io',
          ]
          hits = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.as_posix() == workflow:
                  continue
              try:
                  data = path.read_bytes()
              except OSError:
                  continue
              if b'\0' in data[:8192]:
                  continue
              found = [p.decode() for p in patterns if p in data]
              if found:
                  hits.append((path.as_posix(), found))
          print(f'Operational legacy repo URL hits: {len(hits)}')
          for path, found in hits:
              print('LEGACY_REPO_URL', path, ', '.join(found))
          if hits:
              raise SystemExit(1)
          PY

      - name: Commit merged content
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo 'No merge changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Merge legacy github.io content into main and retire its URLs'
          git pull --rebase origin main
          git push origin main
