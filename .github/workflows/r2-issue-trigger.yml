name: Temporary R2 Migration Trigger

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.event.issue.title == '[R2-MIGRATE-ONCE]'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch R2 migration
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run migrate-private-apps-to-r2.yml --repo "$GITHUB_REPOSITORY" --ref main -f confirm=MIGRATE
