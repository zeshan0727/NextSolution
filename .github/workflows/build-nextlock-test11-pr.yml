name: Validate NextLock Test 11 PR

on:
  pull_request:
    branches: [main]
    paths:
      - 'transfer/build-triggers/nextlock-test11.txt'
      - 'source/NextLockFeatureFix/**'
      - '.github/workflows/build-nextlock-test11-pr.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: brew install dpkg ldid
      - name: Build feature fixer
        shell: bash
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/source/NextLockFeatureFix"
          T="$RUNNER_TEMP/theos-rh"
          git init "$T"
          git -C "$T" remote add origin https://github.com/roothide/theos.git
          git -C "$T" fetch --depth 1 origin 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$T" checkout --detach 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$T" submodule update --init --recursive --depth 1
          export THEOS="$T" THEOS_PACKAGE_SCHEME=roothide
          make -C "$P" clean package FINALPACKAGE=1
          D=$(find "$P/packages" -name '*.deb' -print -quit)
          test -n "$D"
          X=$(mktemp -d); dpkg-deb -x "$D" "$X"
          F=$(find "$X" -name NextLockFeatureFix.dylib -print -quit)
          strings -a "$F" | grep -q '1.1.5-test11 live-position-color-shadow arm64e'
          lipo -info "$F" | grep -q arm64e
      - name: Validate Test 10 base and UI sources
        shell: bash
        run: |
          set -euo pipefail
          BASE='transfer/files/NextLock/1.1.5-CPUFix-Test10-TimeDateSliders/NextLock_1.1.5_CPUFix_Test10_TimeDateSliders_RootHide.deb'
          test -f "$BASE"
          X=$(mktemp -d); dpkg-deb -x "$BASE" "$X"
          test -f "$X/Library/PreferenceBundles/LockGlyphTimePrefs.bundle/Time.plist"
          test -f "$X/Library/PreferenceBundles/LockGlyphTimePrefs.bundle/Date.plist"
