name: Debug Next Ledger 1.3.72 SMS Scheduling
permissions:
  contents: read
concurrency:
  group: next-ledger-1-3-72-sms-debug-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-next-ledger-1.3.72.yml"
jobs:
  debug:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Apply 1.3.72
        run: bash scripts/apply_next_ledger_1_3_72.sh
      - name: Collect generated SMS sources
        shell: bash
        run: |
          mkdir -p generated
          cp RootHideSMSQueue/Sources/main.m generated/nextledgersmsd-2.2.3.m
          cp DailyLedger/Views/SMSImportConsoleView.swift generated/SMSImportConsoleView.swift
          cp DailyLedger/Services/SMSImportConsoleService.swift generated/SMSImportConsoleService.swift
          grep -R -n "scanInterval\|recovery\|AutomaticScan\|sleep(\|autoRecord\|scanRequest" RootHideSMSQueue/Sources/main.m DailyLedger/Views/SMSImportConsoleView.swift DailyLedger/Services/SMSImportConsoleService.swift > generated/matches.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: NextLedger-1.3.72-SMS-Scheduling-Generated
          path: generated
          if-no-files-found: error
