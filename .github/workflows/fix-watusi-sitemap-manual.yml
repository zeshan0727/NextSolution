name: Fix Watusi 3 sitemap indexing

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-watusi-sitemap-manual.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add Watusi URL to sitemap
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          path = Path('sitemap.xml')
          ns = 'http://www.sitemaps.org/schemas/sitemap/0.9'
          ET.register_namespace('', ns)
          tree = ET.parse(path)
          root = tree.getroot()
          target = 'https://nextjailbreak.com/watusi-3-1-3-22-update/'
          urls = list(root)
          for node in urls:
              loc = node.find(f'{{{ns}}}loc')
              if loc is not None and (loc.text or '').strip() == target:
                  root.remove(node)
          node = ET.SubElement(root, f'{{{ns}}}url')
          ET.SubElement(node, f'{{{ns}}}loc').text = target
          ET.SubElement(node, f'{{{ns}}}lastmod').text = '2026-08-31'
          ET.SubElement(node, f'{{{ns}}}changefreq').text = 'monthly'
          ET.SubElement(node, f'{{{ns}}}priority').text = '0.8'
          tree.write(path, encoding='utf-8', xml_declaration=True)
          PY
      - name: Commit sitemap fix
        run: |
          git config user.name "nextsolution-publisher[bot]"
          git config user.email "nextsolution-publisher[bot]@users.noreply.github.com"
          git add sitemap.xml
          git rm .github/workflows/fix-watusi-sitemap-manual.yml
          git commit -m "Add Watusi 3 1.3.22 to sitemap"
          git push origin HEAD:main
