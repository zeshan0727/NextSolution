name: Build Next Ledger 1.3.53 Realtime OpenAI SMS Recovery

permissions:
  contents: write

concurrency:
  group: next-ledger-1-3-53-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - "DailyLedger/**"
      - "RootHideSMSQueue/**"
      - "scripts/**"
      - "project.yml"
      - ".github/workflows/build-next-ledger-1.3.51.yml"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Next Ledger feature patches
        run: |
          python3 scripts/apply_next_ledger_1_3_50_compact_no_sms.py
          python3 scripts/fix_next_ledger_refund_swift.py
          python3 scripts/add_refund_account_picker.py
          python3 scripts/add_currency_selectors_and_global_delete.py
          python3 scripts/add_inline_accounts_and_general_subaccounts.py
          python3 scripts/add_parent_totals_and_statement_chart.py
          python3 scripts/add_collapsible_chart_sections.py
          python3 scripts/add_edit_refund_delete_swipe_actions.py
          python3 scripts/add_bank_expenses_and_fixed_report_conversion.py
          python3 scripts/fix_summary_loan_sides_and_accounts_zero_filter.py
          python3 scripts/add_payment_receivable_payable_automation.py
          python3 scripts/add_receivable_collection_drilldown.py
          python3 scripts/add_loan_summary_comparison_report.py
          python3 scripts/fix_loan_summary_comparison_ios16.py
          python3 scripts/add_accounting_period_setting.py
          python3 scripts/add_custom_dates_to_loan_summary_comparison.py
          python3 scripts/add_root_sms_daemon_console.py
          python3 scripts/add_sms_installer_diagnostics.py
          python3 scripts/fix_roothide_messages_database_access.py
          python3 scripts/add_sms_draft_approval_and_unrecorded_sync.py
          python3 scripts/fix_sms_draft_inbox_ios16_and_migration.py
          python3 scripts/add_selectable_accounting_period_lock.py
          python3 scripts/prepare_sms_console_counter_patch.py
          python3 scripts/fix_sms_draft_fields_and_message_decoding.py
          python3 scripts/add_interval_latest10_sms_recovery.py
          python3 scripts/fix_sms_interval_unused_diagnostics.py
          python3 scripts/add_manual30_restore_rejected_and_compact_ai.py
          python3 scripts/add_fawran_transfer_and_editable_sms_review.py
          python3 scripts/fix_fawran_regex_escape.py
          python3 scripts/fix_financial_summary_auto_sms_and_compact_settings.py
          python3 scripts/prepare_settings_pages_sms_cleanup_patch.py
          python3 scripts/add_settings_pages_custom_sms_and_log_cleanup.py
          python3 scripts/add_professional_report_exports.py
          python3 scripts/add_sms_realtime_progress_ai_1_3_51.py
          python3 scripts/add_sms_scan_session_ai_proof_1_3_52.py
          python3 scripts/add_sms_database_openai_recovery_1_3_53.py

      - name: Install build tools
        run: brew install xcodegen dpkg ldid

      - name: Validate database to OpenAI recovery
        run: |
          mkdir -p build
          grep -Fq 'MARKETING_VERSION: "1.3.53"' project.yml
          grep -Fq 'CURRENT_PROJECT_VERSION: "61"' project.yml
          grep -Fq 'kDaemonVersion = @"2.2.0"' RootHideSMSQueue/Sources/main.m
          grep -Fq 'QueueAICandidate' RootHideSMSQueue/Sources/main.m
          grep -Fq 'sms-ai-candidates.json' RootHideSMSQueue/Sources/main.m
          grep -Fq 'sms-ai-processed.json' RootHideSMSQueue/Sources/main.m
          grep -Fq 'manualScanClaimedAt' RootHideSMSQueue/Sources/main.m
          grep -Fq 'Previous scan interrupted' RootHideSMSQueue/Sources/main.m
          grep -Fq 'attributed-body CUR1 recovery' RootHideSMSQueue/Sources/main.m
          grep -Fq 'struct SMSAICandidate' DailyLedger/Services/SMSImportConsoleService.swift
          grep -Fq 'loadAICandidates' DailyLedger/Services/SMSImportConsoleService.swift
          grep -Fq 'applyAIRecovery' DailyLedger/Services/SMSImportConsoleService.swift
          grep -Fq 'analyze(candidate:' DailyLedger/Services/SMSAIRecognitionService.swift
          grep -Fq 'income|expense|transfer|ignore' DailyLedger/Services/SMSAIRecognitionService.swift
          grep -Fq 'Database AI Queue' DailyLedger/Views/SMSImportConsoleView.swift
          grep -Fq 'OpenAI API' DailyLedger/Views/SMSImportConsoleView.swift
          grep -Fq 'Verified database →' DailyLedger/Views/SMSImportConsoleView.swift

          xcrun clang -fobjc-arc RootHideSMSQueue/Sources/main.m \
            -framework Foundation -framework CoreFoundation -lsqlite3 \
            -o build/nextledgersmsd-macos
          build/nextledgersmsd-macos --self-test | tee build/sms-parser-tests.json
          grep -q '"passed" : true' build/sms-parser-tests.json
          grep -q '"version" : "2.2.0"' build/sms-parser-tests.json
          grep -q 'current account card payment transfer' build/sms-parser-tests.json
          grep -q 'attributed-body CUR1 recovery' build/sms-parser-tests.json

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iPhone app
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project DailyLedger.xcodeproj \
            -scheme DailyLedger \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build/xcodebuild.log

      - name: Build RootHide SMS daemon 2.2.0
        shell: bash
        run: |
          set -euxo pipefail
          THEOS_COMMIT="88506b2c22e9e07dd4ed055f23c9e398a117a2c7"
          git init "$RUNNER_TEMP/theos"
          git -C "$RUNNER_TEMP/theos" remote add origin https://github.com/roothide/theos.git
          git -C "$RUNNER_TEMP/theos" fetch --depth 1 origin "$THEOS_COMMIT"
          git -C "$RUNNER_TEMP/theos" checkout --detach "$THEOS_COMMIT"
          git -C "$RUNNER_TEMP/theos" submodule update --init --recursive --depth 1
          export THEOS="$RUNNER_TEMP/theos"
          cmp RootHideSMSQueue/postinst RootHideSMSQueue/layout/DEBIAN/postinst
          chmod +x RootHideSMSQueue/postinst RootHideSMSQueue/prerm \
            RootHideSMSQueue/layout/DEBIAN/postinst RootHideSMSQueue/layout/DEBIAN/prerm
          make -C RootHideSMSQueue clean package FINALPACKAGE=1
          cp RootHideSMSQueue/packages/*.deb NextLedgerSMSDaemon-2.2.0-roothide.deb
          test "$(dpkg-deb -f NextLedgerSMSDaemon-2.2.0-roothide.deb Version)" = "2.2.0"
          shasum -a 256 NextLedgerSMSDaemon-2.2.0-roothide.deb > NextLedgerSMSDaemon-2.2.0-roothide.sha256

      - name: Package Next Ledger 1.3.53 TIPA
        run: |
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload NextLedger-1.3.53-realtime-openai-sms-recovery.tipa
          shasum -a 256 NextLedger-1.3.53-realtime-openai-sms-recovery.tipa > NextLedger-1.3.53-realtime-openai-sms-recovery.sha256

      - name: Upload Next Ledger 1.3.53 build
        uses: actions/upload-artifact@v4
        with:
          name: NextLedger-1.3.53-Realtime-OpenAI-SMS-Recovery
          path: |
            NextLedger-1.3.53-realtime-openai-sms-recovery.tipa
            NextLedger-1.3.53-realtime-openai-sms-recovery.sha256
            NextLedgerSMSDaemon-2.2.0-roothide.deb
            NextLedgerSMSDaemon-2.2.0-roothide.sha256
            build/sms-parser-tests.json
          if-no-files-found: error

      - name: Capture diagnostics
        if: failure()
        run: |
          mkdir -p build
          {
            test -f build/xcodebuild.log && grep -E "error:|fatal error:|SwiftCompile|BUILD FAILED" build/xcodebuild.log || true
            test -f build/sms-parser-tests.json && cat build/sms-parser-tests.json || true
          } > build/next-ledger-1.3.53-errors.txt

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NextLedger-1.3.53-Diagnostics
          path: build/next-ledger-1.3.53-errors.txt
          if-no-files-found: warn

      - name: Publish full-build status
        if: always()
        shell: bash
        run: |
          STATUS="${{ job.status }}"
          cp build/next-ledger-1.3.53-errors.txt /tmp/next-ledger-errors.txt 2>/dev/null || true
          git reset --hard HEAD
          git clean -fd
          git fetch origin "$GITHUB_REF_NAME"
          git checkout -B build-status "origin/$GITHUB_REF_NAME"
          mkdir -p .build-status
          cat > .build-status/next-ledger-1.3.53.json <<EOF
          {
            "status": "${STATUS}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_number": "${GITHUB_RUN_NUMBER}",
            "source_sha": "${GITHUB_SHA}",
            "app_version": "1.3.53",
            "app_build": "61",
            "daemon_version": "2.2.0",
            "artifact_name": "NextLedger-1.3.53-Realtime-OpenAI-SMS-Recovery"
          }
          EOF
          if [ -f /tmp/next-ledger-errors.txt ]; then
            cp /tmp/next-ledger-errors.txt .build-status/next-ledger-1.3.53-errors.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .build-status/next-ledger-1.3.53.json
          test ! -f .build-status/next-ledger-1.3.53-errors.txt || git add .build-status/next-ledger-1.3.53-errors.txt
          git commit -m "Record Next Ledger 1.3.53 full build status" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
