name: Build Aspire Maintenance TIPA

on:
  workflow_dispatch:
  push:
    branches:
      - agent/aspire-maintenance-1.0.1
    paths:
      - "AspireMaintenanceSourceChunks/**"
      - "AspireMaintenancePatchScript101/**"
      - "AspireMaintenancePatchAssets/**"
      - ".github/workflows/build-aspire-maintenance.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths:
      - "AspireMaintenanceSourceChunks/**"
      - "AspireMaintenancePatchScript101/**"
      - "AspireMaintenancePatchAssets/**"
      - ".github/workflows/build-aspire-maintenance.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Restore Aspire source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          chunks = sorted(Path("AspireMaintenanceSourceChunks").glob("part-*"))
          encoded = "".join(chunk.read_text() for chunk in chunks)
          Path("AspireMaintenanceSource.zip").write_bytes(base64.b64decode(encoded))
          PY
          ditto -x -k AspireMaintenanceSource.zip .

      - name: Apply Aspire 1.0.1 fixes
        run: |
          cat AspireMaintenancePatchScript101/part-* > apply_aspire_1_0_1.py
          python3 apply_aspire_1_0_1.py

      - name: Validate Swift syntax
        run: |
          find AspireMaintenance -name '*.swift' \
            -not -path 'AspireMaintenance/Scripts/*' \
            -print0 | while IFS= read -r -d '' file; do
              echo "Parsing $file"
              swiftc -frontend -parse "$file"
            done

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Aspire app icon
        run: |
          xcrun --sdk macosx swift \
            AspireMaintenance/Scripts/GenerateIcon.swift \
            AspireMaintenance/Assets.xcassets/AspireLogo.imageset/AspireLogo.png \
            AspireMaintenance/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png

      - name: Generate Xcode project
        run: |
          cd AspireMaintenance
          xcodegen generate

      - name: Build unsigned iPhone app
        run: |
          set -o pipefail
          xcodebuild \
            -quiet \
            -project AspireMaintenance/AspireMaintenance.xcodeproj \
            -scheme AspireMaintenance \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build-aspire-maintenance \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee aspire-maintenance-build.log

      - name: Upload compiler log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AspireMaintenance-Compiler-Log-1.0.1
          path: aspire-maintenance-build.log
          if-no-files-found: ignore

      - name: Package for TrollStore
        run: |
          APP_PATH="$(find build-aspire-maintenance/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload AspireMaintenance-1.0.1.tipa
          shasum -a 256 AspireMaintenance-1.0.1.tipa > AspireMaintenance-1.0.1.sha256

      - name: Package source
        run: |
          rm -rf AspireMaintenance/AspireMaintenance.xcodeproj
          ditto -c -k --sequesterRsrc --keepParent AspireMaintenance AspireMaintenance-1.0.1-source.zip

      - name: Upload TIPA and source
        uses: actions/upload-artifact@v4
        with:
          name: AspireMaintenance-TrollStore-1.0.1
          path: |
            AspireMaintenance-1.0.1.tipa
            AspireMaintenance-1.0.1.sha256
            AspireMaintenance-1.0.1-source.zip
          if-no-files-found: error
