name: Build Aspire Maintenance 1.1.4

on:
  workflow_dispatch:
  push:
    branches:
      - agent/aspire-maintenance-1.1.4
    paths:
      - "AspireMaintenanceSourceChunks/**"
      - "AspireMaintenancePatchScript101/**"
      - "AspireMaintenancePatchAssets/**"
      - "AspireMaintenanceRelease110/**"
      - "AspireMaintenanceRelease112Final/**"
      - "AspireMaintenanceRelease113/**"
      - "AspireMaintenanceRelease114/**"
      - ".github/workflows/build-aspire-maintenance.yml"
  pull_request:
    branches:
      - agent/aspire-maintenance-1.1.4
    paths:
      - "AspireMaintenanceRelease114/**"
      - ".github/workflows/build-aspire-maintenance.yml"
      - "AspireMaintenanceBuildTrigger114/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Restore Aspire base source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          chunks = sorted(Path("AspireMaintenanceSourceChunks").glob("part-*"))
          encoded = "".join(chunk.read_text() for chunk in chunks)
          Path("AspireMaintenanceSource.zip").write_bytes(base64.b64decode(encoded))
          PY
          ditto -x -k AspireMaintenanceSource.zip .

      - name: Apply Aspire 1.0.1 fixes
        run: |
          cat AspireMaintenancePatchScript101/part-* > apply_aspire_1_0_1.py
          python3 apply_aspire_1_0_1.py

      - name: Apply Aspire 1.1.1 baseline
        run: |
          cat AspireMaintenanceRelease110/part-* > /tmp/aspire111.b64
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip
          encoded = Path("/tmp/aspire111.b64").read_text().strip()
          Path("/tmp/aspire111.patch").write_bytes(gzip.decompress(base64.b64decode(encoded)))
          PY
          patch --batch -p2 -d AspireMaintenance < /tmp/aspire111.patch

      - name: Apply Aspire 1.1.2 fixes
        run: |
          cat AspireMaintenanceRelease112Final/part-* > /tmp/aspire112.b64
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip
          encoded = Path("/tmp/aspire112.b64").read_text().strip()
          Path("/tmp/aspire112.patch").write_bytes(gzip.decompress(base64.b64decode(encoded)))
          PY
          patch --batch -p2 -d AspireMaintenance < /tmp/aspire112.patch

      - name: Apply Aspire 1.1.3 backup import fix
        run: |
          cat AspireMaintenanceRelease113/part-* > /tmp/aspire113.b64
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip
          encoded = Path("/tmp/aspire113.b64").read_text().strip()
          Path("/tmp/aspire113.patch").write_bytes(gzip.decompress(base64.b64decode(encoded)))
          PY
          patch --batch -p2 -d AspireMaintenance < /tmp/aspire113.patch

      - name: Apply Aspire 1.1.4 dashboard redesign
        run: |
          cat AspireMaintenanceRelease114/part-* > /tmp/aspire114.b64
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip
          encoded = Path("/tmp/aspire114.b64").read_text().strip()
          Path("/tmp/aspire114.patch").write_bytes(gzip.decompress(base64.b64decode(encoded)))
          PY
          patch --batch -p2 -d AspireMaintenance < /tmp/aspire114.patch
          grep -q 'MARKETING_VERSION: "1.1.4"' AspireMaintenance/project.yml
          grep -q 'CURRENT_PROJECT_VERSION: "7"' AspireMaintenance/project.yml

      - name: Validate Swift syntax
        run: |
          find AspireMaintenance -name '*.swift' -not -path 'AspireMaintenance/Scripts/*' -print0 | while IFS= read -r -d '' file; do
            echo "Parsing $file"
            swiftc -frontend -parse "$file"
          done

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Aspire app icon
        run: |
          xcrun --sdk macosx swift AspireMaintenance/Scripts/GenerateIcon.swift AspireMaintenance/Assets.xcassets/AspireLogo.imageset/AspireLogo.png AspireMaintenance/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png

      - name: Generate Xcode project
        run: |
          cd AspireMaintenance
          xcodegen generate

      - name: Build unsigned iPhone Release app
        run: |
          set -o pipefail
          xcodebuild -quiet -project AspireMaintenance/AspireMaintenance.xcodeproj -scheme AspireMaintenance -configuration Release -sdk iphoneos -derivedDataPath build-aspire-maintenance CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee aspire-maintenance-build.log

      - name: Upload compiler log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AspireMaintenance-Compiler-Log-1.1.4
          path: aspire-maintenance-build.log
          if-no-files-found: ignore

      - name: Package unsigned IPA and TIPA
        run: |
          APP_PATH="$(find build-aspire-maintenance/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload AspireMaintenance-1.1.4-unsigned.ipa
          cp AspireMaintenance-1.1.4-unsigned.ipa AspireMaintenance-1.1.4.tipa
          shasum -a 256 AspireMaintenance-1.1.4-unsigned.ipa > AspireMaintenance-1.1.4-unsigned.ipa.sha256
          shasum -a 256 AspireMaintenance-1.1.4.tipa > AspireMaintenance-1.1.4.tipa.sha256

      - name: Package source
        run: |
          rm -rf AspireMaintenance/AspireMaintenance.xcodeproj
          ditto -c -k --sequesterRsrc --keepParent AspireMaintenance AspireMaintenance-1.1.4-source.zip

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: AspireMaintenance-1.1.4-Build
          path: |
            AspireMaintenance-1.1.4-unsigned.ipa
            AspireMaintenance-1.1.4-unsigned.ipa.sha256
            AspireMaintenance-1.1.4.tipa
            AspireMaintenance-1.1.4.tipa.sha256
            AspireMaintenance-1.1.4-source.zip
          if-no-files-found: error

      - name: Publish Aspire 1.1.4 to NS Transfer
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSET="aspiremaintenance-1-1-4-1.1.4-7.ipa"
          cp AspireMaintenance-1.1.4-unsigned.ipa "$ASSET"
          if ! gh release view private-apps >/dev/null 2>&1; then
            gh release create private-apps --title "Private Apps" --notes "Private app builds used by NS Transfer"
          fi
          gh release upload private-apps "$ASSET" --clobber

          git fetch origin main
          git checkout -B ns-transfer-publish origin/main
          mkdir -p install/manifests
          cat > install/manifests/aspiremaintenance-1-1-4.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>items</key>
            <array>
              <dict>
                <key>assets</key>
                <array>
                  <dict>
                    <key>kind</key>
                    <string>software-package</string>
                    <key>url</key>
                    <string>https://github.com/zeshan0727/NextJailbreak/releases/download/private-apps/aspiremaintenance-1-1-4-1.1.4-7.ipa</string>
                  </dict>
                </array>
                <key>metadata</key>
                <dict>
                  <key>bundle-identifier</key>
                  <string>com.aspiregroup.maintenance</string>
                  <key>bundle-version</key>
                  <string>7</string>
                  <key>kind</key>
                  <string>software</string>
                  <key>title</key>
                  <string>Aspire Maintenance 1.1.4</string>
                </dict>
              </dict>
            </array>
          </dict>
          </plist>
          PLIST

          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('install/apps.json')
          data = json.loads(path.read_text())
          apps = data.get('apps', [])
          item = {
              'available': True,
              'build': '7',
              'bundleId': 'com.aspiregroup.maintenance',
              'icon': '/logo.png',
              'id': 'aspiremaintenance-1-1-4',
              'manifest': '/install/manifests/aspiremaintenance-1-1-4.plist',
              'minimumOS': 'iOS 16.0+',
              'name': 'Aspire Maintenance 1.1.4',
              'platform': 'iPhone',
              'status': 'Ready to install',
              'version': '1.1.4'
          }
          replaced = False
          new_apps = []
          for app in apps:
              if str(app.get('id','')).startswith('aspiremaintenance-'):
                  if not replaced:
                      new_apps.append(item)
                      replaced = True
                  continue
              new_apps.append(app)
          if not replaced:
              insert_at = 2 if len(new_apps) >= 2 else len(new_apps)
              new_apps.insert(insert_at, item)
          data['apps'] = new_apps
          data['updated'] = '2026-09-02'
          path.write_text(json.dumps(data, indent=2) + '\n')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add install/apps.json install/manifests/aspiremaintenance-1-1-4.plist
          if ! git diff --cached --quiet; then
            git commit -m "Publish Aspire Maintenance 1.1.4 to NS Transfer"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
