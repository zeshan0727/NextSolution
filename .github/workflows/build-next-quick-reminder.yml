name: Build Next Reminder v1.3.13 and Quick Gesture Tweak

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: brew install dpkg ldid xz

      - name: Validate quick gesture sources
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/2026-08-04-NextQuickReminder"
          python3 "$P/prepare-build.py"
          plutil -lint "$P/Preferences/Resources/Root.plist"
          plutil -lint "$P/Preferences/Resources/Info.plist"
          plutil -lint "$P/layout/Library/PreferenceLoader/Preferences/NextQuickReminder.plist"
          grep -q 'Double-tap Status-Bar Time' "$P/Preferences/Resources/Root.plist"
          grep -q 'Shake Device' "$P/Preferences/Resources/Root.plist"
          grep -q 'Hold Volume Up' "$P/Preferences/Resources/Root.plist"
          grep -q 'validValues' "$P/Preferences/Resources/Root.plist"
          grep -q 'NQRSelectedGesture' "$P/Tweak.xm"
          grep -q 'nextreminder://quick-add' "$P/Tweak.xm"
          grep -q 'Save Draft' "$P/Tweak.xm"
          grep -q 'NextQuickReminder.log' "$P/Tweak.xm"
          grep -q 'com.apple.springboard' "$P/NextQuickReminder.plist"

      - name: Build Next Reminder v1.3.13
        run: |
          chmod +x NextReminderApp/ci/build-v143.sh
          set -o pipefail
          NextReminderApp/ci/build-v143.sh 2>&1 | tee v143-app-build.log

      - name: Build RootHide quick gesture tweak
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/2026-08-04-NextQuickReminder"
          OUT="$RUNNER_TEMP/quick-reminder-out"
          mkdir -p "$OUT"

          git init "$RUNNER_TEMP/theos-rh"
          git -C "$RUNNER_TEMP/theos-rh" remote add origin https://github.com/roothide/theos.git
          git -C "$RUNNER_TEMP/theos-rh" fetch --depth 1 origin 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$RUNNER_TEMP/theos-rh" checkout --detach 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$RUNNER_TEMP/theos-rh" submodule update --init --recursive --depth 1

          sed -i '' 's/^Architecture: iphoneos-arm64$/Architecture: iphoneos-arm64e/' "$P/control"
          export THEOS="$RUNNER_TEMP/theos-rh" THEOS_PACKAGE_SCHEME=roothide
          make -C "$P" clean package FINALPACKAGE=1 2>&1 | tee v143-tweak-build.log

          DEB="$(find "$P/packages" -name '*_iphoneos-arm64e.deb' -print -quit)"
          test -n "$DEB"
          cp "$DEB" "$OUT/NextQuickReminder_1.0.0_RootHide.deb"
          ditto -c -k --sequesterRsrc --keepParent "$P" "$OUT/NextQuickReminder_1.0.0_Source.zip"

      - name: Verify RootHide package
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/quick-reminder-out"
          DEB="$OUT/NextQuickReminder_1.0.0_RootHide.deb"
          test "$(dpkg-deb -f "$DEB" Package)" = com.nextsolution.nextquickreminder
          test "$(dpkg-deb -f "$DEB" Version)" = 1.0.0
          dpkg-deb -f "$DEB" Depends | grep -q preferenceloader
          X="$(mktemp -d)"
          dpkg-deb -x "$DEB" "$X"
          DYLIB="$(find "$X" -name NextQuickReminder.dylib -print -quit)"
          test -n "$DYLIB"
          find "$X" -path '*NextQuickReminderPreferences.bundle/Root.plist' | grep -q .
          find "$X" -path '*PreferenceLoader/Preferences/NextQuickReminder.plist' | grep -q .
          strings -a "$DYLIB" | grep -q 'nextreminder://quick-add'
          strings -a "$DYLIB" | grep -q 'status-bar time double tap'
          strings -a "$DYLIB" | grep -q 'Shake gesture recognized'
          strings -a "$DYLIB" | grep -q 'Volume Up hold recognized'
          strings -a "$DYLIB" | grep -q 'NextQuickReminder.log'
          shasum -a 256 "$OUT/NextQuickReminder_1.0.0_RootHide.deb" > "$OUT/NextQuickReminder_1.0.0_RootHide.deb.sha256"

      - name: Upload final packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NextReminder-v1.3.13-QuickGesture
          if-no-files-found: warn
          path: |
            NextReminderApp/NextReminder-v1.3.13-unsigned.tipa
            NextReminderApp/NextReminder-v1.3.13-unsigned.ipa
            NextReminderApp/NextReminder-v1.3.13-unsigned.tipa.sha256
            NextReminderApp/xcodebuild.log
            v143-app-build.log
            v143-tweak-build.log
            ${{ runner.temp }}/quick-reminder-out/NextQuickReminder_1.0.0_RootHide.deb
            ${{ runner.temp }}/quick-reminder-out/NextQuickReminder_1.0.0_RootHide.deb.sha256
            ${{ runner.temp }}/quick-reminder-out/NextQuickReminder_1.0.0_Source.zip
