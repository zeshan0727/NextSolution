name: Build and Publish Low Power Mode Haptic 1.0.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-low-power-mode-haptic-1.0.0.yml"

permissions:
  contents: write

concurrency:
  group: nextsolution-low-power-mode-haptic-1.0.0
  cancel-in-progress: false

jobs:
  build-validate-publish:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: brew install dpkg ldid xz zstd

      - name: Deterministic source checks
        shell: bash
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/2026-08-01-LowPowerModeHaptic"
          clang -std=c11 -Wall -Wextra -Werror "$P/tests/test_decision.c" -o "$RUNNER_TEMP/test_decision"
          "$RUNNER_TEMP/test_decision" | tee "$RUNNER_TEMP/decision-test.log"
          grep -q 'NSProcessInfoPowerStateDidChangeNotification' "$P/Tweak.xm"
          grep -q 'lowPowerModeEnabled' "$P/Tweak.xm"
          grep -q 'notificationOccurred' "$P/Tweak.xm"
          test "$(grep -c '<string>PSSwitchCell</string>' "$P/Preferences/Resources/Root.plist")" -eq 1
          ! grep -Eq 'Test|Diagnostic|Runtime|PID|Hook|Class' "$P/Preferences/Resources/Root.plist"
          plutil -lint "$P/LowPowerModeHaptic.plist"
          plutil -lint "$P/Preferences/Resources/Root.plist"
          plutil -lint "$P/Preferences/Resources/Info.plist"
          plutil -lint "$P/layout/Library/PreferenceLoader/Preferences/LowPowerModeHaptic.plist"

      - name: Build rootless
        shell: bash
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/2026-08-01-LowPowerModeHaptic"
          OUT="$RUNNER_TEMP/lpmh-release"; mkdir -p "$OUT"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos-rootless"
          export THEOS="$RUNNER_TEMP/theos-rootless" THEOS_PACKAGE_SCHEME=rootless
          rm -rf "$P/packages"
          make -C "$P" clean package FINALPACKAGE=1 2>&1 | tee "$RUNNER_TEMP/rootless-build.log"
          D="$(find "$P/packages" -type f -name '*_iphoneos-arm64.deb' -print -quit)"; test -n "$D"
          cp "$D" "$OUT/LowPowerModeHaptic_1.0.0_Rootless.deb"

      - name: Build RootHide
        shell: bash
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/2026-08-01-LowPowerModeHaptic"
          OUT="$RUNNER_TEMP/lpmh-release"
          git init "$RUNNER_TEMP/theos-roothide"
          git -C "$RUNNER_TEMP/theos-roothide" remote add origin https://github.com/roothide/theos.git
          git -C "$RUNNER_TEMP/theos-roothide" fetch --depth 1 origin 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$RUNNER_TEMP/theos-roothide" checkout --detach 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$RUNNER_TEMP/theos-roothide" submodule update --init --recursive --depth 1
          sed -i '' 's/^Architecture: iphoneos-arm64$/Architecture: iphoneos-arm64e/' "$P/control"
          export THEOS="$RUNNER_TEMP/theos-roothide" THEOS_PACKAGE_SCHEME=roothide
          rm -rf "$P/packages"
          make -C "$P" clean package FINALPACKAGE=1 2>&1 | tee "$RUNNER_TEMP/roothide-build.log"
          D="$(find "$P/packages" -type f -name '*_iphoneos-arm64e.deb' -print -quit)"; test -n "$D"
          cp "$D" "$OUT/LowPowerModeHaptic_1.0.0_RootHide.deb"

      - name: Validate package layouts
        shell: bash
        run: |
          set -euo pipefail
          check(){
            d="$1"; a="$2"; x="$(mktemp -d)"
            test "$(dpkg-deb -f "$d" Package)" = com.nextsolution.lowpowermodehaptic
            test "$(dpkg-deb -f "$d" Name)" = "Low Power Mode Haptic"
            test "$(dpkg-deb -f "$d" Version)" = 1.0.0
            test "$(dpkg-deb -f "$d" Architecture)" = "$a"
            dpkg-deb -f "$d" Depends | grep -q preferenceloader
            dpkg-deb -x "$d" "$x"
            dylib="$(find "$x" -name LowPowerModeHaptic.dylib -print -quit)"
            filter="$(find "$x" -name LowPowerModeHaptic.plist -path '*DynamicLibraries*' -print -quit)"
            root="$(find "$x" -path '*LowPowerModeHapticPreferences.bundle/Root.plist' -print -quit)"
            info="$(find "$x" -path '*LowPowerModeHapticPreferences.bundle/Info.plist' -print -quit)"
            entry="$(find "$x" -path '*PreferenceLoader/Preferences/LowPowerModeHaptic.plist' -print -quit)"
            test -s "$dylib"; test -s "$filter"; test -s "$root"; test -s "$info"; test -s "$entry"
            plutil -lint "$filter" "$root" "$info" "$entry"
            grep -q 'com.apple.springboard' "$filter"
            grep -q 'Enable Low Power Mode Haptic' "$root"
            rm -rf "$x"
          }
          O="$RUNNER_TEMP/lpmh-release"
          check "$O/LowPowerModeHaptic_1.0.0_Rootless.deb" iphoneos-arm64
          check "$O/LowPowerModeHaptic_1.0.0_RootHide.deb" iphoneos-arm64e
          shasum -a 256 "$O"/*.deb | tee "$RUNNER_TEMP/build-validation.txt"

      - name: Upload compiler record
        uses: actions/upload-artifact@v4
        with:
          name: low-power-mode-haptic-published-build
          path: |
            ${{ runner.temp }}/lpmh-release/*.deb
            ${{ runner.temp }}/decision-test.log
            ${{ runner.temp }}/rootless-build.log
            ${{ runner.temp }}/roothide-build.log
            ${{ runner.temp }}/build-validation.txt

      - name: Publish to Sileo repository
        shell: bash
        run: |
          set -euo pipefail
          O="$RUNNER_TEMP/lpmh-release"
          git config user.name "Next Solution Build Bot"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p debfiles "$RUNNER_TEMP/lpmh-scan"
            cp "$O"/*.deb debfiles/
            cp "$O"/*.deb "$RUNNER_TEMP/lpmh-scan/"
            dpkg-scanpackages -m "$RUNNER_TEMP/lpmh-scan" /dev/null > "$RUNNER_TEMP/lpmh-stanzas"
            sed -i '' 's|^Filename: .*/lpmh-scan/|Filename: ./debfiles/|' "$RUNNER_TEMP/lpmh-stanzas"
            python3 - "$RUNNER_TEMP/lpmh-stanzas" <<'PY'
          from pathlib import Path
          import re, sys
          p=Path('Packages'); old=p.read_text() if p.exists() else ''
          rows=[x.strip() for x in re.split(r'\n\s*\n',old) if x.strip()]
          rows=[x for x in rows if not re.search(r'^Package: com\.nextsolution\.lowpowermodehaptic$',x,re.M)]
          new=[x.strip() for x in re.split(r'\n\s*\n',Path(sys.argv[1]).read_text()) if x.strip()]
          p.write_text('\n\n'.join(rows+new)+'\n')
          PY
            test "$(grep -c '^Package: com.nextsolution.lowpowermodehaptic$' Packages)" -eq 2
            test "$(grep -c '^Filename: ./debfiles/LowPowerModeHaptic_1.0.0_Root' Packages)" -eq 2
            gzip -9 -c Packages > Packages.gz
            bzip2 -9 -c Packages > Packages.bz2
            xz -9e -c Packages > Packages.xz
            zstd -19 -q -c Packages > Packages.zst
            python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import re
          p=Path('Release'); t=p.read_text(); m=re.search(r'^Version: (\d+)\.(\d+)\.(\d+)$',t,re.M)
          if m: t=re.sub(r'^Version: .*$',f'Version: {m.group(1)}.{m.group(2)}.{int(m.group(3))+1}',t,flags=re.M)
          t=re.sub(r'^Date: .*$', 'Date: '+datetime.now(timezone.utc).strftime('%a, %d %b %Y %H:%M:%S UTC'),t,flags=re.M)
          p.write_text(t)
          PY
            rm -f .github/workflows/publish-low-power-mode-haptic-1.0.0.yml
            git add debfiles/LowPowerModeHaptic_1.0.0_Rootless.deb debfiles/LowPowerModeHaptic_1.0.0_RootHide.deb Packages Packages.gz Packages.bz2 Packages.xz Packages.zst Release .github/workflows/publish-low-power-mode-haptic-1.0.0.yml
            git diff --cached --check
            git commit -m "Publish Low Power Mode Haptic 1.0.0"
            git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1
