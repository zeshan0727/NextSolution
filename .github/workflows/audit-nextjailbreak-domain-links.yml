# Final migration verification
name: Audit Next Jailbreak domain links

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-nextjailbreak-domain-links.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Scan every tracked file for legacy website URLs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          base = "next" + "solution"
          hosts = (base + "." + "cc", base + "." + "app")
          patterns = []
          for host in hosts:
              patterns.extend([
                  ("http://" + host).encode(),
                  ("https://" + host).encode(),
                  ("http://www." + host).encode(),
                  ("https://www." + host).encode(),
                  ("www." + host).encode(),
              ])

          raw = subprocess.check_output(["git", "ls-files", "-z"])
          files = [Path(item.decode()) for item in raw.split(b"\0") if item]
          hits = []
          for path in files:
              try:
                  data = path.read_bytes().lower()
              except OSError:
                  continue
              matched = [p.decode() for p in patterns if p in data]
              if matched:
                  hits.append((str(path), sorted(set(matched))))

          print(f"Tracked files scanned: {len(files)}")
          print(f"Files containing legacy website URLs: {len(hits)}")
          for path, matched in hits:
              print(f"LEGACY_URL {path}: {', '.join(matched)}")

          if hits:
              raise SystemExit(1)
          print("PASS: no legacy Next Solution website URLs remain in tracked files.")
          PY
