name: Verified tweak article publisher

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "automation/publisher-trigger.json"
  schedule:
    # Publish at 06:00, 14:00, and 22:00 Qatar time (UTC+3).
    - cron: "0 3,11,19 * * *"
  pull_request:
    paths:
      - "automation/**"
      - "assets/site.css"
      - "assets/articles/**"
      - "assets/brand/**"
      - "index.html"
      - "top-home-screen-tweaks.html"
      - "tutorials.html"
      - "videos.html"
      - "sitemap.xml"
      - ".github/workflows/tweak-feed-dry-run.yml"
      - ".github/workflows/tweak-draft-generator.yml"

permissions:
  contents: read

concurrency:
  group: nextsolution-content-state
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run deterministic tests
        run: python3 -m unittest discover -s automation/tests -v

      - name: Render fixture bundle on pull requests
        if: github.event_name == 'pull_request'
        run: |
          python3 -m automation.draft_pipeline \
            --state automation/tests/fixtures/editorial-state.json \
            --fixture-article automation/tests/fixtures/article-draft.json \
            --output automation/out/fixture-draft

      - name: Upload fixture validation bundle
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: verified-publisher-fixture-${{ github.run_number }}
          path: automation/out/fixture-draft/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Enforce kill switch and publication timing before API use
        id: gate
        run: |
          mkdir -p automation/out
          python3 -m automation.publisher preflight \
            --repository-root . \
            --trigger-schedule "${{ github.event.schedule }}" \
            --github-output "$GITHUB_OUTPUT" | tee automation/out/publisher-preflight.log
          allowed=$(python3 -c 'import json; print(str(json.load(open("automation/out/publisher-preflight.log"))["allowed"]).lower())')
          reason=$(python3 -c 'import json; print(json.load(open("automation/out/publisher-preflight.log"))["reason"])')
          if [ "$allowed" != "true" ]; then
            echo "### Publisher paused" >> "$GITHUB_STEP_SUMMARY"
            echo "Reason: **$reason**" >> "$GITHUB_STEP_SUMMARY"
            echo "No OpenAI request was made." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Restore scanner and editorial state
        if: steps.gate.outputs.allowed == 'true'
        uses: actions/cache/restore@v4
        with:
          path: automation/runtime-state
          key: tweak-feed-state-v1-${{ github.run_id }}
          restore-keys: |
            tweak-feed-state-v1-

      - name: Prepare empty state when cache is unavailable
        if: steps.gate.outputs.allowed == 'true'
        run: |
          if [ ! -f automation/runtime-state/known-packages.json ]; then
            mkdir -p automation/runtime-state
            cp automation/state/known-packages.json automation/runtime-state/known-packages.json
          fi

      - name: Check encrypted OpenAI secret
        if: steps.gate.outputs.allowed == 'true'
        id: api
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "### Publisher paused" >> "$GITHUB_STEP_SUMMARY"
            echo "OPENAI_API_KEY is not configured as an encrypted repository secret." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Generate one independently verified article
        if: steps.gate.outputs.allowed == 'true' && steps.api.outputs.enabled == 'true'
        id: generate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
        shell: bash
        run: |
          mkdir -p automation/out
          set +e
          python3 -m automation.draft_pipeline \
            --state automation/runtime-state/known-packages.json \
            --write-state \
            --output automation/out/draft | tee automation/out/draft-run.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 3 ]; then
            echo "drafted=false" >> "$GITHUB_OUTPUT"
            echo "### Publisher" >> "$GITHUB_STEP_SUMMARY"
            echo "No undrafted eligible release or verified evergreen tweak is waiting." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          echo "drafted=true" >> "$GITHUB_OUTPUT"

      - name: Publish through deterministic guards
        if: steps.generate.outputs.drafted == 'true'
        id: publication
        run: |
          python3 -m automation.publisher publish \
            --repository-root . \
            --manifest automation/out/draft/manifest.json \
            --run-id "$GITHUB_RUN_ID" \
            --confirm-live \
            --github-output "$GITHUB_OUTPUT" | tee automation/out/publication.log

      - name: Commit the approved website update
        if: steps.publication.outputs.published == 'true'
        env:
          TARGET_PATH: ${{ steps.publication.outputs.target_path }}
          ARTICLE_TITLE: ${{ steps.publication.outputs.title }}
        run: |
          git config user.name "nextsolution-publisher[bot]"
          git config user.email "nextsolution-publisher[bot]@users.noreply.github.com"
          git add -- "$TARGET_PATH" index.html tutorials.html feed.xml sitemap.xml automation/published-articles.json
          git commit -m "Publish verified tweak article: $ARTICLE_TITLE"
          git push origin HEAD:main
          echo "### Article published" >> "$GITHUB_STEP_SUMMARY"
          echo "- Page: https://nextsolution.cc/$TARGET_PATH" >> "$GITHUB_STEP_SUMMARY"
          echo "- Publication count today: **${{ steps.publication.outputs.publication_number }} of ${{ steps.publication.outputs.max_today }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Independent verifier: **approved**" >> "$GITHUB_STEP_SUMMARY"
          echo "- ShrinkMe: **disabled**" >> "$GITHUB_STEP_SUMMARY"

      - name: Record duplicate recovery
        if: steps.publication.outputs.duplicate == 'true'
        run: |
          echo "### Editorial state recovered" >> "$GITHUB_STEP_SUMMARY"
          echo "The selected candidate was already published, so no website files changed." >> "$GITHUB_STEP_SUMMARY"

      - name: Save editorial state after publication
        if: steps.generate.outputs.drafted == 'true' && steps.publication.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: automation/runtime-state
          key: tweak-feed-state-v1-${{ github.run_id }}

      - name: Upload audit bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-publication-${{ github.run_number }}
          path: automation/out/
          if-no-files-found: ignore
          retention-days: 14
