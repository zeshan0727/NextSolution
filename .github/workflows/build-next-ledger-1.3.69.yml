name: Build Next Ledger 1.3.69 Liability Ledger Only
permissions:
  contents: write
concurrency:
  group: next-ledger-1-3-69-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-next-ledger-1.3.69.yml"
      - "scripts/apply_next_ledger_1_3_69.sh"
      - "scripts/fix_fixed_liability_ledger_only_1_3_69.py"
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply 1.3.69
        run: bash scripts/apply_next_ledger_1_3_69.sh
      - name: Validate ledger-only liabilities and drilldowns
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'MARKETING_VERSION: "1.3.69"' project.yml
          grep -Fq 'CURRENT_PROJECT_VERSION: "77"' project.yml
          grep -Fq 'For a linked liability the ledger is the only source of truth.' DailyLedger/Services/LedgerStore.swift
          grep -Fq 'abs(linkedAccount.openingBalance)' DailyLedger/Services/LedgerStore.swift
          grep -Fq 'let totalLoanRecorded = openingLiability + increases' DailyLedger/Services/LedgerStore.swift
          grep -Fq 'let outstanding = max(0, totalLoanRecorded - repayments)' DailyLedger/Services/LedgerStore.swift
          grep -Fq 'func fixedLiabilityAllTransactions' DailyLedger/Services/LedgerStore.swift
          grep -Fq 'FixedLiabilityTransactionDrilldownView' DailyLedger/Views/FixedAccountingRegistersView.swift
          grep -Fq '"Loan Recorded"' DailyLedger/Views/FixedAccountingRegistersView.swift
          grep -Fq '"Installments Paid"' DailyLedger/Views/FixedAccountingRegistersView.swift
          grep -Fq 'Tap any figure to open the real liability-account transactions behind it.' DailyLedger/Views/FixedAccountingRegistersView.swift
          grep -Fq 'Manual Original Principal is not added for linked liabilities' DailyLedger/Views/FixedAccountingRegistersView.swift
          grep -Fq 'LabeledContent("Version", value: "1.3.69")' DailyLedger/Views/SettingsView.swift
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build unsigned iPhone app
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project DailyLedger.xcodeproj -scheme DailyLedger -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build/xcodebuild.log
      - name: Package TIPA
        run: |
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          rm -rf Payload && mkdir Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload NextLedger-1.3.69-liability-ledger-drilldowns.tipa
          shasum -a 256 NextLedger-1.3.69-liability-ledger-drilldowns.tipa > NextLedger-1.3.69-liability-ledger-drilldowns.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: NextLedger-1.3.69-Liability-Ledger-Drilldowns
          path: |
            NextLedger-1.3.69-liability-ledger-drilldowns.tipa
            NextLedger-1.3.69-liability-ledger-drilldowns.sha256
          if-no-files-found: error
      - name: Capture diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p build
          { test -f build/xcodebuild.log && grep -E "error:|fatal error:|SwiftCompile|BUILD FAILED" build/xcodebuild.log || true; } > build/next-ledger-1.3.69-errors.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: NextLedger-1.3.69-Diagnostics
          path: build/next-ledger-1.3.69-errors.txt
          if-no-files-found: warn
      - name: Publish status
        if: always()
        shell: bash
        run: |
          STATUS="${{ job.status }}"
          git reset --hard HEAD
          git clean -fd
          git fetch origin "$GITHUB_REF_NAME"
          git checkout -B build-status "origin/$GITHUB_REF_NAME"
          mkdir -p .build-status
          cat > .build-status/next-ledger-1.3.69.json <<EOF
          {"status":"${STATUS}","run_id":"${GITHUB_RUN_ID}","source_sha":"${GITHUB_SHA}","app_version":"1.3.69","app_build":"77","daemon_version":"2.2.3","artifact_name":"NextLedger-1.3.69-Liability-Ledger-Drilldowns"}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .build-status/next-ledger-1.3.69.json
          git commit -m "Record Next Ledger 1.3.69 build status" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
