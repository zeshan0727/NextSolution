name: Module Glass 3649 Preview

on:
  push:
    paths:
      - '.github/workflows/module-glass-3649-preview.yml'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload exact IMG_3649 preview
        uses: actions/upload-artifact@v4
        with:
          name: IMG_3649_preview
          path: transfer/inspection/IMG_3649_preview.jpg
          if-no-files-found: error
          retention-days: 1
