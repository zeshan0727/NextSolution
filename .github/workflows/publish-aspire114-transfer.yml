name: Publish Aspire Maintenance 1.1.4 to NS Transfer

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-aspire114-transfer.yml"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download validated Aspire build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9842162582/zip > /tmp/aspire114.zip
          mkdir -p /tmp/aspire114
          unzip -q /tmp/aspire114.zip -d /tmp/aspire114
          test -f /tmp/aspire114/AspireMaintenance-1.1.4-unsigned.ipa
          test -f /tmp/aspire114/AspireMaintenance-1.1.4.tipa
      - name: Publish files and NS Transfer entry
        run: |
          set -e
          DEST="transfer/files/AspireMaintenance/1.1.4"
          mkdir -p "$DEST"
          cp /tmp/aspire114/AspireMaintenance-1.1.4-unsigned.ipa "$DEST/"
          cp /tmp/aspire114/AspireMaintenance-1.1.4.tipa "$DEST/"
          export SHA="$(sha256sum "$DEST/AspireMaintenance-1.1.4-unsigned.ipa" | awk '{print $1}')"
          export SIZE="$(stat -c%s "$DEST/AspireMaintenance-1.1.4-unsigned.ipa")"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone
          path = Path('transfer/index.json')
          data = json.loads(path.read_text())
          entry = {
            'id': 'aspire-maintenance-1.1.4-dashboard-test',
            'name': 'Aspire Maintenance 1.1.4 — Dashboard Test',
            'fileName': 'AspireMaintenance-1.1.4-unsigned.ipa',
            'type': 'ipa',
            'platform': 'iOS 16+ / Test',
            'version': '1.1.4 (7)',
            'url': 'https://nextjailbreak.com/transfer/files/AspireMaintenance/1.1.4/AspireMaintenance-1.1.4-unsigned.ipa',
            'tipaUrl': 'https://nextjailbreak.com/transfer/files/AspireMaintenance/1.1.4/AspireMaintenance-1.1.4.tipa',
            'sha256': os.environ['SHA'],
            'sizeBytes': int(os.environ['SIZE']),
            'notes': 'Test build for the Aspire Maintenance dashboard redesign with six selectable dashboard styles and Monthly Visits Progress.'
          }
          data['files'] = [x for x in data.get('files', []) if x.get('id') != entry['id']]
          data['files'].insert(0, entry)
          data['updatedAt'] = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add transfer/index.json "$DEST"
          git commit -m "Publish Aspire Maintenance 1.1.4 dashboard test to NS Transfer"
          git push origin main
