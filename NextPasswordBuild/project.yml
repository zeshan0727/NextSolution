name: NextPassword
options:
  bundleIdPrefix: app.nextsolution
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: 16.0
    SWIFT_VERSION: 5.0
targets:
  NextPassword:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: [NextPassword]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nextsolution.nextpassword
        PRODUCT_NAME: NextPassword
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Next Password
        INFOPLIST_KEY_NSFaceIDUsageDescription: Face ID protects your saved passwords.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        TARGETED_DEVICE_FAMILY: "1"
