name: NextSolutionLicenseAdmin
options:
  bundleIdPrefix: com.nextsolution
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.nextsolution.licenseadmin
    PRODUCT_NAME: NextSolutionLicenseAdmin
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "102"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    SUPPORTS_MACCATALYST: NO
    CODE_SIGNING_ALLOWED: NO
    ENABLE_BITCODE: NO
targets:
  NextSolutionLicenseAdmin:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: NextSolutionLicenseAdmin.entitlements
    scheme:
      testTargets: []
