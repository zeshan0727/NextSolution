name: NextSolutionLicenseAdmin
options:
  bundleIdPrefix: com.nextsolution
  deploymentTarget:
    iOS: "16.0"
targets:
  NextSolutionLicenseAdmin:
    type: application
    platform: iOS
    sources:
      - Sources
    resources:
      - Resources
    info:
      path: Info.plist
    entitlements:
      path: NextSolutionLicenseAdmin.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nextsolution.licenseadmin
        PRODUCT_NAME: NextSolutionLicenseAdmin
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "100"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
