name: Build Validate and Publish Charging Interrupted Haptic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-charging-interrupted-haptic.yml"

permissions:
  contents: write

concurrency:
  group: publish-charging-interrupted-haptic
  cancel-in-progress: false

jobs:
  build-validate-publish:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install packaging tools
        run: brew install dpkg ldid xz zstd

      - name: Validate source and deterministic runtime logic
        shell: bash
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/2026-08-06-ChargingInterruptedHaptic"
          python3 "$P/tests/test_runtime_logic.py"
          for f in Tweak.xm Makefile ChargingInterruptedHaptic.plist control README.md Preferences/Makefile Preferences/CIHRootListController.h Preferences/CIHRootListController.m Preferences/Resources/Root.plist Preferences/Resources/Info.plist layout/Library/PreferenceLoader/Preferences/ChargingInterruptedHaptic.plist; do test -f "$P/$f"; done
          grep -q '^Package: com.nextsolution.charginginterruptedhaptic$' "$P/control"
          grep -q '^Version: 1.0.0$' "$P/control"
          grep -q '^ARCHS = arm64 arm64e$' "$P/Makefile"
          grep -q 'segalign,4000' "$P/Makefile"
          grep -q 'com.apple.springboard' "$P/ChargingInterruptedHaptic.plist"
          grep -q 'UIDeviceBatteryStateDidChangeNotification' "$P/Tweak.xm"
          grep -q 'batteryMonitoringEnabled = YES' "$P/Tweak.xm"
          grep -q 'CIHStateObserver =' "$P/Tweak.xm"
          grep -q 'CIHPreviousState = currentState' "$P/Tweak.xm"
          grep -q 'CIHIsPoweredState(previousState)' "$P/Tweak.xm"
          grep -q 'currentState == UIDeviceBatteryStateUnplugged' "$P/Tweak.xm"
          grep -q 'Enable Charging Alert' "$P/Preferences/Resources/Root.plist"
          test "$(grep -c '<string>PSSwitchCell</string>' "$P/Preferences/Resources/Root.plist")" -eq 1
          ! grep -Eq 'Test|Diagnostic|PID|Hook|Runtime' "$P/Preferences/Resources/Root.plist"
          plutil -lint "$P/Preferences/Resources/Root.plist"
          plutil -lint "$P/Preferences/Resources/Info.plist"
          plutil -lint "$P/layout/Library/PreferenceLoader/Preferences/ChargingInterruptedHaptic.plist"

      - name: Build rootless
        shell: bash
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/2026-08-06-ChargingInterruptedHaptic"
          OUT="$RUNNER_TEMP/charging-interrupted-haptic"
          mkdir -p "$OUT"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos-rootless"
          export THEOS="$RUNNER_TEMP/theos-rootless"
          export THEOS_PACKAGE_SCHEME=rootless
          rm -rf "$P/packages"
          make -C "$P" clean package FINALPACKAGE=1
          DEB="$(find "$P/packages" -type f -name '*_iphoneos-arm64.deb' -print -quit)"
          test -n "$DEB"
          cp "$DEB" "$OUT/ChargingInterruptedHaptic_1.0.0_Rootless.deb"

      - name: Build RootHide
        shell: bash
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/2026-08-06-ChargingInterruptedHaptic"
          OUT="$RUNNER_TEMP/charging-interrupted-haptic"
          git init "$RUNNER_TEMP/theos-roothide"
          git -C "$RUNNER_TEMP/theos-roothide" remote add origin https://github.com/roothide/theos.git
          git -C "$RUNNER_TEMP/theos-roothide" fetch --depth 1 origin 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$RUNNER_TEMP/theos-roothide" checkout --detach 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$RUNNER_TEMP/theos-roothide" submodule update --init --recursive --depth 1
          sed -i '' 's/^Architecture: iphoneos-arm64$/Architecture: iphoneos-arm64e/' "$P/control"
          export THEOS="$RUNNER_TEMP/theos-roothide"
          export THEOS_PACKAGE_SCHEME=roothide
          rm -rf "$P/packages"
          make -C "$P" clean package FINALPACKAGE=1
          DEB="$(find "$P/packages" -type f -name '*_iphoneos-arm64e.deb' -print -quit)"
          test -n "$DEB"
          cp "$DEB" "$OUT/ChargingInterruptedHaptic_1.0.0_RootHide.deb"

      - name: Validate built packages
        shell: bash
        run: |
          set -euo pipefail
          validate() {
            deb="$1"; arch="$2"; x="$(mktemp -d)"
            test "$(dpkg-deb -f "$deb" Package)" = com.nextsolution.charginginterruptedhaptic
            test "$(dpkg-deb -f "$deb" Version)" = 1.0.0
            test "$(dpkg-deb -f "$deb" Architecture)" = "$arch"
            dpkg-deb -f "$deb" Depends | grep -q preferenceloader
            dpkg-deb -x "$deb" "$x"
            dylib="$(find "$x" -type f -name ChargingInterruptedHaptic.dylib -print -quit)"
            root="$(find "$x" -type f -path '*ChargingInterruptedHapticPreferences.bundle/Root.plist' -print -quit)"
            entry="$(find "$x" -type f -path '*PreferenceLoader/Preferences/ChargingInterruptedHaptic.plist' -print -quit)"
            filter="$(find "$x" -type f -path '*MobileSubstrate/DynamicLibraries/ChargingInterruptedHaptic.plist' -print -quit)"
            test -n "$dylib"; test -n "$root"; test -n "$entry"; test -n "$filter"
            grep -q 'com.apple.springboard' "$filter"
            grep -q 'Enable Charging Alert' "$root"
            strings -a "$dylib" | grep -q UIDeviceBatteryStateDidChangeNotification
            strings -a "$dylib" | grep -q UINotificationFeedbackTypeWarning
            rm -rf "$x"
          }
          OUT="$RUNNER_TEMP/charging-interrupted-haptic"
          validate "$OUT/ChargingInterruptedHaptic_1.0.0_Rootless.deb" iphoneos-arm64
          validate "$OUT/ChargingInterruptedHaptic_1.0.0_RootHide.deb" iphoneos-arm64e
          shasum -a 256 "$OUT"/*.deb | tee "$RUNNER_TEMP/charging-interrupted-haptic-build-report.txt"

      - name: Upload diagnostic build report
        uses: actions/upload-artifact@v4
        with:
          name: charging-interrupted-haptic-build-report
          path: ${{ runner.temp }}/charging-interrupted-haptic-build-report.txt

      - name: Publish packages and indexes
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/charging-interrupted-haptic"
          git config user.name "Next Jailbreak Build Bot"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf "$RUNNER_TEMP/cih-scan"; mkdir -p debfiles "$RUNNER_TEMP/cih-scan"
            cp "$OUT"/*.deb debfiles/
            cp "$OUT"/*.deb "$RUNNER_TEMP/cih-scan/"
            dpkg-scanpackages -m "$RUNNER_TEMP/cih-scan" /dev/null > "$RUNNER_TEMP/cih-stanzas"
            sed -i '' 's|^Filename: .*/cih-scan/|Filename: ./debfiles/|' "$RUNNER_TEMP/cih-stanzas"
            python3 - "$RUNNER_TEMP/cih-stanzas" <<'PY'
          from pathlib import Path
          import re, sys
          path = Path('Packages')
          old = path.read_text() if path.exists() else ''
          rows = [x.strip() for x in re.split(r'\n\s*\n', old) if x.strip()]
          rows = [x for x in rows if not re.search(r'^Package: com\.nextsolution\.charginginterruptedhaptic$', x, re.M)]
          new = [x.strip() for x in re.split(r'\n\s*\n', Path(sys.argv[1]).read_text()) if x.strip()]
          path.write_text('\n\n'.join(rows + new) + '\n')
          PY
            test "$(grep -c '^Package: com.nextsolution.charginginterruptedhaptic$' Packages)" -eq 2
            test "$(grep -c '^Filename: ./debfiles/ChargingInterruptedHaptic_1.0.0_' Packages)" -eq 2
            gzip -9 -c Packages > Packages.gz
            bzip2 -9 -c Packages > Packages.bz2
            xz -9e -c Packages > Packages.xz
            zstd -19 -q -c Packages > Packages.zst
            python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import re
          p = Path('Release'); t = p.read_text()
          m = re.search(r'^Version: (\d+)\.(\d+)\.(\d+)$', t, re.M)
          if m: t = re.sub(r'^Version: .*$', f'Version: {m.group(1)}.{m.group(2)}.{int(m.group(3))+1}', t, flags=re.M)
          t = re.sub(r'^Date: .*$', 'Date: ' + datetime.now(timezone.utc).strftime('%a, %d %b %Y %H:%M:%S UTC'), t, flags=re.M)
          t = re.sub(r'^Icon: .*$', 'Icon: https://nextjailbreak.com/CydiaIcon.png', t, flags=re.M)
          p.write_text(t)
          PY
            git add debfiles/ChargingInterruptedHaptic_1.0.0_Rootless.deb debfiles/ChargingInterruptedHaptic_1.0.0_RootHide.deb Packages Packages.gz Packages.bz2 Packages.xz Packages.zst Release
            git diff --cached --check
            git commit -m "Publish Charging Interrupted Haptic 1.0.0"
            git push origin HEAD:main && exit 0
            sleep $((attempt * 4))
          done
          exit 1
