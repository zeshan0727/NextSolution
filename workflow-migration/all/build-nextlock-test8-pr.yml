name: Build NextLock Test 8/9 PR

on:
  pull_request:
    branches: [main]
    paths:
      - 'transfer/build-triggers/nextlock-test8.txt'
      - 'transfer/build-triggers/nextlock-test9.txt'
      - '.github/workflows/build-nextlock-test8-pr.yml'
      - 'scripts/build_nextlock_test9_ci.sh'

permissions:
  contents: write

jobs:
  build-test9:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install tools
        run: brew install dpkg ldid
      - name: Build and validate Test 9
        shell: bash
        run: bash scripts/build_nextlock_test9_ci.sh
      - name: Publish validated Test 9 to NS Transfer
        if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ci/nextlock-test9-build'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B publish-nextlock-test9 origin/main
          DEST_DIR='transfer/files/NextLock/1.1.5-CPUFix-Test9-FreePosition'
          DEST="$DEST_DIR/NextLock_1.1.5_CPUFix_Test9_FreePosition_RootHide.deb"
          mkdir -p "$DEST_DIR"
          cp "$OUTDEB" "$DEST"
          test "$(shasum -a 256 "$DEST" | awk '{print $1}')" = "$OUT_SHA"
          export OUT_SHA
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          from datetime import datetime,timezone
          p=Path('transfer/index.json')
          data=json.loads(p.read_text())
          files=[x for x in data.get('files',[]) if not x.get('id','').startswith('nextlock-1.1.5-cpufix-test')]
          entry={
            'id':'nextlock-1.1.5-cpufix-test9-freeposition-roothide',
            'name':'NextLock 1.1.5 CPU Fix Test 9 Free Position RootHide',
            'fileName':'NextLock_1.1.5_CPUFix_Test9_FreePosition_RootHide.deb',
            'type':'deb','platform':'RootHide','version':'1.1.5-test9',
            'url':'https://nextjailbreak.com/transfer/files/NextLock/1.1.5-CPUFix-Test9-FreePosition/NextLock_1.1.5_CPUFix_Test9_FreePosition_RootHide.deb',
            'sha256':os.environ['OUT_SHA'],
            'notes':'Test 9 keeps Test 8 full time/date styling, targeted low-CPU callback-photo suppression and uncropped full-photo picker. Photo Frames 1-4 are no longer anchored to Time or Date: Anchor To and Placement are removed and replaced with independent whole-screen Horizontal/Vertical Position sliders (0-100%).'
          }
          data['files']=[entry]+files
          data['updatedAt']=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
          git config user.name 'Next Jailbreak Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add "$DEST" transfer/index.json
          git diff --cached --check
          git commit -m 'Publish NextLock 1.1.5 CPU Fix Test 9 free position'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
      - name: Upload Test 9
        uses: actions/upload-artifact@v4
        with:
          name: NextLock-Test9-FreePosition-RootHide
          path: |
            ${{ env.OUTDEB }}
            ${{ env.SHA_FILE }}
          if-no-files-found: error
          retention-days: 14
