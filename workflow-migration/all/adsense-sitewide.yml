name: Ensure Adsterra sitewide

on:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "assets/adsterra.js"
      - ".github/workflows/adsense-sitewide.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adsterra-sitewide-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ensure-adsterra:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add Adsterra loader and remove inactive AdSense loader
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          loader = '  <script defer src="/assets/adsterra.js" data-nextsolution-ads="adsterra"></script>'
          adsense_re = re.compile(
              r'\s*<script\s+async\s+src="https://pagead2\.googlesyndication\.com/pagead/js/adsbygoogle\.js\?client=ca-pub-4770123899731214"\s+crossorigin="anonymous"></script>\s*',
              re.I,
          )

          blocked_prefixes = (
              'depictions/', 'applications/', 'DailyLedger/', 'DailyTweaks/',
              'Diagnostics/', 'ModuleGlassPreview/', 'NextPDF/', 'NextPost/'
          )
          blocked_files = {
              'privacy.html', 'terms.html', 'next-ledger-support.html',
              'privacy/index.html', 'terms/index.html'
          }

          changed = []
          for path in sorted(Path('.').rglob('*.html')):
              rel = path.as_posix().lstrip('./')
              if any(part in {'.git', 'node_modules'} for part in path.parts):
                  continue

              text = path.read_text(encoding='utf-8')
              updated = adsense_re.sub('\n', text)

              blocked = rel in blocked_files or rel.startswith(blocked_prefixes)
              if not blocked and 'data-nextsolution-ads="adsterra"' not in updated:
                  updated, count = re.subn(
                      r'(?i)</body\s*>',
                      loader + '\n</body>',
                      updated,
                      count=1,
                  )
                  if not count:
                      updated, count = re.subn(
                          r'(?i)</head\s*>',
                          loader + '\n</head>',
                          updated,
                          count=1,
                      )

              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(rel)

          # Keep legal disclosure accurate. The ad manager itself is disabled on privacy/terms pages.
          for privacy_path in (Path('privacy.html'), Path('privacy/index.html')):
              if not privacy_path.exists():
                  continue
              text = privacy_path.read_text(encoding='utf-8')
              updated = text
              updated = updated.replace('Third-party services such as Google AdSense and YouTube may process information according to their own privacy policies.',
                                        'Third-party services such as Adsterra and YouTube may process information according to their own privacy policies.')
              updated = updated.replace('Google AdSense may use cookies or similar technologies to show, measure, and personalize advertisements. Depending on your location and choices, ads may be personalized or non-personalized. Google and its advertising partners may process information such as your device, browser, approximate location, and interactions with ads according to their own policies.',
                                        'Adsterra and its advertising partners may use cookies, device identifiers, or similar technologies to deliver, measure, and protect advertisements. They may process information such as device and browser details, approximate location, and interactions with ads according to their own policies.')
              updated = re.sub(r'\s*<p>You can learn how Google uses advertising data.*?</p>', '', updated, flags=re.I|re.S)
              if updated != text:
                  privacy_path.write_text(updated, encoding='utf-8')
                  changed.append(privacy_path.as_posix())

          print('Updated files:', ', '.join(changed) if changed else 'none')
          PY

      - name: Commit updates
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Adsterra is already configured on eligible website pages."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Apply Adsterra monetization across website pages"
          git push
