name: Fix site categories once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-site-categories-once.yml'
      - 'automation/apply_site_category_fix.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply category and homepage fixes
        run: |
          python3 automation/apply_site_category_fix.py
          python3 -m py_compile automation/publisher.py automation/apply_site_category_fix.py

      - name: Verify changed files
        run: |
          git diff --check
          git status --short

      - name: Commit repaired site
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tutorials.html tutorials/index.html automation/publisher.py
          git commit -m "Fix site categories and latest article feed"
          git push origin HEAD:main
