# Publishes checksum-verified Sileo and TrollStore application files.
name: Publish Next Ledger Application

on:
  push:
    branches: [main]
    paths:
      - "build-input/nextledger-1.3.42/**"
      - ".github/workflows/publish-nextledger-application.yml"

permissions:
  contents: write

concurrency:
  group: publish-nextledger-application
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reconstruct and verify packages
        run: |
          mkdir -p applications debfiles
          cat build-input/nextledger-1.3.42/tipa.b64.part* | base64 --decode > applications/NextLedger-1.3.42.tipa
          cat build-input/nextledger-1.3.42/deb.b64.part* | base64 --decode > debfiles/NextLedger_1.3.42_iphoneos-arm64e.deb
          echo "01fab4f09bd5f745e480a125b65dbbb0ca9fddf55dbfb6086ad59781880da468  applications/NextLedger-1.3.42.tipa" | sha256sum --check
          echo "da1696de09ab7e50de92f1d3795c1b431dbaeabf44e201c924a7ed2018bf4b8d  debfiles/NextLedger_1.3.42_iphoneos-arm64e.deb" | sha256sum --check
          dpkg-deb --info debfiles/NextLedger_1.3.42_iphoneos-arm64e.deb

      - name: Publish verified binaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add applications/NextLedger-1.3.42.tipa debfiles/NextLedger_1.3.42_iphoneos-arm64e.deb
          if git diff --cached --quiet; then
            echo "Verified binaries are already published."
            exit 0
          fi
          git commit -m "Publish verified Next Ledger 1.3.42 binaries"
          git pull --rebase origin main
          git push origin HEAD:main
