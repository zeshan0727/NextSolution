name: Migrate Private Apps to Cloudflare R2

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type MIGRATE to copy existing GitHub-hosted app binaries to R2
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: nextsigner-r2-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      R2_BUCKET: next-signer-apps
      R2_PUBLIC_BASE: https://files.nextjailbreak.com
      R2_ACCOUNT_ID: 4fe920e259870b0366118a17cc5727e5
      AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - name: Require explicit confirmation
        shell: bash
        run: |
          set -euo pipefail
          [ "${{ inputs.confirm }}" = "MIGRATE" ] || { echo "Confirmation must be MIGRATE"; exit 1; }

      - name: Check out website
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate R2 credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AWS_ACCESS_KEY_ID:-}" || { echo "CLOUDFLARE_R2_ACCESS_KEY_ID is missing"; exit 1; }
          test -n "${AWS_SECRET_ACCESS_KEY:-}" || { echo "CLOUDFLARE_R2_SECRET_ACCESS_KEY is missing"; exit 1; }

      - name: Install AWS CLI
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user --quiet awscli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Copy GitHub binaries to R2 and rewrite manifests
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import plistlib
          import re
          import subprocess
          import urllib.parse

          root = pathlib.Path('.')
          catalog_path = root / 'install' / 'apps.json'
          catalog = json.loads(catalog_path.read_text())
          changed = 0

          def safe(value, fallback):
              value = re.sub(r'[^A-Za-z0-9._-]+', '-', str(value)).strip('-')
              return value or fallback

          for app in catalog.get('apps', []):
              manifest_value = app.get('manifest')
              if not manifest_value:
                  continue
              manifest_path = root / manifest_value.lstrip('/')
              if not manifest_path.exists():
                  print(f"Skip {app.get('name')}: manifest not found at {manifest_path}")
                  continue

              with manifest_path.open('rb') as f:
                  manifest = plistlib.load(f)

              package_asset = None
              for item in manifest.get('items', []):
                  for asset in item.get('assets', []):
                      if asset.get('kind') == 'software-package':
                          package_asset = asset
                          break
                  if package_asset:
                      break

              if not package_asset:
                  print(f"Skip {app.get('name')}: no software-package asset")
                  continue

              old_url = package_asset.get('url', '')
              if old_url.startswith(os.environ['R2_PUBLIC_BASE'] + '/'):
                  print(f"Already on R2: {app.get('name')}")
                  app['downloadURL'] = old_url
                  app['storage'] = 'Cloudflare R2'
                  continue

              parsed = urllib.parse.urlparse(old_url)
              if parsed.hostname not in {'github.com', 'objects.githubusercontent.com'}:
                  print(f"Skip {app.get('name')}: non-GitHub package URL {old_url}")
                  continue

              filename = pathlib.PurePosixPath(parsed.path).name or f"{safe(app.get('id'), 'app')}.ipa"
              if not filename.lower().endswith('.ipa'):
                  print(f"Skip {app.get('name')}: package is not an IPA ({filename})")
                  continue

              app_id = safe(app.get('id'), 'app')
              version = safe(app.get('version'), '1.0')
              object_key = f"apps/ipa/{app_id}/{version}/{filename}"
              temp_path = pathlib.Path(os.environ['RUNNER_TEMP']) / filename

              print(f"Downloading {app.get('name')} from GitHub")
              subprocess.run(['curl', '--fail', '--location', '--retry', '5', '--retry-delay', '2', '--output', str(temp_path), old_url], check=True)
              if temp_path.stat().st_size == 0:
                  raise SystemExit(f"Downloaded empty file for {app.get('name')}")

              endpoint = f"https://{os.environ['R2_ACCOUNT_ID']}.r2.cloudflarestorage.com"
              print(f"Uploading {object_key}")
              subprocess.run([
                  'aws', 's3', 'cp', str(temp_path), f"s3://{os.environ['R2_BUCKET']}/{object_key}",
                  '--endpoint-url', endpoint,
                  '--content-type', 'application/octet-stream',
                  '--cache-control', 'public, max-age=31536000, immutable',
                  '--only-show-errors'
              ], check=True)

              public_url = os.environ['R2_PUBLIC_BASE'].rstrip('/') + '/' + object_key
              subprocess.run(['curl', '--fail', '--silent', '--show-error', '--location', '--head', '--retry', '8', '--retry-delay', '3', '--retry-all-errors', public_url], check=True, stdout=subprocess.DEVNULL)

              sha256 = hashlib.sha256(temp_path.read_bytes()).hexdigest()
              size = temp_path.stat().st_size
              package_asset['url'] = public_url
              app['downloadURL'] = public_url
              app['sha256'] = sha256
              app['sizeBytes'] = size
              app['storage'] = 'Cloudflare R2'

              with manifest_path.open('wb') as f:
                  plistlib.dump(manifest, f, fmt=plistlib.FMT_XML, sort_keys=False)

              temp_path.unlink(missing_ok=True)
              changed += 1
              print(f"Migrated {app.get('name')} -> {public_url}")

          if changed:
              from datetime import date
              catalog['updated'] = date.today().isoformat()
              catalog_path.write_text(json.dumps(catalog, indent=2) + '\n')

          with open(os.environ['GITHUB_ENV'], 'a') as f:
              print(f'MIGRATED_COUNT={changed}', file=f)
          PY

      - name: Commit migrated manifests
        if: env.MIGRATED_COUNT != '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add install/apps.json install/*.plist install/manifests/*.plist 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No catalog changes to commit"
          else
            git commit -m "Migrate private app downloads to Cloudflare R2"
            git push origin main
          fi

      - name: Migration summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Cloudflare R2 migration"
            echo
            echo "Migrated apps: ${MIGRATED_COUNT:-0}"
            echo "Bucket: $R2_BUCKET"
            echo "Public base: $R2_PUBLIC_BASE"
            echo
            echo "Existing GitHub Release assets are intentionally retained as rollback copies."
          } >> "$GITHUB_STEP_SUMMARY"
