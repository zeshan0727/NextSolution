name: Inspect NextLock 1.1.4 Preferences Resources

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-nextlock-preferences.yml'

permissions:
  contents: write

concurrency:
  group: inspect-nextlock-preferences
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: brew install dpkg llvm

      - name: Extract package resources and inspect picker binary
        shell: bash
        run: |
          set -euo pipefail
          BASE='transfer/files/NextLock/1.1.4/NextLock_1.1.4_RootHide.deb'
          STAGE="$RUNNER_TEMP/nextlock"
          OUT='analysis/nextlock-1.1.4/package-inspection'
          rm -rf "$STAGE" "$OUT"
          mkdir -p "$STAGE" "$OUT"
          dpkg-deb -R "$BASE" "$STAGE"
          find "$STAGE" -type f | sed "s#^$STAGE/##" | sort > "$OUT/file-list.txt"

          # Copy only human-readable preference/config resources; never copy binaries.
          while IFS= read -r f; do
            case "$f" in
              *.plist|*.strings|*.json|*.xml)
                rel="${f#$STAGE/}"
                mkdir -p "$OUT/$(dirname "$rel")"
                if plutil -convert xml1 -o "$OUT/$rel" "$f" >/dev/null 2>&1; then :; else cp "$f" "$OUT/$rel"; fi
                ;;
            esac
          done < <(find "$STAGE" -type f)

          grep -Ei 'pref|preference|specifier|bundle|plist|lock|glyph|next' "$OUT/file-list.txt" > "$OUT/preference-candidates.txt" || true

          PREFBIN="$STAGE/Library/PreferenceBundles/LockGlyphTimePrefs.bundle/LockGlyphTimePrefs"
          BINOUT="$OUT/prefs-binary"
          mkdir -p "$BINOUT"
          test -f "$PREFBIN"

          file "$PREFBIN" > "$BINOUT/file.txt"
          lipo -info "$PREFBIN" > "$BINOUT/lipo.txt" 2>&1 || true
          dwarfdump --uuid "$PREFBIN" > "$BINOUT/uuids.txt" 2>&1 || true
          strings -a -n 4 "$PREFBIN" > "$BINOUT/strings.txt"
          strings -a -n 4 "$PREFBIN" | grep -Ein 'crop|photo|picker|image|frame|aspect|zoom|scroll|use photo|edit photo|customPhoto|openCustom' > "$BINOUT/photo-picker-strings.txt" || true
          nm -nm "$PREFBIN" > "$BINOUT/nm.txt" 2>&1 || true
          otool -ov "$PREFBIN" > "$BINOUT/objc.txt" 2>&1 || true
          /opt/homebrew/opt/llvm/bin/llvm-objdump --macho --objc-meta-data "$PREFBIN" > "$BINOUT/objc-llvm.txt" 2>&1 || true
          /opt/homebrew/opt/llvm/bin/llvm-objdump --macho --disassemble "$PREFBIN" > "$BINOUT/disassembly.txt" 2>&1 || true

          # Focused neighborhoods around picker/crop-related selectors and classes.
          python3 - "$BINOUT/strings.txt" "$BINOUT/photo-picker-context.txt" <<'PY'
          import sys,re
          src=open(sys.argv[1],errors='replace').read().splitlines()
          pats=re.compile(r'crop|photo|picker|image|zoom|scroll|customPhoto|openCustom|Use Photo',re.I)
          hits=[i for i,s in enumerate(src) if pats.search(s)]
          out=[]
          seen=set()
          for i in hits:
              a=max(0,i-8); b=min(len(src),i+9)
              key=(a,b)
              if key in seen: continue
              seen.add(key)
              out.append(f'--- strings {a+1}-{b} ---')
              out.extend(f'{j+1}: {src[j]}' for j in range(a,b))
          open(sys.argv[2],'w').write('\n'.join(out)+'\n')
          PY

      - name: Commit inspection text
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Next Jailbreak Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add analysis/nextlock-1.1.4/package-inspection
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Inspect NextLock 1.1.4 preference picker binary'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
