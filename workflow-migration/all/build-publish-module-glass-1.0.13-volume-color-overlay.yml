name: Build and Publish Module Glass 1.0.13 Volume Icon Overlay

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-publish-module-glass-1.0.13-volume-color-overlay.yml'

permissions:
  contents: write

concurrency:
  group: nextsolution-module-glass-volume-color-overlay
  cancel-in-progress: false

jobs:
  build-validate-publish:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install packaging tools
        run: brew install dpkg ldid xz zstd

      - name: Install pinned RootHide Theos
        shell: bash
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/theos-roothide"
          git init "$T"
          git -C "$T" remote add origin https://github.com/roothide/theos.git
          git -C "$T" fetch --depth 1 origin 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$T" checkout --detach 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$T" submodule update --init --recursive --depth 1

      - name: Replace in-place Volume tint with persistent overlay
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('source/ModuleGlass/Tweak.m')
          t=p.read_text()

          if 'MGVolumeIconOverlayTag' in t:
              raise SystemExit('overlay patch already present')

          t=t.replace(
              'static NSInteger const MGImageTag = 0x4D470106;\n',
              'static NSInteger const MGImageTag = 0x4D470106;\nstatic NSInteger const MGVolumeIconOverlayTag = 0x4D475649;\n',
              1)
          t=t.replace(
              'static char MGVolumeOriginalIconImageKey;\nstatic char MGVolumeOriginalIconTintKey;\n',
              'static char MGVolumeOriginalIconAlphaKey;\nstatic char MGVolumeIconOverlayKey;\n',
              1)

          pattern=r'''static void MGRestoreVolumeIconTint\(UIView \*root\) \{.*?\n\}\n\nstatic void MGRemoveTaggedImages'''
          replacement=r'''static void MGRestoreVolumeIconPresentation(UIView *root) {
              if (!root) return;
              for (UIView *child in [root.subviews copy]) {
                  if (child.tag == MGVolumeIconOverlayTag) {
                      [child removeFromSuperview];
                      continue;
                  }
                  MGRestoreVolumeIconPresentation(child);
              }
              if ([root isKindOfClass:UIImageView.class]) {
                  NSNumber *savedAlpha = objc_getAssociatedObject(root, &MGVolumeOriginalIconAlphaKey);
                  if (savedAlpha) {
                      root.alpha = savedAlpha.doubleValue;
                      objc_setAssociatedObject(root, &MGVolumeOriginalIconAlphaKey, nil, OBJC_ASSOCIATION_RETAIN_NONATOMIC);
                      objc_setAssociatedObject(root, &MGVolumeIconOverlayKey, nil, OBJC_ASSOCIATION_RETAIN_NONATOMIC);
                  }
              }
          }

          static NSInteger MGVolumeIconScore(UIImageView *imageView, UIView *slider) {
              if (!imageView || !slider || imageView.tag == MGImageTag || imageView.tag == MGVolumeIconOverlayTag || !imageView.image || imageView.hidden) return -1;
              CGRect rect = [imageView convertRect:imageView.bounds toView:slider];
              CGFloat w = CGRectGetWidth(rect), h = CGRectGetHeight(rect);
              if (w < 8.0 || h < 8.0 || w > 64.0 || h > 64.0) return -1;
              CGFloat area = w * h;
              NSInteger score = 1200 - (NSInteger)fabs(area - 576.0);
              CGFloat cy = CGRectGetMidY(rect);
              if (cy > CGRectGetHeight(slider.bounds) * 0.55) score += 1800;
              if (fabs(CGRectGetMidX(rect) - CGRectGetMidX(slider.bounds)) < CGRectGetWidth(slider.bounds) * 0.35) score += 900;
              NSString *names = @"";
              UIView *cursor = imageView;
              for (NSInteger i = 0; i < 5 && cursor; i++, cursor = cursor.superview) {
                  names = [names stringByAppendingFormat:@" %@", NSStringFromClass(cursor.class).lowercaseString ?: @""];
              }
              for (NSString *needle in @[@"glyph", @"speaker", @"volume", @"audio", @"icon"]) {
                  if ([names containsString:needle]) score += 3500;
              }
              return score;
          }

          static void MGCollectVolumeIconCandidates(UIView *root, UIView *slider, NSMutableArray<UIImageView *> *out) {
              if (!root) return;
              if ([root isKindOfClass:UIImageView.class] && root.tag != MGImageTag && root.tag != MGVolumeIconOverlayTag) {
                  UIImageView *iv=(UIImageView *)root;
                  if (MGVolumeIconScore(iv, slider) >= 0) [out addObject:iv];
              }
              for (UIView *child in root.subviews) MGCollectVolumeIconCandidates(child, slider, out);
          }

          static UIImageView *MGFindVolumeIcon(UIView *slider) {
              if (!slider) return nil;
              NSMutableArray<UIImageView *> *candidates=[NSMutableArray array];
              MGCollectVolumeIconCandidates(slider, slider, candidates);
              UIImageView *best=nil;
              NSInteger bestScore=-1;
              for (UIImageView *candidate in candidates) {
                  NSInteger score=MGVolumeIconScore(candidate, slider);
                  if (score > bestScore) { best=candidate; bestScore=score; }
              }
              return best;
          }

          static BOOL MGApplyVolumeIconTint(UIView *slider, UIColor *color, NSString **outClass, CGRect *outFrame) {
              if (!slider || !color) return NO;
              UIImageView *icon=MGFindVolumeIcon(slider);
              if (!icon || !icon.image || !icon.superview) return NO;

              NSNumber *storedAlpha=objc_getAssociatedObject(icon, &MGVolumeOriginalIconAlphaKey);
              CGFloat sourceAlpha=storedAlpha ? storedAlpha.doubleValue : icon.alpha;
              if (!storedAlpha) {
                  objc_setAssociatedObject(icon, &MGVolumeOriginalIconAlphaKey, @(icon.alpha), OBJC_ASSOCIATION_RETAIN_NONATOMIC);
              }

              UIImageView *overlay=[[UIImageView alloc] initWithFrame:CGRectZero];
              overlay.tag=MGVolumeIconOverlayTag;
              overlay.userInteractionEnabled=NO;
              overlay.backgroundColor=UIColor.clearColor;
              overlay.image=[icon.image imageWithRenderingMode:UIImageRenderingModeAlwaysTemplate];
              overlay.tintColor=color;
              overlay.contentMode=icon.contentMode;
              overlay.clipsToBounds=icon.clipsToBounds;
              overlay.bounds=icon.bounds;
              overlay.center=icon.center;
              overlay.transform=icon.transform;
              overlay.alpha=sourceAlpha;
              overlay.hidden=icon.hidden;
              overlay.layer.cornerRadius=icon.layer.cornerRadius;
              overlay.layer.masksToBounds=icon.layer.masksToBounds;
              [icon.superview insertSubview:overlay aboveSubview:icon];
              objc_setAssociatedObject(icon, &MGVolumeIconOverlayKey, overlay, OBJC_ASSOCIATION_RETAIN_NONATOMIC);

              // Keep Apple's image/state alive but make only the native pixels transparent.
              icon.alpha=0.0;

              if (outClass) *outClass=[NSString stringWithFormat:@"%@+overlay", NSStringFromClass(icon.class) ?: @"UIImageView"];
              if (outFrame) *outFrame=[overlay convertRect:overlay.bounds toView:slider];
              return YES;
          }

          static void MGRemoveTaggedImages'''
          t2,n=re.subn(pattern,replacement,t,flags=re.S)
          if n != 1:
              raise SystemExit(f'expected one tint helper block, found {n}')
          t=t2

          t=t.replace('MGRestoreVolumeIconTint(root);','MGRestoreVolumeIconPresentation(root);')
          t=t.replace('ModuleGlassRuntime 1.0.8 Volume Color loaded','ModuleGlassRuntime 1.0.9 Volume Color Overlay loaded')
          t=t.replace('Volume-isolated image-first runtime with native icon color','Volume-isolated image-first runtime with persistent icon color overlay')
          p.write_text(t)

          c=Path('source/ModuleGlass/control')
          ct=c.read_text()
          ct=re.sub(r'^Version: .*$', 'Version: 1.0.9', ct, flags=re.M)
          ct=re.sub(r'^Description: .*$', 'Description: Working isolated Module Glass Volume runtime with persistent speaker icon color overlay and unchanged image-first background behavior.', ct, flags=re.M)
          c.write_text(ct)
          PY

          grep -q '^Version: 1.0.9$' source/ModuleGlass/control
          grep -q 'volume-image-first-test' source/ModuleGlass/Tweak.m
          grep -q 'MGVolumeIconOverlayTag' source/ModuleGlass/Tweak.m
          grep -q 'MGRestoreVolumeIconPresentation(root)' source/ModuleGlass/Tweak.m
          grep -q 'insertSubview:overlay aboveSubview:icon' source/ModuleGlass/Tweak.m
          grep -q 'icon.alpha=0.0' source/ModuleGlass/Tweak.m
          ! grep -q 'MGVolumeOriginalIconImageKey' source/ModuleGlass/Tweak.m

      - name: Build Module Glass Runtime 1.0.9
        shell: bash
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/source/ModuleGlass"
          OUT="$RUNNER_TEMP/release"
          STAGE="$RUNNER_TEMP/runtime-stage"
          export THEOS="$RUNNER_TEMP/theos-roothide"
          export THEOS_PACKAGE_SCHEME=roothide
          mkdir -p "$OUT"
          rm -rf "$P/.theos" "$P/packages" "$STAGE"
          make -C "$P" clean package FINALPACKAGE=1
          DEB=$(find "$P/packages" -type f -name '*.deb' -print -quit)
          test -n "$DEB"
          dpkg-deb -R "$DEB" "$STAGE"
          cat > "$STAGE/DEBIAN/postinst" <<'SH'
          #!/bin/sh
          killall -9 SpringBoard 2>/dev/null || true
          exit 0
          SH
          chmod 0755 "$STAGE/DEBIAN/postinst"
          dpkg-deb -b "$STAGE" "$OUT/NextAura_Runtime_ccbackgrounds_1.0.9_RootHide.deb"

      - name: Build Module Glass 1.0.13 wrapper
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/release"
          STAGE="$RUNNER_TEMP/wrapper-stage"
          rm -rf "$STAGE"
          dpkg-deb -R debfiles/NextAura_cc_module_backgrounds_1.0.12_RootHide.deb "$STAGE"
          python3 - "$STAGE/DEBIAN/control" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); t=p.read_text()
          t=re.sub(r'^Version: .*$', 'Version: 1.0.13', t, flags=re.M)
          t=re.sub(r'com\.nextsolution\.nextaura\.runtime\.ccbackgrounds \(>= [^)]+\)', 'com.nextsolution.nextaura.runtime.ccbackgrounds (>= 1.0.9)', t)
          t=re.sub(r'^Description: .*$', 'Description: Working Volume image-first build with persistent speaker icon color overlay; all non-Volume rendering remains unchanged.', t, flags=re.M)
          p.write_text(t)
          PY
          grep -q '^Version: 1.0.13$' "$STAGE/DEBIAN/control"
          grep -q 'runtime.preferences (>= 1.0.5)' "$STAGE/DEBIAN/control"
          grep -q 'runtime.ccbackgrounds (>= 1.0.9)' "$STAGE/DEBIAN/control"
          dpkg-deb -b "$STAGE" "$OUT/NextAura_cc_module_backgrounds_1.0.13_RootHide.deb"

      - name: Validate packages
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/release"
          R="$OUT/NextAura_Runtime_ccbackgrounds_1.0.9_RootHide.deb"
          M="$OUT/NextAura_cc_module_backgrounds_1.0.13_RootHide.deb"
          test "$(dpkg-deb -f "$R" Version)" = 1.0.9
          test "$(dpkg-deb -f "$M" Version)" = 1.0.13
          dpkg-deb -f "$M" Depends | grep -q 'runtime.preferences (>= 1.0.5)'
          dpkg-deb -f "$M" Depends | grep -q 'runtime.ccbackgrounds (>= 1.0.9)'
          X=$(mktemp -d)
          dpkg-deb -x "$R" "$X/r"
          D="$X/r/Library/MobileSubstrate/DynamicLibraries/CCModuleBackgrounds.dylib"
          lipo -info "$D" | grep -q arm64
          lipo -info "$D" | grep -q arm64e
          strings -a "$D" | grep -q 'ModuleGlassRuntime 1.0.9 Volume Color Overlay loaded'
          strings -a "$D" | grep -q 'volume-image-first-test'
          strings -a "$D" | grep -q 'CCModuleVolumeIconColorEnabled'
          strings -a "$D" | grep -q 'overlay'
          rm -rf "$X"
          shasum -a 256 "$R" "$M"

      - name: Sync latest main preserving tested source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Next Jailbreak Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase --autostash origin main
          grep -q '^Version: 1.0.9$' source/ModuleGlass/control
          grep -q 'MGVolumeIconOverlayTag' source/ModuleGlass/Tweak.m

      - name: Publish packages and refresh repo indexes
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/release"
          SCAN="$RUNNER_TEMP/scan"
          mkdir -p debfiles "$SCAN"
          cp "$OUT/NextAura_Runtime_ccbackgrounds_1.0.9_RootHide.deb" debfiles/
          cp "$OUT/NextAura_cc_module_backgrounds_1.0.13_RootHide.deb" debfiles/
          cp "$OUT"/*.deb "$SCAN/"
          dpkg-scanpackages -m "$SCAN" /dev/null > "$RUNNER_TEMP/stanzas"
          python3 - "$RUNNER_TEMP/stanzas" <<'PY'
          from pathlib import Path
          import os,re,sys
          s=Path(sys.argv[1]); lines=[]
          for line in s.read_text().splitlines():
              if line.startswith('Filename: '): line='Filename: ./debfiles/'+os.path.basename(line.split(': ',1)[1])
              lines.append(line)
          s.write_text('\n'.join(lines)+'\n')
          ids={'com.nextsolution.nextaura.runtime.ccbackgrounds','com.nextsolution.nextaura.cc-module-backgrounds'}
          pkg=Path('Packages')
          rows=[x.strip() for x in re.split(r'\n\s*\n',pkg.read_text()) if x.strip()]
          def pid(row):
              m=re.search(r'^Package: (.+)$',row,re.M); return m.group(1).strip() if m else ''
          rows=[r for r in rows if pid(r) not in ids]
          new=[x.strip() for x in re.split(r'\n\s*\n',s.read_text()) if x.strip()]
          pkg.write_text('\n\n'.join(rows+new)+'\n')
          PY
          test "$(grep -c '^Package: com.nextsolution.nextaura.cc-module-backgrounds$' Packages)" -eq 1
          test "$(grep -c '^Package: com.nextsolution.nextaura.runtime.ccbackgrounds$' Packages)" -eq 1
          grep -A18 '^Package: com.nextsolution.nextaura.cc-module-backgrounds$' Packages | grep -q '^Version: 1.0.13$'
          grep -A18 '^Package: com.nextsolution.nextaura.runtime.ccbackgrounds$' Packages | grep -q '^Version: 1.0.9$'
          grep -A18 '^Package: com.nextsolution.nextaura.runtime.preferences$' Packages | grep -q '^Version: 1.0.5$'
          gzip -9 -c Packages > Packages.gz
          bzip2 -9 -c Packages > Packages.bz2
          xz -9e -c Packages > Packages.xz
          zstd -19 -q -c Packages > Packages.zst
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import re
          p=Path('Release'); t=p.read_text(); m=re.search(r'^Version:\s*(\d+)\.(\d+)\.(\d+)\s*$',t,re.M)
          if m:
              a,b,c=map(int,m.groups()); t=re.sub(r'^Version: .*$',f'Version: {a}.{b}.{c+1}',t,flags=re.M)
          t=re.sub(r'^Date: .*$', 'Date: '+datetime.now(timezone.utc).strftime('%a, %d %b %Y %H:%M:%S UTC'), t, flags=re.M)
          p.write_text(t)
          PY
          git add source/ModuleGlass/Tweak.m source/ModuleGlass/control \
            debfiles/NextAura_Runtime_ccbackgrounds_1.0.9_RootHide.deb \
            debfiles/NextAura_cc_module_backgrounds_1.0.13_RootHide.deb \
            Packages Packages.gz Packages.bz2 Packages.xz Packages.zst Release
          git diff --cached --check
          git commit -m 'Publish Module Glass 1.0.13 persistent Volume icon color overlay'
          git push origin HEAD:main
