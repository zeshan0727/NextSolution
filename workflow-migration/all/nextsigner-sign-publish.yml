name: Next Signer - Sign and Publish

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Optional Next Signer request ID used for live status reporting
        required: false
        default: ''
        type: string
      staging_asset:
        description: IPA/TIPA asset in the Next Signer inbox release
        required: true
        type: string
      requested_name:
        description: Display name to use for the signed app
        required: true
        type: string
      requested_bundle_id:
        description: Bundle identifier to use for the signed app
        required: true
        type: string
      custom_icon_asset:
        description: Optional custom icon asset in the signing inbox
        required: false
        default: ''
        type: string
      tweak_assets_json:
        description: JSON array of optional dylib/deb assets in the signing inbox
        required: false
        default: '[]'
        type: string
      duplicate_signing:
        description: Whether this request is intended as a duplicate install
        required: false
        default: 'false'
        type: string
      inject_extensions:
        description: Inject attached dylibs into app extensions too
        required: false
        default: 'false'
        type: string
      weak_injection:
        description: Inject attached dylibs as weak load commands
        required: false
        default: 'false'
        type: string

permissions:
  contents: write

concurrency:
  group: nextsigner-publish
  cancel-in-progress: false

jobs:
  sign-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      REQUEST_ID: ${{ inputs.request_id }}
      ZSIGN_COMMIT: e803f870dc686e6161d00d9b22c425b8acdfacee
      INBOX_TAG: nextsigner-inbox
      PUBLISH_TAG: private-apps
      P12_PASSWORD: ${{ secrets.NEXTSIGNER_P12_PASSWORD }}
      R2_BUCKET: next-signer-apps
      R2_PUBLIC_BASE: https://files.nextjailbreak.com
      R2_ACCOUNT_ID: 4fe920e259870b0366118a17cc5727e5
      AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: 'true'
      CUSTOM_ICON_ASSET: ${{ inputs.custom_icon_asset }}
      TWEAK_ASSETS_JSON: ${{ inputs.tweak_assets_json }}
      DUPLICATE_SIGNING: ${{ inputs.duplicate_signing }}
      INJECT_EXTENSIONS: ${{ inputs.inject_extensions }}
      WEAK_INJECTION: ${{ inputs.weak_injection }}

    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Log • validate signing material
        continue-on-error: true
        shell: bash
        run: bash .github/scripts/nextsigner-publish-status.sh running Validate "Validating Apple certificate, P12 password and provisioning profile."

      - name: Validate signing secrets and options
        shell: bash
        env:
          P12_B64: ${{ secrets.NEXTSIGNER_P12_BASE64 }}
          PROVISION_B64: ${{ secrets.NEXTSIGNER_MOBILEPROVISION_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$P12_B64" || { echo 'NEXTSIGNER_P12_BASE64 is missing'; exit 1; }
          test -n "$P12_PASSWORD" || { echo 'NEXTSIGNER_P12_PASSWORD is missing'; exit 1; }
          test -n "$PROVISION_B64" || { echo 'NEXTSIGNER_MOBILEPROVISION_BASE64 is missing'; exit 1; }
          printf '%s' "$P12_B64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          printf '%s' "$PROVISION_B64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          chmod 600 "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/profile.mobileprovision"
          printf '%s' "$TWEAK_ASSETS_JSON" | jq -e 'type == "array" and all(.[]; type == "string")' >/dev/null
          case "$INJECT_EXTENSIONS" in true|false) ;; *) echo 'inject_extensions must be true/false'; exit 1;; esac
          case "$WEAK_INJECTION" in true|false) ;; *) echo 'weak_injection must be true/false'; exit 1;; esac

      - name: Log • download staged files
        continue-on-error: true
        shell: bash
        run: bash .github/scripts/nextsigner-publish-status.sh running Download "Downloading the staged IPA and selected customization files."

      - name: Download staged app and customization assets
        shell: bash
        env:
          STAGING_ASSET: ${{ inputs.staging_asset }}
        run: |
          set -euo pipefail
          RELEASES_JSON="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100")"
          RELEASE_ID="$(printf '%s' "$RELEASES_JSON" | jq -r --arg tag "$INBOX_TAG" '.[] | select(.tag_name==$tag) | .id' | head -n1)"
          test -n "$RELEASE_ID" && test "$RELEASE_ID" != null || { echo 'Signing inbox release not found'; exit 1; }
          ASSETS_JSON="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100")"

          download_asset() {
            local name="$1"
            local destination="$2"
            local id
            id="$(printf '%s' "$ASSETS_JSON" | jq -r --arg name "$name" '.[] | select(.name==$name) | .id' | head -n1)"
            test -n "$id" && test "$id" != null || { echo "Inbox asset not found: $name"; exit 1; }
            gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "$destination"
            test -s "$destination"
          }

          APP_ASSET_ID="$(printf '%s' "$ASSETS_JSON" | jq -r --arg name "$STAGING_ASSET" '.[] | select(.name==$name) | .id' | head -n1)"
          test -n "$APP_ASSET_ID" && test "$APP_ASSET_ID" != null || { echo "Staged app not found: $STAGING_ASSET"; exit 1; }
          gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$APP_ASSET_ID" > "$RUNNER_TEMP/input.ipa"
          test -s "$RUNNER_TEMP/input.ipa"

          mkdir -p "$RUNNER_TEMP/addons"
          if [ -n "$CUSTOM_ICON_ASSET" ]; then
            download_asset "$CUSTOM_ICON_ASSET" "$RUNNER_TEMP/custom-icon-source"
          fi

          printf '%s' "$TWEAK_ASSETS_JSON" | jq -r '.[]' | while IFS= read -r asset; do
            [ -n "$asset" ] || continue
            safe="$(printf '%s' "$asset" | tr '/\\' '__')"
            download_asset "$asset" "$RUNNER_TEMP/addons/$safe"
          done

          echo "INBOX_RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"
          echo "INBOX_ASSET_ID=$APP_ASSET_ID" >> "$GITHUB_ENV"

      - name: Log • build zsign
        continue-on-error: true
        shell: bash
        run: bash .github/scripts/nextsigner-publish-status.sh running zsign "Building the pinned zsign signing engine."

      - name: Build pinned zsign
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y g++ pkg-config libssl-dev jq pngcrush dpkg
          git clone --filter=blob:none https://github.com/zhlynn/zsign.git "$RUNNER_TEMP/zsign"
          git -C "$RUNNER_TEMP/zsign" checkout "$ZSIGN_COMMIT"
          make -C "$RUNNER_TEMP/zsign/build/linux" clean
          make -C "$RUNNER_TEMP/zsign/build/linux" -j"$(nproc)"
          "$RUNNER_TEMP/zsign/bin/zsign" --version

      - name: Log • prepare customization
        continue-on-error: true
        shell: bash
        run: bash .github/scripts/nextsigner-publish-status.sh running Customize "Preparing custom icon and tweak injection options."

      - name: Prepare custom icon
        if: inputs.custom_icon_asset != ''
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageOps
          import os
          source = os.path.join(os.environ['RUNNER_TEMP'], 'custom-icon-source')
          target = os.path.join(os.environ['RUNNER_TEMP'], 'custom-icon.png')
          with Image.open(source) as image:
              image = ImageOps.exif_transpose(image).convert('RGBA')
              width, height = image.size
              side = min(width, height)
              left = (width - side) // 2
              top = (height - side) // 2
              image = image.crop((left, top, left + side, top + side)).resize((1024, 1024), Image.Resampling.LANCZOS)
              image.save(target, format='PNG', optimize=True)
          PY
          test -s "$RUNNER_TEMP/custom-icon.png"

      - name: Prepare tweak dylibs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/inject-dylibs" "$RUNNER_TEMP/deb-extract"
          attached_count="$(find "$RUNNER_TEMP/addons" -type f | wc -l | tr -d ' ')"
          counter=0
          while IFS= read -r -d '' addon; do
            counter=$((counter + 1))
            lower="$(printf '%s' "$addon" | tr '[:upper:]' '[:lower:]')"
            if [[ "$lower" == *.dylib ]]; then
              cp "$addon" "$RUNNER_TEMP/inject-dylibs/${counter}-$(basename "$addon")"
            elif [[ "$lower" == *.deb ]]; then
              target="$RUNNER_TEMP/deb-extract/$counter"
              mkdir -p "$target"
              dpkg-deb -x "$addon" "$target"
              sub=0
              while IFS= read -r -d '' dylib; do
                sub=$((sub + 1))
                cp "$dylib" "$RUNNER_TEMP/inject-dylibs/${counter}-${sub}-$(basename "$dylib")"
              done < <(find "$target" -type f -iname '*.dylib' -print0)
            else
              echo "Unsupported tweak attachment: $addon"
              exit 1
            fi
          done < <(find "$RUNNER_TEMP/addons" -type f -print0)

          dylib_count="$(find "$RUNNER_TEMP/inject-dylibs" -type f -iname '*.dylib' | wc -l | tr -d ' ')"
          if [ "$attached_count" -gt 0 ] && [ "$dylib_count" -eq 0 ]; then
            echo 'Tweak attachments were supplied but no injectable dylibs were found.'
            exit 1
          fi
          echo "TWEAK_DYLIB_COUNT=$dylib_count" >> "$GITHUB_ENV"

      - name: Log • sign IPA
        continue-on-error: true
        shell: bash
        run: bash .github/scripts/nextsigner-publish-status.sh running Sign "Signing the IPA with the requested bundle ID, name, icon and tweaks."

      - name: Sign IPA with requested options
        shell: bash
        env:
          REQUESTED_NAME: ${{ inputs.requested_name }}
          REQUESTED_BUNDLE_ID: ${{ inputs.requested_bundle_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/metadata"
          args=(
            -f
            -k "$RUNNER_TEMP/certificate.p12"
            -p "$P12_PASSWORD"
            -m "$RUNNER_TEMP/profile.mobileprovision"
            -b "$REQUESTED_BUNDLE_ID"
            -n "$REQUESTED_NAME"
            -x "$RUNNER_TEMP/metadata"
          )

          if [ -s "$RUNNER_TEMP/custom-icon.png" ]; then
            args+=( -I "$RUNNER_TEMP/custom-icon.png" )
          fi

          while IFS= read -r -d '' dylib; do
            args+=( -l "$dylib" )
          done < <(find "$RUNNER_TEMP/inject-dylibs" -type f -iname '*.dylib' -print0 | sort -z)

          if [ "${TWEAK_DYLIB_COUNT:-0}" -gt 0 ] && [ "$INJECT_EXTENSIONS" = true ]; then
            args+=( -P )
          fi
          if [ "${TWEAK_DYLIB_COUNT:-0}" -gt 0 ] && [ "$WEAK_INJECTION" = true ]; then
            args+=( -w )
          fi

          args+=( -o "$RUNNER_TEMP/signed.ipa" "$RUNNER_TEMP/input.ipa" )
          "$RUNNER_TEMP/zsign/bin/zsign" "${args[@]}"
          test -s "$RUNNER_TEMP/signed.ipa"
          unzip -t "$RUNNER_TEMP/signed.ipa" >/dev/null

      - name: Log • read metadata
        continue-on-error: true
        shell: bash
        run: bash .github/scripts/nextsigner-publish-status.sh running Metadata "Reading the signed app version, build, bundle ID and minimum iOS version."

      - name: Read signed app metadata
        shell: bash
        env:
          REQUESTED_NAME: ${{ inputs.requested_name }}
          REQUESTED_BUNDLE_ID: ${{ inputs.requested_bundle_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, plistlib, re, zipfile
          ipa = os.path.join(os.environ['RUNNER_TEMP'], 'signed.ipa')
          with zipfile.ZipFile(ipa) as z:
              infos = [n for n in z.namelist() if re.fullmatch(r'Payload/[^/]+\.app/Info\.plist', n)]
              if not infos:
                  raise SystemExit('Main app Info.plist not found')
              info = plistlib.loads(z.read(infos[0]))
          name = info.get('CFBundleDisplayName') or info.get('CFBundleName') or os.environ['REQUESTED_NAME']
          bundle_id = info.get('CFBundleIdentifier') or os.environ['REQUESTED_BUNDLE_ID']
          version = str(info.get('CFBundleShortVersionString') or '1.0')
          build = str(info.get('CFBundleVersion') or '1')
          minimum = str(info.get('MinimumOSVersion') or 'Unknown')
          slug = re.sub(r'[^a-z0-9]+', '-', bundle_id.lower()).strip('-')[-70:] or 'signed-app'
          version_slug = re.sub(r'[^A-Za-z0-9._-]+', '-', version).strip('-') or '1.0'
          build_slug = re.sub(r'[^A-Za-z0-9._-]+', '-', build).strip('-') or '1'
          signed_filename = f'{slug}-{version_slug}-{build_slug}.ipa'
          values = {
              'APP_NAME': name,
              'APP_BUNDLE_ID': bundle_id,
              'APP_VERSION': version,
              'APP_BUILD': build,
              'APP_MINIMUM_OS': minimum,
              'APP_SLUG': slug,
              'APP_VERSION_SLUG': version_slug,
              'APP_BUILD_SLUG': build_slug,
              'SIGNED_FILENAME': signed_filename,
              'R2_OBJECT_KEY': f'apps/ipa/{slug}/{version_slug}/{signed_filename}',
          }
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              for key, value in values.items():
                  print(f'{key}={value}', file=f)
          PY

      - name: Record signed IPA integrity
        shell: bash
        run: |
          set -euo pipefail
          echo "SIGNED_SHA256=$(sha256sum "$RUNNER_TEMP/signed.ipa" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "SIGNED_SIZE=$(stat -c '%s' "$RUNNER_TEMP/signed.ipa")" >> "$GITHUB_ENV"

      - name: Log • upload signed IPA
        continue-on-error: true
        shell: bash
        run: bash .github/scripts/nextsigner-publish-status.sh running "R2 Upload" "Uploading the signed IPA to Cloudflare R2."

      - name: Publish signed IPA
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/signed.ipa" "$RUNNER_TEMP/$SIGNED_FILENAME"

          if [ -n "${AWS_ACCESS_KEY_ID:-}" ] && [ -n "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            python3 -m pip install --user --quiet awscli
            export PATH="$HOME/.local/bin:$PATH"
            aws s3 cp \
              "$RUNNER_TEMP/$SIGNED_FILENAME" \
              "s3://$R2_BUCKET/$R2_OBJECT_KEY" \
              --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
              --content-type 'application/octet-stream' \
              --cache-control 'public, max-age=31536000, immutable' \
              --only-show-errors
            echo "SIGNED_URL=$R2_PUBLIC_BASE/$R2_OBJECT_KEY" >> "$GITHUB_ENV"
            echo 'SIGNED_BACKEND=Cloudflare R2' >> "$GITHUB_ENV"
          else
            echo 'R2 secrets are not configured; using GitHub Releases fallback.'
            if ! gh release view "$PUBLISH_TAG" >/dev/null 2>&1; then
              gh release create "$PUBLISH_TAG" --title 'Next Jailbreak Private Apps' --notes 'Signed builds published by Next Signer.' --latest=false
            fi
            gh release upload "$PUBLISH_TAG" "$RUNNER_TEMP/$SIGNED_FILENAME" --clobber
            echo "SIGNED_URL=https://github.com/$GITHUB_REPOSITORY/releases/download/$PUBLISH_TAG/$SIGNED_FILENAME" >> "$GITHUB_ENV"
            echo 'SIGNED_BACKEND=GitHub Releases' >> "$GITHUB_ENV"
          fi

      - name: Log • verify published IPA
        continue-on-error: true
        shell: bash
        run: bash .github/scripts/nextsigner-publish-status.sh running "R2 Verify" "Verifying the public signed IPA URL before publishing the site entry."

      - name: Verify published IPA
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SIGNED_URL:-}" || { echo 'SIGNED_URL was not produced'; exit 1; }
          curl --fail --silent --show-error --location --head \
            --retry 8 --retry-delay 3 --retry-all-errors "$SIGNED_URL" >/dev/null
          echo "Verified $SIGNED_URL"

      - name: Log • extract app icon
        continue-on-error: true
        shell: bash
        run: bash .github/scripts/nextsigner-publish-status.sh running Icon "Extracting and normalizing the app icon for the installer."

      - name: Extract published app icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/icon-extract" install/icons
          RAW_ICON="$RUNNER_TEMP/icon-extract/original-icon.png"
          rm -f "$RAW_ICON"

          while IFS= read -r -d '' candidate; do
            cp "$candidate" "$RAW_ICON"
            echo "Using zsign metadata icon: $candidate"
            break
          done < <(find "$RUNNER_TEMP/metadata" -type f -iname '*.png' -print0)

          if [ ! -s "$RAW_ICON" ]; then
            python3 - <<'PY'
          import os, pathlib, plistlib, re, struct, zipfile
          ipa = pathlib.Path(os.environ['RUNNER_TEMP']) / 'signed.ipa'
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'icon-extract' / 'original-icon.png'

          def dimensions(data):
              if not data.startswith(b'\x89PNG\r\n\x1a\n'):
                  return (0, 0)
              pos = 8
              while pos + 24 <= len(data):
                  length = struct.unpack('>I', data[pos:pos+4])[0]
                  if data[pos+4:pos+8] == b'IHDR':
                      return struct.unpack('>II', data[pos+8:pos+16])
                  pos += 12 + length
              return (0, 0)

          def norm(value):
              name = pathlib.PurePosixPath(str(value)).name
              name = re.sub(r'\.png$', '', name, flags=re.I)
              name = re.sub(r'@[123]x$', '', name, flags=re.I)
              name = re.sub(r'~ipad$', '', name, flags=re.I)
              return name.lower()

          with zipfile.ZipFile(ipa) as z:
              infos = [n for n in z.namelist() if re.fullmatch(r'Payload/[^/]+\.app/Info\.plist', n)]
              if not infos:
                  raise SystemExit('Info.plist not found while extracting icon')
              info_path = infos[0]
              info = plistlib.loads(z.read(info_path))
              app_root = info_path.rsplit('/', 1)[0] + '/'
              declared = []
              for value in (info.get('CFBundleIconFile'), info.get('CFBundleIconFiles')):
                  if isinstance(value, str): declared.append(value)
                  elif isinstance(value, list): declared.extend(str(x) for x in value)
              for key in ('CFBundleIcons', 'CFBundleIcons~ipad'):
                  icons = info.get(key)
                  if isinstance(icons, dict):
                      primary = icons.get('CFBundlePrimaryIcon')
                      if isinstance(primary, dict):
                          values = primary.get('CFBundleIconFiles')
                          if isinstance(values, list): declared.extend(str(x) for x in values)
              declared = [norm(x) for x in declared]
              candidates = []
              for member in z.namelist():
                  if not member.startswith(app_root) or member.endswith('/'):
                      continue
                  relative = member[len(app_root):]
                  if '/' in relative or not relative.lower().endswith('.png'):
                      continue
                  stem = pathlib.PurePosixPath(relative).stem
                  actual = norm(relative)
                  declared_match = any(actual == d or actual.startswith(d) or d.startswith(actual) for d in declared if d)
                  heuristic = bool(re.search(r'appicon|(?:^|[-_])icon', stem, flags=re.I))
                  if not declared_match and not heuristic:
                      continue
                  data = z.read(member)
                  width, height = dimensions(data)
                  score = (1 if declared_match else 0, 1 if 'appicon' in stem.lower() else 0, min(width, height), width * height, len(data))
                  candidates.append((score, member, data))
              if candidates:
                  _, member, data = max(candidates, key=lambda x: x[0])
                  out.write_bytes(data)
                  print(f'Extracted icon from signed IPA: {member}')
          PY
          fi

          if [ -s "$RAW_ICON" ]; then
            ICON_FILE="${APP_SLUG}-${SIGNED_SHA256:0:12}.png"
            FINAL_ICON="install/icons/$ICON_FILE"
            NORMALIZED="$RUNNER_TEMP/icon-extract/normalized.png"
            rm -f "$NORMALIZED"
            if pngcrush -revert-iphone-optimizations -q "$RAW_ICON" "$NORMALIZED" >/dev/null 2>&1 && [ -s "$NORMALIZED" ]; then
              ICON_SOURCE='Signed IPA icon (normalized)'
            else
              cp "$RAW_ICON" "$NORMALIZED"
              ICON_SOURCE='Signed IPA icon'
            fi
            rm -f install/icons/${APP_SLUG}-*.png
            mv "$NORMALIZED" "$FINAL_ICON"
            ICON_URL="/install/icons/$ICON_FILE"
          else
            ICON_URL="$(python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('install/apps.json')
          if path.exists():
              data = json.loads(path.read_text())
              for app in data.get('apps', []):
                  if app.get('id') == os.environ['APP_SLUG']:
                      icon = str(app.get('icon') or '')
                      if icon and icon not in {'/apple-touch-icon.png', '/logo.png'}:
                          print(icon)
                          break
          PY
          )"
            if [ -n "$ICON_URL" ]; then
              ICON_SOURCE='Existing app icon'
            else
              ICON_URL='/apple-touch-icon.png'
              ICON_SOURCE='Next Jailbreak fallback icon'
            fi
          fi
          echo "ICON_URL=$ICON_URL" >> "$GITHUB_ENV"
          echo "ICON_SOURCE=$ICON_SOURCE" >> "$GITHUB_ENV"

      - name: Log • generate manifest
        continue-on-error: true
        shell: bash
        run: bash .github/scripts/nextsigner-publish-status.sh running Manifest "Generating the OTA manifest and installer catalog entry."

      - name: Publish manifest and catalog entry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, plistlib
          from datetime import date
          from pathlib import Path

          root = Path('install')
          app = {
              'id': os.environ['APP_SLUG'],
              'name': os.environ['APP_NAME'],
              'version': os.environ['APP_VERSION'],
              'build': os.environ['APP_BUILD'],
              'platform': 'iPhone',
              'minimumOS': ('iOS ' + os.environ['APP_MINIMUM_OS'] + '+') if os.environ['APP_MINIMUM_OS'] != 'Unknown' else 'iOS',
              'bundleId': os.environ['APP_BUNDLE_ID'],
              'icon': os.environ['ICON_URL'],
              'manifest': f"/install/{os.environ['APP_SLUG']}.plist",
              'available': True,
              'status': 'Ready to install',
              'downloadURL': os.environ['SIGNED_URL'],
              'sha256': os.environ['SIGNED_SHA256'],
              'sizeBytes': int(os.environ['SIGNED_SIZE']),
              'storage': os.environ.get('SIGNED_BACKEND', 'Unknown'),
              'duplicateSigned': os.environ.get('DUPLICATE_SIGNING') == 'true',
              'tweakCount': int(os.environ.get('TWEAK_DYLIB_COUNT', '0')),
              'customIcon': bool(os.environ.get('CUSTOM_ICON_ASSET')),
          }
          catalog_path = root / 'apps.json'
          catalog = json.loads(catalog_path.read_text()) if catalog_path.exists() else {'catalog': 'Next Jailbreak Private Apps', 'updated': '', 'apps': []}
          catalog['apps'] = [app] + [x for x in catalog.get('apps', []) if x.get('id') != app['id']]
          catalog['updated'] = date.today().isoformat()
          catalog_path.write_text(json.dumps(catalog, indent=2) + '\n')

          icon = os.environ['ICON_URL']
          icon_absolute = icon if icon.startswith(('https://', 'http://')) else 'https://nextjailbreak.com' + icon
          manifest = {
              'items': [{
                  'assets': [
                      {'kind': 'software-package', 'url': os.environ['SIGNED_URL']},
                      {'kind': 'display-image', 'needs-shine': False, 'url': icon_absolute},
                      {'kind': 'full-size-image', 'needs-shine': False, 'url': icon_absolute},
                  ],
                  'metadata': {
                      'bundle-identifier': os.environ['APP_BUNDLE_ID'],
                      'bundle-version': os.environ['APP_BUILD'],
                      'kind': 'software',
                      'title': os.environ['APP_NAME'],
                  }
              }]
          }
          with open(root / f"{os.environ['APP_SLUG']}.plist", 'wb') as f:
              plistlib.dump(manifest, f, fmt=plistlib.FMT_XML, sort_keys=False)
          PY

      - name: Log • commit site catalog
        continue-on-error: true
        shell: bash
        run: bash .github/scripts/nextsigner-publish-status.sh running Site "Committing the app, manifest and icon to the Next Jailbreak installer."

      - name: Commit catalog update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add install/apps.json "install/$APP_SLUG.plist" install/icons || true
          if git diff --cached --quiet; then
            echo 'No website changes to commit'
          else
            git commit -m "Publish $APP_NAME via Next Signer"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Remove staging assets after success
        if: success()
        continue-on-error: true
        shell: bash
        env:
          STAGING_ASSET: ${{ inputs.staging_asset }}
        run: |
          set -u
          ASSETS_JSON="$(gh api "repos/$GITHUB_REPOSITORY/releases/$INBOX_RELEASE_ID/assets?per_page=100")"
          delete_name() {
            local name="$1"
            [ -n "$name" ] || return 0
            local id
            id="$(printf '%s' "$ASSETS_JSON" | jq -r --arg name "$name" '.[] | select(.name==$name) | .id' | head -n1)"
            if [ -n "$id" ] && [ "$id" != null ]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id" || true
            fi
          }
          delete_name "$STAGING_ASSET"
          delete_name "$CUSTOM_ICON_ASSET"
          printf '%s' "$TWEAK_ASSETS_JSON" | jq -r '.[]' | while IFS= read -r asset; do delete_name "$asset"; done

      - name: Report publish success
        if: success()
        continue-on-error: true
        shell: bash
        run: bash .github/scripts/nextsigner-publish-status.sh success Complete "Signed IPA uploaded, verified and added to the Next Jailbreak site."

      - name: Report publish failure
        if: failure()
        continue-on-error: true
        shell: bash
        run: bash .github/scripts/nextsigner-publish-status.sh failed "${CURRENT_STAGE:-Unknown}" "Publish failed during ${CURRENT_STAGE:-an unknown stage}. Tap the GitHub run button or copy this log for diagnosis."

      - name: Signing summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Next Signer'
            echo
            echo "Request: ${REQUEST_ID:-manual}"
            echo "App: ${APP_NAME:-${{ inputs.requested_name }}}"
            echo "Bundle ID: ${APP_BUNDLE_ID:-${{ inputs.requested_bundle_id }}}"
            echo "Duplicate signing: $DUPLICATE_SIGNING"
            echo "Injected dylibs: ${TWEAK_DYLIB_COUNT:-0}"
            echo "Custom icon: $([ -n "$CUSTOM_ICON_ASSET" ] && echo yes || echo no)"
            if [ "${{ job.status }}" = success ]; then
              echo 'Status: Signed and published'
              echo "Storage: ${SIGNED_BACKEND:-Unknown}"
              echo "Icon: ${ICON_SOURCE:-Unknown}"
              echo "Download: ${SIGNED_URL:-Unavailable}"
              echo 'Installer: https://nextjailbreak.com/install/'
            else
              echo 'Status: Failed — inspect the signing log above'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
