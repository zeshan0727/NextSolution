name: Build and Publish Module Glass 1.0.14 Volume Percentage Color

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-publish-module-glass-1.0.14-volume-percentage-color.yml'

permissions:
  contents: write

concurrency:
  group: nextsolution-module-glass-volume-percentage-color
  cancel-in-progress: false

jobs:
  build-validate-publish:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install packaging tools
        run: brew install dpkg ldid xz zstd

      - name: Install pinned RootHide Theos
        shell: bash
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/theos-roothide"
          git init "$T"
          git -C "$T" remote add origin https://github.com/roothide/theos.git
          git -C "$T" fetch --depth 1 origin 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$T" checkout --detach 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$T" submodule update --init --recursive --depth 1

      - name: Add Volume percentage overlay using existing selected color
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('source/ModuleGlass/Tweak.m')
          t=p.read_text()

          def one(old,new,label):
              global t
              n=t.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              t=t.replace(old,new,1)

          one(
            'static NSInteger const MGVolumeIconOverlayTag = 0x4D475649;\n',
            'static NSInteger const MGVolumeIconOverlayTag = 0x4D475649;\nstatic NSInteger const MGVolumePercentageOverlayTag = 0x4D475650;\n',
            'percentage overlay tag')

          one(
            'static char MGVolumeIconOverlayKey;\n',
            'static char MGVolumeIconOverlayKey;\nstatic char MGVolumeOriginalPercentageAlphaKey;\n',
            'percentage alpha key')

          old_restore='''static void MGRestoreVolumeIconPresentation(UIView *root) {
              if (!root) return;
              for (UIView *child in [root.subviews copy]) {
                  if (child.tag == MGVolumeIconOverlayTag) {
                      [child removeFromSuperview];
                      continue;
                  }
                  MGRestoreVolumeIconPresentation(child);
              }
              if ([root isKindOfClass:UIImageView.class]) {
                  NSNumber *savedAlpha = objc_getAssociatedObject(root, &MGVolumeOriginalIconAlphaKey);
                  if (savedAlpha) {
                      root.alpha = savedAlpha.doubleValue;
                      objc_setAssociatedObject(root, &MGVolumeOriginalIconAlphaKey, nil, OBJC_ASSOCIATION_RETAIN_NONATOMIC);
                      objc_setAssociatedObject(root, &MGVolumeIconOverlayKey, nil, OBJC_ASSOCIATION_RETAIN_NONATOMIC);
                  }
              }
          }
          '''
          new_restore='''static void MGRestoreVolumeColorPresentation(UIView *root) {
              if (!root) return;
              for (UIView *child in [root.subviews copy]) {
                  if (child.tag == MGVolumeIconOverlayTag || child.tag == MGVolumePercentageOverlayTag) {
                      [child removeFromSuperview];
                      continue;
                  }
                  MGRestoreVolumeColorPresentation(child);
              }
              if ([root isKindOfClass:UIImageView.class]) {
                  NSNumber *savedAlpha = objc_getAssociatedObject(root, &MGVolumeOriginalIconAlphaKey);
                  if (savedAlpha) {
                      root.alpha = savedAlpha.doubleValue;
                      objc_setAssociatedObject(root, &MGVolumeOriginalIconAlphaKey, nil, OBJC_ASSOCIATION_RETAIN_NONATOMIC);
                      objc_setAssociatedObject(root, &MGVolumeIconOverlayKey, nil, OBJC_ASSOCIATION_RETAIN_NONATOMIC);
                  }
              }
              if ([root isKindOfClass:UILabel.class]) {
                  NSNumber *savedAlpha = objc_getAssociatedObject(root, &MGVolumeOriginalPercentageAlphaKey);
                  if (savedAlpha) {
                      root.alpha = savedAlpha.doubleValue;
                      objc_setAssociatedObject(root, &MGVolumeOriginalPercentageAlphaKey, nil, OBJC_ASSOCIATION_RETAIN_NONATOMIC);
                  }
              }
          }
          '''
          one(old_restore,new_restore,'restore presentation')

          marker='''static void MGRemoveTaggedImages(UIView *root, UIView *except) {'''
          helpers=r'''static NSInteger MGVolumePercentageScore(UILabel *label, UIView *slider) {
              if (!label || !slider || label.tag == MGVolumePercentageOverlayTag || label.hidden) return -1;
              NSString *text = label.text ?: @"";
              NSString *trimmed = [text stringByTrimmingCharactersInSet:NSCharacterSet.whitespaceAndNewlineCharacterSet];
              if (!trimmed.length) return -1;

              CGRect rect = [label convertRect:label.bounds toView:slider];
              CGFloat w = CGRectGetWidth(rect), h = CGRectGetHeight(rect);
              if (w < 8.0 || h < 8.0 || w > 120.0 || h > 70.0) return -1;

              NSInteger score = 0;
              if ([trimmed containsString:@"%"] ) score += 10000;
              NSCharacterSet *allowed = [NSCharacterSet characterSetWithCharactersInString:@"0123456789% ."];
              if ([[trimmed stringByTrimmingCharactersInSet:allowed] length] == 0) score += 2500;

              NSString *names = @"";
              UIView *cursor = label;
              for (NSInteger i = 0; i < 5 && cursor; i++, cursor = cursor.superview) {
                  names = [names stringByAppendingFormat:@" %@", NSStringFromClass(cursor.class).lowercaseString ?: @""];
              }
              for (NSString *needle in @[@"percentage", @"percent", @"value", @"volume", @"audio", @"slider"]) {
                  if ([names containsString:needle]) score += 1200;
              }

              CGFloat midX = CGRectGetMidX(rect);
              if (fabs(midX - CGRectGetMidX(slider.bounds)) < CGRectGetWidth(slider.bounds) * 0.40) score += 700;
              return score;
          }

          static void MGCollectVolumePercentageCandidates(UIView *root, UIView *slider, NSMutableArray<UILabel *> *out) {
              if (!root) return;
              if ([root isKindOfClass:UILabel.class] && root.tag != MGVolumePercentageOverlayTag) {
                  UILabel *label=(UILabel *)root;
                  if (MGVolumePercentageScore(label, slider) >= 0) [out addObject:label];
              }
              for (UIView *child in root.subviews) MGCollectVolumePercentageCandidates(child, slider, out);
          }

          static UILabel *MGFindVolumePercentageLabel(UIView *slider) {
              if (!slider) return nil;
              NSMutableArray<UILabel *> *candidates=[NSMutableArray array];
              MGCollectVolumePercentageCandidates(slider, slider, candidates);
              UILabel *best=nil;
              NSInteger bestScore=-1;
              for (UILabel *candidate in candidates) {
                  NSInteger score=MGVolumePercentageScore(candidate, slider);
                  if (score > bestScore) { best=candidate; bestScore=score; }
              }
              return bestScore >= 2000 ? best : nil;
          }

          static BOOL MGApplyVolumePercentageTint(UIView *slider, UIColor *color, NSString **outClass, CGRect *outFrame, NSString **outText) {
              if (!slider || !color) return NO;
              UILabel *label=MGFindVolumePercentageLabel(slider);
              if (!label || !label.superview) return NO;

              NSNumber *storedAlpha=objc_getAssociatedObject(label, &MGVolumeOriginalPercentageAlphaKey);
              CGFloat sourceAlpha=storedAlpha ? storedAlpha.doubleValue : label.alpha;
              if (!storedAlpha) {
                  objc_setAssociatedObject(label, &MGVolumeOriginalPercentageAlphaKey, @(label.alpha), OBJC_ASSOCIATION_RETAIN_NONATOMIC);
              }

              UILabel *overlay=[[UILabel alloc] initWithFrame:CGRectZero];
              overlay.tag=MGVolumePercentageOverlayTag;
              overlay.userInteractionEnabled=NO;
              overlay.backgroundColor=UIColor.clearColor;
              overlay.bounds=label.bounds;
              overlay.center=label.center;
              overlay.transform=label.transform;
              overlay.alpha=sourceAlpha;
              overlay.hidden=label.hidden;
              overlay.font=label.font;
              overlay.textAlignment=label.textAlignment;
              overlay.numberOfLines=label.numberOfLines;
              overlay.lineBreakMode=label.lineBreakMode;
              overlay.baselineAdjustment=label.baselineAdjustment;
              overlay.adjustsFontSizeToFitWidth=label.adjustsFontSizeToFitWidth;
              overlay.minimumScaleFactor=label.minimumScaleFactor;
              overlay.contentMode=label.contentMode;
              overlay.layer.cornerRadius=label.layer.cornerRadius;
              overlay.layer.masksToBounds=label.layer.masksToBounds;

              if (label.attributedText.length) {
                  NSMutableAttributedString *a=[label.attributedText mutableCopy];
                  [a addAttribute:NSForegroundColorAttributeName value:color range:NSMakeRange(0, a.length)];
                  overlay.attributedText=a;
              } else {
                  overlay.text=label.text;
                  overlay.textColor=color;
              }

              [label.superview insertSubview:overlay aboveSubview:label];
              label.alpha=0.0;

              if (outClass) *outClass=[NSString stringWithFormat:@"%@+overlay", NSStringFromClass(label.class) ?: @"UILabel"];
              if (outFrame) *outFrame=[overlay convertRect:overlay.bounds toView:slider];
              if (outText) *outText=overlay.text ?: overlay.attributedText.string ?: @"";
              return YES;
          }

          static void MGRemoveTaggedImages(UIView *root, UIView *except) {'''
          one(marker,helpers,'percentage helpers')

          one(
            '    MGRestoreVolumeIconPresentation(root);\n',
            '    MGRestoreVolumeColorPresentation(root);\n',
            'restore call')

          old_apply='''    BOOL volumeIconApplied = NO;
              NSString *volumeIconClass = @"<none>";
              CGRect volumeIconFrame = CGRectZero;
              BOOL volumeIconColorEnabled = [slot isEqualToString:@"volume"] && MGBoolPreference(@"CCModuleVolumeIconColorEnabled", NO);
              NSString *volumeIconColorHex = [[MGPreference(@"CCModuleVolumeIconColor") description] copy] ?: @"";
              if (volumeIconColorEnabled) {
                  UIView *volumeSlider = MGFindSliderView(root);
                  UIColor *volumeColor = MGVolumeColorFromHex(volumeIconColorHex);
                  if (volumeSlider && volumeColor) {
                      volumeIconApplied = MGApplyVolumeIconTint(volumeSlider, volumeColor, &volumeIconClass, &volumeIconFrame);
                  }
              }
          '''
          new_apply='''    BOOL volumeIconApplied = NO;
              NSString *volumeIconClass = @"<none>";
              CGRect volumeIconFrame = CGRectZero;
              BOOL volumePercentageApplied = NO;
              NSString *volumePercentageClass = @"<none>";
              CGRect volumePercentageFrame = CGRectZero;
              NSString *volumePercentageText = @"";
              BOOL volumeIconColorEnabled = [slot isEqualToString:@"volume"] && MGBoolPreference(@"CCModuleVolumeIconColorEnabled", NO);
              NSString *volumeIconColorHex = [[MGPreference(@"CCModuleVolumeIconColor") description] copy] ?: @"";
              if (volumeIconColorEnabled) {
                  UIView *volumeSlider = MGFindSliderView(root);
                  UIColor *volumeColor = MGVolumeColorFromHex(volumeIconColorHex);
                  if (volumeSlider && volumeColor) {
                      volumeIconApplied = MGApplyVolumeIconTint(volumeSlider, volumeColor, &volumeIconClass, &volumeIconFrame);
                      volumePercentageApplied = MGApplyVolumePercentageTint(volumeSlider, volumeColor, &volumePercentageClass, &volumePercentageFrame, &volumePercentageText);
                  }
              }
          '''
          one(old_apply,new_apply,'apply percentage')

          one(
            'volumeIconColorEnabled=%d volumeIconApplied=%d volumeIconColor=%@ volumeIconClass=%@ volumeIconFrame=%@", source, NSStringFromClass([controller class]), slot, enabled, exists, volumeIconColorEnabled, volumeIconApplied, volumeIconColorHex, volumeIconClass, NSStringFromCGRect(volumeIconFrame)]);',
            'volumeIconColorEnabled=%d volumeIconApplied=%d volumeIconColor=%@ volumeIconClass=%@ volumeIconFrame=%@ volumePercentageApplied=%d volumePercentageClass=%@ volumePercentageFrame=%@ volumePercentageText=%@", source, NSStringFromClass([controller class]), slot, enabled, exists, volumeIconColorEnabled, volumeIconApplied, volumeIconColorHex, volumeIconClass, NSStringFromCGRect(volumeIconFrame), volumePercentageApplied, volumePercentageClass, NSStringFromCGRect(volumePercentageFrame), volumePercentageText]);',
            'inactive diagnostics')

          one(
            'volumeIconColorEnabled=%d volumeIconApplied=%d volumeIconColor=%@ volumeIconClass=%@ volumeIconFrame=%@ glowPref=%d glowIntensity=%.2f glowWidth=%.2f",\n                      source, NSStringFromClass([controller class]), candidates, slot, path, exists, enabled, imageView.image != nil, removeBlur, opacity, strategy, NSStringFromClass(root.class), NSStringFromCGRect(root.frame), NSStringFromClass(parent.class), anchor ? NSStringFromClass(anchor.class) : @"<none>", anchor ? NSStringFromCGRect(anchor.frame) : @"<none>", cornerSource.layer.cornerRadius, NSStringFromCGRect(imageView.frame), (unsigned long)parent.subviews.count, imageView, (unsigned long)volumeSuppressed, volumeSuppressedClasses, volumeIconColorEnabled, volumeIconApplied, volumeIconColorHex, volumeIconClass, NSStringFromCGRect(volumeIconFrame), glow, glowIntensity, glowWidth]);',
            'volumeIconColorEnabled=%d volumeIconApplied=%d volumeIconColor=%@ volumeIconClass=%@ volumeIconFrame=%@ volumePercentageApplied=%d volumePercentageClass=%@ volumePercentageFrame=%@ volumePercentageText=%@ glowPref=%d glowIntensity=%.2f glowWidth=%.2f",\n                      source, NSStringFromClass([controller class]), candidates, slot, path, exists, enabled, imageView.image != nil, removeBlur, opacity, strategy, NSStringFromClass(root.class), NSStringFromCGRect(root.frame), NSStringFromClass(parent.class), anchor ? NSStringFromClass(anchor.class) : @"<none>", anchor ? NSStringFromCGRect(anchor.frame) : @"<none>", cornerSource.layer.cornerRadius, NSStringFromCGRect(imageView.frame), (unsigned long)parent.subviews.count, imageView, (unsigned long)volumeSuppressed, volumeSuppressedClasses, volumeIconColorEnabled, volumeIconApplied, volumeIconColorHex, volumeIconClass, NSStringFromCGRect(volumeIconFrame), volumePercentageApplied, volumePercentageClass, NSStringFromCGRect(volumePercentageFrame), volumePercentageText, glow, glowIntensity, glowWidth]);',
            'full diagnostics')

          t=t.replace('ModuleGlassRuntime 1.0.9 Volume Color Overlay loaded','ModuleGlassRuntime 1.0.10 Volume Icon+Percentage Color loaded')
          t=t.replace('Volume-isolated image-first runtime with persistent icon overlay','Volume-isolated image-first runtime with persistent icon and percentage overlays')
          p.write_text(t)

          c=Path('source/ModuleGlass/control')
          ct=c.read_text()
          ct=re.sub(r'^Version: .*$', 'Version: 1.0.10', ct, flags=re.M)
          ct=re.sub(r'^Description: .*$', 'Description: Working isolated Module Glass Volume runtime with persistent speaker icon and percentage color overlays and unchanged image-first background behavior.', ct, flags=re.M)
          c.write_text(ct)
          PY

          grep -q '^Version: 1.0.10$' source/ModuleGlass/control
          grep -q 'MGVolumePercentageOverlayTag' source/ModuleGlass/Tweak.m
          grep -q 'MGApplyVolumePercentageTint' source/ModuleGlass/Tweak.m
          grep -q 'volumePercentageApplied' source/ModuleGlass/Tweak.m
          grep -q 'volume-image-first-test' source/ModuleGlass/Tweak.m
          grep -q 'MGVolumeIconOverlayTag' source/ModuleGlass/Tweak.m

      - name: Build Module Glass Runtime 1.0.10
        shell: bash
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/source/ModuleGlass"
          OUT="$RUNNER_TEMP/release"
          STAGE="$RUNNER_TEMP/runtime-stage"
          export THEOS="$RUNNER_TEMP/theos-roothide"
          export THEOS_PACKAGE_SCHEME=roothide
          mkdir -p "$OUT"
          rm -rf "$P/.theos" "$P/packages" "$STAGE"
          make -C "$P" clean package FINALPACKAGE=1
          DEB=$(find "$P/packages" -type f -name '*.deb' -print -quit)
          test -n "$DEB"
          dpkg-deb -R "$DEB" "$STAGE"
          test -f "$STAGE/Library/MobileSubstrate/DynamicLibraries/CCModuleBackgrounds.dylib"
          cat > "$STAGE/DEBIAN/postinst" <<'SH'
          #!/bin/sh
          killall -9 SpringBoard 2>/dev/null || true
          exit 0
          SH
          chmod 0755 "$STAGE/DEBIAN/postinst"
          dpkg-deb -b "$STAGE" "$OUT/NextAura_Runtime_ccbackgrounds_1.0.10_RootHide.deb"

      - name: Build Module Glass 1.0.14 wrapper
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/release"
          STAGE="$RUNNER_TEMP/wrapper-stage"
          rm -rf "$STAGE"
          dpkg-deb -R debfiles/NextAura_cc_module_backgrounds_1.0.13_RootHide.deb "$STAGE"
          python3 - "$STAGE/DEBIAN/control" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); t=p.read_text()
          t=re.sub(r'^Version: .*$', 'Version: 1.0.14', t, flags=re.M)
          t=re.sub(r'com\.nextsolution\.nextaura\.runtime\.ccbackgrounds \(>= [^)]+\)', 'com.nextsolution.nextaura.runtime.ccbackgrounds (>= 1.0.10)', t)
          t=re.sub(r'^Description: .*$', 'Description: Working Volume image-first build with synchronized speaker icon and live percentage color from the same native color picker; all non-Volume rendering remains unchanged.', t, flags=re.M)
          p.write_text(t)
          PY
          grep -q '^Version: 1.0.14$' "$STAGE/DEBIAN/control"
          grep -q 'runtime.preferences (>= 1.0.5)' "$STAGE/DEBIAN/control"
          grep -q 'runtime.ccbackgrounds (>= 1.0.10)' "$STAGE/DEBIAN/control"
          dpkg-deb -b "$STAGE" "$OUT/NextAura_cc_module_backgrounds_1.0.14_RootHide.deb"

      - name: Validate packages
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/release"
          R="$OUT/NextAura_Runtime_ccbackgrounds_1.0.10_RootHide.deb"
          M="$OUT/NextAura_cc_module_backgrounds_1.0.14_RootHide.deb"
          test "$(dpkg-deb -f "$R" Version)" = 1.0.10
          test "$(dpkg-deb -f "$M" Version)" = 1.0.14
          dpkg-deb -f "$M" Depends | grep -q 'runtime.preferences (>= 1.0.5)'
          dpkg-deb -f "$M" Depends | grep -q 'runtime.ccbackgrounds (>= 1.0.10)'
          X=$(mktemp -d)
          dpkg-deb -x "$R" "$X/r"
          D="$X/r/Library/MobileSubstrate/DynamicLibraries/CCModuleBackgrounds.dylib"
          lipo -info "$D" | grep -q arm64
          lipo -info "$D" | grep -q arm64e
          strings -a "$D" | grep -q 'ModuleGlassRuntime 1.0.10 Volume Icon+Percentage Color loaded'
          strings -a "$D" | grep -q 'MGVolumePercentageOverlayTag' || true
          strings -a "$D" | grep -q 'volumePercentageApplied'
          strings -a "$D" | grep -q 'CCModuleVolumeIconColor'
          strings -a "$D" | grep -q 'volume-image-first-test'
          rm -rf "$X"
          shasum -a 256 "$R" "$M"

      - name: Sync latest main preserving tested source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Next Jailbreak Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase --autostash origin main
          grep -q '^Version: 1.0.10$' source/ModuleGlass/control
          grep -q 'MGApplyVolumePercentageTint' source/ModuleGlass/Tweak.m

      - name: Publish packages and refresh repo indexes
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/release"
          SCAN="$RUNNER_TEMP/scan"
          mkdir -p debfiles "$SCAN"
          cp "$OUT/NextAura_Runtime_ccbackgrounds_1.0.10_RootHide.deb" debfiles/
          cp "$OUT/NextAura_cc_module_backgrounds_1.0.14_RootHide.deb" debfiles/
          cp "$OUT"/*.deb "$SCAN/"

          dpkg-scanpackages -m "$SCAN" /dev/null > "$RUNNER_TEMP/stanzas"
          python3 - "$RUNNER_TEMP/stanzas" <<'PY'
          from pathlib import Path
          import os,re,sys
          s=Path(sys.argv[1])
          lines=[]
          for line in s.read_text().splitlines():
              if line.startswith('Filename: '): line='Filename: ./debfiles/'+os.path.basename(line.split(': ',1)[1])
              lines.append(line)
          s.write_text('\n'.join(lines)+'\n')
          ids={'com.nextsolution.nextaura.runtime.ccbackgrounds','com.nextsolution.nextaura.cc-module-backgrounds'}
          pkg=Path('Packages')
          rows=[x.strip() for x in re.split(r'\n\s*\n',pkg.read_text()) if x.strip()]
          def pid(row):
              m=re.search(r'^Package: (.+)$',row,re.M); return m.group(1).strip() if m else ''
          rows=[r for r in rows if pid(r) not in ids]
          new=[x.strip() for x in re.split(r'\n\s*\n',s.read_text()) if x.strip()]
          pkg.write_text('\n\n'.join(rows+new)+'\n')
          PY

          grep -A18 '^Package: com.nextsolution.nextaura.cc-module-backgrounds$' Packages | grep -q '^Version: 1.0.14$'
          grep -A18 '^Package: com.nextsolution.nextaura.runtime.ccbackgrounds$' Packages | grep -q '^Version: 1.0.10$'
          grep -A20 '^Package: com.nextsolution.nextaura.cc-module-backgrounds$' Packages | grep -q 'runtime.preferences (>= 1.0.5)'
          grep -A20 '^Package: com.nextsolution.nextaura.cc-module-backgrounds$' Packages | grep -q 'runtime.ccbackgrounds (>= 1.0.10)'

          gzip -9 -c Packages > Packages.gz
          bzip2 -9 -c Packages > Packages.bz2
          xz -9e -c Packages > Packages.xz
          zstd -19 -q -c Packages > Packages.zst
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import re
          p=Path('Release'); t=p.read_text()
          m=re.search(r'^Version:\s*(\d+)\.(\d+)\.(\d+)\s*$',t,re.M)
          if m:
              a,b,c=map(int,m.groups()); t=re.sub(r'^Version: .*$',f'Version: {a}.{b}.{c+1}',t,flags=re.M)
          t=re.sub(r'^Date: .*$', 'Date: '+datetime.now(timezone.utc).strftime('%a, %d %b %Y %H:%M:%S UTC'), t, flags=re.M)
          p.write_text(t)
          PY

          git add source/ModuleGlass/Tweak.m source/ModuleGlass/control \
            debfiles/NextAura_Runtime_ccbackgrounds_1.0.10_RootHide.deb \
            debfiles/NextAura_cc_module_backgrounds_1.0.14_RootHide.deb \
            Packages Packages.gz Packages.bz2 Packages.xz Packages.zst Release
          git diff --cached --check
          git commit -m 'Publish Module Glass 1.0.14 Volume percentage color'
          git push origin HEAD:main
