name: Build NextLock 1.1.5 CPU Fix Test 4 PR

on:
  pull_request:
    branches: [main]
    paths:
      - 'transfer/build-triggers/nextlock-test4.txt'
      - '.github/workflows/build-nextlock-1.1.5-cpufix-test2-pr.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: brew install dpkg ldid

      - name: Fetch verified Test 4 source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin debug/nextlock-1.1.4-cpu-fix
          git worktree add "$RUNNER_TEMP/nextlock-debug" FETCH_HEAD
          S="$RUNNER_TEMP/nextlock-debug/source/NextLockPerfFix/Tweak.m"
          test -f "$S"
          grep -q 'NextLockPerfFix 1.1.5-test4 cap-hot-refresh-10hz duplicate-deferred-off exact-transparency-cache' "$S"
          grep -q 'kArm64eUpdateAOffset = 0x8388' "$S"
          grep -q 'kArm64eUpdateBOffset = 0x86B8' "$S"
          grep -q 'kArm64ePhotosOffset  = 0x8A58' "$S"
          grep -q '100000000ULL' "$S"

      - name: Build RootHide Test 4 shim
        shell: bash
        run: |
          set -euo pipefail
          P="$RUNNER_TEMP/nextlock-debug/source/NextLockPerfFix"
          T="$RUNNER_TEMP/theos-rh"
          git init "$T"
          git -C "$T" remote add origin https://github.com/roothide/theos.git
          git -C "$T" fetch --depth 1 origin 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$T" checkout --detach 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$T" submodule update --init --recursive --depth 1
          sed -i '' 's/^Architecture: iphoneos-arm64$/Architecture: iphoneos-arm64e/' "$P/control"
          export THEOS="$T"
          export THEOS_PACKAGE_SCHEME=roothide
          rm -rf "$P/.theos" "$P/packages"
          make -C "$P" clean package FINALPACKAGE=1
          D=$(find "$P/packages" -type f -name '*.deb' -print -quit)
          test -n "$D"
          echo "FIX_DEB=$D" >> "$GITHUB_ENV"

      - name: Integrate into original NextLock 1.1.4
        shell: bash
        run: |
          set -euo pipefail
          BASE=transfer/files/NextLock/1.1.4/NextLock_1.1.4_RootHide.deb
          test -f "$BASE"
          STAGE="$RUNNER_TEMP/nextlock-stage"
          FIXSTAGE="$RUNNER_TEMP/fix-stage"
          OUT="$RUNNER_TEMP/out"
          mkdir -p "$OUT"
          dpkg-deb -R "$BASE" "$STAGE"
          dpkg-deb -x "$FIX_DEB" "$FIXSTAGE"
          LOCK=$(find "$STAGE" -name LockGlyphTime.dylib -print -quit)
          FIX=$(find "$FIXSTAGE" -name NextLockPerfFix.dylib -print -quit)
          FIXPLIST=$(find "$FIXSTAGE" -name NextLockPerfFix.plist -print -quit)
          test -n "$LOCK"; test -n "$FIX"; test -n "$FIXPLIST"
          dwarfdump --uuid "$LOCK" | tee "$RUNNER_TEMP/lock-uuids.txt"
          grep -qi 'C7EBC4D1-EAD4-3320-A27F-34E86C25F776' "$RUNNER_TEMP/lock-uuids.txt"
          grep -qi '7BE1428A-C4B0-38F8-8120-7BACBF220731' "$RUNNER_TEMP/lock-uuids.txt"
          BEFORE=$(shasum -a 256 "$LOCK" | awk '{print $1}')
          DYNDIR=$(dirname "$LOCK")
          cp "$FIX" "$DYNDIR/NextLockPerfFix.dylib"
          cp "$FIXPLIST" "$DYNDIR/NextLockPerfFix.plist"
          test "$BEFORE" = "$(shasum -a 256 "$LOCK" | awk '{print $1}')"
          python3 - "$STAGE/DEBIAN/control" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); t=p.read_text()
          t=re.sub(r'^Version: .*$', 'Version: 1.1.5~cpu4', t, flags=re.M)
          desc='Description: NextLock 1.1.5 CPU-fix Test 4. Keeps all 1.1.4 features while capping the live-proven 60/120 Hz expensive update/render storm to 10 Hz, suppressing the redundant deferred render, and caching exact transparency classification.'
          t=re.sub(r'^Description: .*$', desc, t, flags=re.M) if re.search(r'^Description: .*$',t,re.M) else t+'\n'+desc+'\n'
          p.write_text(t)
          PY
          OUTDEB="$OUT/NextLock_1.1.5_CPUFix_Test4_RootHide.deb"
          dpkg-deb -b "$STAGE" "$OUTDEB"
          echo "OUTDEB=$OUTDEB" >> "$GITHUB_ENV"
          echo "ORIGINAL_LOCK_SHA=$BEFORE" >> "$GITHUB_ENV"

      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          test "$(dpkg-deb -f "$OUTDEB" Package)" = 'com.nextsolution.lockglyphtime'
          test "$(dpkg-deb -f "$OUTDEB" Version)" = '1.1.5~cpu4'
          X=$(mktemp -d)
          dpkg-deb -x "$OUTDEB" "$X"
          LOCK=$(find "$X" -name LockGlyphTime.dylib -print -quit)
          FIX=$(find "$X" -name NextLockPerfFix.dylib -print -quit)
          PLIST=$(find "$X" -name NextLockPerfFix.plist -print -quit)
          test -n "$LOCK"; test -n "$FIX"; test -n "$PLIST"
          test "$(shasum -a 256 "$LOCK" | awk '{print $1}')" = "$ORIGINAL_LOCK_SHA"
          strings -a "$FIX" | grep -q 'NextLockPerfFix 1.1.5-test4 cap-hot-refresh-10hz duplicate-deferred-off exact-transparency-cache'
          plutil -p "$PLIST" | grep -q 'com.apple.springboard'
          lipo -info "$FIX" | grep -q 'arm64e'
          shasum -a 256 "$OUTDEB" | tee "$RUNNER_TEMP/NextLock_1.1.5_CPUFix_Test4_SHA256SUMS.txt"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: NextLock-1.1.5-CPUFix-Test4-RootHide
          path: |
            ${{ env.OUTDEB }}
            ${{ runner.temp }}/NextLock_1.1.5_CPUFix_Test4_SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
