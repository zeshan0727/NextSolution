name: Build Validate and Publish Wi-Fi Drop Haptic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-wifidrophaptic.yml"
      - "ReleaseTriggers/wifidrophaptic-publish.txt"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/publish-wifidrophaptic.yml"
      - "DailyTweaks/2026-08-10-WiFiDropHaptic/**"

permissions:
  contents: write

concurrency:
  group: publish-wifidrophaptic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-validate-publish:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Install packaging tools
        run: brew install dpkg ldid xz zstd
      - name: Validate source and diagnostic gate
        shell: bash
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/2026-08-10-WiFiDropHaptic"
          test -f Diagnostics/2026-08-10-wifidrophaptic-build.txt
          grep -q 'BUILD VALIDATION PASS' Diagnostics/2026-08-10-wifidrophaptic-build.txt
          python3 "$P/tests/test_runtime_logic.py"
          grep -q '^Package: com.nextsolution.wifidrophaptic$' "$P/control"
          grep -q '^Version: 1.0.0$' "$P/control"
          grep -q '^Architecture: iphoneos-arm64$' "$P/control"
          grep -q '^Homepage: https://nextjailbreak.com/$' "$P/control"
          grep -q '^Depiction: https://nextjailbreak.com/depictions/wifidrophaptic.html$' "$P/control"
          ! grep -R -q 'zeshan0727.github.io' "$P" depictions/wifidrophaptic.html
          grep -q '^ARCHS = arm64 arm64e$' "$P/Makefile"
          grep -q '^TARGET = iphone:clang:latest:15.0$' "$P/Makefile"
          grep -q 'Network' "$P/Makefile"
          grep -q 'segalign,4000' "$P/Makefile"
          grep -q 'com.apple.springboard' "$P/WiFiDropHaptic.plist"
          grep -q 'nw_path_monitor_create' "$P/Tweak.xm"
          grep -q 'nw_path_monitor_set_update_handler' "$P/Tweak.xm"
          grep -q 'nw_path_uses_interface_type(path, nw_interface_type_wifi)' "$P/Tweak.xm"
          grep -q 'Enable Wi-Fi Drop Alert' "$P/Preferences/Resources/Root.plist"
          test "$(grep -c 'PSSwitchCell' "$P/Preferences/Resources/Root.plist")" -eq 1
          plutil -lint "$P/Preferences/Resources/Root.plist"
          plutil -lint "$P/Preferences/Resources/Info.plist"
          plutil -lint "$P/layout/Library/PreferenceLoader/Preferences/WiFiDropHaptic.plist"
      - name: Build rootless
        shell: bash
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/2026-08-10-WiFiDropHaptic"; O="$RUNNER_TEMP/wdh-release"; L="$RUNNER_TEMP/wdh-logs"; mkdir -p "$O" "$L"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos-rootless" > "$L/rootless-bootstrap.log" 2>&1
          export THEOS="$RUNNER_TEMP/theos-rootless" THEOS_PACKAGE_SCHEME=rootless
          rm -rf "$P/packages"; make -C "$P" clean package FINALPACKAGE=1 2>&1 | tee "$L/rootless-build.log"
          D="$(find "$P/packages" -type f -name '*_iphoneos-arm64.deb' -print -quit)"; test -n "$D"; cp "$D" "$O/WiFiDropHaptic_1.0.0_Rootless.deb"
      - name: Build RootHide
        shell: bash
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/2026-08-10-WiFiDropHaptic"; O="$RUNNER_TEMP/wdh-release"; L="$RUNNER_TEMP/wdh-logs"
          git checkout -- "$P/control"
          git init "$RUNNER_TEMP/theos-roothide" > "$L/roothide-bootstrap.log" 2>&1
          git -C "$RUNNER_TEMP/theos-roothide" remote add origin https://github.com/roothide/theos.git >> "$L/roothide-bootstrap.log" 2>&1
          git -C "$RUNNER_TEMP/theos-roothide" fetch --depth 1 origin 88506b2c22e9e07dd4ed055f23c9e398a117a2c7 >> "$L/roothide-bootstrap.log" 2>&1
          git -C "$RUNNER_TEMP/theos-roothide" checkout --detach 88506b2c22e9e07dd4ed055f23c9e398a117a2c7 >> "$L/roothide-bootstrap.log" 2>&1
          git -C "$RUNNER_TEMP/theos-roothide" submodule update --init --recursive --depth 1 >> "$L/roothide-bootstrap.log" 2>&1
          sed -i '' 's/^Architecture: iphoneos-arm64$/Architecture: iphoneos-arm64e/' "$P/control"
          export THEOS="$RUNNER_TEMP/theos-roothide" THEOS_PACKAGE_SCHEME=roothide
          rm -rf "$P/packages"; make -C "$P" clean package FINALPACKAGE=1 2>&1 | tee "$L/roothide-build.log"
          D="$(find "$P/packages" -type f -name '*_iphoneos-arm64e.deb' -print -quit)"; test -n "$D"; cp "$D" "$O/WiFiDropHaptic_1.0.0_RootHide.deb"
          git checkout -- "$P/control"
      - name: Validate packages
        shell: bash
        run: |
          set -euo pipefail
          O="$RUNNER_TEMP/wdh-release"
          check(){ D="$1"; A="$2"; X="$(mktemp -d)"; test "$(dpkg-deb -f "$D" Package)" = com.nextsolution.wifidrophaptic; test "$(dpkg-deb -f "$D" Name)" = 'Wi-Fi Drop Haptic'; test "$(dpkg-deb -f "$D" Version)" = 1.0.0; test "$(dpkg-deb -f "$D" Architecture)" = "$A"; dpkg-deb -f "$D" Depends | grep -q 'firmware (>= 15.0)'; dpkg-deb -f "$D" Depends | grep -q mobilesubstrate; dpkg-deb -f "$D" Depends | grep -q preferenceloader; dpkg-deb -x "$D" "$X"; F="$(find "$X" -path '*MobileSubstrate/DynamicLibraries/WiFiDropHaptic.plist' -print -quit)"; R="$(find "$X" -path '*WiFiDropHapticPreferences.bundle/Root.plist' -print -quit)"; E="$(find "$X" -path '*PreferenceLoader/Preferences/WiFiDropHaptic.plist' -print -quit)"; Y="$(find "$X" -name WiFiDropHaptic.dylib -print -quit)"; test -n "$F"; test -n "$R"; test -n "$E"; test -s "$Y"; grep -q 'com.apple.springboard' "$F"; grep -q 'Enable Wi-Fi Drop Alert' "$R"; grep -a -q nw_path_monitor_create "$Y"; grep -a -q nw_path_uses_interface_type "$Y"; grep -a -q UINotificationFeedbackGenerator "$Y"; rm -rf "$X"; }
          check "$O/WiFiDropHaptic_1.0.0_Rootless.deb" iphoneos-arm64
          check "$O/WiFiDropHaptic_1.0.0_RootHide.deb" iphoneos-arm64e
      - name: Publish Sileo packages and indexes
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          O="$RUNNER_TEMP/wdh-release"; S="$RUNNER_TEMP/wdh-scan"; rm -rf "$S"; mkdir -p "$S"; cp "$O"/*.deb "$S/"
          dpkg-scanpackages -m "$S" /dev/null > "$RUNNER_TEMP/wdh-stanzas"
          sed -i '' 's|^Filename: .*/wdh-scan/|Filename: ./debfiles/|' "$RUNNER_TEMP/wdh-stanzas"
          git config user.name 'Next Jailbreak Build Bot'; git config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main; git reset --hard origin/main; mkdir -p debfiles; cp "$O"/*.deb debfiles/
            python3 - "$RUNNER_TEMP/wdh-stanzas" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path('Packages'); old=p.read_text() if p.exists() else ''
          rows=[x.strip() for x in re.split(r'\n\s*\n',old) if x.strip()]
          rows=[x for x in rows if not re.search(r'^Package: com\.nextsolution\.wifidrophaptic$',x,re.M)]
          new=[x.strip() for x in re.split(r'\n\s*\n',Path(sys.argv[1]).read_text()) if x.strip()]
          p.write_text('\n\n'.join(rows+new)+'\n')
          PY
            test "$(grep -c '^Package: com.nextsolution.wifidrophaptic$' Packages)" -eq 2
            test "$(grep -c '^Filename: ./debfiles/WiFiDropHaptic_1.0.0_' Packages)" -eq 2
            gzip -9 -c Packages > Packages.gz; bzip2 -9 -c Packages > Packages.bz2; xz -9e -c Packages > Packages.xz; zstd -19 -q -c Packages > Packages.zst
            python3 - <<'PY'
          from datetime import datetime,timezone
          from pathlib import Path
          import re
          p=Path('Release'); t=p.read_text(); m=re.search(r'^Version: (\d+)\.(\d+)\.(\d+)$',t,re.M)
          if m: t=re.sub(r'^Version: .*$',f'Version: {m.group(1)}.{m.group(2)}.{int(m.group(3))+1}',t,flags=re.M)
          t=re.sub(r'^Date: .*$', 'Date: '+datetime.now(timezone.utc).strftime('%a, %d %b %Y %H:%M:%S UTC'),t,flags=re.M)
          t=re.sub(r'^Icon: .*$', 'Icon: https://nextjailbreak.com/CydiaIcon.png',t,flags=re.M); p.write_text(t)
          PY
            git add debfiles/WiFiDropHaptic_1.0.0_Rootless.deb debfiles/WiFiDropHaptic_1.0.0_RootHide.deb Packages Packages.gz Packages.bz2 Packages.xz Packages.zst Release
            git diff --cached --check; git commit -m 'Publish Wi-Fi Drop Haptic 1.0.0'; git push origin HEAD:main && exit 0; sleep $((attempt*4))
          done
          exit 1
