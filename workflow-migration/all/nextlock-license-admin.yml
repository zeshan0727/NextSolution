name: NextLock License Admin

on:
  workflow_dispatch:
    inputs:
      action:
        description: Activate or revoke this NextLock Device ID
        required: true
        type: choice
        options:
          - activate
          - revoke
      device_id:
        description: NextLock Device ID shown in Settings (example NS-AB12-CD34-EF56-7890)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: nextlock-license-admin
  cancel-in-progress: false

jobs:
  update_license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Update NextLock license registry
        env:
          LICENSE_ACTION: ${{ inputs.action }}
          DEVICE_ID: ${{ inputs.device_id }}
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib, re

          action = os.environ['LICENSE_ACTION'].strip().lower()
          device = re.sub(r'\s+', '', os.environ['DEVICE_ID'].strip().upper())
          if not re.fullmatch(r'NS-[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}', device):
              raise SystemExit('Invalid Device ID. Expected NS-XXXX-XXXX-XXXX-XXXX')
          if action not in {'activate', 'revoke'}:
              raise SystemExit('Invalid action')

          package = 'com.nextsolution.lockglyphtime'
          token = hashlib.sha256(f'{device}|{package}|nextsolution-license-v1'.encode()).hexdigest()
          path = pathlib.Path('licenses/nextlock.json')
          data = json.loads(path.read_text())
          active = [str(x).lower() for x in data.get('active', [])]
          records = [x for x in data.get('devices', []) if isinstance(x, dict)]
          records = [x for x in records if str(x.get('token', '')).lower() != token]

          now = datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          parts = device.split('-')
          masked = f'NS-{parts[1]}-••••-••••-{parts[4]}'

          if action == 'activate':
              if token not in active:
                  active.append(token)
              records.append({
                  'token': token,
                  'maskedDeviceID': masked,
                  'activatedAt': now,
              })
          else:
              active = [x for x in active if x != token]

          data['active'] = sorted(set(active))
          data['devices'] = sorted(records, key=lambda x: str(x.get('maskedDeviceID', '')))
          data['updatedAt'] = now
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')
          print(f'{action.upper()} {device}')
          print(f'License token: {token}')
          PY

      - name: Commit registry change
        env:
          LICENSE_ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          git config user.name "Next Jailbreak License Bot"
          git config user.email "actions@users.noreply.github.com"
          git add licenses/nextlock.json
          if git diff --cached --quiet; then
            echo "No registry change required."
            exit 0
          fi
          git commit -m "${LICENSE_ACTION^} NextLock device license"
          git pull --rebase origin main
          git push origin main
