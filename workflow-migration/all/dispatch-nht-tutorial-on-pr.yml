name: Prepare Next Home Torch Tutorial Draft

on:
  pull_request:
    branches: [main]
    paths:
      - "DailyTweaks/2026-07-31-NextHomeTorch/TUTORIAL_TRIGGER"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tutorial/nexthometorch-1.0.0
          fetch-depth: 0
      - name: Patch and validate tutorial pages
        run: |
          python3 .github/scripts/patch-nexthometorch-pages.py
          python3 .github/scripts/publish-nexthometorch-blog.py
      - name: Commit tutorial branch
        run: |
          git config user.name 'Next Jailbreak Website Bot'
          git config user.email actions@users.noreply.github.com
          git add index.html tutorials.html sitemap.xml
          git diff --cached --check
          git commit -m 'Complete Next Home Torch tutorial draft pages'
          git push origin HEAD:tutorial/nexthometorch-1.0.0
