name: Publish NextLock Test 8 Final

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-nextlock-test8-final.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-publish:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: brew install dpkg ldid

      - name: Build validated Test 8 shim
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/nextlock-photo-content-modes
          git worktree add "$RUNNER_TEMP/feature" FETCH_HEAD
          P="$RUNNER_TEMP/feature/source/NextLockPerfFix"
          cp "$P/TweakTest7.m" "$P/TweakTest8.m"
          python3 - "$P/TweakTest8.m" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); t=p.read_text()
          t=t.replace('NextLockPerfFix 1.1.5-test7 refined-full-photo 2048px test5-cpu auto-stretch-full-cutcrop','NextLockPerfFix 1.1.5-test8 preserve-all-style skip-callback-photo refined-full-picker')
          t=t.replace('static const uintptr_t kArm64CallbackBlockOffset   = 0xBC30;\n','')
          t=t.replace('static const uintptr_t kArm64eCallbackBlockOffset  = 0xBDD4;\n','')
          t=t.replace('static void (*NLOriginalHotCallbackBlock)(void *blockObject) = NULL;\n','')
          t=t.replace('static void NLSuppressHotCallback(void *blockObject) {\n    (void)blockObject;\n}\n\n','')
          t=t.replace('static BOOL NLInstalled = NO;\n','static BOOL NLInstalled = NO;\nstatic volatile uint8_t *NLHotCallbackFlag = NULL;\n',1)
          n='static void NLPhotosWithContentModes(id host) {\n    if (NLOriginalPhotos == NULL) return;\n'
          t=t.replace(n,n+'\n    if (NLHotCallbackFlag != NULL && *NLHotCallbackFlag != 0) return;\n',1)
          t=t.replace('    uintptr_t callbackOffset = isArm64e ? kArm64eCallbackBlockOffset : kArm64CallbackBlockOffset;\n','')
          h='    MSHookFunction((void *)((uintptr_t)mh + callbackOffset),\n                   (void *)&NLSuppressHotCallback,\n                   (void **)&NLOriginalHotCallbackBlock);\n'
          if h not in t: raise SystemExit('callback hook missing')
          t=t.replace(h,'')
          a='    uintptr_t contentModeStub = isArm64e ? kArm64eSetContentModeStub : kArm64SetContentModeStub;\n'
          t=t.replace(a,a+'\n    if (isArm64e) NLHotCallbackFlag = (volatile uint8_t *)((uintptr_t)mh + 0x18EF4);\n',1)
          t=t.replace('        NLOriginalHotCallbackBlock != NULL &&\n','')
          t=t.replace('Test7 SpringBoard hooks installed (%s): Test5 CPU fix + refined photo modes','Test8 SpringBoard hooks installed (%s): styling callback preserved; callback photo duplicate skipped')
          t=t.replace('Test7 refined full-photo picker installed','Test8 full-photo no-crop picker installed')
          if 'NLSuppressHotCallback' in t or 'NLOriginalHotCallbackBlock' in t: raise SystemExit('old suppression remains')
          p.write_text(t)
          PY
          sed -i '' 's/NextLockPerfFix_FILES = TweakTest7.m/NextLockPerfFix_FILES = TweakTest8.m/' "$P/Makefile"
          grep -q 'com.apple.Preferences' "$P/NextLockPerfFix.plist"

          T="$RUNNER_TEMP/theos"
          git init "$T"
          git -C "$T" remote add origin https://github.com/roothide/theos.git
          git -C "$T" fetch --depth 1 origin 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$T" checkout --detach 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$T" submodule update --init --recursive --depth 1
          sed -i '' 's/^Architecture: iphoneos-arm64$/Architecture: iphoneos-arm64e/' "$P/control"
          export THEOS="$T" THEOS_PACKAGE_SCHEME=roothide
          rm -rf "$P/.theos" "$P/packages"
          make -C "$P" clean package FINALPACKAGE=1
          FIX_DEB=$(find "$P/packages" -name '*.deb' -print -quit)
          echo "FIX_DEB=$FIX_DEB" >> "$GITHUB_ENV"

      - name: Integrate package
        shell: bash
        run: |
          set -euo pipefail
          BASE='transfer/files/NextLock/1.1.4/NextLock_1.1.4_RootHide.deb'
          STAGE="$RUNNER_TEMP/stage"; FIXSTAGE="$RUNNER_TEMP/fix"; OUT="$RUNNER_TEMP/out"
          mkdir -p "$OUT"
          dpkg-deb -R "$BASE" "$STAGE"
          dpkg-deb -x "$FIX_DEB" "$FIXSTAGE"
          LOCK=$(find "$STAGE" -name LockGlyphTime.dylib -print -quit)
          FIX=$(find "$FIXSTAGE" -name NextLockPerfFix.dylib -print -quit)
          PLIST=$(find "$FIXSTAGE" -name NextLockPerfFix.plist -print -quit)
          ORIG=$(shasum -a 256 "$LOCK"|awk '{print $1}')
          cp "$FIX" "$(dirname "$LOCK")/NextLockPerfFix.dylib"
          cp "$PLIST" "$(dirname "$LOCK")/NextLockPerfFix.plist"
          test "$ORIG" = "$(shasum -a 256 "$LOCK"|awk '{print $1}')"
          python3 - "$STAGE" <<'PY'
          from pathlib import Path
          import plistlib,re,sys
          s=Path(sys.argv[1]); b=s/'Library/PreferenceBundles/LockGlyphTimePrefs.bundle'
          for i in range(1,5):
              p=b/f'PhotoFrame{i}.plist'
              with p.open('rb') as f:d=plistlib.load(f)
              items=[x for x in d['items'] if x.get('key')!=f'photoFrame{i}ContentMode']
              items.insert(4,{'PostNotification':'com.nextsolution.lockglyphtime/ReloadPrefs','cell':'PSLinkListCell','default':0,'defaults':'com.nextsolution.lockglyphtime','detail':'PSListItemsController','key':f'photoFrame{i}ContentMode','label':'Photo Display','validTitles':['Auto (Recommended)','Stretch','Full Photo','Cut / Crop'],'validValues':[0,1,2,3]})
              d['items']=items
              with p.open('wb') as f:plistlib.dump(d,f,fmt=plistlib.FMT_XML,sort_keys=False)
          c=s/'DEBIAN/control'; t=c.read_text(); t=re.sub(r'^Version: .*$', 'Version: 1.1.5~cpu8',t,flags=re.M); c.write_text(t)
          PY
          OUTDEB="$OUT/NextLock_1.1.5_CPUFix_Test8_FullFeatures_RootHide.deb"
          dpkg-deb -b "$STAGE" "$OUTDEB"
          X=$(mktemp -d); dpkg-deb -x "$OUTDEB" "$X"
          F=$(find "$X" -name NextLockPerfFix.dylib -print -quit); P2=$(find "$X" -name NextLockPerfFix.plist -print -quit)
          strings -a "$F"|grep -q 'preserve-all-style skip-callback-photo refined-full-picker'
          strings -a "$F"|grep -q 'Test8 full-photo no-crop picker installed'
          plutil -p "$P2"|grep -q 'com.apple.Preferences'
          test "$(dpkg-deb -f "$OUTDEB" Version)" = '1.1.5~cpu8'
          SHA=$(shasum -a 256 "$OUTDEB"|awk '{print $1}')
          echo "OUTDEB=$OUTDEB" >> "$GITHUB_ENV"; echo "OUT_SHA=$SHA" >> "$GITHUB_ENV"

      - name: Publish to NS Transfer
        shell: bash
        run: |
          set -euo pipefail
          D='transfer/files/NextLock/1.1.5-CPUFix-Test8-FullFeatures'
          F="$D/NextLock_1.1.5_CPUFix_Test8_FullFeatures_RootHide.deb"
          mkdir -p "$D"; cp "$OUTDEB" "$F"
          export OUT_SHA
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          from datetime import datetime,timezone
          p=Path('transfer/index.json'); d=json.loads(p.read_text())
          files=[x for x in d.get('files',[]) if not x.get('id','').startswith('nextlock-1.1.5-cpufix-test')]
          e={'id':'nextlock-1.1.5-cpufix-test8-fullfeatures-roothide','name':'NextLock 1.1.5 CPU Fix Test 8 Full Features RootHide','fileName':'NextLock_1.1.5_CPUFix_Test8_FullFeatures_RootHide.deb','type':'deb','platform':'RootHide','version':'1.1.5-test8','url':'https://nextjailbreak.com/transfer/files/NextLock/1.1.5-CPUFix-Test8-FullFeatures/NextLock_1.1.5_CPUFix_Test8_FullFeatures_RootHide.deb','sha256':os.environ['OUT_SHA'],'notes':'Test 8 restores time/date position, color, font weight, style, glow and shadow by preserving the live styling callback. Only the redundant photo-render call inside that callback is skipped. The refined picker is injected into Settings so selection keeps the whole uncropped photo; Auto, Stretch, Full Photo and Cut/Crop are chosen later per frame.'}
          d['files']=[e]+files; d['updatedAt']=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'); p.write_text(json.dumps(d,indent=2)+'\n')
          PY
          git config user.name 'Next Jailbreak Build Bot'; git config user.email 'actions@users.noreply.github.com'
          git add "$F" transfer/index.json
          git commit -m 'Publish NextLock 1.1.5 CPU Fix Test 8 full features'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
