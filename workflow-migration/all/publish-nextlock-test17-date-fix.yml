name: Build and Publish NextLock 1.1.5 Test 17 Date Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-nextlock-test17-date-fix.yml'
      - 'source/NextLockDateFix17/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-nextlock-1.1.5-test17-date-fix
  cancel-in-progress: false

jobs:
  build-publish:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: brew install dpkg ldid

      - name: Validate Test 17 source
        shell: bash
        run: |
          set -euo pipefail
          SRC='source/NextLockDateFix17/Tweak.m'
          grep -q '1.1.5-test17 prominent-subtitle-container-date-fix' "$SRC"
          grep -q 'CSProminentSubtitleView' "$SRC"
          grep -q 'CSProminentSubtitleDateView' "$SRC"
          grep -q 'compactDateView' "$SRC"
          grep -q '_updateLabel' "$SRC"
          ! grep -q 'UIApplication.sharedApplication.windows' "$SRC"
          ! grep -q 'NLDescendants' "$SRC"
          ! grep -q 'dispatch_source_create' "$SRC"

      - name: Build RootHide Test 17 date runtime
        shell: bash
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/source/NextLockDateFix17"
          T="$RUNNER_TEMP/theos-rh"
          git init "$T"
          git -C "$T" remote add origin https://github.com/roothide/theos.git
          git -C "$T" fetch --depth 1 origin 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$T" checkout --detach 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$T" submodule update --init --recursive --depth 1
          export THEOS="$T"
          export THEOS_PACKAGE_SCHEME=roothide
          rm -rf "$P/.theos" "$P/packages"
          make -C "$P" clean package FINALPACKAGE=1
          D=$(find "$P/packages" -type f -name '*.deb' -print -quit)
          test -n "$D"
          X=$(mktemp -d)
          dpkg-deb -x "$D" "$X"
          F=$(find "$X" -name NextLockDateFix17.dylib -print -quit)
          test -n "$F"
          strings -a "$F" | grep -q '1.1.5-test17 prominent-subtitle-container-date-fix'
          strings -a "$F" | grep -q 'CSProminentSubtitleView'
          strings -a "$F" | grep -q 'CSProminentSubtitleDateView'
          strings -a "$F" | grep -q 'compactDateView'
          lipo -info "$F" | grep -q arm64e
          echo "DATE_DEB=$D" >> "$GITHUB_ENV"

      - name: Integrate into exact Test 16 package
        shell: bash
        run: |
          set -euo pipefail
          BASE='transfer/files/NextLock/1.1.5-Test16-SystemTimeDate/NextLock_1.1.5_Test16_SystemTimeDate_RootHide.deb'
          test -f "$BASE"
          test "$(shasum -a 256 "$BASE" | awk '{print $1}')" = '96f298ec2ffb783a14626e37f5f038b329a7292a92870f8a5a54010a45971d35'

          STAGE="$RUNNER_TEMP/nextlock-test17"
          FIX="$RUNNER_TEMP/datefix17"
          OUT="$RUNNER_TEMP/out"
          mkdir -p "$OUT"
          dpkg-deb -R "$BASE" "$STAGE"
          dpkg-deb -x "$DATE_DEB" "$FIX"

          LOCK=$(find "$STAGE" -name LockGlyphTime.dylib -print -quit)
          PERF=$(find "$STAGE" -name NextLockPerfFix.dylib -print -quit)
          CLOCK=$(find "$STAGE" -name NextLockCustomClock.dylib -print -quit)
          HIDE=$(find "$STAGE" -name NextLockHideElements.dylib -print -quit)
          NEW=$(find "$FIX" -name NextLockDateFix17.dylib -print -quit)
          NEWPLIST=$(find "$FIX" -name NextLockDateFix17.plist -print -quit)
          test -n "$LOCK"; test -n "$PERF"; test -n "$CLOCK"; test -n "$HIDE"
          test -n "$NEW"; test -n "$NEWPLIST"

          LOCK_SHA=$(shasum -a 256 "$LOCK" | awk '{print $1}')
          PERF_SHA=$(shasum -a 256 "$PERF" | awk '{print $1}')
          CLOCK_SHA=$(shasum -a 256 "$CLOCK" | awk '{print $1}')
          HIDE_SHA=$(shasum -a 256 "$HIDE" | awk '{print $1}')

          cp "$NEW" "$(dirname "$HIDE")/NextLockDateFix17.dylib"
          cp "$NEWPLIST" "$(dirname "$HIDE")/NextLockDateFix17.plist"

          python3 - "$STAGE" <<'PY'
          from pathlib import Path
          import re,sys
          c=Path(sys.argv[1])/'DEBIAN/control'
          t=c.read_text()
          t=re.sub(r'^Version: .*$', 'Version: 1.1.5~cpu17', t, flags=re.M)
          desc=('Description: NextLock 1.1.5 Test 17. Keeps Test 16 unchanged and adds a date-only iOS 16 fix that hides the native CSProminentSubtitleView container, including normal and compact date variants, while leaving NextLock custom time/date untouched.')
          t=re.sub(r'^Description: .*$', desc, t, flags=re.M) if re.search(r'^Description: .*$',t,re.M) else t+'\n'+desc+'\n'
          c.write_text(t)
          PY

          OUTDEB="$OUT/NextLock_1.1.5_Test17_DateFix_RootHide.deb"
          dpkg-deb -b "$STAGE" "$OUTDEB"
          test "$(dpkg-deb -f "$OUTDEB" Package)" = 'com.nextsolution.lockglyphtime'
          test "$(dpkg-deb -f "$OUTDEB" Version)" = '1.1.5~cpu17'

          X=$(mktemp -d)
          dpkg-deb -x "$OUTDEB" "$X"
          LOCK2=$(find "$X" -name LockGlyphTime.dylib -print -quit)
          PERF2=$(find "$X" -name NextLockPerfFix.dylib -print -quit)
          CLOCK2=$(find "$X" -name NextLockCustomClock.dylib -print -quit)
          HIDE2=$(find "$X" -name NextLockHideElements.dylib -print -quit)
          FIX2=$(find "$X" -name NextLockDateFix17.dylib -print -quit)
          test "$(shasum -a 256 "$LOCK2" | awk '{print $1}')" = "$LOCK_SHA"
          test "$(shasum -a 256 "$PERF2" | awk '{print $1}')" = "$PERF_SHA"
          test "$(shasum -a 256 "$CLOCK2" | awk '{print $1}')" = "$CLOCK_SHA"
          test "$(shasum -a 256 "$HIDE2" | awk '{print $1}')" = "$HIDE_SHA"
          strings -a "$FIX2" | grep -q '1.1.5-test17 prominent-subtitle-container-date-fix'
          strings -a "$FIX2" | grep -q 'CSProminentSubtitleView'

          RP="$X/Library/PreferenceBundles/LockGlyphTimePrefs.bundle/Root.plist"
          for K in hideLockScreenTime hideLockScreenDate hideLockScreenCamera hideLockScreenFlashlight hideLockScreenStatusBar hideLockScreenOtherText hideLockScreenBars; do
            plutil -p "$RP" | grep -q "$K"
          done

          SHA=$(shasum -a 256 "$OUTDEB" | awk '{print $1}')
          echo "OUTDEB=$OUTDEB" >> "$GITHUB_ENV"
          echo "OUT_SHA=$SHA" >> "$GITHUB_ENV"
          echo "Test 17 SHA-256: $SHA"

      - name: Publish Test 17 to NS Transfer
        shell: bash
        run: |
          set -euo pipefail
          DEST_DIR='transfer/files/NextLock/1.1.5-Test17-DateFix'
          DEST="$DEST_DIR/NextLock_1.1.5_Test17_DateFix_RootHide.deb"
          mkdir -p "$DEST_DIR"
          cp "$OUTDEB" "$DEST"
          test "$(shasum -a 256 "$DEST" | awk '{print $1}')" = "$OUT_SHA"
          export OUT_SHA

          python3 - <<'PY'
          import json,os
          from pathlib import Path
          from datetime import datetime,timezone
          p=Path('transfer/index.json')
          data=json.loads(p.read_text())
          files=[]
          for x in data.get('files',[]):
              ident=x.get('id','')
              if ident.startswith('nextlock-1.1.5-test16') or ident.startswith('nextlock-1.1.5-test17'):
                  continue
              files.append(x)
          entry={
            'id':'nextlock-1.1.5-test17-date-fix-roothide',
            'name':'NextLock 1.1.5 Test 17 Date Fix RootHide',
            'fileName':'NextLock_1.1.5_Test17_DateFix_RootHide.deb',
            'type':'deb','platform':'RootHide','version':'1.1.5-test17',
            'url':'https://nextjailbreak.com/transfer/files/NextLock/1.1.5-Test17-DateFix/NextLock_1.1.5_Test17_DateFix_RootHide.deb',
            'sha256':os.environ['OUT_SHA'],
            'notes':'Test 17 keeps every Test 16 runtime unchanged and adds a date-only native iOS 16 fix. Hide Date now targets CSProminentSubtitleView, which owns the normal and compact Apple date views, while the custom NextLock date remains untouched.'
          }
          data['files']=[entry]+files
          data['updatedAt']=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY

          git config user.name 'Next Jailbreak Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add "$DEST" transfer/index.json
          git diff --cached --check
          git commit -m 'Publish NextLock 1.1.5 Test 17 Date Fix'
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Upload Test 17 package
        uses: actions/upload-artifact@v4
        with:
          name: NextLock-Test17-DateFix-RootHide
          path: ${{ env.OUTDEB }}
          if-no-files-found: error
          retention-days: 14
