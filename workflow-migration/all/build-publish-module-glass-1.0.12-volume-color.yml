name: Build and Publish Module Glass 1.0.12 Volume Icon Color

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-publish-module-glass-1.0.12-volume-color.yml'

permissions:
  contents: write

concurrency:
  group: nextsolution-module-glass-volume-color
  cancel-in-progress: false

jobs:
  build-validate-publish:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install packaging tools
        run: brew install dpkg ldid xz zstd

      - name: Install pinned RootHide Theos
        shell: bash
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/theos-roothide"
          git init "$T"
          git -C "$T" remote add origin https://github.com/roothide/theos.git
          git -C "$T" fetch --depth 1 origin 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$T" checkout --detach 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$T" submodule update --init --recursive --depth 1

      - name: Patch working Volume runtime with icon tint only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('source/ModuleGlass/Tweak.m')
          t = p.read_text()

          def one(old, new, label):
              global t
              n = t.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              t = t.replace(old, new, 1)

          one(
              'static char MGVolumeOriginalAlphaKey;\n',
              'static char MGVolumeOriginalAlphaKey;\nstatic char MGVolumeOriginalIconImageKey;\nstatic char MGVolumeOriginalIconTintKey;\n',
              'associated keys')

          marker = '''static void MGRemoveTaggedImages(UIView *root, UIView *except) {'''
          helpers = r'''static UIColor *MGVolumeColorFromHex(NSString *input) {
              if (![input isKindOfClass:NSString.class]) return nil;
              NSString *hex = [[input stringByTrimmingCharactersInSet:NSCharacterSet.whitespaceAndNewlineCharacterSet] uppercaseString];
              if ([hex hasPrefix:@"#"]) hex = [hex substringFromIndex:1];
              if (hex.length != 6 && hex.length != 8) return nil;
              unsigned int value = 0;
              if (![[NSScanner scannerWithString:hex] scanHexInt:&value]) return nil;
              CGFloat r, g, b, a = 1.0;
              if (hex.length == 8) {
                  r = ((value >> 24) & 0xFF) / 255.0;
                  g = ((value >> 16) & 0xFF) / 255.0;
                  b = ((value >> 8) & 0xFF) / 255.0;
                  a = (value & 0xFF) / 255.0;
              } else {
                  r = ((value >> 16) & 0xFF) / 255.0;
                  g = ((value >> 8) & 0xFF) / 255.0;
                  b = (value & 0xFF) / 255.0;
              }
              return [UIColor colorWithRed:r green:g blue:b alpha:a];
          }

          static void MGRestoreVolumeIconTint(UIView *root) {
              if (!root) return;
              if ([root isKindOfClass:UIImageView.class]) {
                  UIImageView *imageView = (UIImageView *)root;
                  UIImage *originalImage = objc_getAssociatedObject(imageView, &MGVolumeOriginalIconImageKey);
                  if (originalImage) {
                      imageView.image = originalImage;
                      id originalTint = objc_getAssociatedObject(imageView, &MGVolumeOriginalIconTintKey);
                      imageView.tintColor = [originalTint isKindOfClass:UIColor.class] ? originalTint : nil;
                      objc_setAssociatedObject(imageView, &MGVolumeOriginalIconImageKey, nil, OBJC_ASSOCIATION_RETAIN_NONATOMIC);
                      objc_setAssociatedObject(imageView, &MGVolumeOriginalIconTintKey, nil, OBJC_ASSOCIATION_RETAIN_NONATOMIC);
                  }
              }
              for (UIView *child in root.subviews) MGRestoreVolumeIconTint(child);
          }

          static NSInteger MGVolumeIconScore(UIImageView *imageView, UIView *slider) {
              if (!imageView || !slider || imageView.tag == MGImageTag || !imageView.image || imageView.hidden || imageView.alpha < 0.01) return -1;
              CGRect rect = [imageView convertRect:imageView.bounds toView:slider];
              CGFloat w = CGRectGetWidth(rect), h = CGRectGetHeight(rect);
              if (w < 8.0 || h < 8.0 || w > 64.0 || h > 64.0) return -1;
              CGFloat area = w * h;
              NSInteger score = 1000 - (NSInteger)fabs(area - 576.0);
              score += 800;
              CGFloat cy = CGRectGetMidY(rect);
              if (cy > CGRectGetHeight(slider.bounds) * 0.45) score += 600;
              NSString *names = @"";
              UIView *cursor = imageView;
              for (NSInteger i = 0; i < 4 && cursor; i++, cursor = cursor.superview) {
                  names = [names stringByAppendingFormat:@" %@", NSStringFromClass(cursor.class).lowercaseString ?: @""];
              }
              for (NSString *needle in @[@"glyph", @"speaker", @"volume", @"audio", @"icon"]) {
                  if ([names containsString:needle]) score += 3000;
              }
              return score;
          }

          static void MGCollectVolumeIconCandidates(UIView *root, UIView *slider, NSMutableArray<UIImageView *> *out) {
              if (!root) return;
              if ([root isKindOfClass:UIImageView.class] && root.tag != MGImageTag) {
                  UIImageView *iv = (UIImageView *)root;
                  if (MGVolumeIconScore(iv, slider) >= 0) [out addObject:iv];
              }
              for (UIView *child in root.subviews) MGCollectVolumeIconCandidates(child, slider, out);
          }

          static UIImageView *MGFindVolumeIcon(UIView *slider) {
              if (!slider) return nil;
              NSMutableArray<UIImageView *> *candidates = [NSMutableArray array];
              MGCollectVolumeIconCandidates(slider, slider, candidates);
              UIImageView *best = nil;
              NSInteger bestScore = -1;
              for (UIImageView *candidate in candidates) {
                  NSInteger score = MGVolumeIconScore(candidate, slider);
                  if (score > bestScore) { best = candidate; bestScore = score; }
              }
              return best;
          }

          static BOOL MGApplyVolumeIconTint(UIView *slider, UIColor *color, NSString **outClass, CGRect *outFrame) {
              if (!slider || !color) return NO;
              UIImageView *icon = MGFindVolumeIcon(slider);
              if (!icon || !icon.image) return NO;
              if (!objc_getAssociatedObject(icon, &MGVolumeOriginalIconImageKey)) {
                  objc_setAssociatedObject(icon, &MGVolumeOriginalIconImageKey, icon.image, OBJC_ASSOCIATION_RETAIN_NONATOMIC);
                  objc_setAssociatedObject(icon, &MGVolumeOriginalIconTintKey, icon.tintColor ?: (id)NSNull.null, OBJC_ASSOCIATION_RETAIN_NONATOMIC);
              }
              icon.image = [icon.image imageWithRenderingMode:UIImageRenderingModeAlwaysTemplate];
              icon.tintColor = color;
              if (outClass) *outClass = NSStringFromClass(icon.class) ?: @"UIImageView";
              if (outFrame) *outFrame = [icon convertRect:icon.bounds toView:slider];
              return YES;
          }

          static void MGRemoveTaggedImages(UIView *root, UIView *except) {'''
          one(marker, helpers, 'volume icon helpers')

          one(
              '    NSString *slot = MGSlotForController(controller, &candidates);\n    MGRestoreVolumeVisuals(root);\n',
              '    NSString *slot = MGSlotForController(controller, &candidates);\n    MGRestoreVolumeIconTint(root);\n    MGRestoreVolumeVisuals(root);\n',
              'restore icon')

          old = '''    if (!enabled || !exists) {
                  MGRemoveTaggedImages(root, nil);
                  NSString *sig = [NSString stringWithFormat:@"inactive|%@|%d|%d", slot, enabled, exists];
                  MGDiagnosticOnce(controller, sig, [NSString stringWithFormat:@"apply source=%@ controller=%@ slot=%@ enabled=%d exists=%d expanded=0 result=removed", source, NSStringFromClass([controller class]), slot, enabled, exists]);
                  return;
              }
          '''
          new = '''    BOOL volumeIconApplied = NO;
              NSString *volumeIconClass = @"<none>";
              CGRect volumeIconFrame = CGRectZero;
              BOOL volumeIconColorEnabled = [slot isEqualToString:@"volume"] && MGBoolPreference(@"CCModuleVolumeIconColorEnabled", NO);
              NSString *volumeIconColorHex = [[MGPreference(@"CCModuleVolumeIconColor") description] copy] ?: @"";
              if (volumeIconColorEnabled) {
                  UIView *volumeSlider = MGFindSliderView(root);
                  UIColor *volumeColor = MGVolumeColorFromHex(volumeIconColorHex);
                  if (volumeSlider && volumeColor) {
                      volumeIconApplied = MGApplyVolumeIconTint(volumeSlider, volumeColor, &volumeIconClass, &volumeIconFrame);
                  }
              }

              if (!enabled || !exists) {
                  MGRemoveTaggedImages(root, nil);
                  NSString *sig = [NSString stringWithFormat:@"inactive|%@|%d|%d|icon=%d|%@", slot, enabled, exists, volumeIconApplied, volumeIconColorHex];
                  MGDiagnosticOnce(controller, sig, [NSString stringWithFormat:@"apply source=%@ controller=%@ slot=%@ enabled=%d exists=%d expanded=0 result=removed volumeIconColorEnabled=%d volumeIconApplied=%d volumeIconColor=%@ volumeIconClass=%@ volumeIconFrame=%@", source, NSStringFromClass([controller class]), slot, enabled, exists, volumeIconColorEnabled, volumeIconApplied, volumeIconColorHex, volumeIconClass, NSStringFromCGRect(volumeIconFrame)]);
                  return;
              }
          '''
          one(old, new, 'compact icon application')

          one(
              'imageView=%@ volumeSuppressed=%lu suppressedClasses=%@ glowPref=%d glowIntensity=%.2f glowWidth=%.2f",\n                      source, NSStringFromClass([controller class]), candidates, slot, path, exists, enabled, imageView.image != nil, removeBlur, opacity, strategy, NSStringFromClass(root.class), NSStringFromCGRect(root.frame), NSStringFromClass(parent.class), anchor ? NSStringFromClass(anchor.class) : @"<none>", anchor ? NSStringFromCGRect(anchor.frame) : @"<none>", cornerSource.layer.cornerRadius, NSStringFromCGRect(imageView.frame), (unsigned long)parent.subviews.count, imageView, (unsigned long)volumeSuppressed, volumeSuppressedClasses, glow, glowIntensity, glowWidth]);',
              'imageView=%@ volumeSuppressed=%lu suppressedClasses=%@ volumeIconColorEnabled=%d volumeIconApplied=%d volumeIconColor=%@ volumeIconClass=%@ volumeIconFrame=%@ glowPref=%d glowIntensity=%.2f glowWidth=%.2f",\n                      source, NSStringFromClass([controller class]), candidates, slot, path, exists, enabled, imageView.image != nil, removeBlur, opacity, strategy, NSStringFromClass(root.class), NSStringFromCGRect(root.frame), NSStringFromClass(parent.class), anchor ? NSStringFromClass(anchor.class) : @"<none>", anchor ? NSStringFromCGRect(anchor.frame) : @"<none>", cornerSource.layer.cornerRadius, NSStringFromCGRect(imageView.frame), (unsigned long)parent.subviews.count, imageView, (unsigned long)volumeSuppressed, volumeSuppressedClasses, volumeIconColorEnabled, volumeIconApplied, volumeIconColorHex, volumeIconClass, NSStringFromCGRect(volumeIconFrame), glow, glowIntensity, glowWidth]);',
              'diagnostics')

          t = t.replace('ModuleGlassRuntime 1.0.7 Volume Test loaded', 'ModuleGlassRuntime 1.0.8 Volume Color loaded')
          t = t.replace('Volume-isolated image-first test runtime', 'Volume-isolated image-first runtime with native icon color')
          p.write_text(t)

          c = Path('source/ModuleGlass/control')
          ct = c.read_text()
          ct = re.sub(r'^Version: .*$', 'Version: 1.0.8', ct, flags=re.M)
          ct = re.sub(r'^Description: .*$', 'Description: Working isolated Module Glass Volume runtime with native speaker icon color customization and unchanged image-first background behavior.', ct, flags=re.M)
          c.write_text(ct)
          PY

          grep -q '^Version: 1.0.8$' source/ModuleGlass/control
          grep -q 'volume-image-first-test' source/ModuleGlass/Tweak.m
          grep -q 'CCModuleVolumeIconColorEnabled' source/ModuleGlass/Tweak.m
          grep -q 'MGApplyVolumeIconTint' source/ModuleGlass/Tweak.m
          grep -q 'MGRestoreVolumeIconTint(root)' source/ModuleGlass/Tweak.m
          ! grep -q 'brightness-image-first-test' source/ModuleGlass/Tweak.m

      - name: Build Module Glass Runtime 1.0.8
        shell: bash
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/source/ModuleGlass"
          OUT="$RUNNER_TEMP/release"
          STAGE="$RUNNER_TEMP/runtime-stage"
          export THEOS="$RUNNER_TEMP/theos-roothide"
          export THEOS_PACKAGE_SCHEME=roothide
          mkdir -p "$OUT"
          rm -rf "$P/.theos" "$P/packages" "$STAGE"
          make -C "$P" clean package FINALPACKAGE=1
          DEB=$(find "$P/packages" -type f -name '*.deb' -print -quit)
          test -n "$DEB"
          dpkg-deb -R "$DEB" "$STAGE"
          test -f "$STAGE/Library/MobileSubstrate/DynamicLibraries/CCModuleBackgrounds.dylib"
          cat > "$STAGE/DEBIAN/postinst" <<'SH'
          #!/bin/sh
          killall -9 SpringBoard 2>/dev/null || true
          exit 0
          SH
          chmod 0755 "$STAGE/DEBIAN/postinst"
          dpkg-deb -b "$STAGE" "$OUT/NextAura_Runtime_ccbackgrounds_1.0.8_RootHide.deb"

      - name: Build native Settings color picker extension
        shell: bash
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/source/ModuleGlassPrefsExtension"
          export THEOS="$RUNNER_TEMP/theos-roothide"
          export THEOS_PACKAGE_SCHEME=roothide
          rm -rf "$P/.theos" "$P/packages"
          make -C "$P" clean package FINALPACKAGE=1
          DEB=$(find "$P/packages" -type f -name '*.deb' -print -quit)
          test -n "$DEB"
          rm -rf "$RUNNER_TEMP/prefs-ext"
          dpkg-deb -R "$DEB" "$RUNNER_TEMP/prefs-ext"
          test -f "$RUNNER_TEMP/prefs-ext/Library/MobileSubstrate/DynamicLibraries/ModuleGlassPrefsExtension.dylib"
          test -f "$RUNNER_TEMP/prefs-ext/Library/MobileSubstrate/DynamicLibraries/ModuleGlassPrefsExtension.plist"

      - name: Build Aura Preferences Runtime 1.0.5 with Volume picker
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/release"
          STAGE="$RUNNER_TEMP/prefs-stage"
          rm -rf "$STAGE"
          dpkg-deb -R debfiles/NextAura_Runtime_preferences_1.0.4_RootHide.deb "$STAGE"
          mkdir -p "$STAGE/Library/MobileSubstrate/DynamicLibraries"
          cp "$RUNNER_TEMP/prefs-ext/Library/MobileSubstrate/DynamicLibraries/ModuleGlassPrefsExtension.dylib" "$STAGE/Library/MobileSubstrate/DynamicLibraries/"
          cp "$RUNNER_TEMP/prefs-ext/Library/MobileSubstrate/DynamicLibraries/ModuleGlassPrefsExtension.plist" "$STAGE/Library/MobileSubstrate/DynamicLibraries/"

          python3 - "$STAGE" <<'PY'
          from pathlib import Path
          import plistlib, re, sys
          root=Path(sys.argv[1])
          control=root/'DEBIAN/control'
          t=control.read_text()
          t=re.sub(r'^Version: .*$', 'Version: 1.0.5', t, flags=re.M)
          m=re.search(r'^Depends: (.*)$', t, re.M)
          if not m: raise SystemExit('Depends missing')
          deps=m.group(1)
          if 'mobilesubstrate' not in deps:
              t=t.replace(m.group(0), 'Depends: '+deps+', mobilesubstrate')
          t=re.sub(r'^Description: .*$', 'Description: Internal native category Preferences controller shared by modular tweaks, with native Module Glass Volume icon color picker.', t, flags=re.M)
          control.write_text(t)

          plist=root/'Library/PreferenceBundles/AuraPrefs.bundle/CCModuleBackgrounds.plist'
          with plist.open('rb') as f: data=plistlib.load(f)
          items=data['items']
          items=[x for x in items if x.get('key') not in {'CCModuleVolumeIconColorEnabled'} and x.get('action')!='chooseVolumeIconColor:']
          idx=next((i for i,x in enumerate(items) if x.get('moduleSlot')=='volume'), None)
          if idx is None: raise SystemExit('Volume background row missing')
          switch={
            'PostNotification':'com.nextsolution.unlockvibrate/preferences.changed',
            'cell':'PSSwitchCell','default':False,'defaults':'com.nextsolution.unlockvibrate',
            'description':'Keeps the working Volume background unchanged and applies your chosen color only to the native speaker glyph.',
            'key':'CCModuleVolumeIconColorEnabled','label':'Custom Volume Icon Color'
          }
          picker={
            'action':'chooseVolumeIconColor:','cell':'PSButtonCell',
            'description':'Opens the native iOS color picker. Choosing a color automatically enables the custom Volume icon color.',
            'label':'Volume Icon Color'
          }
          items[idx+1:idx+1]=[switch,picker]
          data['items']=items
          with plist.open('wb') as f: plistlib.dump(data,f,fmt=plistlib.FMT_XML,sort_keys=False)
          PY

          grep -q '^Version: 1.0.5$' "$STAGE/DEBIAN/control"
          grep -q 'mobilesubstrate' "$STAGE/DEBIAN/control"
          plutil -lint "$STAGE/Library/PreferenceBundles/AuraPrefs.bundle/CCModuleBackgrounds.plist"
          grep -q 'CCModuleVolumeIconColorEnabled' "$STAGE/Library/PreferenceBundles/AuraPrefs.bundle/CCModuleBackgrounds.plist"
          grep -q 'chooseVolumeIconColor:' "$STAGE/Library/PreferenceBundles/AuraPrefs.bundle/CCModuleBackgrounds.plist"
          if [ -f "$STAGE/DEBIAN/postinst" ]; then
            sed -i '' '/^[[:space:]]*exit[[:space:]]\+0[[:space:]]*$/d' "$STAGE/DEBIAN/postinst" || true
          else
            printf '#!/bin/sh\n' > "$STAGE/DEBIAN/postinst"
          fi
          printf 'killall -9 Preferences 2>/dev/null || true\nexit 0\n' >> "$STAGE/DEBIAN/postinst"
          chmod 0755 "$STAGE/DEBIAN/postinst"
          dpkg-deb -b "$STAGE" "$OUT/NextAura_Runtime_preferences_1.0.5_RootHide.deb"

      - name: Build Module Glass 1.0.12 wrapper
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/release"
          STAGE="$RUNNER_TEMP/wrapper-stage"
          rm -rf "$STAGE"
          dpkg-deb -R debfiles/NextAura_cc_module_backgrounds_1.0.11_RootHide.deb "$STAGE"
          python3 - "$STAGE/DEBIAN/control" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); t=p.read_text()
          t=re.sub(r'^Version: .*$', 'Version: 1.0.12', t, flags=re.M)
          t=re.sub(r'com\.nextsolution\.nextaura\.runtime\.preferences \(>= [^)]+\)', 'com.nextsolution.nextaura.runtime.preferences (>= 1.0.5)', t)
          t=re.sub(r'com\.nextsolution\.nextaura\.runtime\.ccbackgrounds \(>= [^)]+\)', 'com.nextsolution.nextaura.runtime.ccbackgrounds (>= 1.0.8)', t)
          t=re.sub(r'^Description: .*$', 'Description: Working Volume image-first validation build with native speaker icon color picker; non-Volume rendering remains unchanged.', t, flags=re.M)
          p.write_text(t)
          PY
          grep -q '^Version: 1.0.12$' "$STAGE/DEBIAN/control"
          grep -q 'runtime.preferences (>= 1.0.5)' "$STAGE/DEBIAN/control"
          grep -q 'runtime.ccbackgrounds (>= 1.0.8)' "$STAGE/DEBIAN/control"
          dpkg-deb -b "$STAGE" "$OUT/NextAura_cc_module_backgrounds_1.0.12_RootHide.deb"

      - name: Validate all three packages
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/release"
          R="$OUT/NextAura_Runtime_ccbackgrounds_1.0.8_RootHide.deb"
          P="$OUT/NextAura_Runtime_preferences_1.0.5_RootHide.deb"
          M="$OUT/NextAura_cc_module_backgrounds_1.0.12_RootHide.deb"
          test "$(dpkg-deb -f "$R" Version)" = 1.0.8
          test "$(dpkg-deb -f "$P" Version)" = 1.0.5
          test "$(dpkg-deb -f "$M" Version)" = 1.0.12
          dpkg-deb -f "$M" Depends | grep -q 'runtime.preferences (>= 1.0.5)'
          dpkg-deb -f "$M" Depends | grep -q 'runtime.ccbackgrounds (>= 1.0.8)'

          X=$(mktemp -d)
          dpkg-deb -x "$R" "$X/r"
          D="$X/r/Library/MobileSubstrate/DynamicLibraries/CCModuleBackgrounds.dylib"
          lipo -info "$D" | grep -q arm64
          lipo -info "$D" | grep -q arm64e
          strings -a "$D" | grep -q 'ModuleGlassRuntime 1.0.8 Volume Color loaded'
          strings -a "$D" | grep -q 'volume-image-first-test'
          strings -a "$D" | grep -q 'CCModuleVolumeIconColorEnabled'
          strings -a "$D" | grep -q 'CCModuleVolumeIconColor'
          strings -a "$D" | grep -q 'volumeIconApplied'

          dpkg-deb -x "$P" "$X/p"
          E="$X/p/Library/MobileSubstrate/DynamicLibraries/ModuleGlassPrefsExtension.dylib"
          test -f "$E"
          lipo -info "$E" | grep -q arm64
          lipo -info "$E" | grep -q arm64e
          strings -a "$E" | grep -q 'AuraCategoryListController'
          strings -a "$E" | grep -q 'chooseVolumeIconColor:'
          strings -a "$E" | grep -q 'CCModuleVolumeIconColor'
          strings -a "$E" | grep -q 'UIColorPickerViewController'
          grep -q 'CCModuleVolumeIconColorEnabled' "$X/p/Library/PreferenceBundles/AuraPrefs.bundle/CCModuleBackgrounds.plist"
          grep -q 'chooseVolumeIconColor:' "$X/p/Library/PreferenceBundles/AuraPrefs.bundle/CCModuleBackgrounds.plist"
          rm -rf "$X"
          shasum -a 256 "$R" "$P" "$M"

      - name: Sync latest main while preserving tested source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Next Jailbreak Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase --autostash origin main
          grep -q '^Version: 1.0.8$' source/ModuleGlass/control
          grep -q 'CCModuleVolumeIconColorEnabled' source/ModuleGlass/Tweak.m

      - name: Publish packages and refresh repo indexes
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/release"
          SCAN="$RUNNER_TEMP/scan"
          mkdir -p debfiles "$SCAN"
          cp "$OUT/NextAura_Runtime_ccbackgrounds_1.0.8_RootHide.deb" debfiles/
          cp "$OUT/NextAura_Runtime_preferences_1.0.5_RootHide.deb" debfiles/
          cp "$OUT/NextAura_cc_module_backgrounds_1.0.12_RootHide.deb" debfiles/
          cp "$OUT"/*.deb "$SCAN/"

          dpkg-scanpackages -m "$SCAN" /dev/null > "$RUNNER_TEMP/stanzas"
          python3 - "$RUNNER_TEMP/stanzas" <<'PY'
          from pathlib import Path
          import os,re,sys
          s=Path(sys.argv[1])
          lines=[]
          for line in s.read_text().splitlines():
              if line.startswith('Filename: '): line='Filename: ./debfiles/'+os.path.basename(line.split(': ',1)[1])
              lines.append(line)
          s.write_text('\n'.join(lines)+'\n')
          ids={
            'com.nextsolution.nextaura.runtime.ccbackgrounds',
            'com.nextsolution.nextaura.runtime.preferences',
            'com.nextsolution.nextaura.cc-module-backgrounds'
          }
          pkg=Path('Packages')
          rows=[x.strip() for x in re.split(r'\n\s*\n',pkg.read_text()) if x.strip()]
          def pid(row):
              m=re.search(r'^Package: (.+)$',row,re.M); return m.group(1).strip() if m else ''
          rows=[r for r in rows if pid(r) not in ids]
          new=[x.strip() for x in re.split(r'\n\s*\n',s.read_text()) if x.strip()]
          pkg.write_text('\n\n'.join(rows+new)+'\n')
          PY

          test "$(grep -c '^Package: com.nextsolution.nextaura.cc-module-backgrounds$' Packages)" -eq 1
          test "$(grep -c '^Package: com.nextsolution.nextaura.runtime.ccbackgrounds$' Packages)" -eq 1
          test "$(grep -c '^Package: com.nextsolution.nextaura.runtime.preferences$' Packages)" -eq 1
          grep -A18 '^Package: com.nextsolution.nextaura.cc-module-backgrounds$' Packages | grep -q '^Version: 1.0.12$'
          grep -A18 '^Package: com.nextsolution.nextaura.runtime.ccbackgrounds$' Packages | grep -q '^Version: 1.0.8$'
          grep -A18 '^Package: com.nextsolution.nextaura.runtime.preferences$' Packages | grep -q '^Version: 1.0.5$'

          gzip -9 -c Packages > Packages.gz
          bzip2 -9 -c Packages > Packages.bz2
          xz -9e -c Packages > Packages.xz
          zstd -19 -q -c Packages > Packages.zst
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import re
          p=Path('Release'); t=p.read_text()
          m=re.search(r'^Version:\s*(\d+)\.(\d+)\.(\d+)\s*$',t,re.M)
          if m:
              a,b,c=map(int,m.groups()); t=re.sub(r'^Version: .*$',f'Version: {a}.{b}.{c+1}',t,flags=re.M)
          t=re.sub(r'^Date: .*$', 'Date: '+datetime.now(timezone.utc).strftime('%a, %d %b %Y %H:%M:%S UTC'), t, flags=re.M)
          p.write_text(t)
          PY

          git add source/ModuleGlass/Tweak.m source/ModuleGlass/control source/ModuleGlassPrefsExtension \
            debfiles/NextAura_Runtime_ccbackgrounds_1.0.8_RootHide.deb \
