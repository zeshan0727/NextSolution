name: Publish Module Glass 1.1.17 to NS Transfer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-moduleglass-1.1.17-transfer.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARTIFACT_ID: '9399651948'
      DEST_DIR: transfer/files/ModuleGlass/1.1.17
      DEST_FILE: ModuleGlass_1.1.17_SelfContainedPrefs_RootHide.deb
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download exact verified-build artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/moduleglass117.zip
          rm -rf /tmp/moduleglass117
          mkdir -p /tmp/moduleglass117
          unzip -q /tmp/moduleglass117.zip -d /tmp/moduleglass117
          test -f "/tmp/moduleglass117/${DEST_FILE}"

      - name: Verify package before publishing
        shell: bash
        run: |
          set -euo pipefail
          DEB="/tmp/moduleglass117/${DEST_FILE}"
          test "$(dpkg-deb -f "$DEB" Package)" = 'com.nextsolution.nextaura.cc-module-backgrounds'
          test "$(dpkg-deb -f "$DEB" Version)" = '1.1.17'
          test "$(dpkg-deb -f "$DEB" Architecture)" = 'iphoneos-arm64e'
          DEPENDS="$(dpkg-deb -f "$DEB" Depends)"
          [[ "$DEPENDS" == *'preferenceloader'* ]]
          [[ "$DEPENDS" != *'com.nextsolution.nextaura.runtime.preferences'* ]]

          rm -rf /tmp/mgcheck
          mkdir -p /tmp/mgcheck
          dpkg-deb -x "$DEB" /tmp/mgcheck
          test -f /tmp/mgcheck/Library/MobileSubstrate/DynamicLibraries/CCModuleBackgrounds.dylib
          test -f /tmp/mgcheck/Library/MobileSubstrate/DynamicLibraries/ModuleGlassStandalonePrefsExtension.dylib
          test -f /tmp/mgcheck/Library/PreferenceBundles/ModuleGlassPrefs.bundle/AuraPrefs
          test -f /tmp/mgcheck/Library/PreferenceBundles/ModuleGlassPrefs.bundle/CCModuleBackgrounds.plist
          test -f /tmp/mgcheck/Library/PreferenceLoader/Preferences/NextAura-cc-module-backgrounds.plist

          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          root=Path('/tmp/mgcheck')
          with (root/'Library/PreferenceLoader/Preferences/NextAura-cc-module-backgrounds.plist').open('rb') as f:
              loader=plistlib.load(f)['entry']
          assert loader['bundle']=='ModuleGlassPrefs'
          assert loader['detail']=='AuraCategoryListController'
          assert loader['plist']=='CCModuleBackgrounds'
          with (root/'Library/PreferenceBundles/ModuleGlassPrefs.bundle/Info.plist').open('rb') as f:
              info=plistlib.load(f)
          assert info['CFBundleIdentifier']=='com.nextsolution.moduleglass.preferences'
          with (root/'Library/PreferenceBundles/ModuleGlassPrefs.bundle/CCModuleBackgrounds.plist').open('rb') as f:
              prefs=plistlib.load(f)
          text=repr(prefs)
          assert 'CCModuleVolumeIconColorEnabled' in text
          assert 'chooseVolumeIconColor:' in text
          PY

          strings /tmp/mgcheck/Library/PreferenceBundles/ModuleGlassPrefs.bundle/AuraPrefs | grep -Fq 'AuraCategoryListController'
          strings /tmp/mgcheck/Library/MobileSubstrate/DynamicLibraries/ModuleGlassStandalonePrefsExtension.dylib | grep -Fq 'chooseVolumeIconColor:'
          strings /tmp/mgcheck/Library/MobileSubstrate/DynamicLibraries/ModuleGlassStandalonePrefsExtension.dylib | grep -Fq 'UIColorPickerViewController'
          strings /tmp/mgcheck/Library/MobileSubstrate/DynamicLibraries/CCModuleBackgrounds.dylib | grep -Fq 'ModuleGlassRuntime 1.1.15 External Host Isolation Renderer'

      - name: Publish DEB and update NS Transfer feed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DEST_DIR"
          cp "/tmp/moduleglass117/${DEST_FILE}" "$DEST_DIR/$DEST_FILE"
          SHA="$(sha256sum "$DEST_DIR/$DEST_FILE" | awk '{print $1}')"
          test "$SHA" = 'a15205e928db116e74102a29d4b116d14d1b57f0e9412707493d8c109433ecb0'

          rm -f transfer/files/ModuleGlass/1.1.15-PrefsFix/ModuleGlass_1.1.15_PreferencesFix_Patch_RootHide.deb
          rmdir transfer/files/ModuleGlass/1.1.15-PrefsFix 2>/dev/null || true

          python3 - "$SHA" <<'PY'
          import json,sys
          from datetime import datetime,timezone
          from pathlib import Path
          p=Path('transfer/index.json')
          data=json.loads(p.read_text())
          old='moduleglass-1.1.15-preferences-fix-patch-roothide'
          new='moduleglass-1.1.17-self-contained-prefs-roothide'
          data['files']=[x for x in data.get('files',[]) if x.get('id') not in {old,new}]
          item={
            'id': new,
            'name': 'Module Glass 1.1.17',
            'fileName': 'ModuleGlass_1.1.17_SelfContainedPrefs_RootHide.deb',
            'type': 'deb',
            'platform': 'RootHide',
            'version': '1.1.17',
            'url': 'https://nextjailbreak.com/transfer/files/ModuleGlass/1.1.17/ModuleGlass_1.1.17_SelfContainedPrefs_RootHide.deb',
            'sha256': sys.argv[1],
            'notes': 'Full self-contained Module Glass package. Preserves the validated 1.1.15 External Host Isolation Control Center runtime and embeds the current Aura 1.0.5 Module Glass preferences, PreferenceLoader entry, image controls, glow controls and native Volume icon color picker directly in the same DEB.'
          }
          data['files'].insert(0,item)
          data['updatedAt']=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          p.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')
          PY

          python3 -m json.tool transfer/index.json >/dev/null
          grep -Fq 'moduleglass-1.1.17-self-contained-prefs-roothide' transfer/index.json
          ! grep -Fq 'moduleglass-1.1.15-preferences-fix-patch-roothide' transfer/index.json

      - name: Commit NS Transfer publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add transfer/index.json "$DEST_DIR/$DEST_FILE"
          git add -A transfer/files/ModuleGlass/1.1.15-PrefsFix || true
          git diff --cached --stat
          git commit -m 'Publish Module Glass 1.1.17 self-contained preferences'
          git push origin HEAD:main
