name: Build and Publish Next Mockup Studio 0.2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-publish-nextmockup-v02.yml'

permissions:
  contents: write

jobs:
  build-publish:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build crash-fixed TIPA
        shell: bash
        run: |
          set -euo pipefail
          SRC='applications/NextMockupStudio-Test/NextMockupStudio.m'
          BUILD="$RUNNER_TEMP/nextmockup-v02"
          APP="$BUILD/Payload/NextMockupStudio.app"
          OUT="$BUILD/NextMockupStudio-iPhone17ProMax-Test-v0.2.tipa"
          rm -rf "$BUILD"
          mkdir -p "$APP"

          cat > "$APP/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleDisplayName</key><string>Next Mockup</string>
            <key>CFBundleExecutable</key><string>NextMockupStudio</string>
            <key>CFBundleIdentifier</key><string>cc.nextsolution.nextmockup.test</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>NextMockupStudio</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.2</string>
            <key>CFBundleVersion</key><string>2</string>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>MinimumOSVersion</key><string>16.0</string>
            <key>NSPhotoLibraryUsageDescription</key><string>Select screenshots for device mockups.</string>
            <key>NSPhotoLibraryAddUsageDescription</key><string>Save exported mockups to Photos.</string>
            <key>UILaunchScreen</key><dict/>
            <key>UISupportedInterfaceOrientations</key><array><string>UIInterfaceOrientationPortrait</string></array>
            <key>UIRequiredDeviceCapabilities</key><array><string>arm64</string></array>
          </dict></plist>
          PLIST

          python3 -m pip install --quiet pillow
          APP_DIR="$APP" python3 - <<'PY'
          import os
          from PIL import Image, ImageDraw, ImageFilter
          out=os.environ['APP_DIR']; W,H=3000,6285
          finishes={
            'silver':((218,222,226,255),(114,120,128,255)),
            'orange':((239,145,86,255),(143,66,31,255)),
            'blue':((94,125,158,255),(31,53,80,255)),
          }
          for name,(light,dark) in finishes.items():
            img=Image.new('RGBA',(W,H),(0,0,0,0))
            sh=Image.new('RGBA',(W,H),(0,0,0,0)); sd=ImageDraw.Draw(sh)
            sd.rounded_rectangle((50,70,2950,6215),radius=245,fill=(0,0,0,145))
            sh=sh.filter(ImageFilter.GaussianBlur(35)); img=Image.alpha_composite(img,sh)
            d=ImageDraw.Draw(img)
            d.rounded_rectangle((38,50,2962,6235),radius=235,fill=dark,outline=light,width=28)
            d.rounded_rectangle((83,95,2917,6190),radius=210,fill=(8,9,12,255),outline=(235,238,241,150),width=8)
            # transparent screenshot window
            mask=Image.new('L',(W,H),0); md=ImageDraw.Draw(mask)
            md.rounded_rectangle((109,120,2891,6165),radius=190,fill=255)
            transparent=Image.new('RGBA',(W,H),(0,0,0,0))
            img.paste(transparent,(0,0),mask)
            # redraw Dynamic Island and controls after the opening
            d=ImageDraw.Draw(img)
            d.rounded_rectangle((1110,170,1890,390),radius=110,fill=(1,1,2,255))
            d.ellipse((1740,225,1850,335),fill=(12,15,20,255))
            d.rounded_rectangle((12,1030,48,1500),radius=15,fill=dark)
            d.rounded_rectangle((12,1650,48,2140),radius=15,fill=dark)
            d.rounded_rectangle((2952,1530,2988,2380),radius=15,fill=dark)
            img.save(os.path.join(out,f'iphone17promax_{name}.png'),optimize=True)
          PY

          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang \
            -arch arm64 -isysroot "$SDK" -miphoneos-version-min=16.0 \
            -fobjc-arc -O2 "$SRC" \
            -framework UIKit -framework Foundation -framework QuartzCore \
            -o "$APP/NextMockupStudio"

          chmod +x "$APP/NextMockupStudio"
          file "$APP/NextMockupStudio"
          (cd "$BUILD" && zip -qry "$OUT" Payload)
          test -s "$OUT"
          echo "TIPA_PATH=$OUT" >> "$GITHUB_ENV"
          echo "TIPA_SHA=$(shasum -a 256 "$OUT" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "TIPA_SIZE=$(stat -f%z "$OUT")" >> "$GITHUB_ENV"

      - name: Publish to NS Transfer
        shell: bash
        run: |
          set -euo pipefail
          DEST_DIR='transfer/files/NextMockupStudio/0.2'
          DEST="$DEST_DIR/NextMockupStudio-iPhone17ProMax-Test-v0.2.tipa"
          mkdir -p "$DEST_DIR"
          cp "$TIPA_PATH" "$DEST"
          export TIPA_SHA TIPA_SIZE
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone
          p=Path('transfer/index.json'); data=json.loads(p.read_text())
          ids={'nextmockupstudio-0.1-iphone17promax-test','nextmockupstudio-0.2-iphone17promax-test'}
          files=[x for x in data.get('files',[]) if x.get('id') not in ids]
          entry={
            'id':'nextmockupstudio-0.2-iphone17promax-test',
            'name':'Next Mockup Studio 0.2 — iPhone 17 Pro Max Test',
            'fileName':'NextMockupStudio-iPhone17ProMax-Test-v0.2.tipa',
            'type':'tipa','platform':'TrollStore / iOS 16+','version':'0.2',
            'url':'https://nextjailbreak.com/transfer/files/NextMockupStudio/0.2/NextMockupStudio-iPhone17ProMax-Test-v0.2.tipa',
            'sha256':os.environ['TIPA_SHA'],'sizeBytes':int(os.environ['TIPA_SIZE']),
            'notes':'Crash-fix test build. Replaced the experimental Objective-C runtime launch layer with normal UIKit Objective-C. Includes iPhone 17 Pro Max Silver, Cosmic Orange and Deep Blue, screenshot import, screen masking, background switching, scaling and PNG export.'
          }
          data['files']=[entry]+files
          data['updatedAt']=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
          python3 -m json.tool transfer/index.json >/dev/null
          test "$(shasum -a 256 "$DEST" | awk '{print $1}')" = "$TIPA_SHA"

      - name: Commit publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add transfer/files/NextMockupStudio/0.2/NextMockupStudio-iPhone17ProMax-Test-v0.2.tipa transfer/index.json
          git commit -m 'Publish Next Mockup Studio 0.2 crash fix to NS Transfer'
          git pull --rebase origin main
          git push origin HEAD:main
