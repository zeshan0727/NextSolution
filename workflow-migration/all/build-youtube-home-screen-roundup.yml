name: Build YouTube Home Screen roundup

on:
  workflow_dispatch:
  push:
    branches:
      - "agent/youtube-**"
    paths:
      - "video-production/top-home-screen-tweaks/**"
      - ".github/workflows/build-youtube-home-screen-roundup.yml"
      - "NextSolutionRepoIcon.png"

permissions:
  contents: read

concurrency:
  group: youtube-home-screen-roundup
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install render dependency
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Check encrypted OpenAI secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_API_KEY is not configured as an encrypted repository secret." >&2
            exit 1
          fi

      - name: Render narrated video package
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python3 video-production/top-home-screen-tweaks/build_video.py \
            --render \
            --output video-output/top-home-screen-tweaks

      - name: Validate output
        run: |
          test -s video-output/top-home-screen-tweaks/top-8-home-screen-tweaks-2026.mp4
          test -s video-output/top-home-screen-tweaks/thumbnail.png
          test -s video-output/top-home-screen-tweaks/captions.srt
          test -s video-output/top-home-screen-tweaks/shorts/youtube-shorts-metadata.json
          test "$(find video-output/top-home-screen-tweaks/shorts -maxdepth 1 -name '*.mp4' -type f | wc -l)" -eq 8
          test "$(find video-output/top-home-screen-tweaks/shorts/covers -maxdepth 1 -name '*.png' -type f | wc -l)" -eq 8
          for short in video-output/top-home-screen-tweaks/shorts/*.mp4; do
            dimensions="$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "${short}")"
            test "${dimensions}" = "1080x1920"
          done
          ffprobe -v error \
            -show_entries stream=codec_name,width,height \
            -show_entries format=duration,size \
            -of json \
            video-output/top-home-screen-tweaks/top-8-home-screen-tweaks-2026.mp4 \
            | tee video-output/top-home-screen-tweaks/ffprobe.json

      - name: Remove intermediate speech and render files
        run: |
          rm -f video-output/top-home-screen-tweaks/scene-*.aac
          rm -f video-output/top-home-screen-tweaks/scene-*.mp4
          rm -f video-output/top-home-screen-tweaks/joined.mp4
          rm -f video-output/top-home-screen-tweaks/concat.txt

      - name: Upload review package
        uses: actions/upload-artifact@v4
        with:
          name: youtube-top-home-screen-tweaks-${{ github.run_number }}
          path: video-output/top-home-screen-tweaks/
          if-no-files-found: error
          retention-days: 14
