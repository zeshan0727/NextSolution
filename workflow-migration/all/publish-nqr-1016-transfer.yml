name: Publish NQR 1.0.16 Persistent Wake to NS Transfer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-nqr-1016-transfer.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ARTIFACT_ID: '9493016796'
      DEST_DIR: transfer/files/NextQuickReminder/1.0.16
      DEST_FILE: NextQuickReminder_1.0.16_RootHide.deb
      EXPECTED_SHA: 22413d82950dafcbc889eed8d3a149379e37a1874f888f8046e643e0bf403ea1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download exact verified artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/nqr1016.zip
          rm -rf /tmp/nqr1016 && mkdir -p /tmp/nqr1016
          unzip -q /tmp/nqr1016.zip -d /tmp/nqr1016
          test -f "/tmp/nqr1016/${DEST_FILE}"
          test "$(sha256sum "/tmp/nqr1016/${DEST_FILE}" | awk '{print $1}')" = "$EXPECTED_SHA"

      - name: Publish tweak and update feed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DEST_DIR"
          cp "/tmp/nqr1016/${DEST_FILE}" "$DEST_DIR/$DEST_FILE"
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path('transfer/index.json')
          data=json.loads(p.read_text())
          remove_ids={
            'nextquickreminder-1.0.15-automatic-reports-roothide',
            'nextquickreminder-1.0.14-background-pdf-roothide'
          }
          data['files']=[x for x in data.get('files',[]) if x.get('id') not in remove_ids]
          item={
            'id':'nextquickreminder-1.0.16-persistent-wake-roothide',
            'name':'Next Quick Reminder 1.0.16 — Persistent Wake RootHide',
            'fileName':'NextQuickReminder_1.0.16_RootHide.deb',
            'type':'deb',
            'platform':'RootHide',
            'version':'1.0.16',
            'url':'https://nextjailbreak.com/transfer/files/NextQuickReminder/1.0.16/NextQuickReminder_1.0.16_RootHide.deb',
            'sha256':'22413d82950dafcbc889eed8d3a149379e37a1874f888f8046e643e0bf403ea1',
            'sizeBytes':111040,
            'notes':'Replaces the unreliable 30-second SpringBoard polling scheduler with PCPersistentTimer and system waking enabled for locked-device scheduled sends. Keeps the working fresh pending-reminder PDF generation, newest-3 retention, selected weekdays/time preferences, and Gmail file-share sender unchanged.'
          }
          data['files']=[item]+data['files']
          data['updatedAt']=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          p.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')
          PY
          python3 -m json.tool transfer/index.json >/dev/null

      - name: Commit publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add transfer/index.json "$DEST_DIR/$DEST_FILE"
          git commit -m 'Publish NQR 1.0.16 persistent wake scheduler'
          git push origin HEAD:main
