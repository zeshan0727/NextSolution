name: Publish Next Reminder 1.3.26 to NS Transfer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-nextreminder-1326-transfer.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARTIFACT_ID: '9491129420'
      DEST_DIR: transfer/files/NextReminder/1.3.26
      DEST_FILE: NextReminder_1.3.26_Unsigned.tipa
      EXPECTED_SHA: 9647bff03f6d711cd70adeabeeb3cef4844546df95d407ef1e57fc4affde826b
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download exact verified build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/nr1326.zip
          rm -rf /tmp/nr1326
          mkdir -p /tmp/nr1326
          unzip -q /tmp/nr1326.zip -d /tmp/nr1326
          test -f "/tmp/nr1326/${DEST_FILE}"
          test "$(sha256sum "/tmp/nr1326/${DEST_FILE}" | awk '{print $1}')" = "$EXPECTED_SHA"

      - name: Publish and update feed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DEST_DIR"
          cp "/tmp/nr1326/${DEST_FILE}" "$DEST_DIR/$DEST_FILE"
          python3 - <<'PY'
          import json
          from datetime import datetime,timezone
          from pathlib import Path
          p=Path('transfer/index.json')
          data=json.loads(p.read_text())
          remove_ids={'nextreminder-1.3.25-background-pdf','nextreminder-1.3.26-files-freeze-icon-fix'}
          data['files']=[x for x in data.get('files',[]) if x.get('id') not in remove_ids]
          item={
            'id':'nextreminder-1.3.26-files-freeze-icon-fix',
            'name':'Next Reminder 1.3.26 — Files Freeze + Icon Fix',
            'fileName':'NextReminder_1.3.26_Unsigned.tipa',
            'type':'tipa',
            'platform':'Unsigned TIPA / iOS 16+',
            'version':'1.3.26 (36)',
            'url':'https://nextjailbreak.com/transfer/files/NextReminder/1.3.26/NextReminder_1.3.26_Unsigned.tipa',
            'sha256':'9647bff03f6d711cd70adeabeeb3cef4844546df95d407ef1e57fc4affde826b',
            'sizeBytes':2139494,
            'notes':'Fixes the Files-section freeze by loading saved PDF report metadata off the main thread and avoiding synchronous reminder refresh/notification rebuilding during PDF generation. Restores a complete compiled AppIcon catalog and keeps the 1.3.25 PDF/background-send/Gmail-preservation functionality.'
          }
          data['files'].insert(0,item)
          data['updatedAt']=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          p.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')
          PY
          python3 -m json.tool transfer/index.json >/dev/null
          grep -Fq 'nextreminder-1.3.26-files-freeze-icon-fix' transfer/index.json

      - name: Commit publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add transfer/index.json "$DEST_DIR/$DEST_FILE"
          git diff --cached --stat
          git commit -m 'Publish Next Reminder 1.3.26 Files freeze and icon fix'
          git push origin HEAD:main
