name: Inspect Module Glass Conflict

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-module-glass-conflict.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Compare installed file paths with full NextAura
        shell: bash
        run: |
          set -euo pipefail
          full="debfiles/NextAura_4.4.8_RootHide_iOS16.deb"
          cc="debfiles/NextAura_Runtime_ccbackgrounds_1.0.14_RootHide.deb"
          prefs="debfiles/NextAura_Runtime_preferences_1.0.5_RootHide.deb"
          for f in "$full" "$cc" "$prefs"; do test -f "$f"; done
          mkdir -p /tmp/full /tmp/cc /tmp/prefs
          dpkg-deb -x "$full" /tmp/full
          dpkg-deb -x "$cc" /tmp/cc
          dpkg-deb -x "$prefs" /tmp/prefs
          find /tmp/full -type f -printf '%P\n' | sort > /tmp/full.txt
          find /tmp/cc -type f -printf '%P\n' | sort > /tmp/cc.txt
          find /tmp/prefs -type f -printf '%P\n' | sort > /tmp/prefs.txt
          echo '=== CC runtime files ==='; cat /tmp/cc.txt
          echo '=== Preferences runtime files ==='; cat /tmp/prefs.txt
          echo '=== overlap with full NextAura: cc ==='; comm -12 /tmp/full.txt /tmp/cc.txt || true
          echo '=== overlap with full NextAura: prefs ==='; comm -12 /tmp/full.txt /tmp/prefs.txt || true
          echo "cc_overlap_count=$(comm -12 /tmp/full.txt /tmp/cc.txt | wc -l)"
          echo "prefs_overlap_count=$(comm -12 /tmp/full.txt /tmp/prefs.txt | wc -l)"
