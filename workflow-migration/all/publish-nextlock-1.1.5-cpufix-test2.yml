# Triggered Test 2 build 2026-08-19 12:27 Qatar
name: Build and Publish NextLock 1.1.5 CPU Fix Test 2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-nextlock-1.1.5-cpufix-test2.yml'

permissions:
  contents: write

concurrency:
  group: publish-nextlock-1.1.5-cpufix-test2
  cancel-in-progress: false

jobs:
  build-publish:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: brew install dpkg ldid

      - name: Prepare Test 2 source from debug branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin debug/nextlock-1.1.4-cpu-fix
          git worktree add "$RUNNER_TEMP/nextlock-debug" FETCH_HEAD
          test -f "$RUNNER_TEMP/nextlock-debug/source/NextLockPerfFix/Tweak.m"
          grep -q 'NextLockPerfFix 1.1.5-test2 targeted-image-cache transparency-cache exact-semantics' "$RUNNER_TEMP/nextlock-debug/source/NextLockPerfFix/Tweak.m"
          grep -q 'fromLockGlyphTime' "$RUNNER_TEMP/nextlock-debug/source/NextLockPerfFix/Tweak.m"
          grep -q '@selector(imageWithData:)' "$RUNNER_TEMP/nextlock-debug/source/NextLockPerfFix/Tweak.m"

      - name: Build RootHide Test 2 shim
        id: buildshim
        shell: bash
        continue-on-error: true
        run: |
          set +e
          P="$RUNNER_TEMP/nextlock-debug/source/NextLockPerfFix"
          T="$RUNNER_TEMP/theos-rh"
          git init "$T"
          git -C "$T" remote add origin https://github.com/roothide/theos.git
          git -C "$T" fetch --depth 1 origin 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$T" checkout --detach 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$T" submodule update --init --recursive --depth 1
          sed -i '' 's/^Architecture: iphoneos-arm64$/Architecture: iphoneos-arm64e/' "$P/control"
          export THEOS="$T"
          export THEOS_PACKAGE_SCHEME=roothide
          rm -rf "$P/.theos" "$P/packages"
          make -C "$P" clean package FINALPACKAGE=1 2>&1 | tee "$RUNNER_TEMP/nextlock-test2-build.log"
          RC=${PIPESTATUS[0]}
          echo "BUILD_RC=$RC" >> "$GITHUB_ENV"
          if [ "$RC" -eq 0 ]; then
            D=$(find "$P/packages" -type f -name '*.deb' -print -quit)
            if [ -z "$D" ]; then
              echo 'No DEB produced' | tee -a "$RUNNER_TEMP/nextlock-test2-build.log"
              echo 'BUILD_RC=90' >> "$GITHUB_ENV"
            else
              echo "FIX_DEB=$D" >> "$GITHUB_ENV"
            fi
          fi
          exit 0

      - name: Save build diagnostic if compile fails
        if: env.BUILD_RC != '0'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transfer/diagnostics
          cp "$RUNNER_TEMP/nextlock-test2-build.log" transfer/diagnostics/nextlock-1.1.5-test2-build.log
          git config user.name 'Next Jailbreak Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add transfer/diagnostics/nextlock-1.1.5-test2-build.log
          git commit -m 'Save NextLock 1.1.5 Test 2 build diagnostic' || true
          git pull --rebase origin main
          git push origin HEAD:main
          exit 1

      - name: Integrate shim into original NextLock 1.1.4
        if: env.BUILD_RC == '0'
        shell: bash
        run: |
          set -euo pipefail
          BASE=transfer/files/NextLock/1.1.4/NextLock_1.1.4_RootHide.deb
          test -f "$BASE"
          STAGE="$RUNNER_TEMP/nextlock-stage"
          FIXSTAGE="$RUNNER_TEMP/fix-stage"
          OUT="$RUNNER_TEMP/out"
          mkdir -p "$OUT"
          dpkg-deb -R "$BASE" "$STAGE"
          dpkg-deb -x "$FIX_DEB" "$FIXSTAGE"

          LOCK=$(find "$STAGE" -name LockGlyphTime.dylib -print -quit)
          FIX=$(find "$FIXSTAGE" -name NextLockPerfFix.dylib -print -quit)
          FIXPLIST=$(find "$FIXSTAGE" -name NextLockPerfFix.plist -print -quit)
          test -n "$LOCK"; test -n "$FIX"; test -n "$FIXPLIST"

          dwarfdump --uuid "$LOCK" | tee "$RUNNER_TEMP/lock-uuids.txt"
          grep -qi 'C7EBC4D1-EAD4-3320-A27F-34E86C25F776' "$RUNNER_TEMP/lock-uuids.txt"
          grep -qi '7BE1428A-C4B0-38F8-8120-7BACBF220731' "$RUNNER_TEMP/lock-uuids.txt"
          strings -a "$LOCK" | grep -q 'imageWithData:'
          strings -a "$LOCK" | grep -q 'CGBitmapContextCreate'

          BEFORE=$(shasum -a 256 "$LOCK" | awk '{print $1}')
          DYNDIR=$(dirname "$LOCK")
          cp "$FIX" "$DYNDIR/NextLockPerfFix.dylib"
          cp "$FIXPLIST" "$DYNDIR/NextLockPerfFix.plist"
          AFTER=$(shasum -a 256 "$LOCK" | awk '{print $1}')
          test "$BEFORE" = "$AFTER"

          python3 - "$STAGE/DEBIAN/control" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); t=p.read_text()
          t=re.sub(r'^Version: .*$', 'Version: 1.1.5~cpu2', t, flags=re.M)
          desc='Description: NextLock 1.1.5 CPU-fix Test 2. Keeps the complete 1.1.4 feature binary unchanged, reuses immutable custom-photo UIImage decodes only for LockGlyphTime callers, and caches the exact transparency decision to prevent repeated CoreGraphics/vImage work during layout.'
          if re.search(r'^Description: .*$', t, flags=re.M):
              t=re.sub(r'^Description: .*$', desc, t, flags=re.M)
          else:
              t += '\n'+desc+'\n'
          p.write_text(t)
          PY

          OUTDEB="$OUT/NextLock_1.1.5_CPUFix_Test2_RootHide.deb"
          dpkg-deb -b "$STAGE" "$OUTDEB"
          echo "OUTDEB=$OUTDEB" >> "$GITHUB_ENV"
          echo "ORIGINAL_LOCK_SHA=$BEFORE" >> "$GITHUB_ENV"

      - name: Validate Test 2 package
        if: env.BUILD_RC == '0'
        shell: bash
        run: |
          set -euo pipefail
          test "$(dpkg-deb -f "$OUTDEB" Package)" = 'com.nextsolution.lockglyphtime'
          test "$(dpkg-deb -f "$OUTDEB" Version)" = '1.1.5~cpu2'
          X=$(mktemp -d)
          dpkg-deb -x "$OUTDEB" "$X"
          LOCK=$(find "$X" -name LockGlyphTime.dylib -print -quit)
          FIX=$(find "$X" -name NextLockPerfFix.dylib -print -quit)
          PLIST=$(find "$X" -name NextLockPerfFix.plist -print -quit)
          test -n "$LOCK"; test -n "$FIX"; test -n "$PLIST"
          test "$(shasum -a 256 "$LOCK" | awk '{print $1}')" = "$ORIGINAL_LOCK_SHA"
          strings -a "$FIX" | grep -q 'NextLockPerfFix 1.1.5-test2 targeted-image-cache transparency-cache exact-semantics'
          strings -a "$FIX" | grep -q 'imageWithData:'
          plutil -p "$PLIST" | grep -q 'com.apple.springboard'
          lipo -info "$FIX" | grep -q 'arm64e'
          SHA=$(shasum -a 256 "$OUTDEB" | awk '{print $1}')
          echo "OUT_SHA=$SHA" >> "$GITHUB_ENV"

      - name: Publish Test 2 to NS Transfer
        if: env.BUILD_RC == '0'
        shell: bash
        run: |
          set -euo pipefail
          DEST_DIR='transfer/files/NextLock/1.1.5-CPUFix-Test2'
          DEST="$DEST_DIR/NextLock_1.1.5_CPUFix_Test2_RootHide.deb"
          mkdir -p "$DEST_DIR"
          cp "$OUTDEB" "$DEST"
          test "$(shasum -a 256 "$DEST" | awk '{print $1}')" = "$OUT_SHA"
          export OUT_SHA

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone
          p=Path('transfer/index.json')
          data=json.loads(p.read_text())
          files=data.get('files',[])
          entry_id='nextlock-1.1.5-cpufix-test2-roothide'
          files=[x for x in files if x.get('id') != entry_id]
          entry={
            'id':entry_id,
            'name':'NextLock 1.1.5 CPU Fix Test 2 RootHide',
            'fileName':'NextLock_1.1.5_CPUFix_Test2_RootHide.deb',
            'type':'deb',
            'platform':'RootHide',
            'version':'1.1.5-test2',
            'url':'https://nextjailbreak.com/transfer/files/NextLock/1.1.5-CPUFix-Test2/NextLock_1.1.5_CPUFix_Test2_RootHide.deb',
            'sha256':os.environ['OUT_SHA'],
            'notes':'Feature-preserving Test 2 for the verified NextLock 1.1.4 SpringBoard CPU issue. Reuses immutable UIImage decodes only for calls originating inside LockGlyphTime and keeps the exact transparent-photo/sticker classification while preventing repeated image decode, CoreGraphics redraw and vImage alpha scans during layout.'
          }
          data['files']=[entry]+files
          data['updatedAt']=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY

          python3 -m json.tool transfer/index.json >/dev/null
          grep -q 'nextlock-1.1.5-cpufix-test2-roothide' transfer/index.json
          grep -q "$OUT_SHA" transfer/index.json

          git config user.name 'Next Jailbreak Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add "$DEST" transfer/index.json
          git diff --cached --check
          git commit -m 'Publish NextLock 1.1.5 CPU Fix Test 2 to Transfer'
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Upload Test 2 artifact
        if: env.BUILD_RC == '0'
        uses: actions/upload-artifact@v4
        with:
          name: NextLock-1.1.5-CPUFix-Test2-RootHide
          path: ${{ env.OUTDEB }}
          if-no-files-found: error
          retention-days: 14
