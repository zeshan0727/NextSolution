name: Publish Next Reminder 1.3.27 to NS Transfer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-nextreminder-1327-transfer.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARTIFACT_ID: '9491511942'
      DEST_DIR: transfer/files/NextReminder/1.3.27
      DEST_FILE: NextReminder_1.3.27_Unsigned.tipa
      EXPECTED_SHA: b0b5243a8d2d6f168ba5e4585beb511794a531df1f6903d4328a9b6b0b34f9c5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download exact verified build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/nr1327.zip
          rm -rf /tmp/nr1327
          mkdir -p /tmp/nr1327
          unzip -q /tmp/nr1327.zip -d /tmp/nr1327
          test -f "/tmp/nr1327/${DEST_FILE}"
          test "$(sha256sum "/tmp/nr1327/${DEST_FILE}" | awk '{print $1}')" = "$EXPECTED_SHA"

      - name: Publish and update feed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DEST_DIR"
          cp "/tmp/nr1327/${DEST_FILE}" "$DEST_DIR/$DEST_FILE"
          python3 - <<'PY'
          import json
          from datetime import datetime,timezone
          from pathlib import Path
          p=Path('transfer/index.json')
          data=json.loads(p.read_text())
          remove_ids={
            'nextreminder-1.3.25-background-pdf',
            'nextreminder-1.3.26-files-freeze-icon-fix',
            'nextreminder-1.3.27-files-stability-fix'
          }
          data['files']=[x for x in data.get('files',[]) if x.get('id') not in remove_ids]
          item={
            'id':'nextreminder-1.3.27-files-stability-fix',
            'name':'Next Reminder 1.3.27 — Files Stability Fix',
            'fileName':'NextReminder_1.3.27_Unsigned.tipa',
            'type':'tipa',
            'platform':'Unsigned TIPA / iOS 16+',
            'version':'1.3.27 (37)',
            'url':'https://nextjailbreak.com/transfer/files/NextReminder/1.3.27/NextReminder_1.3.27_Unsigned.tipa',
            'sha256':'b0b5243a8d2d6f168ba5e4585beb511794a531df1f6903d4328a9b6b0b34f9c5',
            'sizeBytes':2188291,
            'notes':'Stability-first Files fix. The Pending Reminders Report is isolated behind its own navigation screen, so opening Files no longer constructs the heavy report UI or scans saved PDFs. Report/PDF/background-send/Gmail-preservation functionality remains available after tapping Pending Reminders Report. Retains the compiled AppIcon fix from 1.3.26.'
          }
          data['files'].insert(0,item)
          data['updatedAt']=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          p.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')
          PY
          python3 -m json.tool transfer/index.json >/dev/null

      - name: Commit publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add transfer/index.json "$DEST_DIR/$DEST_FILE"
          git commit -m 'Publish Next Reminder 1.3.27 Files stability fix'
          git push origin HEAD:main
