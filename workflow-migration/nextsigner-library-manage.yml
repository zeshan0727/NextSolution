name: Next Signer - Manage Library Storage

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: Published app id from install/apps.json
        required: true
        type: string
      mode:
        description: cleanup keeps current R2 build; delete removes app and all stored versions
        required: true
        type: choice
        options:
          - cleanup
          - delete
  repository_dispatch:
    types: [nextsigner_library_manage]

permissions:
  contents: write

concurrency:
  group: nextsigner-library-management
  cancel-in-progress: false

jobs:
  manage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ID: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.app_id || inputs.app_id }}
      MODE: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.mode || inputs.mode }}
      R2_BUCKET: next-signer-apps
      R2_ACCOUNT_ID: 4fe920e259870b0366118a17cc5727e5
      R2_PUBLIC_BASE: https://files.nextjailbreak.com
      AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Read published app metadata
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APP_ID" || { echo 'app_id is required'; exit 1; }
          test "$MODE" = cleanup -o "$MODE" = delete || { echo "Unsupported mode: $MODE"; exit 1; }
          python3 - <<'PY'
          import json, os
          from pathlib import Path, PurePosixPath
          from urllib.parse import urlparse, unquote

          catalog_path = Path('install/apps.json')
          data = json.loads(catalog_path.read_text())
          app = next((x for x in data.get('apps', []) if str(x.get('id')) == os.environ['APP_ID']), None)
          if not app:
              raise SystemExit(f"App not found in catalog: {os.environ['APP_ID']}")

          download = str(app.get('downloadURL') or '')
          key = ''
          prefix = ''
          if download.startswith(os.environ['R2_PUBLIC_BASE'] + '/'):
              key = unquote(urlparse(download).path.lstrip('/'))
              parts = PurePosixPath(key).parts
              if len(parts) >= 5 and parts[0] == 'apps' and parts[1] == 'ipa':
                  prefix = '/'.join(parts[:3]) + '/'

          values = {
              'APP_NAME': str(app.get('name') or os.environ['APP_ID']),
              'CURRENT_R2_KEY': key,
              'APP_R2_PREFIX': prefix,
              'APP_MANIFEST_PATH': str(app.get('manifest') or ''),
              'APP_ICON_PATH': str(app.get('icon') or ''),
          }
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              for name, value in values.items():
                  print(f'{name}={value}', file=f)
          print(f"Managing {values['APP_NAME']} ({os.environ['MODE']})")
          print(f"R2 prefix: {prefix or 'none'}")
          PY

      - name: Install AWS CLI
        if: env.APP_R2_PREFIX != ''
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID" || { echo 'CLOUDFLARE_R2_ACCESS_KEY_ID is missing'; exit 1; }
          test -n "$AWS_SECRET_ACCESS_KEY" || { echo 'CLOUDFLARE_R2_SECRET_ACCESS_KEY is missing'; exit 1; }
          python3 -m pip install --user --quiet awscli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Clean old R2 versions
        if: env.MODE == 'cleanup' && env.APP_R2_PREFIX != ''
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          ENDPOINT="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          aws s3api list-objects-v2 \
            --bucket "$R2_BUCKET" \
            --prefix "$APP_R2_PREFIX" \
            --endpoint-url "$ENDPOINT" \
            --output json > "$RUNNER_TEMP/r2-objects.json"

          jq -r '.Contents[]?.Key' "$RUNNER_TEMP/r2-objects.json" | while IFS= read -r key; do
            [ -n "$key" ] || continue
            if [ "$key" = "$CURRENT_R2_KEY" ]; then
              echo "Keeping current build: $key"
            else
              echo "Deleting old build: $key"
              aws s3 rm "s3://$R2_BUCKET/$key" --endpoint-url "$ENDPOINT" --only-show-errors
            fi
          done

      - name: Report no managed R2 history
        if: env.MODE == 'cleanup' && env.APP_R2_PREFIX == ''
        run: echo 'This catalog entry has no managed Cloudflare R2 IPA prefix; there are no R2 versions to clean.'

      - name: Delete all R2 versions for app
        if: env.MODE == 'delete' && env.APP_R2_PREFIX != ''
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          aws s3 rm "s3://$R2_BUCKET/$APP_R2_PREFIX" \
            --recursive \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --only-show-errors

      - name: Remove app from site catalog
        if: env.MODE == 'delete'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from datetime import date
          from pathlib import Path

          catalog_path = Path('install/apps.json')
          data = json.loads(catalog_path.read_text())
          apps = data.get('apps', [])
          target = next((x for x in apps if str(x.get('id')) == os.environ['APP_ID']), None)
          if not target:
              raise SystemExit('Catalog entry disappeared before deletion')

          remaining = [x for x in apps if str(x.get('id')) != os.environ['APP_ID']]
          data['apps'] = remaining
          data['updated'] = date.today().isoformat()
          catalog_path.write_text(json.dumps(data, indent=2) + '\n')

          manifest = str(target.get('manifest') or '')
          if manifest.startswith('/install/'):
              path = Path(manifest.lstrip('/'))
              if path.is_file() and path.suffix.lower() == '.plist':
                  path.unlink()
                  print(f'Removed manifest: {path}')

          icon = str(target.get('icon') or '')
          if icon.startswith('/install/icons/') and not any(str(x.get('icon') or '') == icon for x in remaining):
              path = Path(icon.lstrip('/'))
              if path.is_file():
                  path.unlink()
                  print(f'Removed icon: {path}')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A install
          if git diff --cached --quiet; then
            echo 'No site metadata changes to commit'
          else
            git commit -m "Remove $APP_NAME from Next Signer library"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Next Signer Library Management'
            echo
            echo "App: ${APP_NAME:-$APP_ID}"
            echo "Mode: $MODE"
            if [ "${{ job.status }}" = success ]; then
              if [ "$MODE" = cleanup ]; then
                echo 'Status: old stored versions cleaned; current build kept'
              else
                echo 'Status: app removed from site and managed R2 versions deleted'
              fi
            else
              echo 'Status: failed — inspect the log above; no success is assumed'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
