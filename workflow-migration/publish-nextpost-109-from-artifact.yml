name: Publish Next Post 1.0.9 From Artifact

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-nextpost-109-from-artifact.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download validated PR build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9498061321/zip" \
            -o artifact.zip
          mkdir artifact
          unzip -q artifact.zip -d artifact
          test -s artifact/NextPost-1.0.9-X-Preview-Fix.tipa
          test -s artifact/NextPost-1.0.9-X-Preview-Fix.sha256
          (cd artifact && sha256sum -c NextPost-1.0.9-X-Preview-Fix.sha256)

      - name: Publish to repository and NS Transfer
        run: |
          set -euo pipefail
          FILE='NextPost-1.0.9-X-Preview-Fix.tipa'
          SHA256=$(sha256sum "artifact/$FILE" | awk '{print $1}')
          export SHA256

          mkdir -p applications transfer/files/NextPost/1.0.9
          cp "artifact/$FILE" "applications/$FILE"
          cp artifact/NextPost-1.0.9-X-Preview-Fix.sha256 applications/NextPost-1.0.9-X-Preview-Fix.sha256
          cp "artifact/$FILE" "transfer/files/NextPost/1.0.9/$FILE"

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone
          p = Path('transfer/index.json')
          data = json.loads(p.read_text())
          entry_id = 'nextpost-1.0.9-x-preview-fix'
          files = [x for x in data.get('files', []) if x.get('id') != entry_id]
          entry = {
            'id': entry_id,
            'name': 'Next Post 1.0.9 X Preview Fix',
            'fileName': 'NextPost-1.0.9-X-Preview-Fix.tipa',
            'type': 'tipa',
            'platform': 'TrollStore / iOS 16+',
            'version': '1.0.9',
            'url': 'https://nextjailbreak.com/transfer/files/NextPost/1.0.9/NextPost-1.0.9-X-Preview-Fix.tipa',
            'sha256': os.environ['SHA256'],
            'notes': 'Fixes missing X post link previews by sharing the exact published article route and passing the article URL separately to the X compose intent. Keeps LevelPlay and Unity Ads mediation from 1.0.8.'
          }
          data['files'] = [entry] + files
          data['updatedAt'] = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          p.write_text(json.dumps(data, indent=2) + '\n')
          PY

          test "$(sha256sum transfer/files/NextPost/1.0.9/$FILE | awk '{print $1}')" = "$SHA256"
          python3 -m json.tool transfer/index.json >/dev/null

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "applications/$FILE" applications/NextPost-1.0.9-X-Preview-Fix.sha256 "transfer/files/NextPost/1.0.9/$FILE" transfer/index.json
          git commit -m 'Publish Next Post 1.0.9 X preview fix to NS Transfer'
          git pull --rebase origin main
          git push origin HEAD:main
