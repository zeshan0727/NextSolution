name: Build and Publish Low Battery Haptic Alert 1.0.0 Corrected

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-low-battery-haptic-alert-fixed.yml"

permissions:
  contents: write

concurrency:
  group: nextsolution-low-battery-haptic-alert-corrected-1.0.0
  cancel-in-progress: false

jobs:
  build-validate-publish:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install package tools
        run: brew install dpkg ldid xz zstd

      - name: Validate source and deterministic decision path
        shell: bash
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/2026-08-02-LowBatteryHapticAlert"
          for f in Decision.h Tweak.xm LowBatteryHapticAlert.plist control Makefile README.md tests/test_decision.c Preferences/Makefile Preferences/LBHARootListController.h Preferences/LBHARootListController.m Preferences/Resources/Root.plist Preferences/Resources/Info.plist layout/Library/PreferenceLoader/Preferences/LowBatteryHapticAlert.plist; do test -f "$P/$f"; done
          grep -q '^Version: 1.0.0$' "$P/control"
          grep -q '^ARCHS = arm64 arm64e$' "$P/Makefile"
          grep -q '^THEOS_PACKAGE_SCHEME ?= roothide$' "$P/Makefile"
          grep -q '^LowBatteryHapticAlert_FILES = Tweak.xm$' "$P/Makefile"
          grep -q -- '-Wl,-segalign,4000' "$P/Makefile"
          grep -q 'UIDeviceBatteryLevelDidChangeNotification' "$P/Tweak.xm"
          grep -q 'batteryMonitoringEnabled = YES' "$P/Tweak.xm"
          grep -q 'batteryState != LBHABatteryStateUnplugged' "$P/Decision.h"
          grep -q 'previousPercent > threshold && currentPercent <= threshold' "$P/Decision.h"
          grep -q 'com.apple.springboard' "$P/LowBatteryHapticAlert.plist"
          test "$(grep -c '<string>PSSwitchCell</string>' "$P/Preferences/Resources/Root.plist")" -eq 1
          test "$(grep -c '<string>PSSliderCell</string>' "$P/Preferences/Resources/Root.plist")" -eq 1
          ! grep -Eq 'Test|Diagnostic|Runtime|PID|Hook|Class' "$P/Preferences/Resources/Root.plist"
          plutil -lint "$P/LowBatteryHapticAlert.plist"
          plutil -lint "$P/Preferences/Resources/Root.plist"
          plutil -lint "$P/Preferences/Resources/Info.plist"
          plutil -lint "$P/layout/Library/PreferenceLoader/Preferences/LowBatteryHapticAlert.plist"
          clang -std=c11 -Wall -Wextra -Werror "$P/tests/test_decision.c" -o "$RUNNER_TEMP/test_decision"
          "$RUNNER_TEMP/test_decision"
          echo "Header-only deterministic checks passed" | tee "$RUNNER_TEMP/decision-test.log"

      - name: Build rootless
        shell: bash
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/2026-08-02-LowBatteryHapticAlert"
          OUT="$RUNNER_TEMP/lbha-release"
          mkdir -p "$OUT"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos-rootless"
          export THEOS="$RUNNER_TEMP/theos-rootless"
          export THEOS_PACKAGE_SCHEME=rootless
          rm -rf "$P/packages"
          make -C "$P" clean package FINALPACKAGE=1 2>&1 | tee "$RUNNER_TEMP/rootless-build.log"
          DEB="$(find "$P/packages" -type f -name '*_iphoneos-arm64.deb' -print -quit)"
          test -n "$DEB"
          cp "$DEB" "$OUT/LowBatteryHapticAlert_1.0.0_Rootless.deb"

      - name: Build RootHide
        shell: bash
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/2026-08-02-LowBatteryHapticAlert"
          OUT="$RUNNER_TEMP/lbha-release"
          git init "$RUNNER_TEMP/theos-roothide"
          git -C "$RUNNER_TEMP/theos-roothide" remote add origin https://github.com/roothide/theos.git
          git -C "$RUNNER_TEMP/theos-roothide" fetch --depth 1 origin 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$RUNNER_TEMP/theos-roothide" checkout --detach 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$RUNNER_TEMP/theos-roothide" submodule update --init --recursive --depth 1
          sed -i '' 's/^Architecture: iphoneos-arm64$/Architecture: iphoneos-arm64e/' "$P/control"
          export THEOS="$RUNNER_TEMP/theos-roothide"
          export THEOS_PACKAGE_SCHEME=roothide
          rm -rf "$P/packages"
          make -C "$P" clean package FINALPACKAGE=1 2>&1 | tee "$RUNNER_TEMP/roothide-build.log"
          DEB="$(find "$P/packages" -type f -name '*_iphoneos-arm64e.deb' -print -quit)"
          test -n "$DEB"
          cp "$DEB" "$OUT/LowBatteryHapticAlert_1.0.0_RootHide.deb"

      - name: Validate packages and installed layouts
        shell: bash
        run: |
          set -euo pipefail
          validate() {
            deb="$1"; arch="$2"; x="$(mktemp -d)"
            test "$(dpkg-deb -f "$deb" Package)" = com.nextsolution.lowbatteryhapticalert
            test "$(dpkg-deb -f "$deb" Name)" = "Low Battery Haptic Alert"
            test "$(dpkg-deb -f "$deb" Version)" = 1.0.0
            test "$(dpkg-deb -f "$deb" Architecture)" = "$arch"
            dpkg-deb -f "$deb" Depends | grep -q preferenceloader
            dpkg-deb -x "$deb" "$x"
            dylib="$(find "$x" -type f -name LowBatteryHapticAlert.dylib -print -quit)"
            filter="$(find "$x" -type f -name LowBatteryHapticAlert.plist -path '*DynamicLibraries*' -print -quit)"
            root="$(find "$x" -type f -path '*LowBatteryHapticAlertPreferences.bundle/Root.plist' -print -quit)"
            entry="$(find "$x" -type f -path '*PreferenceLoader/Preferences/LowBatteryHapticAlert.plist' -print -quit)"
            test -n "$dylib"; test -n "$filter"; test -n "$root"; test -n "$entry"
            grep -q 'com.apple.springboard' "$filter"
            grep -q 'Enable Alert' "$root"
            grep -q 'Battery Threshold' "$root"
            strings -a "$dylib" | grep -q UIDeviceBatteryLevelDidChangeNotification
            strings -a "$dylib" | grep -q 'setBatteryMonitoringEnabled:'
            strings -a "$dylib" | grep -q 'notificationOccurred:'
            rm -rf "$x"
          }
          OUT="$RUNNER_TEMP/lbha-release"
          validate "$OUT/LowBatteryHapticAlert_1.0.0_Rootless.deb" iphoneos-arm64
          validate "$OUT/LowBatteryHapticAlert_1.0.0_RootHide.deb" iphoneos-arm64e
          {
            cat "$RUNNER_TEMP/decision-test.log"
            shasum -a 256 "$OUT"/*.deb
            echo "Package metadata, layout and runtime symbols validated"
          } | tee "$RUNNER_TEMP/build-validation.txt"

      - name: Upload diagnostic compiler record
        uses: actions/upload-artifact@v4
        with:
          name: low-battery-haptic-alert-build-validation
          path: |
            ${{ runner.temp }}/decision-test.log
            ${{ runner.temp }}/rootless-build.log
            ${{ runner.temp }}/roothide-build.log
            ${{ runner.temp }}/build-validation.txt

      - name: Publish to nextjailbreak.com Sileo repository
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/lbha-release"
          git config user.name "Next Jailbreak Build Bot"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p debfiles "$RUNNER_TEMP/lbha-scan"
            cp "$OUT"/*.deb debfiles/
            cp "$OUT"/*.deb "$RUNNER_TEMP/lbha-scan/"

            dpkg-scanpackages -m "$RUNNER_TEMP/lbha-scan" /dev/null > "$RUNNER_TEMP/lbha-stanzas"
            sed -i '' 's|^Filename: .*/lbha-scan/|Filename: ./debfiles/|' "$RUNNER_TEMP/lbha-stanzas"

            python3 - "$RUNNER_TEMP/lbha-stanzas" <<'PY'
          from pathlib import Path
          import re, sys
          p = Path('Packages')
          old = p.read_text() if p.exists() else ''
          rows = [x.strip() for x in re.split(r'\n\s*\n', old) if x.strip()]
          rows = [x for x in rows if not re.search(r'^Package: com\.nextsolution\.lowbatteryhapticalert$', x, re.M)]
          new = [x.strip() for x in re.split(r'\n\s*\n', Path(sys.argv[1]).read_text()) if x.strip()]
          p.write_text('\n\n'.join(rows + new) + '\n')
          PY

            test "$(grep -c '^Package: com.nextsolution.lowbatteryhapticalert$' Packages)" -eq 2
            test "$(grep -c '^Filename: ./debfiles/LowBatteryHapticAlert_1.0.0_Root' Packages)" -eq 2
            gzip -9 -c Packages > Packages.gz
            bzip2 -9 -c Packages > Packages.bz2
            xz -9e -c Packages > Packages.xz
            zstd -19 -q -c Packages > Packages.zst

            python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import re
          p = Path('Release')
          t = p.read_text()
          m = re.search(r'^Version: (\d+)\.(\d+)\.(\d+)$', t, re.M)
          if m:
              t = re.sub(r'^Version: .*$', f'Version: {m.group(1)}.{m.group(2)}.{int(m.group(3))+1}', t, flags=re.M)
          t = re.sub(r'^Date: .*$', 'Date: ' + datetime.now(timezone.utc).strftime('%a, %d %b %Y %H:%M:%S UTC'), t, flags=re.M)
          t = re.sub(r'^Icon: .*$', 'Icon: https://nextjailbreak.com/CydiaIcon.png', t, flags=re.M)
          p.write_text(t)
          PY

            rm -f .github/workflows/publish-low-battery-haptic-alert.yml .github/workflows/publish-low-battery-haptic-alert-fixed.yml
            git add debfiles/LowBatteryHapticAlert_1.0.0_Rootless.deb debfiles/LowBatteryHapticAlert_1.0.0_RootHide.deb Packages Packages.gz Packages.bz2 Packages.xz Packages.zst Release .github/workflows/publish-low-battery-haptic-alert.yml .github/workflows/publish-low-battery-haptic-alert-fixed.yml
            git diff --cached --check
            git commit -m "Publish Low Battery Haptic Alert 1.0.0"
            git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1
