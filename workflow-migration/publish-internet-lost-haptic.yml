name: Publish Internet Lost Haptic
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['internet-lost-haptic-build.txt']
permissions:
  contents: write
concurrency:
  group: publish-internet-lost-haptic-1.0.0
  cancel-in-progress: false
jobs:
  publish:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: brew install dpkg ldid xz zstd
      - name: Require successful diagnostic gate
        run: |
          set -euo pipefail
          grep -q '^PASS 10/10 deterministic runtime cases$' internet-lost-haptic-build.txt
          grep -q '^DIAGNOSTIC BUILD PASS$' internet-lost-haptic-build.txt
      - name: Re-run deterministic checks
        run: python3 DailyTweaks/2026-08-12-InternetLostHaptic/tests/test_runtime.py
      - name: Build production rootless
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/2026-08-12-InternetLostHaptic"; mkdir -p "$RUNNER_TEMP/out"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          export THEOS="$RUNNER_TEMP/theos" THEOS_PACKAGE_SCHEME=rootless
          make -C "$P" clean package FINALPACKAGE=1
          D="$(find "$P/packages" -name '*_iphoneos-arm64.deb' -print -quit)"; test -n "$D"
          cp "$D" "$RUNNER_TEMP/out/InternetLostHaptic_1.0.0_Rootless.deb"
      - name: Build production RootHide
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/DailyTweaks/2026-08-12-InternetLostHaptic"
          git init "$RUNNER_TEMP/theos-rh"
          git -C "$RUNNER_TEMP/theos-rh" remote add origin https://github.com/roothide/theos.git
          git -C "$RUNNER_TEMP/theos-rh" fetch --depth 1 origin 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$RUNNER_TEMP/theos-rh" checkout --detach 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$RUNNER_TEMP/theos-rh" submodule update --init --recursive --depth 1
          sed -i '' 's/^Architecture: iphoneos-arm64$/Architecture: iphoneos-arm64e/' "$P/control"
          export THEOS="$RUNNER_TEMP/theos-rh" THEOS_PACKAGE_SCHEME=roothide
          rm -rf "$P/packages"; make -C "$P" clean package FINALPACKAGE=1
          D="$(find "$P/packages" -name '*_iphoneos-arm64e.deb' -print -quit)"; test -n "$D"
          cp "$D" "$RUNNER_TEMP/out/InternetLostHaptic_1.0.0_RootHide.deb"
          git checkout -- "$P/control"
      - name: Inspect production packages
        run: |
          set -euo pipefail
          for d in "$RUNNER_TEMP/out"/*.deb; do
            test "$(dpkg-deb -f "$d" Package)" = com.nextsolution.internetlosthaptic
            test "$(dpkg-deb -f "$d" Version)" = 1.0.0
            dep="$(dpkg-deb -f "$d" Depends)"; echo "$dep" | grep -q preferenceloader
            case "$(basename "$d")" in
              *RootHide.deb) test "$(dpkg-deb -f "$d" Architecture)" = iphoneos-arm64e ;;
              *Rootless.deb) test "$(dpkg-deb -f "$d" Architecture)" = iphoneos-arm64 ;;
            esac
            x="$(mktemp -d)"; dpkg-deb -x "$d" "$x"
            dylib="$(find "$x" -name InternetLostHaptic.dylib -print -quit)"; test -n "$dylib"
            test -n "$(find "$x" -path '*InternetLostHapticPreferences.bundle/Root.plist' -print -quit)"
            test -n "$(find "$x" -path '*PreferenceLoader/Preferences/InternetLostHaptic.plist' -print -quit)"
            nm -u "$dylib" 2>/dev/null | grep -q nw_path_monitor_create
            strings -a "$dylib" | grep -q com.nextsolution.internetlosthaptic
            otool -L "$dylib" | grep -q '/System/Library/Frameworks/Network.framework/Network'
          done
      - name: Sync latest main and publish packages/indexes
        run: |
          set -euo pipefail
          git config user.name 'Next Jailbreak Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase origin main
          mkdir -p debfiles
          cp "$RUNNER_TEMP/out/InternetLostHaptic_1.0.0_RootHide.deb" debfiles/
          cp "$RUNNER_TEMP/out/InternetLostHaptic_1.0.0_Rootless.deb" debfiles/
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, hashlib
          names=['InternetLostHaptic_1.0.0_RootHide.deb','InternetLostHaptic_1.0.0_Rootless.deb']
          out=[]
          def field(p,k): return subprocess.check_output(['dpkg-deb','-f',str(p),k],text=True).strip()
          for n in names:
              p=Path('debfiles')/n; b=p.read_bytes()
              vals={k:field(p,k) for k in ['Package','Version','Architecture','Maintainer','Depends','Description','Author','Section','Priority','Homepage','Depiction','Name']}
              lines=[f"Package: {vals['Package']}",f"Version: {vals['Version']}",f"Architecture: {vals['Architecture']}",f"Maintainer: {vals['Maintainer']}",f"Depends: {vals['Depends']}",f"Filename: ./debfiles/{n}",f"Size: {len(b)}",f"MD5sum: {hashlib.md5(b).hexdigest()}",f"SHA1: {hashlib.sha1(b).hexdigest()}",f"SHA256: {hashlib.sha256(b).hexdigest()}",f"Section: {vals['Section']}",f"Priority: {vals['Priority']}",f"Homepage: {vals['Homepage']}",f"Description: {vals['Description']}",f"Author: {vals['Author']}",f"Depiction: {vals['Depiction']}",f"Name: {vals['Name']}"]
              out.append('\n'.join(lines))
          Path('/tmp/ilh-stanzas.txt').write_text('\n\n'.join(out)+'\n')
          PY
          python3 scripts/publish_internet_lost_haptic.py /tmp/ilh-stanzas.txt
          gzip -9 -c Packages > Packages.gz
          bzip2 -9 -c Packages > Packages.bz2
          xz -9 -c Packages > Packages.xz
          zstd -19 -q -c Packages > Packages.zst
      - name: Validate final Sileo metadata
        run: |
          set -euo pipefail
          test "$(grep -c '^Package: com.nextsolution.internetlosthaptic$' Packages)" = 2
          grep -q 'Filename: ./debfiles/InternetLostHaptic_1.0.0_RootHide.deb' Packages
          grep -q 'Filename: ./debfiles/InternetLostHaptic_1.0.0_Rootless.deb' Packages
          grep -q '^Homepage: https://nextjailbreak.com/$' Packages
          grep -q '^Depiction: https://nextjailbreak.com/depictions/internetlosthaptic.html$' Packages
          gzip -dc Packages.gz | cmp - Packages
          bzip2 -dc Packages.bz2 | cmp - Packages
          xz -dc Packages.xz | cmp - Packages
          zstd -dc Packages.zst | cmp - Packages
          grep -R -n 'zeshan0727.github.io' DailyTweaks/2026-08-12-InternetLostHaptic depictions/internetlosthaptic.html && exit 1 || true
      - name: Commit release to main
        run: |
          set -euo pipefail
          git add debfiles/InternetLostHaptic_1.0.0_RootHide.deb debfiles/InternetLostHaptic_1.0.0_Rootless.deb Packages Packages.gz Packages.bz2 Packages.xz Packages.zst Release
          git commit -m 'Publish Internet Lost Haptic 1.0.0'
          git push origin main
