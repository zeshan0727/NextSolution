name: Publish Next Reminder 1.3.28 to NS Transfer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-nextreminder-1328-transfer.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARTIFACT_ID: '9492117346'
      DEST_DIR: transfer/files/NextReminder/1.3.28
      DEST_FILE: NextReminder_1.3.28_Unsigned.tipa
      EXPECTED_SHA: 960f1199cbc5b32962f8077df0bdd48b0c3d6b3c3c0ca94ee1104882e607012b
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download exact verified build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/nr1328.zip
          rm -rf /tmp/nr1328
          mkdir -p /tmp/nr1328
          unzip -q /tmp/nr1328.zip -d /tmp/nr1328
          test -f "/tmp/nr1328/${DEST_FILE}"
          test "$(sha256sum "/tmp/nr1328/${DEST_FILE}" | awk '{print $1}')" = "$EXPECTED_SHA"

      - name: Publish and update feed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DEST_DIR"
          cp "/tmp/nr1328/${DEST_FILE}" "$DEST_DIR/$DEST_FILE"
          python3 - <<'PY'
          import json
          from datetime import datetime,timezone
          from pathlib import Path
          p=Path('transfer/index.json')
          data=json.loads(p.read_text())
          remove_ids={
            'nextreminder-1.3.25-background-pdf',
            'nextreminder-1.3.26-files-freeze-icon-fix',
            'nextreminder-1.3.27-files-stability-fix',
            'nextreminder-1.3.28-stable-files-rollback'
          }
          data['files']=[x for x in data.get('files',[]) if x.get('id') not in remove_ids]
          item={
            'id':'nextreminder-1.3.28-stable-files-rollback',
            'name':'Next Reminder 1.3.28 — Stable Files Rollback',
            'fileName':'NextReminder_1.3.28_Unsigned.tipa',
            'type':'tipa',
            'platform':'Unsigned TIPA / iOS 16+',
            'version':'1.3.28 (38)',
            'url':'https://nextjailbreak.com/transfer/files/NextReminder/1.3.28/NextReminder_1.3.28_Unsigned.tipa',
            'sha256':'960f1199cbc5b32962f8077df0bdd48b0c3d6b3c3c0ca94ee1104882e607012b',
            'sizeBytes':2061731,
            'notes':'Stability rollback for the persistent Files freeze. Restores the entire File Sharing implementation to the verified pre-report stable source instead of carrying any Pending Report/PDF/background-send UI code in the Files view. Keeps the current app data, other app updates, Live Activity version alignment, and compiled AppIcon fix. Pending Report generation is temporarily removed from the app while Files stability is verified.'
          }
          data['files'].insert(0,item)
          data['updatedAt']=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          p.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')
          PY
          python3 -m json.tool transfer/index.json >/dev/null

      - name: Commit publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add transfer/index.json "$DEST_DIR/$DEST_FILE"
          git commit -m 'Publish Next Reminder 1.3.28 stable Files rollback'
          git push origin HEAD:main
