name: NextSolution
options:
  bundleIdPrefix: com.nextsolution
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.nextsolution.website
    PRODUCT_NAME: NextSolution
    SWIFT_VERSION: 5.9
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: 2.0.0
    CURRENT_PROJECT_VERSION: 2
    IPHONEOS_DEPLOYMENT_TARGET: 15.0
    SUPPORTS_MACCATALYST: NO
    CODE_SIGNING_ALLOWED: NO
targets:
  NextSolution:
    type: application
    platform: iOS
    sources:
      - NextSolution
    settings:
      base:
        INFOPLIST_FILE: NextSolution/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
    scheme:
      testTargets: []
